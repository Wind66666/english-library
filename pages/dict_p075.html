iner is empty - can someone grab a new bag from the storage closet?", "糖罐空了 —— 有人能从储藏柜拿一袋新的吗？"], ["This espresso is really smooth. I could drink a few of these, but they’re too strong for the morning.", "这浓缩咖啡特别顺滑。我能喝好几杯，但早上喝太浓了。"], ["I brought some matcha powder to make matcha latte. Would you like to try a small cup?", "我带了抹茶粉来做抹茶拿铁。你想尝一小杯吗？"], ["The tea kettle is broken - it’s not heating up. Should we use the microwave to boil water?", "水壶坏了 —— 不加热了。咱们用微波炉烧水吗？"], ["This hazelnut coffee is sweet enough without adding sugar. Do you like flavored coffees?", "这榛果咖啡不加糖就够甜了。你喜欢风味咖啡吗？"], ["The pastries have a lot of frosting today - they’re like a little treat for the middle of the week.", "今天的糕点有很多糖霜 —— 就像周中给自己的小奖励。"], ["This rooibos tea is caffeine-free, so I can drink it before bed. Have you tried rooibos before?", "这路易波士茶不含咖啡因，所以我睡前能喝。你以前尝过路易波士茶吗？"], ["I always save my coffee break for 11 AM - it’s the perfect time to step away from my desk. Do you have a set coffee break time?", "我总把咖啡休息时间留到上午 11 点 —— 是离开办公桌的最佳时间。你有固定的咖啡休息时间吗？"], ["Going up? / Heading down?", "上楼吗？/ 下楼吗？"], ["I can get that for you.", "我来帮你按吧。"], ["Running between meetings?", "赶着去开会吗？"], ["Was traffic bad this morning?", "今早路上堵吗？"], ["Did you have a long commute today?", "今天上班路上花了多久？"], ["The weather is beautiful today./ Stay dry out there.", "今天天气真不错。/ 外面下雨，小心别淋湿了。"], ["This one seems to be stopping at every floor today.", "今天这趟电梯好像每层都要停。"], ["Looks like we’re both heading to the 12th floor.", "看来咱们都要去 12 楼啊。"], ["The elevator was out of service yesterday - were you stuck using the stairs?", "昨天电梯坏了 —— 你是不是只能爬楼梯了？"], ["Do you know if the elevator on the other side is working? This one’s a bit slow today.", "你知道另一边的电梯能用吗？这趟今天有点慢。"], ["I hate waiting for elevators in the morning rush - it takes forever.", "我讨厌早高峰等电梯 —— 要等好久。"], ["Did you catch the elevator right away, or did you have to wait?", "你是马上就赶上电梯了，还是等了一会儿？"], ["This elevator always feels a little cramped when it’s full.", "这电梯人满的时候总感觉有点挤。"], ["Heading out for lunch? The café downstairs has a new sandwich special today.", "去吃午饭吗？楼下咖啡馆今天有新的三明治特餐。"], ["The elevator buttons are a bit sticky - have you noticed that?", "电梯按钮有点黏 —— 你注意到了吗？"], ["I’m heading to the basement to grab something from the storage room. Do you need anything down there?", "我要去地下室储藏室拿点东西。你要在那层拿什么吗？"], ["The elevator music today is actually pretty nice - better than the usual stuff.", "今天的电梯音乐其实挺好听的 —— 比平时的好。"], ["Did you see the notice about the elevator maintenance next week? They’re closing one for two days.", "你看到下周电梯维护的通知了吗？他们要关一台，关两天。"], ["I always hold the door for people if I see them running for the elevator. Do you do that too?", "如果我看到有人赶电梯，总会帮他们按住门。你也会这样吗？"], ["This elevator goes all the way to the rooftop, right? I’ve never been up there.", "这电梯能一直到顶楼，是吧？我从没去过那儿。"], ["Looks like we’re the only ones in here this time - nice to avoid the crowd.", "看来这次就咱们俩在电梯里 —— 不用挤真好。"], ["I’m heading to the 5th floor for a meeting with the design team. Do you work on that floor?", "我要去 5 楼和设计部开会。你在那层工作吗？"], ["The elevator was making a weird noise last week - glad they fixed it.", "上周电梯发出奇怪的声音 —— 幸好他们修好了。"], ["Heading home already? Did your workday end early today?", "这就回家了？你今天下班早吗？"], ["I always press the “close door” button a little too much - I’m just in a hurry.", "我总忍不住多按几下 “关门” 键 —— 就是有点急。"], ["Do you know what floor the new conference room is on? I have a meeting there and can’t remember.", "你知道新会议室在几层吗？我要去那儿开会，记不清了。"], ["The elevator is so slow during 5 PM rush hour - everyone’s trying to leave at the same time.", "下午 5 点高峰的时候电梯好慢 —— 大家都想同时走。"], ["I saw you carrying a lot of documents earlier - need help holding the elevator door?", "我刚才看到你拿了好多文件 —— 要帮你按住电梯门吗？"], ["This elevator has a mirror on the wall - it’s good for checking your hair before a meeting.", "这电梯墙上有镜子 —— 开会前能整理下头发，挺好的。"], ["Heading to the cafeteria? I heard they have soup of the day today - tomato basil.", "去食堂吗？我听说今天有每日例汤 —— 番茄罗勒味的。"], ["The elevator number buttons are starting to fade - it’s hard to read the 8 sometimes.", "电梯数字键开始掉色了 —— 有时候 8 都看不清。"], ["I’m going to the 10th floor to drop off a package for the HR team. Do you know anyone there?", "我要去 10 楼给人事部送个包裹。你认识那儿的人吗？"], ["The elevator was stuck for a few minutes last month - it was a little scary. Have you ever been stuck in an elevator?", "上个月电梯卡了几分钟 —— 有点吓人。你被困过电梯吗？"], ["Heading to the gym in the building? I’ve been meaning to check it out but haven’t had time.", "去楼里的健身房吗？我一直想去看看，但没时间。"], ["The elevator has a weight limit sign, but I don’t think anyone ever checks it.", "电梯有载重限制标识，但我觉得没人真的会看。"], ["I’m heading to the 3rd floor to pick up some office supplies. Do you need any pens or paper?", "我要去 3 楼领办公用品。你需要笔或者纸吗？"], ["The elevator lights flickered a little when we got in - hope that’s not a problem.", "咱们进来的时候电梯灯闪了一下 —— 希望没什么问题。"], ["Heading to the client meeting on the 15th floor? I heard the client flew in from New York.", "去 15 楼开客户会议吗？我听说客户是从纽约飞过来的。"], ["This elevator is quieter than the one by the lobby - I prefer using this one.", "这台电梯比大厅旁边那台安静 —— 我更喜欢用这台。"], ["I forgot my phone on my desk - I’m heading back up to grab it. Do you need to stop at my floor too?", "我把手机忘在工位上了 —— 要回去拿。你也需要在我那层停吗？"], ["The elevator door takes a little while to close - don’t rush to get in.", "电梯门要过一会儿才关 —— 别着急进去。"], ["Heading to the IT department on the 7th floor? They fixed my computer yesterday, so they’re good.", "去 7 楼的 IT 部吗？他们昨天修好了我的电脑，技术还不错。"], ["The elevator has a little screen that shows the news - did you see the headline about the industry conference?", "电梯里有个小屏幕放新闻 —— 你看到关于行业会议的标题了吗？"], ["I’m going to the 18th floor to meet with the CEO’s assistant. Wish me luck!", "我要去 18 楼见 CEO 助理。祝我好运！"], ["The elevator was crowded this morning - I had to wait for the next one.", "今早电梯人好多 —— 我只好等下一趟。"], ["Heading out for a smoke break? There’s a designated area by the entrance.", "出去抽烟休息吗？入口旁边有指定区域。"], ["This elevator’s buttons are illuminated, which is nice when it’s dark in th  to the leadership team was confident and compelling. You really sold our ideas!", "你向领导团队展示工作的方式既自信又有说服力。成功推广了我们的想法！"], ["Thank you for being such a positive influence in the workplace. The team is a better place because of you!", "感谢你在工作场所带来的积极影响。因为有你，团队变得更棒了！"], ["Did you get the meeting agenda I sent over yesterday?", "你收到我昨天发的会议议程了吗？"], ["We should probably start the meeting a few minutes early to go over logistics.", "我们或许该提前几分钟开始会议，过一遍流程细节。"], ["Do you know if everyone on the invite list will be able to attend?", "你知道邀请名单上的人都能参加吗？"], ["I’ll bring a copy of the project report to the meeting - should I print extra for anyone?", "我会带一份项目报告去会议 —— 需要多打印几份给其他人吗？"], ["Let’s make sure we stick to the agenda so we don’t go over the scheduled time.", "咱们要确保按议程进行，别超过预定时间。"], ["Did you prepare the slides for the client update portion of the meeting?", "你准备好会议中客户进展更新部分的幻灯片了吗？"], ["I think we should allocate 15 minutes at the end of the meeting for Q&A.", "我觉得会议最后该留 15 分钟问答时间。"], ["Do you need me to take meeting minutes, or did someone else volunteer?", "需要我做会议记录吗，还是有人已经主动承担了？"], ["Let’s remind everyone to mute their microphones when they’re not speaking to avoid background noise.", "咱们要提醒大家不发言时静音，避免背景噪音。"], ["Did you share the meeting link with the remote team members?", "你把会议链接发给远程团队成员了吗？"], ["I have a conflict at 2 PM - can we start the meeting 15 minutes earlier?", "我下午 2 点有其他安排 —— 会议能提前 15 分钟开始吗？"], ["Let’s make sure we cover the budget approval item first since it’s time-sensitive.", "预算审批事项有时间限制，咱们要确保先讨论这个。"], ["Do you know if the meeting room has the equipment we need for the presentation?", "你知道会议室有我们展示需要的设备吗？"], ["I’ll follow up with everyone after the meeting to share the minutes and action items.", "会议后我会跟进所有人，分享会议记录和行动项。"], ["Let’s ask the new team member to give a quick intro at the start of the meeting.", "会议开始时，咱们让新团队成员做个简短自我介绍吧。"], ["Did you send a reminder about the meeting to the team this morning?", "你今早给团队发会议提醒了吗？"], ["I think we should invite the finance rep to join since we’ll be discussing budget changes.", "既然要讨论预算调整，我觉得该邀请财务代表参加。"], ["Let’s keep the discussion focused on the key issues - we can dive into details later if needed.", "咱们讨论要聚焦关键问题 —— 需要的话之后再深入细节。"], ["Do you need me to prepare a summary of last week’s meeting for anyone who couldn’t attend?", "需要我为没能参加的人准备上周会议的总结吗？"], ["The client might have additional questions, so let’s leave some buffer time at the end.", "客户可能有额外问题，所以最后留些缓冲时间吧。"], ["Let’s assign someone to lead each section of the agenda to keep things moving.", "咱们给议程的每个部分安排负责人，确保进展顺利。"], ["Did you check if the meeting room is available at the rescheduled time?", "你确认改后的时间会议室可用吗？"], ["I’ll bring a whiteboard marker in case we need to jot down notes during the discussion.", "我会带白板笔，万一讨论时需要记笔记。"], ["Let’s make sure we get a decision on the project timeline during today’s meeting.", "咱们要确保今天会议能确定项目时间安排。"], ["Do you think we need to extend the meeting time to cover all the agenda items?", "你觉得需要延长会议时间来覆盖所有议程项吗？"], ["I’ll share my screen during the presentation - can someone test the connection beforehand?", "展示时我会共享屏幕 —— 有人能提前测试下连接吗？"], ["Let’s ask each team lead to give a 2-minute update on their area first.", "咱们先让每个团队负责人用 2 分钟更新各自领域的情况。"], ["Did you collect the feedback from the team that was requested for the meeting?", "你收集好会议需要的团队反馈了吗？"], ["I think we should start with a quick recap of where we left off last time.", "我觉得该先快速回顾下上次会议的进展。"], ["Do you need me to bring any additional documents or data to support our discussion?", "需要我带额外的文件或数据来支持讨论吗？"], ["Let’s remind everyone to come prepared with their thoughts on the proposal.", "咱们提醒大家带着对提案的想法来参会。"], ["Did you coordinate with the IT team to fix the video conferencing issue before the meeting?", "你和 IT 部协调好在会议前解决视频会议的问题了吗？"], ["I’ll take note of any action items and assign owners during the meeting.", "会议中我会记录所有行动项，并安排负责人。"], ["Let’s keep the meeting concise - we can have a follow-up call if we need to discuss more.", "咱们保持会议简洁 —— 需要深入讨论的话可以后续再开会。"], ["Do you know if the client will be joining the meeting in person or remotely?", "你知道客户是现场参加会议还是远程参加吗？"], ["I’ll arrive early to set up the meeting room - can you help me with the projector?", "我会提前到布置会议室 —— 你能帮我弄下投影仪吗？"], ["Let’s prioritize the action items based on urgency during the meeting.", "会议中咱们根据紧急程度给行动项排序。"], ["Did you send the pre-reading materials to the team ahead of the meeting?", "你提前把会前阅读材料发给团队了吗？"], ["I think we should invite a representative from the design team since their work is relevant to the discussion.", "设计部的工作和讨论相关，我觉得该邀请他们派代表参加。"], ["Let’s make sure we address all the concerns raised in the previous meeting.", "咱们要确保解决上次会议提出的所有问题。"], ["Do you need me to follow up with anyone who hasn’t confirmed their attendance yet?", "需要我跟进还没确认参会的人吗？"], ["I’ll prepare a list of open questions to discuss during the meeting.", "我会准备一份待讨论的问题清单带去会议。"], ["Let’s keep the atmosphere collaborative - everyone’s input is valuable.", "咱们保持协作的氛围 —— 每个人的意见都很重要。"], ["Did you check if the meeting room has enough chairs for everyone attending?", "你确认会议室有足够的椅子给所有参会者吗？"], ["I think we should start the meeting with a quick win to set a positive tone.", "我觉得会议可以从一个小成就开始，营造积极氛围。"], ["Let’s assign a timekeeper to make sure we don’t spend too long on any single item.", "咱们安排一个计时员，确保每个事项不耗时过长。"], ["Do you need me to prepare a visual aid for the data we’ll be presenting?", "需要我为要展示的数据准备可视化材料吗？"], ["I’ll share the meeting minutes within 24 hours of the meeting ending.", "会议结束后 24 小时内我会分享会议记录。"], ["Let’s make sure we clarify the next steps for each action item before the meeting ends.", "会议结束前，咱们要明确每个行动项的后续步骤。"], ["Did you coordinate with the admin team to have water available in the meeting room?", "你和行政部协调好在会议室准备水了吗？"], ["I think we should ask for feedback from the junior team members to get fresh perspectives.", "我觉得该征求初级团队成员的反馈，获取新视角。"], ["Let’s keep the discussion constructive - focus on solutions rather than problems.", "咱们保持讨论有建设性 —— 聚焦解决方案而非问题本身。"], ["Do you need me to reschedule the meeting if more people have conflicts?", "如果更多人有时间冲突，需要我重新安排会议吗？"], ["I’ll prepare a summary of the key decisions made during the meeting to share afterward.", "会议后我会准备一份关键决策总结分享出去。"], ["Let’s remind everyone to come to the meeting with an open mind to new ideas.", "咱们提醒大家带着开放的心态来参会，接受新想法。"], ["Did you test the audio for the remote participants before the meeting starts?", "会议开始前，你测试过远程参会者的音频了吗？"], ["I think we should allocate more time to discuss the client feedback since it’s critical.", "客户反馈很关键，我觉得该多留些时间讨论。"], ["Let’s make sure we document any changes to the project plan during the meeting.", "会议中，咱们要记录项目计划的所有变更。"], ["Do you need me to bring a backup copy of the presentation in case of technical issues?", "万一有技术问题，需要我带一份展示的备份吗？"], ["I’ll follow up with the action item owners one week after the meeting to check progress.", "会议一周后，我会跟进行动项负责人，检查进展。"], ["Let’s start the meeting by reviewing the objectives to make sure everyone is aligned.", "会议开始先回顾目标，确保所有人达成共识。"], ["Did you confirm that the external consultant will be able to join the meeting on time?", "你确认外部顾问能准时参加会议吗？"], ["I think we should keep the Q&A session open to all attendees, even remote ones.", "我觉得问答环节应该对所有参会者开放，包括远程参会的人。"], ["Let’s make sure we don’t get sidetracked by unrelated topics - stick to the agenda.", "咱们要确保不被无关话题带偏 —— 紧跟议程。"], ["Do you need me to send a follow-up email with the meeting recap and action items?", "需要我发一封后续邮件，附上会议总结和行动项吗？"], ["I’m stuck on the data analysis for the project - would you be able to walk me through your approach?", "我在项目的数据分析部分卡住了 —— 你能给我讲讲你的思路吗？"], ["I’m not familiar with the new project management tool we’re using. Could you show me how to update the task status?", "我不太会用咱们新的项目管理工具。你能教我怎么更新任务状态吗？"], ["I have a tight deadline for this report and could use an extra pair of eyes. Would you mind reviewing it for errors?", "这份报告的截止日期很紧迫，我需要帮手。你能帮忙检查下有没有错误吗？"], ["I’m struggling to coordinate with the design team on the asset delivery. Do you have any tips for communicating with them effectively?", "我在协调设计部交付素材时遇到了困难。你有和他们高效沟通的技巧吗？"], ["I need to prepare a presentation for the client but don’t know where to start. Could you share an example of a presentation you’ve done before?", "我需要给客户准备一份展示，但不知道从何下手。你能分享一份你之前做过的展示案例吗？"], ["I’m not sure how to interpret the client’s feedback on the proposal. Would you help me break it down?", "我不确定该如何理解客户对提案的反馈。你能帮我拆解分析一下吗？"], ["I have a conflict with the team meeting time and can’t attend. Could you fill me in on the key points afterward?", "我和团队会议时间冲突，没法参加。之后你能给我同步下重点内容吗？"], ["I’m having trouble accessing the shared drive where the project files are stored. Could you help me troubleshoot the issue?", "我没法访问存储项目文件的共享盘。你能帮我排查下问题吗？"], ["I need to draft an email to the vendor about the delayed delivery. Would you mind giving me feedback on the tone and content?", "我需要给供应商写一封关于交货延迟的邮件。你能帮我看看语气和内容是否合适吗？"], ["I’m not clear on the company’s expense reporting policy. Could you explain how to submit receipts and get reimbursed?", "我不太清楚公司的费用报销政策。你能解释下怎么提交收据和申请报销吗？"], ["I’m working on the budget proposal but don’t have the latest departmental spending data. Would you be able to share that with me?", "我在做预算提案，但没有最新的部门支出数据。你能分享给我吗？"], ["I’m nervous about leading the client call tomorrow. Could you role-play with me to practice answering potential questions?", "我对明天主持客户会议有点紧张。你能和我模拟演练，应对可能的问题吗？"], ["I’m not sure which software to use for creating the project timeline. Do you have a recommendation based on your experience?", "我不确定用什么软件做项目时间轴。根据你的经验，有推荐吗？"], ["I need to reschedule my meeting with the stakeholder but don’t know their availability. Could you help me check their calendar?", "我需要重新安排和相关方的会议，但不知道他们的时间。你能帮我查下他们的日程吗？"], ["I’m struggling to balance multiple tasks and keep up with deadlines. Would you share your time-management system with me?", "我很难平衡多项任务，赶上截止日期。你能分享下你的时间管理方法吗？"], ["I’m confused about the technical requirements in the project brief. Could you clarify what’s expected for the final deliverable?", "我对项目简报里的技术要求有点困惑。你能明确下最终交付物需要满足什么条件吗？"], ["I need to collect feedback from the team on the new process. Would you help me send out the survey and compile the results?", "我需要收集团队对新流程的反馈。你能帮我发问卷并整理结果吗？"], ["I’m having trouble connecting to the video conferencing platform for the international meeting. Could you walk me through the setup steps?", "我没法连接国际会议的视频平台。你能教我怎么设置吗？"], ["I need to prepare a summary of the team’s progress for the manager. Would you review it to make sure I didn’t miss any key achievements?", "我需要给经理准备一份团队进展总结。你能帮忙检查下有没有遗漏关键成果吗？"], ["I’m not familiar with the client’s industry background, which is making it hard to draft the proposal. Could you share some insights?", "我不了解客户的行业背景，导致很难写提案。你能分享些相关知识吗？"], ["I need to delegate some of my tasks to focus on the priority project. Would you help me identify which tasks can be reassigned?", "我需要委派部分任务，以便专注于重点项目。你能帮我判断哪些任务可以重新分配吗？"], ["I’m having trouble understanding the financial terms in the contract. Could you explain them in simpler language?", "我不太理解合同里的财务术语。你能用更简单的语言解释下吗？"], ["I need to organize the team’s files to make them easier to find. Would you share your system for categorizing and naming documents?", "我需要整理团队文件，方便查找。你能分享下文件分类和命名的方法吗？"], ["I’m nervous about negotiating the contract terms with the vendor. Could you give me tips on how to approach the discussion?", "我对和供应商协商合同条款有点紧张。你能给我些沟通技巧吗？"], ["I’m not sure how to address the team member’s underperformance. Would you help me prepare for the conversation?", "我不确定该如何和表现不佳的团队成员沟通。你能帮我准备下这次谈话吗？"], ["I need to find data on the market trends for our industry. Could you recommend reliable sources I can use?", "我需要找行业市场趋势的数据。你能推荐可靠的信息来源吗？"], ["I’m having trouble formatting the report to match the company’s brand guidelines. Could you show me the template and standards?", "我没法把报告格式调整成符合公司品牌规范的样子。你能给我看看模板和标准吗？"], ["I need to coordinate the team’s availability for the offsite workshop. Would you help me send out the poll and finalize the date?", "我需要协调团队参加线下研讨会的时间。你能帮我发投票问卷并确定日期吗？"], ["I’m not clear on the steps to get the project approved by the steering committee. Could you outline the process for me?", "我不清楚让指导委员会批准项目需要哪些步骤。你能给我列个流程吗？"], ["I need to prepare a training session for the new interns. Would you share the materials you used when you trained the last group?", "我需要给新实习生准备培训课程。你能分享下上次培训用的材料吗？"], ["I’m having trouble troubleshooting the issue with the project software. Could you look at it with me to find a solution?", "我没法解决项目软件的故障。你能和我一起排查，找到解决方案吗？"], ["I need to draft a press release for the new product launch. Would you help me refine the messaging to align with our brand voice?", "我需要为新产品发布写一篇新闻稿。你能帮我调整内容，符合品牌调性吗？"], ["I’m not sure how to prioritize the tasks on my to-do list. Would you help me assess which ones are most urgent and important?", "我不确定该如何给待办事项排序。你能帮我判断哪些最紧急、最重要吗？"], ["I need to collect quotes from different suppliers for the project materials. Would you share the list of vendors you’ve worked with before?", "我需要向不同供应商询问项目物资的报价。你能分享下之前合作过的供应商名单吗？"], ["I’m struggling to explain the project’s value to the stakeholders. Could you help me craft a concise elevator pitch?", "我很难向相关方解释项目的价值。你能帮我写一段简洁的电梯演讲内容吗？"], ["I’m having trouble accessing the historical data from previous projects. Could you tell me where it’s stored and how to retrieve it?", "我没法获取之前项目的历史数据。你能告诉我数据存在哪里，怎么调取吗？"], ["I need to prepare a risk assessment for the project. Would you help me identify potential risks I might have missed?", "我需要为项目做风险评估。你能帮我找出可能遗漏的潜在风险吗？"], ["I’m not familiar with the company’s travel booking process. Could you walk me through how to reserve flights and hotels?", "我不太清楚公司的差旅预订流程。你能教我怎么订机票和酒店吗？"], ["I need to coordinate the handover of my tasks while I’m on vacation. Would you help me create a checklist for the colleague covering my work?", "我休假期间需要交接任务。你能帮我给接手的同事列个清单吗？"], ["I’m struggling to make sense of the client’s requirements document. Could you help me parse it and note the key deliverables?", "我没法理解客户的需求文档。你能帮我分析并标出关键交付物吗？"], ["I need to update the team’s contact list with new members. Would you help me verify the email addresses and job titles?", "我需要在团队通讯录里添加新成员。你能帮我核实邮箱地址和职位吗？"], ["I’m not sure how to handle the client’s request for additional features outside the project scope. Could you give me advice on how to respond?", "我不确定该如何处理客户提出的、超出项目范围的额外功能需求。你能给我些回应建议吗？"], ["I need to prepare a presentation on the project’s milestones for the leadership team. Would you help me design the slides to be clear and impactful?", "我需要给领导团队做项目里程碑的展示。你能帮我设计幻灯片，让内容清晰且有影响力吗？"], ["I’m having trouble finding the right resources to train the team on the new tool. Could you recommend online courses or tutorials?", "我找不到合适的资源来培训团队使用新工具。你能推荐在线课程或教程吗？"], ["I need to draft a memo to the team about the new company policy. Would you help me make sure the language is clear and easy to understand?", "我需要给团队写一份关于新公司政策的备忘录。你能帮我确保表述清晰易懂吗？"], ["I’m not clear on the process to get approval for overtime hours. Could you explain the steps and who to contact?", "我不清楚申请加班审批需要什么流程。你能解释下步骤和对接人吗？"], ["I need to organize the project’s kickoff meeting agenda. Would you help me make sure all key topics are included?", "我需要整理项目启动会的议程。你能帮我确保涵盖所有关键议题吗？"], ["I’m struggling to resolve a conflict between two team members over task responsibilities. Could you help me mediate the discussion?", "我没法解决两个团队成员在任务职责上的矛盾。你能帮我调解这次沟通吗？"], ["I need to find examples of successful marketing campaigns in our industry. Could you share case studies you’ve come across?", "我需要找行业内成功的营销活动案例。你能分享下你见过的案例研究吗？"], ["I’m not familiar with the client’s decision-making process. Could you explain who the key decision-makers are and how to engage them?", "我不了解客户的决策流程。你能解释下关键决策者是谁，该如何对接吗？"], ["I need to prepare a budget forecast for the next quarter. Would you help me review the numbers to make sure they’re accurate?", "我需要做下季度的预算预测。你能帮我检查数据，确保准确吗？"], ["I’m having trouble setting up the project’s tracking system to monitor progress. Could you help me configure the metrics and dashboards?", "我没法设置项目跟踪系统来监控进展。你能帮我配置指标和仪表盘吗？"], ["I need to draft an apology email to the client for the delayed delivery. Would you help me balance accountability with a solution-focused tone?", "我需要给客户写一封关于交货延迟的道歉邮件。你能帮我在承担责任的同时，保持以解决方案为导向的语气吗？"], ["I’m not sure how to approach the team about improving collaboration. Could you help me plan a discussion to address the issue?", "我不确定该如何和团队讨论改进协作的问题。你能帮我策划这次沟通吗？"], ["I need to collect feedback from the client on the latest deliverable. Would you help me design a short survey to get actionable insights?", "我需要收集客户对最新交付物的反馈。你能帮我设计一份简短问卷，获取可落地的建议吗？"], ["I’m having trouble understanding the legal terms in the vendor contract. Could you refer me to someone who can explain them, or help me yourself?", "我不太理解供应商合同里的法律条款。你能推荐懂的人给我，或者亲自帮我解释吗？"], ["I need to prepare a summary of the project’s lessons learned for future reference. Would you help me recall key challenges and solutions?", "我需要整理项目的经验教训，供未来参考。你能帮我回忆关键挑战和解决方案吗？"], ["I’m not clear on how to access the company’s internal training resources. Could you show me the portal and how to enroll in courses?", "我不清楚怎么获取公司的内部培训资源。你能教我怎么进入平台和报名课程吗？"], ["I need to coordinate with the IT team to get new equipment for the project. Would you help me draft the request and follow up on it?", "我需要和 IT 部协调，为项目申请新设备。你能帮我写申请并跟进吗？"], ["I’m struggling to present the project’s data in a way that’s easy to understand. Could you help me create visualizations like charts or graphs?", "我没法把项目数据展示得通俗易懂。你能帮我做图表之类的可视化内容吗？"], ["I need to draft a performance review for the team member I supervise. Would you share a template or tips on how to structure it?", "我需要给我管理的团队成员写绩效评估。你能分享模板或结构建议吗？"], ["I’m not sure how to handle the client’s complaint about the project’s quality. Could you help me develop a response plan?", "我不确定该如何处理客户对项目质量的投诉。你能帮我制定应对方案吗？"], ["I need to find a venue for the team’s annual retreat. Would you help me research options and compare costs?", "我需要为团队年度 Retreat 找场地。你能帮我调研选项并对比价格吗？"], ["I’m having trouble keeping the team motivated during a long and challenging project. Could you share strategies that have worked for you?", "在漫长且有挑战的项目中，我很难保持团队积极性。你能分享下你用过的有效策略吗？"], ["I need to prepare a business case for the new project proposal. Would you help me refine the financial projections and ROI analysis?", "我需要为新项目提案写商业论证。你能帮我完善财务预测和投资回报率分析吗？"], ["wanted to let you know I’ve decided to move on to a new opportunity, and my last day will be [date].", "想跟你说下，我决定接受新机会，最后工作日是 [日期]。"], ["I’m starting to put together my handover documents - could you let me know which of my tasks you’ll be taking over?", "我开始整理交接文档了 —— 你能告诉我你会接手我哪些任务吗？"], ["I’ve created a list of key contacts for the projects I’m working on, including clients and vendors. I’ll share it with you by the end of the day.", "我整理了正在负责的项目的关键联系人名单，包括客户和供应商。今天结束前发给你。"], ["Let’s schedule a few one-on-one sessions over the next two weeks to walk through the details of each project.", "接下来两周咱们安排几次一对一沟通，详细过一遍每个项目的情况吧。"], ["I’ve documented the step-by-step process for updating the client report - I’ll send you the guide and we can do a practice run together.", "我把更新客户报告的步骤流程写下来了 —— 会把指南发给你，咱们还可以一起实操一遍。"], ["Are there any specific projects or tasks you’re most concerned about taking over? Let’s prioritize those in our handover meetings.", "有没有哪项具体项目或任务是你接手时最担心的？咱们在交接会议里优先处理这些。"], ["I’ve noted any upcoming deadlines and milestones for each project in the handover doc, so you can stay on track.", "我在交接文档里标注了每个项目即将到来的截止日期和里程碑，方便你跟进进度。"], ["The client usually prefers updates via email every Friday - I’ll include their preferred format and key points to cover in the handover notes.", "客户通常希望每周五通过邮件更新进度 —— 我会在交接笔记里写清他们偏好的格式和需要涵盖的重点。"], ["Let’s set up a call with the vendor next week so I can introduce you and brief them on the transition.", "下周咱们和供应商安排一次通话吧，我把你介绍给他们，同时说明交接情况。"], ["I’ve organized all the project files in the shared drive and labeled them clearly - I’ll send you the folder link and explain the structure.", "我已经把所有项目文件整理到共享盘里，标注得很清楚 —— 会把文件夹链接发给你，并解释文件结构。"], ["There’s a pending issue with the client’s feedback on the latest design - I’ll walk you through the history of the discussion and our planned response.", "客户对最新设计的反馈还有个待解决问题 —— 我会跟你详细说下沟通历史和我们计划的回复方案。"], ["I’ve made a list of common challenges that come up with the [specific project] and how to address them - it should help you if similar issues arise.", "我整理了 [某具体项目] 中常出现的问题以及解决方法 —— 如果遇到类似情况，应该能帮到你。"], ["Let’s schedule a joint meeting with the team next week so I can formally hand over my responsibilities and answer any questions they have.", "下周咱们和团队开个交接会吧，我正式把工作交接给你，也解答大家的疑问。"], ["The budget tracker for the marketing project needs monthly updates - I’ll show you where to find the data and how to input the latest numbers.", "营销项目的预算跟踪表需要每月更新 —— 我会教你去哪里找数据，以及如何录入最新数值。"], ["I’ve noted any outstanding tasks that still need to be completed, along with their current status and next steps.", "我把所有未完成的任务都列出来了，包括当前进度和后续步骤。"], ["The client’s key decision-maker prefers concise updates without too much jargon - I’ll remind you of their communication style in the handover notes.", "客户的关键决策者喜欢简洁的更新，不要太多专业术语 —— 我会在交接笔记里提醒你他们的沟通偏好。"], ["I’ve saved all the meeting recordings and minutes for the projects I led - I’ll share the playlist with you so you can reference them later.", "我把负责项目的所有会议录音和纪要都存好了 —— 会把列表分享给你，方便后续查阅。"], ["Let’s do a “shadowing” session this week where you observe me handling a client call - it’ll help you get a feel for our working dynamic.", "这周咱们安排一次 “跟岗” 吧，你观察我处理一次客户通话 —— 能帮你熟悉我们和客户的沟通模式。"], ["There’s a contract renewal coming up with the vendor in three months - I’ll include all the relevant details (terms, pricing, contact person) in the handover doc.", "三个月后要和供应商续签合同 —— 我会在交接文档里写清所有相关细节（条款、价格、联系人）。"], ["I’ve written down the login credentials for all the tools and platforms I use for work - I’ll share them securely with you and show you how to access each one.", "我把工作用的所有工具和平台的登录信息都记下来了 —— 会安全地分享给你，并教你怎么登录。"], ["The team is used to weekly check-ins on Wednesdays - I’ll let you know what topics we usually cover and how to keep the meetings focused.", "团队习惯每周三开进度会 —— 我会告诉你我们通常讨论哪些话题，以及如何保持会议聚焦。"], ["I’ve had some informal conversations with the client about their future needs - I’ll summarize those insights in the handover notes to help you plan ahead.", "我和客户聊过一些他们未来的需求，都是非正式沟通 —— 会在交接笔记里总结这些信息，帮你提前规划。"], ["Let’s set up a follow-up call a week after my last day to answer any questions that come up once you’re handling the work on your own.", "我离职一周后，咱们安排一次跟进通话吧，解答你独立接手后遇到的问题。"], ["The data analysis for the Q3 report still needs final review - I’ll show you how to cross-verify the numbers and flag any discrepancies.", "第三季度报告的数据分析还需要最终审核 —— 我会教你怎么核对数据，以及如何标记异常值。"], ["I’ve noted which team members have expertise in specific areas related to my projects - you can reach out to them for support if needed.", "我标注了哪些团队成员在我负责的项目相关领域有专长 —— 需要的话，你可以找他们帮忙。"], ["The client likes to receive a draft of the monthly report by the 25th - I’ll include a template in the handover doc and highlight the key sections they care about.", "客户希望每月 25 日前收到月度报告初稿 —— 我会在交接文档里附上模板，并标出他们关注的重点部分。"], ["I’ve had to adjust the project timeline twice due to supply delays - I’ll explain the reasons behind those changes so you can anticipate similar issues.", "之前因为供货延迟，我调整过两次项目时间 —— 会跟你说明调整原因，帮你预判类似问题。"], ["Let’s go through the project risk register together - I’ll explain which risks are still active and what mitigation plans we have in place.", "咱们一起过一遍项目风险登记表吧 —— 我会说明哪些风险仍存在，以及我们制定的应对方案。"], ["The vendor sometimes takes longer to respond to emails - I’ll share their preferred communication channel (they usually reply faster to phone calls) in the handover notes.", "供应商有时回复邮件会比较慢 —— 我会在交接笔记里告诉你他们偏好的沟通方式（打电话通常回复更快）。"], ["I’ve saved all the feedback we’ve received from the client over the past six months - it’s organized by project, so you can reference it when making decisions.", "我把过去六个月客户给的所有反馈都存好了 —— 按项目分类整理的，你做决策时可以参考。"], ["The team uses a shared to-do list for the weekly tasks - I’ll show you how to update it and assign items to the right people.", "团队用共享待办清单管理每周任务 —— 我会教你怎么更新清单，以及如何给相应的人分配任务。"], ["I’ve identified a few process improvements that could make the client report faster to prepare - I’ll note those suggestions in the handover doc for you to consider.", "我发现有几个流程改进点能加快客户报告的准备速度 —— 会在交接文档里写下这些建议，供你参考。"], ["Let’s schedule a meeting with the finance team to go over the project budget - they can answer any questions you have about expenses or reimbursements.", "咱们和财务团队安排一次会议，过一遍项目预算吧 —— 他们能解答你关于开支或报销的疑问。"], ["The client’s legal team requires a review of all contracts before signing - I’ll share the contact info for their legal rep and the typical review timeline.", "客户的法务团队要求所有合同签署前先审核 —— 我会把他们法务代表的联系方式和常规审核周期告诉你。"], ["I’ve made a checklist of all the tasks that need to be completed before my last day - we can go through it together to make sure nothing is missed.", "我列了一份离职前需要完成的任务清单 —— 咱们可以一起过一遍，确保没有遗漏。"], ["The new software tool we started using last month has a few quirks - I’ll show you how to work around common issues to avoid delays.", "咱们上个月开始用的新软件有几个小毛病 —— 我会教你怎么解决常见问题，避免耽误工作。"], ["I’ve had some conversations with the intern about their role in the project - I’ll introduce you to them so you can align on their responsibilities moving forward.", "我和实习生聊过他们在项目里的角色 —— 会把你介绍给他们，方便你后续明确他们的职责。"], ["Let’s do a practice run of updating the client dashboard together - it’ll help you feel more comfortable with the process before you do it on your own.", "咱们一起实操一遍更新客户仪表盘吧 —— 你独立操作前，先熟悉流程会更有底气。"], ["The vendor offers a discount if we order materials in bulk - I’ll note the minimum order quantity and discount rate in the handover doc.", "如果我们批量订购材料，供应商会给折扣 —— 我会在交接文档里写下最低起订量和折扣率。"], ["I’ve saved all the design assets (logos, templates, brand guidelines) in a dedicated folder - I’ll send you the link and explain how to use them correctly.", "我把所有设计素材（logo、模板、品牌规范）都放在一个专门的文件夹里了 —— 会把链接发给你，并说明如何正确使用。"], ["The team has a weekly lunch check-in on Fridays - it’s a casual way to sync up, and I’ll let you know what we usually talk about.", "团队每周五会一起吃午饭聊天 —— 算是轻松同步进度的方式，我会告诉你我们通常聊些什么。"], ["I’ve had to follow up with the client three times about their feedback - I’ll share the best way to approach follow-ups without being pushy.", "我之前为了要客户反馈，跟进了三次 —— 会告诉你怎么跟进既有效，又不会显得咄咄逼人。"], ["Let’s review the project charter together - it’ll help you understand the original goals and scope, which is useful when making decisions.", "咱们一起过一遍项目章程吧 —— 能帮你理解最初的目标和范围，做决策时会用得上。"], ["The client’s marketing team is working on a campaign that aligns with our project - I’ll share their timeline so you can coordinate with them.", "客户的营销团队在做一个和咱们项目相关的活动 —— 我会把他们的时间安排告诉你，方便你对接。"], ["I’ve made a list of common questions that come up with the project, along with the standard answers - it’ll save you time when responding to the team or client.", "我列了一份项目中常被问到的问题，以及标准回答 —— 你回复团队或客户时能省点时间。"], ["The software license for the project tool expires in two months - I’ll include the renewal process and contact info in the handover doc.", "项目工具的软件许可证还有两个月到期 —— 我会在交接文档里写清续费流程和联系人。"], ["Let’s schedule a call with the previous owner of this project - they can share insights that I might not have covered in the handover.", "咱们和这个项目的前负责人安排一次通话吧 —— 他们能分享一些我交接时可能没提到的信息。"], ["The client’s feedback is usually detailed but sometimes vague - I’ll show you how to ask clarifying questions to get the info you need.", "客户的反馈通常很详细，但有时也会模糊 —— 我会教你怎么问澄清问题，获取需要的信息。"], ["I’ve saved all the invoices and receipts for the project expenses - they’re organized by month, so you can easily find what you need for reporting.", "我把项目开支的所有发票和收据都存好了 —— 按月份整理的，你做报告时能轻松找到需要的凭证。"], ["The team uses a specific format for meeting minutes - I’ll share a template and show you how to capture key decisions and action items.", "团队的会议纪要有固定格式 —— 我会分享模板，并教你怎么记录关键决策和行动项。"], ["I’ve had to escalate a few issues to the manager in the past - I’ll explain when it’s necessary to escalate and how to frame the conversation.", "过去我有几次需要向经理上报问题 —— 会跟你说明什么时候需要上报，以及怎么组织沟通内容。"], ["The vendor’s delivery schedule is affected by holidays - I’ll note the upcoming holidays in the handover doc so you can plan orders accordingly.", "供应商的交货时间会受节假日影响 —— 我会在交接文档里标注即将到来的节假日，方便你安排订单。"], ["Let’s do a final walkthrough of all the projects on my last week - we can confirm that all handover tasks are complete and address any last-minute questions.", "我离职前一周，咱们把所有项目做一次最终梳理吧 —— 确认交接任务都完成了，也解答所有遗留问题。"], ["The client’s team has a new member who joined last month - I’ll introduce you to them so you can build a working relationship early on.", "客户团队上个月来了个新成员 —— 我会把你介绍给他们，方便你早点建立工作联系。"], ["I’ve made a list of resources (articles, tutorials, industry reports) that helped me with the project - you can use them to learn more about the topic.", "我列了一份对项目有帮助的资源清单（文章、教程、行业报告）—— 你可以用这些深入了解相关领域。"], ["The project’s success metrics are tracked in a specific dashboard - I’ll show you how to interpret the data and report on progress to the manager.", "项目的成功指标是在一个特定的仪表盘里跟踪的 —— 我会教你怎么解读数据，以及如何向经理汇报进度。"], ["I’ve had to adjust the project scope once due to client requests - I’ll explain the change management process we followed so you can handle similar requests.", "之前因为客户需求，我调整过一次项目范围 —— 会跟你说明我们当时走的变更管理流程，帮你处理类似需求。"], ["The team’s communication tool has specific channels for each project - I’ll show you how to navigate them and post updates in the right place.", "团队的沟通工具里，每个项目都有专门的频道 —— 我会教你怎么操作，以及在正确的频道发布更新。"], ["I’ve saved all the client’s brand assets (colors, fonts, imagery guidelines) - I’ll share them with you to ensure our deliverables align with their brand.", "我把客户所有的品牌资产（颜色、字体、图片规范）都存好了 —— 会分享给你，确保我们的交付物符合他们的品牌要求。"], ["The vendor sometimes provides samples before bulk orders - I’ll explain the sample request process and how to evaluate the quality.", "供应商有时会在批量订购前提供样品 —— 我会说明申请样品的流程，以及如何评估质量。"], ["I’ve had some feedback from the team on how to improve the project workflow - I’ll share those suggestions in the handover doc for you to consider implementing.", "我从团队那里收集了一些改进项目流程的反馈 —— 会在交接文档里分享这些建议，供你考虑实施。"], ["The client’s quarterly review meeting is in a month - I’ll include the agenda from last quarter and key points to prepare for this time.", "一个月后是客户的季度评审会 —— 我会附上上个季度的议程，以及这次需要准备的重点内容。"], ["Let’s share the handover plan with the manager this week - they can provide feedback and ensure we’re covering all necessary areas.", "这周咱们把交接计划发给经理吧 —— 他们能提些反馈，确保我们没遗漏重要内容。"], ["The project’s documentation needs to be updated monthly - I’ll show you where to find the latest version and how to make edits without breaking the format.", "项目文档需要每月更新 —— 我会教你去哪里找最新版本，以及如何修改而不破坏格式。"], ["I want to thank you for taking over my projects - I’ll do my best to make the handover as smooth as possible, so you feel confident moving forward.", "感谢你接手我的项目 —— 我会尽全力做好交接，让你后续开展工作时更有信心。"], ["I’ve noticed you’ve been handling client communications really well—have you thought about sharing your approach with the team during our next meeting?", "我发现你处理客户沟通特别出色 —— 有没有想过下次会议时，把你的方法分享给团队？"], ["When we work on group projects, I’ve found that setting clear task deadlines upfront helps keep things on track. Would you be open to trying that for our next collaboration?", "咱们做团队项目时，我发现提前明确任务截止日期能让进展更顺利。下次合作时，你愿意试试这个方法吗？"], ["Your presentation slides are always so clear and visually engaging—do you have a favorite tool or design tip you could share with the rest of us?", "你的演示幻灯片总是清晰又有视觉吸引力 —— 有没有常用的工具或设计技巧可以分享给大家？"], ["I’ve noticed we sometimes miss small details in the final review of reports. What if we create a quick checklist to go through before submitting them?", "我发现咱们有时在报告最终审核时会遗漏小细节。要不我们做个快速核对清单，提交前过一遍？"], ["You’re really good at breaking down complex problems into simple steps—would you be willing to walk the team through that process for the current project challenge?", "你特别擅长把复杂问题拆成简单步骤 —— 能不能针对当前项目的难题，给团队演示下这个思路？"], ["I’ve found that scheduling short check-ins mid-week helps us address issues early. Do you think that’s something we could incorporate into our team routine?", "我发现每周中安排简短的进度沟通，能帮我们尽早解决问题。你觉得咱们团队可以把这个纳入常规流程吗？"], ["Your ability to stay calm and focused during tight deadlines is impressive—have you ever thought about sharing time-management tips with the junior team members?", "你在截止日期紧迫时还能保持冷静专注，太厉害了 —— 有没有想过给初级团队成员分享些时间管理技巧？"], ["I’ve noticed we sometimes have miscommunication about task priorities. What if we start each week by aligning on the top 3 goals for the team?", "我发现咱们有时对任务优先级会有沟通偏差。要不每周一开始，先统一团队的 3 个核心目标？"], ["You always ask really insightful questions in meetings that push the discussion forward—do you have a strategy for preparing those questions beforehand?", "你在会议上总能提出有深度的问题，推动讨论进展 —— 有没有提前准备这些问题的小技巧？"], ["I’ve found that using a shared document to track action items from meetings helps avoid confusion. Would you be open to trying that for our next team call?", "我发现用共享文档记录会议行动项，能避免混乱。下次团队会议，你愿意试试这个方法吗？"], ["You’re great at building rapport with new clients quickly—do you have a go-to approach for making them feel comfortable in the first few meetings?", "你很擅长快速和新客户建立信任 —— 在最初几次会议里，有没有让客户放松下来的常用方法？"], ["I’ve noticed we sometimes spend too much time on low-priority tasks. What if we do a quick priority check at the start of each day to focus on what matters most?", "我发现咱们有时在低优先级任务上花太多时间。要不每天开始前快速确认优先级，聚焦最重要的事？"], ["Your feedback on project drafts is always specific and helpful—could you share how you structure your comments to make them actionable?", "你对项目草稿的反馈总是具体又有用 —— 能不能分享下，怎么组织评论才能让建议更易落地？"], ["I’ve found that sharing updates on project progress with the wider team helps keep everyone aligned. Do you think we could send a short weekly summary email?", "我发现给整个团队同步项目进展，能让大家保持共识。你觉得咱们可以发简短的每周总结邮件吗？"], ["You’re really skilled at negotiating with vendors to get good terms—would you be willing to share some of your key strategies with the team?", "你很会和供应商谈判，争取有利条件 —— 能不能给团队分享些核心技巧？"], ["I’ve noticed we sometimes struggle to follow up on pending tasks. What if we assign a “follow-up owner” for each action item in meetings?", "我发现咱们有时难以跟进待办任务。要不会议上给每个行动项指定一个 “跟进负责人”？"], ["Your reports always include really useful data visualizations—do you have a favorite resource or tutorial for creating clear charts?", "你的报告里总有很实用的数据可视化内容 —— 有没有常用的资源或教程，能帮大家做出清晰的图表？"], ["I’ve found that giving team members a heads-up about upcoming changes helps with transition. Do you think we could share project updates a few days in advance when possible?", "我发现提前告知团队成员即将到来的变动，能让过渡更顺利。如果可以，咱们能不能提前几天同步项目更新？"], ["You’re great at keeping meetings focused and on time—do you have a trick for gently steering the discussion back when it goes off-topic?", "你很擅长让会议聚焦且按时结束 —— 当讨论跑偏时，有没有委婉拉回主题的小方法？"], ["I’ve noticed we sometimes repeat work because of unclear documentation. What if we create a shared folder with standard templates for common tasks?", "我发现咱们有时因为文档不清晰而重复工作。要不我们建个共享文件夹，放常用任务的标准模板？"], ["Your ability to anticipate client needs before they’re mentioned is amazing—do you have a process for researching or preparing for client calls?", "你总能在客户提出前就预判他们的需求，太厉害了 —— 准备客户会议时，有没有专门的调研或准备流程？"], ["I’ve found that celebrating small wins as a team boosts morale. Do you think we could take 5 minutes at the end of each week to acknowledge progress?", "我发现团队一起庆祝小成就，能提升士气。要不每周结束时花 5 分钟，认可大家的进展？"], ["You’re really good at explaining technical concepts to non-technical stakeholders—do you have a tip for simplifying complex information without losing key details?", "你很会给非技术背景的相关方解释技术概念 —— 有没有技巧能在不丢失关键信息的前提下，简化复杂内容？"], ["I’ve noticed we sometimes have delays because of waiting on feedback. What if we set clear timelines for when people need to respond to requests?", "我发现咱们有时因为等反馈而延误进度。要不明确规定大家回复请求的时间期限？"], ["Your approach to delegating tasks based on team members’ strengths is really effective—would you be willing to share how you assess those strengths?", "你根据团队成员的优势分配任务，效果很好 —— 能不能分享下，怎么判断大家的优势领域？"], ["I’ve found that using a project management tool to track dependencies helps avoid bottlenecks. Do you think that’s something we could implement for the current project?", "我发现用项目管理工具跟踪任务依赖关系，能避免瓶颈。你觉得当前项目可以试试这个方法吗？"], ["You always bring fresh ideas to brainstorming sessions—do you have a habit of collecting inspiration outside of work that feeds into those ideas?", "你在头脑风暴时总能提出新想法 —— 有没有在工作外积累灵感，助力这些创意的习惯？"], ["I’ve noticed we sometimes forget to update the project timeline when changes happen. What if we schedule a quick 10-minute update to the timeline every Friday?", "我发现有变动时，咱们有时会忘记更新项目时间轴。要不每周五安排 10 分钟，专门更新时间轴？"], ["You’re great at resolving conflicts between team members in a constructive way—do you have a go-to approach for facilitating those conversations?", "你很擅长用建设性的方式解决团队成员间的矛盾 —— 有没有主持这类沟通的常用方法？"], ["I’ve found that sharing lessons learned from past projects helps us avoid mistakes. Do you think we could do a short “retrospective” after each project wraps up?", "我发现分享过去项目的经验教训，能帮我们避免犯错。你觉得每个项目结束后，咱们可以做个简短的 “复盘会” 吗？"], ["Your client follow-up emails are always timely and personalized—do you have a system for tracking when to reach out to each client?", "你的客户跟进邮件总是及时又有针对性 —— 有没有跟踪跟进时间的方法，确保对每个客户的沟通节奏？"], ["I’ve noticed we sometimes have overlapping work because of unclear role boundaries. What if we create a simple role checklist for each project phase?", "我发现咱们有时因为角色边界不清晰而重复工作。要不针对每个项目阶段，做个简单的角色职责清单？"], ["You’re really skilled at creating engaging training materials for new tools—do you have a favorite format or resource that works well for you?", "你很会为新工具制作有吸引力的培训材料 —— 有没有常用的格式或资源，效果特别好的？"], ["I’ve found that setting “no-meeting blocks” during the week helps with focused work. Do you think that’s something we could propose to the team?", "我发现每周预留 “无会议时段”，能让人专注工作。你觉得咱们可以向团队提议这个做法吗？"], ["You always seem to have a backup plan for unexpected issues—do you have a process for identifying potential risks and preparing contingencies?", "你好像总能为突发问题准备备用方案 —— 有没有识别潜在风险、制定应急预案的流程？"], ["I’ve noticed we sometimes miss opportunities to involve other teams early on. What if we include a “stakeholder check” in our project kickoff process?", "我发现咱们有时会错过早期联动其他团队的机会。要不在项目启动流程里，加一个 “相关方确认” 步骤？"], ["Your ability to summarize long discussions into clear action items is impressive—do you have a trick for capturing the key points without missing details?", "你能把冗长的讨论总结成清晰的行动项，太厉害了 —— 有没有既能抓住重点又不遗漏细节的小技巧？"], ["I’ve found that using simple language in project briefs reduces confusion. Do you think we could avoid jargon when writing them for the team?", "我发现项目简报用简单语言写，能减少误解。你觉得给团队写简报时，咱们可以避免专业术语吗？"], ["You’re great at encouraging quiet team members to share their ideas—do you have a gentle way to invite their input during meetings?", "你很擅长鼓励内向的团队成员分享想法 —— 会议上有没有委婉邀请他们发言的方式？"], ["I’ve noticed we sometimes struggle to keep up with industry trends that affect our work. What if we share one quick trend update in our weekly meeting?", "我发现咱们有时会跟不上影响工作的行业趋势。要不每周会议上，分享一个简短的趋势动态？"], ["Your approach to balancing quality and speed on tasks is really effective—would you be willing to share how you prioritize those two factors?", "你在任务中平衡质量和速度的方法很有效 —— 能不能分享下，怎么在这两个因素间做取舍？"], ["I’ve found that testing a small part of a project first (a “pilot”) helps catch issues early. Do you think that’s something we could try for the new initiative?", "我发现先测试项目的一小部分（“试点”），能尽早发现问题。你觉得新项目可以试试这个方法吗？"], ["You always ask for feedback on your work in a way that feels constructive—do you have a favorite question or approach to get useful input?", "你征求工作反馈的方式，总能让人觉得有建设性 —— 有没有常用的问题或方法，能获取有价值的意见？"], ["I’ve noticed we sometimes have trouble accessing past project files. What if we create a standard naming convention for all documents?", "我发现咱们有时难以找到过去的项目文件。要不给所有文档制定统一的命名规则？"], ["You’re really good at aligning the team around a common goal—do you have a process for making sure everyone understands why the goal matters?", "你很擅长让团队围绕共同目标协作 —— 有没有方法确保大家都明白这个目标的意义？"], ["I’ve found that sending a quick “thank you” note to team members for their help boosts engagement. Do you think that’s something we could make a habit of?", "我发现给帮过忙的团队成员发简短的 “感谢语”，能提升参与感。你觉得咱们可以把这个变成习惯吗？"], ["Your ability to adapt to changes in project scope is impressive—do you have a strategy for adjusting your work without getting overwhelmed?", "你适应项目范围变更的能力很强 —— 有没有方法能在调整工作时，不让自己压力太大？"], ["I’ve noticed we sometimes have misalignment on client expectations. What if we create a shared “client expectation doc” at the start of each project?", "我发现咱们有时对客户期望会有偏差。要不每个项目开始时，做个共享的 “客户期望文档”？"], ["You’re great at finding creative solutions when resources are limited—do you have a go-to way to brainstorm alternatives?", "你很擅长在资源有限时找到创意解决方案 —— 有没有常用的头脑风暴方法，寻找替代方案？"], ["I’ve found that scheduling “focus time” for deep work helps with complex tasks. Do you think we could encourage the team to block off that time in their calendars?", "我发现为深度工作预留 “专注时间”，对处理复杂任务很有帮助。你觉得咱们可以鼓励团队在日程里留出这个时段吗？"], ["Your feedback on team members’ growth is always supportive and actionable—do you have a framework for giving development-focused input?", "你对团队成员成长的反馈，总是支持性强又能落地 —— 有没有针对个人发展提建议的框架？"], ["I’ve noticed we sometimes miss deadlines because of last-minute changes. What if we build a small buffer into the timeline for unexpected adjustments?", "我发现咱们有时因为临时变更而错过截止日期。要不在时间轴里预留一点缓冲时间，应对突发调整？"], ["You’re really good at explaining the “why” behind project decisions to the team—do you think that’s something we could do more of to build buy-in?", "你很擅长给团队解释项目决策背后的 “原因”—— 你觉得咱们可以多做这件事，让大家更认同决策吗？"], ["I’ve found that using visual aids (like flowcharts) to explain processes helps with understanding. Do you think we could incorporate more of those in our team docs?", "我发现用流程图这类视觉工具解释流程，能帮助理解。你觉得咱们可以在团队文档里多加点这类内容吗？"], ["You always seem to know when to ask for help instead of struggling alone—do you have a way to recognize when you need support?", "你好像总能判断什么时候该求助，而不是独自硬扛 —— 有没有方法识别自己需要帮助的时刻？"], ["I’ve noticed we sometimes have redundant steps in our workflow. What if we map out the process together to see where we can streamline?", "我发现咱们的工作流程里有时有重复步骤。要不一起梳理下流程，看看哪里可以简化？"], ["Your ability to stay organized with multiple projects at once is amazing—do you have a favorite tool or system for managing your workload?", "你同时处理多个项目还能保持条理，太厉害了 —— 有没有常用的工具或方法管理工作量？"], ["I’ve found that sharing client feedback with the entire team (not just the lead) helps everyone improve. Do you think we could include that in our feedback loop?", "我发现把客户反馈分享给整个团队（不只是负责人），能帮大家一起进步。你觉得咱们可以把这个纳入反馈流程吗？"], ["You’re great at keeping the team motivated during challenging projects—do you have a go-to way to lift morale when things get tough?", "你很擅长在有挑战的项目中保持团队积极性 —— 遇到困难时，有没有提振士气的常用方法？"], ["I’ve noticed we sometimes have trouble remembering key details from past meetings. What if we record short audio clips of action items to reference later?", "我发现咱们有时会忘记过去会议的关键细节。要不把行动项录成简短音频，方便后续参考？"], ["Your approach to setting realistic goals for the team is really helpful—do you have a method for breaking big goals into manageable steps?", "你给团队定的目标很贴合实际，很有帮助 —— 有没有把大目标拆成可执行步骤的方法？"], ["I’ve found that collaborating with other teams early on reduces rework later. Do you think we could involve them in the project planning phase?", "我发现早期和其他团队协作，能减少后续返工。你觉得咱们可以在项目规划阶段就邀请他们参与吗？"], ["You always ask follow-up questions that dig deeper into issues—do you have a strategy for making sure you fully understand the root cause?", "你总能提出追问，深入挖掘问题 —— 有没有方法确保自己理解问题的根本原因？"], ["I’ve noticed we sometimes use different versions of the same document. What if we use a single shared version with version control to avoid confusion?", "我发现咱们有时用同一个文档的不同版本。要不只用一个共享版本，加上版本控制，避免混乱？"], ["Your ability to celebrate team members’ individual strengths helps build a positive culture—do you think that’s something we can all prioritize more?", "你善于认可团队成员的个人优势，有助于营造积极氛围 —— 你觉得咱们都可以更重视这件事吗？"], ["Thank you for staying late to help me finish the report—your support made it possible to meet the deadline.", "感谢你加班帮我完成报告，有你的支持才能赶上截止日期。"], ["I really appreciate you covering my tasks while I was on sick leave. I’ll make sure to catch up quickly this week.", "很感谢我生病期间你帮忙接手工作，这周我会尽快赶上进度。"], ["Thank you for sharing your expertise on the client’s industry—your insights helped me finalize the proposal.", "感谢你分享对客户行业的专业认知，你的见解帮我完善了提案。"], ["I want to thank you for speaking up for the team in the management meeting—your feedback really made a difference.", "想谢谢你在管理层会议上为团队发声，你的反馈起到了关键作用。"], ["Thank you for taking the time to review my presentation and give such detailed feedback. It’s much clearer now.", "感谢你花时间审核我的演示并给出这么详细的反馈，现在内容清晰多了。"], ["I appreciate you coordinating with the design team to adjust the assets—their revised version fits the client’s needs perfectly.", "感谢你协调设计部调整素材，修改后的版本完全符合客户需求。"], ["Thank you for reminding me about the budget meeting this morning—I almost forgot and would have missed it.", "感谢你提醒我今早的预算会议，我差点就忘了，差点错过重要内容。"], ["I really value your help with troubleshooting the software issue—it was holding up the whole project, and you fixed it quickly.", "很感谢你帮忙解决软件故障，它之前一直阻碍项目进展，还好你很快修好了。"], ["Thank you for offering to lead the client call while I was stuck in traffic. I owe you a coffee!", "感谢你在我堵车时主动主持客户会议，我请你喝咖啡！"], ["I appreciate you gathering all the data I needed for the analysis—it saved me so much time this week.", "感谢你帮我收集分析所需的所有数据，这周帮我省了超多时间。"], ["Thank you for being patient with me while I learned the new project management tool—your guidance made it easier to pick up.", "感谢你在我学习新项目管理工具时耐心指导，有你的帮助我上手快多了。"], ["I want to thank you for advocating for more resources for our team—having the extra support will make the project smoother.", "想谢谢你为团队争取更多资源，有了额外支持，项目推进都会更顺利。"], ["Thank you for reviewing the contract and pointing out the legal risks I missed. It could have caused big problems later.", "感谢你审核合同并指出我遗漏的法律风险，不然之后可能会出大问题。"], ["I appreciate you sharing the meeting minutes with me after I had to leave early—they helped me stay updated on the decisions.", "感谢我提前离开后你分享会议纪要，让我能及时了解会议决策。"], ["Thank you for helping me practice the client presentation—your feedback on my delivery made me feel more confident.", "感谢你帮我演练客户演示，你对我表达的反馈让我更有信心了。"], ["I’m sorry I missed the team check-in this morning—I overslept and will make sure to set multiple alarms tomorrow.", "很抱歉今早没参加团队进度会，我睡过头了，明天一定会设多个闹钟。"], ["I apologize for the delay in sending the project update—there was an unexpected issue with the data, and I should have notified you sooner.", "很抱歉延迟发送项目更新，数据出现了意外问题，我本该早点通知你的。"], ["I’m sorry I made a mistake in the budget calculations—I’ve double-checked the numbers now and attached the corrected version.", "很抱歉预算计算出错了，我现在已经重新核对数据，并附上了修正版。"], ["I apologize for misunderstanding the client’s requirements and drafting the wrong proposal. I’ll revise it based on their feedback right away.", "很抱歉误解了客户需求，写错了提案，我会根据他们的反馈立即修改。"], ["I’m sorry I didn’t coordinate with you before adjusting the timeline—I should have checked your availability first.", "很抱歉调整时间安排前没和你协调，我本该先确认你的时间是否方便。"], ["I apologize for the confusion caused by the unclear email—I’ll resend it with a more detailed explanation of the next steps.", "很抱歉邮件表述不清造成误解，我会重新发送，并详细说明后续步骤。"], ["I’m sorry I forgot to share the client’s feedback with you—it’s crucial for your part of the project, and I’ve forwarded it now.", "很抱歉忘了把客户反馈分享给你，这对你负责的项目部分很重要，我现在已经转发给你了。"], ["I apologize for being late to the client meeting—traffic was worse than expected, and I should have left earlier.", "很抱歉客户会议迟到了，交通比预想的更堵，我本该早点出发的。"], ["I’m sorry I didn’t proofread the report before sending it—there are a few typos, and I’ll send a corrected copy immediately.", "很抱歉发送报告前没校对，里面有几处错别字，我马上发送修正版。"], ["I apologize for taking up so much of your time with my questions—thank you for being willing to explain things thoroughly.", "很抱歉我的问题占用了你这么多时间，感谢你愿意详细讲解。"], ["Thank you for stepping in to handle the vendor negotiation when I had to take an emergency call—you got us a much better deal than I expected.", "感谢我接紧急电话时你主动接手与供应商的谈判，你争取到的条件比我预期的好太多了。"], ["I appreciate you flagging the issue with the project timeline early—it gave us time to adjust and avoid a bigger delay.", "感谢你提前指出项目时间安排的问题，让我们有时间调整，避免了更大的延误。"], ["Thank you for creating a backup of the project files after the shared drive crashed—we would have lost weeks of work without it.", "感谢共享盘崩溃后你备份了项目文件，不然我们几周的工作就白费了。"], ["I want to thank you for mentoring the new intern—they’ve made great progress, and your guidance has been a huge help.", "想谢谢你指导新实习生，他们进步很大，你的指导帮了大忙。"], ["Thank you for being flexible with the meeting time to accommodate the client’s schedule—it showed them we’re willing to collaborate.", "感谢你灵活调整会议时间以配合客户日程，这让客户看到我们的合作诚意。"], ["I apologize for not updating you on the client’s request for changes—I thought you already knew, but that was my mistake.", "很抱歉没告诉你客户的变更需求，我以为你已经知道了，是我疏忽了。"], ["I’m sorry I contributed to the delay in the task—I underestimated how long it would take, and I’ll plan better next time.", "很抱歉我导致任务延误，我低估了所需时间，下次我会做好更充分的规划。"], ["I apologize for the mix-up with the meeting rooms—I booked the wrong one, but I’ve reserved the correct one for tomorrow.", "很抱歉订错了会议室，我已经为明天重新预订了正确的会议室。"], ["I’m sorry I didn’t ask for your input on the project plan—your perspective would have helped make it more comprehensive.", "很抱歉制定项目计划时没征求你的意见，你的视角本可以让计划更全面。"], ["I apologize for the late response to your email—I missed it in my inbox, and I’ll make sure to check more frequently.", "很抱歉晚回复你的邮件，我在收件箱里漏掉了，以后会更频繁查看邮件。"], ["Thank you for helping me organize the project kickoff meeting—all the attendees said it was well-prepared and clear.", "感谢你帮我组织项目启动会，所有参会者都反馈会议准备充分、流程清晰。"], ["I appreciate you sharing your tips for managing tight deadlines—they’ve helped me stay on track with my tasks this week.", "感谢你分享应对紧迫截止日期的技巧，这周帮我顺利推进了任务。"], ["Thank you for defending the team’s work when the manager had concerns—your explanation helped them understand our progress.", "感谢经理有疑虑时你为团队的工作辩护，你的解释让他们理解了我们的进展。"], ["I want to thank you for bringing snacks for the team during the busy week—it was a small gesture but made everyone feel cared for.", "想谢谢你在忙碌的一周里给团队带零食，虽然是小事，但让大家都感受到了关心。"], ["Thank you for taking the time to explain the company’s expense policy to me—I was confused before, but now it makes sense.", "感谢你花时间给我解释公司的费用报销政策，我之前一直搞不清楚，现在终于明白了。"], ["I’m sorry I made a mistake in the client’s contact information—it led to a delayed response, but I’ve corrected it and apologized to them.", "很抱歉填错了客户的联系方式，导致回复延迟，我已经修正并向客户道歉了。"], ["I apologize for interrupting you during the meeting—I should have waited until you finished speaking before sharing my thought.", "很抱歉会议中打断你，我本该等你说完再分享我的想法。"], ["I’m sorry I didn’t follow up on the action item we assigned last week—I’ll make sure to check in with the responsible team today.", "很抱歉上周分配的行动项我没跟进，今天我会和负责团队确认进度。"], ["I apologize for the unclear instructions I gave you—it made your work harder, and I’ll be more specific next time.", "很抱歉我给你的指示不明确，给你的工作增加了难度，下次我会说得更具体。"], ["I’m sorry I forgot to include you in the client email thread—you need to be updated on those conversations, and I’ve added you now.", "很抱歉客户邮件线程里漏加了你，你需要同步这些沟通内容，我现在已经把你加上了。"], ["Thank you for helping me carry the project materials to the meeting room—they were heavier than I expected, and your help saved me a trip.", "感谢你帮我把项目材料搬到会议室，比我预想的重多了，有你的帮助我不用多跑一趟了。"], ["I appreciate you reminding me to back up my work before the system update—I would have lost my draft otherwise.", "感谢你提醒我在系统更新前备份工作，不然我的草稿就丢了。"], ["Thank you for sharing your experience with handling difficult clients—it gave me a better idea of how to approach our upcoming call.", "感谢你分享处理难缠客户的经验，让我更清楚该如何应对即将到来的沟通。"], ["I want to thank you for staying behind to clean up the meeting room after the workshop—everyone was in a hurry, and I appreciate you taking the time.", "想谢谢你工作坊结束后留下来清理会议室，大家都很匆忙，很感谢你花时间整理。"], ["Thank you for reviewing the intern’s work and giving them constructive feedback—it will help them improve faster.", "感谢你审核实习生的工作并给出建设性反馈，这会帮他们更快进步。"], ["I apologize for the mistake in the project milestone date—I’ve updated the timeline and notified all team members of the correction.", "很抱歉项目里程碑日期写错了，我已经更新了时间轴，并通知所有团队成员这一修正。"], ["I’m sorry I didn’t inform you about the change in the client’s meeting time—I’ll make sure to loop you in as soon as I get updates next time.", "很抱歉没告诉你客户会议时间变更，下次一有更新我肯定第一时间同步你。"], ["I apologize for relying too much on your help this week—I’ll work on improving my efficiency so I don’t burden you as much.", "很抱歉这周太依赖你的帮助了，我会努力提升效率，不再给你添这么多负担。"], ["I’m sorry I made a comment that frustrated you in the team discussion—I didn’t mean to be unhelpful, and I’ll be more mindful of my words next time.", "很抱歉团队讨论中我说的话让你不舒服了，我不是故意添乱的，下次会更注意言辞。"], ["I apologize for not completing my part of the task on time—I encountered unexpected issues, but I should have communicated the delay earlier.", "很抱歉没按时完成我负责的任务部分，虽然遇到了意外问题，但我本该早点告知延误情况。"], ["Thank you for going out of your way to find the reference materials I needed—they were hard to locate, and your effort means a lot.", "感谢你特意帮我找需要的参考资料，这些资料很难找，你的付出太有意义了。"], ["I appreciate you adjusting your schedule to attend the extra team meeting—your input was important for finalizing the plan.", "感谢你调整日程参加额外的团队会议，你的意见对确定计划很重要。"], ["Thank you for cheering me up when I was stressed about the project—your encouragement helped me stay focused.", "感谢我为项目压力大时你给我打气，你的鼓励帮我保持了专注。"], ["I want to thank you for proofreading the client contract—you caught a mistake in the payment terms that would have cost us money.", "想谢谢你校对客户合同，你发现了付款条款里一个可能让我们受损的错误。"], ["Thank you for sharing your template for the progress report—it’s much more organized than mine, and it will save me time going forward.", "感谢你分享进度报告模板，比我的规整多了，以后能帮我省不少时间。"], ["I apologize for the messy state of the shared workspace after I used it—I’ll make sure to tidy up before leaving next time.", "很抱歉我用完共享工作区后没整理干净，下次离开前一定会收拾好。"], ["I’m sorry I misheard the client’s request and passed on the wrong information to the team—I’ve clarified it now and updated everyone.", "很抱歉听错了客户需求，还把错误信息同步给了团队，我现在已经澄清并更新给所有人了。"], ["I apologize for not asking for clarification when I didn’t understand the task—I wasted time working on the wrong thing, and I’ll speak up sooner next time.", "很抱歉没理解任务时没主动确认，白忙活了半天，下次会早点开口问清楚。"], ["I’m sorry I forgot to return the project folder you lent me—I’ll bring it to your desk first thing tomorrow morning.", "很抱歉忘了还你借我的项目文件夹，明天一早我就送到你工位上。"], ["I apologize for the delay in approving your expense report—I overlooked it in my inbox, and I’ve processed it now with my apologies.", "很抱歉延迟审批你的费用报销单，我在收件箱里漏掉了，现在已经处理好，非常抱歉。"]];window.__KEY__="926职场与日常社交沟通950句";window.__TITLE__="9.26 职场与日常社交沟通950句";

function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
