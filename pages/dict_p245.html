are.\"", "eg： “我们应该利用我们的优势来扩大市场份额。”"], ["Example: \"Your line manager will give you feedback on your performance.\"", "eg： “你的直线经理会给你关于表现的反馈。”"], ["Local team", "海外团队"], ["Example: \"Our HQ (headquarter) team is located in China, but we have local teams based in Europe and India too.\"", "eg： “我们的总部团队在国内，但也有位于欧洲和印度的海外（当地）团队。”"], ["Lowlights", "不足"], ["Example: \"We need to flag the lowlights and improve on them in the future.\"", "eg： “我们需要注意这些不足，以后改进提升。”"], ["Example: \"I’ve sent the meeting invitation to all participants.\"", "eg： “我已向所有参会者发送会议邀请。”"], ["Milestone", "里程碑 / 重要节点"], ["Example: \"We should celebrate for completing a key project milestone.\"", "eg： “我们刚完成了项目的重大节点，应该庆祝一下。”"], ["Example: \"We need to mitigate the risks associated with this project.\"", "eg： “我们需要减轻与该项目相关的风险。”"], ["Example: \"We need to monitor the project's progress closely.\"", "eg： “我们需要密切监控项目的进展。”"], ["Example: \"We need to negotiate the terms of the contract.\"", "eg： “我们需要协商合同条款。”"], ["Network issue", "信号不好"], ["Example: \"Just let me re-join the call. I have a network issue.\"", "eg： “我重新加入一下会议。我这边信号不好。”"], ["New joiner", "新人"], ["Example: \"For a new joiner, he has adapted to our company very quickly.\"", "eg： “作为一个新人，他很快就融入了公司。”"], ["Example: \"Your offboarding process will take about 5 working days.\"", "eg： “你的离职手续差不多要 5 个工作日。”"], ["Example: \"Let's discuss this offline after the meeting.\"", "eg： “我们在会议后离线讨论这个问题。”"], ["Example: \"It's important that we are all on the same page regarding the project's goals.\"", "eg： “关于项目目标，大家达成一致非常重要。”"], ["Example: \"Our onboarding process ensures new hires are quickly up to speed.\"", "eg： “我们的入职流程确保新员工能够迅速适应。”"], ["On data", "用流量"], ["On mute", "静音"], ["Example: \"Sorry, I can’t hear you. Are you on mute?\"", "eg： “抱歉，我听不到你。你是静音了吗？”"], ["One-on-one", "一对一沟通"], ["Example: \"I'll have my one-on-one with my manager next week to discuss my career development.\"", "eg： “我下周要跟我的老板一对一沟通，聊一下我的职业发展。”"], ["Example: \"We have decided to offer you the position.\"", "eg： “我们决定向你提供这个职位。”"], ["Example: \"We need to optimize our workflow to improve efficiency.\"", "eg： “我们需要优化工作流程以提高效率。”"], ["Example: \"Can you outline the main points of your proposal?\"", "eg： “你能概述一下你提案的要点吗？”"], ["Example: \"She will oversee the project to ensure it stays on track.\"", "eg： “她将监督项目以确保其按计划进行。”"], ["OOO (out of office) | 不在办公室", "请假"], ["Example: \"I will be OOO from December 1st until next year.\"", "eg： “12 月 1 日起，直到明年，我都不在办公室。”"], ["Outsource", "外包"], ["Example: \"We outsource a lot of our consultants on a project basis.\"", "eg： “我们会根据项目需求，外包很多顾问。”"], ["Example: \"Her performance has been outstanding this quarter.\"", "eg： “她本季度的表现非常出色。”"], ["PIP (performance Improvement Plan)", "留岗考察期"], ["Example: \"She was put on a PIP for her poor performance the past quarter.\"", "eg： “她上个季度表现不好，已经进入了留岗考察期。”"], ["POC (point of contact)", "对接人 / 接口"], ["Example: \"This new market has great potential.\"", "eg： “这个新市场有很大的潜力。”"], ["Example: \"Please review the document prior to the meeting.\"", "eg： “请在会议前审核文件。”"], ["Example: \"We must prioritize the tasks to meet the deadline.\"", "eg： “我们必须优先处理任务以赶上截止日期。”"], ["Example: \"We need to procure new equipment for the project.\"", "eg： “我们需要为项目采购新设备。”"], ["Example: \"She was promoted to manager after her excellent performance.\"", "eg： “她因表现优异被晋升为经理。”"], ["Example: \"We should pursue new opportunities in the emerging markets.\"", "eg： “我们应该追求新兴市场的新机会。”"], ["Example: \"It's important to consider different perspectives in decision-making.\"", "eg： “在决策中考虑不同的观点很重要。”"], ["Per se", "本身"], ["Example: \"The task per se is easy, but the timeline is tight.\"", "eg： “任务本身不难，但时间紧张。”"], ["Example: \"We need to have a post-mortem to find out what went wrong with the event.\"", "eg： “我们需要开个复盘会，找到活动出问题的原因。”"], ["Example: \"We need to quantify the benefits of this strategy.\"", "eg： “我们需要量化这种策略的好处。”"], ["Reach out", "联系"], ["Example: \"I’ll reach out to the client for further details.\"", "eg： “我会联系客户了解更多细节。”"], [" ouble hearing you.\"", "eg： “你能大点声吗？我们听不到你。”"], ["spreadsheet", "电子报表"], ["Example: \"Remember to update the latest figures in this spreadsheet.\"", "eg： “别忘了在这个表格里更新最新数据。”"], ["stakeholder", "利益相关方"], ["Example: \"We need to inform all the stakeholders of the impact of this decision first.\"", "eg： “我们需要先告知所有相关人员，这个决定会产生哪些影响。”"], ["Example: \"We need to strategize our approach to entering the new market.\"", "eg： “我们需要制定进入新市场的策略。”"], ["Example: \"We aim to streamline our processes to reduce costs.\"", "eg： “我们旨在精简流程以降低成本。”"], ["Example: \"Our company offers a housing subsidy of 3,000 RMB per month.\"", "eg： “我们公司提供每月 3000 元的住房补贴。”"], ["Example: \"I have to get my line manager to agree first before I can go.\"", "eg： “我去之前，需要我的直属上级同意才行。”"], ["Example: \"Suppose we increase the budget, what would the impact be?\"", "eg： “假设我们增加预算，会有什么影响？”"], ["sync | 同步", "常用于 “regular/weekly sync” 表示例会"], ["TGIF (Thank God It’s Friday)", "谢天谢地，终于到周五了！"], ["Example: \"TGIF! I’m looking forward to my night out.\"", "eg： “谢天谢地，终于周五了！期待今晚出去玩。”"], ["tentatively", "暂定"], ["Example: \"The call is scheduled tentatively for next Monday.\"", "eg： “会议时间暂定为下周一。”"], ["to-do", "待办事项"], ["Example: \"I’ll list the to-dos in an email after the meeting.\"", "eg： “会后，我会在邮件里给出后续的待办事项。”"], ["tracker", "进度表"], ["Example: \"Please fill in the project tracker before the meeting.\"", "eg： “开会前，请填写好项目进度表。”"], ["timeline", "时间表"], ["Example: \"We have to follow this timeline to finish the project on time.\"", "eg： “我们必须遵守这个时间表，才能按时完成项目。”"], ["Example: \"We need to manage the transition to the new system smoothly.\"", "eg： “我们需要顺利管理向新系统的过渡。”"], ["Example: \"The announcement triggered a lot of questions from the team.\"", "eg： “公告引发了团队的许多问题。”"], ["Example: \"The project turnaround time has been significantly reduced.\"", "eg： “项目的周转时间大大减少。”"], ["Example: \"I just wanted to touch base with you on the project status.\"", "eg： “我只是想和你简短联系一下项目进展情况。”"], ["Update", "更新 / 同步"], ["Example: \"I’ll update the latest numbers in this form.\"", "eg： “我会在表格里更新最新数据。”"], ["Example: \"We need to better utilize our resources.\"", "eg： “我们需要更好地利用我们的资源。”"], ["Example: \"We need to validate the results before making any decisions.\"", "eg： “在做出任何决定之前，我们需要验证结果。”"], ["Example: \"Improving visibility on our progress is crucial.\"", "eg： “提高我们进展的可见性至关重要。”"], ["WFH (work from home)", "居家办公"], ["Example: \"I don’t like WFH (working from home). There are no boundaries between your work and personal life.\"", "eg： “我不喜欢居家办公。生活和工作之间没有边界感。”"], ["WIP (work in progress)", "完成中"], ["Example: \"The report is still WIP. I will finish by COB tomorrow.\"", "eg： “报告还在完成中，我会明天下班前写完。”"], ["Example: \"We're hosting a workshop on project management next week.\"", "eg： “我们下周将举办一个项目管理研讨会。”"], ["XFN (cross-functional)", "跨部门"], ["Example: \"XFN collaboration is essential to the operations of big companies.\"", "eg： “跨部门协作对于大公司的运作至关重要。”"], ["zoom in on", "聚焦"], ["Example: \"Let’s zoom in on the problems mentioned in the report.\"", "eg： “我们来聚焦一下报告里提到的问题。”"]];window.__KEY__="火速码住职场英语200个词汇1";window.__TITLE__="火速码住职场英语200个词汇1(1) 7.30";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
