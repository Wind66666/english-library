.dict-big{font-size:17px;font-weight:700;color:#dfe4f5;margin:14px 0 22px;line-height:1.8}
.dict-stats{display:flex;gap:14px;justify-content:center;margin:22px 0 28px;flex-wrap:wrap}

/* ---- 学习进度 & 归档 ---- */

.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;

y.", "你是个很棒的导师，新团队成员说你的指导帮他们快速上手工作。"], ["Your performance review this year is “Exceeds Expectations”—you’ve gone above and beyond your job description.", "你今年的绩效评级是 “超出预期”，你做的工作已经超出了岗位要求。"], ["You consistently meet or exceed your monthly KPIs—this reliability helps the team plan better.", "你总能达到或超出月度 KPI，这种可靠性让团队能更好地制定计划。"], ["Your ability to adapt to new technologies is strong—you learned the new CRM system in just a week.", "你适应新技术的能力很强，只用一周就学会了新的 CRM 系统。"], ["You’ve shown strong problem-solving skills on the recent crisis project—you found a solution when others were stuck.", "在近期的危机项目中，你展现了很强的解决问题能力，在别人陷入困境时找到了解决方案。"], ["Your teamwork has been excellent—you often help colleagues with their tasks without being asked.", "你的团队协作很好，经常主动帮同事处理任务。"], ["You take initiative to improve processes—like the new file-sharing system you proposed, which saved everyone time.", "你主动改进流程，比如你提议的新文件共享系统，为大家节省了时间。"], ["Your Q3 performance was strong—you completed all projects ahead of schedule and received positive client reviews.", "你第三季度的绩效很突出，所有项目都提前完成，还获得了客户的正面评价。"], ["You’ve built long-term relationships with key clients—they’ve renewed contracts because of your trust and support.", "你与核心客户建立了长期关系，正因你的信任和支持，他们才续签了合同。"], ["You’ve done well there. One area we could work on together is improving turnaround time, especially when deadlines are tight.", "这方面你做得很好。不过我们可以一起改进的是缩短完成时间，尤其是在截止日期紧迫时。"], ["For your development, I’d also like to see you take on more client-facing responsibilities in the next quarter.", "为了你的发展，我希望你在下个季度承担更多客户对接的工作。"], ["There’s room to enhance cross-department communication—sometimes other teams aren’t aware of your project progress.", "跨部门沟通还有提升空间，有时其他团队不了解你项目的进展。"], ["Your report quality is high, but sometimes it’s delayed. Let’s figure out how to balance quality and timeliness.", "你的报告质量很高，但有时会延迟。咱们一起想办法平衡质量和时效性。"], ["You sometimes work overtime too much—let’s find ways to improve efficiency so you can have a better work-life balance.", "你有时加班太多，咱们找方法提升效率，让你能更好地平衡工作与生活。"], ["Your slides are informative, but they can be more concise—try cutting unnecessary details to keep the audience focused.", "你的幻灯片内容丰富，但可以更简洁，尝试删减不必要的细节以保持听众的注意力。"], ["You take on too many tasks sometimes, which affects the quality of your core work. Let’s learn to prioritize.", "你有时承担太多任务，影响了核心工作的质量。咱们要学会排序优先级。"], ["Q4 had a slight dip in your performance—let’s talk about the challenges you faced and how to avoid them next year.", "你第四季度的绩效略有下滑，咱们聊聊你遇到的挑战以及明年如何规避。"], ["You’re good at executing tasks, but I’d like to see you contribute more ideas in team brainstorming sessions.", "你擅长执行任务，但我希望你在团队头脑风暴中多提出些想法。"], ["Communication with the finance team could be smoother—let’s set up regular syncs to align on budgets and deadlines.", "和财务团队的沟通可以更顺畅，咱们安排定期同步会议，统一预算和截止日期。"], ["You sometimes miss small details in client requirements—let’s create a checklist to review before submitting deliverables.", "你有时会遗漏客户需求中的小细节，咱们做个清单，在提交交付物前核对。"], ["Your public speaking skills are improving, but you can work on engaging the audience more—like asking questions or sharing examples.", "你的公开演讲技能在进步，但可以多提升与听众的互动，比如提问或分享案例。"], ["You’re great at working independently, but let’s practice updating the team more often so everyone is on the same page.", "你独立工作能力很强，但要多练习向团队同步进展，让大家保持信息一致。"], ["There’s room to improve your time management—try using a task tracker to avoid last-minute rushes.", "你的时间管理还有提升空间，尝试用任务跟踪工具避免临时赶工。"], ["You sometimes hesitate to delegate tasks—let’s identify which routine work can be assigned to interns or junior team members.", "你有时不愿分配任务，咱们找出哪些常规工作可以交给实习生或初级团队成员。"], ["Your understanding of industry trends is good, but let’s dive deeper into competitor analysis to stay ahead.", "你对行业趋势的理解不错，但咱们要更深入地做竞品分析以保持领先。"], ["You handle positive feedback well, but let’s work on being more open to constructive criticism—it will help you grow.", "你能很好地接受正面反馈，但要更乐于接受建设性批评，这能帮你成长。"], ["You sometimes focus too much on details and lose sight of the big picture—let’s practice stepping back to review project goals.", "你有时太关注细节而忽略整体，咱们练习退一步审视项目目标。"], ["Your client follow-up is good, but let’s add more proactive check-ins to anticipate their needs before they ask.", "你的客户跟进做得不错，但可以增加主动沟通，在客户提出需求前预判他们的需求。"], ["You’re good at using existing tools, but let’s explore new software that could boost your efficiency even more.", "你擅长使用现有工具，但咱们可以探索新软件，进一步提升效率。"], ["For your development, I’d like to see you take on more client-facing responsibilities in the next quarter—like leading project update calls.", "为了你的发展，我希望你在下个季度承担更多客户对接工作，比如主持项目更新会议。"], ["We’re considering a promotion for you to Senior [Position]—what are your thoughts on taking on more leadership tasks?", "我们在考虑提拔你为高级 [职位]，你对承担更多领导工作有什么想法？"], ["For next year’s performance goals, would you like to take on a new project related to market expansion?", "关于明年的绩效目标，你愿意承担一个与市场拓展相关的新项目吗？"], ["We’d like to set a stretch goal for you next year: increasing customer retention by 10%. Do you think that’s achievable?", "我们想给你定一个明年的挑战目标：客户留存率提升 10%。你觉得这能实现吗？"], ["For your development plan, would you be interested in taking a professional course on data analysis? It will help with your project decisions.", "在你的发展计划中，你有兴趣参加数据分析的专业课程吗？这对你的项目决策有帮助。"], ["We want to promote a culture of innovation—would you lead a monthly “idea sharing” session with the team?", "我们想推动创新文化，你愿意带领团队每月开一次 “创意分享” 会吗？"], ["We need to improve the team’s customer complaint resolution rate—would you lead a project to streamline the process?", "我们需要提升团队的客户投诉解决率，你愿意带领项目优化这个流程吗？"], ["Next quarter, we want you to focus on improving the team’s onboarding process—what resources do you need to get started?", "下季度我们希望你重点改进团队的入职流程，你需要什么资源来启动这项工作？"], ["We’re introducing a new performance metric: project on-time delivery rate. Let’s work together to track this effectively.", "我们要引入一个新的绩效指标：项目按时交付率。咱们一起高效跟踪这个指标。"], ["We’d like you to mentor 2 new hires next quarter—can you create a 30-day training plan to help them integrate?", "下季度我们希望你带 2 个新员工，你能制定一个 30 天的培训计划帮他们融入吗？"], ["Your market trend reports are valuable—we want you to present them at the next company-wide meeting to share your insights.", "你的市场趋势报告很有价值，我们希望你在下次全公司会议上演示，分享你的见解。"], ["We’re giving you a budget to test new project management tools—can you research and recommend the best one for the team?", "我们给你一笔预算测试新的项目管理工具，你能调研并给团队推荐最合适的吗？"], ["For next year, let’s set a goal to increase your client portfolio by 5 new key clients—how do you plan to achieve that?", "明年咱们定个目标，让你的客户组合新增 5 个核心客户，你计划如何实现？"], ["We want you to develop your leadership skills—would you join the company’s leadership training program next semester?", "我们希望你提升领导能力，你愿意下学期参加公司的领导力培训项目吗？"], ["Let’s set a goal to reduce the time you spend on routine tasks by 20%—we can explore automation tools to help.", "咱们定个目标，把你花在常规任务上的时间减少 20%，可以探索自动化工具来帮忙。"], ["We’d like you to collaborate with the marketing team on a new product launch—can you set milestones for your contribution?", "我们希望你和市场团队合作新的产品发布，你能为自己的贡献设定里程碑吗？"], ["Your cross-department experience is strong—let’s aim for you to lead a cross-functional project by the end of the year.", "你的跨部门经验很丰富，咱们目标是年底前让你带领一个跨职能项目。"], ["Let’s set a goal to improve your presentation skills—you can attend a workshop and deliver 2 team presentations per quarter.", "咱们定个目标提升你的演示技能，你可以参加一个工作坊，每季度做 2 次团队演示。"], ["We want you to become the team’s expert on the new CRM system—can you master it and train other team members by next month?", "我们希望你成为团队新 CRM 系统的专家，你能在下个月前掌握并培训其他成员吗？"], ["For your career growth, let’s identify 3 key skills you want to develop next year—like negotiation, strategic planning, or team management.", "为了你的职业发展，咱们确定明年你想提升的 3 项核心技能，比如谈判、战略规划或团队管理。"], ["We’re offering a 10% salary increase based on your performance—does that meet your expectations?", "基于你的绩效，我们提供 10% 的薪资涨幅，这符合你的预期吗？"], ["Let’s discuss—we can adjust it to 11% and add a performance bonus if you meet next quarter’s target.", "我们可以商量 —— 调整为 11% 的涨幅，如果你达到下季度目标，再额外加绩效奖金。"], ["You’re eligible for a bonus this year—we’ll calculate it based on your annual performance and pay it out next month.", "你今年有资格获得奖金，我们会根据你的年度绩效计算，下个月发放。"], ["We can cover the course fee for your data analysis training as part of your performance benefits.", "我们可以承担你数据分析培训的课程费用，作为你的绩效福利。"], ["You have the option to receive your bonus as cash or extra vacation days—what would you prefer?", "你可以选择奖金形式：现金或额外年假，你更倾向哪种？"], ["Based on your outstanding performance, we’re nominating you for “Employee of the Year”—this comes with a cash prize and a certificate.", "基于你的出色绩效，我们提名你为 “年度员工”，奖励包括现金和证书。"], ["We’re adjusting your compensation package to include a commission component—you’ll earn 5% on every new client you bring in.", "我们调整了你的薪酬方案，加入佣金部分 —— 你每带来一个新客户，可获得 5% 的佣金。"], ["If you meet the annual sales target, you’ll qualify for a luxury trip for two as a top performer reward.", "如果你达到年度销售目标，作为优秀员工奖励，你将获得双人豪华旅行机会。"], ["We’re increasing your stock options by 15% to recognize your long-term contribution to the company.", "为认可你对公司的长期贡献，我们将你的股票期权增加 15%。"], ["Let’s review your salary again next quarter—if you maintain this performance level, we can discuss a further increase.", "下季度咱们再回顾你的薪资，如果能保持这个绩效水平，可以讨论进一步加薪。"], ["Let’s schedule a Zoom call for 3 PM to discuss the project progress.", "我们安排下午 3 点开 Zoom 会议讨论项目进度吧。"], ["I’ll send the meeting link to the team chat 10 minutes before the call.", "我会在会议前 10 分钟把链接发到团队群里。"], ["Let’s set up a daily 15-minute standup call to sync on priorities.", "我们每天开 15 分钟的站会同步优先级吧。"], ["Can you record the meeting and share the video in the team folder?", "你能录下会议，把视频分享到团队文件夹吗？"], ["I’m in a different time zone—can we move the call to 4 PM your time (10 AM my time)?", "（我在不同时区，能把会议改到你那边下午 4 点"], ["Let’s have a weekly review call on Fridays to discuss what we accomplished and what’s next.", "我们每周五开复盘会，讨论完成的工作和下一步计划吧。"], ["Can you join the client’s Teams call tomorrow? I’ll send you the agenda in advance.", "你明天能参加客户的 Teams 会议吗？我提前把议程发给你。"], [" he call to prevent notifications from interrupting?", "你能在会议期间关闭后台应用通知吗？避免干扰会议。"], ["I’ll send a “post-meeting recap” email with key decisions and action items within 1 hour of the call.", "会议结束后 1 小时内，我会发 “会后总结” 邮件，包含关键决策和待办事项。"], ["Let’s schedule a “feedback call” next week to discuss how the remote tools are working for everyone.", "我们下周安排一次 “反馈会议”，讨论远程工具的使用体验吧。"], ["Can you adjust the shared calendar to show time zones for all team members? It’ll avoid confusion.", "你能在共享日历上显示所有团队成员的时区吗？这样能避免误解。"], ["Let’s use Zoom’s “raise hand” feature to avoid talking over each other during the call.", "我们用 Zoom 的 “举手” 功能吧，避免会议中互相打断。"], ["Let’s schedule a “team building call” next Friday—it’ll be a casual chat to keep everyone connected.", "我们下周五安排一次 “团队建设会议” 吧，轻松聊天增进大家的联系。"], ["Can you confirm with the client if they prefer a Zoom call or a Teams call for the next meeting?", "你能和客户确认下次会议他们更喜欢用 Zoom 还是 Teams 吗？"], ["Can you leave comments on the document by EOD so we can finalize it tomorrow?", "你能在今天下班前在文档上留评论吗？这样我们明天就能定稿。"], ["I’ll assign tasks in Trello and tag each of you—please update your progress daily.", "我会在 Trello 上分配任务并 @大家，请每天更新进度。"], ["The team’s shared drive has all the project materials—let me know if you can’t access it.", "团队共享盘里有所有项目资料，要是打不开随时告诉我。"], ["Let’s use Slack for quick updates and email for formal documents.", "我们用 Slack 发快速更新，用邮件发正式文件吧。"], ["I’ll share the project timeline in Excel—please highlight any deadlines you think are tight.", "我会把项目时间表用 Excel 分享，你觉得哪个截止日期紧的话标出来。"], ["I’ll set up a Miro board for the workshop—we can use sticky notes to organize ideas.", "我会为工作坊建一个 Miro 白板，我们用便利贴整理创意。"], ["Let’s use Loom to record product demos—it’s easier than scheduling multiple calls.", "我们用 Loom 录产品演示吧，比安排多次会议方便。"], ["I’ll share a checklist in the team chat—please tick off items as you complete them.", "我会在团队群发一个清单，你完成一项就打勾。"], ["Let’s use Dropbox to share large files—email can’t handle attachments over 20MB.", "我们用 Dropbox 发大文件吧，邮件发不了 20MB 以上的附件。"], ["C ideo for the new collaboration software—it’ll walk everyone through basic functions.", "我会为新的协作软件做一个 “使用指南” 视频，带大家了解基础功能。"], ["Can you test the audio of the conference room before the client call? We don’t want technical issues.", "你能在客户会议前测试会议室的音频吗？我们不想出现技术问题。"], ["Let’s use Miro’s “sticky note grouping” feature to organize ideas during the brainstorming session.", "头脑风暴时，我们用 Miro 的 “便利贴分组” 功能整理创意吧。"], ["I’ll send a “thank you email” to the team after the client meeting—it acknowledges their hard work.", "客户会议后，我会给团队发 “感谢邮件”，感谢大家的努力。"], ["Let’s use Notion’s “task database” to assign and track tasks—it integrates with the shared calendar.", "我们用 Notion 的 “任务数据库” 分配和跟踪任务吧，它能和共享日历联动。"], ["Can you test the audio and video on the backup device in case the main one fails during the call?", "你能测试备用设备的音视频吗？以防会议时主设备出故障。"], ["I’ll create a “collaboration best practices” document—it includes tips on communication and task management.", "我会做一个 “协作最佳实践” 文档，包含沟通和任务管理的技巧。"], ["Let’s use Dropbox’s “version control” feature to avoid overwriting the latest version of the proposal.", "我们用 Dropbox 的 “版本控制” 功能，避免覆盖提案的最新版本吧。"], ["Can you add the “action item owners” to the meeting agenda so everyone knows who’s responsible?", "你能把 “待办事项负责人” 加到会议议程里吗？让大家都清楚谁负责什么。"], ["I’ll share the “tool troubleshooting guide” in the shared drive—it has solutions for common technical issues.", "我会在共享盘里分享 “工具故障排查指南”，里面有常见技术问题的解决方法。"], ["Let’s use Zoom’s “polls” feature during the meeting to get quick feedback on key decisions.", "会议时我们用 Zoom 的 “投票” 功能吧，快速收集大家对关键决策的反馈。"], ["Can you confirm with the IT team if the new collaboration tool is compatible with our company’s devices?", "你能和 IT 团队确认新的协作工具是否兼容我们公司的设备吗？"], ["I’ll create a “remote work schedule template” for the team—it helps balance work and personal time.", "我会为团队做一个 “远程工作时间表模板”，帮大家平衡工作和个人时间。"], ["Let’s use Slack’s “channels” feature to separate project discussions by topic—it keeps conversations organized.", "我们用 Slack 的 “频道” 功能按话题拆分项目讨论吧，让沟通更有条理。"], ["Can you share the “client meeting recap” with the team within 2 hours of the call?", "你能在客户会议结束后 2 小时内把 “会议总结” 发给团队吗？"], ["I’ll set up a “feedback loop” with the team—we’ll review the remote collaboration process every month.", "我会和团队建立 “反馈循环”，每月回顾一次远程协作流程。"], ["Let’s use Miro’s “flowchart” feature to map out the project workflow—it’s easier to understand for new members.", "我们用 Miro 的 “流程图” 功能梳理项目流程吧，新成员更容易理解。"], ["Can you resend the “tool access instructions” to the new hire? They said they couldn’t find the email.", "你能把 “工具访问说明” 重发给新员工吗？他们说找不到之前的邮件了。"], ["I’ll create a “project milestone tracker” to highlight key deadlines and achievements.", "我会做一个 “项目里程碑跟踪表”，突出关键截止日期和成果。"], ["Let’s use Dropbox’s “shared links” feature to send documents to external clients—it’s more secure than email attachments.", "我们用 Dropbox 的 “共享链接” 功能给外部客户发文档吧，比邮件附件更安全。"], ["Can you add a “priority level” to each task in the Trello board? It helps the team focus on urgent work.", "你能在 Trello 看板的每个任务上标 “优先级” 吗？帮团队聚焦紧急工作。"], ["I’ll send a “monthly remote work report” to the leadership team—it includes productivity data and team feedback.", "我会给领导团队发 “月度远程工作报告”，包含生产力数据和团队反馈。"], ["Let’s use Notion’s “wiki” feature to create a centralized project hub—it has all the necessary documents and links.", "我们用 Notion 的 “维基” 功能建一个集中式项目中心吧，里面包含所有必要的文档和链接。"], ["I’ll share the login credentials for all work-related accounts with the designated person, following company security protocols.", "我会按照公司安全规定，把所有工作相关账号的登录信息分享给指定人员。"], ["Can you confirm if the “cloud storage quota” is enough for the project files? We don’t want to run out of space.", "你能确认 “云存储配额” 够放项目文件吗？我们不想出现存储空间不足的情况。"], ["I’ll create a “team collaboration agreement”—it outlines expectations for communication, response times, and data security.", "我会做一个 “团队协作协议”，明确沟通、回复时间和数据安全的要求。"], ["Can you confirm if the external consultant has signed the NDA before accessing sensitive project data?", "你能确认外部顾问在访问敏感项目数据前是否已签署保密协议吗？"], ["I’ll encrypt the shared folder containing confidential client information—only authorized team members can access it.", "我会加密包含客户机密信息的共享文件夹，只有授权团队成员能访问。"], ["Can you remind the team not to share work devices with family members or use public Wi-Fi for work tasks?", "你能提醒团队不要把工作设备借给家人，也不要用公共 Wi-Fi 处理工作任务吗？"], ["I’ll set up two-factor authentication (2FA) for all team accounts to enhance security.", "我会为所有团队账号开启双重认证（2FA），提升安全性。"], ["Can you back up the project files to an external hard drive weekly, in addition to cloud storage?", "除了云存储，你能每周把项目文件备份到外接硬盘吗？"], ["I’ll create a “data handling guide” to remind the team how to store, share, and delete sensitive information properly.", "我会做一个 “数据处理指南”，提醒团队如何正确存储、分享和删除敏感信息。"], ["Can you confirm if the collaboration tool we’re using is compliant with company data privacy policies?", "你能确认我们使用的协作工具是否符合公司数据隐私政策吗？"], ["I’ll revoke access to project tools and accounts for team members who leave the project—this prevents unauthorized access.", "我会为离开项目的团队成员注销项目工具和账号的访问权限，防止未授权访问。"], ["Can you avoid including sensitive information like passwords or credit card numbers in email or chat messages?", "你能避免在邮件或聊天消息中包含密码、信用卡号等敏感信息吗？"], ["I’ll schedule a monthly security check to review who has access to sensitive project data and update permissions if needed.", "我会安排每月一次的安全检查，查看谁有权访问敏感项目数据，必要时更新权限。"], ["Can you use the company’s virtual private network (VPN) when working from a location outside the office?", "在办公室外工作时，你能使用公司的虚拟专用网络（VPN）吗？"], ["I’ll label all confidential documents clearly with “Confidential” so the team knows to handle them carefully.", "我会在所有机密文档上明确标注 “机密”，让团队知道要谨慎处理。"], ["Can you confirm if the team has completed the company’s data security training before working on this project?", "你能确认团队在参与这个项目前是否已完成公司的数据安全培训吗？"], ["I’ll set up a “secure file transfer protocol (SFTP)” for sharing large confidential files with external partners.", "我会搭建 “安全文件传输协议（SFTP）”，用于和外部合作伙伴分享大型机密文件。"], ["Can you remind the team to lock their work devices when stepping away from their desks, even at home?", "你能提醒团队，即使在家，离开座位时也要锁定工作设备吗？"], ["I’ll create a “security incident response plan” so the team knows what to do if there’s a data breach or security issue.", "我会做一个 “安全事件应对计划”，让团队知道发生数据泄露或安全问题时该怎么做。"], ["Can you confirm if the software we’re using for the project has up-to-date security patches?", "你能确认我们用于项目的软件是否有最新的安全补丁吗？"], ["I’ll limit access to the project’s financial data to only the finance team and key project leads.", "我会限制项目财务数据的访问权限，只允许财务团队和核心项目负责人访问。"], ["Can you avoid saving work files to personal devices—all project materials should be stored in the company’s shared drive.", "你能避免把工作文件存到个人设备吗？所有项目资料都应存在公司共享盘。"], ["I’ll conduct a quarterly audit of the team’s compliance with data security policies to identify any gaps.", "我会每季度审核团队对数据安全政策的遵守情况，找出不足。"], ["Can you use strong, unique passwords for each work account—avoid reusing passwords across platforms?", "你能为每个工作账号设置复杂且唯一的密码吗？避免跨平台重复使用密码。"], ["I’ll set up alerts for unusual activity on the shared drive, like multiple failed login attempts or large file downloads.", "我会为共享盘设置异常活动警报，比如多次登录失败或大量文件下载。"], ["Can you confirm if the client has given permission for us to share their data with the external design team?", "你能确认客户是否允许我们把他们的数据分享给外部设计团队吗？"], ["I’ll provide the team with a list of approved collaboration tools—avoid using unapproved tools that may pose security risks.", "我会给团队一份已批准的协作工具清单，避免使用未经批准、可能有安全风险的工具。"], ["Can you delete any unnecessary sensitive data from the shared drive after the project is completed?", "项目完成后，你能从共享盘删除所有不必要的敏感数据吗？"], ["I’ll train the team on how to recognize phishing emails and other common cyber threats to prevent security breaches.", "我会培训团队如何识别钓鱼邮件和其他常见网络威胁，防止安全漏洞。"], ["I’m writing to inform you that I’ll be leaving the company on [Date]—I’ve accepted a new role in [Field].", "我写信是想告知您，我将于 [日期] 离职，已接受 [领域] 的新工作。"], ["Can we schedule a meeting next week to discuss the handover plan for my current projects?", "我们下周能安排一次会议，讨论我现有项目的交接计划吗？"], ["I’ll create a detailed handover document that includes project timelines, client contacts, and pending tasks.", "我会做一份详细的交接文档，包含项目时间线、客户联系方式和待办任务。"], ["Who will be taking over my responsibilities after I leave? I’d like to coordinate with them directly.", "我离职后谁会接手我的工作？我想直接和他们对接。"], ["Can you share the contact information of the colleague who’ll inherit the [Project Name]?", "你能把接手 [项目名称] 的同事的联系方式发给我吗？"], ["I’ll schedule one-on-one sessions with the handover recipients to walk them through key project details.", "我会和接手人安排一对一会议，带他们梳理关键项目细节。"], ["Are there any specific projects or tasks that need priority during the handover period?", "交接期间有哪些特定项目或任务需要优先处理吗？"], ["I’ll compile a list of all active projects, including their current status and next steps.", "我会整理所有在推进项目的清单，包含当前进度和下一步计划。"], ["Can you confirm the length of the handover period? I want to ensure enough time to transfer all information.", "你能确认交接期有多长吗？我想确保有足够时间移交所有信息。"], ["I’ll share access to all project folders, tools, and accounts with the handover team before my last day.", "离职前我会把所有项目文件夹、工具和账号的访问权限分享给接手团队。"], ["Who should I notify about my departure, besides the immediate team and clients?", "除了直属团队和客户，我还需要通知哪些人我要离职？"], ["I’ll draft a client communication email to inform them of the handover and introduce the new contact person.", "我会起草客户沟通邮件，告知他们交接事宜并介绍新的对接人。"], ["Can you review the handover document once it’s ready to ensure no key information is missing?", "交接文档完成后，你能帮忙审核一下，确保没有遗漏关键信息吗？"], ["I’ll note down any ongoing issues or risks in the projects, along with suggested solutions.", "我会记录项目中所有待解决的问题或风险，以及建议的解决方案。"], ["Will there be a need for me to be available for follow-up questions after my last day?", "离职后是否需要我随时解答后续疑问？"], ["I’ll create a “how-to guide” for using the specific tools and software I regularly use for work.", "我会做一份 “使用指南”，说明我日常工作中用到的特定工具和软件。"], ["Can you arrange a team meeting for me to announce my departure and discuss the handover plan?", "你能安排一次团队会议，让我宣布离职并讨论交接计划吗？"], ["I’ll prioritize finishing urgent tasks before my departure to reduce the workload for the handover team.", "离职前我会优先完成紧急任务，减轻接手团队的工作量。"], ["I’ll share a list of recurring tasks, including their frequency and responsible parties.", "我会分享定期任务清单，包含执行频率和负责人。"], ["Are there any pending approvals or documents that need to be finalized before I leave?", "离职前有哪些待审批事项或文档需要定稿吗？"], ["I’ll schedule a client call with the new contact person to facilitate a smooth transition.", "我会和新对接人一起安排客户会议，确保过渡顺利。"], ["I’ll compile a list of key stakeholders for each project, including their roles and contact details.", "我会整理每个项目的关键相关方清单，包含他们的角色和联系方式。"], ["Can you confirm if I need to return any company property (e.g., laptop, ID card) on my last day?", "你能确认我离职当天是否需要归还公司财物（如笔记本电脑、工牌）吗？"], ["I’ll document the standard operating procedures (SOPs) for my core responsibilities to guide the handover team.", "我会把核心职责的标准操作流程（SOP）记录下来，为接手团队提供指导。"], ["Who will be responsible for reviewing the handover process to ensure it’s completed successfully?", "谁会负责审核交接流程，确保交接顺利完成？"], ["Can you provide a template for the handover document, or should I create one from scratch?", "你有交接文档的模板吗？还是我需要从头做一份？"], ["I’ll note down any upcoming deadlines or important dates for the projects in the handover document.", "我会在交接文档中记录项目的所有即将到来的截止日期和重要时间点。"], ["I’ll coordinate with the finance team to settle any outstanding expenses or reimbursements before my departure.", "离职前我会和财务团队对接，结清所有未处理的费用或报销。"], ["Are there any specific clients or projects that require extra attention during the handover?", "交接期间有哪些特定客户或项目需要额外关注吗？"], ["I’ll create a summary of the project budgets, including spent amounts and remaining funds.", "我会整理项目预算摘要，包含已支出金额和剩余资金。"], ["Can you introduce me to the colleague who’ll be taking over my client relationships?", "你能把接手我客户关系的同事介绍给我吗？"], ["I’ll schedule a walkthrough of the project management tool to show the handover team how to track progress.", "我会安排项目管理工具的操作演示，教接手团队如何跟踪进度。"], ["I’ll document any verbal agreements or understandings with clients that aren’t in written form.", "我会记录和客户的所有口头约定或共识，即使没有书面记录。"], ["Will I need to complete any exit forms or surveys before my last day?", "离职前我需要填写离职表格或调查问卷吗？"], ["I’ll share a list of resources (e.g., templates, guides) that I use regularly to support the team’s work.", "我会分享我常用的资源清单（如模板、指南），为团队工作提供支持。"], ["Can you confirm the time and location of the exit interview, if applicable?", "如果需要离职面谈，你能确认时间和地点吗？"], ["I’ll work with the handover team to prioritize tasks based on their urgency and impact.", "我会和接手团队一起，根据任务的紧急程度和影响确定优先级。"], ["I’ll document the steps to resolve common issues that arise in my daily work.", "我会记录日常工作中常见问题的解决步骤。"], ["Are there any ongoing collaborations with other departments that need to be communicated during the handover?", "交接时需要告知其他部门正在进行的跨部门协作吗？"], ["I’ll create a timeline for the handover process, outlining key milestones and deadlines.", "我会做交接流程的时间线，列出关键里程碑和截止日期。"], ["Can you share the company’s handover policy or guidelines to ensure I follow the correct procedures?", "你能分享公司的交接政策或指南吗？确保我遵循正确流程。"], ["I’ll introduce the handover team to key contacts in other departments to maintain smooth collaboration.", "我会把接手团队介绍给其他部门的关键对接人，保持协作顺畅。"], ["I’ll document any pending requests from clients or stakeholders that haven’t been addressed yet.", "我会记录客户或相关方提出但尚未处理的所有待办请求。"], ["Will the handover team have access to my work email during the transition period?", "过渡期间接手团队能访问我的工作邮箱吗？"], ["I’ll compile a list of all the software licenses and subscriptions related to my work, including renewal dates.", "我会整理所有与工作相关的软件许可和订阅清单，包含续费日期。"], ["Can you help me coordinate with the IT team to transfer my work files to the handover team?", "你能帮我和 IT 团队对接，把我的工作文件转移给接手团队吗？"], ["I’ll schedule a final review meeting with the team to ensure all handover tasks are completed.", "我会和团队安排最终复盘会议，确保所有交接任务都已完成。"], ["I’ll document the decision-making process for key project choices to help the handover team understand the context.", "我会记录关键项目决策的制定过程，帮接手团队理解背景。"], ["Are there any restrictions on what information I can share during the handover (e.g., confidential data)?", "交接时我在信息分享上有什么限制吗？比如机密数据。"], ["I’ll create a “quick reference guide” for the handover team, highlighting key contacts and urgent tasks.", "我会给接手团队做一份 “快速参考指南”，突出关键联系方式和紧急任务。"], ["Can you confirm if the handover document needs to be approved by a manager before it’s finalized?", "你能确认交接文档定稿前是否需要经理审批吗？"], ["I’ll work with the handover team to update project documentation (e.g., meeting minutes, status reports) with the latest information.", "我会和接手团队一起更新项目文档（如会议纪要、状态报告），补充最新信息。"], ["I’ll document any client preferences or special requirements (e.g., communication style, reporting frequency).", "我会记录客户的偏好或特殊要求（如沟通方式、报告频率）。"], ["Will I need to train the handover team on any specific skills or knowledge required for the role?", "我需要给接手团队培训岗位所需的特定技能或知识吗？"], ["I’ll share a list of all upcoming meetings and events related to my projects, with agendas and preparation notes.", "我会分享所有与我项目相关的即将到来的会议和活动清单，包含议程和准备要点。"], ["Can you provide feedback on the handover plan once it’s drafted to ensure it’s comprehensive?", "交接计划起草后，你能提反馈意见，确保计划全面吗？"], ["I’ll document the progress of each project task, including what’s completed and what’s pending.", "我会记录每个项目任务的进度，包含已完成和待完成部分。"], ["I’ll coordinate with the HR team to complete any necessary paperwork for my departure.", "我会和 HR 团队对接，完成离职所需的所有必要文件。"], ["Are there any client contracts or agreements that the handover team needs to be aware of?", "接手团队需要了解哪些客户合同或协议吗？"], ["I’ll create a summary of the project outcomes and achievements to date.", "我会整理项目到目前为止的成果和成就摘要。"], ["Can you arrange for the handover team to shadow me for a few days to observe my daily work?", "你能安排接手团队跟我几天，观察我的日常工作吗？"], ["I’ll document any unresolved issues with vendors or suppliers, along with contact information for follow-up.", "我会记录与供应商的所有未解决问题，以及后续跟进的联系方式。"], ["I’ll share tips and best practices for managing the projects effectively, based on my experience.", "我会根据我的经验，分享有效管理这些项目的技巧和最佳实践。"], ["Will the handover process be documented for future reference, and if so, who will be responsible for it?", "交接流程会记录下来供日后参考吗？如果是，谁负责记录？"], ["I’ll create a checklist of all handover tasks to ensure nothing is overlooked.", "我会做交接任务清单，确保没有遗漏任何事项。"], ["Can you confirm if I need to attend any meetings after my last day to support the handover?", "你能确认我离职后是否需要参加会议支持交接吗？"], ["I’ll document the access levels for each team member on the project tools and accounts.", "我会记录每个团队成员在项目工具和账号上的访问权限级别。"], ["I’ll share a list of resources for troubleshooting issues with the project tools or software.", "我会分享项目工具或软件的故障排查资源清单。"], ["Can you clarify if the handover team will take over my ongoing client contracts, or will a new colleague be assigned separately?", "你能说明一下是由接手团队接手我正在跟进的客户合同，还是会另外指派新同事吗？"], ["I’ll create a “client history summary” for each key client, including past projects, feedback, and future expectations.", "我会为每个关键客户做一份 “客户历史摘要”，包含过往项目、反馈和未来预期。"], ["Will I need to provide a copy of my work notes or notebooks to the handover team for reference?", "我需要把工作笔记的副本交给接手团队供参考吗？"], ["I’ll coordinate with the legal team to review any client contracts I’m managing, ensuring the handover team understands their terms.", "我会和法务团队对接，审核我正在管理的所有客户合同，确保接手团队理解合同条款。"], ["Can you confirm if the handover document needs to be stored in a specific company folder or shared drive?", "你能确认交接文档需要存到公司特定的文件夹或共享盘吗？"], ["I’ll document any special arrangements with clients, such as flexible payment terms or custom deliverables.", "我会记录和客户的所有特殊约定，比如灵活付款条件或定制交付内容。"], ["Will the handover team receive training on the industry-specific knowledge required to manage my projects?", "接手团队会接受管理我负责项目所需的行业特定知识培训吗？"], ["I’ll share a list of industry events or conferences relevant to the projects, along with contacts from past attendance.", "我会分享与项目相关的行业活动或会议清单，以及过往参会结识的联系人信息。"], ["Can you arrange a meeting between me, the handover team, and the department head to align on the handover goals?", "你能安排一次我、接手团队和部门负责人的会议，统一交接目标吗？"], ["I’ll document the steps to prepare for regular client meetings, including agenda creation and pre-meeting materials.", "我会记录准备常规客户会议的步骤，包含议程制定和会前材料准备。"], ["Are there any internal processes or workflows that the handover team needs to be trained on before I leave?", "离职前接手团队需要接受哪些内部流程或工作流的培训吗？"], ["I’ll create a “risk assessment update” for each project, highlighting any new risks that have emerged recently.", "我会为每个项目做 “风险评估更新”，突出最近出现的新风险。"], ["Can you confirm if I need to cancel any subscriptions or services under my name before my last day?", "你能确认我离职前是否需要取消以我名义开通的订阅或服务吗？"], ["I’ll share a list of internal tools or databases that are critical for the projects but not widely known to the team.", "我会分享对项目至关重要但团队不太熟悉的内部工具或数据库清单。"], ["Will the handover team have access to my past project reports and presentations for reference?", "接手团队能访问我过往的项目报告和演示文稿供参考吗？"], ["I’ll document the feedback I’ve received from clients and stakeholders, along with actions taken to address it.", "我会记录从客户和相关方那里收到的反馈，以及为解决反馈所采取的行动。"], ["Can you help me schedule a final client call to thank them for their partnership and introduce the new contact?", "你能帮我安排一次最终客户会议，感谢他们的合作并介绍新对接人吗？"], ["I’ll create a “task handover matrix” that maps each of my tasks to the corresponding team member taking it over.", "我会做一份 “任务交接矩阵”，将我的每项任务对应到接手的团队成员。"], ["Are there any pending client invoices or payments that need to be followed up on during the handover?", "交接期间有需要跟进的未结客户发票或付款吗？"], ["I’ll share tips on building and maintaining strong client relationships, based on my experience with each client.", "我会根据与每个客户的合作经验，分享建立和维护良好客户关系的技巧。"], ["Can you confirm if the handover process needs to be signed off by a manager or HR before I leave?", "你能确认交接流程是否需要经理或 HR 签字确认后我才能离职吗？"], ["I’ll document the steps to resolve disputes or conflicts with clients, based on past experiences.", "我会根据过往经验，记录解决客户纠纷或冲突的步骤。"], ["Will the handover team be introduced to the client’s internal team members to ensure a smooth transition?", "会把接手团队介绍给客户的内部团队成员，确保过渡顺利吗？"], ["I’ll create a “summary of pending decisions” for each project, outlining what needs to be approved and by whom.", "我会为每个项目做 “待决策事项摘要”，列出需要审批的内容和审批人。"], ["Can you share the contact information of the HR representative who will handle my exit process?", "你能分享负责我离职流程的 HR 代表的联系方式吗？"], ["I’ll document the technical requirements for each project, such as software versions or hardware specifications.", "我会记录每个项目的技术要求，比如软件版本或硬件规格。"], ["Are there any client confidentiality agreements that the handover team needs to sign before accessing sensitive information?", "接手团队在访问敏感信息前需要签署客户保密协议吗？"], ["I’ll share a list of resources for staying updated on industry trends relevant to the projects.", "我会分享与项目相关的行业趋势更新资源清单。"], ["Can you arrange for a test run of the handover process, where the team practices managing tasks with my support?", "你能安排一次交接流程演练吗？让团队在我的支持下练习管理任务。"], ["I’ll document the steps to onboard new clients, in case the handover team takes on new projects in the future.", "我会记录新客户入职流程，以防接手团队未来承接新项目时需要。"], ["Will I receive a copy of the handover document for my own records, or is it only stored internally?", "我能拿到一份交接文档留作个人记录吗？还是仅在公司内部存储？"], ["I’ll create a “glossary of client-specific terms” to help the handover team understand the client’s internal jargon.", "我会做一份 “客户特定术语表”，帮接手团队理解客户的内部术语。"], ["Can you confirm if there are any post-handover follow-up meetings to evaluate how the transition is going?", "你能确认是否有交接后的跟进会议，评估过渡情况吗？"], ["I’ll document the feedback I’ve provided to team members on their work, to maintain consistency after I leave.", "我会记录我给团队成员的工作反馈，确保我离职后工作标准保持一致。"], ["Are there any internal committees or working groups I’m part of that the handover team needs to join?", "我参与的内部委员会或工作组，接手团队需要加入吗？"], ["I’ll share a list of best practices for managing project timelines and avoiding delays.", "我会分享管理项目时间线和避免延误的最佳实践清单。"], ["Can you clarify var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
