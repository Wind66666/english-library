<script>window.__PAIRS__=[["Please accept my apology for my inappropriate behavior. I’ll be more careful next time.（请接受我对自己不当行为的道歉，下次我会更注意的。）​", "（二）文化请教类（适用于不确定对方文化习俗时）​"], ["Are there any special taboos in your culture that I might not be aware of?（你们的文化中有没有我可能没注意到的特殊禁忌呀？）​", "（三）沟通调整类（适用于沟通不顺畅时）​"], ["If I use the wrong word, please correct me directly. I want to improve my communication skills.（如果我用错了词，请直接纠正我，我想提升自己的沟通能力。）​", "（四）赞美尊重类（适用于表达对对方文化的认可时）​"], ["I think your cultural values of [specific value] are very meaningful. They can help people get along better.（我觉得你们文化中 [具体价值观] 的理念很有意义，能帮助人们更好地相处。）​", "（五）拒绝委婉类（适用于需要拒绝对方但不想冒犯时）​"], ["Thank you for offering, but I’m not interested in this activity. I hope you have a great time though!（谢谢你的提议，但我对这个活动不感兴趣，不过还是希望你玩得开心！）​", "（六）进度同步类（适用于商务场景中同步工作进展时）​"], ["I’ve reviewed the draft you sent, and there are 2 parts that need revision. I’ll mark them and send it back to you in 30 minutes.（我看了你发的初稿，有 2 个部分需要修改，我会标注出来，30 分钟内发回给你。）​", "（七）需求确认类（适用于不确定对方需求时）​"], ["You said you prefer face-to-face communication. Would tomorrow afternoon at 2 PM work for you, or do you have another time in mind?", "你说更倾向面对面沟通，明天下午 2 点对你来说合适吗？还是你有其他时间想法？"], ["You need the team to prepare a presentation for the client. Should it be 10 minutes long, or do you have a different time limit in mind?（你需要团队为客户准备演示，时长控制在 10 分钟，还是你有其他时间限制呢？）​", "（八）感谢致谢类（适用于表达感谢，维护良好关系时）​"], ["I appreciate you recommending the useful tools for language translation. They’ve improved my work efficiency a lot.", "感谢你推荐实用的翻译工具，它们大大提高了我的工作效率。"], ["Thank you for inviting me to the cultural event. It was a great opportunity to learn about your traditions.（谢谢你邀请我参加文化活动，这是了解你们传统的好机会。）​​", "（九）问题澄清类（适用于未理解对方意图或信息模糊时）​"], ["I’m not sure about the “key requirements” you talked about. Could you list them out one by one so I can make sure I don’t miss any?（我不太确定你说的 “关键要求” 具体是什么，能逐条列出来吗？这样我能确保不遗漏。）​", "（十）支持提供类（适用于发现对方有困难时主动提供帮助）​"], ["I noticed you’re struggling with the translation of this document. I’m good at English—would you like me to check the translation for you?（我看你在纠结这份文件的翻译，我英语还不错，要我帮你检查下翻译内容吗？）​", "（十一）反馈提供类（适用于需要给对方建议或反馈时）​"], ["Your communication with the client was friendly and professional. One suggestion is to confirm the next steps at the end of the call to avoid confusion later.（你和客户沟通时友好又专业，一个建议是在通话结束时确认后续步骤，避免之后产生误解。）​", "（十二）邀请发起类（适用于邀请对方参与活动或合作时）​"], ["I’m trying to learn more about your country’s traditional festivals—would you mind telling me more about them over a cup of coffee sometime?（我想多了解下你们国家的传统节日，有空一起喝杯咖啡，你给我多讲讲可以吗？）​", "（十三）歉意表达类（适用于自身失误给对方造成影响时）​"], ["I’m sorry I disturbed you during your break. I should have checked if you were free before asking for help.（很抱歉在你休息时打扰你，我应该先确认你是否有空再求助的。）​", "（十四）信息确认类（适用于需要确保信息准确时）​"], ["To make sure I get this right, you want me to follow up with the client next Monday, not this Friday, correct?（为了确保我没弄错，你是想让我下周一跟客户跟进，而不是这周五，对吗？）​", "（十五）鼓励支持类（适用于对方遇到困难或挫折时）​"], ["You’re trying to organize this international event, and there are a lot of details to handle. I’m here to help if you need any support—you’re not alone.（你在努力组织这场国际活动，有很多细节要处理，要是需要支持我随时在，你不是一个人在忙。）​", "（十六）文化分享类（适用于主动分享自身文化，促进双向理解时）​"], ["When greeting elders in my culture, we usually bow slightly to show respect, which is different from shaking hands in some other cultures.（在我的文化中，和长辈打招呼时，我们通常会微微鞠躬表示尊重，这和有些文化里的握手不太一样。）​", "（十七）冲突化解类（适用于沟通中出现分歧或矛盾时）​"], ["I’m sorry if my words made you feel uncomfortable earlier. That wasn’t my intention. Let’s talk calmly about how we can move forward with this task.（要是我之前的话让你不舒服，我很抱歉，我不是故意的。我们冷静聊聊怎么推进这个任务吧。）​", "（十八）时间协调类（适用于需要与对方协调时间安排时）​"], ["We need to meet with the client next week—what time slots are you available, and I’ll check with the client to find a time that works for everyone.（我们下周要和客户见面，你哪些时间段有空，我和客户确认一个大家都方便的时间。）​", "（十九）成果认可类（适用于肯定对方工作或付出时）​"], ["I appreciate your effort in researching the local customs of our new partner country—this information will make our cooperation much smoother.（感谢你努力研究新合作国家的当地习俗，这些信息会让我们的合作顺利很多。）​", "（二十）需求表达类（适用于清晰传达自身需求，避免误解时）​"], ["When scheduling the call with the Australian client, please avoid early morning or late evening their time, as it might be inconvenient for them.（安排与澳大利亚客户的通话时，请避开他们当地的清晨或深夜，因为这可能会给他们带来不便。）​", "（二十一）文化适配类（适用于调整自身行为以适配对方文化时）​"], ["I know direct communication is valued in your culture—should I be more straightforward when sharing my opinions, instead of being too indirect?（我知道你们文化重视直接沟通，分享观点时我是不是应该更直白一点，而不是太委婉呢？）​", "（二十二）问题解决类（适用于遇到跨文化沟通问题时主动寻求解决）​"], ["I want to make sure my email to the international partner is culturally appropriate—could you check it for me and point out any parts that need adjustment?（我想确保给国际合作伙伴的邮件在文化上是合适的，能帮我检查一下，指出需要调整的地方吗？）​", "（二十三）团队协作类（适用于跨文化团队合作中明确分工与配合时）​"], ["Since our team has members from both Eastern and Western cultures, let’s be open to different work styles—some prefer structured plans, while others like flexible approaches.（我们团队有东西方文化背景的成员，要接纳不同的工作风格 —— 有人喜欢结构化计划，有人偏好灵活方式。）​", "（二十四）文化科普类（适用于主动向对方科普自身文化，减少误解时）​"], ["In Chinese business culture, exchanging business cards with both hands is a sign of respect—it’s also polite to read the card briefly after receiving it, instead of putting it away immediately.（在中国商务文化中，双手递名片是尊重的表现，接过名片后简单看一下再收好，而不是马上放起来，也是礼貌的做法。）​", "（二十五）应急应对类（适用于突发跨文化沟通失误时快速补救）​"], ["I just noticed my tone was too direct when we talked—please don’t take it the wrong way. I was in a hurry to share my thoughts, but I should have been more polite.（刚发现聊天时语气太直接了，请别误会。我只是急于分享想法，但应该更礼貌一些的。）​", "（二十六）长期学习类（适用于持续提升跨文化沟通能力）​"], ["Are there any cultural events or festivals in your country that I could attend online to learn more about your customs?（你们国家有什么文化活动或节日我可以在线参加，以了解更多习俗吗？）​", "（二十七）跨文化沟通核心原则类（适用于总结关键技巧，长期践行）​"], ["Flexibility allows smoother cross-cultural collaboration—adjust your communication style or work habits appropriately to adapt to others’ cultural preferences, without compromising your own core values.", "灵活性让跨文化协作更顺畅 —— 适当调整沟通风格或工作习惯以适应他人文化偏好，同时不违背自身核心原则。"]];window.__KEY__="830全英跨文化交流无非就这500句，足够了";window.__TITLE__="8.30全英跨文化交流无非就这500句，足够了";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
