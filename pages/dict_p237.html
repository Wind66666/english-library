追踪："], ["Yes, I use a fitness tracker to monitor my workouts and sleep patterns. 是的，我使用健身追踪器来监测我的锻炼和睡眠模式。", "自我护理与健康习惯："], ["I'd like to drink more water throughout the day. 我想在一天中喝更多的水。", "健康信息获取："], ["I read health blogs and follow updates from reputable health organizations. 我阅读健康博客，并关注来自可靠健康组织的更新。", "接待客人闲谈 - 文化交流"], ["How do you usually celebrate Christmas? 你们通常怎么庆祝圣诞节？", "语言学习："], ["Do you think English is difficult to learn? 你觉得英语难学吗？", "传统艺术："], ["What kind of traditional handicrafts are popular in your area? 你们当地流行什么样的传统手工艺品？", "接待客人闲谈 - 热门话题讨论"], ["With the development of 5G, do you think it will bring big changes to our daily lives? 随着 5G 的发展，你觉得它会给我们的日常生活带来巨大变化吗？", "环境保护："], ["How can we, as individuals, contribute more to environmental protection? 作为个人，我们怎样才能为环境保护做出更多贡献？", "教育体系："], ["Are there any special educational programs or extracurricular activities in your schools? 你们学校有什么特殊的教育项目或课外活动吗？", "接待客人闲谈 - 未来计划"], ["Are you planning to learn any new skills or hobbies in the future? 你未来打算学习新技能或培养新爱好吗？", "职业规划："], ["If you could change one thing about your current job, what would it be? 如果你可以改变你目前工作的一件事，你会改变什么？", "旅行计划："], ["Are you interested in a cultural - immersion trip or a more relaxing beach vacation? 你对文化沉浸式旅行还是更放松的海滩度假感兴趣？", "接待客人闲谈 - 流行文化"], ["Do you have a favorite actor or actress from Hollywood or other film industries? 你有没有喜欢的好莱坞或其他电影行业的演员？", "音乐与演唱会："], ["What kind of music do you like to listen to when you're working out or relaxing? 你在锻炼或放松的时候喜欢听什么类型的音乐？", "社交媒体与网络文化："], ["Have you ever participated in any online challenges? They can be really fun. 你参加过网络挑战吗？它们很有趣。", "接待客人闲谈 - 社会生活"], ["How's the public transportation system in your hometown? Is it convenient? 你家乡的公共交通系统怎么样？方便吗？", "乡村生活："], ["Are there any unique agricultural products or local specialties in the rural areas of your country? 你们国家的农村地区有什么独特的农产品或地方特产吗？", "社交与人际关系："], ["Do you have a close - knit group of friends? How often do you hang out together? 你有一群亲密的朋友吗？你们多久一起出去玩一次？", "接待客人闲谈 - 人生感悟"], ["If you could give your younger self one piece of advice, what would it be? 如果你能给年轻时的自己一条建议，会是什么？", "梦想与追求："], ["Do you have any bucket - list items that you're eager to cross off? 你有什么人生必做清单上的事情渴望去完成吗？", "幸福与快乐："], ["Do you think happiness comes from material possessions or from relationships and experiences? 你觉得幸福来自物质财富，还是人际关系和经历？", "接待客人闲谈 - 时尚与美容"], ["I've noticed that street fashion has a big influence on the overall style. What's the street fashion like in your city? 我发现街头时尚对整体风格影响很大。你们城市的街头时尚是什么样的？", "美容护肤"], ["In your culture, are there any traditional beauty secrets passed down through generations? 在你们的文化中，有没有代代相传的传统美容秘诀？", "个人风格"], ["Accessories can really enhance an outfit. What's your favorite accessory to wear? 配饰真的能提升整体穿搭。你最喜欢佩戴的配饰是什么？", "接待客人闲谈 - 消费与购物"], ["In your country, are there any unique shopping festivals or events? 你们国家有独特的购物节或活动吗？", "消费观念"], ["What factors do you consider most when making a purchase, such as price, quality, or brand? 你购物时最看重哪些因素，比如价格、质量还是品牌？", "接待客人闲谈 - 科技与创新"], ["Are you the type of person who always gets the latest tech upgrades as soon as they come out, or do you wait for the price to drop? 你是那种新科技产品一上市就马上升级的人，还是等价格下降再入手？", "接待客人闲谈 - 影视娱乐新视角"], ["When it comes to choosing a book, do you rely on reviews, recommendations from friends, or something else? 挑选书籍的时候，你是依据书评、朋友推荐，还是其他方式呢？", "读书俱乐部与阅读社群"], ["What kind of discussions or activities do you think are most beneficial in a reading group? 你觉得在阅读小组里，什么样的讨论或活动最有意义呢？", "书籍对人生的影响"], ["Can you recall a time when a book provided you with comfort or inspiration during a difficult period? 你能想起在困难时期，哪本书给你带来了慰藉或激励吗？", "接待客人闲谈 - 音乐的多元世界"], ["Do you have a playlist for different occasions, like a workout playlist or a relaxing - at - home playlist? 你会根据不同场合制作歌单吗，比如健身歌单或者居家放松歌单？", "音乐创作与灵感"], ["Have you ever tried writing your own music? It must be an amazing feeling to express yourself through melodies and lyrics. 你尝试过自己创作音乐吗？通过旋律和歌词表达自我，一定是很棒的体验。", "音乐与文化传承"], ["How do you think modern music can incorporate elements of traditional music to keep the cultural heritage alive? 你认为现代音乐怎样融入传统音乐元素，以传承文化遗产呢？", "接待客人闲谈 - 艺术创作与欣赏"], ["When you start an art project, do you have a clear vision in mind from the beginning, or does the idea evolve as you work on it? 当你开始一个艺术项目时，一开始就有清晰的构思，还是在创作过程中逐渐形成想法呢？", "艺术作品的解读"], ["When looking at a famous painting or sculpture, what aspects do you pay attention to first - the subject matter, the use of colors, or the technique? 欣赏一幅名画或雕塑时，你首先关注哪些方面 —— 主题、色彩运用还是创作技巧？", "艺术与生活的融合"], ["Can you think of any public art installations in your city that have become landmarks or conversation starters? 你能想到你们城市里，哪些公共艺术装置成了地标或者热门话题吗？", "接待客人闲谈 - 体育赛事与精神"], ["Have you ever participated in a sports event that had a huge audience? How did it feel? 你有没有参加过有很多观众的体育赛事？感觉如何？", "体育明星的影响力"], ["Have you ever met a famous sports star in person? If so, was it a memorable experience? 你见过著名体育明星本人吗？如果见过，那是难忘的经历吧？", "体育精神的内涵"], ["Can you think of a sports moment that perfectly exemplified the true spirit of sportsmanship? 你能想到哪个体育瞬间完美诠释了真正的体育精神吗？", "接待客人闲谈 - 自然与户外探索"], ["If you could choose one natural wonder in the world to visit again, which one would it be? 如果你能选择世界上一个自然奇观再去游览一次，你会选哪个？", "户外探险经历"], ["Do you prefer solo outdoor adventures or going with a group? Each has its own advantages. 你更喜欢独自户外探险，还是和团队一起？各有各的好处。", "自然保护意识"], ["What role do you think tourism plays in the conservation and destruction of natural landscapes? 你认为旅游业在自然景观的保护和破坏中扮演着什么角色？", "接待客人闲谈 - 科技与未来生活畅想"], ["With the development of electric vehicles, how do you think the energy infrastructure will need to change to support them? 随着电动汽车的发展，你觉得能源基础设施需要如何改变来支持它们？", "科技对生活的全方位影响"], ["What impact do you think emerging technologies like 3D printing will have on our daily lives? 你认为 3D 打印等新兴技术会对我们的日常生活产生什么影响？", "科技伦理探讨"], ["What are your thoughts on the ethical implications of technologies like gene editing? 你对基因编辑等技术的伦理问题有什么看法？", "接待客人闲谈 - 节日与庆典"]];window.__KEY__="接待国外客户接待客人闲谈必备300句(白底蓝字)";window.__TITLE__="接待国外客户接待客人闲谈必备300句(白底蓝字)";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
