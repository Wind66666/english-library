y on schedule: next, we’ll discuss solutions for the top complaint, then confirm the follow-up timeline.", "我们已在客户反馈分析上花费 15 分钟，还剩两个关键点未讨论，为贴合日程请稍微加快节奏：接下来，我们讨论最主要投诉的解决方案，然后确认跟进时间线。"], ["Now that we’ve agreed on the project scope, let’s move to resource allocation—we need to decide which team members will be assigned to each phase, based on the skills we identified earlier.", "既然已就项目范围达成共识，接下来推进资源分配 —— 需根据之前确定的技能要求，决定每个阶段分配哪些团队成员。"], ["Thanks [Name] for walking us through the competitor’s new pricing strategy. Building on that, let’s talk about whether we should adjust our own prices or highlight additional value to stay competitive.", "感谢 [姓名] 带我们梳理竞争对手的新定价策略。在此基础上，我们讨论一下：是应调整自身价格，还是通过突出额外价值保持竞争力？"], ["We’ve covered the first half of the agenda—recapping briefly: we finalized the event date, reviewed the guest list, and identified 3 potential venues. Now, let’s move to the second half: comparing venue costs and confirming the booking.", "我们已完成议程的前半部分 —— 简要回顾：确定了活动日期、审核了嘉宾名单、筛选出 3 个潜在场地。现在推进后半部分：对比场地成本并确认预订。"], ["Now that we’ve addressed the technical issues with the new software, let’s shift our focus to user training—we need to plan when and how to train the team, so they can start using the tool smoothly next week.", "既然已解决新软件的技术问题，接下来把重点转向用户培训 —— 需规划培训的时间和方式，确保团队下周能顺利使用该工具。"], ["Thanks [Name] for sharing the sales performance data for Q3. Building on that, let’s discuss how to replicate the success of the Western region in the other two regions you mentioned were underperforming.", "感谢 [姓名] 分享第三季度的销售业绩数据。在此基础上，关于如何将西部地区的成功经验复制到你提到的另外两个业绩不佳的地区，我们来展开讨论。"], ["We’ve spent 10 minutes brainstorming ideas for the employee engagement activity, and we have a shortlist of 5 options—let’s move to voting now to pick the top 2, then finalize the details for the winner.", "我们已花 10 分钟头脑风暴员工参与活动的方案，筛选出 5 个备选 —— 现在进入投票环节选出前 2 名，然后敲定最终方案的细节。"], ["Now that we’ve reviewed the draft contract with the supplier, let’s move to negotiation priorities—let’s list which terms are non-negotiable (like payment deadlines) and which we can be flexible on (like delivery frequency).", "既然已审核与供应商的合同草案，接下来推进谈判优先级 —— 列出哪些条款不可协商（如付款期限），哪些可灵活调整（如交付频率）。"], ["Thanks [Name] for the update on the team’s workload. Building on that, let’s talk about whether we need to hire a temporary resource to support the busy season, as you mentioned some members are overloaded.", "感谢 [姓名] 同步团队工作量情况。在此基础上，关于是否需要招聘临时人员支持旺季工作（你提到部分成员任务过重），我们来讨论一下。"], ["We’ve covered the risk assessment for the project, and we’ve identified 4 high-priority risks—let’s shift to mitigation plans: for each risk, let’s assign someone to lead the solution and set a timeline to address it.", "我们已完成项目风险评估，确定了 4 个高优先级风险 —— 接下来转向缓解计划：为每个风险分配负责人推进解决方案，并设定处理时间线。"], ["Now that we’ve confirmed the launch date for the new service, let’s move to the communication plan—we need to decide what messages to send to existing clients vs. potential clients, and which channels to use.", "既然已确定新服务的发布日期，接下来推进沟通方案 —— 需确定给现有客户和潜在客户分别传递什么信息，以及使用哪些渠道。"], ["Thanks [Name] for presenting the ideas for the new website design. Building on that, let’s vote on which design direction aligns best with our brand identity, then discuss the timeline for development.", "感谢 [姓名] 展示新网站设计的方案。在此基础上，我们投票选出最符合品牌形象的设计方向，然后讨论开发时间线。"], ["We’ve spent 20 minutes on the budget review, and we’ve adjusted the allocations for marketing and operations—let’s move to the next agenda item: approving the revised budget and confirming who has signing authority.", "我们已花 20 分钟审核预算，调整了营销和运营部门的分配金额 —— 进入下一个议程项：审批修订后的预算，并确认签字权限人。"], ["Now that we’ve addressed the customer complaints about delivery times, let’s shift our focus to preventing future issues—let’s review the current logistics process and identify where we can add checks to ensure on-time delivery.", "既然已解决客户对交付时间的投诉，接下来把重点转向预防未来问题 —— 回顾当前物流流程，找出可增加检查点的环节，确保按时交付。"], ["Thanks [Name] for sharing the results of the employee survey. Building on that, let’s discuss the top concern—lack of professional development opportunities—and brainstorm what training programs we can offer next quarter.", "感谢 [姓名] 分享员工调研结果。在此基础上，我们讨论最主要的关注点 —— 职业发展机会不足，并头脑风暴下季度可提供哪些培训项目。"], ["We’ve covered the first part of the project update—sales and marketing are on track, but operations is slightly delayed. Let’s move to the second part: discussing how to support the operations team to get back on schedule.", "我们已完成项目进展的第一部分 —— 销售和营销进展顺利，但运营略有滞后。进入第二部分：讨论如何支持运营团队回归正轨。"], ["Now that we’ve agreed on the key features for the next app update, let’s move to user testing—we need to decide who our test users will be (existing clients or new users) and how long the testing phase will last.", "既然已就应用下一版本的核心功能达成共识，接下来推进用户测试 —— 需确定测试用户群体（现有客户或新用户），以及测试阶段持续多久。"], ["Thanks [Name] for updating us on the progress of the trade show preparation. Building on that, let’s talk about the promotional materials—we need to confirm if the design team can finish the booth graphics by the deadline you mentioned.", "感谢 [姓名] 同步展会筹备进展。在此基础上，我们讨论宣传物料 —— 需确认设计团队能否在你提到的截止日期前完成展位海报设计。"], ["We’ve spent 15 minutes discussing the pros and cons of in-house vs. outsourced development—let’s move to a decision: who supports in-house, and who supports outsourcing? We’ll go with the majority to keep the meeting on track.", "我们已花 15 分钟讨论内部开发与外包开发的优缺点 —— 进入决策环节：谁支持内部开发，谁支持外包？按多数票决定，确保会议推进。"], ["Now that we’ve reviewed the performance metrics for the customer support team, let’s shift our focus to incentives—we need to decide if we should adjust the bonus structure to reward the top performers you highlighted.", "既然已回顾客户支持团队的绩效指标，接下来把重点转向激励机制 —— 需确定是否调整奖金结构，奖励你提到的表现突出的员工。"], ["Thanks [Name] for explaining the new company policy on remote work. Building on that, let’s discuss how to implement it—we need to create a sign-up process for flexible hours and clarify how to track productivity.", "感谢 [姓名] 解读公司新的远程办公政策。在此基础上，我们讨论如何实施 —— 需设计弹性工时的申请流程，并明确如何跟踪工作效率。"], ["We’ve covered the issues with the current inventory management system, and we’ve identified 3 potential replacements—let’s move to evaluating each option: we’ll compare cost, integration time, and user-friendliness.", "我们已梳理当前库存管理系统的问题，筛选出 3 个潜在替代方案 —— 进入评估环节：对比每个方案的成本、集成时间和易用性。"], ["Now that we’ve confirmed the date for the next team retreat, let’s move to planning the agenda—we need to decide which topics to prioritize (team bonding, strategy alignment, or skill-building) based on the feedback we collected from team members last week.", "既然已确定下次团队团建的日期，接下来推进议程规划 —— 需根据上周从团队成员收集的反馈，确定优先讨论哪些主题（团队凝聚力、战略对齐或技能提升）。"], ["Thanks [Name] for walking us through the legal requirements for the new project. Building on that, let’s assign someone to be responsible for compliance checks—we need to ensure we meet each requirement by the deadlines you outlined.", "感谢 [姓名] 带我们梳理新项目的法律要求。在此基础上，我们分配专人负责合规检查 —— 确保在你列出的截止日期前满足每项要求。"], ["We’ve spent 10 minutes on the brainstorming for the marketing slogan, and we have 3 strong options—let’s move to refining them: let’s adjust the wording to make them more concise, then test which one resonates best with our target audience.", "我们已花 10 分钟头脑风暴营销口号，筛选出 3 个优质方案 —— 进入优化环节：调整措辞使其更简洁，之后测试哪个最能引起目标受众共鸣。"], ["Now that we’ve addressed the delay in the raw material delivery, let’s shift our focus to backup plans—we need to identify 1-2 alternative suppliers in case this issue happens again in the future.", "既然已解决原材料交付延迟的问题，接下来把重点转向备用方案 —— 确定 1-2 家备选供应商，防止未来再次出现此类问题。"], ["Thanks [Name] for sharing the feedback from the beta testers. Building on that, let’s categorize the suggestions: which are must-have changes before launch, and which can be added in the first post-launch update?", "感谢 [姓名] 分享 beta 测试用户的反馈。在此基础上，我们对建议进行分类：哪些是发布前必须修改的，哪些可在发布后的第一次更新中添加？"], ["We’ve covered the first two agenda items—finalizing the project timeline and assigning core team members. Let’s move to the third item: discussing the communication frequency for the project—how often should we hold sync meetings, and who needs to attend?", "我们已完成前两个议程项 —— 确定项目时间线和分配核心团队成员。进入第三个议程项：讨论项目沟通频率 —— 多久开一次同步会，哪些人需要参加？"], ["Let’s start with the sales data from Q3: as you can see on slide 2, online sales increased by 18% compared to Q2, while in-store sales remained stable at 5% growth.", "我们先看第三季度的销售数据：如第 2 页幻灯片所示，线上销售额较第二季度增长 18%，线下门店销售额稳定增长 5%。"], ["I’ll walk you through the key metrics of the marketing campaign—first, the reach: we reached 2 million potential customers across social media, which exceeded our target of 1.5 million.", "我带大家梳理营销活动的核心指标 —— 首先是触达量：社交媒体触达 200 万潜在客户，超过 150 万的目标。"], ["Let’s focus on the customer retention rate: as the graph on slide 4 shows, it dropped from 82% in July to 76% in August—we need to discuss why this happened and how to reverse the trend.", "我们聚焦客户留存率：如第 4 页图表所示，它从 7 月的 82% 降至 8 月的 76%—— 需讨论原因及如何扭转趋势。"], ["I’ll share the highlights of the market research report first: 65% of respondents said they prioritize eco-friendly packaging when buying our products, which is a 10% increase from last year.", "我先分享市场调研报告的重点：65% 的受访者表示购买我们产品时会优先考虑环保包装，较去年增长 10%。"], ["Let’s look at the project progress tracker on slide 3: the design phase is 100% complete, the development phase is 75% done, and the testing phase hasn’t started yet—we’re on track to meet the October 15th deadline.", "看第 3 页的项目进度追踪表：设计阶段 100% 完成，开发阶段 75% 完成，测试阶段尚未开始 —— 我们正按计划推进，可在 10 月 15 日前交付。"], ["I’ll break down the budget allocation for the event: venue rental takes up 35%, catering 25%, promotional materials 20%, and the remaining 20% is reserved for unexpected expenses.", "我拆解活动的预算分配：场地租赁占 35%，餐饮占 25%，宣传物料占 20%，剩余 20% 作为应急备用金。"], ["Let’s focus on the employee productivity data: as you can see in the table on slide 5, teams using the new collaboration tool completed tasks 22% faster than those using the old system—this confirms the tool is effective.", "我们聚焦员工 productivity 数据：如第 5 页表格所示，使用新协作工具的团队完成任务的速度比用旧系统的团队快 22%—— 这证明该工具有效。"], ["I’ll share the key findings from the competitor analysis: our main rival, Company X, launched a new product with 2 additional features, but their price is 15% higher than ours—this gives us a competitive edge in cost.", "我分享竞争对手分析的核心结论：主要竞品 X 公司推出了一款含 2 个额外功能的新产品，但其价格比我们高 15%—— 这让我们在成本上具备竞争优势。"], ["Let’s look at the customer satisfaction survey results: on a scale of 1-10, the average score for our customer support is 8.2, which is 0.5 points higher than last quarter—but the score for delivery speed dropped by 0.3 points.", "看客户满意度调研结果：1-10 分评分中，客户支持平均得分为 8.2，较上季度高 0.5 分，但交付速度得分下降 0.3 分。"], ["I’ll walk you through the website traffic data for September: total visits reached 500,000, with 60% coming from organic search, 25% from social media, and 15% from paid ads—organic search remains our top traffic source.", "我带大家看 9 月的网站流量数据：总访问量达 50 万，其中 60% 来自自然搜索，25% 来自社交媒体，15% 来自付费广告 —— 自然搜索仍是主要流量来源。"], ["Let’s focus on the project cost tracker: as of today, we’ve spent $45,000 of the $60,000 budget—this is 75% of the budget, and we’re 70% through the project, so we’re slightly overspending but still manageable.", "我们聚焦项目成本追踪：截至今日，6 万美元预算已花费 4.5 万美元 —— 占比 75%，而项目进度仅 70%，虽略有超支，但仍在可控范围内。"], ["I’ll share the highlights of the sales team performance report: [Name] achieved 120% of their Q3 target, and the Western region team exceeded their target by 15%—we should recognize these achievements in the next team meeting.", "我分享销售团队业绩报告的重点：[姓名] 完成第三季度目标的 120%，西部地区团队超目标 15%—— 下次团队会议应表彰这些成果。"], ["Let’s look at the user engagement metrics for the app: average session duration increased from 3.5 minutes to 4.2 minutes in August, and daily active users (DAU) grew by 8%—these are positive signs of improved user experience.", "看应用的用户参与度指标：8 月平均会话时长从 3.5 分钟增至 4.2 分钟，日活跃用户（DAU）增长 8%—— 这些都是用户体验提升的积极信号。"], ["I’ll break down the reasons for the budget overrun: material costs increased by 10% due to global supply chain issues, and we spent an extra $3,000 on emergency repairs—these are the two main factors.", "我拆解预算超支的原因：受全球供应链影响，材料成本上涨 10%，且应急维修额外支出 3000 美元 —— 这是两个主要因素。"], ["Let’s focus on the market share data: our market share in the North American region rose from 18% to 21% in Q3, while in Europe it stayed flat at 12%—we need to discuss strategies to grow in Europe.", "我们聚焦市场份额数据：第三季度北美地区市场份额从 18% 升至 21%，欧洲地区维持 12% 不变 —— 需讨论欧洲市场的增长策略。"], ["I’ll share the key takeaways from the employee engagement survey: 70% of employees said they feel valued for their work, but 45% mentioned a lack of flexible work options—this is an area we need to improve.", "我分享员工参与度调研的核心结论：70% 的员工表示工作得到认可，但 45% 提到缺乏灵活工作选择 —— 这是需改进的领域。"], ["Let’s look at the project timeline dashboard: the testing phase was supposed to start on September 1st, but it’s delayed by a week because the development team needed extra time to fix bugs—we’ve adjusted the launch date to October 22nd.", "看项目时间线仪表盘：测试阶段原计划 9 月 1 日开始，因开发团队需额外时间修复漏洞，延迟一周 —— 已将发布日期调整为 10 月 22 日。"], ["I’ll walk you through the customer complaint data: 30% of complaints are about delayed deliveries, 25% about product defects, and 45% about unclear return policies—delays and returns are our top priorities to address.", "我带大家看客户投诉数据：30% 的投诉关于交付延迟，25% 关于产品缺陷，45% 关于退换货政策不清晰 —— 延迟和退换货是首要解决的问题。"], ["Let’s focus on the ROI of the marketing campaign: we spent $20,000 on the campaign, and it generated $80,000 in additional sales—this gives us an ROI of 300%, which exceeds our target of 250%.", "我们聚焦营销活动的投资回报率（ROI）：活动支出 2 万美元，带来 8 万美元额外销售额 ——ROI 达 300%，超过 250% 的目标。"], ["I’ll share the highlights of the supplier performance report: Supplier A delivered 98% of orders on time, while Supplier B only had a 75% on-time delivery rate—we may need to renegotiate terms with Supplier B.", "我分享供应商绩效报告的重点：供应商 A 的订单准时交付率为 98%，供应商 B 仅为 75%—— 可能需与供应商 B 重新协商条款。"], ["Let’s look at the website conversion rate data: the conversion rate for the product page increased from 2.5% to 3.2% after we updated the product descriptions, but the checkout page conversion rate dropped by 0.4%—we need to fix the checkout process.", "看网站转化率数据：更新产品描述后，产品页转化率从 2.5% 升至 3.2%，但结账页转化率下降 0.4%—— 需优化结账流程。"], ["I’ll break down the team workload distribution: the design team is working at 90% capacity, the development team at 85%, and the marketing team at 70%—we can reallocate some tasks from design to marketing to balance the load.", "我拆解团队工作量分配：设计团队工作量饱和率 90%，开发团队 85%，营销团队 70%—— 可将部分设计任务转移给营销团队，平衡工作量。"], ["Let’s focus on the product usage data: 60% of users regularly use Feature A, 35% use Feature B, and only 5% use Feature C—we may consider removing Feature C in the next update to simplify the product.", "我们聚焦产品使用数据：60% 的用户经常使用功能 A，35% 使用功能 B，仅 5% 使用功能 C—— 下次更新可考虑移除功能 C，简化产品。"], ["I’ll share the key findings from the industry trend report: 80% of industry leaders are investing in AI-powered customer support, and 65% are expanding their online sales channels—these are trends we should follow.", "我分享行业趋势报告的核心结论：80% 的行业领导者在投资 AI 客服，65% 在拓展线上销售渠道 —— 这些是我们应跟进的趋势。"], ["Let’s look at the project risk assessment matrix: the risk of supplier delays is rated “high” (impact: 8/10, likelihood: 7/10), and the risk of budget overrun is “medium” (impact: 6/10, likelihood: 5/10)—we need to prioritize mitigating supplier delays.", "看项目风险评估矩阵：供应商延迟风险为 “高”（影响：8/10，可能性：7/10），预算超支风险为 “中”（影响：6/10，可能性：5/10）—— 需优先缓解供应商延迟风险。"], ["I’ll walk you through the sales forecast for Q4: based on current trends and upcoming promotions, we expect to reach $500,000 in sales, which is a 10% increase from Q3—this aligns with our annual target.", "我带大家看第四季度销售预测：基于当前趋势和即将开展的促销活动，预计销售额达 50 万美元，较第三季度增长 10%—— 符合年度目标。"], ["Let’s focus on the employee turnover data: the turnover rate in the customer support team is 15%, which is higher than the company average of 8%—we need to investigate why and improve retention strategies for this team.", "我们聚焦员工流失数据：客户支持团队流失率 15%，高于公司 8% 的平均水平 —— 需调查原因并改进该团队的留存策略。"], ["I’ll share the highlights of the client feedback report: 90% of clients are satisfied with our product quality, but 30% mentioned that our response time to inquiries is too slow—we need to speed up client communication.", "我分享客户反馈报告的重点：90% 的客户对产品质量满意，但 30% 提到咨询响应速度太慢 —— 需加快客户沟通效率。"], ["Let’s look at the marketing channel performance data: Instagram ads have a click-through rate (CTR) of 2.1%, Facebook ads 1.5%, and Google Ads 1.8%—Instagram is our most effective ad channel right now.", "看营销渠道绩效数据：Instagram 广告点击率（CTR）2.1%，Facebook 广告 1.5%，Google 广告 1.8%——Instagram 是目前最有效的广告渠道。"], ["I’ll break down the cost of the new software implementation: the software license costs $10,000, training $3,000, and integration with existing systems $5,000—total cost is $18,000, which is within the approved budget of $20,000.", "我拆解新软件实施的成本：软件许可 1 万美元，培训 3000 美元，与现有系统集成 5000 美元 —— 总成本 1.8 万美元，在 2 万美元的批准预算内。"], ["Let’s focus on the project milestone achievements: we completed Milestone 1 (design approval) on August 15th (on time), Milestone 2 (development kickoff) on August 20th (3 days early), and Milestone 3 (beta version release) is scheduled for September 30th.", "我们聚焦项目里程碑完成情况：里程碑 1（设计审批）于 8 月 15 日准时完成，里程碑 2（开发启动）于 8 月 20 日提前 3 天完成，里程碑 3（beta 版本发布）计划 9 月 30 日完成。"], ["I’ll share the key takeaways from the sustainability report: we reduced plastic waste by 25% this year, but our carbon emissions from shipping increased by 8%—we need to switch to eco-friendly shipping methods.", "我分享可持续发展报告的核心结论：今年塑料废弃物减少 25%，但运输碳排放增加 8%—— 需改用环保运输方式。"], ["Let’s look at the user retention data for the app: 70% of users return 1 day after download, 40% return 7 days later, and 20% return 30 days later—we need to improve the 30-day retention rate with targeted content.", "看应用的用户留存数据：下载后 1 天留存率 70%，7 天留存率 40%，30 天留存率 20%—— 需通过针对性内容提升 30 天留存率。"], ["I’ll walk you through the budget variance report: the marketing department spent $2,000 less than budgeted (due to canceled ads), and the operations department spent $1,500 more (due to emergency repairs)—the overall budget is still on track.", "我带大家看预算差异报告：营销部门支出比预算少 2000 美元（因取消部分广告），运营部门多支出 1500 美元（因应急维修）—— 整体预算仍在可控范围内。"], ["Let’s focus on the market demand data: demand for our premium product line increased by 30% in Q3, while demand for the basic line decreased by 10%—we may need to adjust production to meet the shift in demand.", "我们聚焦市场需求数据：第三季度高端产品线需求增长 30%，基础产品线需求下降 10%—— 需调整生产以适应需求变化。"], ["I’ll share the highlights of the team training report: 85% of employees completed the mandatory software training, and 90% of those who completed it said the training improved their work efficiency—we’ll follow up with the remaining 15% next week.", "我分享团队培训报告的重点：85% 的员工完成了必修软件培训，其中 90% 的人表示培训提升了工作效率 —— 下周将跟进剩余 15% 的员工。"], ["Let’s look at the customer lifetime value (CLV) data: customers acquired through referral programs have a CLV of $500, which is 25% higher than those acquired through paid ads ($400)—this shows referrals are a more valuable acquisition channel.", "看客户终身价值（CLV）数据：通过推荐计划获取的客户 CLV 为 500 美元，比通过付费广告获取的客户（400 美元）高 25%—— 这表明推荐是更有价值的获客渠道。"], ["I’ll break down the event attendance data: we had 200 registered attendees, 160 showed up (80% attendance rate), and 60% of attendees said they’re interested in our new product—this is a strong conversion signal.", "我拆解活动出席数据：注册人数 200 人，实际到场 160 人（出席率 80%），60% 的出席者表示对我们的新产品感兴趣 —— 这是强烈的转化信号。"], ["Let’s focus on the project quality metrics: the number of defects found in the development phase decreased from 15 to 8 this quarter, and the defect fix rate improved from 70% to 95%—these changes reflect better quality control.", "我们聚焦项目质量指标：本季度开发阶段发现的缺陷数从 15 个降至 8 个，缺陷修复率从 70% 提升至 95%—— 这些变化体现了质量控制的改善。"], ["I’ll share the key findings from the pricing sensitivity survey: 60% of respondents said they’d still buy our product if we raised the price by 5%, but only 30% would buy if we raised it by 10%—this tells us our price elasticity is low for small increases.", "我分享价格敏感度调研的核心结论：60% 的受访者表示若我们提价 5% 仍会购买产品，但仅 30% 的人会接受 10% 的提价 —— 这表明小幅提价时，我们的价格弹性较低。"], ["Let’s do a quick recap of today’s meeting: we finalized the Q4 product launch date as November 15th, assigned [Name] to lead the marketing campaign, and agreed to cut the budget for promotional giveaways by 10%.", "快速总结今日会议：我们确定第四季度产品发布日期为 11 月 15 日，指派 [姓名] 主导营销活动，并同意将宣传赠品预算削减 10%。"], ["To summarize the key decisions we made: first, we’ll switch to Supplier B for raw materials to reduce costs; second, we’ll extend the testing phase by one week to fix critical bugs; third, we’ll hold a stakeholder review on October 5th.", "总结我们做出的核心决策：第一，改用供应商 B 采购原材料以降低成本；第二，将测试阶段延长一周以修复关键漏洞；第三，10 月 5 日召开利益相关方评审会。"], ["Let’s wrap up with the main takeaways: the client approved the revised proposal but requested two minor changes; we need to submit the final version by Friday; and [Name] will coordinate with the design team to update the visuals.", "用核心结论收尾：客户已批准修订后的提案，但要求两处小幅修改；我们需在周五前提交最终版本；[姓名] 将协调设计团队更新视觉素材。"], ["To recap briefly: we reviewed the Q3 sales performance—online sales exceeded targets by 12%, while in-store sales were 5% below; we’ll adjust the in-store promotion strategy next month to boost results.", "简要回顾：我们评审了第三季度销售业绩 —— 线上销售额超目标 12%，线下门店销售额低于目标 5%；下月将调整线下促销策略以提升业绩。"], ["Let’s summarize what we covered today: first, we discussed the employee survey results and identified flexible work options as a top improvement area; second, we agreed to pilot a 4-day workweek in the marketing team; third, we’ll evaluate the pilot in 3 months.", "总结今日讨论内容：第一，我们分析了员工调研结果，确定灵活工作选择是首要改进领域；第二，同意在营销团队试点每周 4 天工作制；第三，将在 3 个月后评估试点效果。"], ["To wrap up the key points: we resolved the production bottleneck by adding a second shift; we set a new daily output target of 500 units; and [Name] will monitor the output for the next two weeks to ensure stability.", "收尾核心要点：我们通过增加第二个班次解决了生产瓶颈；设定新的日产量目标为 500 件；[姓名] 将在未来两周监控产量以确保稳定。"], ["Let’s do a quick recap: we reviewed the competitor’s new pricing strategy and decided not to match their price cuts—instead, we’ll highlight our product’s unique features (like 24/7 support) to retain customers.", "快速回顾：我们分析了竞争对手的新定价策略，决定不跟进其降价 —— 相反，将突出我们产品的独特优势（如 24 小时客服）以留住客户。"], ["To summarize the decisions: we approved the budget for the annual client event ($30,000); we selected Venue A for the event (due to its central location); and we’ll send out invitations to clients by October 1st.", "总结决策：我们批准了年度客户活动预算（3 万美元）；选定场地 A 举办活动（因其地理位置优越）；将在 10 月 1 日前向客户发送邀请函。"], ["Let’s wrap up with what we accomplished: we finalized the action plan for customer complaint resolution—delayed deliveries will be addressed by adding a backup logistics partner, and unclear return policies will be updated by Friday.", "用今日成果收尾：我们敲定了客户投诉解决方案 —— 通过增加备用物流合作伙伴解决交付延迟问题，周五前更新不清晰的退换货政策。"], ["To recap briefly: we discussed the project delay and found the main cause was a delay in supplier material delivery; we’ll renegotiate the delivery terms with the supplier and adjust the project timeline to October 30th.", "简要回顾：我们讨论了项目延迟问题，发现主要原因是供应商原材料交付延迟；将与供应商重新协商交付条款，并将项目时间线调整至 10 月 30 日。"], ["Let’s summarize the key takeaways: the marketing campaign ROI reached 300%, exceeding our target; we’ll scale up the Instagram ad channel (which drove 40% of sales); and we’ll reduce spending on underperforming Facebook ads.", "总结核心结论：营销活动投资回报率达 300%，超出目标；将扩大 Instagram 广告渠道（贡献 40% 销售额）的投入；减少表现不佳的 Facebook 广告支出。"], ["To wrap up the meeting’s decisions: first, we’ll hire a temporary designer to support the Q4 workload; second, we’ll move the weekly team sync from Monday to Wednesday; third, we’ll review the budget again in two weeks.", "收尾会议决策：第一，招聘临时设计师支持第四季度工作；第二，将每周团队同步会从周一调整至周三；第三，两周后再次评审预算。"], ["Let’s do a quick recap: we reviewed the user feedback for the new app update—80% of users liked the new UI, but 30% complained about the login speed; the dev team will fix the login issue in the next patch.", "快速回顾：我们评审了新应用更新的用户反馈 ——80% 的用户喜欢新界面，但 30% 的人抱怨登录速度慢；开发团队将在下个补丁中修复登录问题。"], ["To summarize what we covered: we talked about the sustainability initiative and agreed to replace all plastic packaging with paper by January 1st; we’ll assign [Name] to track the packaging transition progress.", "总结讨论内容：我们讨论了可持续发展计划，同意在 1 月 1 日前将所有塑料包装更换为纸质包装；指派 [姓名] 跟踪包装更换进度。"], ["Let’s wrap up the key points: the client requested a 10% discount on the next order; we agreed to the discount but only if they sign a 6-month contract; [Name] will draft the revised contract by Wednesday.", "收尾核心要点：客户要求下一笔订单享受 10% 折扣；我们同意折扣，但前提是他们签订 6 个月合同；[姓名] 将在周三前起草修订后的合同。"], ["To recap briefly: we evaluated the three potential vendors and selected Vendor C based on their lower cost and faster delivery time; we’ll send the purchase order to Vendor C by the end of today.", "简要回顾：我们评估了三家潜在供应商，基于成本更低、交付更快的优势选择了供应商 C；今日结束前将向供应商 C 发送采购订单。"], ["Let’s summarize the decisions made today: we’ll extend the employee training program from 2 days to 3 days to cover new software; we’ll hold the next training session in mid-October; [Name] will coordinate with the training provider.", "总结今日决策：将员工培训计划从 2 天延长至 3 天，以涵盖新软件内容；下次培训将于 10 月中旬举办；[姓名] 将与培训机构协调。"], ["To wrap up with main takeaways: the market research showed a growing demand for eco-friendly products in Asia; we’ll launch a limited-edition eco-line in the Asian market next quarter; the marketing team will draft the launch plan by Friday.", "用核心结论收尾：市场调研显示亚洲市场对环保产品需求增长；下季度将在亚洲市场推出限量版环保产品线；营销团队将在周五前起草发布计划。"], ["Let’s do a quick recap: we discussed the team workload and reallocated three tasks from the overloaded design team to the marketing team; we’ll check in on the workload balance in one week to make adjustments if needed.", "快速回顾：我们讨论了团队工作量，将设计团队（任务过重）的三项任务重新分配给营销团队；一周后将检查工作量平衡情况，必要时进行调整。"], ["To summarize the meeting: we finalized the agenda for the upcoming industry conference—[Name] will present our new product on Day 1, and we’ll host a booth on Day 2; we’ll confirm the booth design by October 8th.", "总结会议：敲定了即将到来的行业会议议程 ——[姓名] 将在第一天展示我们的新产品，第二天我们将设展位；10 月 8 日前确认展位设计。"], ["Let’s clarify the action items from today’s meeting: first, [Name] will share the meeting minutes with everyone by EOD today; second, [Name] will follow up with the client on the proposal feedback by Wednesday; third, [Name] will draft the budget adjustment plan by Friday.", "明确今日会议的行动项：第一，[姓名] 今日下班前向所有人分享会议纪要；第二，[姓名] 周三前跟进客户的提案反馈；第三，[姓名] 周五前起草预算调整计划。"], ["To list out the next steps and owners: [Name] is responsible for updating the project timeline to reflect the new launch date (due Monday); [Name] will coordinate with the supplier to confirm material delivery (due Tuesday); [Name] will schedule the user testing session (due Wednesday).", "列出下一步行动及责任人：[姓名] 负责更新项目时间线以体现新发布日期（截止周一）；[姓名] 协调供应商确认材料交付（截止周二）；[姓名] 安排用户测试会议（截止周三）。"], ["Let’s assign clear tasks and deadlines: first, [Name] will revise the marketing materials to include the new product features (due Thursday); second, [Name] will send the revised materials to the client for approval (due Friday); third, [Name] will track the client’s approval status next week.", "分配明确的任务及截止日期：第一，[姓名] 修订营销材料，加入新产品功能（截止周四）；第二，[姓名] 将修订后的材料发送给客户审批（截止周五）；第三，[姓名] 下周跟踪客户审批进度。"], ["To confirm the action items: [Name] will conduct a follow-up call with the beta testers to collect detailed feedback (by October 5th); [Name] will analyze the feedback and compile a report (by October 7th); [Name] will present the report in our next meeting (October 10th).", "确认行动项：[姓名] 与 beta 测试用户进行跟进电话，收集详细反馈（10 月 5 日前）；[姓名] 分析反馈并整理报告（10 月 7 日前）；[姓名] 在下次会议（10 月 10 日）上展示报告。"], ["Let’s outline who’s doing what and when: [Name] will renegotiate the contract terms with Supplier B to reduce delivery time (by next Monday); [Name] will review the revised contract for legal compliance (by next Tuesday); [Name] will sign and send the contract (by next Wednesday).", "明确任务、责任人及时间：[姓名] 与供应商 B 重新协商合同条款以缩短交付时间（下周一前）；[姓名] 审核修订后的合同是否合规（下周二前）；[姓名] 签署并发送合同（下周三前）。"], ["To list the action items with owners and deadlines: first, [Name] will update the employee handbook to reflect the new remote work policy (due October 12th); second, [Name] will send the updated handbook to all employees (due October 15th); third, [Name] will host a Q&A session to explain the policy (October 18th).", "列出含责任人及截止日期的行动项：第一，[姓名] 更新员工手册以体现新远程办公政策（10 月 12 日前）；第二，[姓名] 将更新后的手册发送给所有员工（10 月 15 日前）；第三，[姓名] 举办问答会解读政策（10 月 18 日）。"], ["Let’s clarify the next steps: [Name] will collect the sales data from all regions to compile the Q3 performance report (by this Friday); [Name] will analyze the report to identify underperforming regions (by next Monday); [Name] will draft improvement strategies for those regions (by next Wednesday).", "明确下一步行动：[姓名] 收集各地区销售数据，整理第三季度业绩报告（本周五前）；[姓名] 分析报告，找出业绩不佳的地区（下周一前）；[姓名] 为这些地区起草改进策略（下周三前）。"], ["To assign tasks and set deadlines: [Name] will design the booth graphics for the trade show (due October 20th); [Name] will order the promotional materials (pamphlets, pens) based on the booth design (due October 22nd); [Name] will coordinate the delivery of materials to the trade show venue (due October 25th).", "分配任务并设定截止日期：[姓名] 设计展会展位海报（10 月 20 日前）；[姓名] 根据展位设计订购宣传物料（手册、笔）（10 月 22 日前）；[姓名] 协调物料运送到展会场地（10 月 25 日前）。"], ["Let’s confirm who’s responsible for what: [Name] will follow up with the IT team to fix the software glitch affecting the customer portal (by end of day today); [Name] will send a notification to customers to inform them of the fix (by tomorrow morning); [Name] will monitor the portal for further issues (for the next 3 days).", "确认责任人：[姓名] 跟进 IT 团队，修复影响客户门户的软件故障（今日下班前）；[姓名] 向客户发送通知，告知故障已修复（明日上午前）；[姓名] 监控门户是否有其他问题（未来 3 天）。"], ["To list the action items from today’s discussion: first, [Name] will draft a proposal for the new customer loyalty program (due next Thursday); second, [Name] will present the proposal to the leadership team (October 20th); third, [Name] will adjust the proposal based on leadership feedback (by October 23rd).", "列出今日讨论的行动项：第一，[姓名] 起草新客户会员计划提案（下周四前）；第二，[姓名] 向领导团队展示提案（10 月 20 日）；第三，[姓名] 根据领导反馈调整提案（10 月 23 日前）。"], ["Let’s outline the next steps with owners: [Name] will conduct a survey among employees to collect feedback on the current team structure (by October 10th); [Name] will analyze the survey results and identify areas for adjustment (by October 13th); [Name] will share the analysis in our next team meeting (October 15th).", "明确含责任人的下一步行动：[姓名] 在员工中开展调研，收集对当前团队架构的反馈（10 月 10 日前）；[姓名] 分析调研结果，找出需调整的领域（10 月 13 日前）；[姓名] 在下次团队会议（10 月 15 日）上分享分析结果。"], ["To assign clear action items and deadlines: [Name] will contact three potential venues to get quotes for the annual team retreat (by next Tuesday); [Name] will compare the quotes and select a venue (by next Thursday); [Name] will book the venue and send a confirmation to the team (by next Friday).", "分配明确的行动项及截止日期：[姓名] 联系三家潜在场地，获取年度团队团建的报价（下周二前）；[姓名] 对比报价并选择场地（下周四前）；[姓名] 预订场地并向团队发送确认信息（下周五前）。"]];window.__KEY__="92职场会议控场500句英文句式";window.__TITLE__="9.2职场会议控场500句英文句式";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
