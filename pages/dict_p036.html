trategy.", "●（我们需要分析国内生产总值（GDP）变化对我们产品定价策略的影响。）"], ["The OKR adjustment needs to be approved by the management team before implementation.", "●（目标与关键成果（OKR）调整需经管理团队批准后才能实施。）"], ["Let’s ask for comments from the team members who haven’t spoken yet.", "●（我们听听还没发言的团队成员的意见吧。）"], ["The ROI report will be presented to the board of directors in the next meeting.", "●（投资回报率（ROI）报告将在下次会议中提交给董事会。）"], ["Could you share the customer feedback examples you mentioned? They will help us understand better.", "●（您能分享一下您提到的客户反馈案例吗？这会帮助我们更好地理解。）"], ["The UX design team will hold a workshop next week to collect more improvement suggestions.", "●（用户体验（UX）设计团队将于下周举办研讨会，收集更多改进建议。）"], ["We need to set up a communication group for the project team to share updates in real time.", "●（我们需要为项目团队建立沟通群，实时分享最新进展。）"], ["The CRM system’s data security measures have been upgraded to protect customer information.", "●（客户关系管理（CRM）系统的数据安全措施已升级，以保护客户信息。）"], ["Let’s confirm the deadline for the risk solution again to ensure everyone is on the same page.", "●（我们再确认一下风险解决方案的截止日期，确保所有人达成共识。）"], ["The KPI data will be verified by the finance team to ensure its authenticity.", "●（关键绩效指标（KPI）数据将由财务团队核实，确保真实性。）"], ["Could you explain the steps of the SOP you mentioned? I want to follow them correctly.", "●（您能解释一下您提到的标准作业程序（SOP）的步骤吗？我想正确执行。）"], ["The API test report has been sent to the project manager; we’ll discuss it in the next meeting.", "●（应用程序接口（API）测试报告已发送给项目经理，我们将在下次会议中讨论。）"], ["We need to adjust the marketing strategy based on the latest GDP trend to improve efficiency.", "●（我们需要根据最新的国内生产总值（GDP）趋势调整营销策略，提升效率。）"], ["The OKR progress meeting will be held every Monday morning to track the team’s work.", "●（目标与关键成果（OKR）进度会议将于每周一上午举行，跟踪团队工作情况。）"], ["Let’s end the discussion on this topic here and move to the next one as planned.", "●（我们就此结束这个议题的讨论，按计划进入下一个议题。）"], ["The ROI analysis shows that the new project is worth investing in, so we’ll proceed with it.", "●（投资回报率（ROI）分析表明，这个新项目值得投资，因此我们将推进该项目。）"], ["Coul  to be submitted to the management team by Friday.", "●（关键绩效指标（KPI）目标调整提案需在周五前提交给管理团队。）"], ["Could you turn on the real-time subtitles? It helps non-native English speakers understand better.", "●（您能开启实时字幕吗？这对非英语母语的参会者理解很有帮助。）"], ["The SOP training attendance rate needs to reach 100% to ensure all employees master it.", "●（标准作业程序（SOP）培训的出勤率需达到 100%，确保所有员工都能掌握。）"], ["We need to analyze the impact of the API issue on the project schedule and make adjustments.", "●（我们需要分析应用程序接口（API）问题对项目日程的影响，并做出调整。）"], ["The ROI forecast for the next quarter has been revised based on the latest market data.", "●（基于最新的市场数据，下季度的投资回报率（ROI）预测已修订。）"], ["Let’s schedule a short meeting with the design team to discuss the UX improvement suggestions.", "●（我们安排一次与设计团队的短会，讨论用户体验（UX）改进建议吧。）"], ["The GDP growth rate of our region is higher than the national average, which is beneficial for our business.", "●（我们所在地区的国内生产总值（GDP）增长率高于全国平均水平，这对我们的业务有利。）"], ["The OKR tracking tool has been updated to provide more detailed progress data.", "●（目标与关键成果（OKR）跟踪工具已更新，可提供更详细的进度数据。）"], ["Could you confirm the next meeting time before we end today? It helps everyone arrange their schedules.", "●（在今天会议结束前，您能确认下次会议时间吗？这方便大家安排日程。）"]];window.__KEY__="829成人职场全英会议交流指南1";window.__TITLE__="8.29成人职场全英会议交流指南 原1";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
