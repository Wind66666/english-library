<style>

body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;

a{color:var(--brand);text-decoration:none}

.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;

.item .t:hover{color:#c9d4ff}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.doc{background:rgba(52,211,153,.12);color:#4ecfa0}
.badge.pdf{background:rgba(248,113,113,.12);color:#f08c8c}
.charspill{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px}
.vtoggle{font-size:12px;color:var(--brand);cursor:pointer;user-select:none;font-weight:600}
.vtoggle:hover{text-decoration:underline}
.variants{display:none;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:9px}
.variants.open{display:flex}
.variants a{font-size:12.5px;color:var(--sub)}
.variants a::before{content:"↳ ";color:#4b5580}
.variants a:hover{color:var(--brand)}
.empty{text-align:center;color:var(--sub);padding:60px 0}

/* ---- 阅读页 ---- */
.art-header{background:var(--panel);border-bottom:1px solid var(--line);
padding:28px 16px 24px}
.art-header .back{font-size:13px;color:var(--sub);font-weight:600}
.art-header .back:hover{color:var(--brand)}
.art-header .back::before{content:"← "}
.art-header h1{margin:14px 0 10px;font-size:21px;line-height:1.5;font-weight:800;color:#dfe4f5}
.art-header .src{font-size:12px;color:#5d6479;word-break:break-all}
.art-header .meta{color:var(--sub);margin-top:10px}
.art-header .meta a{color:var(--brand);font-weight:600}
.art-header .meta .note{color:#e8b667}
.content{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:30px 36px;margin-top:20px;font-size:15.5px;
line-height:2.1;white-space:pre-wrap;word-break:break-word;color:#d5dae8}
@media (max-width:600px){.content{padding:20px 16px;border-radius:14px}
.list{grid-template-columns:1fr}header{padding:38px 16px 32px}header h1{font-size:23px}}
/* ---- 默写练习 ---- */
.dict-link{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px;font-weight:600}
.dict-link:hover{background:rgba(139,156,249,.25)}
.dict-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:34px 36px;margin-top:20px}
.dict-center{text-align:center}
.dict-progress{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.dict-progress .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dict-progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b9cf9,#4ecfa0);
border-radius:3px;transition:width .25s ease}
.dict-progress .num{font-size:12.5px;color:var(--sub);white-space:nowrap}
.dict-zh{font-size:21px;font-weight:700;color:#dfe4f5;line-height:1.7;margin:8px 0 26px}
.dict-input{width:100%;padding:14px 16px;font-size:16px;color:var(--ink);
background:var(--panel);border:1.5px solid var(--line);border-radius:12px;outline:none;
transition:border-color .15s ease,box-shadow .15s ease;font-family:inherit}
.dict-input:focus{border-color:#4b5580;box-shadow:0 0 0 3px rgba(139,156,249,.15)}
.dict-input.ok{border-color:#34d399}
.dict-input.bad{border-color:#f08c8c}
.dict-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
cursor:pointer;font-family:inherit;transition:opacity .15s ease}
.btn:hover{opacity:.85}
.btn-main{background:linear-gradient(120deg,#8b9cf9,#6d7ff0);color:#fff}
.btn-ghost{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.dict-fb{margin-top:18px;font-size:15px;line-height:1.9;display:none;
padding:14px 18px;border-radius:12px}
.dict-fb.show{display:block}
.dict-fb.good{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25)}
.dict-fb.near{background:rgba(232,182,103,.10);border:1px solid rgba(232,182,103,.3)}
.dict-fb.wrong{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.25)}
.dict-fb .ans{display:block;color:#dfe4f5;font-weight:600;margin-top:4px}
.dict-big{font-size:17px;font-weight:700;color:#dfe4f5;margin:14px 0 22px;line-height:1.8}
.dict-stats{display:flex;gap:14px;justify-content:center;margin:22px 0 28px;flex-wrap:wrap}
.dict-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 26px;min-width:110px}
.dict-stat b{display:block;font-size:24px;font-weight:800}
.dict-stat span{font-size:12px;color:var(--sub)}
.dict-stat.g b{color:#4ecfa0}.dict-stat.n b{color:#e8b667}.dict-stat.w b{color:#f08c8c}
.dict-wronglist{margin-top:26px;text-align:left}
.dict-wronglist h3{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.dict-wronglist .wp{padding:10px 14px;border:1px solid var(--line);border-radius:10px;
margin-bottom:8px;font-size:13.5px;line-height:1.8}
.dict-wronglist .wp b{color:#f08c8c}
.dict-wronglist .wp span{display:block;color:var(--sub)}
.dict-wronglist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600}
.dict-opt{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap}
.dict-opt label{display:flex;align-items:center;gap:7px;background:var(--panel);
border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13.5px;
cursor:pointer;color:var(--sub)}
.dict-opt input{accent-color:#8b9cf9}
.dict-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dict-chips .chip{cursor:pointer}
.dict-chips .chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
@media (max-width:600px){.dict-wrap{padding:22px 16px}.dict-zh{font-size:18px}}
/* ---- 学习进度 & 归档 ---- */
.pctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:var(--panel);color:#5d6479;
transition:all .12s ease}
.st:hover{opacity:.8}
.st-learning{background:rgba(139,156,249,.16);border-color:rgba(139,156,249,.4);color:#a5b1fb}
.st-done{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.35);color:#4ecfa0}
.arch-btn{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:transparent;color:#5d6479}
.arch-btn:hover{color:var(--sub)}
.arch-btn.on{background:rgba(232,182,103,.13);border-color:rgba(232,182,103,.4);color:#e8b667}
.item.archived{opacity:.5}
.item.archived:hover{opacity:.8}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 0}
.filter-chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;
font-size:12px;padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.filter-chip:hover{border-color:#39415e}
.filter-chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.pbar-outer{max-width:580px;margin:20px auto 0;height:8px;border-radius:4px;
background:var(--panel);border:1px solid var(--line);overflow:hidden}
.pbar-outer i{display:block;height:100%;width:0;border-radius:4px;
background:linear-gradient(90deg,#8b9cf9,#4ecfa0);transition:width .3s ease}
.psum{margin:10px 0 0;font-size:12.5px;color:var(--sub)}
.psum b{color:#c9d4ff;font-weight:600}
footer .io{margin-top:8px}
footer .io a,footer .io label{cursor:pointer;color:#5d6479}
footer .io a:hover,footer .io label:hover{color:var(--brand)}
footer .io input{display:none}
.art-pctrl{margin-top:12px}
.dict-hist{color:#8f96ab;font-size:13px;margin-top:14px}
.dict-hist b{color:#a5b1fb}
/* ---- 复习中心 & 收藏 ---- */
.btn-fav.on{color:#e8b667;border-color:rgba(232,182,103,.45)}
.rtabs{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.rtab{background:var(--panel);border:1px solid var(--line);color:#aab2cc;font-size:13px;
padding:8px 18px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.rtab:hover{border-color:#39415e}
.rtab.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.rsec{display:none}
.rsec.on{display:block}
.rlist{border-top:1px dashed var(--line);padding-top:14px;margin-top:16px}
.rlist .wp{padding:12px 16px;border:1px solid var(--line);border-radius:12px;
margin-bottom:9px;font-size:13.5px;line-height:1.8;background:var(--panel)}
.rlist .wp span{display:block;color:var(--sub)}
.rlist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600;margin-top:2px}
.wp-meta{font-size:11.5px;color:#5d6479;margin-top:7px;display:flex;gap:14px;
align-items:center;flex-wrap:wrap}
.wp-meta b{cursor:pointer;color:#8f96ab;font-weight:600}
.wp-meta b:hover{color:#f08c8c}
.wp-meta .due{color:#e8b667}
.wp-meta .src{opacity:.8;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-hint{text-align:center;color:#5d6479;padding:28px 0;font-size:13.5px}
.chip.rlink{cursor:pointer;transition:all .12s ease}
.chip.rlink:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
/* ---- 阅读页朗读（TTS） ---- */
.content.lines{white-space:normal}
.ln{position:relative;padding:2px 8px 2px 36px;border-radius:6px;line-height:2.1}
.ln .spk{position:absolute;left:6px;top:50%;transform:translateY(-50%);
cursor:pointer;opacity:0;transition:opacity .12s ease;background:none;border:none;
color:#8b9cf9;font-size:14px;padding:2px 4px;line-height:1}
.ln:hover .spk{opacity:.85}
.ln .spk:hover{opacity:1}
.ln.cur{background:rgba(139,156,249,.10)}
.ln.cur .spk{opacity:1}
.ttsbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
margin:-6px 0 18px;font-size:13px;color:var(--sub)}
.ttsbar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}

</style>
</head>

        <button id="btnNext" class="btn btn-main" style="display:none" onclick="next()">下一句（Enter）→</button>
      </div>
      <div id="fb" class="dict-fb"></div>

    <div id="result" style="display:none" class="dict-center">
      <div class="dict-big">🏁 本轮默写完成！</div>
      <div class="dict-stats">
        <div class="dict-stat g"><b id="sg">0</b><span>完全正确</span></div>

      <div class="dict-actions" style="justify-content:center">

      </div>
      <div id="wronglist" class="dict-wronglist"></div>

  </div>

<script>window.__PAIRS__=[["Could you share the latest project timeline with me?", "你能把最新的项目时间表分享给我吗？"], ["Has the testing phase of the project started as scheduled?", "项目的测试阶段是否按计划开始了？"], ["Let’s assess whether we need to adjust the project plan based on the current progress.（我们根据当前进展评估一下是否需要调整项目计划。）​", "（二）催同事进度​"], ["We have a meeting with the client tomorrow to discuss the project. Could you finish your work before then?（我们明天要和客户开会讨论这个项目，你能在那之前完成工作吗？）​", "（三）催问进度​"], ["How close are you to finishing the report we need for the meeting?（你离完成我们会议所需的报告还有多远？）​", "（四）催问项目进度并汇报​"], ["I’m following up on the project progress to report to the client’s project manager; please make sure the information is accurate and up-to-date.（我正在跟进项目进度，以便向客户的项目经理汇报，请确保信息准确且最新。）​", "（五）项目需要延迟​"], ["We have to delay the project launch because the testing phase has revealed more problems than anticipated.", "由于测试阶段发现的问题比预期多，我们不得不延迟项目启动。"], ["Due to the urgent nature of this project, we need to reallocate staff from other teams to support it.（由于这个项目的紧急性，我们需要从其他团队重新调配人员来支持它。）​", "（七）项目没了​"], ["We’ve been told to halt all work on the project as it has been officially canceled by the headquarters.（我们已被告知停止该项目的所有工作，因为总部已正式取消了它。）​", "（八）项目遇到困难​"], ["We’re facing obstacles in implementing the project plan because of regulatory changes.（由于法规变化，我们在实施项目计划方面面临障碍。）​", "二、会议全流程类​"], ["I’ve heard that some team members feel our meetings are unnecessary and could be replaced with an email.", "我听说有些团队成员觉得我们的会议没必要，发一封邮件就能替代"], ["Colleagues have mentioned that our meetings start and end late, disrupting their work schedules.（同事们提到，我们的会议总是迟到早退，打乱了他们的工作安排。）​", "（二）开会超时​"], ["We’ve gone over the scheduled time, so let’s prioritize the key points and save the rest for another meeting.", "我们已经超过预定时间了，所以我们先聚焦重点内容，剩下的留到下次会议再讨论。"], ["We’ve used up all the allocated time. Let’s schedule a follow-up meeting to cover the remaining items.", "我们已经用完了所有分配的时间。我们安排一次后续会议来讨论剩下的内容吧。"], ["We’ve gone past the meeting end time. Let’s agree to discuss the remaining topics via email.（我们已经过了会议结束时间。我们同意通过邮件讨论剩下的话题吧。）​", "（三）会议提前结束​"], ["Since we’ve resolved all the key issues and finalized the action items, let’s wrap up the meeting early today.", "既然我们已经解决了所有关键问题，确定了行动项，今天就提前结束会议吧。"], ["We’ve covered all the urgent matters and the non-urgent ones can be handled later, so let’s wrap up the meeting early.", "我们已经讨论了所有紧急事项，非紧急的可以之后处理，所以提前结束会议吧。"], ["There’s no need to continue the meeting since all agenda items have been addressed, so let’s finish early today.", "既然所有议程项目都已经处理完毕，没必要继续开会了，今天就提前结束吧。"], ["We’ve finished all the planned discussions and there’s no new business to add, so let’s adjourn the meeting early.（我们已经完成了所有计划好的讨论，也没有新的事项要补充，所以提前散会吧。）​", "（四）会议开场白​"], ["Welcome everyone. Today’s meeting is to discuss the progress of the X project and finalize the next steps.", "欢迎大家。今天的会议是为了讨论 X 项目的进展，并确定下一步计划。"], ["To recap the meeting highlights: we received positive feedback from the client, we need to increase the budget for the design phase, and [Name] will lead the new task force.", "回顾会议重点：我们收到了客户的积极反馈，需要增加设计阶段的预算，[姓名] 将领导新的专项小组。"], ["To recap the key decisions: we decided to go with the second design option, extend the project deadline by one month, and allocate additional funds to the development team.", "回顾关键决定：我们决定选择第二个设计方案，将项目截止日期延长一个月，并向开发团队追加资金。"], ["It’s time to start the meeting. Let’s first review the agenda to make sure we cover all the necessary topics today.", "开会时间到了。我们先回顾一下议程，确保今天覆盖所有必要的话题。"], ["Let’s launch into the meeting. First, I’d like to give a quick overview of what we hope to achieve today: finalize the project plan and assign tasks.（我们开始会议吧。首先，我简要介绍一下今天希望达成的目标：确定项目计划并分配任务。）​", "（七）会议邀请​"], ["Please accept this invitation to a budget discussion meeting. It will be held on [Date] at [Time] in Conference Room A, and your input on the budget allocation is crucial.", "请接受这次预算讨论会议的邀请。会议将于 [日期] [时间] 在 A 会议室举行，您对预算分配的意见至关重要。"], ["Please join us for a meeting to plan the upcoming team building activity. It will be on [Date] at [Time] in the break room, and all team members are expected to attend.（请参加我们的会议，计划即将到来的团队建设活动。会议将于 [日期] [时间] 在休息室举行，希望所有团队成员都能参加。", "（八）开会时提问​"], ["Could you clarify who will be responsible for coordinating with the client after the project is delivered?", "你能明确一下项目交付后，谁负责与客户协调吗？"], ["I’m curious about the client’s feedback you mentioned—could you share more details on their main concerns?", "我对您提到的客户反馈很感兴趣，您能分享更多关于他们主要顾虑的细节吗？"], ["Could you confirm if the budget adjustment applies to all parts of the project or just the development phase?", "您能确认预算调整是适用于项目的所有部分，还是只适用于开发阶段吗？"], ["I’m wondering how we’ll measure the success of the new marketing strategy—could you outline the key metrics?", "我想知道我们将如何衡量新营销策略的成功，您能概述一下关键指标吗？"], ["I have a follow-up question: now that we’ve extended the project deadline, will we adjust the milestones accordingly?（我有个后续问题：既然我们已经延长了项目截止日期，我们会相应调整里程碑吗？）​", "（九）结束发言汇报​"], ["To conclude my 汇报，I want to thank the team for their hard work so far—without their effort, we wouldn’t have made this much progress.（结束我的汇报时，我想感谢团队到目前为止的辛勤工作 —— 没有他们的努力，我们不可能取得这么大的进展。）​", "三、汇报相关类"], ["Good afternoon, members of the SLT. My 汇报 today will cover the performance of the sales team across all regions and the steps we’re taking to improve results in underperforming areas.（下午好，高级领导团队的各位成员。我今天的汇报将涵盖销售团队在所有地区的表现，以及我们为改善表现不佳地区业绩所采取的措施。）​", "（二）汇报项目进度​"], ["I’m pleased to report that the project is progressing well—we’ve completed the first three phases ahead of schedule, and the fourth phase will start next week as planned.", "我很高兴地汇报，项目进展顺利 —— 我们已经提前完成了前三个阶段，第四阶段将按计划于下周开始。"], ["The current project progress is as follows: the marketing materials are ready, the website is under final review, and we’re on track to launch the product next month.（当前项目进度如下：营销材料已准备就绪，网站正在进行最终审查，我们有望在下个月推出产品。）​", "（三）汇报业绩变化​"], ["The latest performance changes update: our customer satisfaction score has improved from 85 to 92 this quarter, thanks to the new customer service initiatives we implemented.", "最新的业绩变化更新：本季度我们的客户满意度得分从 85 分提高到了 92 分，这要归功于我们实施的新客户服务举措。"], ["Let’s discuss the performance changes: our return on investment (ROI) has increased by 12% this year, largely because of the successful launch of our new product line.", "我们来讨论一下业绩变化：今年我们的投资回报率（ROI）提高了 12%，这在很大程度上要归功于我们新产品线的成功推出。"], ["The performance changes update: our customer retention rate has decreased by 4% this quarter, so we’re planning to launch a loyalty program to address this issue.", "业绩变化更新：本季度我们的客户留存率下降了 4%，因此我们计划推出一个客户忠诚度计划来解决这个问题。"], ["I’m reporting the performance changes: our operational costs have decreased by 7% this month, thanks to the cost-saving measures we adopted last quarter.（我来汇报业绩变化：由于我们上季度采取的成本节约措施，本月我们的运营成本下降了 7%。）​", "（四）汇报数据​"], ["Let me present the data for the past month: our total sales reached $500,000, with 60% coming from the domestic market and 40% from international markets.", "让我展示过去一个月的数据：我们的总销售额达到了 50 万美元，其中 60% 来自国内市场，40% 来自国际市场。"], ["Let’s discuss the data on market trends: the data from the past six months indicates that the demand for eco-friendly products has increased by 25% in our target market.", "我们来讨论市场趋势数据：过去六个月的数据表明，在我们的目标市场中，对环保产品的需求增长了 25%。"], ["As you’ll notice on this PPT slide, the customer feedback is categorized into positive, neutral, and negative, with examples of each to illustrate their main concerns.", "正如你在这张 PPT 幻灯片上会注意到的，客户反馈分为正面、中性和负面三类，每类都有示例来说明他们的主要顾虑。"], ["To answer your question about the team’s capacity: we’ve assessed the workload, and we have enough resources to take on the new task without delaying existing projects.", "回答您关于团队能力的问题：我们已经评估了工作量，有足够的资源承担新任务，不会延迟现有项目。"], ["Thank you for asking. Regarding the market expansion plan, we’re prioritizing the Southeast Asian market first because of its high growth potential and low entry barriers.", "感谢您的提问。关于市场扩张计划，我们首先将东南亚市场列为优先项，因为它具有高增长潜力和低进入壁垒。"], ["That’s an important question. When it comes to measuring the success of the new initiative, we’ll use a combination of sales growth, customer satisfaction, and cost savings as key metrics.", "这是个重要的问题。关于衡量新举措的成功，我们将结合销售额增长、客户满意度和成本节约作为关键指标。"], ["Thank you for your question. Regarding the impact of the policy change, we’ve analyzed the potential risks and revised our project plan to comply with the new regulations.", "感谢您的提问。关于政策变化的影响，我们已经分析了潜在风险，并修订了项目计划以遵守新规定。"], ["Thank you for asking. Regarding the sustainability of the cost savings, we’ve implemented long-term measures like process optimization, so the savings should be maintained for at least the next two years.（感谢您的提问。关于成本节约的可持续性，我们已经实施了流程优化等长期措施，因此这些节约成果至少在未来两年内应该能保持。）​", "四、方案与反馈类"], ["Honestly, this 方案 isn’t feasible because it requires a significant budget increase, which we can’t approve at the moment.", "说实话，这个方案不可行，因为它需要大幅增加预算，而我们目前无法批准。"], ["I have to say this 方案 is not well-thought-out—it doesn’t account for the potential risks from the regulatory changes.", "我不得不说这个方案考虑不周 —— 它没有考虑到法规变化带来的潜在风险。"], ["I don’t believe this 方案 is suitable because it doesn’t align with the client’s long-term goals we discussed earlier.", "我认为这个方案不合适，因为它与我们之前讨论的客户长期目标不一致。"], ["I have to point out that this 方案 is not effective because it doesn’t address the root cause of the project delays.", "我必须指出，这个方案效果不佳，因为它没有解决项目延迟的根本原因。"], ["This 方案 addresses some important issues, but perhaps we could expand on the contingency plan in case of unexpected delays.（这个方案解决了一些重要问题，但也许我们可以完善应急计划，以防出现意外延迟。）​", "（三）提供反馈​"], ["After reviewing your training plan, my feedback is that the sessions are too long—splitting them into shorter, more frequent workshops would help with employee engagement.", "审阅你的培训计划后，我的反馈是课程时间太长了 —— 将其拆分为更短、更频繁的研讨会会有助于提高员工参与度。"], ["After going through your meeting minutes, my feedback is that the action items should include clear deadlines and responsible parties to ensure follow-up.（浏览你的会议纪要后，我的反馈是行动项应包含明确的截止日期和负责人，以确保后续跟进。）​", "（四）没问题装有问题​"], ["I know the project plan seems solid, but I’m wondering if we’ve considered all possible delays from the supplier—even if they’ve been reliable in the past.", "我知道这个项目计划看起来很完善，但我想知道我们是否考虑了供应商可能出现的所有延迟 —— 即使他们过去一直很可靠。"], ["I know the budget proposal is within the allocated limit, but I’m wondering if we’ve set aside enough contingency funds for unexpected expenses like material price increases.", "我知道预算提案在分配限额内，但我想知道我们是否为材料价格上涨等意外支出预留了足够的应急资金。"], ["The sales report looks accurate, but I’m a bit concerned about whether the data includes all regional offices—maybe we should double-check with the teams in Asia.（销售报告看起来很准确，但我有点担心数据是否包含了所有区域办事处 —— 也许我们应该与亚洲的团队再核对一下。）​", "五、工作规划与优先级类​"], ["Let’s rank the tasks by urgency: the server maintenance is top priority as it needs to be done before the system upgrade tomorrow; the data entry can be scheduled for later.", "我们按紧急程度给任务排序：服务器维护是最高优先级，因为它需要在明天系统升级前完成；数据录入可以安排在之后。"], ["We need to adjust the work priorities: the client emergency request has come in, so we should put the marketing material design on hold and focus on resolving the client’s issue first.", "我们需要调整工作优先级：客户的紧急请求已经到来，所以我们应该暂停营销材料设计，先专注于解决客户的问题。"], ["We need to reorder the work priorities: the regulatory compliance audit is coming up next month, so preparing the required documents should be our top focus, ahead of the marketing campaign planning.（我们需要重新排序工作优先级：监管合规审计下个月就要进行，因此准备所需文件应成为我们的首要重点，优先于营销活动计划。）​", "（二）计划下一步​"], ["Now that we’ve completed the project kickoff meeting, the next step is to assign specific tasks to each team member and share the detailed timeline by the end of today.", "既然我们已经完成了项目启动会议，下一步是为每个团队成员分配具体任务，并在今天结束前分享详细时间表。"], ["After reviewing the client’s feedback, our next step is to revise the proposal to address their concerns about the pricing and send the updated version to them by Wednesday.", "审阅客户反馈后，我们的下一步是修订提案，解决他们对定价的顾虑，并在周三前将更新版本发送给他们。"], ["Now that we’ve identified the root cause of the system error, the next step is to have the IT team fix the bug and conduct a full system test to ensure it doesn’t recur.", "既然我们已经确定了系统错误的根本原因，下一步是让 IT 团队修复漏洞，并进行全面系统测试，确保问题不再复发。"], ["After analyzing the quarterly sales data, our next step is to organize a meeting with the sales team to discuss strategies for improving performance in the underperforming regions.", "分析季度销售数据后，我们的下一步是组织与销售团队的会议，讨论如何提高表现不佳地区的业绩。"], ["After reviewing the training needs of the team, our next step is to design a customized training program and schedule the first session for the beginning of next month.（审阅团队的培训需求后，我们的下一步是设计定制化培训计划，并将第一次培训安排在下月初。）​", "（三）资源分配​"], ["For the client project, we’ll allocate a dedicated project manager to coordinate communication between the team and the client, ensuring timely updates and feedback.", "在客户项目中，我们将分配一名专职项目经理，协调团队与客户之间的沟通，确保及时更新和反馈。"], ["For the event planning project, we’ll allocate 30% of the budget to venue rental, 25% to catering, 20% to marketing and promotion, and 25% to contingency funds.", "在活动策划项目中，我们将把 30% 的预算分配给场地租赁，25% 用于餐饮，20% 用于营销推广，25% 作为应急资金。"], ["For the software update project, we’ll allocate two testers to conduct functional testing and one tester to focus on performance testing, ensuring comprehensive quality checks.", "在软件更新项目中，我们将分配两名测试人员进行功能测试，一名测试人员专注于性能测试，确保全面的质量检查。"], ["We need to allocate the training resources based on team needs: the customer service team will get priority for the communication skills training, and the finance team will attend the financial reporting training next month.（我们需要根据团队需求分配培训资源：客户服务团队将优先参加沟通技巧培训，财务团队将于下个月参加财务报告培训。）​", "六、团队与成员管理类​"], ["I need to acknowledge [Name] for their outstanding work on the data analysis—their report was clear, detailed, and provided valuable insights that helped us adjust our strategy.", "我要表扬 [姓名] 在数据分析方面的出色工作 —— 他的报告清晰、详细，并提供了宝贵的见解，帮助我们调整了战略。"], ["I want to acknowledge [Name] for their proactive approach to identifying risks—they noticed a potential supply chain issue early and took steps to mitigate it, preventing a project delay.（我要表扬 [姓名] 主动识别风险的态度 —— 他及早发现了潜在的供应链问题，并采取措施缓解，避免了项目延迟。）​", "（二）夸人​"], ["I admire [Name]’s leadership skills—they know how to motivate the team, delegate tasks effectively, and keep everyone focused on the project goals.（我钦佩 [姓名] 的领导能力 —— 他知道如何激励团队、有效分配任务，并让每个人都专注于项目目标。）​", "（三）介绍团队成员​"], ["This is [Name], our software developer—they specialize in backend development and have experience working with the programming languages we use for our core systems.", "这位是 [姓名]，我们的软件开发人员 —— 专注于后端开发，在我们核心系统使用的编程语言方面有经验。"], ["This is [Name], our finance coordinator—they will be responsible for managing the project budget, processing expense reports, and providing financial updates to the team.", "这位是 [姓名]，我们的财务协调员 —— 将负责管理项目预算、处理费用报告，并向团队提供财务更新。"], ["This is [Name], our operations manager—they have experience in streamlining processes and improving efficiency, and will be working with the team to optimize our workflow.（这位是 [姓名]，我们的运营经理 —— 在流程优化和效率提升方面有经验，将与团队合作优化我们的工作流程。", "（四）介绍项目新成员​"], ["I’m pleased to introduce [Name] to the budget planning project team—they are a finance analyst and will support the team with budget forecasting and financial data analysis.（我很高兴向预算规划项目团队介绍 [姓名]—— 他是一名财务分析师，将为团队提供预算预测和财务数据分析支持。）​", "七、项目活动与复盘类​"], ["Let’s plan a project celebration event once we complete the first milestone—this will recognize the team’s hard work and boost morale for the next phase.（一旦我们完成第一个里程碑，就计划组织一场项目庆祝活动 —— 这将认可团队的辛勤工作，并为下一阶段提振士气。）​", "（二）组织复盘​"], ["Let’s plan a client-inclusive 复盘 session next month to review the project progress together, address any issues, and align on expectations for the remaining work.", "我们计划在下个月组织一场有客户参与的复盘会议，共同回顾项目进度、解决相关问题，并就剩余工作的预期达成一致。"], ["We need to organize a detailed 复盘 for the software launch to examine the delays, the root causes, and the steps we can take to avoid similar issues in the future.", "我们需要为软件发布组织一场详细的复盘，分析延迟情况、根本原因，以及未来可以采取哪些措施避免类似问题。"], ["Let’s schedule a 复盘 for the team’s performance during the project to recognize individual contributions, address performance gaps, and set development goals for the future.（我们计划为团队在项目中的表现组织一场复盘，认可个人贡献、解决绩效差距，并为未来设定发展目标。）​", "（三）同步进度​"], ["I’ll set up a weekly progress dashboard to sync up the team on the project’s key metrics, such as task completion rate and budget usage.（我会建立一个每周进度仪表板，向团队同步项目的关键指标，如任务完成率和预算使用情况。）​", "八、业绩与问题应对类"], ["I’m aware of the decline in customer satisfaction scores. This is because some of our products had quality issues, and we’ve 加强了 quality control measures to address this.", "我知道客户满意度得分下降了。这是因为我们的部分产品存在质量问题，我们已加强质量控制措施来解决这个问题。"], ["Regarding the decline in sales in the European market, we’ve identified that it’s due to currency fluctuations and local regulatory changes—we’re adjusting our pricing strategy to adapt.（关于欧洲市场销售额下降的问题，我们已确定是由于汇率波动和当地法规变化导致的 —— 我们正在调整定价策略以适应。）​", "（二）炫耀成果​"], ["Our project was recognized as the “Most Innovative Project” by the company—this is a great achievement considering the tight timeline and limited resources we had.", "我们的项目被公司评为 “最具创新性项目”—— 考虑到我们面临的紧张时间表和有限资源，这是一项了不起的成就。"], ["I’m proud to announce that the data analysis report we prepared helped the company make a strategic decision that will increase annual revenue by an estimated $1 million.", "我很自豪地宣布，我们准备的数据分析报告帮助公司做出了一项战略决策，预计将使年收入增加 100 万美元。"], ["Our team successfully expanded into the Asian market and secured five new clients in just three months—this is a major milestone for our company’s global expansion plan.（我们团队在短短三个月内成功进入亚洲市场，并获得了五个新客户 —— 这是我们公司全球扩张计划的重要里程碑。）​", "（三）我错了​"], ["I’m sorry for making a mistake in the budget calculation. I overlooked some of the hidden costs, and I’ve corrected the report and will double-check all data in the future.", "我为预算计算中的错误道歉。我忽略了一些隐性成本，我已经更正了报告，并将在未来仔细核对所有数据。"], ["I’m sorry for not adhering to the project timeline. I prioritized less urgent tasks, and I’ve adjusted my work plan to focus on the critical tasks first and will update the team on my progress daily.（我为没有遵守项目时间表道歉。我优先处理了不太紧急的任务，现在已调整工作计划，先聚焦关键任务，并将每天向团队更新我的进度。）​", "九、沟通与互动场景类"], ["Do you have some time available next Tuesday afternoon? I’d like to meet with you to discuss the details of the client project.", "你下周二下午有空吗？我想和你见面讨论一下客户项目的细节。"], ["I’d like to meet with you to talk about the team’s workload. Are you available this Friday morning or next Monday afternoon?", "我想和你见面谈谈团队的工作量。你本周五上午或下周一下午有空吗？"], ["Could we meet for a quick chat early next week? I want to update you on the client’s latest requirements and see how we should adjust our approach.（我们能在下周初快速见个面聊聊吗？我想向你更新客户的最新要求，并探讨我们应该如何调整方法。）​", "（二）见面闲聊​"], ["Have you tried the new team-building activity the company organized last month? I heard it was a lot of fun.（你参加上个月公司组织的新团队建设活动了吗？我听说特别有趣。）​", "（三）下班前尬聊​"], ["Before we go, do you know if the office will be open this Saturday? I need to come in to pick up some documents.", "下班前问一下，你知道这周六办公室开门吗？我需要来拿一些文件。"], ["Time to pack up! Did you have a chance to check the meeting agenda for tomorrow? I think we have an early meeting.（该收拾东西了！你有时间看明天的会议议程吗？我记得我们有个早会。）​", "（四）没听清楚对方​"], ["I’m sorry, the background noise is a bit loud. Could you speak a little louder when talking about the budget allocation?", "抱歉，背景噪音有点大。你在说预算分配的时候能大声一点吗？"], ["The connection seems a bit spotty. Could you repeat the details about the training session, like the time and location?", "信号好像不太好。你能再重复一下培训课程的细节，比如时间和地点吗？"], ["I’m sorry, I didn’t hear clearly which team member is responsible for the design task. Could you confirm that again?（抱歉，我没听清哪个团队成员负责设计任务。你能再确认一下吗？）​", "十、技术与设备问题​"], ["I’m having trouble with the network—it’s really lagging. Could you check if there’s an issue with the office Wi-Fi?", "我的网络出问题了，特别卡。你能检查一下办公室的 Wi-Fi 是不是有问题吗？"], ["The network is so unstable—it keeps disconnecting every few minutes. I can’t get any work done. What should I do?", "网络太不稳定了，每隔几分钟就断一次。我根本没法工作。该怎么办呀？"], ["The internet connection is very spotty right now. I keep getting kicked out of the video call. Does anyone have a solution?", "现在网络连接特别不稳定，我老是被踢出视频会议。有人有解决办法吗？"], ["The network is lagging heavily, which is affecting my ability to collaborate with the team on the shared document. Could we wait until the network is fixed or switch to an offline version?（网络特别卡，影响我和团队在共享文档上的协作。咱们是等网络修好，还是切换到离线版本呢？）​", "（二）分享屏幕出问题​"], ["I can share my screen with most people, but one team member says they can’t see anything. Could it be an issue with their device, or should I check my settings again?", "我能和大多数人分享屏幕，但有一个团队成员说他们什么都看不到。是他们设备的问题，还是我需要再检查一下我的设置呢？"], ["The screen sharing is working, but there’s a delay between my actions and what the attendees see. It’s making the presentation hard to follow. How can I reduce the delay?（屏幕共享能正常进行，但我的操作和参会人员看到的内容之间有延迟，导致演示很难跟上。怎么才能减少延迟呢？）​", "（三）处理声音延时​"], ["I’ve noticed that the sound delay gets worse when more people join the online meeting. Is there a way to optimize the audio settings to handle more attendees?", "我发现线上会议加入的人越多，声音延时就越严重。有没有办法优化音频设置，以应对更多参会人员呢？"], ["The sound delay is affecting the Q&A session—by the time the client hears my answer, they’ve already moved on to the next question. Can we take a short break to troubleshoot the audio?（声音延时影响了问答环节，等客户听到我的回答时，他们已经转到下一个问题了。我们能短暂休息一下，排查一下音频问题吗？）​", "十一、特殊情况与概念类"], ["The client kept asking about irrelevant historical project details, and we almost went down the rabbit hole. I had to redirect the conversation back to the current project goals.", "客户一直追问无关的历史项目细节，我们差点就陷入 “兔子洞” 了。我不得不把话题拉回到当前的项目目标上。"], ["When troubleshooting the system error, let’s start with the most obvious causes first—we don’t want to go down the rabbit hole of investigating rare technical issues right away.", "排查系统错误时，我们先从最明显的原因入手，别一开始就陷入排查罕见技术问题的 “兔子洞”。"], ["During the meeting, someone brought up a side topic about vendor contracts, and we started going down the rabbit hole. I reminded everyone we need to stick to the agenda.", "会议上有人提起了供应商合同的旁支话题，我们差点陷入 “兔子洞”。我提醒大家要紧扣议程。"], ["When answering the client’s questions, be concise and avoid going down the rabbit hole of explaining every technical detail—only share what they need to know.（回答客户问题时要简洁，别陷入解释每个技术细节的 “兔子洞”，只分享他们需要了解的内容即可。）​", "（二）突然断片（指突然忘记要说的话或要做的事）​"], ["When discussing the project risks, I had a brain fart and couldn’t remember the one we identified last week about supply chain delays. My teammate jogged my memory.（讨论项目风险时，我突然 “断片”，想不起上周我们提到的供应链延迟风险。队友帮我回忆了起来。）​", "（三）摸鱼被查（指工作时偷懒被领导或同事发现）​"], ["I was chatting with a friend on instant messaging instead of working, and my team lead noticed—I got caught slacking off. I immediately ended the chat and started working on the report.", "我没工作，反而在即时通讯软件上和朋友聊天，被组长发现了 —— 摸鱼被查。我马上结束聊天，开始写报告。"], ["I was daydreaming at my desk instead of working on the client proposal, and my supervisor noticed—I got caught slacking off. I shook it off and started drafting the proposal.", "我没写客户提案，反而在办公桌前发呆，被主管发现摸鱼。我回过神来，开始起草提案。"], ["I was browsing a news website during work hours and got caught slacking off by the office administrator. I promised to only check work-related content from then on.（我上班时间浏览新闻网站，被行政人员抓包摸鱼。我保证之后只看和工作相关的内容。）​", "（四）生病问候同事​"], ["I’m glad to see you back at work—how are you feeling now? Take it easy today, and don’t push yourself too hard.", "看到你回来上班真高兴，现在感觉怎么样？今天别太累，慢慢来。"], ["I hope you’re feeling fully recovered now. Don’t hesitate to ask for help if you’re still catching up on the tasks you missed while you were sick.（希望你现在已经完全康复了。如果补落下的工作时还需要帮忙，别客气。）​", "十二、数据相关类​"], ["The customer retention rate data has bounced back to its original level after we implemented the new after-sales service plan—it dropped to 75% last month but is now 88% again.", "实施新的售后服务计划后，客户留存率数据回升到了原来的水平，上个月降到了 75%，现在又回到 88% 了。"], ["The market share data for our new product has bounced back—after a slow start with only 3% market share, it’s now increased to 7% following the promotional activities.", "我们新产品的市场份额数据出现反弹，初期表现不佳，仅占 3% 的市场份额，促销活动后现在增长到 7% 了。"], ["The retail store foot traffic data bounced back after the holiday season—foot traffic dropped by 30% right after the holidays but has now increased by 20% as we launched new promotions.", "节假日过后，零售店客流量数据出现反弹，节后客流量立即下降了 30%，但随着我们推出新促销活动，现在增长了 20%。"], ["The project budget utilization rate data has bounced back this month—after being only 40% last month due to delayed material purchases, it’s now 65% as supplies have arrived.", "本月项目预算利用率数据出现反弹，上个月因材料采购延迟仅为 40%，随着物资到货，现在已达到 65%。"], ["The client meeting attendance rate data bounced back this week—after being 70% last week due to conflicting schedules, it’s now 92% as we rescheduled to fit most clients’ availability.", "本周客户会议出席率数据出现反弹，上周因日程冲突仅为 70%，我们重新安排时间以适配大部分客户，现在出席率已达 92%。"]];window.__KEY__="912外企必备500句职场英语";window.__TITLE__="9.12外企必备500句职场英语";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
