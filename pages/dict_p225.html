ts. Would you be interested in discussing this option?", "对于较大的订单，我们可以提供更优惠的价格 —— 例如 500-999 件享 3% 折扣，1000 件以上享 6% 折扣。您是否对讨论这个选项感兴趣？"], ["I can give you a better price if you order in bulk—let me know your expected quantity, and I'll prepare a customized quote.", "如果您批量订购，我可以给您更优惠的价格 —— 请告知您的预期数量，我会准备一份定制报价。"], ["Are there any discounts available for bulk orders? Yes, we have a tiered discount system based on order quantity—let me share the details with you.", "大宗订单是否有折扣？是的，我们有基于订单数量的阶梯折扣体系 —— 我来给您分享具体细节。"], ["Can we get a bulk discount on this order? If your order quantity reaches [X units], we can offer a [X%] discount. Would that work for you?", "这笔订单能否享受大宗折扣？如果您的订单数量达到 [X 件]，我们可以提供 [X%] 的折扣。这个条件对您合适吗？"], ["We offer discounts for repeat customers—for example, 4% off for customers who have placed 3+ orders with us.", "我们为老客户提供折扣 —— 例如，在我们这里下过 3 次以上订单的客户可享 4% 折扣。"], ["You won't find a better price for this quality—our product uses [high-quality materials/component] and undergoes strict QC, which justifies the pricing.", "就这个质量而言，您找不到更划算的价格了 —— 我们的产品使用 [高质量材料 / 组件]，并经过严格的质量控制，这个定价是合理的。"], ["We have special discounts for first-time buyers, and we also offer seasonal promotions (e.g., during Christmas or Black Friday).", "我们为首次购买者提供特别折扣，同时也有季节性促销活动（如圣诞节或黑色星期五期间）。"], ["If you sign a long-term supply contract (e.g., 1 year), we can lock in a preferential price for you to avoid market price fluctuations.", "如果您签订长期供应合同（如 1 年），我们可以为您锁定优惠价格，避免市场价格波动的影响。"], ["Let's begin by establishing our respective priorities and areas of flexibility—this will help us reach an agreement more efficiently.", "让我们首先明确彼此的优先事项和可让步的空间 —— 这将帮助我们更高效地达成协议。"], ["We're prepared to make some concessions (e.g., extending the payment term by 10 days), but this clause (e.g., quality inspection standards) is non-negotiable for us.", "我们准备做出一些让步（如将付款期限延长 10 天），但这一条款（如质量检验标准）对我们来说是不可协商的。"], ["Perhaps we could explore alternative solutions that benefit both parties—for example, if we adjust the delivery schedule, would you be open to modifying the payment ratio?", "也许我们可以探讨一些对双方都有利的替代方案 —— 例如，如果我们调整交货时间表，您是否愿意修改付款比例？"], ["I sense we may be at an impasse on [specify the issue, e.g., pricing]. Should we take a short break to regroup and revisit this topic later?", "我感觉我们在 [注明问题，如定价] 上可能陷入了僵局。我们是否应该稍作休息，重新梳理思路，之后再讨论这个话题？"], ["We greatly value our partnership, so let's aim for a mutually beneficial compromise that meets both our needs.", "我们非常重视我们的合作关系，所以让我们争取达成一个互利的妥协，满足双方的需求。"], ["Could you clarify the reasoning behind your proposed terms and conditions? This will help us understand your concerns better and find common ground.", "您能否解释一下您提出这些条款和条件的理由？这将帮助我们更好地理解您的顾虑，找到共识。"], ["We need to ensure the contract safeguards our interests (e.g., intellectual property protection) while remaining fair and balanced for both sides.", "我们需要确保合同在保护我们利益（如知识产权保护）的同时，对双方保持公平和平衡。"], ["I'd recommend consulting our legal team to review the finer contractual details (e.g., liability clauses) to avoid misunderstandings later.", "我建议咨询我们的法律团队，审查合同的细节（如责任条款），以避免日后产生误解。"], ["Shall we summarize the key points we've agreed upon (e.g., quantity, delivery time, price) before finalizing the contract? This will confirm we're on the same page.", "在敲定合同之前，我们是否应该总结一下已经达成一致的要点（如数量、交货时间、价格）？这能确保我们达成共识。"], ["Once executed, this agreement will be legally binding for both parties involved—please review it carefully before signing.", "一旦签署，本协议将对双方具有法律约束力 —— 请在签署前仔细审阅。"], ["We need to finalize the terms of the contract (e.g., dispute resolution method, force majeure clause) by [X date] to ensure the order can be produced on time.", "我们需要在 [X 日期] 前确定合同条款（如争议解决方式、不可抗力条款），以确保订单能按时生产。"], ["If you have any revisions to the draft contract, please mark them clearly and send it back—we'll review and respond within [X working days].", "如果您对合同草案有任何修改，请清晰标注并寄回 —— 我们会在 [X 个工作日] 内审阅并回复。"], ["Our goal is to increase brand awareness and establish a strong presence in your market—we plan to achieve this through [strategies, e.g., local advertising, partner promotions].", "我们的目标是提高品牌知名度，并在您的市场中建立强大的影响力 —— 我们计划通过 [策略，如本地广告、合作伙伴推广] 实现这一目标。"], ["We're currently exploring various marketing channels to reach our target audience, including [channels, e.g., social media, industry magazines, trade shows].", "我们目前正在探索各种营销渠道以触达目标受众，包括 [渠道，如社交媒体、行业杂志、展会]。"], ["Social media marketing has proven to be an effective tool in this digital age—we can create localized content for platforms popular in your region (e.g., Instagram for Europe, WeChat for China).", "在这个数字时代，社交媒体营销已被证明是一种有效的工具 —— 我们可以为您所在地区流行的平台（如欧洲的 Instagram、中国的微信）创建本地化内容。"], ["Influencer collaborations could help us connect with potential customers authentically—we can partner with local KOLs (Key Opinion Leaders) in your industry to promote our products.", "与网红合作可以帮助我们以真实的方式接触潜在客户 —— 我们可以与您所在行业的本地意见领袖（KOL）合作推广产品。"], ["Let's consider running some localized promotional campaigns tailored for your region, such as [campaigns, e.g., holiday discounts, limited-time offers, free sample giveaways].", "我们可以考虑开展一些针对您所在地区的本地化促销活动，例如 [活动，如节日折扣、限时优惠、免费样品赠送]。"], ["It's crucial to gather market intelligence (e.g., competitor pricing, consumer preferences) and stay ahead of emerging consumer trends to adjust our strategies timely.", "收集市场情报（如竞争对手定价、消费者偏好）并紧跟新兴消费趋势，对于及时调整策略至关重要。"], ["We should leverage data analytics to optimize our marketing efforts and maximize ROI (Return on Investment)—for example, analyzing which ads drive the most sales.", "我们应该利用数据分析来优化营销工作，并实现投资回报率（ROI）最大化 —— 例如，分析哪些广告带来的销量最高。"], ["Have you had any success with content marketing or search engine optimization (SEO) in your market? We can collaborate to create SEO-friendly content that ranks higher in local search results.", "您在所在市场的内容营销或搜索引擎优化（SEO）方面有过成功经验吗？我们可以合作创建对 SEO 友好的内容，在本地搜索结果中获得更高排名。"], ["Perhaps we could explore co-branding or cross-promotion opportunities with complementary brands in your region—for example, partnering with a local home goods brand if we sell kitchenware, to expand our shared customer base.", "也许我们可以与您所在地区的互补品牌探索联合品牌营销或交叉推广机会 —— 例如，如果我们销售厨具，可以与本地家居品牌合作，扩大双方的共同客户群体。"], ["I'm confident that with the right strategy—such as combining offline trade shows with online targeted ads—we can capture significant market share in your region within 12 months.", "我相信凭借正确的策略 —— 例如将线下展会与线上定向广告相结合 —— 我们能在 12 个月内在您所在地区占据可观的市场份额。"], ["Offering exclusive deals to loyalty program members can boost customer retention and encourage repeat purchases—we can design a tiered loyalty system (e.g., points for every order, free gifts for high-spenders) tailored to your local customers’ preferences.", "为忠诚度计划成员提供独家优惠可以提高客户留存率，并鼓励重复购买 —— 我们可以设计一个阶梯式忠诚度体系（如每笔订单积累积分、高消费客户获赠礼品），贴合您本地客户的偏好。"], ["Participating in industry trade shows and exhibitions (e.g., Canton Fair for electronics, Frankfurt Book Fair for publishing) is an excellent way to showcase our products and network with potential partners—we can jointly design a booth that highlights our collaborative advantages.", "参加行业展会（如电子产品领域的广交会、出版领域的法兰克福书展）是展示产品并与潜在合作伙伴建立联系的绝佳方式 —— 我们可以联合设计一个展位，突出双方的合作优势。"], ["Creating engaging video content for platforms like YouTube and TikTok can effectively showcase the features and benefits of our products—we can produce short demos, customer testimonials, or \"how-to\" videos in the local language to resonate with audiences.", "在 YouTube 和 TikTok 等平台上创建引人入胜的视频内容，能有效展示产品的特点和优势 —— 我们可以用当地语言制作短视频演示、客户推荐或 “使用教程”，与受众产生共鸣。"], ["Implementing email marketing campaigns to nurture leads and keep customers informed about new products and promotions—we can segment email lists by customer preferences (e.g., \"interested in eco-friendly products\") to send personalized content.", "开展电子邮件营销活动，培养潜在客户，并让客户了解新产品和促销信息 —— 我们可以按客户偏好（如 “对环保产品感兴趣”）对邮件列表进行细分，发送个性化内容。"], ["Hosting webinars or online workshops related to our industry (e.g., a \"sustainable packaging trends\" webinar for FMCG clients) can position us as thought leaders and attract potential customers—we can invite local industry experts to co-host and increase credibility.", "举办与行业相关的网络研讨会或在线工作坊（如为快消客户举办 “可持续包装趋势” 研讨会），可以将我们定位为行业思想领袖，并吸引潜在客户 —— 我们可以邀请本地行业专家联合主持，提升可信度。"], ["Collaborating with local businesses for joint marketing initiatives (e.g., a café and a bakery offering \"coffee + pastry\" bundles) can expand our reach within the community—we can cross-promote each other’s products in stores or on social media.", "与本地企业合作开展联合营销活动（如咖啡馆与面包店推出 “咖啡 + 糕点” 套餐），可以扩大在社区内的影响力 —— 我们可以在门店或社交媒体上互相推广对方的产品。"], ["Analyzing customer reviews and feedback (from platforms like Amazon, Trustpilot, or local review sites) to identify areas for improvement in our products and marketing strategies—we can use this data to adjust features (e.g., adding a local-language manual) or refine promotional messages.", "分析客户评论和反馈（来自亚马逊、Trustpilot 或本地评论网站），确定产品和营销策略的改进方向 —— 我们可以利用这些数据调整产品功能（如增加本地语言说明书）或优化推广文案。"], ["Developing targeted advertising campaigns on search engines (Google, Baidu) and social media platforms (Facebook, Instagram, Weibo) based on customer demographics (age, location) and interests—we can set a localized budget to focus on high-potential regions.", "根据客户人口统计信息（年龄、地理位置）和兴趣，在搜索引擎（谷歌、百度）和社交媒体平台（Facebook、Instagram、微博）上开展有针对性的广告活动 —— 我们可以设定本地化预算，聚焦高潜力地区。"], ["Encouraging user-generated content (UGC), such as customer testimonials, product reviews, or photos of customers using our products—we can launch a contest (e.g., \"share your product story for a chance to win a gift card\") to motivate participation and build trust.", "鼓励用户生成内容（UGC），如客户推荐、产品评论或客户使用产品的照片 —— 我们可以发起一场竞赛（如 “分享你的产品故事，有机会赢取礼品卡”），激发参与度并建立信任。"], ["Offering free samples or trials of our products can entice customers to try them and potentially convert them into long-term buyers—we can distribute samples at local events or partner with retail stores to let customers test products in person.", "提供产品的免费样品或试用装，能吸引客户尝试并有可能将其转化为长期买家 —— 我们可以在本地活动中分发样品，或与零售店合作让客户现场试用产品。"], ["You can always find a lower price on the market, but the quality will definitely differ—our product uses [high-grade materials, e.g., medical-grade silicone] and undergoes 5 rounds of quality inspections, which ensures durability and safety that cheaper alternatives can’t match.", "市场上总能找到更低的价格，但质量肯定不同 —— 我们的产品使用 [高品质材料，如医用级硅胶]，并经过 5 轮质量检验，确保耐用性和安全性，这是廉价替代品无法比拟的。"], ["Could you please advise your budget? So we can see if there’s a solution that balances cost and your needs—for example, adjusting the product specifications (e.g., smaller size, basic features) instead of compromising on quality.", "您能否告知您的预算？这样我们可以找到兼顾成本和需求的方案 —— 例如，调整产品规格（如更小尺寸、基础功能），而不是在质量上妥协。"], ["Besides price, what other reasons do you have for not moving forward with this order currently? If it’s about delivery time, payment terms, or product customization, we’re happy to discuss adjustments to meet your requirements.", "除了价格，目前还有其他什么原因导致您不推进这个订单吗？如果是交货时间、付款条件或产品定制方面的问题，我们很乐意协商调整，满足您的需求。"], ["Don’t you agree with me that in the long run, moderate prices will bring about large sales and more profit? If we cut prices too much, we’ll have to reduce quality, which will harm your reputation with end customers—our current pricing ensures both your profit margin and customer satisfaction.", "从长远来看，合理的价格会带来大量销售和更多利润，您认同这一点吧？如果我们过度降价，就不得不降低质量，这会损害您在终端客户中的声誉 —— 我们目前的定价既能保证您的利润率，也能确保客户满意度。"], ["Sorry, we can’t offer the lowest price on the market—because our quotation includes not only the product itself but also value-added services, such as free after-sales technical support, a 2-year warranty, and customized packaging. These services help you save time and costs in the long run.", "很抱歉，我们无法给出市场上最低的价格 —— 因为我们的报价不仅包含产品本身，还涵盖增值服务，如免费售后技术支持、2 年保修期和定制包装。从长远来看，这些服务能帮您节省时间和成本。"], ["I can’t bear losing a client due to quality issues—if I cut corners to lower the price, the product may have defects, and you’ll face complaints from your customers. That’s a risk neither of us wants to take—our priority is to maintain a long-term partnership based on reliable quality.", "我不能承受因质量问题失去客户 —— 如果我为了降价而偷工减料，产品可能会出现缺陷，您也会面临终端客户的投诉。这是我们双方都不愿承担的风险 —— 我们的首要目标是基于可靠的质量，维持长期合作关系。"], ["I haven’t heard back from you since our last follow-up, and I want to check if there’s any issue we can help with—whether it’s unclear product details, concerns about logistics, or questions about payment terms, please feel free to share, and we’ll find a solution together.", "自从上次跟进后，我一直没有收到您的回复，想了解是否有我们可以协助解决的问题 —— 无论是产品细节不明确、对物流有顾虑，还是对付款条件有疑问，都请随时告知，我们一起找到解决方案。"], ["Just imagine how things will be in six months once you have pushed this new product to your distribution channels—your competitors are already exploring similar products, and launching early will help you seize the market first and build a competitive edge.", "想象一下，一旦您将这款新产品推向分销渠道，六个月后的情况会如何 —— 您的竞争对手已经在探索类似产品，尽早推出能帮助您抢占市场先机，建立竞争优势。"], ["It’s very normal for customers to feel hesitant before placing an order—many of our clients initially had concerns about price or quality, but after receiving samples and learning about our after-sales service, they felt confident to move forward. Would you like us to send a sample for your test first?", "客户在下订单前感到犹豫是很正常的 —— 我们的很多客户最初也对价格或质量有顾虑，但在收到样品并了解我们的售后服务后，就有信心推进合作了。您是否希望我们先寄一份样品供您测试？"], ["The information I sent you (product specifications, test reports, customer cases) can help you evaluate whether the product fits your needs and avoid detours—if there’s any part you don’t understand, I can explain it in detail or arrange a meeting with our product manager for further discussion.", "我发给您的资料（产品规格、测试报告、客户案例）能帮助您评估产品是否符合需求，避免走弯路 —— 如果有任何不理解的部分，我可以详细解释，或安排与我们的产品经理会面，进一步讨论。"], ["The market is so competitive now that no company would be foolish enough to sell a product of the same quality at a higher price than others—our pricing is based on fair costs (materials, production, labor) and reasonable profit margins. If you have received quotes from other suppliers, we can compare product details (e.g., material grade, warranty period) to help you make an informed decision.", "现在市场竞争如此激烈，没有公司会傻到以比其他公司更高的价格销售同等质量的产品 —— 我们的定价基于合理的成本（材料、生产、人工）和适度的利润率。如果您收到了其他供应商的报价，我们可以对比产品细节（如材料等级、保修期），帮助您做出明智的选择。"], ["We’re planning to adjust our pricing next month due to rising raw material costs—if you place the order this month, we can lock in the current price for you. This will help you save costs and avoid the impact of future price increases.", "由于原材料成本上涨，我们计划下个月调整定价 —— 如果您本月下单，我们可以为您锁定当前价格。这能帮您节省成本，避免未来涨价带来的影响。"], ["I will focus on your order and production status closely—every time there’s progress (e.g., production starts, goods are ready for shipment), I will send you an update with photos or videos to keep you informed.", "我会密切关注您的订单和生产情况 —— 每当有进展（如开始生产、货物准备发运），我会向您发送更新，并附上照片或视频，让您随时了解情况。"], ["I know exactly what you mean—after placing an order, you want to ensure everything goes smoothly. Rest assured, we have assigned a dedicated order manager to your project, and you can contact them directly at [phone/email] if you have any questions.", "我完全明白您的意思 —— 下订单后，您希望确保一切顺利。请放心，我们已为您的项目分配了专属订单经理，您有任何问题可直接通过 [电话 / 邮箱] 联系他们。"], ["That’s the kind of thing I would do too—if I were in your position, I would also pay close attention to production and delivery. To make you more at ease, we can share our production schedule with you, so you know when each step will be completed.", "换做是我，我也会这么做 —— 如果我处在您的位置，也会密切关注生产和交货情况。为了让您更安心，我们可以把生产计划表分享给您，让您清楚每个环节的完成时间。"], ["Value-for-money means considering service, details, expertise, results, and after-sales support rather than simply \"the price is low\"—we will not only deliver the product on time but also assist with customs clearance, provide a warranty, and resolve any issues promptly. This is the added value we bring to your cooperation.", "物有所值意味着要综合考虑服务、细节、专业能力、成果和售后支持，而不仅仅是 “价格低”—— 我们不仅会按时交货，还会协助通关、提供保修，并及时解决任何问题。这是我们为您的合作带来的附加价值。"], ["Trust is precious, and if you choose to rely on me, I won’t let you down—we have a 98% on-time delivery rate and a 95% customer satisfaction rate. Your order is our top priority, and we will do our best to ensure it meets your expectations.", "信任是宝贵的，如果您选择信任我，我不会让您失望 —— 我们的准时交货率达 98%，客户满意度达 95%。您的订单是我们的首要任务，我们会尽全力确保产品符合您的预期。"], ["Different prices represent different qualities—expensive goods may not suit your needs, and cheap ones may not meet your standards. What matters most is finding a product that fits your target market and profit goals—our current cooperation plan is tailored to your requirements, and we can adjust it further if needed.", "不同的价格代表不同的品质 —— 贵的产品可能不符合您的需求，便宜的产品可能达不到您的标准。最重要的是找到适合您目标市场和利润目标的产品 —— 我们目前的合作方案是根据您的需求定制的，如有需要，我们还可以进一步调整。"], ["Hey there! What can I help you with today? Whether you’re looking for product details, a quote, or sample information, feel free to let me know.", "嗨！今天有什么我可以帮忙的吗？无论是了解产品细节、获取报价，还是咨询样品信息，都请随时告诉我。"], ["We’ve got some great deals going on right now—for example, 15% off on all eco-friendly products and free shipping for orders over $500. Wanna take a look at the promotion list?", "我们现在有一些很棒的优惠活动 —— 例如所有环保产品享 15% 折扣，订单满 500 美元免运费。想看看促销清单吗？"], ["If you need a sample, I can arrange that for you—just let me know your shipping address and the product model you’re interested in, and we’ll send it out within 3 working days.", "如果您需要样品，我可以为您安排 —— 只需告知您的收货地址和感兴趣的产品型号，我们会在 3 个工作日内寄出。"], ["We offer fast shipping options—for urgent orders, we can arrange air freight (delivery in 3-5 days), and for regular orders, ocean freight is available at a lower cost. Which option works better for you?", "我们提供快速发货服务 —— 紧急订单可安排空运（3-5 天送达），常规订单可选择海运，成本更低。哪种方式更适合您？"], ["Have you had a chance to review the product catalog I sent last week? If you have any questions about specific models, or if you want to focus on a certain category (e.g., office supplies, home appliances), I can provide more details.", "您有时间查看我上周发送的产品目录吗？如果对特定型号有疑问，或想聚焦某一类别（如办公用品、家用电器），我可以提供更多细节。"], ["Our products are currently used by over 500 clients worldwide, including well-known brands like [examples, e.g., Walmart, Samsung]. If you’d like to see customer testimonials or case studies, I can share them with you.", "我们的产品目前被全球 500 多家客户使用，包括 [举例，如沃尔玛、三星] 等知名品牌。如果您想查看客户推荐或案例研究，我可以分享给您。"], ["If you’re not sure which product fits your needs, tell me about your target market (e.g., age group, usage scenario) and requirements (e.g., budget, quality standards), and I’ll recommend the most suitable options.", "如果您不确定哪种产品符合需求，告诉我您的目标市场（如年龄段、使用场景）和要求（如预算、质量标准），我会推荐最合适的方案。"], ["We can customize the product according to your branding—for example, adding your logo on the packaging, adjusting the color to match your brand identity, or modifying the function to meet local preferences. Would you like to discuss the customization details?", "我们可以根据您的品牌进行产品定制 —— 例如在包装上添加您的 logo、调整颜色以匹配您的品牌形象，或修改功能以适应当地偏好。您想讨论定制细节吗？"], ["The current stock of this product is limited—we only have 200 units left. If you plan to place an order, it’s better to confirm soon to avoid stockouts and delays in delivery.", "这款产品目前库存有限 —— 仅剩 200 件。如果您计划下单，建议尽快确认，避免缺货导致交货延迟。"], ["After you place the order, we’ll send you a confirmation email with all the details (order number, quantity, delivery time, payment info). You can track the order status through our online portal anytime—just use your order number to log in. If you have trouble accessing the portal, our customer service team is available to help you check the status manually.", "您下单后，我们会向您发送确认邮件，包含所有细节（订单号、数量、交货时间、付款信息）。您可以随时通过我们的在线平台跟踪订单状态 —— 只需用订单号登录即可。如果您在访问平台时遇到问题，我们的客服团队可以协助您手动查询状态。"], ["Many of our clients who work in [your industry, e.g., the restaurant business] prefer this product because it’s [key advantage, e.g., easy to clean, energy-efficient, durable]. It can help you reduce operational costs and improve customer satisfaction—would you like to hear a specific case about how it helped a similar client?", "我们很多从事 [您所在行业，如餐饮业] 的客户都偏爱这款产品，因为它 [核心优势，如易清洁、节能、耐用]。它能帮您降低运营成本、提高客户满意度 —— 您想听听它如何帮助类似客户的具体案例吗？"], ["If you’re concerned about product quality, we can provide a sample inspection report or arrange for a third-party testing agency (e.g., SGS, TUV) to verify the quality before shipment. This way, you can be fully confident in the product you’re receiving.", "如果您担心产品质量，我们可以提供样品检验报告，或在发货前安排第三方检测机构（如 SGS、德国莱茵 TUV）进行质量验证。这样，您对收到的产品就能完全放心。"], ["We understand that timely delivery is crucial for your business—we’ll set a clear delivery timeline in the contract and provide weekly updates on production progress. If there’s any potential delay (e.g., due to raw material shortages), we’ll notify you immediately and propose solutions (e.g., adjusting the production schedule).", "我们明白准时交货对您的业务至关重要 —— 我们会在合同中明确交货时间表，并每周更新生产进度。如果存在潜在延迟（如原材料短缺导致），我们会立即通知您，并提出解决方案（如调整生产计划）。"], ["For new clients, we’re willing to offer a flexible payment term (e.g., 30% advance payment, 70% balance before shipment) to build trust. Once we establish a long-term partnership, we can further adjust the terms (e.g., extending the balance payment period) based on your performance.", "对于新客户，我们愿意提供灵活的付款条件（如 30% 预付款，70% 发货前付清）以建立信任。一旦我们建立长期合作关系，可根据您的合作情况进一步调整条款（如延长尾款支付期限）。"], ["If you want to promote the product in your local market, we can provide marketing materials (e.g., product brochures, high-resolution images, video clips) in your local language. These materials are designed to highlight the product’s key selling points and help you attract more customers.", "如果您想在本地市场推广这款产品，我们可以提供本地语言的营销材料（如产品手册、高清图片、视频片段）。这些材料聚焦产品核心卖点，能帮您吸引更多客户。"], ["We offer a 1-year warranty for this product—if there’s any quality issue within the warranty period (excluding human damage), we’ll provide a free replacement or repair, and cover the shipping costs for the defective product and the replacement.", "这款产品我们提供 1 年保修期 —— 保修期内若出现质量问题（非人为损坏），我们会免费更换或维修，并承担缺陷产品和替代品的运输费用。"], ["If you have a large order (e.g., over 1000 units), we can negotiate a bulk discount and provide a customized production plan to meet your timeline. We’ll also assign a dedicated account manager to coordinate all aspects of the order, from production to delivery.", "如果您的订单量较大（如 1000 件以上），我们可以协商大宗折扣，并提供定制化生产计划以满足您的时间要求。我们还会指派专属客户经理，协调订单从生产到交货的所有环节。"], ["Have you considered the after-sales support you’ll need for this product? We have a 24/7 technical support team that can assist your customers via phone or email. We also provide a user manual with troubleshooting tips to help resolve common issues quickly.", "您是否考虑过这款产品所需的售后支持？我们有 24 小时技术支持团队，可通过电话或邮件协助您的客户。我们还提供包含故障排除技巧的用户手册，帮助快速解决常见问题。"], ["If you’re interested in a long-term partnership, we can sign an annual supply contract that locks in the price and ensures a stable supply. This way, you won’t be affected by market price fluctuations or supply shortages, and we can plan production more efficiently to meet your needs.", "如果您有意建立长期合作，我们可以签订年度供应合同，锁定价格并确保稳定供应。这样，您就不会受市场价格波动或供应短缺的影响，我们也能更高效地规划生产以满足您的需求。"], ["I’ll follow up with you in 2 days to see if you have any further questions. If you think of anything before then—whether it’s about pricing, customization, or logistics—feel free to contact me anytime via phone or email.", "我会在 2 天后跟进，看看您是否有其他问题。在此之前，如果您想到任何事情 —— 无论是价格、定制还是物流方面 —— 都可以随时通过电话或邮件联系我。"], ["We sincerely apologize for the quality issue with the product you received. Our quality control team has launched an investigation, and we will share a detailed report with you within 48 hours. To resolve this quickly, we can arrange a free replacement shipment or offer a full refund—please let us know your preference.\"", "对于您收到的产品出现质量问题，我们深表歉意。我们的质量控制团队已启动调查，将在 48 小时内与您分享详细报告。为快速解决问题，我们可安排免费补发或全额退款 —— 请告知您的选择。"], ["We understand this quality issue has caused inconvenience to your business. In addition to the replacement/refund, we will provide a 10% discount on your next order as compensation. We have also updated our QC procedures to prevent similar issues from happening again.\"", "我们明白这个质量问题给您的业务带来了不便。除补发 / 退款外，我们将为您的下一笔订单提供 10% 折扣作为补偿。同时，我们已更新质量控制流程，避免类似问题再次发生。"], ["We regret to inform you that the delivery of your order (No. XXX) will be delayed by 3 days due to unexpected raw material shortages. We have expedited the production process and will ship the goods on [specific date]. We will cover the additional air freight cost to ensure the goods arrive as soon as possible, and we apologize for any disruption to your schedule.\"", "很遗憾告知您，由于突发原材料短缺，您的订单（编号 XXX）将延迟 3 天交货。我们已加急生产，将于 [具体日期] 发货，并承担额外的空运费以确保货物尽快送达。对您日程造成的影响，我们深表歉意。"], ["We understand timely delivery is critical for your project. We have contacted our logistics partner to prioritize your shipment, and we will send you daily updates on the shipping status. If you need to adjust your plans due to the delay, please let us know—we are willing to coordinate with you to minimize the impact.\"", "我们明白准时交货对您的项目至关重要。我们已联系物流合作伙伴优先处理您的货物，并将每日向您更新运输状态。如果您因延迟需要调整计划，请告知我们 —— 我们愿意配合您将影响降至最低。"], ["Thank you for bringing the payment discrepancy to our attention. We have checked our records and found that the issue was caused by a system error in the invoice amount. We have sent a corrected invoice to your email, and you can make the payment based on the updated amount. We apologize for the confusion and appreciate your patience.\"", "感谢您指出付款金额的差异。我们核查记录后发现，问题是由发票金额的系统错误导致的。已将更正后的发票发送至您的邮箱，您可按更新后的金额付款。对造成的困惑，我们深表歉意，感谢您的耐心。"], ["We understand you have concerns about the payment term. Let’s schedule a short call to discuss a mutually acceptable solution—for example, we can split the payment into two installments (50% now, 50% after delivery) to reduce your financial pressure. We value our partnership and are willing to be flexible to resolve this issue.\"", "我们理解您对付款条件有顾虑。我们可以安排一个简短的电话会议，讨论双方都能接受的方案 —— 例如，将付款分为两期（现在付 50%，交货后付 50%），减轻您的资金压力。我们重视合作关系，愿意灵活解决此问题。"], ["We’re sorry to hear that your shipment was lost in transit. We’ve contacted the logistics company to launch a formal investigation, and they’ve promised to provide a tracking update within 24 hours. In the meantime, we can arrange a re-shipment immediately to avoid further delays to your business—would you prefer this option, or would you like to wait for the investigation result first?\"", "得知您的货物在运输途中丢失，我们深感抱歉。我们已联系物流公司启动正式调查，他们承诺 24 小时内提供追踪更新。在此期间，我们可立即安排重新发货，避免对您的业务造成进一步延误 —— 您更倾向于这个方案，还是想先等待调查结果？"], ["We apologize for the damage to your product during shipping. Please send us photos of the damaged goods and the packaging—this will help us file a claim with the logistics company. Once we receive the photos, we’ll send a replacement within 3 working days and cover all related shipping costs. We’ve also updated our packaging standards to use thicker cartons and more bubble wrap for future shipments.\"", "对于货物在运输中受损，我们深表歉意。请将受损货物及包装的照片发送给我们 —— 这将帮助我们向物流公司索赔。收到照片后，我们会在 3 个工作日内寄出替代品，并承担所有相关运费。我们也已更新包装标准，未来将使用更厚的纸箱和更多气泡膜进行包装。"], ["Thank you for noticing the mistake in the order quantity (we listed 100 units instead of 150). We’ve corrected the order details in our system and sent a revised confirmation email to you. To ensure no further errors, we’ll double-check the production plan and shipping label against your requirements before proceeding—please let us know if you spot any other inconsistencies.\"", "感谢您发现订单数量的错误（我们误写为 100 件，实际应为 150 件）。我们已在系统中更正订单详情，并向您发送了修订后的确认邮件。为确保不再出现错误，我们会在生产和贴运单前，根据您的要求再次核对生产计划和运单信息 —— 如发现其他不一致之处，请随时告知。"], ["We regret that the product model in the shipment didn’t match your order (you ordered Model A, but we sent Model B). This was caused by a warehouse picking error. We’ll arrange a return shipment for the wrong model (we’ll cover the return cost) and send the correct Model A to you via express shipping—you should receive it within 5 days. We’ve also added a second verification step for warehouse picking to prevent this from happening again.\"", "很遗憾，发运的产品型号与您的订单不符（您订购的是 A 型号，我们却发了 B 型号）。这是由仓库拣货错误导致的。我们会安排将错误型号退回（退货运费由我们承担），并通过快递将正确的 A 型号寄给您 —— 您应在 5 天内收到。我们还在仓库拣货环节增加了二次核验步骤，避免此类问题再次发生。"], ["Hi [Client Name], it’s been 3 months since we completed your last order. I wanted to check in and see how the products are performing—are they meeting your expectations, or is there anything we can improve on? Your feedback will help us better serve you in the future.\"", "您好，[客户姓名]，距离我们完成您上一笔订单已过去 3 个月。我想回访了解一下产品使用情况 —— 是否符合您的预期？是否有需要我们改进的地方？您的反馈将帮助我们未来更好地为您服务。"], ["We value our long-term partnership with your company, so we’d like to invite you to fill out a short satisfaction survey (it will take 5 minutes). The survey covers product quality, delivery speed, and customer service—your answers will help us adjust our services to better fit your needs. As a thank you, we’ll offer a 5% discount on your next order once you complete it.\"", "我们重视与贵公司的长期合作，因此想邀请您填写一份简短的满意度调查（仅需 5 分钟）。调查内容涵盖产品质量、交货速度和客户服务 —— 您的回答将帮助我们调整服务，更贴合您的需求。作为感谢，完成调查后，您的下一笔订单可享 5% 折扣。"], ["Happy [Festival Name] to you and your team! Whether you’re celebrating with family or enjoying a break, we hope this holiday brings you joy and relaxation. Thank you for your trust in our partnership this year—we look forward to continuing to work with you in the coming year.\"", "祝您和您的团队 [节日名称，如圣诞节] 快乐！无论您是与家人共度佳节，还是享受休闲时光，都希望这个节日能为您带来欢乐与放松。感谢您今年对我们合作的信任 —— 期待来年继续与您携手。"], ["Today marks the 2nd anniversary of our partnership! Over the past 2 years, we’ve worked together to overcome challenges and achieve mutual goals, and we’re grateful for your support every step of the way. To celebrate, we’d like to offer you a special 8% discount on your next order—here’s to many more successful years together!\"", "今天是我们合作 2 周年的日子！过去 2 年里，我们携手克服挑战、实现共同目标，感谢您一路以来的支持。为表庆祝，您的下一笔订单可享 8% 特别折扣 —— 期待未来更多成功的合作岁月！"], ["Hi [Client Name], we recently launched a new eco-friendly version of the product you’ve been ordering (Model X). It uses 100% recycled materials, meets international environmental standards, and has the same performance as the original model. We’d be happy to send you a sample for testing—would you be interested in trying it?\"", "您好，[客户姓名]，我们最近推出了您一直在订购的产品（X 型号）的环保新版本。它采用 100% 再生材料，符合国际环保标准，性能与原版一致。我们很乐意寄样供您测试 —— 您有兴趣尝试吗？"], ["We’ve just added a new ‘express production’ service for urgent orders—if you need products within 7 days, we can prioritize your order with a small premium (10% extra cost). We know your business sometimes has tight deadlines, so we hope this service helps you handle unexpected demands more easily. Let us know if you’d like to learn more about the details.\"", "我们刚为紧急订单新增了 “加急生产” 服务 —— 如果您需要 7 天内拿到产品，我们可以优先处理您的订单，仅收取少量溢价（额外 10% 费用）。我们了解您的业务有时会有紧迫的期限，希望这项服务能帮助您更轻松地应对突发需求。如想了解更多细节，欢迎随时告知。"], ["Hi there! I noticed you’ve been looking at our wireless headphones—would you like to know about their key features, like the 30-hour battery life or noise-canceling function?\"", "嗨！我注意到您一直在查看我们的无线耳机 —— 想了解它们的核心功能吗？比如 30 小时续航或降噪功能。"], ["This office chair is our bestseller for small businesses—it’s ergonomic, easy to assemble, and comes with a 3-year warranty. Many clients say it reduces back pain during long workdays.\"", "这款办公椅是我们针对小企业的畅销款 —— 符合人体工学、易于组装，还附带 3 年保修。很多客户反馈，它能缓解长时间工作后的背痛问题。"], ["If you order 20 or more of these storage boxes, we can offer a 12% discount. They’re stackable, waterproof, and perfect for warehouse organization—do you have a specific quantity in mind?\"", "如果您订购 20 个及以上这款储物箱，可享 12% 折扣。它们可堆叠、防水，非常适合仓库整理 —— 您有预期的订购数量吗？"], ["We have a limited-time offer for new customers: buy one printer, get a free pack of ink cartridges. The offer ends next Friday, so if you’re interested, it’s best to confirm soon.\"", "我们对新客户有限时优惠：买一台打印机，赠一包墨盒。优惠下周五截止，如感兴趣，建议尽快确认。"], ["This batch of organic cotton t-shirts is made in our certified ethical factory—no child labor, and all workers get fair wages. Would you like to see the factory certification documents?\"", "这批有机棉 T 恤产自我们的合规道德工厂 —— 无童工，所有工人都能获得公平工资。想查看工厂的认证文件吗？"], ["Our digital thermometers are FDA-approved and accurate to within 0.1°C. They’re used by hospitals and clinics worldwide—do you need them for personal or commercial use?\"", "我们的电子体温计通过了 FDA 认证，精度可达 0.1°C。全球多家医院和诊所都在使用 —— 您是用于个人还是商业用途？"], ["If you’re not satisfied with the product within 30 days of receipt, you can return it for a full refund—no questions asked. We want you to feel confident in your purchase.\"", "如您在收到产品后 30 天内不满意，可无理由退货并获得全额退款。我们希望您能对购买感到放心。"], ["These LED light bulbs use 80% less energy than traditional incandescent bulbs and last 10 times longer. They’re available in warm white and cool white—which color temperature do you prefer?\"", "这些 LED 灯泡比传统白炽灯节能 80%，使用寿命更是长达 10 倍。有暖白光和冷白光两种选择 —— 您偏好哪种色温？"], ["We can customize the logo on these promotional mugs—you can choose the color, font, and size of the logo. Many clients use them for company events or customer gifts.\"", "我们可以在这些促销马克杯上定制 logo—— 您可选择 logo 的颜色、字体和尺寸。很多客户用它们来举办公司活动或作为客户礼品。"], ["This software package includes accounting, inventory management, and customer relationship tools—all in one system. It’s easy to use, even for people with no technical experience. Would you like a 15-minute demo to see how it works?\"", "这款软件包包含会计、库存管理和客户关系工具 —— 一体化系统。操作简单，即使没有技术经验也能轻松上手。想观看 15 分钟的演示，了解它的使用方法吗？"], ["We offer free shipping for all orders over $200 to North America. If your order is under that, the shipping cost is only $15. When do you need the products delivered by?\"", "所有发往北美的订单满 200 美元免运费。如未满，运费仅需 15 美元。您需要产品在什么时间前送达？"], ["These packing peanuts are biodegradable—they dissolve in water, so they’re better for the environment than plastic packing materials. They’re also lightweight, which helps reduce shipping costs.\"", "这些包装花生可生物降解 —— 遇水即溶，比塑料包装材料更环保。而且它们重量轻，有助于降低运输成本。"], ["Our team can help you design a custom product label—we’ll send you 3 draft designs to choose from, and revise them until you’re satisfied. The design service is free for orders over 500 units.\"", "我们的团队可帮您设计定制产品标签 —— 会先发送 3 版设计草案供您选择，并修改至您满意为止。订购 500 件以上，设计服务免费。"], ["This portable speaker is waterproof, so it’s great for outdoor activities like camping or beach trips. It also connects to two devices at once—perfect for sharing music with friends.\"", "这款便携音箱防水，非常适合露营、海滩游玩等户外活动。还能同时连接两台设备 —— 很适合和朋友分享音乐。"], ["We have a stock of 500 of these laptop bags right now—if you order today, we can ship them tomorrow. If you wait until next week, we might be out of stock due to high demand.\"", "这款笔记本电脑包目前有 500 个库存 —— 如今天下单，明天即可发货。如等到下周，由于需求旺盛，可能会缺货。"], ["Our customer service team is available 24/7 via phone, email, or live chat. If you have any issues with the product after purchase, we’ll respond within 1 hour and resolve it as soon as possible.\"", "我们的客服团队 24 小时在线，可通过电话、邮箱或在线聊天联系。如您在购买后遇到产品问题，我们会在 1 小时内回复，并尽快解决。"], ["These stainless steel water bottles are BPA-free and come in 5 different colors. They keep drinks cold for 24 hours and hot for 12 hours—do you need a sample to test the insulation?\"", "这些不锈钢水杯不含双酚 A（BPA），有 5 种颜色可选。保冷 24 小时、保热 12 小时 —— 需要样品测试保温效果吗？"], ["We partner with DHL and FedEx for international shipping—they offer fast delivery and real-time tracking. We can also help you handle customs clearance documents to avoid delays.\"", "我们与 DHL 和 FedEx 合作进行国际运输 —— 它们配送快且支持实时追踪。我们还能帮您处理报关文件，避免延误。"], ["This marketing calendar template is designed for small businesses—it includes monthly marketing themes, social media post ideas, and deadline reminders. You can edit it in Excel or Google Sheets to fit your needs.\"", "这款营销日历模板专为小企业设计 —— 包含月度营销主题、社交媒体发帖思路和截止日期提醒。可在 Excel 或 Google Sheets 中编辑，以贴合您的需求。"], ["If you sign up for our loyalty program, you’ll earn 1 point for every $1 you spend. Once you have 100 points, you can redeem them for a $10 discount or a free product. Would you like to join today?\"", "如注册我们的忠诚度计划，每消费 1 美元可获 1 积分。累计 100 积分后，可兑换 10 美元折扣或免费产品。今天想加入吗？"], ["These disposable face masks meet CE and FDA standards—they have 3 layers of protection, including a melt-blown filter. We can supply large quantities for hospitals, schools, or offices.\"", "这些一次性口罩符合 CE 和 FDA 标准 —— 有 3 层防护，含熔喷过滤层。可大量供应给医院、学校或企业。"], ["Our web hosting service includes a free domain name for the first year, unlimited bandwidth, and 24/7 technical support. Many small business owners say it’s more reliable than other hosting providers they’ve used.\"", "我们的虚拟主机服务首年免费赠送域名，提供无限带宽和 24 小时技术支持。很多小企业主反馈，它比他们之前使用过的其他主机提供商更可靠。"], ["This batch of notebooks uses recycled paper and soy-based ink—they’re eco-friendly and perfect for companies that want to promote sustainability. We can print your company logo on the cover for free.\"", "这批笔记本采用再生纸和大豆油墨 —— 环保，非常适合想推广可持续发展理念的企业。我们可免费在封面上印制您的公司 logo。"], ["We offer a 10% discount for repeat customers—since you’ve ordered from us before, this discount will automatically apply to your next order. Thank you for your continued support!\"", "我们为老客户提供 10% 折扣 —— 由于您之前在我们这里下过单，这个折扣将自动适用于您的下一笔订单。感谢您的持续支持！"], ["These wireless chargers work with all Qi-enabled devices, like iPhones and Samsung Galaxy phones. They’re compact, so they’re easy to carry for travel. Do you need them in bulk for a retail store?\"", "这些无线充电器适用于所有支持 Qi 协议的设备，如 iPhone 和三星 Galaxy 手机。体积小巧，便于旅行携带。您需要批量采购用于零售店销售吗？"], ["Our team can provide a free cost analysis for your order—we’ll compare different quantities, shipping methods, and customization options to help you find the most cost-effective solution. Would you like to share your requirements?\"", "我们的团队可为您的订单提供免费成本分析 —— 会对比不同数量、运输方式和定制方案，帮您找到性价比最高的选择。想分享您的需求吗？"], ["This software has a free trial period of 14 days—you can use all the features without any restrictions. If you like it after the trial, you can choose a monthly or annual subscription. The annual subscription saves you 20% compared to monthly.\"", "这款软件有 14 天免费试用期 —— 可无限制使用所有功能。如试用后满意，可选择月付或年付订阅。年付比月付节省 20%。"], ["These canvas tote bags are reusable and washable—many brands use them for eco-friendly promotions. They can hold up to 10kg, and we can print full-color designs on both sides.\"", "这些帆布托特包可重复使用、可水洗 —— 很多品牌用它们进行环保促销。承重可达 10 公斤，我们还能在两面印制全彩图案。"], ["We have a dedicated team for large orders (over 1000 units)—they’ll provide personalized service, including regular production updates and a dedicated account manager. Would you like to discuss your large-order needs?\"", "我们有专门的团队处理大宗订单（1000 件以上）—— 提供个性化服务，包括定期生产更新和专属客户经理。想讨论您的大宗订单需求吗？"], ["This electric kettle boils water in 2 minutes and automatically shuts off when it’s done—safe and energy-efficient. It’s available in 1.5L and 2L sizes—which one fits your needs better?\"", "这款电水壶 2 分钟即可烧开水，水开后自动断电 —— 安全又节能。有 1.5 升和 2 升两种容量 —— 哪种更符合您的需求？"], ["We can ship your order to multiple addresses if needed—for example, if you want to send some products to your warehouse and others to retail stores directly. Just provide us with the list of addresses and the quantity for each, and we’ll handle the rest.\"", "如需要，我们可以将您的订单发往多个地址 —— 比如您想部分发往仓库，部分直接发往零售店。只需提供地址列表及每个地址的发货数量，后续事宜由我们处理。"], ["This batch of smartphone cases is compatible with the latest models (iPhone 15 and Samsung S24). They’re made of shockproof TPU material, which can protect phones from drops up to 1.5 meters. Do you want to mix different colors in your order?\"", "这批手机壳适配最新机型（iPhone 15 和三星 S24），采用防震 TPU 材质，可保护手机免受 1.5 米高度跌落的损伤。您想在订单中混合搭配不同颜色吗？"], ["Our online ordering system is easy to use—you can view product details, check stock, and place orders 24/7. If you need help setting up an account or navigating the system, our team can walk you through it step by step.\"", "我们的在线订购系统操作简便 —— 您可 24 小时查看产品详情、库存情况并下单。如在注册账号或操作系统时需要帮助，我们的团队可逐步指导您完成。"], ["These disposable gloves are food-grade and latex-free—safe for people with latex allergies. They’re commonly used in restaurants, bakeries, and food processing plants. What’s your expected monthly order quantity?\"", "这些一次性手套为食品级且不含乳胶 —— 对乳胶过敏人群也可安全使用，广泛用于餐厅、面包店和食品加工厂。您每月的预期订购量是多少？"], ["We offer a price match guarantee—if you find the same product at a lower price from a reputable supplier, we’ll match that price. We want to ensure you get the best value for your money.\"", "我们提供价格匹配保障 —— 如您在有信誉的供应商处发现同款产品价格更低，我们将匹配该价格。我们希望确保您的每一分钱都花得值。"], ["This portable projector is small enough to fit in a backpack but has a 100-inch projection size. It works with laptops, phones, and USB drives—great for business meetings or home entertainment. Would you like to see a demo video?\"", "这款便携投影仪体积小到可放入背包，却能投射 100 英寸画面，可连接电脑、手机和 U 盘 —— 非常适合商务会议或家庭娱乐。想观看演示视频吗？"], ["We can provide a sample order of 10 units first, so you can test the product quality before placing a large order. The sample cost is refundable if you place an order of 500 units or more within 3 months.\"", "我们可先提供 10 件的样品订单，方便您在大宗下单前测试产品质量。如您在 3 个月内下单 500 件及以上，样品费用可退还。"], ["These office supplies kits include pens, notebooks, staplers, and sticky notes—everything a new employee needs. We can customize the kit with your company logo and choose colors that match your brand. How many kits do you need?\"", "这些办公用品套装包含钢笔、笔记本、订书机和便利贴 —— 新员工所需物品一应俱全。我们可在套装上印制您的公司 logo，并选择与品牌匹配的颜色。您需要多少套？"], ["Our shipping insurance covers loss, damage, and delay—for just 2% of the order value, you can have peace of mind knowing your shipment is protected. Do you want to add this to your order?\"", "我们的运输保险涵盖丢失、损坏和延误 —— 仅需订单金额的 2%，就能确保货物运输有保障，让您安心。您想为订单添加这项服务吗？"], ["This wireless mouse has a silent click design—no loud noises, which is perfect for offices or libraries. It also has a long battery life of 6 months on a single charge. Do you need it in black or white?\"", "这款无线鼠标采用静音点击设计 —— 无噪音，非常适合办公室或图书馆使用，单次充电可续航 6 个月。您需要黑色还是白色款？"], ["We have a seasonal promotion for winter products—20% off on all heaters and thermal blankets. The promotion ends at the end of February, so now is a great time to stock up.\"", "我们针对冬季产品有季节性促销 —— 所有 heaters（加热器）和保暖毯享 8 折优惠。促销 2 月底结束，现在正是备货的好时机。"], ["These gift boxes are made of high-quality cardboard and come with ribbon and tissue paper. They’re perfect for holiday gifts or product packaging. We can print your company name on the box for a small extra fee.\"", "这些礼品盒采用优质硬纸板制作，附带丝带和包装纸 —— 非常适合节日礼品或产品包装。只需支付少量额外费用，我们还可在盒子上印制您的公司名称。"], ["Our team can help you create a custom order schedule—for example, monthly shipments of 200 units—to ensure you always have enough stock without overstocking. Would you like to discuss a schedule that fits your business?\"", "我们的团队可帮您制定定制化订单计划 —— 比如每月发货 200 件，确保您始终有充足库存且不会积压。想讨论一个符合您业务情况的计划吗？"], ["This digital scale is accurate to within 1 gram and can weigh up to 5kg. It’s used in kitchens, labs, and jewelry stores. It also has a backlit display for easy reading in low light. Do you need a power adapter or batteries included?\"", "这款电子秤精度可达 1 克，最大称重 5 公斤，适用于厨房、实验室和珠宝店，还带有背光显示屏，便于在光线不足时读取数据。您需要附带电源适配器还是电池？"], ["We offer technical training for our products—if you’re purchasing our software or equipment, we can provide a 1-hour online training session for your team to learn how to use it. The training is free for orders over $1000.\"", "我们为产品提供技术培训 —— 如您购买我们的软件或设备，可免费为您的团队提供 1 小时在线培训，指导使用方法。订单满 1000 美元即可享受该服务。"], ["These reusable shopping bags are foldable—they fit in a pocket when not in use. They’re made of durable polyester and can hold up to 20kg. Many grocery stores and retailers use them for promotions.\"", "这些可重复使用的购物袋可折叠 —— 不用时能放入口袋，采用耐用聚酯材料制作，承重可达 20 公斤，很多杂货店和零售商用它们做促销。"], ["We can adjust the product size to fit your needs—for example, if you need our storage bins to be 30cm instead of 40cm, we can modify the production. The lead time for custom sizes is just 2 weeks longer than standard sizes.\"", "我们可根据您的需求调整产品尺寸 —— 比如您需要我们的储物箱从 40 厘米改为 30 厘米，我们可以修改生产。定制尺寸的交货时间仅比标准尺寸多 2 周。"], ["This Bluetooth speaker has a built-in power bank—you can charge your phone while listening to music. It’s waterproof, so it’s safe to use by the pool or at the beach. What color do you prefer: blue, green, or black?\"", "这款蓝牙音箱内置充电宝 —— 您可以一边听音乐一边给手机充电，且具备防水功能，在泳池边或海滩使用也安全。您偏好蓝色、绿色还是黑色？"], ["We send out a monthly newsletter with new product updates, special offers, and industry tips. If you sign up, you’ll be the first to know about our latest promotions. Would you like to provide your email address to subscribe?\"", "我们每月发送电子通讯，包含新产品更新、特别优惠和行业小贴士。如您订阅，将第一时间了解我们的最新促销活动。您愿意提供邮箱地址订阅吗？"], ["This office desk is made of solid wood and has a scratch-resistant surface. It comes with 3 drawers for storage and can be assembled in 30 minutes with the included tools. Do you need us to send an assembly video along with the desk?\"", "这款办公桌采用实木制作，表面防刮擦，带有 3 个储物抽屉，使用附带工具 30 分钟即可组装完成。您需要我们随桌子一起发送组装视频吗？"], ["In our previous discussions, you mentioned that on-time delivery is a top priority for your team—we share that focus, and we’re willing to adjust our production schedule to ensure we meet your delivery deadlines. Can we confirm the exact timeline you need?\"", "在之前的讨论中，您提到准时交货是您团队的首要任务 —— 我们也非常重视这一点，愿意调整生产计划以确保满足您的交货期限。我们可以确认一下您需要的具体时间节点吗？"], ["We understand that in your market, customers value long-term after-sales support—we’re prepared to extend our warranty from 1 year to 2 years to align with that expectation. Would this help address your concerns about product maintenance?\"", "我们了解到，在您的市场中，客户重视长期售后支持 —— 我们准备将保修期从 1 年延长至 2 年，以符合这一期望。这是否能解决您对产品维护的顾虑？"], ["In many Western markets, payment terms of 30 days after delivery are common, but we recognize that in your region, 60 days is more standard. We’re willing to meet halfway and offer 45 days to support our partnership. Does this work for you?\"", "在许多西方市场，交货后 30 天付款是常见条款，但我们意识到在您的地区，60 天付款更为标准。我们愿意折中，提供 45 天付款期以支持双方合作。这对您来说可行吗？"], ["You mentioned that local certification is required to sell our products in your country—our team has experience with [specific certification, e.g., CE for Europe, SASO for Saudi Arabia], and we can cover the cost of obtaining the necessary certification for your market. How long does the certification process typically take in your region?\"", "您提到在贵国销售我们的产品需要本地认证 —— 我们的团队有 [具体认证，如欧洲 CE 认证、沙特 SASO 认证] 的相关经验，愿意承担为您市场获取所需认证的费用。在您的地区，认证流程通常需要多长时间？"], ["We know that building trust is key in Middle Eastern business culture—before finalizing the contract, we’d be happy to host a virtual tour of our factory so you can see our production process and quality control measures firsthand. Would you be available for this next week?\"", "我们了解到，在中东商业文化中，建立信任至关重要 —— 在敲定合同前，我们很乐意安排工厂虚拟参观，让您亲眼看到我们的生产流程和质量控制措施。您下周有时间参加吗？"], ["In Japanese business negotiations, it’s common to take time to align on details—we’re in no rush and want to ensure every clause in the contract meets both our needs. Let’s schedule another meeting next week to discuss the remaining terms thoroughly.\"", "在日本商务谈判中，通常会花时间协调细节 —— 我们不急于求成，希望确保合同中的每一条款都能满足双方需求。我们下周再安排一次会议，深入讨论剩余条款吧。"], ["You noted that your team prefers to communicate face-to-face for important decisions—while we typically use video calls, we’re willing to send a representative to your office for a in-person meeting if that’s more comfortable for you. When would be a good time?\"", "您提到您的团队在做重要决策时更倾向于面对面沟通 —— 虽然我们通常使用视频会议，但如果您觉得更合适，我们愿意派代表到您的办公室进行线下会议。什么时间比较方便？"], ["In Latin American markets, flexible pricing for long-term contracts is often expected—if you commit to a 2-year supply agreement, we can lock in a 5% discount for the entire term. Does this align with your long-term plans?\"", "在拉美市场，长期合同通常期望灵活定价 —— 如您承诺签订 2 年供应协议，我们可以为整个协议期锁定 5% 的折扣。这与您的长期计划相符吗？"], ["We understand that in Chinese business culture, gift-giving is a way to show respect—but we want to ensure we follow your company’s policies. Could you share any guidelines we should be aware of to avoid any misunderstandings?\"", "我们了解到在中国商业文化中，送礼是表达尊重的一种方式 —— 但我们希望遵守贵公司的政策。您能否分享一些我们应注意的准则，以避免误解？"], ["You mentioned that your customers have specific packaging preferences for eco-friendliness—we can switch to 100% recycled packaging for your orders, and we’ll provide a certificate to prove its environmental compliance. Would this help your product appeal to local consumers?\"", "您提到您的客户对包装有环保方面的特定偏好 —— 我们可以为您的订单改用 100% 再生包装，并提供合规证书证明其环保性。这是否有助于您的产品吸引本地消费者？"], ["In German negotiations, detailed technical specifications are essential—we’ve prepared a 20-page document that outlines every aspect of the product, from material composition to performance testing. We can go through it line by line in our next call.\"", "在德国谈判中，详细的技术规格至关重要 —— 我们已准备了一份 20 页的文件，概述了产品的各个方面，从材料成分到性能测试。我们可以在下次通话中逐行讨论。"], ["We recognize that in Indian business culture, building personal relationships takes time—we’re happy to schedule regular check-ins (even outside of formal negotiations) to get to know your team better. Would a monthly casual call work for you?\"", "我们意识到在印度商业文化中，建立个人关系需要时间 —— 我们很乐意安排定期沟通（即使在正式谈判之外），以更好地了解您的团队。每月一次轻松的通话对您来说可行吗？"], ["You noted that currency fluctuations are a concern for your business—we can denominate the contract in [your local currency, e.g., Indian Rupee] instead of USD to help you avoid exchange rate risks. Would this be a helpful adjustment?\"", "您提到汇率波动是贵公司的顾虑 —— 我们可以将合同货币改为 [您的本地货币，如印度卢比] 而非美元，帮助您规避汇率风险。这是否是一个有帮助的调整？"], ["In French business culture, formal titles are important—we’ll ensure all our communications refer to your team members by their proper titles (e.g., Monsieur le Directeur) to show respect. Please let us know if we should adjust any names or titles.\"", "在法国商业文化中，正式称谓很重要 —— 我们会确保所有沟通中都使用您团队成员的正确称谓（如 “总监先生”）以表示尊重。如需要调整任何姓名或称谓，请告知我们。"], ["We understand that in Australian business culture, informality is common—but we want to match your style. If you prefer us to use first names instead of titles, please let us know—we’re happy to adapt.\"", "我们了解到在澳大利亚商业文化中，非正式沟通很常见 —— 但我们希望配合您的风格。如您希望我们使用名字而非头衔，请告知我们 —— 我们很乐意调整。"], ["You mentioned that your market has strict import regulations—our logistics team has experience clearing customs in your country, and we can take full responsibility for preparing all the necessary documents (e.g., certificate of origin, import license). This will save you time and effort.\"", "您提到贵国市场有严格的进口法规 —— 我们的物流团队有在贵国清关的经验，愿意全权负责准备所有必要文件（如原产地证明、进口许可证），为您节省时间和精力。"], ["In Middle Eastern negotiations, it’s common to discuss non-business topics first to build rapport—we’d love to hear about your recent travels or favorite local traditions before we dive into contract details. How was your weekend?\"", "在中东谈判中，通常会先讨论非业务话题以建立融洽关系 —— 在深入合同细节前，我们很乐意听听您最近的旅行经历或喜欢的本地传统。您周末过得怎么样？"], ["We recognize that in Korean business culture, hierarchy is important—we’ll ensure our team’s senior representative leads the negotiations and coordinates with your corresponding senior team member. Can we confirm who will be your main point of contact?\"", "我们意识到在韩国商业文化中，等级制度很重要 —— 我们会确保由团队高级代表主导谈判，并与您对应的高级团队成员对接。我们可以确认一下您的主要联系人是谁吗？"], ["You noted that your customers prefer products with local language support—we can add [your local language, e.g., Spanish] to the product manual and user interface at no extra cost. How soon do you need this feature implemented?\"", "您提到您的客户偏好带有本地语言支持的产品 —— 我们可以免费在产品手册和用户界面中添加 [您的本地语言，如西班牙语]。您需要多久内实现这个功能？"], ["In British business culture, understatement is common—we’ll avoid overly aggressive language in our proposals and focus on clear, practical solutions. If you ever need us to clarify our intentions, please don’t hesitate to ask.\"", "在英国商业文化中，含蓄表达很常见 —— 我们会在提案中避免过于强硬的措辞，专注于清晰、实用的解决方案。如您需要我们澄清任何意图，请随时提出。"], ["We understand that in Brazilian business culture, flexibility with meeting times is expected—if a last-minute conflict arises, please let us know, and we’ll reschedule immediately. We want to be as accommodating as possible.\"", "我们了解到在巴西商业文化中，会议时间的灵活性是被期望的 —— 如临时出现冲突，请告知我们，我们会立即重新安排。我们希望尽可能提供便利。"], ["You mentioned that your company values social responsibility—our factory is certified by [ethical standard, e.g., Fair Trade], and we can share our annual sustainability report with you. This will help your customers know they’re supporting a responsible supply chain. Would you like us to include this certification logo on the product packaging for your market?\"", "您提到贵公司重视社会责任 —— 我们的工厂通过了 [道德标准，如公平贸易] 认证，并且可以向您分享我们的年度可持续发展报告。这能让您的客户知道他们在支持一条负责任的供应链。您希望我们在面向您市场的产品包装上添加这个认证标识吗？"], ["In Canadian business culture, inclusivity and respect for diverse perspectives are key—we’ll ensure our proposals consider the needs of all your stakeholders, from end consumers to your internal team. If you have specific groups we should prioritize, please share those details.\"", "在加拿大商业文化中，包容性和对多元观点的尊重是核心 —— 我们会确保提案考虑到您所有利益相关者的需求，从终端消费者到您的内部团队。如您有需要优先考虑的特定群体，请分享相关细节。"], ["You noted that your market has strict labeling requirements—our design team will create labels that meet all local regulations (e.g., ingredient lists in both English and French for Quebec) and send you a draft for approval before production. This ensures no delays due to labeling issues.\"", "您提到贵市场有严格的标签要求 —— 我们的设计团队会制作符合所有本地法规的标签（如魁北克地区需同时包含英文和法文成分表），并在生产前将草案发送给您审批。这能确保不会因标签问题导致延误。"], ["We recognize that in Southeast Asian business culture, building trust through referrals is common—we can provide contact information for our existing clients in your region, so you can hear about their experience working with us firsthand. Would you like to connect with any of them?\"", "我们意识到在东南亚商业文化中，通过推荐建立信任很常见 —— 我们可以提供我们在您所在地区现有客户的联系方式，让您直接了解他们与我们合作的体验。您希望与其中任何一位客户沟通吗？"], ["In Italian business negotiations, attention to detail and quality is paramount—we’ll provide samples of our product with different finish options (e.g., matte vs. glossy) so you can evaluate the quality in person. We’ll also include a detailed quality checklist for your review.\"", "在意大利商务谈判中，对细节和质量的关注至关重要 —— 我们会提供带有不同表面处理选项（如哑光 vs 亮面）的产品样品，让您亲自评估质量，同时还会附上详细的质量检查表供您审阅。"], ["You mentioned that seasonal demand fluctuations impact your inventory—we can set up a ‘flexible order’ system, where you can adjust the shipment quantity up or down by 20% within 2 weeks of the scheduled delivery. This helps you avoid overstocking or stockouts during peak seasons.\"", "您提到季节性需求波动会影响您的库存 —— 我们可以建立一个 “灵活订单” 系统，让您在计划交货日期前 2 周内，将发货数量上下调整 20%。这能帮助您在旺季避免库存积压或缺货。"], ["We understand that in Mexican business culture, personal connections matter—our local representative in Mexico City would be happy to meet with you in person to discuss the partnership. They’re familiar with both local market trends and our product line, so they can address your questions effectively.\"", "我们了解到在墨西哥商业文化中，个人关系很重要 —— 我们在墨西哥城的本地代表很乐意与您当面讨论合作事宜。他们既熟悉本地市场趋势，也了解我们的产品线，能够高效解答您的问题。"], ["You noted that your team needs time to review contracts with legal counsel—we’ll provide the draft contract 2 weeks in advance of our next meeting, and we’re willing to extend the review period if needed. We want to ensure you have enough time to make an informed decision.\"", "您提到您的团队需要时间与法律顾问一起审阅合同 —— 我们会在下次会议前 2 周提供合同草案，如有需要，还愿意延长审阅期。我们希望确保您有足够的时间做出明智的决定。"], ["In Dutch business culture, direct and transparent communication is preferred—we’ll be clear about our pricing structure, production capabilities, and potential challenges from the start. If you have any questions or concerns, please feel free to ask directly, and we’ll provide honest answers.\"", "在荷兰商业文化中，直接且透明的沟通更受青睐 —— 我们会从一开始就明确说明我们的定价结构、生产能力和潜在挑战。如您有任何疑问或顾虑，请随时直接提出，我们会给出诚实的答复。"], ["Hi [Client Name], I’m following up on the technical issue you reported yesterday about the software crashing. Our IT team has identified the problem—it’s a compatibility issue with your operating system—and they’ve prepared a patch. I’ll send the patch to you via email now, along with step-by-step installation instructions. Let me know if you need help with the installation.\"", "您好，[客户姓名]，我来跟进您昨天反馈的软件崩溃技术问题。我们的 IT 团队已找到原因 —— 是与您的操作系统存在兼容性问题 —— 并且已准备好修复补丁。我现在会通过邮件将补丁发送给您，同时附上分步安装说明。如安装时需要帮助，请随时告知。"], ["Thank you for sending the photos of the malfunctioning printer. From what we can see, the issue is with the paper feed roller—its surface has worn down, causing paper jams. We can send a replacement roller to you for free, and it should arrive within 3 days. We also have a video tutorial on how to replace the roller, which I’ll share with you shortly.\"", "感谢您发送故障打印机的照片。从照片中可以看出，问题出在进纸辊上 —— 它的表面已磨损，导致卡纸。我们可以免费为您寄送一个替换进纸辊，3 天内即可送达。我们还有一个更换进纸辊的视频教程，稍后会分享给您。"], ["I understand you’re having trouble connecting the wireless sensor to your phone. Let’s try a few quick troubleshooting steps first: 1) Make sure the sensor is turned on and within 10 meters of your phone; 2) Restart your phone and the sensor; 3) Check if the sensor’s battery is charged. If these steps don’t work, we can schedule a 15-minute video call to walk through the process together.\"", "我了解到您在将无线传感器连接到手机时遇到了困难。我们先尝试几个快速故障排除步骤：1）确保传感器已开启且与手机的距离在 10 米以内；2）重启手机和传感器；3）检查传感器电池是否已充电。如这些步骤无效，我们可以安排 15 分钟的视频通话，一起逐步操作。"], ["You mentioned that the temperature reading from the thermometer is inconsistent. This is usually caused by two factors: either the thermometer isn’t calibrated correctly, or it’s being used in a drafty area. I’ll send you a calibration guide via email—follow those steps, and then test the thermometer in a room with no direct airflow. If the issue persists, we’ll replace the thermometer for you.\"", "您提到温度计的读数不稳定。这通常由两个原因导致：要么是温度计未正确校准，要么是在通风不良的区域使用。我会通过邮件发送校准指南 —— 按照指南步骤操作后，在无直吹风的房间测试温度计。如问题仍存在，我们会为您更换温度计。"], ["Our technical support team is available 24/7 for urgent issues—if you’re experiencing a problem that’s stopping your business operations (like a server crash), you can call our emergency hotline at [phone number], and a technician will respond within 30 minutes. For non-urgent issues, you can submit a support ticket via our website, and we’ll get back to you within 2 hours.\"", "我们的技术支持团队为紧急问题提供 24 小时服务 —— 如您遇到导致业务中断的问题（如服务器崩溃），可拨打我们的紧急热线 [电话号码]，技术人员将在 30 分钟内响应。对于非紧急问题，您可通过我们的网站提交支持工单，我们会在 2 小时内回复。"], ["I see you’re having trouble accessing the data stored on the external hard drive. First, try connecting it to a different USB port on your computer—sometimes the port is faulty. If that doesn’t work, download our data recovery tool from [website link] and run a scan. The tool can often fix minor connection issues. If the drive still isn’t recognized, let us know, and we’ll arrange for a data recovery service (covered under warranty).\"", "我了解到您在访问外置硬盘上存储的数据时遇到了困难。首先，尝试将硬盘连接到电脑上的其他 USB 端口 —— 有时是端口出现故障。如无效，请从 [网站链接] 下载我们的数据恢复工具并运行扫描。该工具通常能修复轻微的连接问题。如硬盘仍无法被识别，请告知我们，我们会安排数据恢复服务（在保修范围内）。"], ["The error message you’re seeing on the POS system means the software needs to be updated to the latest version. Old versions sometimes have bugs that cause transaction failures. I’ll send you a link to download the update—make sure to back up your data before installing it (we have a guide on how to back up data, too). If you’re worried about the update process, we can do it remotely for you.\"", "您在 POS 系统上看到的错误提示表明软件需要更新到最新版本。旧版本有时会存在导致交易失败的漏洞。我会发送更新下载链接给您 —— 安装前请务必备份数据（我们也有数据备份指南）。如您对更新流程有顾虑，我们可以远程帮您完成。"], ["Thank you for reporting the issue with the security camera’s night vision—we’ve had a few similar reports, and our engineering team has identified a firmware bug. They’re releasing a firmware update next week that fixes the problem. As soon as the update is available, we’ll send you an email with instructions on how to install it. In the meantime, you can adjust the camera’s brightness settings to improve night vision temporarily.\"", "感谢您反馈监控摄像头夜视功能的问题 —— 我们已收到几起类似报告，工程团队已确认是固件漏洞导致。他们将于下周发布修复该问题的固件更新。更新一经发布，我们会立即发送邮件，附上安装说明。在此期间，您可以调整摄像头的亮度设置，暂时改善夜视效果。"], ["You mentioned that the blender is making a loud noise when in use—this is likely because the blades aren’t tightened properly. Turn off the blender, unplug it, and check if the blade assembly is screwed on firmly. If it is, the blades might be dull (which can cause extra noise), and we can send a replacement blade set for free. Let us know which issue it is.\"", "您提到搅拌机使用时噪音很大 —— 这很可能是因为刀片未拧紧。请关闭搅拌机并拔掉电源，检查刀片组件是否已牢固拧紧。如已拧紧，则可能是刀片变钝（会导致额外噪音），我们可以免费寄送替换刀片组。请告知我们具体是哪种情况。"], ["I understand the smart thermostat isn’t syncing with your home Wi-Fi. Let’s check two things first: 1) Is your Wi-Fi using a 2.4GHz network? Our thermostats don’t work with 5GHz networks yet. 2) Is the thermostat within range of your router (no more than 30 meters)? If both are okay, we can reset the thermostat to factory settings and try syncing again—I’ll walk you through the reset steps over the phone.\"", "我了解到智能恒温器无法与您家的 Wi-Fi 同步。我们先检查两点：1）您的 Wi-Fi 是否使用 2.4GHz 频段？我们的恒温器目前暂不支持 5GHz 频段。2）恒温器是否在路由器的覆盖范围内（不超过 30 米）？如两点都没问题，我们可以将恒温器重置为出厂设置，再尝试同步 —— 我会在电话中指导您完成重置步骤。"], ["The issue with the laptop’s battery draining quickly might be due to background apps using too much power. I’ll send you a list of steps to check which apps are using the most battery—closing unused apps can extend battery life. If that doesn’t help, the battery might need to be replaced, and since your laptop is still under warranty, we’ll cover the cost of the replacement and installation.\"", "笔记本电脑电池耗电快的问题，可能是因为后台应用程序消耗过多电量。我会发送步骤清单，教您查看哪些应用耗电最多 —— 关闭未使用的应用可延长电池寿命。如无效，则可能需要更换电池；由于您的笔记本仍在保修期内，我们会承担更换和安装费用。"], ["Thank you for sharing the video of the treadmill’s belt slipping. This is a common issue that’s easy to fix—you just need to adjust the tension of the belt. I’ll send you a manual with photos showing how to turn the tension bolts (located at the back of the treadmill). If you’re not comfortable doing it yourself, we can arrange for a local technician to visit your location (free of charge for warranty claims).\"", "感谢您分享跑步机跑带打滑的视频。这是个常见问题，很容易解决 —— 只需调整跑带的张力即可。我会发送一本手册，其中附带照片，说明如何转动张力螺栓（位于跑步机后部）。如您不放心自己操作，我们可以安排本地技术人员上门服务（保修范围内免费）。"], ["You’re having trouble with the email integration on our CRM software—let’s verify your email settings first. The incoming mail server should be ‘imap.yourdomain.com’ and the outgoing server ‘smtp.yourdomain.com.’ Also, make sure you’re using your full email address as the username and your email password (not your CRM password). If the settings are correct, we can check if your email provider is blocking the CRM’s access—our team can work with your IT department to resolve this.\"", "您在我们的 CRM 软件上遇到了邮件集成问题 —— 我们先验证您的邮件设置。接收邮件服务器应为 “imap.yourdomain.com”，发送邮件服务器应为 “smtp.yourdomain.com”。同时，请确保用户名是您的完整邮箱地址，密码是您的邮箱密码（而非 CRM 密码）。如设置正确，我们可以检查您的邮箱提供商是否阻止了 CRM 的访问 —— 我们的团队可与您的 IT 部门合作解决此问题。"], ["The projector’s image is blurry—first, try adjusting the focus ring on the lens (it’s on the front of the projector). If that doesn’t clear up the image, check if the projector lens is clean—use a microfiber cloth to wipe off any dust. If the image is still blurry, the lens might be damaged, and we’ll send a replacement projector to you within 5 days (we’ll arrange for the old one to be picked up, too).\"", "投影仪画面模糊 —— 首先，尝试调整镜头上的对焦环（位于投影仪正面）。如画面仍不清晰，请检查投影仪镜头是否干净 —— 用超细纤维布擦拭灰尘。如画面依旧模糊，则可能是镜头损坏，我们会在 5 天内为您寄送替换投影仪（同时安排回收旧机）。"], ["I see you’re getting an error when trying to print from the accounting software. This is usually because the software isn’t set to use the correct printer. Go to ‘Settings’ > ‘Print’ > ‘Select Printer’ and choose your default printer from the list. If your printer isn’t listed, restart the printer and your computer—this should make it appear. If you still have trouble, we can do a remote session to fix the settings for you.\"", "我了解到您在尝试从会计软件打印时遇到错误。这通常是因为软件未设置为使用正确的打印机。请进入 “设置”>“打印”>“选择打印机”，从列表中选择您的默认打印机。如列表中没有您的打印机，请重启打印机和电脑 —— 这样打印机通常会显示出来。如仍有问题，我们可以进行远程会话，帮您修复设置。"]];window.__KEY__="外贸口语355";window.__TITLE__="外贸口语355";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
