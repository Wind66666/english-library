51 is better, but we still hope to get a 2% discount—after all, we’re placing an order of 1000 units, which is a large quantity.”", "（客户：“51 美元比之前好，但我们仍希望获得 2% 的折扣 —— 毕竟我们要下 1000 件的订单，量很大。”）—— 分析：客户以 “大订单量” 为理由进一步压价，此时需评估订单量带来的成本优势，适当让步以促成合作，同时明确让步的前提是订单量落地。"], ["Our side: “A 1000-unit order is indeed a large quantity, and we’re willing to offer a 1.5% discount on the premise that the order is confirmed within this week—bringing the unit price to $50.235. This discount already reflects our recognition of your order scale, and we can’t go lower without affecting profit margins.”", "（我方：“1000 件订单确实是大订单，我们愿意在本周内确认订单的前提下，提供 1.5% 的折扣，使单价降至 50.235 美元。该折扣已体现我们对您订单规模的认可，再低就会影响利润率，我们无法接受。”）—— 分析：我方将让步与 “订单确认时间” 绑定，既回应客户 “大订单” 的诉求，又推动其尽快决策，同时用具体折扣比例和价格金额显示诚意，避免客户继续纠缠折扣幅度。"], ["Client: “This week is too tight—we need to review the contract with our legal team, which takes at least 10 days. Can we extend the confirmation deadline to 10 days?”", "（客户：“本周时间太紧，我们需要和法务团队审核合同，至少需要 10 天。能把确认期限延长到 10 天吗？”）—— 分析：客户以 “法务审核” 为由延长决策时间，此时需平衡 “等待时间” 与 “自身利益”，可适当延长期限，但需明确期限内价格的有效性，避免市场波动带来的风险。"], ["Our side: “We understand that legal review takes time, so we can extend the confirmation deadline to 10 days. However, due to the volatility of raw material prices (which have risen 3% in the past month), this $50.235 unit price will only be valid for 10 days. If the order is confirmed after 10 days, we may need to adjust the price based on the latest raw material costs.”", "（我方：“我们理解法务审核需要时间，因此可将确认期限延长至 10 天。但由于原材料价格波动（过去一个月已上涨 3%），该 50.235 美元的单价仅在 10 天内有效。若 10 天后确认订单，我们可能需要根据最新原材料成本调整价格。”）—— 分析：我方同意延长期限，同时用 “原材料价格波动” 为价格有效期设定合理理由，既体现灵活性，又避免长期锁定低价导致自身损失，让客户理解 “尽快确认” 的必要性。"], ["Client: “Raw material price fluctuations are understandable. But can you guarantee that if prices drop within 10 days, you’ll lower the unit price accordingly?”", "（客户：“原材料价格波动可以理解。但你们能保证如果 10 天内价格下跌，也会相应降低单价吗？”）—— 分析：客户试图在价格条款上寻求双向保障，此时需明确 “价格调整的原则”，避免做出无条件的降价承诺，同时保持公平性表述。"], ["Our side: “We can commit to a ‘price adjustment mechanism’: if the raw material price drops by more than 2% within 10 days, we’ll lower the unit price by 1% accordingly; if the drop is less than 2%, the price will remain unchanged. This mechanism balances both parties’ interests—we won’t benefit from price drops, and you won’t bear the full risk of price increases.”", "（我方：“我们可承诺‘价格调整机制’：若 10 天内原材料价格下跌超过 2%，我们将相应降低 1% 的单价；若跌幅低于 2%，价格保持不变。该机制平衡双方利益 —— 我们不会从价格下跌中获利，您也无需承担全部价格上涨风险。”）—— 分析：我方提出有条件的价格调整机制，既回应客户对 “价格下跌” 的担忧，又避免无底线的降价承诺，用具体比例体现公平性，让客户感受到被尊重。"], ["Client: “The mechanism is fair. Let’s confirm the key terms again: 1000 units, unit price $50.235 (valid for 10 days), 1-year basic warranty, no additional services, and price adjustment based on raw material fluctuations over 2%.”", "（客户：“该机制很公平。我们再确认下核心条款：1000 件，单价 50.235 美元（10 天有效），1 年基础保修，无额外服务，原材料波动超 2% 时调整价格。”）—— 分析：客户主动确认核心条款，表明其已基本接受方案，此时需清晰回应并补充细节，避免后续争议。"], ["Our side: “That’s exactly right. Additionally, we’ll deliver the goods in two batches: 500 units within 15 days of order confirmation, and the remaining 500 units within 30 days. This batch delivery schedule can help you reduce inventory pressure. Is this acceptable to you?”", "（我方：“完全正确。此外，我们将分两批交货：订单确认后 15 天内交付 500 件，剩余 500 件在 30 天内交付。这种分批交货方式可帮助您减轻库存压力。您对此是否接受？”）—— 分析：我方在确认核心条款的同时，主动提出对客户有利的交货方案，既体现合作诚意，又为订单落地增加 “附加价值”，避免客户因 “细节不满” 而犹豫。"], ["Client: “Batch delivery is good—we just need the first batch to arrive within 12 days because we have a urgent production need. Can you adjust that?”", "（客户：“分批交货很好 —— 但我们第一批货需要在 12 天内到，因为有紧急生产需求。你们能调整吗？”）—— 分析：客户在交货期上提出小幅调整，此时需评估提前交货的可行性，若成本可控，可适当满足以促成最终共识。"], ["Our side: “We can adjust the first batch delivery time to 12 days—we’ll prioritize your order in production to meet your urgent needs. The second batch will still be delivered within 30 days as planned. This adjustment doesn’t involve additional costs, so the unit price remains unchanged.”", "（我方：“我们可将第一批交货时间调整至 12 天 —— 我们会在生产中优先处理您的订单，以满足您的紧急需求。第二批仍按计划在 30 天内交付。该调整不涉及额外成本，因此单价保持不变。”）—— 分析：我方满足客户的紧急需求，且不额外加价，既体现灵活性和诚意，又避免因小调整导致价格重新谈判，加速订单确认进程。"], ["Client: “Perfect. We’ll start the legal review tomorrow and confirm the order within 10 days. Thank you for your flexibility.”", "（客户：“非常好。我们明天开始法务审核，会在 10 天内确认订单。感谢你们的灵活性。”）—— 分析：客户明确表达审核和确认计划，谈判基本达成一致，此时需表达感谢并给出后续对接安排，为合作开启良好开端。"], ["Our side: “Thank you for your trust. We’ll send the draft contract to your email this afternoon, and our sales representative will be in charge of following up on the review progress. If you have any questions during the review, feel free to contact us at any time.”", "（我方：“感谢您的信任。我们今天下午会将合同草案发送至您的邮箱，由我们的销售代表负责跟进审核进度。若审核期间有任何问题，欢迎随时联系我们。”）—— 分析：我方明确后续对接流程和责任人，让客户感受到专业的服务支持，同时表达对合作的重视，为订单顺利落地提供保障。"], ["Client: “We’ve reviewed the contract, and the only concern is the payment term—your proposal is 30% advance payment, but we usually pay 20% in advance. Can we adjust this?”", "（客户：“我们已审核合同，唯一的顾虑是付款条款 —— 你们提议预付 30%，但我们通常预付 20%。能调整吗？”）—— 分析：客户在合同审核后提出单一条款调整，而非全盘否定，表明其有强烈的合作意愿，此时需在付款比例上适当让步，避免因小条款阻碍合作。"], ["Our side: “We understand your usual payment practice. To accommodate your needs, we can reduce the advance payment ratio to 25%—this balances our need for initial capital turnover and your usual payment habits. The remaining 75% will be paid within 15 days of the first batch delivery, as originally proposed.”", "（我方：“我们理解您通常的付款惯例。为配合您的需求，我们可将预付款比例降至 25%—— 这既平衡了我们对初始资金周转的需求，也兼顾了您的付款习惯。剩余 75% 仍按原提议，在第一批货交付后 15 天内支付。”）—— 分析：我方做出小幅让步，而非完全满足客户的 20% 诉求，既体现对客户的尊重，又保障自身资金安全，同时明确剩余款项的支付方式，避免条款模糊。"], ["Client: “25% is acceptable. Another small issue: can you add a ‘quality inspection before delivery’ clause, so we can send someone to your factory to inspect the goods before shipment?”", "（客户：“25% 可以接受。还有一个小问题：能否增加‘交货前质量检验’条款，让我们在发货前派人到你们工厂验货？”）—— 分析：客户提出质量检验需求，本质是为了降低收货风险，此时需同意合理的检验要求，同时明确检验流程和时间，避免延误交货。"], ["Our side: “We fully support your need for quality assurance—we can add the ‘pre-delivery quality inspection’ clause. We’ll notify you 3 days before the scheduled shipment, and you can send 1-2 inspectors to our factory. The inspection should be completed within 2 working days to avoid delaying the delivery schedule. If the goods pass the inspection, we’ll ship them as planned; if there are quality issues, we’ll rework them immediately.”", "（我方：“我们完全支持您对质量保障的需求 —— 可以增加‘交货前质量检验’条款。我们会在计划发货前 3 天通知您，您可派 1-2 名检验人员到我们工厂。检验需在 2 个工作日内完成，以免延误交货进度。若货物通过检验，我们按计划发货；若存在质量问题，我们立即返工。”）—— 分析：我方不仅同意检验要求，还主动明确检验的时间、人数和后续处理方案，既消除客户的质量顾虑，又避免因检验流程不清晰导致交货延迟，体现专业的项目管理能力。"], ["Client: “The inspection terms are clear. We’ll confirm the order tomorrow and make the 25% advance payment within 3 working days of confirmation.”", "（客户：“检验条款很清晰。我们明天确认订单，确认后 3 个工作日内支付 25% 的预付款。”）—— 分析：客户明确订单确认和付款时间，谈判进入最终落地阶段，此时需表达感谢并确认后续发货安排，确保合作流程顺畅。"], ["Our side: “Thank you for your confirmation. Once we receive the advance payment, we’ll start arranging production immediately and notify you of the production progress every 5 days. We’ll also send the factory address and contact person for the pre-delivery inspection in the order confirmation email tomorrow.”", "（我方：“感谢您的确认。一旦收到预付款，我们立即开始安排生产，每 5 天向您同步一次生产进度。明天的订单确认邮件中，我们还会附上交货前检验的工厂地址和联系人。”）—— 分析：我方明确后续生产、进度同步和检验对接的细节，让客户对合作流程有清晰的预期，增强其对合作的信心，同时体现我方的执行力。"], ["Client: “We just received the order confirmation email—thank you for the detailed production schedule. One thing: can we get a sample of the product before mass production starts? It’ll help us confirm the quality in advance.”", "（客户：“我们刚收到订单确认邮件 —— 感谢详细的生产计划。还有一点：大批量生产前能给我们提供一个产品样品吗？这能帮助我们提前确认质量。”）—— 分析：客户提出产前样品需求，是对质量的进一步保障诉求，此时需同意合理需求，同时明确样品制作和确认时间，避免影响量产进度。"], ["Our side: “We can provide a pre-production sample—we’ll finish making it within 3 working days and send it to you via express delivery. You can confirm the quality within 2 working days of receiving the sample. If there are any adjustments needed, we’ll modify the sample immediately; if it’s confirmed, we’ll start mass production the next day. This won’t affect the original delivery schedule.”", "（我方：“我们可以提供产前样品 ——3 个工作日内制作完成并通过快递寄给您。您可在收到样品后 2 个工作日内确认质量。若需要调整，我们立即修改样品；若确认无误，次日即开始大批量生产。这不会影响原有的交货进度。”）—— 分析：我方同意提供样品，同时明确样品的制作、确认时间和后续量产衔接方案，既满足客户的质量确认需求，又保障整体生产进度不受影响，体现高效的流程管理。"], ["Client: “The sample arrangement is perfect. We’ll confirm the sample as soon as we receive it. Looking forward to the first batch delivery in 12 days.”", "（客户：“样品安排非常好。我们收到样品后会立即确认。期待 12 天后第一批货的交付。”）—— 分析：客户对样品安排表示满意，同时表达对交货的期待，此时需回应期待并承诺保障交货质量和时间，强化合作信心。"], ["Our side: “We’ll ensure the sample quality meets the agreed standards, and the mass-produced products will be consistent with the sample. We’ll also send you the logistics tracking number once the first batch is shipped, so you can track the delivery progress in real time.”", "（我方：“我们会确保样品质量符合约定标准，且量产产品与样品保持一致。第一批货发出后，我们还会将物流跟踪号发给您，方便您实时追踪交货进度。”）—— 分析：我方做出质量一致性承诺，并提供物流追踪服务，让客户对后续交货环节有清晰的掌控感，进一步消除其顾虑，为长期合作奠定信任基础。"], ["Client: “We’ve received the sample and confirmed the quality—it’s exactly what we need. You can start mass production now.”", "（客户：“我们已收到样品并确认质量 —— 完全符合我们的需求。你们现在可以开始量产了。”）—— 分析：客户确认样品质量，量产正式启动，此时需告知客户量产启动时间和关键节点，让其了解生产进展。"], ["Our side: “Thank you for the sample confirmation. We started mass production this morning, and the production of the first 500 units is expected to be completed on the 7th day. We’ll send you a production progress photo every 3 days to let you visually check the production status.”", "（我方：“感谢您的样品确认。我们今早已启动量产，第一批 500 件预计在第 7 天完成生产。我们会每 3 天给您发送一张生产进度照片，让您直观了解生产情况。”）—— 分析：我方主动提供 “可视化进度反馈”，用具体时间节点和照片形式让客户实时掌握量产动态，既体现透明化管理，又消除客户对 “生产是否按时推进” 的担忧，增强合作信任感。"], ["Client: “The progress update method is very thoughtful. One thing to confirm: if there are any minor quality defects in the mass-produced products, how will you handle them?”", "（客户：“进度更新方式很贴心。有一点需确认：若量产产品中存在轻微质量瑕疵，你们会如何处理？”）—— 分析：客户提前关注量产中的质量问题处理方案，体现其对交付质量的重视，此时需给出明确、可执行的售后方案，避免后续出现争议时无据可依。"], ["Our side: “We have a strict quality inspection process during mass production—each product will go through 3 rounds of inspection. If any minor defects are found (that don’t affect use), we’ll mark them clearly and provide a 5% discount on the defective products; if the defects affect use, we’ll rework them immediately and deliver the reworked products within 3 days. We’ll never ship non-conforming products that affect normal use.”", "（我方：“我们在量产过程中有严格的质检流程 —— 每件产品都会经过 3 轮检验。若发现轻微瑕（不影响使用），我们会明确标注并对瑕疵品给予 5% 的折扣；若瑕疵影响使用，我们会立即返工，并在 3 天内交付返工后的产品。我们绝不会交付影响正常使用的不合格产品。”）—— 分析：我方区分 “轻微瑕疵” 和 “功能性瑕疵” 给出不同处理方案，既体现对质量的严谨态度，又用具体折扣和时间承诺让客户感受到方案的可行性，避免因 “瑕疵处理模糊” 导致客户担忧。"], ["Client: “The quality handling plan is clear. We’ll send our inspector to your factory on the 7th day to conduct the pre-delivery inspection as agreed.”", "（客户：“质量处理方案很清晰。我们会在第 7 天派检验人员到你们工厂，按约定进行交货前检验。”）—— 分析：客户明确检验时间，标志着量产即将进入收尾阶段，此时需提前做好检验准备，确保检验顺利进行，避免延误交货。"], ["Our side: “We’ll prepare the inspection site and related documents (such as production records and quality test reports) in advance. Our quality manager will accompany your inspector during the inspection to answer any questions in a timely manner. If the inspection passes, we’ll arrange shipment on the same day; if there are minor issues, we’ll handle them according to the agreed plan and notify you of the adjusted shipment time immediately.”", "（我方：“我们会提前准备好检验场地和相关文件（如生产记录、质量检测报告）。检验期间，我们的质量经理会全程陪同您的检验人员，及时解答任何疑问。若检验通过，我们当天即安排发货；若存在轻微问题，我们会按约定方案处理，并立即告知您调整后的发货时间。”）—— 分析：我方提前明确检验前的准备工作和检验后的衔接流程，用 “全程陪同” 和 “及时反馈” 确保检验高效推进，避免因准备不足或沟通不畅导致检验延误，体现专业的项目对接能力。"], ["Client: “Our inspector has completed the inspection—all products pass, and there are no defective items. When will the first batch of goods be shipped, and which logistics company will you use?”", "（客户：“我们的检验人员已完成检验 —— 所有产品均合格，无瑕疵品。第一批货何时发货？会使用哪家物流公司？”）—— 分析：检验顺利通过，客户关注发货时间和物流信息，此时需明确告知关键信息，让客户做好收货准备，同时体现发货的及时性。"], ["Our side: “Great news! We’ve arranged shipment this afternoon, and we’re using DHL Logistics (which has a high on-time delivery rate in your region). The logistics tracking number is LX123456789, and you can check the real-time location of the goods on the DHL official website. The goods are expected to arrive at your warehouse on the 10th day (3 days after shipment), and we’ll also send you a reminder email 1 day before arrival.”", "（客户：“我们已查询物流跟踪信息 —— 货物已在运输途中。感谢你们这么快安排发货。第二批货何时开始生产？”）—— 分析：客户关注第二批货进度，表明其对整体合作流程满意，此时需明确第二批货的生产时间，保持合作节奏的连贯性，避免客户因 “信息不明确” 产生焦虑。"], ["Our side: “We’ll start production of the second batch (500 units) on the 8th day (tomorrow), and it’s expected to be completed on the 15th day. We’ll follow the same progress update method as the first batch—sending photos every 3 days. The pre-delivery inspection for the second batch can be arranged on the 15th day, and we’ll notify you 3 days in advance to confirm your inspector’s schedule.”", "（我方：“我们会在第 8 天（明天）启动第二批（500 件）的生产，预计在第 15 天完成。我们会沿用第一批的进度更新方式 —— 每 3 天发送照片。第二批的交货前检验可安排在第 15 天，我们会提前 3 天通知您，确认您检验人员的时间安排。”）—— 分析：我方保持与第一批货一致的 “进度同步” 和 “检验对接” 流程，让客户感受到合作的连贯性和稳定性，同时提前确认检验时间，体现对客户流程的尊重，避免因时间冲突导致延误。"], ["Client: “The second batch schedule is clear. We’ll confirm the inspector’s schedule and reply to you within 2 days. By the way, can you provide a copy of the shipment invoice for the first batch? We need it for financial settlement.”", "（客户：“第二批计划很清晰。我们会确认检验人员的时间安排，并在 2 天内回复你们。顺便问下，能提供第一批货的发货发票副本吗？我们财务结算需要。”）—— 分析：客户提出发票需求，属于合作中的常规行政对接，此时需快速响应，确保客户财务流程顺利推进，体现服务的细致性。"], ["Client: “The electronic version is enough—our finance team has received it. Thank you for the quick response. We’ll make the payment for the first batch (75% of the first batch amount) within 15 days of receiving the goods as agreed.”", "（客户：“电子版就足够了 —— 我们财务团队已收到。感谢快速响应。我们会按约定，在收到第一批货后 15 天内支付第一批货的款项（第一批金额的 75%）。”）—— 分析：客户明确付款时间，标志着合作进入 “款项结算” 阶段，此时需表达感谢并确认后续收款对接方式，确保款项顺利到账，同时保持良好的合作氛围。"], ["Our side: “Thank you for your commitment to the payment schedule. Our company’s bank account information is as follows: Account Name: XX Company; Bank Name: XX Bank; Account Number: 1234567890. After you make the payment, please send a copy of the payment receipt to our finance team (finance@ourcompany.com) so we can confirm the receipt of funds in a timely manner. We’ll also notify you immediately after confirming the payment.”", "（我方：“感谢您对付款时间的承诺。我司银行账户信息如下：账户名称：XX 公司；开户银行：XX 银行；账号：1234567890。您付款后，若能将付款凭证副本发送至我司财务团队邮箱（finance@ourcompany.com），我们可及时确认到账情况。确认到账后，我们也会立即通知您。”）—— 分析：我方清晰提供银行账户信息，同时明确 “付款后凭证对接” 和 “到账通知” 流程，用双向反馈机制确保款项结算透明、高效，避免因 “信息误差” 导致收款延误，体现专业的财务对接能力。"], ["Client: “We’ve received the first batch of goods, and the quality is consistent with the sample. We’ll start the payment process this week. For the second batch, can we adjust the delivery address to our branch office in City B? The original address was our headquarters in City A.”", "（客户：“我们已收到第一批货，质量与样品一致。我们本周会启动付款流程。关于第二批货，能否将交货地址调整为我们 B 市的分公司？原地址是 A 市总部。”）—— 分析：客户在收货后提出第二批货地址调整需求，属于合理的临时变更，此时需快速确认地址变更的可行性，避免因 “无法满足调整” 导致客户不便，同时明确调整后的物流安排。"], ["Our side: “We can adjust the delivery address to your branch office in City B. Please provide the detailed address (including street, building number, and contact person) and we’ll update it in our logistics system immediately. The logistics cost for shipping to City B is the same as to City A, so there’s no additional cost. We’ll also confirm the new address with your inspector during the pre-delivery inspection of the second batch to avoid delivery errors.”", "（我方：“我们可以将交货地址调整为您 B 市的分公司。请提供详细地址（含街道、门牌号、联系人），我们会立即在物流系统中更新。发往 B 市的物流成本与 A 市相同，无额外费用。我们还会在第二批货的交货前检验时，与您的检验人员确认新地址，避免发货错误。”）—— 分析：我方不仅同意地址调整，还主动确认 “无额外成本”，消除客户对 “费用增加” 的担忧，同时通过 “与检验人员二次确认” 的方式降低地址错误风险，体现服务的严谨性和客户导向。"], ["Client: “Great! The detailed address of our branch in City B is: No. 123 Main Street, City B, Contact Person: Li Ming, Phone: 138XXXX8888. Thank you for accommodating this adjustment.”", "（客户：“太好了！我们 B 市分公司的详细地址是：B 市 Main Street 123 号，联系人：李明，电话：138XXXX8888。感谢配合这次调整。”）—— 分析：客户提供详细地址，地址调整需求落地，此时需确认信息并告知后续物流安排，让客户放心。"], ["Our side: “We’ve recorded the new address and updated it in our logistics system. The second batch of goods will be shipped to this address after passing the inspection. We’ll also include the contact person’s phone number on the shipping label to facilitate communication between the logistics company and your branch office. We’ll send you a logistics tracking number as soon as the second batch is shipped.”", "（我方：“我们已记录新地址并在物流系统中更新。第二批货检验通过后会发往该地址。我们还会在货运标签上注明联系人电话，方便物流公司与您分公司沟通。第二批货一旦发货，我们会立即给您发送物流跟踪号。”）—— 分析：我方通过 “系统更新、标签标注、跟踪号反馈” 等细节，确保地址调整后的物流环节准确无误，同时主动提供后续跟踪服务，让客户对第二批货的交付全程可控，进一步巩固客户满意度。"], ["Client: “The second batch inspection has passed, and we’ve been notified that the goods are in transit. We’ve also started the payment process for the first batch—the payment will be credited to your account within 3 working days.”", "（我方：“感谢您及时安排付款。我们会关注资金到账情况，确认后立即通知您。关于第二批货，我们会跟进物流进度，并在到达您 B 市分公司前 1 天发送提醒邮件。您收到第二批货后，若有后续合作需求如再订购、产品维护），欢迎随时联系我们。”）—— 分析：我方在确认付款对接的同时，继续保障第二批货的交付跟踪，还主动提及 “后续合作”，既体现对当前合作的负责态度，又为未来长期合作埋下伏笔，让客户感受到 “合作不止于单次订单” 的价值。"], ["Client: “We’ve received the second batch of goods, and the quality is still good. We’ve also confirmed that your company has received the payment for the first batch. This cooperation has been very smooth—thank you for your professional service.”", "（客户：“我们已收到第二批货，质量依旧良好。我们也确认贵公司已收到第一批货的款项。这次合作非常顺畅 —— 感谢你们的专业服务。”）—— 分析：客户明确表达对合作的满意，标志着单次合作正式完成，此时需表达感谢并强化长期合作意愿，维护客户关系。"], ["Our side: “Thank you for your recognition of our service! It’s our honor to provide high-quality products and services for your company. We’ve sorted out the cooperation files (including contracts, invoices, and quality inspection reports) and will send them to you in a unified email today for your filing. We look forward to continuing to cooperate with you in the future and providing more customized solutions based on your needs.”", "（我方：“感谢您对我们服务的认可！能为贵公司提供优质产品和服务是我们的荣幸。我们已整理好本次合作的文件（含合同、发票、质检报告），今日会统一发送至您的邮箱供您归档。期待未来继续与您合作，并根据您的需求提供更多定制化方案。”）—— 分析：我方通过 “提供归档文件” 的增值服务体现专业性，同时明确表达长期合作意愿，用 “定制化方案” 暗示未来合作的价值，帮助维护长期客户关系，避免合作结束后关系断裂。"], ["Client: “The cooperation files are very useful for our filing—thank you for preparing them. We do have a potential reorder demand in 3 months—we’ll contact you to discuss the details when the time comes. Do you have any preferential policies for old customers?”", "（客户：“合作文件对我们归档很有用 —— 感谢准备。我们在 3 个月后确实有潜在的再订购需求，届时会联系你们讨论细节。贵公司对老客户有什么优惠政策吗？”）—— 分析：客户主动提及再订购需求并询问老客户优惠，表明其有长期合作意向，此时需给出明确、有吸引力的老客户政策，增强客户的再合作意愿。"], ["Our side: “For old customers who have completed at least one cooperation, we offer two preferential policies: 1) A 3% long-term discount on the unit price (compared to the market price for new customers); 2) Priority in production and delivery (shorten the production cycle by 2-3 days). If you reorder within 6 months of this cooperation, we can also waive the advance payment for the first 30% and adjust it to 20%. These policies are exclusively for our long-term cooperative customers.”", "（客户：“老客户政策很有吸引力 —— 尤其是降低预付款和优先交货。有再订购需求时我们一定会联系你们。顺便问下，产品过了保修期后，你们提供售后维修服务吗？”）—— 分析：客户关注保修期后的维修服务，表明其不仅重视短期合作，还考虑长期使用成本，此时需给出明确的售后方案，进一步打消客户的长期顾虑，巩固长期合作基础。"], ["Our side: “Yes, we provide paid after-sales maintenance services for products beyond the warranty period. The maintenance fee is calculated based on the type of fault—we have a clear price list (which we’ll send you via email today for reference). For old customers, we offer a 15% discount on maintenance fees. Additionally, we provide a ‘maintenance package’ option: pay a one-time fee of $200, and you can enjoy 3 free maintenance services within 1 year after the warranty period. This is more cost-effective for customers who use the product frequently.”", "（我方：“是的，我们为过保产品提供付费售后维修服务。维修费根据故障类型计算 —— 我们有清晰的价目表（今日会通过邮件发给您参考）。针对老客户，维修费可享受 15% 的折扣。此外，我们还提供‘维修套餐’选项：一次性支付 200 美元，可在保修期后 1 年内享受 3 次免费维修服务。这对产品使用频率高的客户来说更划算。”）—— 分析：我方不仅提供基础维修服务，还设计 “折扣 + 套餐” 两种方案，满足不同客户的成本偏好，用 “主动发送价目表” 体现服务的透明性，同时通过 “老客户折扣” 进一步强化长期合作的优势，让客户感受到 “全生命周期服务支持”，提升客户对品牌的信任度。"], ["Client: “The maintenance package is very cost-effective—we’ll keep it in mind. Thank you for answering all our questions in detail. This cooperation has been a great experience, and we look forward to more smooth cooperation in the future.”", "（客户：“提前发送产品更新和价格参考很贴心 —— 这会帮助我们更好地规划采购预算。我们一定会保持联系。祝您工作顺利！”）—— 分析：客户对我方的增值服务表示认可，沟通进入收尾阶段，此时需简洁回应，保持友好态度，为本次合作画上完美句号。"], ["Our side: “You too! We’re looking forward to staying in touch and starting the next cooperation smoothly. If you need any assistance, our team is always here for you.”", "（我方：“也祝您工作顺利！期待保持联系，顺利开启下一次合作。若有任何需要协助的地方，我们团队随时为您服务。”）—— 分析：我方用简洁、友好的回应结束沟通，同时再次强调 “随时提供协助”，让客户感受到持续的服务支持，为未来合作留下积极印象。"], ["Client: “We just noticed that the first batch of products has a small issue with the packaging—some boxes are slightly damaged. It doesn’t affect the product quality, but we want to confirm how you’ll handle this in future shipments.”", "（客户：“我们刚发现第一批产品的包装有个小问题 —— 部分箱子轻微破损。不影响产品质量，但想确认未来发货时你们会如何处理这类情况。”）—— 分析：客户主动反馈非核心的包装问题，而非直接投诉，体现合作的信任基础，此时需正视问题并给出改进方案，避免未来类似问题影响客户体验。"], ["Our side: “Thank you for your timely feedback! We apologize for the packaging issue. We’ve immediately asked our logistics team to check the packaging process—we’ll add a layer of bubble wrap inside the boxes and use thicker cardboard for future shipments to prevent damage. For the slightly damaged boxes in the first batch, if you need replacement boxes, we can send them to you via express delivery for free. We’ll also conduct a random inspection of the packaging before each shipment to ensure this issue doesn’t recur.”", "（我方：“感谢您的及时反馈！对于包装问题我们深表歉意。我们已立即要求物流团队核查包装流程 —— 未来发货时，我们会在箱内增加一层气泡膜，并使用更厚的纸板，防止破损。针对第一批货中轻微破损的箱子，若您需要更换，我们可免费快递新箱子给您。每次发货前，我们还会对包装进行随机检验，确保此类问题不再发生。”）—— 分析：我方先道歉再快速提出 “改进措施 + 补救方案 + 预防机制”，既体现对客户反馈的重视，又用具体行动证明解决问题的决心，避免客户因 “小问题被忽视” 而产生不满，同时通过 “免费更换箱子” 的补救措施，进一步维护客户满意度"], ["Client: “Your response is very timely, and the improvement plan is clear. We don’t need replacement boxes this time—just ensure future shipments avoid this issue. Thank you for your quick handling.”", "（客户：“你们的回应很及时，改进方案也很清晰。这次不需要更换箱子 —— 只要确保未来发货避免这类问题即可。感谢快速处理。”）—— 分析：客户对我方的解决方案表示认可，此时需表达感谢并承诺落实改进措施，强化客户对未来合作的信心。"], ["Our side: “Thank you for your understanding! We’ll strictly implement the improved packaging process and send you a photo of the new packaging before the next shipment, so you can confirm it in advance. We’ll never let similar issues affect our cooperation.”", "（我方：“感谢您的理解！我们会严格执行改进后的包装流程，下次发货前会将新包装的照片发给您，让您提前确认。绝不会让类似问题影响我们的合作。”）—— 分析：我方用 “提前发送包装照片” 的细节进一步强化改进承诺，让客户对未来发货的包装质量有明确预期，体现对客户体验的极致关注，巩固合作信任。"], ["Client: “Sending the packaging photo in advance is a good idea—this will help us avoid unnecessary concerns. We’re very satisfied with your problem-solving attitude.”", "（客户：“提前发送包装照片是个好办法 —— 这能帮助我们避免不必要的顾虑。我们对你们解决问题的态度非常满意。”）—— 分析：客户对我方的细节安排和解决问题的态度表示认可，此时需表达感谢并再次强调服务承诺，维护良好的合作氛围。"], ["Our side: “Thank you for your recognition! Solving problems in a timely manner and ensuring customer satisfaction is our core service concept. Whether it’s product quality, packaging, or logistics, we’ll continue to optimize our processes to provide you with a better cooperation experience.”", "（我方：“感谢您的认可！及时解决问题、确保客户满意是我们的核心服务理念。无论是产品质量、包装还是物流，我们都会持续优化流程，为您提供更优质的合作体验。”）—— 分析：我方将单次问题解决上升到 “核心服务理念”，让客户感受到我方长期优化服务的决心，而非仅应对单次问题，进一步增强客户对品牌的信任和长期合作意愿。"], ["Client: “We’ve received the product update notice you sent—the upgraded version has better performance, which is exactly what we need. We plan to place a reorder for the upgraded version in 2 months. Can we enjoy the old customer policies we discussed earlier?”", "（客户：“我们已收到你们发送的产品更新通知 —— 升级款性能更优，正是我们需要的。计划 2 个月后订购升级款，能享受之前讨论的老客户政策吗？”）—— 分析：客户受产品更新和老客户政策吸引，明确提出再订购计划，此时需确认政策适用范围并给出积极回应，推动再合作落地。"], ["Our side: “Great news! The upgraded version is fully eligible for the old customer policies—you’ll get a 3% unit price discount (based on the upgraded version’s market price), priority production (shorten the cycle to 12 days from the usual 15 days), and the advance payment adjusted to 20%. We’ll prepare a detailed quotation for the upgraded version and send it to you next week, which will clearly mark the preferential terms. If you have any special requirements for the upgraded version (such as customized functions), we can also discuss them in advance.”", "（我方：“太好了！升级款完全适用老客户政策 —— 您可享受 3% 的单价折扣（基于升级款市场价）、优先生产（周期从常规 15 天缩短至 12 天），以及 20% 的预付款。下周我们会准备好升级款的详细报价单发给您，其中会明确标注优惠条款。若您对升级款有特殊需求（如定制功能），我们也可提前沟通。”）—— 分析：我方明确政策适用范围并细化优惠细节，用 “提前准备报价单” 和 “定制需求沟通” 体现主动服务，既回应客户的核心诉求，又为再合作的细节对接铺垫，加速再订购流程。"], ["Client: “The preferential terms for the upgraded version are clear, and we’re looking forward to the quotation. We don’t have special customization needs for now—just ensure the performance is consistent with the update notice. We’ll confirm the order quickly after receiving the quotation.”", "（客户：“升级款的优惠条款很清晰，期待报价单。目前没有特殊定制需求 —— 只要确保性能与更新通知一致即可。收到报价单后我们会尽快确认订单。”）—— 分析：客户明确再订购的核心需求和决策节奏，此时需表达感谢并承诺按时提供报价单，确保再合作顺利推进。"], ["Our side: “Thank you for your trust in the upgraded version! We’ll send the quotation to your email by the end of next Wednesday at the latest, and we’ll also attach the performance test report of the upgraded version for your reference. If you have any questions about the quotation or performance after receiving it, please contact us immediately—we’ll respond within 24 hours to help you confirm the order as soon as possible.”", "（我方：“感谢您对升级款的信任！报价单最晚下周三下班前会发送至您的邮箱，同时会附上升级款的性能测试报告供您参考。收到后若对报价或性能有任何疑问，请立即联系我们 —— 我们会 24 小时内回应，协助您尽快确认订单。”）—— 分析：我方明确报价单的交付时间和附加材料，用 “24 小时回应” 承诺保障沟通效率，既让客户对再合作的推进节奏有清晰预期，又体现专业、高效的服务态度，为再合作的顺利启动奠定基础。"], ["Confirm the ideal target price for this negotiation (e.g., $55 per unit) and document it clearly.", "确认本次谈判的理想目标价格（如每件 55 美元），并清晰记录。"], ["Define the minimum acceptable price (bottom line) and ensure it covers all costs and a reasonable profit margin (e.g., $50 per unit).", "明确最低可接受价格（底线），确保覆盖所有成本及合理利润率（如每件 50 美元）。"], ["Set the target order quantity (e.g., 1000 units) and clarify whether it can be adjusted if the price reaches the ideal target.", "设定目标订单量（如 1000 件），明确若价格达成理想目标，订单量是否可调整。"], ["Determine the acceptable delivery time range (e.g., 10-15 days) and identify the shortest delivery time that can be offered for price concessions.", "确定可接受的交货期范围（如 10-15 天），明确为换取价格让步可提供的最短交货期。"], ["Define the target payment terms (e.g., 30% advance payment, 70% after delivery) and list the payment terms that can be compromised (e.g., extending the final payment period by 5 days).", "明确目标付款条款（如预付 30%，交货后付 70%），列出可让步的付款条款（如尾款支付期延长 5 天）。"], ["Confirm the target warranty period (e.g., 1 year) and clarify whether it can be extended for long-term cooperation (e.g., 2 years for a 3-year contract).", "确认目标保修期（如 1 年），明确为长期合作是否可延长保修期（如 3 年合同可延至 2 年）。"], ["Set the target discount range for bulk orders (e.g., 5% for 1000+ units) and document the maximum discount that can be offered.", "设定大宗订单的目标折扣范围（如 1000 件以上享 5% 折扣），记录可提供的最大折扣幅度。"], ["Determine the ideal after-sales service scope (e.g., free maintenance for 6 months) and identify additional services that can be added for price negotiations (e.g., free technical training).", "确定理想的售后服务范围（如 6 个月免费维修），明确为价格谈判可追加的额外服务（如免费技术培训）。"], ["Define the target contract duration (e.g., 1 year) and clarify whether it can be extended to secure a better price (e.g., 2 years for a 3% price reduction).", "明确目标合同期限（如 1 年），明确为获得更优价格是否可延长合同期限（如 2 年合同可降价 3%）。"], ["Set the target for additional value-added services (e.g., free product samples) and list the services that can be provided without increasing costs.", "设定额外增值服务的目标（如免费产品样品），列出无需增加成本即可提供的服务。"], ["Confirm the bottom line for product specification adjustments (e.g., no adjustment to core functions) and identify non-core specifications that can be modified for price concessions.", "确认产品规格调整的底线（如核心功能不调整），明确为换取价格让步可修改的非核心规格。"], ["Define the target for raw material standards (e.g., 304 stainless steel) and clarify whether lower-grade materials can be used for a significant price reduction.", "明确原材料标准的目标（如 304 不锈钢），明确为大幅降价是否可使用低等级材料。"], ["Set the target for inspection terms (e.g., 100% inspection before delivery) and identify the inspection frequency that can be reduced to lower costs.", "设定检验条款的目标（如交货前 100% 检验），明确为降低成本可减少的检验频次。"], ["Determine the acceptable range for logistics costs (e.g., borne by the client) and clarify whether part of the logistics costs can be shared for price negotiations.", "确定物流成本的可接受范围（如由客户承担），明确为价格谈判是否可分担部分物流成本。"], ["Confirm the bottom line for liability clauses (e.g., no liability for force majeure) and identify clauses that can be adjusted for smooth cooperation.", "确认责任条款的底线（如不可抗力不承担责任），明确为合作顺利可调整的条款。"], ["Define the target for price adjustment mechanisms (e.g., no adjustment within 6 months) and clarify whether adjustments can be agreed based on raw material price fluctuations.", "明确价格调整机制的目标（如 6 个月内不调整），明确是否可根据原材料价格波动约定调整方案。"], ["Set the target for reorder preferential policies (e.g., 3% discount for reorders within 6 months) and document the maximum preferential range that can be provided.", "设定再订购优惠政策的目标（如 6 个月内再订购享 3% 折扣），记录可提供的最大优惠范围。"], ["Determine the acceptable range for customization fees (e.g., no more than $10 per unit) and clarify whether fees can be waived for large-quantity customized orders.", "确定定制费用的可接受范围（如每件不超过 10 美元），明确对大宗定制订单是否可减免费用。"], ["Confirm the bottom line for contract termination terms (e.g., 30-day notice period) and identify terms that can be adjusted to meet the client’s needs.", "确认合同终止条款的底线（如 30 天通知期），明确为满足客户需求可调整的条款。"], ["Set the target for dispute resolution methods (e.g., arbitration by a third-party institution) and clarify whether other methods can be agreed upon based on the client’s preferences.", "设定争议解决方式的目标（如第三方机构仲裁），明确是否可根据客户偏好约定其他方式。"], ["Collect the client’s industry background (e.g., manufacturing, retail) and analyze its impact on the product’s usage scenario and price sensitivity.", "收集客户的行业背景（如制造业、零售业），分析其对产品使用场景及价格敏感度的影响。"], ["Research the client’s business scale (e.g., annual revenue, number of branches) to evaluate its procurement capacity and long-term cooperation potential.", "调研客户的企业规模（如年营收、分支机构数量），评估其采购能力及长期合作潜力。"], ["Understand the client’s current supplier situation (e.g., number of suppliers, cooperation duration) to identify the client’s pain points in existing cooperation.", "了解客户当前的供应商情况（如供应商数量、合作时长），找出客户现有合作中的痛点。"], ["Collect the client’s past procurement records (e.g., order quantity, price range) to determine its usual procurement scale and price expectations.", "收集客户过往的采购记录（如订单量、价格范围），确定其常规采购规模及价格预期。"], ["Research the client’s decision-making process (e.g., who is the final decision-maker, approval steps) to clarify the key stakeholders in the negotiation.", "调研客户的决策流程（如最终决策者是谁、审批步骤），明确谈判中的关键利益相关者。"], ["Understand the client’s financial status (e.g., cash flow, credit rating) to evaluate its ability to fulfill the payment terms.", "了解客户的财务状况（如现金流、信用评级），评估其履行付款条款的能力。"], ["Collect the client’s market position (e.g., market share, competitive advantages) to analyze its pricing power and sensitivity to product quality.", "收集客户的市场地位（如市场份额、竞争优势），分析其定价权及对产品质量的敏感度。"], ["Research the client’s recent business trends (e.g., expansion, cost-cutting) to predict its future procurement needs and price preferences.", "调研客户近期的业务动向（如扩张、成本削减），预判其未来采购需求及价格偏好。"], ["Understand the client’s corporate culture (e.g., emphasis on efficiency, focus on long-term relationships) to adjust the negotiation style and strategy.", "了解客户的企业文化（如重视效率、聚焦长期关系），调整谈判风格与策略。"], ["Collect the client’s feedback on similar products (e.g., strengths, weaknesses) to highlight our product’s advantages in the negotiation.", "收集客户对同类产品的反馈（如优点、不足），在谈判中突出我方产品的优势。"], ["Research the client’s regional characteristics (e.g., local policies, cultural customs) to avoid misunderstandings in cross-regional negotiations.", "调研客户的区域特点（如当地政策、文化习俗），避免跨区域谈判中的误解。"], ["Understand the client’s production or operation cycle (e.g., peak seasons, off-seasons) to adjust the delivery schedule and price strategy accordingly.", "了解客户的生产或运营周期（如旺季、淡季），据此调整交货计划及价格策略。"], ["Collect the client’s environmental, social, and governance (ESG) requirements (e.g., environmental protection standards, labor policies) to ensure our product meets its sustainable development needs.", "收集客户的环境、社会及治理（ESG）要求（如环保标准、劳工政策），确保我方产品满足其可持续发展需求。"], ["Research the client’s after-sales service expectations (e.g., response time, maintenance frequency) to design a matching after-sales plan.", "调研客户的售后服务预期（如响应时间、维护频次），设计匹配的售后方案。"], ["Understand the client’s inventory management model (e.g., just-in-time, safety stock) to propose a batch delivery plan that fits its inventory needs.", "了解客户的库存管理模式（如准时制、安全库存），提出贴合其库存需求的分批交货方案。"], ["Collect the client’s historical negotiation style (e.g., direct, indirect) to prepare corresponding response strategies.", "收集客户过往的谈判风格（如直接型、间接型），准备对应的应对策略。"], ["Research the client’s key business objectives for the current year (e.g., cost reduction, market expansion) to align our proposal with its objectives.", "调研客户本年度的核心业务目标（如成本削减、市场扩张），使我方提案与其实目标保持一致。"], ["Understand the client’s risk tolerance (e.g., attitude towards supply chain disruptions) to adjust the contract’s risk-sharing clauses.", "了解客户的风险承受能力（如对供应链中断的态度），调整合同中的风险分担条款。"], ["Collect the client’s preferences for communication methods (e.g., in-person meetings, video conferences) to arrange the negotiation format conveniently.", "收集客户对沟通方式的偏好（如面对面会议、视频会议），便捷地安排谈判形式。"], ["Research the client’s evaluation criteria for suppliers (e.g., price, quality, service) to prioritize the key points in the negotiation.", "调研客户对供应商的评价标准（如价格、质量、服务），在谈判中优先突出关键要点。"], ["Collect the prices of competitors’ similar products (e.g., $52-$58 per unit) and compare them with our product’s price to identify our price advantage or disadvantage.", "收集竞争对手同类产品的价格（如每件 52-58 美元），与我方产品价格对比，找出价格优势或劣势。"], ["Research the competitors’ product advantages (e.g., better performance, longer warranty) to prepare counterarguments highlighting our product’s unique selling points.", "调研竞争对手的产品优势（如性能更优、保修期更长），准备突出我方产品卖点的反驳论据。"], ["Analyze the competitors’ after-sales service policies (e.g., free maintenance period, response time) to design a more competitive after-sales plan.", "分析竞争对手的售后服务政策（如免费维护期、响应时间），设计更具竞争力的售后方案。"], ["Collect the competitors’ discount strategies (e.g., bulk discounts, seasonal promotions) to adjust our own discount policy accordingly.", "收集竞争对手的折扣策略（如大宗折扣、季节性促销），据此调整我方的折扣政策。"], ["Research the competitors’ cooperation terms (e.g., payment terms, delivery time) to find gaps that our terms can fill.", "调研竞争对手的合作条款（如付款条件、交货期），找出我方条款可填补的空白。"], ["Analyze the competitors’ market share (e.g., 30% in the local market) to evaluate our product’s market positioning and pricing space.", "分析竞争对手的市场份额（如当地市场 30%），评估我方产品的市场定位及定价空间。"], ["Collect the competitors’ customer feedback (e.g., complaints about delivery delays) to emphasize our strengths in the negotiation.", "收集竞争对手的客户反馈（如对交货延迟的投诉），在谈判中强调我方的优势。"], ["Research the competitors’ production capacity and supply stability (e.g., frequent stockouts) to highlight our supply chain advantages.", "调研竞争对手的产能及供应稳定性（如频繁缺货），突出我方的供应链优势。"], ["Analyze the competitors’ raw material sources (e.g., high-cost local suppliers) to explain the rationality of our product’s price.", "分析竞争对手的原材料来源（如高成本本地供应商），解释我方产品价格的合理性。"], ["Collect the competitors’ new product development trends (e.g., focus on environmental protection) to adjust our product introduction strategy in the negotiation.", "收集竞争对手的新产品研发趋势（如聚焦环保），在谈判中调整我方的产品介绍策略。"], ["Research the competitors’ regional market layout (e.g., strong in Europe, weak in Asia) to formulate targeted regional price strategies.", "调研竞争对手的区域市场布局（如欧洲强势、亚洲薄弱），制定针对性的区域价格策略。"], ["Analyze the competitors’ cost structure (e.g., high labor costs) to find our cost advantages and support our pricing.", "分析竞争对手的成本结构（如高人工成本），找出我方的成本优势并支撑定价。"], ["Collect the competitors’ contract flexibility (e.g., rigid termination terms) to highlight the flexibility of our contract terms.", "收集竞争对手的合同灵活性（如僵化的终止条款），突出我方合同条款的灵活性。"], ["Research the competitors’ brand reputation (e.g., high recognition in the mid-end market) to position our product’s price and quality appropriately.", "调研竞争对手的品牌声誉（如中端市场认可度高），合理定位我方产品的价格与质量。"], ["Analyze the competitors’ marketing and promotion methods (e.g., heavy advertising investment) to explain the cost differences behind the price gap.", "分析竞争对手的营销推广方式（如大量广告投入），解释价格差距背后的成本差异。"], ["Collect the competitors’ customization capabilities (e.g., long customization cycles) to emphasize our advantages in customized orders.", "收集竞争对手的定制能力（如定制周期长），在定制订单谈判中强调我方优势。"], ["Research the competitors’ long-term cooperation policies (e.g., no loyalty discounts) to design more attractive long-term cooperation terms.", "调研竞争对手的长期合作政策（如无忠诚折扣），设计更具吸引力的长期合作条款。"], ["Analyze the competitors’ response to market changes (e.g., slow price adjustments) to highlight our ability to adapt to market dynamics.", "分析竞争对手对市场变化的响应（如价格调整缓慢），突出我方适应市场动态的能力。"], ["Collect the competitors’ after-sales technical support (e.g., limited online support) to highlight the comprehensiveness of our technical support.", "收集竞争对手的售后技术支持（如仅有限线上支持），突出我方技术支持的全面性。"], ["Research the competitors’ risk measures (e.g., no price protection clauses) to design more secure risk-sharing terms for the client.", "调研竞争对手的风险应对措施（如无价格保护条款），为客户设计更有保障的风险分担条款。"], ["Could you share your expected price range for this product, so we can better adjust our proposal?", "您能分享一下对这款产品的预期价格范围吗？这样我们能更好地调整提案。"], ["What factors do you mainly consider when evaluating the reasonableness of the product’s price?", "您在评估产品价格合理性时，主要考虑哪些因素？"], ["If we provide a bulk discount based on the order quantity, what minimum order quantity would make you consider accepting it?", "如果我们根据订单量提供大宗折扣，多少最低订单量会让您考虑接受？"], ["How do you think our product’s price compares with that of your current supplier, and what adjustments do you hope we can make?", "您认为我们产品的价格与您当前供应商相比如何？希望我们做出哪些调整？"], ["Would you be willing to accept a slightly higher price if we can provide additional value-added services (such as free maintenance)?", "如果我们能提供额外的增值服务（如免费维护），您是否愿意接受略高的价格？"], ["What is your attitude towards price adjustments based on raw material price fluctuations, and do you have a preferred adjustment mechanism?", "您对根据原材料价格波动调整价格持什么态度？是否有偏好的调整机制？"], ["If we offer a long-term cooperation price (valid for 2 years), would you be willing to sign a long-term contract with us?", "如果我们提供长期合作价格（2 年有效），您是否愿意与我们签订长期合同？"], ["How important is the price factor compared with other factors (such as quality, delivery time) in your procurement decision?", "在您的采购决策中，价格因素与其他因素（如质量、交货期）相比，重要性如何？"], ["If we can only meet 80% of your expected price, what other terms do you hope we can optimize to make up for the price gap?", "如果我们只能满足您预期价格的 80%，您希望我们在其他条款上优化哪些内容来弥补价格差距？"], ["Do you have any special price preferences for seasonal procurement (such as off-season orders), and how can we adjust our pricing to meet them?", "您对季节性采购（如淡季订单）是否有特殊价格偏好？我们如何调整定价才能满足？"], ["What core functions of the product are most important to your business, and are there any non-core functions you can give up to reduce costs?", "产品的哪些核心功能对您的业务最重要？是否有非核心功能可舍弃以降低成本？"], ["What are your specific requirements for the product’s quality standards (such as material specifications, test criteria), and can you provide relevant documents?", "您对产品的质量标准（如材料规格、测试标准）有哪些具体要求？能否提供相关文件？"], ["How frequently do you need after-sales maintenance services, and what is your expected response time for maintenance requests?", "您需要售后服务维护的频次是多少？对维护请求的预期响应时间是多久？"], ["Do you have any customization needs for the product (such as appearance, functions), and what is your expected customization cycle?", "您对产品是否有定制需求（如外观、功能）？预期的定制周期是多久？"], ["What are your requirements for the product’s packaging (such as material, labeling), and will it affect the product’s storage and transportation?", "您对产品的包装（如材质、标识）有哪些要求？这是否会影响产品的仓储运输？"], ["Do you need us to provide product training for your employees, and how many training sessions and participants do you expect?", "您是否需要我们为您的员工提供产品培训？预期的培训次数和参与人数是多少？"], ["What are your expectations for the product’s warranty period, and do you need to extend it for an additional fee?", "您对产品的保修期有哪些预期？是否需要付费延长保修期？"], ["Do you have any special requirements for the product’s compliance (such as industry certifications, regional regulations), and how will it affect the product’s production?", "您对产品的合规性（如行业认证、区域法规）有哪些特殊要求？这会对产品生产产生哪些影响？"], ["Will the product be used in a special environment (such as high temperature, humidity), and do we need to adjust the product’s performance accordingly?", "产品是否会在特殊环境（如高温、潮湿）下使用？是否需要我们据此调整产品性能？"], ["Do you need us to provide product samples before mass production, and what is your expected time for sample confirmation?", "您是否需要我们在量产前提供产品样品？预期的样品确认时间是多久？"], ["What are your usual payment terms (such as advance payment ratio, final payment time), and can you make adjustments for long-term cooperation?", "您常规的付款条款（如预付款比例、尾款时间）是什么？为长期合作是否可调整？"], ["What is your expected delivery time from order confirmation to product receipt, and will you accept a slight delay in special circumstances?", "您从订单确认到收到产品的预期交货期是多久？特殊情况下是否接受轻微延迟？"], ["Do you have any requirements for the delivery method (such as logistics company, transportation mode), and who will bear the logistics costs?", "您对交货方式（如物流公司、运输方式）有哪些要求？物流成本由哪方承担？"], ["What is your preferred method for quality inspection (such as on-site inspection, third-party inspection), and when will the inspection be conducted?", "您偏好的质量检验方式（如现场检验、第三方检验）是什么？检验将在何时进行？"], ["How do you hope to resolve disputes that may arise during cooperation (such as arbitration, negotiation), and do you have a designated institution?", "您希望如何解决合作中可能出现的争议（如仲裁、协商）？是否有指定机构？"], ["What is your expected contract duration, and do you need to add a renewal clause with preferential terms?", "您预期的合同期限是多久？是否需要添加含优惠条款的续约条款？"], ["Do you have any requirements for the contract termination terms (such as notice period, compensation standards), and are they flexible?", "您对合同终止条款（如通知期、赔偿标准）有哪些要求？是否具备灵活性？"], ["Will you provide a purchase forecast for the next 6-12 months, so we can adjust our production plan and provide better prices?", "您是否会提供未来 6-12 个月的采购预测？这样我们能调整生产计划并提供更优价格。"], ["Do you have any special requirements for the batch delivery schedule (such as delivery frequency, quantity per batch), and how will it affect our production arrangement?", "您对分批交货计划（如交货频次、每批数量）有哪些特殊要求？这会对我们的生产安排产生怎样的影响？"], ["Will you require us to keep a certain amount of safety stock for emergency needs, and who will bear the storage costs of the safety stock?", "您是否会要求我们为应急需求储备一定量的安全库存？安全库存的仓储成本由哪方承担？"], ["What are your key expectations for long-term cooperation with a supplier, and how can we meet these expectations through price and service adjustments?", "您对与供应商的长期合作有哪些核心期望？我们如何通过价格和服务调整满足这些期望？"], ["Would you be willing to sign a strategic cooperation agreement with us, and what preferential terms do you hope to get in return for long-term commitment?", "您是否愿意与我们签订战略合作协议？为长期合作承诺，您希望获得哪些优惠条款作为回报？"], ["How do you evaluate the performance of your current long-term suppliers, and what aspects do you think we can improve to become your preferred long-term partner?", "您如何评价当前长期供应商的表现？您认为我们在哪些方面改进，才能成为您首选的长期合作伙伴？"], ["Will you share your future product upgrade needs with us in advance, so we can develop corresponding solutions and provide matching price plans?", "您是否会提前与我们分享未来的产品升级需求？这样我们能研发对应方案并提供匹配的价格计划。"], ["What is your attitude towards joint marketing activities with suppliers (such as co-branded promotions), and would you be willing to participate in cost-sharing for such activities in exchange for better prices?", "您对与供应商开展联合营销活动（如联名推广）持什么态度？是否愿意为这类活动分担成本，以换取更优价格？"], ["How often do you usually review the cooperation terms with long-term suppliers, and do you expect to adjust the price and service terms annually based on market changes?", "您通常多久与长期供应商审核一次合作条款？是否期望根据市场变化每年调整价格和服务条款？"], ["Would you recommend us to other business partners in your industry if our cooperation goes smoothly, and do you have any expectations for referral rewards (such as additional price discounts)?", "若合作顺利，您是否会将我们推荐给行业内其他合作伙伴？对推荐奖励（如额外价格折扣）有哪些期望？"], ["What are your plans for expanding your business in the next 2-3 years, and how can we support your expansion through flexible price and supply chain solutions?", "未来 2-3 年您有哪些业务扩张计划？我们如何通过灵活的价格和供应链方案支持您的扩张？"], ["Do you have any requirements for the supplier’s ESG (environmental, social, governance) performance in long-term cooperation, and would you be willing to accept a slight price premium for suppliers that meet high ESG standards?", "长期合作中，您对供应商的 ESG（环境、社会、治理）表现有哪些要求？对于符合高 ESG 标准的供应商，您是否愿意接受略高的价格溢价？"], ["How do you handle the transition from a short-term supplier to a long-term supplier, and what key conditions do we need to meet to complete this transition (such as price stability, service quality)?", "您如何处理从短期供应商到长期供应商的过渡？我们需要满足哪些关键条件（如价格稳定性、服务质量）才能完成这一过渡？"], ["We’ve adjusted our price to the minimum level based on cost calculations, and this is the most favorable offer we can provide. We hope you can understand our cost pressure.", "基于成本核算，我们已将价格调整到最低水平，这是我们能提供的最优惠方案。希望您能理解我们的成本压力。"], ["After in-depth internal discussions with the finance and production teams, we confirm that this price is our bottom line—we can’t make further concessions, but we’re willing to discuss other terms (such as delivery time) to find a win-win solution.", "与财务和生产团队深入内部讨论后，我们确认这个价格是我们的底线，无法再让步，但我们愿意讨论其他条款（如交货期），寻找双赢方案。"], ["We value the opportunity to cooperate with you very much, so we’ve given our maximum price concession. If you have other needs beyond price, we’re happy to communicate and adjust together.", "我们非常重视与您的合作机会，因此已给出最大的价格让步。若您有价格之外的其他需求，我们很乐意一起沟通调整。"], ["This price has taken into account both our reasonable profit and your cost control needs. Although we can’t reduce the price further, we can provide free after-sales training to add value to the cooperation.", "这个价格既考虑了我们的合理利润，也兼顾了您的成本控制需求。虽然无法进一步降价，但我们可提供免费售后培训，为合作增加价值。"], ["We’ve checked the market prices of similar products and combined our own cost structure. This offer is already very competitive, and we hope you can consider it from the perspective of product quality and long-term cooperation.", "我们参考了同类产品的市场价格，结合自身成本结构，这份报价已具备很强的竞争力，希望您能从产品质量和长期合作的角度考虑。"], ["Due to the rising cost of raw materials and labor, this price is already at the edge of our profit margin. We can’t lower it anymore, but we can promise to prioritize your orders in production.", "受原材料和人工成本上涨影响，这个价格已处于我们的利润边缘，无法再降，但我们可承诺在生产中优先处理您的订单。"], ["We understand that you want a lower price, but after repeated cost verification, we really can’t make further concessions. However, we’re willing to extend the warranty period by 3 months to show our cooperation sincerity.", "我们理解您希望获得更低价格，但反复成本核算后，确实无法再让步。不过，我们愿意将保修期延长 3 个月，以表合作诚意。"], ["This is our most sincere offer after comprehensive consideration of all factors. If you have doubts about the price rationality, we can provide a detailed cost breakdown for your reference.", "这是我们综合所有因素后给出的最诚意报价。若您对价格合理性有疑问，我们可提供详细的成本明细供您参考。"], ["2 禁忌语 2：“You’ll never find a better price than this”", "你再也找不到比这更优惠的价格了"], ["Based on our research on the market and competitors, our price is very competitive for products of the same quality and service level. We believe it’s a cost-effective choice for you.", "基于对市场和竞争对手的调研，在同等质量和服务水平的产品中，我们的价格极具竞争力。我们相信这对您来说是高性价比的选择。"], ["We’ve optimized our cost structure to provide this price, which balances product quality and your procurement budget. You can compare it with other suppliers, and we’re confident in our competitiveness.", "我们通过优化成本结构才给出这个价格，既平衡了产品质量，又兼顾了您的采购预算。您可以与其他供应商对比，我们对自身竞争力有信心。"], ["This price includes not only the product cost but also value-added services such as free maintenance and technical support. Compared with suppliers that only offer low prices without after-sales, we believe our program is more comprehensive.", "这个价格不仅包含产品成本，还涵盖免费维护、技术支持等增值服务。与仅提供低价却无售后的供应商相比，我们相信我们的方案更全面。"], ["We don’t claim this is the lowest price on the market, but we can guarantee that for the product quality and service scope we provide, this price is very reasonable and in line with the market’s cost-performance ratio.", "我们不宣称这是市场最低价，但能保证，对于我们提供的产品质量和服务范围，这个价格非常合理，符合市场性价比。"], ["You may receive lower quotes from other suppliers, but we suggest you pay attention to the differences in raw material standards and after-sales commitments behind the price. Our price is matched with reliable product quality and stable service.", "您可能会收到其他供应商更低的报价，但我们建议您关注价格背后的原材料标准和售后承诺差异。我们的价格与可靠的产品质量、稳定的服务相匹配。"], ["We’ve set this price based on the long-term cooperation perspective, not just for a single order. It’s more about building a sustainable cooperative relationship rather than competing for the lowest price.", "我们是从长期合作的角度设定这个价格，而非仅针对单次订单。核心是建立可持续的合作关系，而非单纯比拼最低价。"], ["We believe our price is competitive in the market, but the final decision is up to you. If you have any questions about the value behind the price, we’re willing to communicate with you in detail.", "我们相信我们的价格在市场中具备竞争力，但最终决定权在您手中。若您对价格背后的价值有任何疑问，我们愿意与您详细沟通。"], ["Instead of focusing solely on the price level, we recommend discussing how to maximize the value of this cooperation. Our price can be matched with flexible terms to meet your actual needs.", "与其单纯关注价格高低，我们更建议探讨如何让此次合作价值最大化。我们的价格可搭配灵活的条款，满足您的实际需求。"], ["We understand your need to control procurement costs, and your price request is understandable. However, based on our current cost structure, it’s difficult for us to meet this request directly. Let’s discuss if there’s a way to adjust other terms to balance both parties’ needs.", "我们理解您控制采购成本的需求，您的价格要求是可以理解的。但基于我们当前的成本结构，直接满足这个要求存在困难。我们一起探讨下是否能通过调整其他条款，平衡双方需求。"], ["We’ve carefully evaluated your price request, and we recognize that it’s based on your budget constraints. But considering the raw material costs and production costs we’re currently facing, we need to find a middle ground between your request and our cost capacity.", "我们已仔细评估您的价格要求，也认可这是基于您的预算限制。但考虑到我们当前面临的原材料成本和生产成本，需要在您的要求与我们的成本承受能力之间找到平衡点。"], ["Your expectation for the price is clear, and we respect your budget plan. However, if we meet this price request, we’ll face greater profit pressure, which may affect the stability of product quality and after-sales service. Let’s find a feasible solution together.", "您对价格的预期很明确，我们尊重您的预算规划。但如果满足这个价格要求，我们会面临较大的利润压力，这可能影响产品质量和售后服务的稳定性。我们一起寻找可行的解决方案。"], ["We don’t want to say your price request is unreasonable—instead, we hope to share our cost challenges with you. For example, raw material prices have risen by 15% this quarter, which has significantly increased our production costs. This makes it difficult for us to meet your price expectation directly.", "我们不愿说您的价格要求不合理，相反，我们希望与您分享我们的成本挑战。比如，本季度原材料价格上涨了 15%，大幅增加了我们的生产成本，这导致我们难以直接满足您的价格预期。"], ["Your price request reflects your focus on cost control, which we fully understand. But from our perspective, we need to ensure that the price can cover the necessary costs while maintaining reasonable profits. Let’s discuss if we can adjust the order quantity or delivery time to make the price more feasible.", "您的价格要求体现了对成本控制的重视，我们完全理解。但从我们的角度，需要确保价格在覆盖必要成本的同时，保持合理利润。我们探讨下是否能调整订单量或交货期，让价格更具可行性。"], ["We recognize that your price request is based on your market competition and operational needs. However, our product’s cost structure (including high-quality materials and strict quality inspection) determines that we can’t easily lower the price to your expected level. Let’s see if there’s a way to compromise.", "我们认可您的价格要求是基于您的市场竞争和运营需求。但我们产品的成本结构（包括优质材料和严格质检）决定了我们无法轻易将价格降至您的预期水平。我们看看是否有折中办法。"], ["Your price expectation is understandable, but we need to communicate with you about the actual cost situation. If we force ourselves to meet this price, we may have to reduce investment in product quality, which is not what we want for long-term cooperation. Let’s find a win-win way.", "您的价格预期可以理解，但我们需要与您沟通实际的成本情况。如果强行满足这个价格，我们可能不得不减少产品质量投入，这并非我们长期合作所愿。我们一起寻找双赢方式。"], ["We respect your price request and don’t want to deny its rationality from our perspective. Instead, let’s list the key needs of both parties (such as your cost control and our profit guarantee) and find a solution that can meet the core needs of both sides.", "我们尊重您的价格要求，不愿从我方角度否定其合理性。相反，我们一起列出双方的核心需求（如您的成本控制、我们的利润保障），找到能满足双方核心需求的方案。"], ["Based on the market research and our cost structure, we propose a unit price of $55 for this order.”", "（基于市场调研和我方成本结构，我们为这笔订单提议的单价为 55 美元。）—— 应用：说完后保持 3-5 秒沉默，不主动补充解释，让对方感受 “我方对该报价有充分信心”，迫使对方先开口回应，若对方犹豫，大概率会提出低于预期的降价幅度。"], ["Considering the long-term cooperation potential, we’re willing to offer a 4% discount on the total order, bringing the total price to $220,000.”", "（考虑到长期合作潜力，我们愿意对总订单给予 4% 的折扣，使总价降至 22 万美元。）—— 应用：报出折扣后立即沉默，避免因急于解释折扣合理性而削弱压力，对方会在沉默中权衡 “该折扣是否可接受”，若合作意愿强，可能直接接受或仅小幅压价。"], ["After adjusting the raw material procurement plan, the minimum unit price we can provide is $52—this has already reduced our profit margin to 6%.”", "（调整原材料采购计划后，我们能提供的最低单价为 52 美元，这已将利润率降至 6%。）—— 应用：强调 “最低价格” 和 “低利润率” 后沉默，传递 “我方已无让步空间” 的信号，对方若继续压价会感到理亏，更易主动让步。"], ["For the 1000-unit bulk order you mentioned, our final quoted price is $48 per unit, including free delivery to your warehouse.”", "（针对您提到的 1000 件大宗订单，我们的最终报价为每件 48 美元，含免费送货至您仓库。）—— 应用：用 “final quoted price” 明确立场后沉默，不给对方 “我方仍可调整” 的暗示，沉默中对方会意识到这是较终方案，更可能放弃过高的降价诉求。"], ["If you agree to a 2-year contract, we can lock the unit price at $53 for the entire contract period, which is 3% lower than the market price for short-term orders.”", "（若您同意签订 2 年合同，我们可将整个合同期的单价锁定在 53 美元，这比短期订单的市场价低 3%。）—— 应用：说完长期合作价格后沉默，让对方聚焦 “长期价格稳定” 的优势，而非单纯纠结价格高低，沉默中对方更易接受该方案以避免未来涨价风险。"], ["Including the 1-year free maintenance service you requested, the total cost of this cooperation is $180,000.”", "（包含您要求的 1 年免费维修服务，此次合作的总费用为 18 万美元。）—— 应用：明确包含增值服务的总价后沉默，不主动强调服务成本，让对方在沉默中自行评估 “服务 + 价格” 的性价比，减少对价格的单独挑剔。"], ["After coordinating with the production department, we can only offer a 2% price reduction for the current order quantity—any further reduction will affect production quality.”", "（与生产部门协调后，针对当前订单量，我们仅能提供 2% 的降价，再降会影响生产质量。）—— 应用：用 “质量威胁” 强化立场后沉默，对方会在沉默中权衡 “低价” 与 “质量风险”，出于对质量的担忧，更易接受该降价幅度。"], ["Based on the product specifications you confirmed earlier, the calculated unit price is $56, and this price has been approved by our finance department.”", "（基于您此前确认的产品规格，核算出的单价为 56 美元，且该价格已获财务部门批准。）—— 应用：提及 “规格确认” 和 “部门批准” 增加权威性后沉默，让对方难以质疑价格合理性，沉默中更可能认可该报价。"], ["For the customized functions you added, we’ve waived 50% of the customization fee, so the final unit price is $62.”", "（针对您新增的定制功能，我们已减免 50% 的定制费，因此最终单价为 62 美元。）—— 应用：强调 “费用减免” 后沉默，让对方感受到 “我方已做出让步”，沉默中对方若再压价会显得贪心，更易主动妥协。"], ["Considering the current raw material price fluctuations, this $54 per unit offer is only valid for 7 working days—we can’t guarantee the price after that.”", "（考虑到当前原材料价格波动，这份每件 54 美元的报价仅 7 个工作日内有效，之后无法保证该价格。）—— 应用：给出有效期限制后沉默，制造 “稀缺性压力”，对方会在沉默中担心 “错过优惠”，更易快速接受报价或仅小幅协商。"]];window.__KEY__="1017外企价格谈判背完这600句";window.__TITLE__="10.17外企价格谈判背完这600句";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
