ation at sorting centers to streamline the delivery process", "包裹在分拣中心按目的地分类，以简化配送流程。"], ["eg：Couriers deliver packages to customers' homes or offices within the estimated time frame", "快递员在预计时间内将包裹派送到客户的家中或办公室。"], ["eg：International logistics companies ship goods across borders via air, sea, or land", "国际物流公司通过空运、海运或陆运将货物跨国运输。"], ["eg：Recipients sign for packages to confirm receipt and ensure accountability", "收件人签收包裹以确认收到，并确保责任明确。"], ["eg：If a recipient is unavailable, they can request to redirect the package to a different address", "如果收件人不在，他们可以要求将包裹改派到其他地址。"], ["eg：Valuable items can be insured during shipping to cover loss or damage", "贵重物品在运输过程中可以投保，以弥补丢失或损坏的损失。"], ["eg：Personal trainers train clients with customized workout plans to help them achieve fitness goals", "私人教练为客户制定个性化的锻炼计划，帮助他们实现健身目标。"], ["eg：Fitness instructors instruct classes like yoga, Pilates, and HIIT, demonstrating proper form and techniques", "健身教练指导瑜伽、普拉提和高强度间歇训练等课程，示范正确的动作和技巧。"], ["eg：Trainers assess clients' fitness levels, including strength, flexibility, and endurance, before designing programs", "教练在设计计划前评估客户的体能水平，包括力量、柔韧性和耐力。"], ["eg：Instructors motivate participants to push their limits during workouts, ensuring maximum effort", "教练激励参与者在锻炼中挑战极限，确保付出最大努力。"], ["eg：Gyms are equipped with various machines, weights, and accessories for different types of exercises", "健身房配备了各种器械、哑铃和配件，用于不同类型的锻炼。"], ["eg：Fitness professionals recommend recovery techniques like stretching and foam rolling to prevent injury", "健身专业人士建议采用拉伸和泡沫轴等恢复技巧，以预防受伤。"], ["eg：Wearable fitness devices help users monitor their heart rate, steps, and calories burned", "可穿戴健身设备帮助用户监测心率、步数和燃烧的卡路里。"], ["eg：Nutritionists customize meal plans to complement clients' workout routines and fitness objectives", "营养师定制饮食计划，以配合客户的锻炼常规和健身目标。"], ["eg：Hair stylists style clients' hair using tools like blow dryers, curling irons, and straighteners for a desired look", "发型师使用吹风机、卷发棒和直发器等工具为客户打造理想的发型。"], ["eg：Colorists use professional dyes to color hair, from natural shades to bold, vibrant hues", "染发师使用专业染料为头发上色，从自然色调到大胆鲜艳的色彩均可。"], ["eg：Salons offer hair treatments like deep conditioning and keratin treatments to improve hair health", "沙龙提供深度护理和角蛋白护理等头发护理服务，以改善头发健康。"], ["eg：Barbers groom men's hair and beards, including trimming, shaping, and styling", "理发师为男士修剪、造型和打理头发与胡须。"], ["eg：Estheticians apply facials, masks, and serums during skincare treatments to nourish the skin", "美容师在皮肤护理过程中涂抹面膜和精华液，为皮肤补充营养。"], ["eg：Nail technicians perform manicures, including filing, polishing, and applying nail polish", "美甲师提供美甲服务，包括修甲、抛光和涂指甲油。"], ["eg：Spa therapists massage clients' scalps, shoulders, or hands during beauty treatments for relaxation", "水疗师在美容护理过程中为客户按摩头皮、肩膀或手部，以达到放松的目的。"], ["eg：Beauty professionals consult with clients to understand their preferences and recommend suitable services", "美容专业人士与客户咨询，了解他们的偏好并推荐合适的服务。"], ["eg：Game developers use programming languages and engines to develop video games for various platforms", "游戏开发者使用编程语言和引擎为各种平台开发视频游戏。"], ["eg：Game designers create gameplay mechanics, storylines, and characters to engage players", "游戏设计师创造游戏机制、故事情节和角色，以吸引玩家。"], ["eg：Quality assurance testers test games to identify bugs, glitches, and balance issues before release", "质量保证测试人员在游戏发布前进行测试，以发现漏洞、故障和平衡性问题。"], ["eg：Game publishers publish and market games, ensuring they reach a wide audience through digital and physical stores", "游戏发行商发行和推广游戏，确保通过数字和实体商店触达广泛的受众。"], ["eg：Developers release updates to fix issues, add new content, or improve gameplay based on player feedback", "开发者根据玩家反馈发布更新，修复问题、添加新内容或改进游戏玩法。"], ["eg：Games are monetized through methods like in-app purchases, subscriptions, and advertising", "游戏通过应用内购买、订阅和广告等方式实现变现。"], ["eg：Game designers focus on creating immersive worlds and challenging quests to engage players long-term", "游戏设计师致力于创造沉浸式世界和具有挑战性的任务，以长期吸引玩家。"], ["eg：Some games allow players to mod the game, creating custom content like new levels or characters", "一些游戏允许玩家制作模组，创 或风格化的视觉效果。"], ["eg：Studios engage in licensing, allowing other companies to use characters for merchandise like toys and clothing", "动画工作室进行版权授权，允许其他公司将角色用于玩具、服装等周边产品。"], ["eg：Animation quality depends on frame rate—higher rates (e", "动画质量取决于帧率，更高的帧率如 24 帧 / 秒能让动作更流畅。"], ["eg：Professional gamers compete in tournaments like the League of Legends World Championship for large prizes", "职业玩家参加《英雄联盟》全球总决赛等赛事，争夺高额奖金。"], ["eg：Esports coaches analyze gameplay, design strategies, and train teams to improve their performance", "电竞教练分析比赛、设计策略并训练团队，以提升其表现。"], ["eg：Tournaments are broadcast live on platforms like Twitch, with commentators explaining key plays", "赛事在 Twitch 等平台直播，解说员实时解读关键操作。"], ["eg：Players grind by practicing for hours daily to master mechanics and climb ranked ladders", "玩家通过每天数小时的练习来磨练技巧、提升排名，这一过程称为 “冲分”。"], ["eg：Successful esports teams rely on teamwork, coordinating roles like tank, healer, and damage dealer", "成功的电竞团队依赖团队协作，协调坦克、治疗和输出等角色。"], ["eg：The meta refers to the most effective strategies, characters, or items in a game's current update", "版本主流” 指游戏当前更新中最有效的策略、角色或装备。"]];window.__KEY__="职场高频专业词汇600个";window.__TITLE__="职场高频专业词汇600个 8.5";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
