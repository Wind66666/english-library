ording to your needs to meet your special requirements.", "我们可以根据您的需求进行定制化生产，满足您的特殊要求。"], ["Product quality is our top priority, and all products undergo strict inspections.", "产品的质量是我们的首要保证，所有产品都经过严格的检测。"], ["Which aspects of the product would you like to know about? I will answer them one by one for you.", "您想了解产品的哪些方面呢？我会一一为您解答。"], ["This is our product catalog. You can browse it first, and feel free to tell me if you are interested in any.", "这是我们的产品目录，您可以先浏览一下，有感兴趣的随时告诉我。"], ["The advantages of this product lie in [listing advantages, such as low price, good quality, complete functions, etc.].", "这款产品的优势在于 [列举优势，如价格低、质量好、功能全等]。"], ["If you need samples, we can provide them, and the sample fee can be deducted from subsequent orders.", "如果您有样品需求，我们可以为您提供，样品费用可以在后续订单中抵扣。"], ["At present, there is a certain stock of this product. If you place an order in time, we can ship it as soon as possible.", "目前这款产品有一定的库存，如果您下单及时，我们可以尽快发货。"], ["Does the market in your location have special requirements for [product feature]?", "您所在的市场对 [产品特性] 有特殊要求吗？"], ["Our products have passed [international certification name] certification and meet international standards.", "我们的产品通过了 [国际认证名称] 认证，符合国际标准。"], ["Regarding packaging, we can design and produce according to your requirements.", "关于包装，我们可以根据您的要求进行设计和制作。"], ["We often cooperate with [well-known customer name], and they speak highly of our products.", "我们经常与 [知名客户名称] 合作，他们对我们的产品评价很高。"], ["The warranty period of this product is [X] years. During this period, if there is a quality problem, we will repair or replace it free of charge.", "这款产品的保修期为 [X] 年，在此期间出现质量问题我们会免费维修或更换。"], ["What certificates or documents do you need us to provide? We will prepare them as soon as possible.", "您需要我们提供哪些证书或文件呢？我们会尽快准备。"], ["Our production capacity is strong. We can produce [X] products per month, which can meet your large order needs.", "我们的生产能力很强，每月可以生产 [X] 件产品，能够满足您的大订单需求。"], ["This new product has just been launched and has received a good market response. Would you like to consider ordering a batch?", "这款新产品刚刚推出，市场反响很好，您要不要考虑进一批货？"], ["The raw materials of this product are all high-quality, ensuring the quality and stability of the product.", "这款产品的原材料都是优质的，保证了产品的质量和稳定性。"], ["You can learn more about product information and company dynamics through our official website.", "您可以通过我们的官网了解更多产品信息和公司动态。"], ["We have a professional R&D team that will continue to launch new products to meet market demand.", "我们有专业的研发团队，会不断推出新产品，满足市场需求。"], ["Do you have any suggestions for improving our products? We are happy to listen to your opinions.", "您对我们的产品有什么改进建议吗？我们很乐意听取您的意见。"], ["Thank you for your feedback. We will take it seriously and make improvements.", "感谢您的反馈，我们会认真对待并加以改进。"], ["The market demand for this product is large. If you are interested, it is recommended to place an order as soon as possible.", "这款产品的市场需求量很大，如果您有兴趣，建议尽快下单。"], ["We can provide you with detailed product manuals and user guides.", "我们可以为您提供详细的产品说明书和使用指南。"], ["This product is available in a variety of colors and sizes. You can choose according to market demand.", "这款产品的颜色和尺寸有多种选择，您可以根据市场需求挑选。"], ["We can produce imitations according to the samples you provide.", "我们可以根据您提供的样品进行仿制生产。"], ["Imitation production requires a certain amount of time and cost, which we will inform you in advance.", "仿制生产需要一定的时间和费用，我们会提前告知您。"], ["We have received the sample you provided and are conducting analysis and evaluation.", "您提供的样品我们已经收到，正在进行分析和评估。"], ["Regarding the quotation for the imitation product, we will give it to you as soon as the evaluation is completed.", "关于仿制产品的报价，我们会在评估完成后尽快给您。"], ["Our products also meet international standards in terms of environmental protection and will not pollute the environment.", "我们的产品在环保方面也符合国际标准，不会对环境造成污染。"], ["This product has low energy consumption and conforms to the trend of energy conservation and environmental protection.", "这款产品的能耗很低，符合节能环保的趋势。"], ["Is there a large demand for energy-saving and environmentally ntion to receiving the goods and inform us after receiving them.", "请您注意查收货物，收到后请告知我们。"], ["After receiving the goods, if you find any problems, please contact us in time.", "收到货物后，如果发现有任何问题，请及时与我们联系。"], ["How do you handle after-sales service?", "你们如何处理售后服务？"], ["Could you provide some references?", "你能提供一些推荐人吗？"], ["Can you provide a sample contract?", "你能提供一份样品合同吗？"], ["Can you provide a production schedule?", "你能提供生产计划表吗？"], ["Could you arrange for a factory visit?", "你能安排一次工厂参观吗？"], ["Can I have a visit to your factory?", "能去你们工厂参观吗？"], ["During the trial sale period, we will provide you with more support and services.", "试销期间，我们会为您提供更多的支持和服务。"], ["How is your trial sale going? Is there anything we can cooperate with?", "您的试销情况怎么样？有什么需要我们配合的吗？"], ["If the trial sale is successful, we can sign a long-term cooperation agreement.", "如果试销效果好，我们可以签订长期合作协议。"], ["In the long-term cooperation agreement, we will give you more preferential prices and more flexible payment methods.", "长期合作协议中，我们会给予您更优惠的价格和更灵活的付款方式。"], ["We will regularly visit customers to learn about product usage and market feedback.", "我们会定期回访客户，了解产品的使用情况和市场反馈。"], ["How often would you like us to visit?", "您希望我们多久回访一次呢？"], ["During the visit, we can provide you with some suggestions for market promotion.", "回访时，我们可以为您提供一些市场推广的建议。"], ["We have formulated a marketing plan for this product, which you can refer to.", "这款产品的市场推广方案我们已经制定好了，您可以参考一下。"], ["If you need a customized marketing plan, our marketing team can serve you.", "如果您需要定制市场推广方案，我们的营销团队可以为您服务。"], ["The cost of customized promotion plans will be calculated according to the complexity of the plan.", "定制推广方案需要一定的费用，我们会根据方案的复杂度进行核算。"], ["Our products were exhibited at [exhibition name], attracting the attention of many customers.", "我们的产品在 [展会名称] 上展出过，吸引了很多客户的关注。"], ["We will participate in the next exhibition, and welcome you to visit our booth.", "下次展会我们还会参加，欢迎您到我们的展位参观。"], ["Do you participate in any international exhibitions? We can meet and t var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
