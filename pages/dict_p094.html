sor: “Interesting suggestion.”", "新员工：“我觉得咱们应该把现有的软件换成我之前用过的那款。” 主管：“挺有意思的建议。”"], ["Colleague A （realizing the misunderstanding）: “Wait, when you said ‘Interesting’ earlier, did you have concerns about the team size cut? I can explain the risk control measures.”", "同事 A（意识到误解后）：“等等，你刚才说‘挺有意思的’，是不是对裁员方案有顾虑呀？我可以解释一下风险控制措施。”"], ["Salesperson （correcting the misjudgment）: “I noticed you said ‘Interesting approach’—do you have questions about the budget concentration? Let me share the data on social media ad ROI from our last project.” （销售（纠正误判后）：“我注意到你说‘挺有意思的方法’", "—— 是不是对预算集中有疑问呀？我给你看看我们上一个项目社交媒体广告的投资回报率数据。”）"], ["Manager （after noticing resistance）: “Last week I mentioned changing the weekly report time to 7 PM, and you said ‘Interesting idea’—now I realize it might conflict with your personal time. Let’s discuss a more flexible schedule together.” （经理（发现抵触后）：“上周我说把周报时间改成晚上 7 点，你说‘挺有意思的想法’", "—— 现在我意识到这可能和你的私人时间冲突，咱们一起商量个更灵活的时间吧。”）"], ["You （addressing the hesitation）: “When you agreed with ‘Interesting call’ about postponing the launch, I later thought you might worry about market competition. Let’s analyze the pros and cons of launching on time vs. postponing.”", "你（回应疑虑后）：“之前说推迟发布时，你说‘挺有意思的决定’，后来我想你可能担心市场竞争。咱们一起分析下按时发布和推迟发布的利弊吧。”"], ["New employee （realizing the gap）: “When I suggested changing the software, you said ‘Interesting suggestion’—I think I didn’t explain how it fits our current workflow. Let me first learn more about our existing system and then adjust the idea.” （新员工（意识到差距后）：“我之前建议换软件，你说‘挺有意思的建议’", "—— 我觉得我没说清楚它怎么适配咱们现在的工作流程。我先多了解下现有系统，再调整这个想法。”）"], ["When communicating with colleagues from different countries, you prefer to: A） Get straight to the business point B） Start with a short small talk about daily life C） Ask about their work experience first", "与不同国家的同事沟通时，你更倾向于：A）直接切入工作主题 B）先聊几句日常生活的寒暄 C）先询问他们的工作经历"], ["When receiving feedback from an overseas client, you expect them to: A） Point out problems directly, even if it’s blunt B） Mention positive points first, then suggest improvements C） Avoid clear criticism and use vague language", "收到海外客户的反馈时，你期望他们：A）直接指出问题，即使语气尖锐 B）先提优点，再给出改进建议 C）避免明确批评，用模糊的语言表达"], ["When scheduling a meeting with a partner from another culture, you think it’s most important to: A） Confirm the exact time and agenda in advance B） Build a personal relationship first before setting the time C） Be flexible with the time to accommodate their schedule", "与其他文化背景的合作伙伴安排会议时，你认为最重要的是：A）提前确认准确时间和议程 B）先建立私人关系，再确定时间 C）灵活调整时间以适应对方日程"], ["When negotiating a contract with an international team, you focus more on: A） The detailed terms and legal clauses B） The trust and mutual understanding between both parties C） The long-term cooperation potential beyond the contract", "与国际团队谈判合同时，你更关注：A）详细条款和法律条文 B）双方之间的信任和相互理解 C）合同之外的长期合作潜力"], ["When explaining a complex project to a foreign colleague, you tend to: A） Use data and logic to support each point clearly B） Use stories or examples related to their culture to explain C） Rely on body language and tone to convey key information", "向外国同事解释复杂项目时，你倾向于：A）用数据和逻辑清晰支撑每个观点 B）用与他们文化相关的故事或例子解释 C）依靠肢体语言和语气传递关键信息"], ["When a foreign colleague disagrees with your idea, you hope they will: A） Say “I disagree” directly and explain the reason B） Say “I have another thought” to express disagreement indirectly C） Avoid saying “disagree” and change the topic slowly", "外国同事不认同你的想法时，你希望他们：A）直接说 “我不认同” 并解释原因 B）用 “我有另一个想法” 间接表达反对 C）避免说 “不认同”，慢慢转移话题"], ["When giving a gift to an overseas business partner, you think it’s appropriate to: A） Choose a practical gift with clear price tag B） Choose a gift that represents your local culture （no price tag） C） Avoid giving gifts to avoid misunderstanding", "给海外商业伙伴送礼物时，你认为合适的做法是：A）选实用型礼物，附带明确价格标签 B）选代表本地文化的礼物（无价格标签） C）避免送礼物，防止产生误解"], ["I noticed that our industry has seen a lot of new tech investments recently—have you paid attention to any of them?”", "我注意到咱们行业最近有很多新技术投资，你关注过其中哪些吗？"], ["The latest report from [Industry Organization] said that market demand for [product type] will grow by 20% next year—what do you think about that forecast?”", "［行业机构］的最新报告说，明年［产品类型］的市场需求会增长 20%，你怎么看这个预测？"], ["I heard that [Competitor Company] launched a new service last month—have you had a chance to learn about its features?”", "我听说［竞争对手公司］上个月推出了一项新服务，你有没有了解过它的功能呀？"], ["You’ve been working in this field for many years—what’s the most unexpected challenge you’ve encountered so far?”", "你在这个领域做了很多年，到目前为止遇到过的最意外的挑战是什么呀？"], ["I just finished a project similar to yours last quarter—it was really tough to coordinate with the logistics team. Have you ever had a similar experience?”", "我上季度刚完成一个和你类似的项目，协调物流团队特别难，你有没有过类似的经历呀？"], ["What’s the most useful skill you’ve learned in your current role that you didn’t expect to need?”", "在你现在的工作中，学到的最有用但之前没预料到会需要的技能是什么呀？"], ["I know you’re from [Country]—is there any business etiquette in your culture that we should pay attention to when working together?”", "我知道你来自［国家］，咱们合作时，有没有什么你们文化里的商务礼仪是我们需要注意的呀？"], ["I’ve tried [local food from their country] before—it’s really delicious! Have you found any good restaurants serving your local food here?”", "我之前吃过［对方国家的特色食物］，特别好吃！你在这儿找到过做你们本地菜的好餐厅吗？"], ["Working across time zones can be tricky—what’s your favorite way to balance work and rest when dealing with overseas teams?”", "跨时区工作挺麻烦的，你和海外团队合作时，最喜欢用什么方法平衡工作和休息呀？"], ["When you first started in this industry, what’s one piece of advice you wish someone had given you?”", "你刚进入这个行业时，有没有什么建议是你希望当时有人能告诉你的呀？"], ["I’ve been trying to improve my [skill, e.g., “cross-department communication”] lately—do you have any tips that worked for you?”", "我最近在努力提升［技能，如 “跨部门沟通”］，你有没有什么对你有效的方法呀？"], ["What’s the most rewarding project you’ve worked on so far? I’d love to hear about it.”", "到目前为止，你做过的最有成就感的项目是什么呀？我很想听听。"], ["I heard you like hiking—have you found any good hiking trails near the city recently?”", "我听说你喜欢徒步，最近在市区附近找到什么好的徒步路线了吗？"], ["The weather has been really nice this week—do you have any plans to go out and relax on the weekend?”", "这周天气特别好，你周末有没有出去放松的计划呀？"], ["I just started reading a book about [business topic, e.g., “remote team management”]—have you read any good books lately （business or non-business）?” （我刚开始读一本关于［商务话题，如 “远程团队管理”］的书", "—— 你最近有没有读到什么好书呀（商务类或非商务类都可以）？）"], ["I tried a new coffee shop near the office yesterday—their latte is amazing! Have you explored any good cafes around here?”", "我昨天去了办公室附近一家新开的咖啡店，他们的拿铁超好喝！你有没有发掘过这附近的好咖啡馆呀？"], ["My kid just started learning to play the piano—it’s both fun and tiring to practice with them. Do you have any hobbies or family activities you enjoy after work?”", "我家孩子刚开始学钢琴，陪他们练习既有趣又累。你下班后有没有什么喜欢的爱好或家庭活动呀？"], ["Colleague （US）: “Hey! How was your weekend? Did you do anything fun?”", "同事（美国）：“嘿！你周末过得怎么样？有没有做什么好玩的事呀？”"], ["You: “It was great! I went hiking with a friend in the mountains. How about you? Did you have a good weekend too?”", "你：“特别好！我和朋友去山里徒步了。你呢？周末过得也不错吧？”"], ["Colleague （US）: “Oh, hiking sounds awesome! I just stayed home and watched a movie—nothing too exciting, but it was relaxing.”", "同事（美国）：“哦，徒步听起来太棒了！我就待在家里看了部电影 —— 没什么特别刺激的，但挺放松的。”"], ["You: “Watching a movie at home is perfect for relaxing! What movie did you watch?”", "你：“在家看电影太适合放松了！你看的什么电影呀？”"], ["Colleague （Japan）: “Ohayou gozaimasu. Did you have a safe commute this morning?”", "同事（日本）：“早上好。你今天早上通勤顺利吗？”"], ["You: “Ohayou gozaimasu. Yes, the train was on time today, so it was very smooth. How about your commute?”", "你：“早上好。嗯，今天地铁很准时，所以挺顺利的。你通勤怎么样呀？”"], ["Colleague （Japan）: “My commute was okay too. The weather is nice today, isn’t it?”", "同事（日本）：“我通勤也还可以。今天天气挺好的，是吧？”"], ["You: “Yes, the sun is out and the wind is gentle—it’s perfect for walking. I think it’ll stay nice for the whole day.”", "你：“是呀，阳光很好，风也很轻柔，特别适合散步。我觉得今天一整天天气都会不错。”"], ["Colleague （UK）: “Morning! Did you get caught in the rain yesterday evening? It poured suddenly, didn’t it?”", "同事（英国）：“早上好！你昨晚有没有被雨淋到呀？突然下大雨了，是吧？”"], ["You: “Morning! Luckily, I brought an umbrella with me—otherwise I would have been soaked. How about you? Did you escape the rain?”", "你：“早上好！幸好我带伞了，不然就淋成落汤鸡了。你呢？躲开雨了吗？”"], ["Colleague （UK）: “I almost forgot my umbrella—ran back home to get it just in time. Typical British weather, right?”", "同事（英国）：“我差点忘了带伞，赶紧跑回家拿，刚好赶上。典型的英国天气，是吧？”"], ["You: “Absolutely! You never know what the British weather will do—one minute sunny, the next raining. Did you have any plans ruined by the rain?”", "你：“太对了！英国的天气真说不准，前一分钟晴天，下一分钟就下雨。有没有什么计划被雨打乱呀？”"], ["Colleague （India）: “Good morning! How are you doing today? Did you have a nice breakfast?”", "同事（印度）：“早上好！你今天怎么样呀？早餐吃好了吗？”"], ["You: “Good morning! I’m doing well, thank you. I had oatmeal and a cup of tea for breakfast—it was very filling. How about you? What did you have for breakfast?”", "你：“早上好！我挺好的，谢谢。早餐吃了燕麦和一杯茶，很饱。你呢？早餐吃了什么呀？”"], ["Colleague （India）: “That sounds healthy! I had idli and sambar—my mom made it, so it tasted extra good. Do you like South Indian food?”", "同事（印度）：“听起来很健康！我吃了印度蒸米糕和扁豆汤，是我妈妈做的，所以特别好吃。你喜欢南印度菜吗？”"], ["You: “I’ve tried idli before—it’s really delicious! I’d love to try your mom’s cooking sometime if I get the chance. Do you usually bring home-cooked food to work?”", "你：“我之前吃过印度蒸米糕，特别好吃！要是有机会，我真想尝尝阿姨做的菜。你平时会带家里做的饭去上班吗？”"], ["Good morning, everyone. Before we start the meeting, how was everyone’s weekend? Anyone do something fun?”", "各位早上好。开会前，大家周末过得怎么样呀？有人做了什么好玩的事吗？"], ["Welcome, [Partner Name]. Thanks for making time to join the meeting today. How’s the traffic from your office to here?”", "［合作伙伴姓名］，欢迎你。感谢你今天抽空来开会。从你办公室到这儿交通怎么样呀？"], ["Since we’re all here, let’s take 2 minutes to check in—how’s everyone feeling about the project progress so far?” （既然大家都到齐了，我们花 2 分钟简单交流下", "—— 大家对目前项目的进展感觉怎么样呀？）"], ["Welcome to our office, [Client Name]. It’s great to finally meet you in person—we’ve talked so much on the phone. Would you like a cup of coffee or tea first?”", "［客户姓名］，欢迎来我们公司。终于能当面见到你了，我们在电话里聊了好多次了。你先喝杯咖啡还是茶呀？"], ["Hi [Client Name], long time no see! How’s your business going lately? I heard your company launched a new product last month—congratulations!”", "［客户姓名］，好久不见！你最近生意怎么样呀？我听说你们公司上个月推出了新产品，恭喜呀！"], ["Thanks for coming all the way to our office, [Client Name]. Did you have any trouble finding the place? Our receptionist can show you around quickly if you have time later.”", "［客户姓名］，感谢你大老远来我们公司。找地方的时候有没有遇到困难呀？要是你等会儿有时间，我们前台可以带你简单参观下。"], ["Hi everyone, thanks for joining the video call on time. Can everyone hear me clearly? I had a little trouble with my internet earlier, but it seems okay now.”", "大家好，感谢准时参加视频会议。各位能听清我说话吗？我刚才网络有点小问题，不过现在好像没问题了。"], ["Good afternoon, [Client Name]. It’s nice to connect with you online today. How’s your internet connection on your end? We can adjust the call quality if there’s any lag.”", "［客户姓名］，下午好。今天能在线上和您沟通很开心。您那边网络怎么样呀？如果有延迟，我们可以调整通话质量。"], ["Before we start the online discussion, I just wanted to say thanks for making time amid your busy schedule—do you have any other urgent matters to handle before we begin?”", "开始线上讨论前，我想先感谢您在忙碌日程中抽空参加 —— 开始之前您还有其他紧急事情要处理吗？"], ["Hi [Colleague Name], I saw your email about the project update. Thanks for sharing the details so promptly—did you need me to follow up on anything specific right now?”", "［同事姓名］，我看到你关于项目进展的邮件了。感谢这么快分享细节 —— 你现在需要我跟进什么具体事项吗？"], ["Welcome to the online workshop, everyone. I’m glad to see so many of you here today. If you have any questions during the session, feel free to type them in the chat box—I’ll answer them later.”", "各位欢迎参加线上研讨会。今天看到这么多人参与我很开心。如果过程中有任何问题，大家可以在聊天框里输入，我之后会解答。"], ["Thanks so much for staying late to help finish the project report—it really saved me a lot of time.”", "非常感谢你加班帮我完成项目报告，这真的帮我节省了很多时间。"], ["I really appreciate your support during the client meeting—your input helped the client feel more confident about our plan.”", "特别感谢你在客户会议上的支持，你的意见让客户对我们的方案更有信心了。"], ["Thank you for sharing your industry insights with us—they gave us a new perspective on the market trend.”", "感谢你和我们分享行业见解，它们为我们提供了看待市场趋势的新视角。"], ["I want to thank you for coordinating with the logistics team—without your help, we wouldn’t have delivered the goods on time.”", "我想感谢你协调物流团队 —— 没有你的帮助，我们没办法按时交货。"], ["Thanks for your patience in explaining the new system to me—I was a bit confused at first, but now I understand it clearly.”", "感谢你耐心教我新系统，我一开始有点困惑，现在完全明白了。"], ["You’re welcome! It was my pleasure to help—we’re a team, after all.”", "不客气！能帮忙是我的荣幸，毕竟我们是一个团队。"], ["Don’t mention it! I’m glad I could contribute—your project plan is really strong, so it was easy to support you.”", "别客气！能出份力我很开心，你的项目计划本身很扎实，所以支持你也很容易。"], ["It’s nothing! I know you’d do the same for me if I needed help—let’s keep working together to make the project a success.”", "没什么！我知道如果我需要帮助，你也会这么做的 —— 咱们继续一起努力让项目成功。"], ["You’re too kind! I just did what I could—if you have any other questions later, feel free to ask me.”", "你太客气了！我只是做了我能做的 —— 之后如果你还有其他问题，随时问我。"], ["Glad to hear it helped! I was happy to share my insights—if you need more details about the market, just let me know.”", "很高兴能帮上忙！我很乐意分享我的见解 —— 如果你需要更多市场细节，随时告诉我。"], ["I’m really sorry for being late to the meeting—I got stuck in traffic, and I should have left earlier.”", "很抱歉会议迟到了，我堵车了，我应该早点出发的。"], ["I apologize for the mistake in the financial report—I missed a few data entries, and I’ve corrected them now. I’ll double-check it next time to avoid this.”", "很抱歉财务报告里出现了错误，我漏了几个数据项，现在已经修正了。下次我会仔细核对避免这种情况。"], ["I’m sorry for not replying to your email sooner—I was busy with the client visit yesterday, and I should have informed you in advance.”", "很抱歉没早点回你邮件，我昨天忙着客户拜访，我应该提前告诉你的。"], ["I apologize for the confusion caused by my unclear explanation—I’ll rephrase it and send you a detailed note right away.”", "很抱歉我解释不清楚造成了困惑，我会重新组织语言，马上给你发一份详细说明。"], ["I’m really sorry for forgetting to bring the project materials to the meeting—I’ll send them to everyone via email immediately after the meeting.”", "很抱歉忘了带项目资料到会议上，会后我会马上把资料通过邮件发给大家。"], ["It’s okay! Traffic can be really bad at this time of day—I’m glad you made it to the meeting eventually.”", "没关系！这个时间点交通确实很糟糕，你最终能来开会就好。"], ["No worries! Mistakes happen sometimes—thanks for correcting it quickly. I’ll take a look at the revised report later.”", "别担心！有时候难免会出错，感谢你快速修正了。我之后会看一下修订后的报告。"], ["That’s all right! I know you’ve been busy with client visits—just let me know if you need any help with follow-up work.”", "没关系！我知道你一直忙着客户拜访，如果你需要跟进工作的帮助，随时告诉我。"], ["Don’t apologize! Your explanation was just a bit unclear, but I understand now—thanks for offering to send a detailed note.”", "不用道歉！你的解释只是有点不清楚，不过我现在明白了，感谢你愿意发详细说明。"], ["It’s not a big deal! We can still discuss the project without the materials now, and I’ll check the email later—thanks for your quick response.”", "没什么大不了的！我们现在没有资料也能讨论项目，我之后会看邮件的，感谢你的快速应对。"], ["Happy New Year! Wishing you a successful and prosperous year ahead.”", "新年快乐！祝愿你在新的一年里事业成功、万事如意。"], ["Best wishes for a wonderful holiday season! Hope you get to spend some quality time with family and friends.”", "节日快乐！希望你能和家人朋友度过一段愉快的时光。"], ["Happy Mid-Autumn Festival! May this festival bring you joy and harmony with your loved ones.”", "中秋节快乐！愿这个节日给你和你爱的人带来欢乐与团圆。"], ["Wishing you a happy and safe Thanksgiving! May you have a great time with your family over a delicious meal.”", "感恩节快乐，平安顺遂！希望你能和家人一起享用美味的大餐，度过愉快的时光。"], ["Congratulations on completing the project successfully! Wishing you more achievements in your future work.”", "恭喜项目成功完成！祝愿你在未来的工作中取得更多成就。"], ["Best wishes for your new role! I’m sure you’ll bring great value to the new position.”", "祝你在新岗位上一切顺利！我相信你会为新岗位带来巨大价值。"], ["Congratulations on your company’s anniversary! It’s amazing to see how much your business has grown over the years.”", "恭喜贵公司周年庆！见证贵公司这些年的发展壮大，真是太棒了。"], ["Wishing you a smooth and successful business trip! Hope everything goes well with your meetings there.”", "祝你商务旅行顺利成功！希望你在那边的会议一切顺利。"], ["I’m heading off work now—have a nice evening! See you tomorrow.”", "我现在下班啦，晚上过得愉快！明天见。"], ["I need to run to a meeting downtown—catch you later this afternoon! Let me know if you need anything before then.”", "我得去市中心开个会，下午晚点见！这之前要是需要帮忙，随时告诉我。"], ["It’s already 6 PM—I’m calling it a day. Enjoy the rest of your evening, and don’t stay too late!”", "都 6 点了，我今天就到这儿了。晚上好好休息，别加班太晚啦！"], ["I’m leaving for the day—did we finish all the urgent tasks for today? If not, I can come in a bit early tomorrow to help.”", "我今天要走了，咱们今天的紧急任务都完成了吗？要是没完成，我明天可以早点来帮忙。"], ["Thanks for taking the time to meet with us today—it was a really productive discussion. We’ll send you the meeting minutes by tomorrow morning.”", "感谢您今天抽空和我们见面，讨论非常有成效。我们明天上午会把会议纪要发给您。"], ["It was great to connect with you today—we really appreciate your insights on the project. Let’s schedule another call next week to follow up.”", "今天能和您沟通非常开心，非常感谢您对项目的见解。咱们下周安排一次电话跟进吧。"], ["Before you go, let me walk you to the elevator—do you need any help arranging transportation back to your office?”", "您走之前，我送您到电梯口吧，需要帮忙安排回公司的交通吗？"], ["Thanks for visiting our office today—we hope you had a good experience. If you have any questions after you get back, feel free to reach out anytime.”", "感谢您今天来我们公司拜访，希望您有愉快的体验。回去后要是有任何问题，随时联系我们。"], ["Sorry everyone, my microphone seems to be acting up—let me switch to my headset quickly. I’ll be back in 30 seconds.”", "抱歉各位，我的麦克风好像出问题了，我赶紧换成耳机。30 秒后回来。"], ["I apologize—the presentation slides aren’t loading properly. Let me share my screen again. In the meantime, could [Colleague Name] briefly explain the key point we were talking about?”", "抱歉，演示幻灯片加载不出来了。我重新分享下屏幕。这段时间，[同事姓名] 能简单讲解下我们刚才聊的重点吗？"], ["To our clients on the call—we’re experiencing a temporary internet outage. We’ll restart the call in 10 minutes and send you a new link via email right away.”", "给参会的客户们：我们这边暂时断网了。10 分钟后重新开会，我们马上通过邮件把新链接发给您。"], ["I’m sorry to inform you that our manager has to reschedule today’s meeting due to an urgent business trip—would tomorrow at the same time work for you?”", "很抱歉通知您，我们经理因为紧急出差，今天的会议需要改期，明天同一时间您方便吗？"], ["Unfortunately, the colleague in charge of the financial analysis can’t join today’s call—he’s asked me to share his report on his behalf, and he’ll answer any follow-up questions via email.”", "很遗憾，负责财务分析的同事今天不能参加会议了，他让我代他分享报告，后续有问题他会通过邮件解答。"], ["We just received word that the client wants to shorten tomorrow’s meeting from 2 hours to 1 hour—let’s adjust our agenda to focus on the key decisions first. I’ll send the revised agenda now.”", "我们刚收到消息，客户想把明天的会议从 2 小时缩短到 1 小时，咱们调整下议程，先聚焦关键决策事项。我现在就把修订后的议程发出去。"], ["You did an amazing job organizing the client event—everything ran so smoothly, and the client mentioned how impressed they were with the details.”", "你组织客户活动做得太出色了，一切都很顺利，客户还提到对细节印象特别深刻。"], ["I really admire how you handled the difficult negotiation with the supplier—you stayed calm and managed to get us better terms than we expected.”", "我特别佩服你和供应商的艰难谈判，你一直很冷静，还为我们争取到了比预期更好的条件。"], ["Your ability to analyze complex data and turn it into clear insights is incredible—it makes the team’s decision-making so much easier.”", "你分析复杂数据并转化为清晰见解的能力太厉害了，这让团队做决策容易多了。"], ["I appreciate how proactive you are—you always anticipate potential problems and come up with solutions before anyone else mentions them.”", "很欣赏你的主动性，你总能预判潜在问题，还没等别人提出来就想出了解决方案。"], ["Even when the project gets stressful, you always stay positive and keep the team motivated—that’s such an important part of our success.”", "就算项目压力很大，你也总能保持积极，带动团队士气，这对我们的成功太重要了。"], ["You’re so detail-oriented—you caught that small mistake in the contract that everyone else missed, which saved us from potential risks.”", "你太注重细节了，合同里那个大家都没注意到的小错误被你发现了，帮我们规避了潜在风险。"], ["I’m working on the new software and having a bit of trouble with the data import function—you’re really familiar with this tool, could you give me a quick tip?”", "我正在用新软件，在数据导入功能上遇到点麻烦，你对这个工具很熟悉，能给我个小建议吗？"], ["You’ve handled a lot of cross-department projects before—I’m currently coordinating with the marketing team and struggling with communication. Do you have any experience you could share?”", "你之前处理过很多跨部门项目，我现在在和市场部协调，沟通上有点困难，能分享点经验吗？"], ["I’m preparing the quarterly report and not sure how to present the sales data clearly—you always make your reports so easy to understand, could you show me your approach?”", "我在准备季度报告，不知道怎么清晰呈现销售数据，你的报告总是特别好懂，能给我讲讲你的方法吗？"], ["Of course! For the data import function, you just need to check the file format first—let me walk you through the steps quickly.”", "当然可以！数据导入功能的话，你先检查下文件格式，我快速带你过一遍步骤。"], ["I’d be happy to share! When I coordinated with the marketing team before, I found setting up weekly sync calls really helped—would you like me to tell you more about how to structure the calls?”", "我很乐意分享！之前和市场部协调时，我发现每周开同步会很有帮助，想听听会议怎么安排更合理吗？"], ["Thanks for asking! I usually organize sales data by region and compare it to last quarter—let me show you an example from my last report to make it clearer.”", "谢谢你问我！我通常按区域整理销售数据，再和上季度对比，我给你看下去季度报告的例子，这样更清楚。"]];window.__KEY__="1023商务寒暄潜台词";window.__TITLE__="10.23 商务寒暄潜台词";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
