<style>

.dict-link{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;

.dict-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;

.btn:hover{opacity:.85}
.btn-main{background:linear-gradient(120deg,#8b9cf9,#6d7ff0);color:#fff}
.btn-ghost{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.dict-fb{margin-top:18px;font-size:15px;line-height:1.9;display:none;
padding:14px 18px;border-radius:12px}
.dict-fb.show{display:block}

.dict-fb.near{background:rgba(232,182,103,.10);border:1px solid rgba(232,182,103,.3)}
.dict-fb.wrong{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.25)}
.dict-fb .ans{display:block;color:#dfe4f5;font-weight:600;margin-top:4px}
.dict-big{font-size:17px;font-weight:700;color:#dfe4f5;margin:14px 0 22px;line-height:1.8}
.dict-stats{display:flex;gap:14px;justify-content:center;margin:22px 0 28px;flex-wrap:wrap}
.dict-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 26px;min-width:110px}
.dict-stat b{display:block;font-size:24px;font-weight:800}
.dict-stat span{font-size:12px;color:var(--sub)}
.dict-stat.g b{color:#4ecfa0}.dict-stat.n b{color:#e8b667}.dict-stat.w b{color:#f08c8c}
.dict-wronglist{margin-top:26px;text-align:left}
.dict-wronglist h3{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.dict-wronglist .wp{padding:10px 14px;border:1px solid var(--line);border-radius:10px;
margin-bottom:8px;font-size:13.5px;line-height:1.8}
.dict-wronglist .wp b{color:#f08c8c}
.dict-wronglist .wp span{display:block;color:var(--sub)}
.dict-wronglist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600}
.dict-opt{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap}
.dict-opt label{display:flex;align-items:center;gap:7px;background:var(--panel);
border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13.5px;
cursor:pointer;color:var(--sub)}
.dict-opt input{accent-color:#8b9cf9}
.dict-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dict-chips .chip{cursor:pointer}
.dict-chips .chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
@media (max-width:600px){.dict-wrap{padding:22px 16px}.dict-zh{font-size:18px}}
/* ---- 学习进度 & 归档 ---- */
.pctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:var(--panel);color:#5d6479;
transition:all .12s ease}
.st:hover{opacity:.8}
.st-learning{background:rgba(139,156,249,.16);border-color:rgba(139,156,249,.4);color:#a5b1fb}
.st-done{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.35);color:#4ecfa0}
.arch-btn{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:transparent;color:#5d6479}
.arch-btn:hover{color:var(--sub)}
.arch-btn.on{background:rgba(232,182,103,.13);border-color:rgba(232,182,103,.4);color:#e8b667}
.item.archived{opacity:.5}
.item.archived:hover{opacity:.8}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 0}
.filter-chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;
font-size:12px;padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.filter-chip:hover{border-color:#39415e}
.filter-chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.pbar-outer{max-width:580px;margin:20px auto 0;height:8px;border-radius:4px;
background:var(--panel);border:1px solid var(--line);overflow:hidden}
.pbar-outer i{display:block;height:100%;width:0;border-radius:4px;
background:linear-gradient(90deg,#8b9cf9,#4ecfa0);transition:width .3s ease}
.psum{margin:10px 0 0;font-size:12.5px;color:var(--sub)}
.psum b{color:#c9d4ff;font-weight:600}
footer .io{margin-top:8px}
footer .io a,footer .io label{cursor:pointer;color:#5d6479}
footer .io a:hover,footer .io label:hover{color:var(--brand)}
footer .io input{display:none}
.art-pctrl{margin-top:12px}
.dict-hist{color:#8f96ab;font-size:13px;margin-top:14px}
.dict-hist b{color:#a5b1fb}
/* ---- 复习中心 & 收藏 ---- */
.btn-fav.on{color:#e8b667;border-color:rgba(232,182,103,.45)}
.rtabs{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.rtab{background:var(--panel);border:1px solid var(--line);color:#aab2cc;font-size:13px;
padding:8px 18px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.rtab:hover{border-color:#39415e}
.rtab.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.rsec{display:none}
.rsec.on{display:block}
.rlist{border-top:1px dashed var(--line);padding-top:14px;margin-top:16px}
.rlist .wp{padding:12px 16px;border:1px solid var(--line);border-radius:12px;
margin-bottom:9px;font-size:13.5px;line-height:1.8;background:var(--panel)}
.rlist .wp span{display:block;color:var(--sub)}
.rlist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600;margin-top:2px}
.wp-meta{font-size:11.5px;color:#5d6479;margin-top:7px;display:flex;gap:14px;
align-items:center;flex-wrap:wrap}
.wp-meta b{cursor:pointer;color:#8f96ab;font-weight:600}
.wp-meta b:hover{color:#f08c8c}
.wp-meta .due{color:#e8b667}
.wp-meta .src{opacity:.8;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-hint{text-align:center;color:#5d6479;padding:28px 0;font-size:13.5px}
.chip.rlink{cursor:pointer;transition:all .12s ease}
.chip.rlink:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
/* ---- 阅读页朗读（TTS） ---- */
.content.lines{white-space:normal}
.ln{position:relative;padding:2px 8px 2px 36px;border-radius:6px;line-height:2.1}
.ln .spk{position:absolute;left:6px;top:50%;transform:translateY(-50%);
cursor:pointer;opacity:0;transition:opacity .12s ease;background:none;border:none;
color:#8b9cf9;font-size:14px;padding:2px 4px;line-height:1}
.ln:hover .spk{opacity:.85}
.ln .spk:hover{opacity:1}
.ln.cur{background:rgba(139,156,249,.10)}
.ln.cur .spk{opacity:1}
.ttsbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;

border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}

    <div id="start" class="dict-center">

        <button id="btnCheck" class="btn btn-main" onclick="check()">检查（Enter）</button>

      <div id="fb" class="dict-fb"></div>
    </div>

    <div id="result" style="display:none" class="dict-center">
      <div class="dict-big">🏁 本轮默写完成！</div>
      <div class="dict-stats">

ible.", "你收到我们上周寄的样品了吗？希望能尽快得到你的反馈。"], ["I need to confirm with you whether the delivery address of the order needs to be changed.", "我需要和你确认，订单的收货地址是否需要变更。"], ["The raw material supply has been delayed, which may affect the delivery time of your order. We apologize for the inconvenience.", "原材料供应出现延迟，可能会影响你订单的交付时间，对此我们深表歉意。"], ["Could you please provide us with the shipping instructions for the order so that we can arrange the logistics in advance?", "你能提供订单的货运指示吗？以便我们提前安排物流。"], ["We have completed the production of your order and will arrange for shipment within three working days.", "你的订单已完成生产，将在三个工作日内安排发货。"], ["I'm following up on the quality inspection report of the last batch of goods. Have you found any problems?", "我在跟进上一批货物的质量检测报告，你发现有问题吗？"], ["Could you please confirm the quantity of the goods again to avoid any mistakes in the delivery process?", "你能再次确认货物数量吗？避免交付过程中出现差错。"], ["The logistics company has informed us that your order has been shipped. We will send you the tracking number immediately.", "物流公司告知我们，你的订单已发货，我们会立即将物流跟踪号发给你。"], ["Have you reviewed the invoice we sent you last week? If there are any questions, please let us know.", "你查看过我们上周发给你的发票了吗？若有疑问，请告知我们。"], ["We need to adjust the production plan according to your latest requirements. Could you confirm the details again?", "我们需要根据你的最新要求调整生产计划，你能再次确认细节吗？"], ["Could you please speed up the approval process for the order so that we can start production as soon as possible?", "你能加快订单的审批流程吗？以便我们尽快启动生产。"], ["I'm calling to inform you that the delivery time of your order will be advanced by two days.", "我打电话是为了告知你，你订单的交付时间将提前两天。"], ["Have you received the after-sales service form we sent you? Please fill it out and return it to us.", "你收到我们寄的售后服务表了吗？请填写后寄回给我们。"], ["We have encountered some technical problems in the production process of your order and are working to solve them.", "你的订单在生产过程中遇到了一些技术问题，我们正在全力解决。"], ["Could you please inform us of your expected time to confirm the sample so that we can ？希望能尽快得到你的签字确认。"], ["I'm following up on the feedback of the products you purchased last quarter. Are your customers satisfied?", "我在跟进你上季度购买产品的使用反馈，你的客户满意吗？"], ["Could you please confirm whether the delivery method of the order needs to be changed from sea freight to air freight?", "你能确认订单的交付方式是否需要从海运改为空运吗？"], ["We have prepared the documents required for customs clearance of your order and will send them to you today.", "我们已准备好你订单清关所需的文件，今日会发给你。"], ["Have you encountered any problems in using the products? Our technical team is ready to provide support.", "你在使用产品过程中遇到问题了吗？我们的技术团队随时准备提供支持。"], ["The production of your order has been delayed due to a typhoon. We will make up for the delay as soon as possible.", "受台风影响，你的订单生产出现延迟，我们会尽快弥补延误的时间。"], ["Could you please provide us with the certificate of origin required for the order to facilitate customs clearance?", "你能提供订单所需的原产地证书吗？以便顺利清关。"], ["I'm calling to inform you that we have launched a new product that may meet your needs. Would you like to know more?", "我打电话是为了告知你，我们推出了一款可能符合你需求的新产品，你想了解更多吗？"], ["Have you confirmed the receiving time with your warehouse to ensure the goods can be unloaded in time?", "你已和仓库确认收货时间，确保货物能及时卸货了吗？"], ["We need to adjust the production process of your order to improve product quality. Could you confirm the acceptance of this adjustment?", "我们需要调整你订单的生产工艺以提升产品质量，你能确认接受此次调整吗？"], ["Could you please inform us of the progress of the order approval on your side?", "你能告知贵方订单审批的进展情况吗？"], ["The logistics company has encountered some problems, and the delivery of your order may be delayed by one day.", "物流公司出现一些问题，你订单的交付可能会延迟一天。"], ["Have you received the replacement parts we sent you for the defective products?", "你收到我们为有缺陷产品寄的替换零件了吗？"], ["I'm following up on the renewal of the long-term cooperation contract. When would you like to discuss the details?", "我在跟进长期合作合同的续签事宜，你想何时讨论细节？"], ["Could you please confirm the specifications of the products again to avoid any deviations in production?", "你能再次确认产品规格吗？避免生产出现偏差。"], ["We have received your payment for the order and will start arranging the shipment immediately.", "我们已收到你订单的款项，将立即开始安排发货。"], ["Have you discussed the promotion plan for the products with your sales team? We can provide support if needed.", "你和销售团队讨论过产品的推广方案了吗？若有需要，我们可以提供支持。"], ["The production of your order is now 80% complete. We will inform you of the final delivery time in two days.", "你的订单生产已完成 80%，我们将在两天内告知最终交付时间。"], ["Could you please provide us with the import license required for the order to ensure smooth customs clearance?", "你能提供订单所需的进口许可证吗？确保顺利清关。"], ["I'm calling to apologize for the mistake in the order quantity. We have corrected it and will ship the correct quantity.", "我打电话是为了就订单数量错误致歉，我们已更正，将按正确数量发货。"], ["Have you received the technical support document we sent you? It contains solutions to common problems.", "你收到我们发的技术支持文档了吗？其中包含常见问题的解决方案。"], ["We need to confirm the delivery date of the order again. Is the original date still acceptable?", "我们需要再次确认订单的交付日期，原定日期是否仍可接受？"], ["Could you please inform us of any changes in your market demand so that we can adjust our production plan in advance?", "你能告知市场需求的任何变化吗？以便我们提前调整生产计划。"], ["The goods of your order have arrived at the destination port. The logistics company will contact you to arrange delivery.", "你订单的货物已到达目的港，物流公司会联系你安排派送。"], ["Have you completed the acceptance of the goods? If yes, please sign the acceptance certificate and return it to us.", "你已完成货物验收了吗？若已完成，请签署验收单并寄回给我们。"], ["We have launched a customer loyalty program, and you are eligible to participate. Would you like to know the details?", "我们推出了客户忠诚度计划，你有资格参与，想了解详情吗？"], ["Could you please confirm whether you need us to provide on-site installation services for the products?", "你能确认是否需要我们为产品提供现场安装服务吗？"], ["I'm following up on the feedback of the after-sales service we provided. Are you satisfied with our service?", "我在跟进我们提供的售后服务反馈，你对我们的服务满意吗？"], ["We look forward to continuing our cooperation with you. If you have any new needs, please feel free to contact us at any time.", "我们期待与你继续合作，若你有任何新需求，随时联系我们。"], ["I'm sending you an email to follow up on the progress of the sample confirmation. Please reply to us once you have any results.", "我发邮件是为了跟进样品确认的进展。一旦有结果，请回复我们。"], ["Could you please inform us whether you need to modify the product specifications in the current order?", "你能告知是否需要修改当前订单中的产品规格吗？"], ["The production of your order has been completed, and we are waiting for the logistics company to pick up the goods. We will inform you once the goods are shipped.", "你的订单生产已完成，正在等待物流公司提货。货物发出后，我们会立即告知你。"], ["Have you received the updated invoice we sent you after adjusting the order price? Please check if there are any discrepancies.", "你收到我们调整订单价格后发送的更新发票了吗？请检查是否有差异。"], ["We need to confirm with you the mode of transportation for the next batch of goods. Do you still prefer sea freight?", "我们需要和你确认下一批货物的运输方式。你仍然倾向于海运吗？"], ["Could you please speed up the feedback on the quality of the last batch of goods? We need to adjust the production process based on your feedback.", "你能加快对上一批货物质量的反馈吗？我们需要根据你的反馈调整生产工艺。"], ["I'm calling to remind you that the validity period of the quotation we provided will expire next week. Please confirm whether you will place an order as soon as possible.", "我打电话是为了提醒你，我们提供的报价单有效期将于下周到期。请尽快确认是否下单。"], ["Have you arranged for the payment of the deposit for the new order? We need to receive the deposit before starting production.", "你已安排新订单的定金支付了吗？我们需要收到定金后才能启动生产。"], ["The customs clearance documents of your order have been sent to the logistics company. They will handle the customs clearance procedures as soon as possible.", "你订单的清关文件已发送给物流公司。他们会尽快办理清关手续。"], ["Could you please provide us with the contact information of your customs broker? It will facilitate the communication during the customs clearance process.", "你能提供你方报关行的联系方式吗？这将方便清关过程中的沟通。"], ["I'm following up on the progress of the after-sales maintenance work for the defective products. The maintenance will be completed within three days, and we will send the products back to you immediately.", "我在跟进有缺陷产品的售后维修进展。维修将在三天内完成，之后我们会立即将产品寄回给你。"], ["Have you discussed with your team the delivery time of the next batch of orders? Please inform us of your expected time so that we can arrange production.", "你已和团队讨论下一批订单的交付时间了吗？请告知你的预计时间，以便我们安排生产。"], ["The logistics company has updated the tracking information of your order. You can check the latest location of the goods through the tracking number we provided.", "物流公司已更新你订单的跟踪信息。你可以通过我们提供的跟踪号查询货物的最新位置。"], ["Could you please confirm whether you need us to provide a certificate of quality for the goods? We can issue it for you free of charge.", "你能确认是否需要我们为货物提供质量证书吗？我们可以免费为你出具。"], ["We have adjusted the production schedule according to your request to advance the delivery time. Now the expected delivery time is the 15th of next month.", "我们已根据你的要求调整了生产计划，提前了交付时间。现在预计交付时间为下个月 15 日。"], ["Have you received the replacement product we sent you for the defective one? Please confirm the receipt and check the product quality.", "你收到我们为有缺陷产品寄的替换产品了吗？请确认收货并检查产品质量。"], ["I'm sending you a reminder message about the payment of the balance for the order. The balance is due at the time of delivery.", "我给你发一条订单尾款支付的提醒信息。尾款需在交货时支付。"], ["Could you please inform us of any special requirements for the packaging of the goods in the next order? For example, waterproof packaging.", "你能告知下一批订单中货物包装的任何特殊要求吗？例如防水包装。"], ["The technical team has solved the technical problems encountered in the production of your order, and production has resumed. We will ensure that the goods are delivered on time.", "技术团队已解决你订单生产中遇到的技术问题，生产已恢复。我们会确保货物按时交付。"], ["Have you completed the evaluation of our products? We hope to get your suggestions for improvement to provide you with better products in the future.", "你完成对我们产品的评估了吗？我们希望得到你的改进建议，以便未来为你提供更优质的产品。"], ["I'm calling to confirm whether you have received the batch of goods we shipped last week. If there's any shortage, please let us know immediately.", "我打电话是为了确认你是否收到我们上周发出的那批货物。若有短缺，请立即告知我们。"], ["Could you please provide us with feedback on the usability of the product manual? We want to optimize it to make it easier for users to understand.", "你能给我们提供关于产品手册易用性的反馈吗？我们想对其进行优化，让用户更容易理解。"], ["The production of your customized order is progressing smoothly, and we will send you a progress photo every three days to keep you updated.", "你定制订单的生产进展顺利，我们每三天会给你发送一张进度照片，让你及时了解情况。"], ["Have you checked the validity of the import license required for the order? Please ensure it is within the valid period to avoid customs clearance delays.", "你检查过订单所需进口许可证的有效性了吗？请确保其在有效期内，避免清关延误。"], ["We need to adjust the delivery date of your order slightly due to the adjustment of the logistics company's shipping schedule. The new delivery date will be two days later than the original one. We apologize for the inconvenience.", "由于物流公司船期调整，我们需要略微调整你订单的交付日期，新的交付日期比原定日期延后两天。对此我们深表歉意。"], ["Could you please inform us of the contact person for the goods receipt at your warehouse? We will provide their information to the logistics company for smooth delivery.", "你能告知你方仓库的收货联系人吗？我们会将其信息提供给物流公司，以便顺利交货。"], ["I'm following up on the renewal progress of the cooperative product's certification in the target market. It is expected to be completed within a week, and I will inform you as soon as it's done.", "我在跟进合作产品在目标市场的认证续期进度。预计一周内完成，完成后我会立即告知你。"], ["Have you encountered any difficulties in promoting the cooperative products in the local market? We can send our marketing team to provide on-site support if needed.", "你在当地市场推广合作产品时遇到困难了吗？若有需要，我们可以派营销团队提供现场支持。"], ["The price of the raw materials used in your next order may fluctuate. We will notify you of the specific price one week before production to ensure transparency.", "你下一批订单所用原材料价格可能会有波动。我们会在生产前一周告知你具体价格，确保透明。"], ["Could you please confirm whether you need to add a batch code to the product packaging of the current order? This will help with product traceability.", "你能确认是否需要在当前订单的产品包装上添加批次码吗？这将有助于产品追溯。"], ["We have received the feedback on the sample, and our R&D team is adjusting the product according to your suggestions. We will send the revised sample to you within five working days.", "我们已收到样品反馈，研发团队正根据你的建议调整产品。我们会在五个工作日内将修改后的样品寄给你。"], ["Have you arranged for the inspection of the goods after delivery? We recommend conducting a random inspection within three days of receipt to ensure product quality.", "你已安排交货后的货物检验了吗？我们建议在收货后三天内进行抽样检验，确保产品质量。"], ["I'm sending you an email with the detailed production schedule of your order, including key time nodes such as raw material arrival and production completion. Please check it.", "我给你发了一封邮件，里面有你订单的详细生产进度表，包括原材料到货、生产完成等关键时间节点。请你查看。"], ["Could you please speed up the approval of the revised cooperation agreement? We need to sign it before the start of the new project phase next month.", "你能加快修订版合作协议的审批吗？我们需要在下个月新项目阶段启动前签署完毕。"], ["The logistics company has informed us that the goods may be delayed due to port congestion. We will keep tracking the progress and update you in a timely manner.", "物流公司告知我们，由于港口拥堵，货物可能会出现延误。我们会持续跟踪进展，并及时向你更新。"], ["Have you received the product maintenance video we sent you? It introduces the daily maintenance methods of the product in detail, which is helpful for extending the product service life.", "你收到我们发的产品维护视频了吗？里面详细介绍了产品的日常维护方法，有助于延长产品使用寿命。"], ["We need to confirm with you whether the payment method for the current order is consistent with the previous one. If you need to change it, please inform us in advance.", "我们需要和你确认当前订单的付款方式是否与之前一致。若你需要更改，请提前告知我们。"], ["Could you please provide us with the latest market demand forecast for the next quarter? This will help us adjust our production capacity and inventory planning.", "你能给我们提供下一季度的最新市场需求预测吗？这将帮助我们调整产能和库存规划。"], ["I'm calling to apologize for the slight damage to the product packaging during transportation. We will send you a batch of new packaging materials for free to make up for it.", "我打电话是为了就运输过程中产品包装出现的轻微损坏致歉。我们会免费给你寄一批新的包装材料作为补偿。"], ["Have you considered placing a regular order for our products to ensure a stable supply? We can provide preferential prices for regular customers.", "你有考虑过对我们的产品进行定期订购，以确保稳定供应吗？我们可以为长期客户提供优惠价格。"], ["When communicating with business partners in the Middle East, we should avoid scheduling meetings during their religious festivals such as Ramadan.", "与中东的伙伴沟通时，应避免在斋月等宗教节日期间安排会议。"], ["In Japanese business culture, exchanging business cards with both hands and bowing slightly is a basic etiquette to show respect.", "在日本文化中，双手递接名片并微微鞠躬是表达尊重的基本礼仪。"], ["When negotiating with German clients, we should prepare detailed and accurate data, as they value precision and rigor very much.", "与德国客户谈判时，应准备详细准确的数据，因为他们非常看重精确性和严谨性。"], ["In African markets, building personal relationships with local partners is very important before formal business cooperation.", "在非洲市场，正式合作前与当地伙伴建立个人关系非常重要。"], ["When using body language in business communication with Latin American clients, we should note that excessive eye contact may make them feel uncomfortable.", "与拉丁美洲客户进行沟通时使用肢体语言，要注意过多的眼神接触可能会让他们感到不适。"], ["In British business culture, it is common to have small talk about weather or sports before getting down to business.", "在英国文化中，切入正题前谈论天气或体育等闲聊话题是常见做法。"], ["When sending business gifts to clients in China, we should avoid giving clocks or pears, as they have unlucky homophones in Chinese culture.", "给中国客户送礼品时，应避免送钟表和梨，因为它们在中国文化中有不吉利的谐音。"], ["In Indian business communication, we should respect their caste system and avoid asking about personal family background related to caste.", "在印度沟通中，应尊重他们的种姓制度，避免询问与种姓相关的个人家庭背景。"], ["When conducting video conferences with Australian partners, we should pay attention to the time difference and avoid arranging meetings during their weekends.", "与澳大利亚伙伴进行视频会议时，要注意时差，避免在他们的周末安排会议。"], ["In French business culture, it is polite to address others by their titles and last names unless they invite you to use their first names.", "在法国文化中，除非对方邀请你使用其名字，否则用头衔和姓氏称呼对方是礼貌的做法。"], ["When negotiating with Saudi Arabian clients, we should avoid discussing topics such as women's rights or religious reform, which are sensitive in their culture.", "与沙特阿拉伯客户谈判时，应避免讨论妇女权利、宗教改革等在其文化中较为敏感的话题。"], ["In South Korean business culture, the seating arrangement during meetings is usually based on hierarchy, so we should follow their arrangement.", "在韩国文化中，会议座位安排通常依据等级制度，因此应遵循他们的安排。"], ["When communicating with Brazilian business partners, we can use a more enthusiastic and lively tone, as they prefer open and friendly communication.", "与巴西伙伴沟通时，可以采用更热情活泼的语气，因为他们喜欢开放友好的沟通方式。"], ["In Canadian business culture, multiculturalism is highly valued, so we should avoid making comments that may be considered discriminatory against any ethnic group.", "在加拿大文化中，多元文化主义备受重视，应避免发表可能被视为对任何族群有歧视的言论。"], ["When sending business emails to Japanese clients, we should use a formal and polite tone, and avoid using overly casual abbreviations or emojis.", "给日本客户发邮件时，应使用正式礼貌的语气，避免使用过于随意的缩写或表情符号。"], ["In Mexican business communication, it is common to have a long period of social interaction before formal business discussions, so we should be patient.", "在墨西哥沟通中，正式业务讨论前通常会有较长时间的社交互动，因此要保持耐心。"], ["When negotiating with Swedish clients, we should focus on team consensus, as they advocate a flat organizational structure and equal participation.", "与瑞典客户谈判时，应注重团队共识，因为他们推崇扁平化组织结构和平等参与。"], ["In Thai business culture, showing respect to elders and superiors is very important, and we should avoid touching others' heads, which is considered disrespectful.", "在泰国文化中，尊重长辈和上级非常重要，且应避免触摸他人头部，这被视为不尊重的行为。"], ["When communicating with Turkish business partners, we should avoid drinking alcohol in public during business meetings, as most Turks are Muslim and abide by Islamic teachings.", "与土耳其伙伴沟通时，会议期间应避免在公共场合饮酒，因为大多数土耳其人是穆斯林，遵守伊斯兰教教义。"], ["In Singaporean business culture, punctuality is highly emphasized, so we should arrive at meetings at least five minutes in advance.", "在新加坡文化中，守时被高度重视，因此应至少提前五分钟到达会议现场。"], ["When negotiating with Russian clients, we should avoid rushing the negotiation process, as they prefer to take sufficient time to discuss details.", "与俄罗斯客户谈判时，应避免催促谈判进程，因为他们喜欢花足够的时间讨论细节。"], ["In Indonesian business communication, we should use formal language when talking to people of higher status, and avoid using too direct expressions.", "在印度尼西亚沟通中，与地位较高的人交谈时应使用正式语言，避免使用过于直接的表达方式。"], ["When sending business documents to German clients, we should ensure that the content is detailed and the logic is clear, as they have high requirements for document quality.", "给德国客户发送文件时，要确保内容详细、逻辑清晰，因为他们对文件质量要求较高。"], ["In Malaysian business culture, it is polite to greet others with a slight bow and a smile, and avoid using overly intimate physical contact.", "在马来西亚文化中，以微微鞠躬和微笑向他人打招呼是礼貌的做法，避免使用过于亲密的肢体接触。"], ["When communicating with American business partners, we can express our opinions directly and clearly, as they value efficiency and straightforwardness.", "与美国伙伴沟通时，可以直接清晰地表达自己的观点，因为他们看重效率和直截了当。"], ["In Vietnamese business communication, we should respect the elderly and those with senior positions, and avoid interrupting others when they are speaking.", "在越南沟通中，应尊重长辈和职位较高的人，避免在他人讲话时打断。"], ["When negotiating with UAE clients, we should dress formally and conservatively, especially when visiting their offices, to show respect for their culture.", "与阿联酋客户谈判时，应穿着正式且保守，尤其是拜访其办公室时，以表达对其文化的尊重。"], ["In Dutch business culture, people pay attention to practicality and equality, so we should avoid using too many honorifics or overly complicated etiquette.", "在荷兰文化中，人们注重实用性和平等，因此应避免使用过多的敬语或过于复杂的礼仪。"], ["When sending business gifts to French clients, we can choose high-quality chocolates or local wines, but avoid sending expensive gifts which may be considered bribes.", "给法国客户送礼品时，可以选择优质巧克力或当地葡萄酒，但避免送过于昂贵的礼品，以免被视为贿赂。"], ["In Pakistani business communication, we should avoid discussing topics related to India-Pakistan relations, as it is a sensitive political issue.", "在巴基斯坦沟通中，应避免讨论印巴关系相关话题，因为这是敏感的政治问题。"], ["When conducting business meetings with Chinese partners, we should pay attention to the seating arrangement, and the main guest should be seated at the honored position (usually facing the door).", "（与中国伙伴举行会议时，要注意座位安排，主宾应坐在尊位"], ["In Argentine business culture, it is common to have business lunches or dinners to strengthen relationships, and the meal time may last longer.", "在阿根廷文化中，通过午餐或晚餐增进关系是常见做法，用餐时间可能较长。"], ["When negotiating with Norwegian clients, we should focus on environmental protection and social responsibility, as these are important values in their culture.", "与挪威客户谈判时，应关注环境保护和社会责任，因为这些是其文化中的重要价值观。"], ["In Philippine business communication, we should use polite language and avoid saying \"no\" directly; instead, we can use euphemistic expressions such as \"we will consider it\".", "在菲律宾沟通中，应使用礼貌语言，避免直接说 “不”，可以用 “我们会考虑” 等委婉表达方式。"], ["When sending business emails to British clients, we should start with a formal greeting such as \"Dear Mr./Ms.\" and end with a polite sign-off like \"Sincerely\".", "给英国客户发邮件时，应以 “Dear Mr./Ms.” 等正式问候语开头，以 “Sincerely” 等礼貌结束语结尾。"], ["In Kuwaiti business culture, it is important to build trust with partners through frequent communication, and business decisions may take a longer time.", "在科威特文化中，通过频繁沟通与伙伴建立信任很重要，决策可能需要较长时间。"], ["When communicating with South African business partners, we should respect the diversity of their cultures, as the country has multiple ethnic groups and languages.", "与南非伙伴沟通时，应尊重其文化多样性，因为该国拥有多个族群和语言。"], ["In Italian business culture, people are passionate and expressive, so we can respond positively to their enthusiasm during communication.", "在意大利文化中，人们热情且善于表达，沟通时可以积极回应他们的热情。"], ["When negotiating with Polish clients, we should avoid mentioning historical events related to World War II that may cause unpleasant memories.", "与波兰客户谈判时，应避免提及可能引发不愉快回忆的二战相关历史事件。"], ["In Egyptian business communication, we should greet others with \"As-salamu alaykum\" (peace be upon you) as a sign of respect for their Islamic culture.", "（在埃及沟通中，以 “愿平安降临于你”"], ["When sending business gifts to Korean clients, we should avoid giving items in sets of four, as the number four is considered unlucky in Korean culture.", "给韩国客户送礼品时，应避免送四件一套的物品，因为 “四” 在韩国文化中被视为不吉利的数字。"], ["In Colombian business culture, personal connections are crucial for business success, so we should take time to build good relationships with local partners.", "在哥伦比亚文化中，人际关系对商业成功至关重要，因此要花时间与当地伙伴建立良好关系。"], ["When negotiating with Finnish clients, we should maintain a calm and rational attitude, as they prefer quiet and focused communication.", "与芬兰客户谈判时，应保持冷静理性的态度，因为他们喜欢安静且专注的沟通氛围。"], ["In Bangladeshi business communication, we should avoid using left hands to hand over documents or gifts, as the left hand is considered unclean in their culture.", "在孟加拉国沟通中，应避免用左手递接文件或礼品，因为左手在其文化中被视为不洁。"], ["When conducting video conferences with Indian partners, we should ensure that the background is neat and formal, as it shows respect for the meeting.", "与印度伙伴进行视频会议时，要确保背景整洁正式，这是对会议的尊重。"], ["In Spanish business culture, it is common to have a kiss on both cheeks when greeting business partners, but this may vary by region, so we should observe local customs first.", "在西班牙文化中，问候伙伴时行双颊吻礼是常见做法，但不同地区可能有差异，应先观察当地习俗。"], ["When negotiating with Austrian clients, we should pay attention to the details of the contract, as they are very strict about legal terms and conditions.", "与奥地利客户谈判时，要关注合同细节，因为他们对法律条款和条件要求非常严格。"], ["In Nepalese business communication, we should respect their Hindu culture and avoid eating beef in front of them, as cows are considered sacred.", "在尼泊尔沟通中，应尊重其印度教文化，避免在他们面前吃牛肉，因为牛被视为神圣的动物。"], ["When sending business documents to Japanese clients, we should print them on high-quality paper and ensure that there are no typos or formatting errors.", "给日本客户发送文件时，应使用高质量纸张打印，并确保没有错别字或格式错误。"], ["In Peruvian business culture, it is polite to arrive a few minutes late for meetings, but not too late, as being overly punctual may make others feel pressured.", "在秘鲁文化中，会议迟到几分钟是礼貌的做法，但不宜过久，因为过于守时可能会让他人感到有压力。"], ["When communicating with Canadian business partners, we should be sensitive to the cultural differences between English-speaking and French-speaking regions and use the appropriate language.", "与加拿大伙伴沟通时，要对英语区和法语区的文化差异保持敏感，并使用合适的语言。"], ["In Iraqi business communication, we should avoid discussing topics related to the country's political situation or wars, as they may trigger negative emotions.", "在伊拉克沟通中，应避免讨论该国政治局势或战争相关话题，因为这可能引发负面情绪。"], ["When negotiating with Swiss clients, we should focus on the quality and reliability of the products, as these are important factors they consider when making decisions.", "与瑞士客户谈判时，应关注产品的质量和可靠性，因为这些是他们做决策时考虑的重要因素。"], ["In Cambodian business culture, we should greet others with a \"sampeah\" (a gesture where hands are pressed together in front of the chest) to show respect.", "（在柬埔寨文化中，以 “合十礼”"], ["When sending business gifts to American clients, we can choose practical items with the company logo, but avoid sending personal items such as clothing which may be inappropriate.", "给美国客户送礼品时，可以选择带有公司标志的实用物品，但避免送服装等个人物品，以免不合适。"], ["In Moroccan business communication, we should avoid drinking alcohol or eating pork in public, as most Moroccans are Muslim and follow Islamic dietary restrictions.", "在摩洛哥沟通中，应避免在公共场合饮酒或吃猪肉，因为大多数摩洛哥人是穆斯林，遵守伊斯兰教饮食禁忌。"], ["When negotiating with Belgian clients, we should be aware of the cultural differences between the Flemish and Walloon regions and adapt our communication style accordingly.", "与比利时客户谈判时，要了解弗拉芒地区和瓦隆地区的文化差异，并相应调整沟通方式。"], ["In Sri Lankan business communication, we should use formal titles when addressing others, especially those in senior positions, to show respect.", "在斯里兰卡沟通中，称呼他人时应使用正式头衔，尤其是职位较高的人，以表达尊重。"], ["When conducting business meetings with Mexican partners, we should allow time for small talk and relationship-building before discussing business matters.", "与墨西哥伙伴举行会议时，在讨论业务事项前，应留出时间进行闲聊和建立关系。"], ["In New Zealand business culture, the concept of \"kiwi ingenuity\" is valued, so we should highlight the innovation and practicality of our products or services during communication.", "在新西兰文化中，“新西兰式创新” 理念备受重视，沟通时应突出我们产品或服务的创新性和实用性。"], ["Due to a sudden strike of the local logistics company, the delivery of your order may be delayed by 5-7 days. We are actively contacting alternative logistics providers to minimize the delay.", "由于当地物流公司突发罢工，你订单的交付可能会延误 5-7 天。我们正在积极联系备选物流公司，以尽量减少延误。"], ["A batch of raw materials we purchased has failed to meet the quality standard, so we need to re-purchase them, which will affect the production schedule of your order. We will keep you updated on the progress.", "我们采购的一批原材料未达到质量标准，需要重新采购，这将影响你订单的生产进度。我们会及时向你更新进展。"], ["The local customs has detained our goods for inspection due to incomplete documents. We are urgently preparing the missing documents and will coordinate with the customs to release the goods as soon as possible.", "由于文件不全，当地海关扣留了我们的货物进行查验。我们正在紧急准备缺失的文件，并将与海关协调，尽快放行货物。"], ["A key member of our production team has suddenly fallen ill, leading to a temporary slowdown in production. We have arranged other employees to take over the work and will strive to catch up with the schedule.", "我们生产团队的一名核心成员突发疾病，导致生产暂时放缓。我们已安排其他员工接手工作，并会努力赶上进度。"], ["The local government has issued an emergency notice to suspend production in our industry due to environmental protection issues. We will resume production as soon as the ban is lifted and compensate you according to the contract.", "由于环保问题，当地政府发布紧急通知，要求我们行业暂停生产。禁令解除后我们会立即恢复生产，并将根据合同向你进行补偿。"], ["Our computer system was attacked by a virus, resulting in the loss of some order data. We are working with the IT team to recover the data and will re-confirm the order details with you as soon as possible.", "我们的计算机系统遭受病毒攻击，导致部分订单数据丢失。我们正与 IT 团队合作恢复数据，并会尽快与你重新确认订单细节。"], ["The port where our goods are stored was damaged by a natural disaster, and we need to transfer the goods to another port for shipment. This will take about 3 days, and we apologize for the delay.", "我们存放货物的港口因自然灾害受损，需要将货物转移到另一个港口发货。这需要约 3 天时间，对此延误我们深表歉意。"], ["A supplier failed to deliver the required parts on time, which has disrupted our production plan. We are negotiating with the supplier and looking for alternative sources at the same time.", "一家供应商未能按时交付所需零部件，打乱了我们的生产计划。我们正在与该供应商协商，同时寻找备选货源。"], ["The local transportation department has imposed temporary traffic restrictions due to a major accident, making it difficult for our goods to be transported to the warehouse. We are waiting for the restrictions to be lifted and will arrange transportation immediately.", "由于发生重大事故，当地交通部门实施临时交通管制，导致我们的货物难以运到仓库。我们正在等待管制解除，并会立即安排运输。"], ["Our product was found to have a minor quality defect during the final inspection. We are reworking the defective products and will ensure that only qualified products are delivered to you.", "我们的产品在最终检验中发现存在轻微质量缺陷。我们正在对缺陷产品进行返工，确保只向你交付合格产品。"], ["The bank encountered a system failure when processing your payment, resulting in the payment not being credited to our account. We are coordinating with the bank to resolve the issue and confirm the payment status.", "银行在处理你的付款时遇到系统故障，导致款项未到账。我们正在与银行协调解决问题，并确认付款状态。"], ["A fire broke out in a nearby warehouse, and our warehouse was temporarily sealed off for safety checks. We will resume normal operations as soon as the safety check is completed.", "附近一家仓库发生火灾，我们的仓库因安全检查被临时封锁。安全检查完成后，我们会立即恢复正常运营。"], ["The local labor department conducted an unexpected inspection of our factory, which interrupted the production process. We are cooperating with the inspection and will resume production as soon as possible.", "当地劳动部门对我们工厂进行突击检查，中断了生产过程。我们正在配合检查，并会尽快恢复生产。"], ["The packaging materials we prepared for your order were damaged during transportation. We have placed an urgent order for new packaging materials and will start packaging the goods once they arrive.", "我们为你订单准备的包装材料在运输过程中受损。我们已紧急订购新的包装材料，材料到货后会立即开始包装货物。"], ["A sudden change in the local import policy has required us to apply for an additional certificate for the goods. We are preparing the application materials and will complete the application as soon as possible.", "当地进口政策突发变化，要求我们为货物额外申请一份证书。我们正在准备申请材料，并会尽快完成申请。"], ["Our delivery driver had a traffic accident on the way to deliver the goods, and the goods were slightly damaged. We are arranging for another driver to deliver a new batch of goods to you immediately.", "我们的送货司机在送货途中发生交通事故，货物受到轻微损坏。我们正在安排另一名司机立即为你派送一批新的货物。"], ["The temperature control system in our warehouse malfunctioned, which may have affected the quality of some temperature-sensitive goods. We are inspecting the goods and will replace the affected ones for free.", "我们仓库的温控系统出现故障，可能影响了部分温控敏感货物的质量。我们正在检查货物，并会免费更换受影响的货物。"], ["A key supplier announced sudden bankruptcy, and we can no longer obtain raw materials from them. We are urgently negotiating with other suppliers to ensure the continuity of production.", "一家核心供应商突然宣布破产，我们无法再从其处获取原材料。我们正在紧急与其他供应商谈判，确保生产的连续性。"], ["The local postal service suspended operations due to a labor dispute, so we cannot send the sample to you by post. We will use an international courier service instead and send you the tracking number immediately.", "由于劳资纠纷，当地邮政暂停运营，我们无法通过邮政向你寄送样品。我们将改用国际快递服务，并立即给你发送运单号。"], ["Our production line broke down unexpectedly, and the maintenance team is working around the clock to repair it. We will inform you of the new production completion time once the repair is done.", "我们的生产线突发故障，维修团队正在 24 小时不间断维修。维修完成后，我们会立即告知你新的生产完成时间。"], ["The local tax authority requires us to re-file the tax declaration for the export of your order, which has delayed the customs clearance process. We are preparing the tax materials and will complete the re-filing as soon as possible.", "当地税务机关要求我们为你订单的出口重新进行纳税申报，这延误了清关流程。我们正在准备税务材料，并会尽快完成重新申报。"], ["A batch of goods was mistakenly sent to another customer due to a logistics company error. We have contacted that customer to retrieve the goods and will send the correct goods to you via express delivery.", "由于物流公司失误，一批货物被错寄给了另一位客户。我们已联系该客户追回货物，并会通过快递向你发送正确的货物。"], ["The local electricity company implemented an emergency power cut due to grid maintenance, which halted our production. We have started the backup generator and will resume production within 2 hours.", "当地电力公司因电网维护实施紧急停电，导致我们的生产停滞。我们已启动备用发电机，将在 2 小时内恢复生产。"], ["Our product manual translator made a serious mistake in the translation of key technical parameters. We are re-translating the manual and will send you the corrected version within 3 working days.", "我们的产品手册翻译人员在关键技术参数的翻译上出现严重错误。我们正在重新翻译手册，并会在 3 个工作日内给你发送更正后的版本。"], ["A natural disaster in the origin of the raw materials has caused a shortage of raw materials. We are adjusting our production plan and will prioritize the production of your order once raw materials are available.", "原材料产地发生自然灾害，导致原材料短缺。我们正在调整生产计划，原材料到货后会优先安排你订单的生产。"], ["The customs broker we cooperated with failed to submit the customs declaration form on time, resulting in customs clearance delay. We have replaced the customs broker and are urging the new one to handle the procedures quickly.", "我们合作的报关行未能按时提交报关单，导致清关延误。我们已更换报关行，并在催促新报关行尽快办理手续。"], ["Our quality inspection equipment broke down, and we cannot conduct quality checks on the finished products. We have borrowed a set of equipment from a partner company and will start the inspection immediately.", "我们的质量检测设备出现故障，无法对成品进行质量检测。我们已从合作公司借到一套设备，将立即开始检测。"], ["A sudden flood in the logistics park where our goods are stored has caused partial damage to the goods. We are counting the damaged goods and will compensate you according to the loss.", "我们货物存放的物流园区突发洪水，导致部分货物受损。我们正在统计受损货物数量，并会根据损失情况向你进行赔偿。"], ["The local government has imposed a temporary ban on the export of certain products due to national security reasons, which includes our product. We are communicating with the government to obtain an export permit.", "出于国家安全原因，当地政府对部分产品实施临时出口禁令，我们的产品包含在内。我们正在与政府沟通，争取获得出口许可。"], ["Our sales representative made a mistake in recording your order requirements, resulting in the production of incorrect products. We will re-produce the products according to your correct requirements and bear all the costs.", "我们的销售代表在记录你订单需求时出现错误，导致生产了不符合要求的产品。我们会根据你的正确需求重新生产，并承担所有费用。"], ["The international shipping company increased the freight rate suddenly, and we need to renegotiate the freight with them. We will try our best to control the cost and inform you of the final shipping cost as soon as possible.", "国际航运公司突然提高运费，我们需要与他们重新协商运费。我们会尽力控制成本，并尽快告知你最终的运费金额。"], ["A batch of imported parts was detained by the customs due to suspected violation of intellectual property rights. We are providing relevant certificates to prove the legality of the parts and will strive to release them.", "一批进口零部件因涉嫌侵犯知识产权被海关扣留。我们正在提供相关证明文件，证明零部件的合法性，并会努力争取放行。"], ["Our warehouse manager misallocated the goods, and the goods you received are not the ones you ordered. We will arrange for the return of the wrong goods and send the correct ones to you within 48 hours.", "我们的仓库经理错发了货物，你收到的货物并非你所订购的。我们会安排退回错误货物，并在 48 小时内给你发送正确的货物。"], ["The local health department conducted a food safety inspection on our products, and the inspection results will take 3 days to come out. We will ship the goods immediately once we receive the qualified inspection report.", "当地卫生部门对我们的产品进行食品安全检查，检查结果需 3 天才能出来。我们收到合格的检查报告后会立即发货。"], ["Our production schedule was disrupted due to a sudden shortage of water supply in the factory area. We have contacted the water supply company to solve the problem and will adjust the production plan accordingly.", "由于厂区突然停水，我们的生产计划被打乱。我们已联系供水公司解决问题，并会相应调整生产计划。"], ["A key technical engineer of our company resigned suddenly, and there is a temporary gap in the technical support for production. We have invited a technical consultant to fill the gap and ensure the normal progress of production.", "我们公司的一名核心技术工程师突然辞职，导致生产技术支持出现临时空缺。我们已聘请技术顾问填补空缺，确保生产正常进行。"], ["The local market supervision department required us to recall a batch of products due to a minor labeling error. We are recalling the products and will re-label them before re-delivering to you.", "当地市场监管部门因轻微标签错误，要求我们召回一批产品。我们正在召回产品，并会重新贴标后再交付给你。"], ["The logistics company lost a part of your order during transportation. We are investigating the cause with the logistics company and will send the lost goods to you for free within a week.", "物流公司在运输过程中丢失了你订单的一部分货物。我们正在与物流公司调查原因，并会在一周内免费给你发送丢失的货物。"], ["Our computer system was updated, and some order information was not migrated successfully. We are manually re-entering the order information and will confirm the details with you again.", "我们的计算机系统进行了更新，部分订单信息未能成功迁移。我们正在手动重新录入订单信息，并会再次与你确认细节。"], ["The local airport was closed temporarily due to bad weather, so the air freight of your goods cannot take off on time. We will change the shipping method to sea freight and inform you of the new arrival time.", "由于恶劣天气，当地机场临时关闭，你货物的空运无法按时起飞。我们将改用海运，并告知你新的到货时间。"], ["A supplier provided us with counterfeit raw materials, which were discovered during our quality inspection. We are terminating the cooperation with this supplier and purchasing genuine raw materials from a reliable source.", "一家供应商向我们提供了假冒原材料，在我们的质量检测中被发现。我们正在终止与该供应商的合作，并从可靠渠道采购正品原材料。"], ["The local labor union organized a strike, and most of our production workers participated, resulting in production suspension. We are negotiating with the labor union to resolve the dispute and resume production.", "当地工会组织罢工，我们的大部分生产工人参与其中，导致生产暂停。我们正在与工会谈判解决纠纷，恢复生产。"], ["Our product was found to have a safety hazard during a random inspection by the customs. We are modifying the product to eliminate the hazard and will submit it for re-inspection as soon as possible.", "我们的产品在海关抽查中被发现存在安全隐患。我们正在对产品进行整改以消除隐患，并会尽快提交重新检验。"], ["The warehouse where we store your goods was broken into, and some goods were stolen. We have reported the case to the police and will compensate you for the stolen goods according to the contract.", "我们存放你货物的仓库遭入室盗窃，部分货物被盗。我们已向警方报案，并会根据合同向你赔偿被盗货物。"], ["The local communication company had a network failure, and we cannot send emails or make calls to confirm the order details with you. We will use social media messaging platforms to contact you temporarily.", "当地通信公司出现网络故障，我们无法发送邮件或打电话与你确认订单细节。我们将暂时使用社交媒体 messaging 平台与你联系。"], ["Our production workshop was damaged by a strong wind, and some production equipment was broken. We are repairing the workshop and equipment and will resume production as soon as possible.", "我们的生产车间遭强风损坏，部分生产设备受损。我们正在维修车间和设备，并会尽快恢复生产。"], ["The local tax rate for export products was adjusted suddenly, which affected the cost of your order. We are calculating the new cost and will discuss the price adjustment with you fairly.", "当地出口产品税率突然调整，影响了你订单的成本。我们正在计算新的成本，并会与你公平协商价格调整事宜。"], ["A batch of goods was contaminated due to a leak in the chemical storage area of the warehouse. We are disposing of the contaminated goods and will produce a new batch for you immediately.", "由于仓库化学品储存区泄漏，一批货物受到污染。我们正在处理受污染货物，并会立即为你生产一批新的货物。"], ["The logistics company's delivery vehicle was involved in a traffic jam caused by a road accident, and the delivery will be delayed by 2 days. We are tracking the vehicle's location and will update you in real time.", "物流公司的送货车辆因道路事故导致交通拥堵，送货将延误 2 天。我们正在跟踪车辆位置，并会实时向你更新。"], ["Our company's server was down due to a power outage, and we cannot access the order management system. We are restoring the server and will process your order as soon as the system is back online.", "由于停电，我们公司的服务器宕机，无法访问订单管理系统。我们正在恢复服务器，系统上线后会立即处理你的订单。"], ["The local government issued a notice to extend the holiday due to a public health emergency, which delayed the resumption of our production. We will resume production as soon as the holiday is over and catch up with the order progress.", "由于突发公共卫生事件，当地政府发布通知延长假期，延误了我们的复工时间。假期结束后我们会立即复工，并赶上订单进度。"], ["A supplier failed to meet the delivery time agreed in the contract due to its own production problems. We are claiming compensation from the supplier and will find a way to minimize the impact on your order.", "一家供应商因自身生产问题未能按合同约定时间交货。我们正在向该供应商索赔，并会寻找办法将对你订单的影响降到最低。"], ["The packaging of the goods was damaged by rodents in the warehouse, and the goods inside were not affected. We are repackaging the goods and will send them to you as soon as possible.", "仓库中的啮齿动物损坏了货物包装，但内部货物未受影响。我们正在重新包装货物，并会尽快发送给你。"], ["Our quality inspector made a mistake in the inspection process, and a batch of unqualified products was mistakenly shipped to you. We will arrange for the return of these products and send qualified ones immediately.", "我们的质检员在检验过程中出现失误，一批不合格产品被错发给你。我们会安排退回这些产品，并立即发送合格产品。"], ["The local port authority implemented stricter inspection standards for imported goods, which extended the customs clearance time. We are cooperating with the port authority and will inform you of the clearance progress daily.", "当地港务局对进口货物实施更严格的检验标准，延长了清关时间。我们正在配合港务局，并会每天向你告知清关进展。"], ["A fire broke out in our production workshop, but it was put out in time and did not cause major damage. We are checking the equipment and will resume production within 1 day.", "我们的生产车间发生火灾，但已及时扑灭，未造成重大损失。我们正在检查设备，将在 1 天内恢复生产。"], ["The international payment system had a temporary failure, and your payment could not be processed. We are waiting for the system to recover and will confirm the payment status with you immediately after that.", "国际支付系统出现临时故障，无法处理你的付款。我们正在等待系统恢复，恢复后会立即与你确认付款状态。"], ["The local transportation company increased the transportation fee without notice, which affected our shipping cost. We are negotiating with the company to reduce the fee and will control the total cost for you.", "当地运输公司未提前通知就提高了运费，影响了我们的运输成本。我们正在与该公司谈判降低运费，并会为你控制总成本。"], ["Our product design was found to infringe on the patent of another company, so we need to modify the design. We are adjusting the design plan and will inform you of the new production time once it is confirmed.", "我们的产品设计被发现侵犯了另一家公司的专利，需要进行设计修改。我们正在调整设计方案，确定后会告知你新的生产时间。"], ["A sudden earthquake in the area where our factory is located caused a temporary shutdown. We are checking the safety of the factory and employees and will resume production as soon as the situation is stable.", "我们工厂所在地区突发地震，导致工厂临时停产。我们正在检查工厂和员工的安全情况，局势稳定后会立即恢复生产。"], ["When attending a business dinner with clients, we should wait for the host to start eating before picking up the tableware.", "与客户参加晚宴时，应等待主人开始用餐后再拿起餐具。"], ["In business meetings, we should turn our mobile phones to silent mode to avoid disturbing the meeting process.", "在会议中，应将手机调至静音模式，避免打扰会议进程。"], ["When shaking hands with business partners, we should maintain a firm but not overly tight grip, and shake hands for about 2-3 seconds.", "与伙伴握手时，力度应适中，不要过紧，握手时间保持在 2-3 秒左右。"], ["When introducing people in a business occasion, we should introduce the person of lower status to the person of higher status first.", "在场合介绍他人时，应先将职位较低的人介绍给职位较高的人。"], ["When wearing business attire, men should ensure that the length of their ties reaches the belt buckle, and women should avoid wearing overly revealing clothing.", "穿着着装时，男士应确保领带长度到达皮带扣，女士应避免穿着过于暴露的服装。"], ["When exchanging business cards, we should present our business card with the text facing the other person, and take the other person's business card with both hands and read it briefly.", "交换名片时，应将自己的名片文字朝向对方递出，双手接过对方名片并简要阅读。"], ["During a business lunch, we should avoid talking with food in our mouths, and chew with our mouths closed.", "午餐期间，应避免嘴里含着食物说话，咀嚼时要闭着嘴。"], ["When participating in a business exhibition, we should stand upright, smile and greet visitors actively, and avoid leaning against the exhibition booth or playing with mobile phones.", "参加展会时，应站姿端正，主动微笑迎接参观者，避免靠在展台上或玩手机。"], ["When visiting a client's office, we should arrive on time, and if we are likely to be late, we should call to inform the client in advance.", "拜访客户办公室时，应准时到达，若预计会迟到，应提前打电话告知客户。"], ["When speaking in a business meeting, we should express our opinions clearly and concisely, and avoid interrupting others' speeches.", "在会议上发言时，应清晰简洁地表达观点，避免打断他人发言。"], ["When using tableware at a Western-style business dinner, we should use them from the outside in, and place the knife and fork on the plate at 45 degrees when taking a break.", "在西式晚宴上使用餐具时，应从外向内依次使用，休息时将刀叉呈 45 度放在盘子上。"], ["When sending thank-you emails to clients after a business cooperation, we should send them within 24 hours to show our gratitude in a timely manner.", "合作后给客户发送感谢邮件时，应在 24 小时内发送，及时表达感谢。"], ["When participating in a business negotiation, we should maintain a calm and polite attitude, even if there are differences of opinion, and avoid arguing fiercely.", "参加谈判时，应保持冷静礼貌的态度，即使有意见分歧，也避免激烈争吵。"], ["When using a laptop in a business meeting, we should only use it for taking notes or viewing meeting materials, and avoid browsing irrelevant web pages.", "在会议中使用笔记本电脑时，应仅用于记笔记或查看会议资料，避免浏览无关网页。"], ["When greeting business partners from other countries, we should learn about their local greeting customs in advance to avoid making etiquette mistakes.", "问候来自其他国家的伙伴时，应提前了解其当地的问候习俗，避免出现礼仪错误。"], ["When presenting a business report, we should dress formally, speak in a clear and loud voice, and maintain eye contact with the audience appropriately.", "进行报告演示时，应着装正式，声音清晰洪亮，并适当与听众保持眼神交流。"], ["When dining with clients, we should avoid ordering dishes with strong odors, as they may make others feel uncomfortable.", "与客户用餐时，应避免点气味浓烈的菜肴，以免让他人感到不适。"], ["When attending a business cocktail party, we should hold the wine glass by the stem, not the bowl, to avoid warming the wine with our hands.", "参加鸡尾酒会时，应握住酒杯的杯柄，而非杯身，避免手温使酒变热。"], ["When communicating with clients via email, we should use a clear and concise subject line, and avoid using all capital letters in the email content, which is considered rude.", "通过邮件与客户沟通时，应使用清晰简洁的主题栏，邮件内容避免全部使用大写字母，这被视为不礼貌。"], ["When visiting a client's factory or warehouse, we should follow the client's guidance, wear the required protective equipment, and avoid touching the equipment at will.", "参观客户的工厂或仓库时，应听从客户引导，穿戴要求的防护装备，避免随意触摸设备。"], ["When participating in a business training course, we should arrive on time, take notes carefully, and actively participate in group discussions.", "参加培训课程时，应准时到达，认真记笔记，并积极参与小组讨论。"], ["When having a business conversation with a client, we should maintain an appropriate distance (usually 1.2-1.5 meters) to avoid making the other person feel cramped.", "（与客户进行交谈时，应保持适当距离"], ["When sending business gifts to clients, we should attach a handwritten greeting card, which is more sincere than a printed one.", "给客户送礼品时，应附上手写贺卡，比打印贺卡更显真诚。"], ["When participating in a video conference, we should ensure that the background is tidy, the lighting is sufficient, and we look directly at the camera when speaking.", "参加视频会议时，应确保背景整洁、光线充足，说话时直视摄像头。"], ["When apologizing to a client for a mistake, we should take responsibility actively, explain the reason briefly, and put forward a solution instead of making excuses.", "因失误向客户道歉时，应主动承担责任，简要说明原因，并提出解决方案，而非找借口。"], ["When attending a business funeral or memorial event for a client's family member, we should dress in dark colors, keep a solemn expression, and avoid talking loudly.", "参加客户家人的葬礼或纪念活动时，应穿着深色服装，表情庄重，避免大声交谈。"], ["When negotiating with clients over the phone, we should speak clearly, listen carefully, and take notes of key information to avoid missing important content.", "与客户进行电话谈判时，应说话清晰，认真倾听，并记录关键信息，避免遗漏重要内容。"], ["When using public transportation to attend a business event, we should avoid rushing or pushing others, and give up seats to the elderly, disabled, and pregnant women.", "乘坐公共交通参加活动时，应避免拥挤推搡，主动给老人、残疾人、孕妇让座。"], ["When introducing our company's products to clients, we should focus on the benefits and values the products bring to the clients, rather than just introducing the product features.", "向客户介绍公司产品时，应重点说明产品给客户带来的利益和价值，而非仅介绍产品特性。"], ["When participating in a business award ceremony, we should applaud sincerely when others receive awards, and avoid showing jealousy or indifference.", "参加颁奖典礼时，他人获奖时应真诚鼓掌，避免表现出嫉妒或冷漠。"], ["When having a business meal with clients who have dietary restrictions (such as vegetarianism or allergies), we should take the initiative to ask about their preferences and arrange the menu accordingly.", "（与有饮食限制"], ["When using a client's office facilities (such as printers or copiers), we should ask for permission first and keep the facilities clean after use.", "（使用客户的办公设施"], ["When sending a follow-up email to a client after a meeting, we should summarize the key points of the meeting and the next action plan to ensure both parties have the same understanding.", "会议后给客户发送跟进邮件时，应总结会议要点和下一步行动计划，确保双方理解一致。"], ["When attending a business conference, we should avoid leaving the venue casually during the speech, and if we need to leave, we should do so quietly.", "参加会议时，演讲期间应避免随意离场，若需离场，应安静离开。"], ["When communicating with clients from different cultural backgrounds, we should avoid using slang or dialects, as they may cause misunderstandings.", "与不同文化背景的客户沟通时，应避免使用俚语或方言，以免造成误解。"], ["When presenting a business proposal to clients, we should prepare printed copies for the clients to read, in addition to the electronic version displayed on the screen.", "向客户演示提案时，除了屏幕上展示的电子版，还应准备打印版供客户阅读。"], ["When having a business conversation with a client, we should avoid looking at our watches frequently, as it may make the client feel that we are in a hurry to end the conversation.", "与客户进行交谈时，应避免频繁看手表，这可能会让客户觉得我们急于结束谈话。"], ["When participating in a team-building activity with business partners, we should actively participate, cooperate with others, and avoid being alone or indifferent.", "与伙伴参加团队建设活动时，应积极参与，与他人合作，避免独处或表现冷漠。"], ["When sending business documents to clients, we should name the files clearly (such as \"2024 Q1 Business Plan - Company Name\"), so that the clients can find them easily.", "（给客户发送文件时，应将文件命名清晰"], ["When attending a business wedding of a client, we should send a congratulatory gift or red envelope according to the local customs, and dress appropriately for the occasion.", "参加客户的婚礼时，应根据当地习俗送上贺礼或红包，并穿着与场合相符的服装。"], ["When negotiating the price with a client, we should be polite and reasonable, and avoid using aggressive language such as \"this is the lowest price, take it or leave it\".", "与客户协商价格时，应礼貌合理，避免使用 “这是最低价，要不要随你” 等强硬语言。"], ["When using a client's conference room for a meeting, we should clean up the meeting materials and garbage after the meeting, and restore the chairs to their original positions.", "使用客户的会议室开会后，应清理会议资料和垃圾，并将椅子恢复原位。"], ["When communicating with clients via instant messaging tools, we should reply to their messages in a timely manner, and if we cannot reply immediately, we should inform them of the reason.", "通过即时通讯工具与客户沟通时，应及时回复消息，若无法立即回复，应告知原因。"], ["When attending a business exhibition, we should avoid eating or drinking in the exhibition area, and use the designated rest areas instead.", "参加展会时，应避免在展区内饮食，改用指定的休息区。"], ["When introducing a colleague to a client, we should briefly introduce the colleague's job title and responsibilities to help the client understand the colleague's role.", "将同事介绍给客户时，应简要介绍同事的职位和职责，帮助客户了解其角色。"], ["When having a business lunch with a client, we should avoid ordering alcohol unless the client proposes to drink, and we should not drink too much even if we do.", "与客户共进午餐时，除非客户提议饮酒，否则应避免点酒，即使饮酒也不应过量。"], ["When sending a business invitation to a client, we should clearly state the purpose, time, location, and agenda of the event, so that the client can make arrangements in advance.", "给客户发送邀请时，应明确说明活动目的、时间、地点和议程，方便客户提前安排。"], ["When participating in a business negotiation, we should bring relevant materials (such as contracts, data reports) and organize them neatly for easy reference.", "（参加谈判时，应携带相关资料"], ["When communicating with a client who is angry about a problem, we should listen patiently to their complaints first, and then express our willingness to solve the problem.", "与因问题而愤怒的客户沟通时，应先耐心倾听其抱怨，然后表达解决问题的意愿。"], ["When attending a business lecture, we should take notes carefully, avoid chatting with others, and ask questions politely after the lecture if we have any.", "参加讲座时，应认真记笔记，避免与他人交谈，若有问题，讲座结束后礼貌提问。"], ["When using a rental car for a business trip, we should keep the car clean, abide by the local traffic rules, and return the car on time.", "旅行租用汽车时，应保持车内清洁，遵守当地交通规则，并按时还车。"], ["When sending a thank-you gift to a client, we should choose gifts that are in line with the client's preferences and cultural background, and avoid gifts that are too expensive or inappropriate.", "给客户送感谢礼时，应选择符合客户喜好和文化背景的礼品，避免过于昂贵或不合适的礼品。"], ["When participating in a business video conference, we should avoid eating, drinking, or doing other irrelevant things during the meeting, and focus on the meeting content.", "参加视频会议时，会议期间应避免饮食或做其他无关事情，专注于会议内容。"], ["When visiting a client's place of business, we should avoid commenting on the client's office environment or decoration in a negative way.", "拜访客户经营场所时，应避免负面评价客户的办公环境或装修。"], ["When negotiating a contract with a client, we should explain each clause clearly to the client, especially the terms related to rights and obligations, to avoid future disputes.", "与客户协商合同时，应向客户清晰解释每个条款，尤其是权利义务相关条款，避免日后产生纠纷。"], ["When using a client's Wi-Fi network, we should ask for the password first, and avoid using the network to access sensitive or inappropriate content.", "使用客户的 Wi-Fi 网络时，应先询问密码，避免使用该网络访问敏感或不当内容。"], ["When attending a business party, we should greet the host and other guests politely, and avoid staying in one place all the time; instead, we should communicate with different people appropriately.", "参加派对时，应礼貌问候主人和其他宾客，避免一直待在一个地方，适当与不同的人交流。"], ["When sending business documents to a client via email, we should compress large files to avoid taking up too much of the client's email storage space.", "通过邮件给客户发送文件时，应对大文件进行压缩，避免占用客户过多邮箱存储空间。"], ["When communicating with a client who speaks a different language, we should use simple and clear expressions, and avoid using complex sentence structures or professional terms that are difficult to translate.", "与说不同语言的客户沟通时，应使用简单清晰的表达方式，避免使用复杂句型或难以翻译的专业术语。"], ["When ending a business conversation with a client, we should summarize the key points of the conversation again, express our expectation for future cooperation, and say goodbye politely.", "与客户结束交谈时，应再次总结谈话要点，表达对未来合作的期待，并礼貌道别。"]];window.__KEY__="915职场商务英语必备600句";window.__TITLE__="9.15 职场商务英语必备600句";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
