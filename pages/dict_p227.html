。"], ["I dare say that the price we offer compares favorably with any quotation you can obtain elsewhere.", "我敢说，跟你从别处拿到的报价比，我们这价最划算。"], ["I am afraid you won’t find another company that will give you a cheaper price than ours.", "恐怕你找不着别家比我们更便宜的报价了。"], ["What we give you is a good price. We don’t think it could be any better. Take it or leave it; it's up to you.", "我们给的价已经很好了，不会再让了。接不接受，你自己定。"], ["If you compare the quality of our goods with that of other countries, you will see our price is very reasonable.", "拿我们的产品质量跟其他国家的比，你就知道这价多合理了。"], ["The price we quote you for belts is much lower than that of last year's. You must find it very competitive.", "我们给你报的皮带价，比去年低多了，你肯定觉得很有竞争力。"], ["Our offer might be a bit high, but you will soon make bigger profits when market fluctuations stop.", "我们报价可能有点高，但等市场稳定了，你很快就能赚大钱。"], ["The present market situation is on the upward trend, so you don't have to worry about the profit.", "现在市场是上升趋势，你不用愁利润的事。"], ["Our product is very competitive, so there is no question of profit.", "我们的产品很有竞争力，利润肯定没问题。"], ["Your counter-offer seems to be a little tight; if so, our profit margin will be too small.", "你的还盘有点压得太低了，这样我们利润空间就太小了。"], ["If you increase your initial order to 30,000, I suppose we could consider reducing the price to $300.08 per unit.", "要是你把订单加到 30,000 件，我觉得我们可以考虑把单价降到 300.08 美元。"], ["If you double the order, we may consider giving you an 8% discount.", "订单翻倍的话，我们可以考虑给你 8% 的折扣。"], ["The best we can do is to allow you 2% off our quotation.", "我们最多能在报价上给你降 2%。"], ["There are so many rich people in your area; a high price means a good quality product to them.", "你那边有钱人多，对他们来说，高价就等于好质量。"], ["If you stick to your counter-offer without any compromise, we may not be able to make a deal.", "你要是坚持还盘不让步，这生意可能就黄了。"], ["Your bid is obviously out of line with the ruling price and the present market.", "你的报价明显跟当前市场主流价不符。"], ["We regret we cannot book your order according to your counter-offer.", "按你的还盘，我们没法接你的订单，抱歉。"], ["All your quotations are on FOB Vancouver basis. May I ask if you allow any discount?", "你所有报价都是 FOB 温哥华，能给点折扣不？"], ["Isn't it possible to give us a little more discount?", "能不能再多给点折扣啊？"], ["If you are prepared to give me some allowance, I will consider placing an order for 10,000 dozen.", "你要是准备给点优惠，我就考虑下 10,000 打的订单。"], ["Would you be prepared to reduce your price? Then we might come to terms.", "你能降点价不？这样我们就能成交了。"], ["If I show you an offer lower than yours, would you be able to conclude the transaction at that price?", "我给你看个比你低的报价，你能按那个价成交不？"], ["May we suggest that you make some allowance on your quoted prices?", "我们能建议你在报价上给点折扣不？"], ["If we place an order for 2,000 dozen or more, can you give us a special discount?", "我们下 2,000 打以上的订单，能给个特别折扣不？"], ["We hope you will give us some discount on our purchase of 6,000 dozen.", "我们买 6,000 打，希望你能给点折扣。"], ["Please make a discount of 5% off the prices in the catalog.", "请按目录价给 5% 的折扣。"], ["We hope that you will make at least a 5% reduction on your quotation, or business is not possible.", "希望你报价至少降 5%，不然这生意没法做。"], ["We can accept the goods only at a reduction of 20% on the contract price.", "我们只接受按合同价降 20% 的价格。"], ["If you can lower your price by 5%, business is hopeful.", "你要是能降价 5%，这生意还有戏。"], ["We will place our order with you if you can lower your price to 200 pounds per MT.", "你要是能降到每公吨 200 英镑，我们就跟你下单。"], ["All your quotations are on FOB Vancouver basis. I wonder if you can give some discount?", "你方所有报价都是基于温哥华离岸价（FOB），我想问问是否能给些折扣？"], ["Isn’t it possible to give us a little more discount?", "能不能多给我们一些折扣呢？"], ["If you are prepared to give us some concession, I will consider placing an order for 10,000 dozens.", "如果你方准备给我们一些优惠，我会考虑下 10,000 打的订单。"], ["Should you be prepared to reduce your price, we might reach an agreement.", "如果你方准备降价，我们或许能达成协议。"], ["We assure you that such things will not happen again in our future deliveries.", "我们向您保证，此类情况在我们今后的交货中不会再发生。"], ["We’d like to avail ourselves of this opportunity to assure you that we will pay careful attention in handling your future order.", "我们想借此机会向您保证，我们在处理您未来的订单时会格外留意。"], ["Our products are always as good as the samples we send. I can promise there will be no debasement of quality.", "我们的产品一直和我们寄给您的样品一样好，我可以保证质量不会降低。"], ["I guarantee that there is no difference in quality between the products we send you next month and the samples you saw just now.", "我保证我们下个月发给您的产品和您刚才看到的样品在质量上没有差别。"], ["I can promise you that the product we send to you will be of A-one quality.", "我可以向您保证，我们发给您的产品将是一流品质。"], ["Our products are surely of standard quality.", "我们的产品质量肯定达标。"], ["Here is our contract.", "这是我们的合同。"], ["Please go over it and see if everything is in order.", "请过目一下，看看是否一切妥当。"], ["Don't you think we should add a sentence here like this?", "难道你不觉得我们应该在这儿加上一句话？"], ["If one side fails to observe the contract, the other side is entitled to cancel it.", "如果一方不履行合同协议，另一方有权终止合同。"], ["The loss for this reason should be charged by the side breaking the contract.", "造成的损失必须由毁约方承担。"], ["Do you have any comment on this clause?", "你对这一条款有何看法？"], ["It is our permanent principle that contracts are honored and commercial integrity is maintained.", "重合同、守信用是我们的一贯原则。"], ["The contract contains basically all we have agreed upon during our negotiations.", "合同将我们达成协议的内容基本上都写上了。"], ["I hope no questions about the terms.", "我看合同的条款没有什么问题了。"], ["I'm glad our negotiation has come to a successful conclusion.", "我很高兴这次洽谈圆满成功。"], ["I hope this will lead to further business between us.", "我希望这次交易使我们之间的贸易进一步发展。"], ["We'll sign two originals, each in Chinese and English language.", "我们将要用中文和英语分别签署两份原件。"], ["I am ready to sign the agreement.", "我已经准备好了签合同。"], ["I'm sure you need an original signature, not a faxed copy.", "我知道你们要的是原件，不是传真件。"], ["So I will receive and sign it overnight.", "那么，我明天就可以收到并且签上名了。"], ["We should book a trial order with you if you will give us a 5% commission.", "你要是给 5% 的佣金，我们就先下个试单。"], ["Only by cutting the price by more than 10% can more customers be lured to buy your products.", "只有降价 10% 以上，才能吸引更多客户买你们的产品。"], ["We would like to ask for 10% off your offer if our order is more than 2,500 units per season.", "要是我们每季订单超 2,500 件，想让你降价 10%。"], ["We want to know if you could appoint us as your agent for the sale of your green tea.", "我们想知道贵公司能否指定我们为贵公司绿茶销售的代理商。"], ["If you are not already represented here, we should be interested in acting as your sole agent.", "如果贵公司在此地还没有代理，我们有兴趣做贵公司的独家代理。"], ["We should like to be appointed as your agent in our country.", "我们希望被指定为贵公司在我国的代理商。..."], ["If you wish to work for other firms as well, You must obtain our permission first.", "如果您还想为其他公司工作，必须先获得我们的许可。"], ["To be our sole agent you should not sell similar products from other manufacturers without our prior approval.", "要成为我们的独家代理，未经我们事先批准，您不应销售其他制造商的类似产品。"], ["As our agent, you should not sell products of similar characteristic from other maker’s. We must make that very clear.", "作为我们的代理，您不应销售其他制造商具有类似特性的产品，这一点我们必须明确。"], ["As our sole distributor, you will neither handle the same or similar products of other regions nor re-export our goods outside to any other region outside your own.", "作为我们的独家经销商，您既不能经营其他地区的相同或类似产品，也不能将我们的货物再出口到您所在地区之外的任何其他地区。"], ["During the validity of the agency agreement you should not handle any other foreign products of the same line and competitive types.", "在代理协议有效期内，您不应经营任何其他同类和有竞争力的外国产品。"], ["Every six month, we ‘d like to receive from you a detailed report on current market conditions and user’s comments on our products.", "每六个月，我们希望收到您方一份关于当前市场状况和用户对我们产品评价的详细报告。"], ["Your market report should show how big demands for our products is in your market.", "您的市场报告应显示我们的产品在您方市场的需求量有多大。"], ["The market report should include the trend of the development of the market, upward or downward.", "市场报告应包括市场的发展趋势，是上升还是下降。"], ["We'd like you to send us your sale’s statistics every six month instead of every year.", "我们希望你们每六个月而不是每年向我们发送销售统计数据。"], ["As our agent you should send us your market report regularly at least once every three month.", "作为我们的代理，您应该定期至少每三个月向我们发送一次您的市场报告。"], ["We are glad to offer you the agency for the sale of our products in your city.", "我们很高兴指定你为我们产品在贵城销售的代理商。"], ["We have decided to offer you an appointment as our sole agent for New York.", "我们已经决定指定你为我们在纽约的独家代理商。"], ["Your experience in this field makes us believe that you can be a good agent.", "你在这一领域的经验让我们相信你能成为一名优秀的代理商。"], ["We feel inclined to agree to your agency of our products.", "我们倾向于同意你代理我们的产品。"], ["We are willing to negotiate with you on your proposal to act as our agent.", "我们愿意就你方担任我们代理的提议与你方协商。"], ["After paying due consideration to your proposals and investigating your business standing, we have decided to appoint you as our agent in the district you defined.", "在对贵方提议进行适当考虑并调查贵方商业信誉后，我们决定指定贵方为我方在贵方所指定区域的代理商。"], ["Considering that you are experienced in promoting the sale of our crafted paper and your market still has potential, we have decided to appoint you as our sole agent in your local market.", "考虑到贵方在推销我方工艺纸方面经验丰富且贵方市场仍有潜力，我们决定指定贵方为我方在贵方当地市场的独家代理商。"], ["We regret that we are unable to accept your proposal since we already have an agent in your area.", "很遗憾，我们不能接受您的提议，因为我们在您所在地区已经有代理商了。"], ["We have already appointed Tokyo-Silk as our agent in your territory.", "我们已经指定东京丝绸公司为我们在贵方地区的代理商。"], ["Sorry, we have already several representatives of our products in your district.", "抱歉，在你们地区我们已经有几家产品代理商了。"], ["We can’t give you exclusive agency of the whole European market without having the slightest idea of your possible annual marketing turnover.", "如果对你们可能的年销售额毫无头绪，我们不能把整个欧洲市场的独家代理权交给你们。"], ["Before we know your sales volume, your plan for promotion and import license’s conditions, it is rather difficult for us to consider your proposal.", "在了解贵方销售额、推广计划和进口许可证情况之前，我们很难考虑您的提议。"], ["We have noted your quest to act as our agent in your district, but before going further into the matter, we should like to know more about your market.", "我们已经注意到您方希望担任我们在您方地区的代理商，但在进一步商讨此事之前，我们想更多地了解您方市场的情况。"], ["To enable us to make further study of your proposal, would you please let us know as early as possible the sales prospects of the item in your market, your program in detail, your business organizations in various districts and their activities.", "为了能进一步研究您方的建议，请您尽早告知我们该产品在您方市场的销售前景、您方的详细计划、您在各地区的商业机构及其活动情况。"], ["Unless you increase the turnover we can hardly appoint you as our sole agent.", "除非你方提高营业额，否则我们很难指定你方为我们的独家代理。"], ["If you can push the sales successfully for the next 6 month we may appoint you as our agent.", "如果你们在接下来的 6 个月里能成功地促进销售，我们可能会指定你们作为我们的代理。"], ["We feel it would be better to consider the matter of agency after you have done more business with us.", "我们觉得在您与我们有更多业务往来之后再考虑代理事宜会更好。"], ["To be our agent you need to increase your annual turnover.", "要成为我们的代理，您需要提高年营业额。"], ["To be our agent you are requested to push your sales of our product effectively.", "要成为我们的代理，需要您有效地推销我们的产品。"], ["We hope you will do your best to push the sale of our products.", "我们希望您将尽最大努力推销我们的产品。"], ["We are not inclined to consider any questions concerning agents.", "我们不打算考虑任何有关代理商的问题。"], ["We are not prepared to appoint an agent for your district.", "我们不准备在贵方地区指定代理商。"], ["We have no intention of considering exclusive sales in your market at present.", "目前我们不打算考虑在贵方市场进行独家销售。"], ["We are not ready yet to discuss the question of agency at present moment.", "目前我们还没准备好讨论代理问题。"], ["Since the market situation is not known to us, we are not going to take the question of sole agency into consideration for the time being.", "由于我们不了解市场情况，目前暂不考虑独家代理问题。"], ["As the volume of business concluded by you is not big enough, we won’t consider the question of agency.", "由于贵方完成的业务量不够大，我们不考虑代理问题。"], ["We think it premature for us to discuss the question of agency at present stage.", "我们认为现阶段讨论代理问题对我们来说为时过早。"], ["The time is not yet mature to discuss the question of agency.", "讨论代理问题的时机还不成熟。"], ["We would like to say that at this initial stage of our contract, both sides do not understand each other very well, so there seems to be no sufficient bases for us to negotiate agency.", "我们想说，在我们合同的初始阶段，双方还不太了解彼此，所以我们似乎没有足够的基础来协商代理问题。"], ["I am afraid that this is not a good time yet to push the sales of our product in your market.", "恐怕现在还不是在贵方市场推销我们产品的好时机。"], ["To facilitate the extension of sales, you must advertise our products by means of TV and newspapers.", "为了促进销售，您必须通过电视和报纸为我们的产品做广告。"], ["We hope that you will redouble your efforts in your sales pushing.", "我们希望您在促销方面加倍努力。"], ["To be our agent your minimum annual turnover should be at least 8000 units.", "若成为我们的代理商，你们每年最低的销售额应至少达到 8000 个单位。"], ["If you could agree to terms, we would appoint you as our sole agent.", "如果您能同意条款，我们将指定您为我们的独家代理商。"], ["If terms are workable, we think you will be the firm we prefer to represent us.", "如果条款可行，我们认为你们就是我们希望代理我们的公司。"], ["At the beginning of the sales promotion you have to try every means to overcome sales difficulties.", "在促销初期，您必须想尽一切办法克服销售困难。"], ["To effectively promote sales, your way of doing business should always comply with the constantly changing circumstances.", "为了有效促进销售，您的经营方式应始终顺应不断变化的环境。"], ["During the agency please pay close attention to the consumer’s comments on our products.", "在代理期间，请密切关注消费者对我们产品的评价。"], ["You are under obligation to display optimum samples of the products during the duration of the agency.", "在代理期间，您有义务展示产品的最佳样品。"], ["We hoped that you will strictly observe all the terms and condition of the agency agreement.", "我们希望您将严格遵守代理协议的所有条款和条件。"], ["We have honestly considered your proposal to represent us in your city for the sale of Chinese porcelain vases and have now appointed you as our agent.", "我们认真考虑了贵方在贵城代理销售中国瓷花瓶的提议，现在指定贵方为我们的代理商。"], ["Your application for sole agency is now under our careful consideration, if possible we should like to know your plan to push the sale of your products.", "我们正在认真考虑您提出的独家代理申请，如果可能的话，我们想了解一下您推销产品的计划。"], ["I think we have to consider your proposal about agency carefully.", "我想我们得认真考虑你方关于代理的提议。"], ["Please tell us your detailed plan of sales promotion so that we may proceed with our negotiations about the terms of agency agreement.", "请把贵方促销的详细计划告诉我们，以便我们继续商讨代理协议的条款。"], ["Your proposal for sole agency will soon be under careful study.", "您方提出的独家代理建议将很快得到我们的仔细研究。"], ["We do not think the time is right for the discussion of the question of exclusive agency.", "我们认为现在不是讨论独家代理问题的时候。"], ["We regret to say that since there is so far no transaction concluded between us, we have to decline your quest for agency.", "很遗憾，由于我们之间至今尚未达成交易，我们不得不拒绝您的代理请求。"], ["The question of agency is still under consideration and we hope you will continue your effort to push the sale of our product at present stage.", "代理问题仍在考虑之中，我们希望现阶段您能继续努力推销我们的产品。"], ["We shall not consider appointing you as our sole agent until your sales record justifies our doing so.", "在您的销售业绩证明我们可以这样做之前，我们不会考虑指定您为我们的独家代理商。"], ["Shall we discuss the matter of agency when your market condition turns better?", "等你方市场情况好转时我们再讨论代理事宜好吗？"], ["We should be glad if you would consider our application to act as agent for sales of your plastic slippers.", "如果贵公司考虑我们作为贵公司塑料拖鞋销售代理的申请，我们将不胜感激。"], ["If you are not represented here in London yet, we would like to act as your sole agent.", "如果你们在伦敦还没有代理，我们愿意做你们的独家代理。"], ["As we have learned from our customer Mr. Harry that you are anxious to extend your activity in our market and you are not represented at present. We would like to recommend our company as a most suitable agent for your products.", "我们从客户哈里先生处获悉，贵公司迫切希望在我们的市场拓展业务，而且目前没有代理，我们很乐意推荐我公司作为贵公司产品最合适的代理商。"], ["We are in a good position to be your sole agent.", "我们有良好的条件成为贵公司的独家代理。"], ["We require the agency in our market for your precision apparatus.", "我们要求在我们的市场代理贵公司的精密仪器。"], ["We hope that you will appoint our company as the sole distributor in Japan.", "我们希望贵公司指定我们公司为贵公司在日本的独家经销商。"], ["You can entrust us with the sole agency for your shirt in our country.", "你们可以委托我们作为贵公司衬衫在我国的独家代理商。"], ["We ask to be the sole agent for your clock in our territory.", "我们要求成为贵公司钟表在我国的独家代理商。"], ["We’d appreciate very much if you could give us the opportunity to act as your agent in this city.", "如果贵公司能给我们机会在本市担任你们的代理，我们将不胜感激。"], ["We can represent your chemical products if you agree.", "如果贵公司同意，我们可以代理贵公司的化工产品。"], ["We’d like to offer our service in the sale of your refrigerators.", "我们愿意在销售贵公司冰箱方面提供服务。"], ["We shall be very much pleased to act as your sole agent in China for your products.", "我们将非常高兴担任贵公司产品在中国的独家代理。"], ["We are able to work as your sole agent because we have local resources and wide connections.", "我们能够担任贵公司的独家代理，因为我们有本地资源和广泛人脉。"], ["We can be a good agent because we have a group of well-trained salesmen.", "我们可以成为好的代理商，因为我们有一支训练有素的销售人员队伍。"], ["If we may have the honor to act as your sole agent in the sale of handicrafts in our territory. No doubt such cooperation will do good to expand our mutual trade.", "如果我们有幸成为贵公司手工艺品在我们地区的独家代理商，这种合作无疑将有利于扩大我们双方的贸易。"], ["If you can sign a sole agency agreement with us, we'll double our turnover.", "如果贵公司与我们签订独家代理协议，我们的营业额将翻倍。"], ["If you make us your agent in China, we will try our best to promote and publicize your products.", "如果贵公司让我们成为你们在中国的代理，我们将尽全力推广和宣传你们的产品。"], ["We have many advantages to act as your sole agent.", "我们在担任贵公司独家代理方面有许多优势。"], ["We have sufficient business-developing abilities to be your sole agent.", "我们有足够的拓展业务能力来担任贵公司的独家代理。"], ["We have enough positive experiences to act as your sole agent.", "我们有足够的积极经验来担任贵公司的独家代理。"], ["We trust that our experiences in foreign trade marketing will entitle us to your confidence.", "我们相信我们在对外贸易营销方面的经验将使贵公司信任我们。"], ["We believe that many years of our experiences in international trade will undoubtedly meet your requirement.", "我们相信我们多年的国际贸易经验无疑能满足贵公司的要求。"], ["The salesmen in our company are well-trained and have rich business-developing experience.", "我们公司的销售人员训练有素，有丰富的拓展业务经验。"], ["It is our hope that after knowing our sales ability you will consider granting us the exclusive selling right for your portable cassette recorders.", "我们希望在你们了解我们的销售能力后，能考虑授予我们销售贵公司便携式卡带录音机的独家经营权。"], ["We have 30 years' experience in agency and we believe that we could work very satisfactorily in promoting the sales of your products.", "我们有 30 年的代理经验，我们相信在推销贵公司产品方面能够做得非常令人满意。"], ["We can assure you that we are well-experienced in this line.", "我们可以向你方保证我们在这一行经验丰富。"], ["With our rich experience in marketing your products in our city, we have the ability to increase the turnover to 50,000 $.", "凭借我们在本市推销贵公司产品的丰富经验，我们有能力将营业额提高到 50,000 美元。"], ["Our usual terms of payment are by confirmed, irrevocable letter of credit in our favour, reaching us one month ahead of shipment.", "我们通常的付款条件是凭以我方为受益人的保兑的、不可撤销的信用证付款，信用证在装运前一个月开到我方。"], ["We proposed to pay by 30 d/s.", "我们提议 30 天期汇票付款。"], ["The terms of payment we wish to adopt are confirmed and irrevocable letter of credit.", "我们希望采用的付款条件是保兑的、不可撤销的信用证。"], ["We should like to advise you that payment by collection is acceptable.", "我们想告知您，托收付款是可以接受的。"], ["We would prefer you to pay in US dollars.", "我们希望您用美元付款。"], ["According to the contract, after receipt of the preliminary shipping advice, you are kindly requested to open with the Bank of China the relative L/C in our favour within ten days.", "根据合同，在收到初步装船通知后，请你方在十天内通过中国银行开具以我方为受益人的相关信用证。"], ["Payment of the purchase is to be effected by an irrevocable letter of credit in our favour, payable by draft at sight in pounds sterling in London.", "货款用我方为受益人的不可撤销信用证支付，在伦敦以英镑即期汇票支付。"], ["We don’t accept payment in US dollars. Please conclude the business in terms of Swiss francs.", "我们不接受美元付款。请用瑞士法郎进行交易。"], ["We require payment by L/C to reach us one month prior to the time of shipment.", "我们要求信用证在装运期前一个月开到我方。"], ["We require immediate payment upon presentation of shipping documents.", "我们要求在提交装船单据时立即付款。"], ["Payment by irrevocable letter of credit is convenient for us and we shall draw a 60-d/s bill in your bank.", "不可撤销信用证付款对我们来说很方便，我们将向你方银行开具 60 天期汇票。"], ["We will draw you a documentary draft at sight through our bank on collection basis.", "我们将通过我方银行以托收方式向你方开具即期跟单汇票。"], ["Our terms of payment are 30-day credit period, not 60-day credit. It’s customary.", "我们的付款条件是 30 天信用期，不是 60 天信用期，这是惯例。"], ["As usual, we should require of you an L/C to be issued through a first-rate bank.", "像往常一样，我们要求你方通过一家一流银行开具信用证。"], ["It would be advisable for you to establish the covering L/C as early as possible enable us to effect shipment in due time.", "你方尽早开立相关信用证对我们在规定时间内装运货物是明智之举。"], ["We propose paying by TT when the shipment is ready.", "我们建议在货物备好待运时用电汇付款。"], ["We regret having to inform you that we cannot accept payment by D/P.", "我们遗憾地不得不通知您，我们不能接受付款交单。"], ["We regret to say that we are unable to consider your request for payment under D/A terms.", "我们遗憾地说，我们不能考虑你方承兑交单付款的请求。"], ["You can pay for all or part of the equipment and technology purchased from us in resultant products.", "你可以用产品来支付从我们这儿购买的全部或部分设备和技术的款项。"], ["Since you are not short of cash, we can arrange for your payment over 2 months without charges of any kind.", "既然你们不缺钱，我们可以安排你们在两个月内付款，不收取任何费用。"], ["As a special case, we may consider accepting your payments by D/P.", "作为一种特殊情况，我们可以考虑接受你们付款交单的付款方式。"], ["If the amount of each transaction is below $500, we agree to D/A 30 days terms.", "如果每笔交易金额低于 500 美元，我们同意 30 天承兑交单条件。"], ["We could grant you the favourable terms of payment as D/A 45 days after sight.", "我们可以给予你们见票后 45 天承兑交单的优惠付款条件。"], ["In view of the small amount of this transaction, we are prepared to accept payment by D/P at sight.", "鉴于这笔交易金额较小，我们准备接受即期付款交单。"], ["D/P or D/A is only accepted if the amount involved for each transaction is less than ￡1,000.", "只有每笔交易金额低于 1000 英镑时，付款交单或承兑交单才会被接受。"], ["We request a 10% payment at the time of ordering. The remaining amount must be paid within 60 days.", "我们要求在订货时支付 10%，其余款项必须在 60 天内付清。"], ["We can only accept 20% cash payment in local currency. The other 80% by L/C should reach us 15 to 30 days before the delivery.", "我们只能接受 20% 以当地货币支付的现金，其余 80% 应以信用证支付，信用证应在交货前 15 至 30 天开到我方。"], ["If the payment is made by installments, the annual interest is calculated by 6% and paid off at the end of each year.", "如果是分期付款，年利率按 6% 计算，并在每年年底结清。"], ["Full payments must be made within 60 days.", "全部款项必须在 60 天内付清。"], ["The telegraphic transfer shall reach the Bank of China at least five days before the delivery date of vessel.", "电汇应至少在船舶交货日期前五天到达中国银行。"], ["The letter of credit for each order shall reach us 30 days.", "每笔订单的信用证应在 30 天内开到我方。"], ["5-20 days prior to the date of delivery, you should pay against the presentation of the draft on the opening bank.", "在交货日期前 5-20 天，你方应凭向开证行开具的汇票付款。"], ["The payment shall be made by telegraphic transfer to the Bank of China, Head office, Beijing, China, for our account, within five business days after the contract signature date.", "付款应在合同签订之日起五个工作日内以电汇方式付至我们在中国北京的中国银行总行账户。"], ["Advance payment of 25% of the contract value shall be paid within 30 days of the date of signing the contract.", "合同金额 25% 的预付款应在合同签订之日起 30 天内支付。"], ["The payment shall be made by five annual installments of 20% each.", "付款应分五年支付，每年支付 20%。"], ["We require full payment within 45 days with a 5% discount for cash payment in advance.", "我们要求在 45 天内全额付款，如提前现金付款可享受 5% 的折扣。"], ["The total amount must be paid in full upon receipt of the shipping documents.", "收到装船单据后须全额付款。"], ["You are requested to pay $5,000 as a down payment.", "要求你方支付 5000 美元作为定金。"], ["Ten percent of the contract value shall be paid in advance by cash, and 90% by sight draft drawn under an L/C.", "合同金额的 10% 应以现金提前支付，90% 凭信用证开具的即期汇票支付。"], ["Please insure for us these products at invoice value plus 10% (at 110% of the invoice value).", "请按发票金额的 110%（即发票金额加 10%）为我们的这些货物投保。"], ["We’d like to cover our ordered goods against WPA for 120% of the invoice value according to our usual practice.", "按照惯例，我们想为我们订购的货物按发票金额的 120% 投保水渍险。"], ["Please cover us for the cargo listed on the attached sheet.", "请为我们附上清单所列货物投保。"], ["For this consignment, we shall cover WPA and risk of breakage for 110% of the invoice value.", "对于这批货物，我们将按发票金额的 110% 投保水渍险和破损险。"], ["Our company will insure against all risks for 110% of the invoice value.", "我们公司将按发票金额的 110% 投保一切险。"], ["Please insure the electric fans at 120% of the invoice value.", "请按发票金额的 120% 为电风扇投保。"], ["The machines are to be insured against all risks.", "这些机器要投保一切险。"], ["We only cover FPA and war risk.", "我们只保平安险和战争险。"], ["There are no delicate goods that can be damaged on the voyage. FPA will be good enough.", "在航行中没有易受损的精致货物，所以平安险就足够了。"], ["Our goods are very valuable, so I want to insure against all risks.", "我们的货物非常贵重，所以我要投保一切险。"], ["We’d like to get a policy for total loss only for these goods.", "我们想为这批货物投保全损险。"], ["I’d like to get a comprehensive insurance policy. That way, we will be covered for any kind of loss or damage.", "我想获得一份综合险保险单，这样我们就能对任何种类的损失或损坏都有保障。"], ["I’m afraid that WPA coverage is too narrow for a shipment of this nature. Please extend the coverage to include TPND.", "恐怕对于这种性质的货物，仅水渍险的保障范围太窄了。请将保险范围扩大到包括盗窃和提货不着险。"], ["Would you insure our goods to be shipped from Shanghai to Lisbon next month?", "你会为我们下个月从上海运往里斯本的货物投保吗？"], ["Can you cover our goods against breakage?", "你能为我们的货物投保破损险吗？"], ["We should be glad if you would provide cover of $390,000 on computers, in transit from Tokyo to Beijing.", "如果您能为我们从东京运往北京的计算机提供 390,000 美元的保险，我们将很高兴！"], ["Please insure us against all risks $300,000 value of 5,000 sets of “Butterfly” sewing machines, sailing for New York.", "请为我们运往纽约的价值 300,000 美元的 5,000 套 “蝴蝶” 牌缝纫机投保一切险。"], ["Please insure for me against all risks 200 pieces of high-quality furniture valued $20,000.", "请为我价值 20,000 美元的 200 件高质量家具投保一切险。"], ["We wish to insure against all risks for the sum of $1,500 on 3 cases glassware.", "我们希望为 3 箱玻璃器皿按 1,500 美元的金额投保一切险。"], ["We shall shortly be making regular shipments of leather goods to Canada, and shall be glad if you will issue an all risks marine insurance policy for $70,000 to cover these shipments.", "我们不久将定期向加拿大发运皮革制品，如果您能为这些货物开具一份金额为 70,000 美元的海运一切险保险单，我们将很高兴！"], ["Please give us the policy rates for FPA coverage and for WPA coverage.", "请给我们平安险和水渍险的保险费率。"], ["We require the current insurance rates for land transportation.", "我们需要当前陆地运输的保险费率。"], ["I have some glassware to be shipped to Hong Kong. What risks should I cover?", "我有一些玻璃器皿要运往香港。我应该投保什么险？"], ["What is the insurance premium for these goods?", "这些货物的保险费是多少？"], ["We need to send a shipment to England. We want to find out about your marine insurance.", "我们有一批货物要运往英国。我们想了解一下你们的海运保险。"], ["Please let us know the premium of breakage.", "请告诉我们破损险的保险费。"], ["What kind of insurance do you usually provide?", "你们通常提供哪种保险？"], ["What kind of insurance can you suggest for these goods? We don’t want to take the risk of losing money because of under-insurance.", "对于这些货物，你建议投哪种保险？我们不想因为保险不足而承担赔钱的风险。"], ["I have a batch of glassware to be shipped in the fourth quarter, but I don’t know what risks should be covered. I would like to know some details and your advice of course will be highly appreciated.", "我有一批玻璃器皿将在第四季度装运，但我不知道应该投保哪些险。我想了解一些细节，当然，非常感谢您的建议。"], ["If we insure against free particular average, can you compensate us for all the losses if the ship sinks or burns, or gets stuck or runs aground?", "如果我们投保平安险，在船只沉没、起火、搁浅或触礁的情况下，你们能否赔偿我们所有损失？"], ["Does your company cover all kinds of risks for transportation by sea, land and air?", "贵公司对海运、陆运和空运的所有风险都承保吗？"], ["We have insured the shipment for 30% of the invoice value, but the premium for the difference between 30% and 110% should be your account.", "我们已按发票金额的 30% 为这批货物投保，但 30% 与 110% 之间差额的保险费应由你方承担。"], ["We have arranged insurance on your consignment of electric motor cars to be shipped in these ten days.", "我们已为你方十天内发运的电动汽车货物安排了保险。"], ["We may cover the inland insurance on your behalf, but you will pay the additional premium.", "我们可以代你方投保内陆险，但额外的保险费将由你方支付。"], ["We can insure the porcelain vases on your behalf, but at a rather high premium and all the additional premium will be for your account.", "我们可以代你方为瓷花瓶投保，但保险费相当高，所有额外的保险费将由你方承担。"], ["We shall insure the goods for your behalf.", "我们将代你方为这批货物投保。"], ["We have covered insurance on these goods for 110% above the invoice value against all risks.", "我们已按发票金额加 10% 为这些货物投保了一切险。"], ["We shall effect the insurance of the goods for 110% of their CIF value.", "我们将按货物的到岸价格的 110% 为这批货物投保。"], ["We have effected marine insurance on your behalf for the gross amount of the invoice plus 10%.", "我们已代你方按发票总金额加 10% 办理了海运保险。"], ["The marine insurance shall be covered by us.", "海运保险将由我方投保。"], ["If cartons are used, please put each chemical in strong polythene bags to ensure protection from dampness.", "如果使用纸盒包装，请将每种化工产品放在结实的塑料袋中，以确保防潮。"], ["Cases must have an inner lining of stout, water-resistant paper.", "箱子必须有结实的防水纸做内衬。"], ["We do not object to packing in cartons, provided the flaps are glued down and the cartons secured by metal bands.", "我们不反对用纸箱包装，前提是箱盖要粘牢，并且纸箱要用金属带加固。"], ["Packing in sturdy wooden cases is essential. Cases must be nailed and secured by overall metal strapping.", "必须用坚固的木箱包装。箱子必须钉牢，并整体用金属带加固。"], ["I would suggest you strengthen the carton with double straps.", "我建议你们用双道带子加固纸箱。"], ["As the goods will probably be subject to a thorough customs examination, the cases should be of a type which can be easily made fast again after opening.", "由于货物可能会受到海关的彻底检查，箱子应采用打开后能容易重新密封的类型。"], ["To avoid pilferage, we hope that the goods will be packed in wooden cases instead of in cartons as the cartons are easier to be cut open.", "为了避免盗窃，我们希望货物用木箱包装，而不是纸箱，因为纸箱更容易被割开。"], ["We want the machine to be packed each in wooden case supported with soft materials to ensure that the machines thus packed will not shift inside the cases.", "我们希望每台机器都用木箱包装，箱内用柔软材料支撑，以确保这样包装的机器在箱内不会晃动。"], ["The green beans can be supplied in bulk or in gunny bags.", "青豆可以散装供应，也可以用麻袋供应。"], ["Please see to it that each carton is properly sealed, with a fireproof lining inside.", "我们的包装足够坚固，在正常情况下能承受碰撞和粗暴搬运。"], ["The cases used for packing our transistor radios are light but strong.", "用于包装我们晶体管收音机的箱子轻便但坚固。"], ["The export cases used to pack the goods are strong enough to protect the instruments.", "用于包装货物的出口箱足够坚固，可以保护这些仪器。"], ["The cartons lined with plastic sheets are waterproof.", "衬有塑料薄膜的纸箱是防水的。"], ["We plan to use cardboard boxes with iron straps for reinforcement.", "我们打算使用用铁带加固的纸板箱。"], ["Our strip scissors are packed in boxes of one dozen each, 200 boxes to a wooden case.", "我们的条形剪刀每盒一打，200 盒装一木箱。"], ["We'll pack them 10 dozen to one carton, gross weight around 25Kg a carton.", "我们将每箱装 10 打，每箱毛重约 25 公斤。"], ["Our export fruit knives are packed in boxes of 100 dozen each.", "我们出口的水果刀每箱装 100 打。"], ["The packing of our men's shirts is each in a polybag, 5 dozen to a carton lined with waterproof paper and bound with two iron straps outside.", "我们男式衬衫的包装是每件装一个塑料袋，5 打装一箱。箱子内衬防水纸，外用两道铁箍捆扎。"], ["Our cotton prints are packed in cases lined with kraft paper and waterproof paper, each consisting of 30 pieces with 5 colors for one design.", "雪茄每小包 5 支，每纸盒 20 包，每个纸板箱装 44 个纸盒。"], ["These cartons are well protected against moisture by plastic lining.", "这些纸箱因有塑料衬里而有很好的防潮性能。"], ["All the goods will be packed according to the special way you require.", "所有货物都将按照贵方要求的特殊方式包装。"], ["As requested, the shirts will be packed in waterproof material.", "按照要求，衬衫将用防水材料包装。"], ["We plan to use cardboard or plastic cartons for the outer packing.", "我们计划用纸板箱或塑料箱作外包装。"], ["Your goods will be packed in wooden cases with tin-lining and iron hoops.", "贵方货物将用内衬锡板、外用铁箍加固的木箱包装。"], ["The goods we packed in new and sound jute bags, each containing about 200 pounds.", "货物用崭新且结实的麻袋包装，每袋约重 200 磅。"], ["The cartons are well protected against moisture by polythene sheet lining.", "纸箱因有聚乙烯薄膜衬里而有很好的防潮性能。"], ["If the goods are packed in cartons, any traces of pilferage will be in evidence, therefore the insurance company may be made to pay the necessary compensation for such losses.", "如果货物用纸箱包装，任何盗窃痕迹都会很明显，因此保险公司可能会对这种损失支付必要的赔偿。"], ["Such packing has also been accepted by our insurance company for WPA and TPND.", "这种包装在我们投保水渍险和偷窃提货不着险时也已得到我们保险公司的认可。"], ["The packages should be marked with the same numbers as given on the order sheet.", "包装上应标注与订单上相同的编号。"], ["As regards markings, please note that the port of destination, Shanghai, should be clearly stenciled on each case with the case number for easy identification.", "关于标记，请留意每个箱子上都应清楚地印上目的港（上海）和箱号，以便于识别。"], ["As these machines are precision instruments which cannot stand rough handling, the wording “Handle with Care” should be also marked on each case.", "由于这些机器是精密仪器，经不起粗暴搬运，每个箱子上也应该标上 “小心轻放” 字样。"], ["Please see that the cases are marked “Fragile” or “handle with care”.", "请注意确保箱子上标有 “易碎品” 或 “小心轻放” 的标记。"], ["Port of destination, package number, gross and net weights, measurement and shipping mark shall be stenciled conspicuously on each package.", "在每件货物上应醒目地刷明目的港、件号、毛重和净重、尺码及唛头。"], ["For dangerous and poisonous cargo, the nature and the generally adopted symbol shall be marked conspicuously on each package.", "对于危险有毒货物，其性质和通用标志应在每件货物上醒目地标注。"], ["Please mark the packages with the same lot numbers as given on the order sheet in order to avoid being mixed up.", "请在货物包装上标注与订单上相同的批号，以防混淆。"], ["Every package shall be marked “CCD” in diamond and the package number.", "每件货物的包装上都应标有内有 “CCD” 的菱形图案和件号。"], ["Please mark the bales with your company’s initials in a diamond.", "请在货包上用菱形框标注贵公司名称的首字母。"], ["Correct and distinct marking for the outside containers is absolutely necessary.", "外包装上的标记必须绝对正确、清晰。"], ["The cartons are comparatively light, and therefore easy to handle.", "纸箱相对较轻，因此便于搬运。"], ["It is our usual way to pack these goods in cartons.", "我们通常用纸箱包装这些货物。"], ["Cartons are quite fit for ocean transportation, and they are extensively used in our shipments to other continental ports to the entire satisfaction of our clients.", "纸箱非常适合海运，在我们运往其他大陆港口的货物中广泛使用，我们的客户都非常满意。"], ["Cartons are more convenient to handle in the course of loading and unloading.", "在装卸过程中，纸箱更便于搬运。"], ["We would like to inform you that we used to pack our scissors in wooden cases but after several trial shipments in carton packing, we found our cartons just as seaworthy as wooden cases.", "我们想告知您，我们过去常用木箱包装剪刀，但经过几次试用纸箱包装运输后，我们发现纸箱和木箱一样适合海运。"], ["Cartons are less expensive, lighter to carry and cost lower freight.", "纸箱价格较低、便于搬运且运费也较低。"], ["We prefer carton packing to wooden case packing.", "我们更喜欢纸箱包装，而不是木箱包装。"], ["Our cartons for canned food are not only seaworthy, but also strong enough to protect the goods from damage.", "我们用于包装罐头食品的纸箱不仅适合海运，而且足够坚固，可以保护货物不受损坏。"], ["Cartons are not likely to be mixed with wooden cases while in transport or storage, so that the rate of breakage is lower than that of wooden cases.", "在运输或储存过程中，纸箱不太可能与木箱混在一起，所以其破损率比木箱低。"], ["Shirts packed in such cartons are not so susceptible to damage by moisture as those packed in wooden cases.", "用这种纸箱包装的衬衫不像用木箱包装的那样容易受潮损坏。"], ["All our wooden cases are well sealed. They are not easily subject to sweat damage.", "我们所有的木箱密封性都很好，不容易受潮损坏。"], ["We believe that your clients will find the improved packing satisfactory and your fears unwarranted.", "我们相信您的客户会对改进后的包装满意，您的担忧是没有必要的。"], ["We hope that you will agree to our opinion and accept our carton packing.", "我们希望您能同意我们的意见并接受我们的纸箱包装。"], ["The weight and measurement of each case are clearly marked on every case.", "每个箱子上都清楚地标明了重量和尺寸。"], ["You will know that our packing has been greatly improved and we are sure that they will meet with the satisfaction of the clients.", "您会发现我们的包装有了很大改进，我们确信它们会让客户满意。"], ["The dimension of the cases are 7cm high, 30 cm wide and 50 cm long with a volume of about 0.026 cubic meter. The gross weight is 23.5Kg.", "箱子的尺寸是高 7 厘米、宽 30 厘米、长 50 厘米，体积约为 0.026 立方米，毛重 23.5 公斤。"], ["They save shipping space and facilitate the storage and distribution of the goods.", "它们节省了运输空间，便于货物的储存和分发。"], ["In addition to the gross, net and tare weights, the wording “Made in the People’s Republic of China” is also stenciled on the package.", "除了毛重、净重和皮重外，“中华人民共和国制造” 字样也印在包装上。"], ["We have made a number of improvements in packaging and presentation. Please set your mind at ease.", "我们在包装和外观方面做了许多改进，请放心。"], ["Our containers are in complete conformity to the specification laid down by the International Standardization Organization.", "我们的集装箱完全符合国际标准化组织规定的规格。"], ["We would like to inform you that the goods were already shipped out on the 8th of May.", "我方想告知贵方，货物已于 5 月 8 日装船运出。"], ["We have the pleasure to inform you that we have shipped the goods on “Pacific Bear” which left here today.", "我方很高兴地通知贵方，我们已将货物装上 “太平洋熊” 号轮船，该船今天已启航。"], ["We wish to inform you that we have shipped the goods on “Shanghai” according to your instructions of August 5.", "我方想通知贵方，我们已按照贵方 8 月 5 日的指示将货物装上 “上海” 号轮船发运。"], ["We wish to advise you that we have shipped you today by S.S. “Tokyo Maru”, 50 cases of carbon paper.", "我方想通知贵方，我们今天已用 “东京丸” 号轮船给贵方运去 50 箱复写纸。"], ["We take pleasure in notifying you that the goods under S/C 456 have been dispatched by M/V “Greenwood” sailing on May 5 for Hong Kong.", "我们很高兴地通知贵方，456 号售货确认书项下的货物已由 “格林伍德” 号轮于 5 月 5 日运往香港。"], ["The shipment of chemical fertilizer under Contract No 2346 will be effected by S.S. “Calchas”, which is scheduled to leave here on 6th July.", "2346 号合同项下的化肥将由 “卡尔卡斯” 号轮船装运，该轮计划于 7 月 6 日从这里启航。"], ["We are pleased to advise you that 100 dozen shirts under order KAB/2004 have been shipped per S.S. “Fengqing”.", "我们很高兴地通知贵方，KAB/2004 号订单下的 100 打衬衫已由 “风庆” 号轮装运。"], ["We expect to ship the outstanding contracts before the end of July.", "我们预计在 7 月底之前将尚未执行的合同中的货物装运。"], ["We are pleased to inform you that we have shipped 2,000 air conditioners you ordered on board S.S. “Asia” which sails for your port tomorrow.", "我们很高兴地通知贵方，我们已将贵方订购的 2000 台空调装上 “亚洲” 号轮，该轮明天驶往贵方港口。"], ["Your order No 53 will be shipped by SS. “Pearl” early next month.", "贵方第 53 号订单的货物将于下月初由 “珍珠” 号轮装运。"], ["Please effect shipment with the least possible delay upon receipt of the letter of credit in your favour established by us.", "请在收到我方开立的以贵方为受益人的信用证后，尽快安排装运，尽量减少延误。"], ["We hope that the goods will arrive in time for the new year rush.", "我们希望货物能在新年购物热潮时及时运达。"], ["We hope that you will make all necessary arrangements to deliver the goods on time.", "我们希望贵方将做好所有必要的安排以便按时交货。"], ["Could you possibly make your delivery date not later than May? You see, June is the right season for the goods. If they arrive later than June, we will miss the selling season.", "贵方的交货日期能否不迟于 5 月？要知道，6 月是这种货物的销售旺季。如果货物迟于 6 月到达，我们将错过销售季节。"], ["Can you effect shipment of the order in October?", "贵方能否在 10 月装运这笔订单的货物？"], ["Is it possible for the goods to be landed at Dalian in early December?", "货物有没有可能在 12 月初运抵大连？"], ["We need the products in less than one month in order to get ready for the selling season.", "为了为销售季节做好准备，我们需要在不到一个月的时间内拿到货物。"], ["Please send us the shipment by train.", "请通过火车给我们发货。"], ["Please ship the goods by the first available steamer early next month.", "请在下个月初用第一艘可订到舱位的轮船装运货物。"], ["As we are in urgent need of the goods, we would like you to ship them by air freight.", "由于我们急需这批货物，希望贵方通过空运发货。"], ["We might refuse the shipment if it doesn’t arrive on time.", "如果货物不能按时到达，我们可能会拒收。"], ["We must insist on delivery within the time contracted and reserve the right to reject the goods if we fail to receive the goods before this week.", "我们坚持要求在合同规定的时间内交货，如果本周前我们未能收到货物，我们保留拒收货物的权利。"], ["We regret to say that unless you are able to give us an assurance of delivery within the next two weeks, we shall be obliged to cancel the order.", "我们遗憾地说，除非你方能够保证在接下来的两周内交货，否则我们将不得不取消订单。"], ["If shipment is too late, we’ll be forced to withdraw the contract.", "如果装运太迟，我们将被迫撤销合同。"], ["If you still delay delivery, I’ll have to cancel the order.", "如果你方仍延迟交货，我将不得不取消订单。"], ["If you can’t effect delivery within the stipulated time, we will have to lodge a claim against you for the loss and reserve the right to cancel the contract.", "如果贵方不能在规定时间内交货，我们将不得不向贵方提出索赔，并保留取消合同的权利。"], ["If you fail to deliver the goods according to the agreed time, you should indemnify us for all losses and corresponding expenses.", "如果贵方未能按约定时间交货，贵方应赔偿我们所有的损失和相应的费用。"], ["If there is still no information from you about the expedition of shipment by the end of this month, we’ll be forced to cancel the contract and reserve the right to lodge a claim against you for the loss.", "如果到本月底仍没有你方发货进度的消息，我们将被迫取消合同，并保留向你方索赔损失的权利。"], ["We wish to point out that if you fail to effect shipment within the time specified, we shall not be able to fulfill the contract with our client.", "我们想指出的是，如果贵方未能在规定时间内装运，我们将无法履行与我们客户的合同。"], ["We would like to emphasize that any delay in shipping our booked order will undoubtedly involve us in no small difficulty.", "我们想强调的是，我们所订货物的装运有任何延误，无疑会给我们带来不小的困难。"], ["A close inspection and a careful test by the China National Import & Export Commodity Inspection Bureau showed that some amplifiers are of inferior quality.", "经中国国家进出口商品检验局仔细检查和认真测试，发现一些放大器质量低劣。"], ["We find that the quality, quantity and weight of the goods are not in conformity with those stipulated in this contract after re-inspection by the China Commodity Inspection Bureau. We are now returning the goods to you and lodge claims against you for compensation of losses.", "经中国商品检验局复验后，我们发现货物的质量、数量和重量与本合同规定不符。我们现将货物退回给你们，并向你们提出索赔，要求赔偿损失。"], ["The survey has revealed that the damage to the goods is attributable to rough handling.", "检验表明货物的损坏是由于野蛮装卸造成的。"], ["The surveyor’s report indicates that there has been some serious damage to some of the goods.", "检验员的报告显示部分货物受到了严重损坏。"], ["On the basis of clause 5 of the contract, we place our claims before you as follows.", "根据合同第 5 款，我们向你们提出如下索赔。"], ["It is now over two months since we sent in the order for Tape Recorders, yet we are still awaiting delivery. You should know that the delivery date is very important to us.", "我们订购盒式录音机的订单已经发出两个多月了，但我们仍在等待交货。你应该知道交货日期对我们非常重要。"], ["Please take the matter up at once and see to it that the goods are delivered without further delay.", "请立即处理此事，确保货物能毫不延误地交付。"], ["Please get the goods dispatched with the least possible delay.", "请尽快发货，尽量减少延误。"], ["I wonder if you could check the order I placed with you last month. It hasn’t arrived yet.", "不知你能否查一下我上个月向你们订的货，这批货还没到呢。"], ["Please do your utmost to hasten shipment.", "请尽最大努力加快装运。"], ["We are much in need of the goods. Please expedite shipment as soon as possible.", "我们非常需要这批货物，请尽快发货。"], ["We wish to call your attention that up to the present moment no news has come from you about the shipment. Our users are in urgent need of the machines and are pressing us for an early delivery.", "我们希望引起你方注意，到目前为止，我们尚未收到你方关于货物装运的任何消息。我们的用户急需这些机器，并催促我们早日交货。"], ["As our customers are in urgent need of the contracted machines, we hope you can assure us of an early shipment.", "由于我们的客户急需所订的机器，我们希望你方能确保早日发货。"], ["I want to know why our alloy inserts haven’t arrived yet. Our customers are in urgent need of them.", "我想知道为什么我们的合金插件还没到货，我们的客户急需它们。"], ["We hope that there will be no delay in shipment any longer.", "我们希望装运不要再拖延了。"], ["You should send one copy of the shipping documents to the port of destination together with the shipment.", "装船时，贵方应将一份货运单据副本随货一起寄往目的港。"], ["When all of the details of the shipment are finished, please send us the shipping documents that we will need to get the shipment.", "在完成装船的所有细节后，请将我们提货所需的货运单据寄给我们。"], ["The delivery will be arranged and the shipping charges will be prepaid by you, we will repay the shipping charges against original receipt.", "发货将由贵方安排，运费将由贵方预付，我们将根据原始收据向贵方支付运费。"], ["You should guarantee that the commodity is in conformity to all respects with the quality, specifications and performance as stipulated in this contract.", "贵方应保证商品在所有方面都符合本合同规定的质量、规格和性能。"], ["We prefer direct sailings, as transshipment adds to the risk of damage and also delays arrival to some extent.", "我们倾向于直运，因为转运会增加货物受损的风险，并且在一定程度上会延误货物到达。"], ["The shipment will be made in three equal monthly installments, beginning from next month.", "货物将从下个月起分三个月等额装运。"], ["We trust that the goods will reach you in perfect condition.", "我们相信货物将完好无损地到达贵方。"], ["We trust the consignment will reach you safely and open up to your satisfaction.", "我们相信货物将安全到达贵方，并令贵方满意。"], ["We have dispatched your order for Indian rugs which are scheduled to arrive at your port next Friday.", "我们已发运贵方订购的印度小地毯，预计下周五抵达贵方港口。"], ["For shirts under contract No 60, we have booked space on SS. “Eagle” due to arrive in your city around the beginning of next month.", "对于 60 号合同项下的衬衫，我们已在 “鹰” 号轮上订了舱位，预计下月初抵达贵方城市。"], ["We should settle the dispute through negotiations without resorting to legal proceeding.", "我们应该通过协商来解决争议，而不诉诸法律程序。"], ["We prefer to resolve disputes by amicable, non-binding conciliation between two parties.", "我们更倾向于双方通过友好、无约束力的调解来解决争议。"], ["As a matter of fact most disputes can be settled in a friendly way, with a view to developing a long-term relationship.", "事实上，着眼于发展长期关系，大多数争议都可以友好的方式解决。"], ["All disputes in connection with this contract shall be settled through friendly negotiation.", "所有与本合同有关的争议都应通过友好协商解决。"], ["Personally I should say it's so much better to resolve the dispute through friendly negotiations between ourselves.", "我个人认为，我们自己通过友好协商来解决争议要好得多。"], ["Friendly negotiation is the best way to settle the dispute between us if there is any.", "如果我们之间有任何争议，友好协商是解决争议的最佳方式。"], ["Where do you want to have arbitration held?", "你们希望在哪里进行仲裁？"], ["As far as the place for arbitration is concerned, the customary practice is to hold arbitration in the country of the defendant.", "就仲裁地而言，惯例是在被告所在国进行仲裁。"], ["If we submit the case for arbitration, the place for arbitration is to be in Japan and if you submit the case for arbitration, the place for arbitration is to be in China.", "如果我们提交仲裁，仲裁地应在日本；如果你们提交仲裁，仲裁地应在中国。"], ["If the buyer is the plaintiff, the arbitration shall take place in Beijing.", "如果买方是申诉人，仲裁将在北京进行。"], ["If any dispute should arise over the inspection, we may submit it for arbitration.", "如果因检验出现任何争议，我们可以提交仲裁。"], ["If you are not prepared to compensate our loss, we suggest that the case be submitted for arbitration.", "如果贵方不准备赔偿我们的损失，我们建议将此案提交仲裁。"], ["The dispute shall be submitted for arbitration by a mutually nominated arbitrator.", "争议应提交由双方指定的仲裁员进行仲裁。"], ["We may discuss to agree upon a temporary arbitral body when needed.", "必要时，我们可以协商成立一个临时仲裁机构。"], ["If no settlement can be reached between the two parties, the case under dispute shall be submitted to the third party accepted by both parties for arbitration.", "如果双方无法达成和解，争议案件应提交给双方都接受的第三方进行仲裁。"], ["In case of any dispute, and no settlement can be reached through friendly negotiations, then we can submit the case to an international arbitration organization for arbitration.", "如果出现争议，且无法通过友好谈判达成一致，我们可以将案件提交给国际仲裁组织进行仲裁。"], ["It's better to submit the case for arbitration to a temporary arbitration court.", "最好将仲裁案件提交给临时仲裁庭。"], ["We think that the court consisting of arbitrators from both sides must be fair and able to handle the dispute without bias or partiality.", "我们认为由双方仲裁员组成的仲裁庭必须公正，能够不偏不倚地处理争议。"], ["Since this dispute is not negotiable, it is necessary to resort to arbitration.", "由于这项争议无法协商解决，有必要诉诸仲裁。"], ["If you don't accept our propositions, we might submit the matter to arbitration.", "如果你们不接受我们的提议，我们可能将此事提交仲裁。"], ["It was found by the inspection that there is a difference of 35 Kg between the actual landed weight and the invoiced weight.", "经检验发现，实际到岸重量与发票重量相差 35 公斤。"], ["The landed goods were quite different from what expected.", "卸货后的货物与我们预期的大不相同。"], ["We find the free acidity exceeds the contract maximum by 0.1%, so we have to ask you to indemnify us for a loss of £5,000.", "我们发现游离酸含量超出合同规定最大值 0.1%，因此我们不得不要求你们赔偿我们 5000 英镑的损失。"], ["The inspection shows that the salt density exceeds at least 4%.", "检验显示盐的浓度至少超出 4%。"], ["This consignment is not up to the standard stipulated in the contract. We are now lodging a claim against you for £2,000.", "这批货物未达到合同规定的标准。我们现在向你们索赔 2000 英镑。"], ["The dried mushroom you sent us are far below the standard stipulated in the contract.", "你们送来的干蘑菇远远低于合同规定的标准。"], ["The quality of your shipment for our order is not in conformity with the specifications, we must therefore lodge a claim against you for the amount of £280,000.", "你们为我们订单所发货物的质量与规格不符，因此我们必须向你们索赔 280000 英镑。"], ["We find the copper wire you supplied is not to the exact specifications of your sample.", "我们发现你们供应的铜线与你们样品的规格不完全一致。"], ["Our customers complain that the goods are much inferior in quality to the samples.", "我们的客户抱怨货物质量比样品差很多。"], ["The quality of the goods you shipped last week is much inferior to that of the goods of our last order.", "你们应该向保险公司索赔。"], ["A thorough examination showed that the broken bags were due to improper packing, for which the suppliers should be held responsible.", "彻底检查表明，包装袋破损是由于包装不当造成的，供应商应对此负责。"], ["As the shipping company is liable for the damage, your claim for compensation should, in our opinion, be referred to them for settlement.", "由于船运公司应对此次损失负责，我们认为你们的索赔应提交给他们解决。"], ["The claim should be referred to the insurance company. We cannot hold ourselves responsible for it.", "这项索赔应提交给保险公司。我们不能对此负责。"], ["Your claim, in our opinion, should be referred to the insurance company, as the mishap occurred after shipment.", "我们认为，你们的索赔应提交给保险公司，因为事故发生在装船之后。"], ["Since the damage was due to the rough handling by the steamship company, you should claim on it for recovery of the loss.", "既然损坏是由于轮船公司的野蛮装卸造成的，你们应该向他们索赔以弥补损失。"], ["You should claim compensation from the shipping company instead of the sellers.", "你们应该向船运公司索赔，而不是向卖方索赔。"], ["We are prepared to make you a reasonable compensation, but not the amount you claimed.", "我们准备向你们作出合理赔偿，但不是你们要求的赔偿金额。"], ["The shortage you claimed might have occurred in the course of transit, which is out of our control.", "你们所声称的短缺可能是在运输过程中发生的，这超出了我们的控制范围。"], ["The shipping documents can prove that the goods, when shipped, were in perfect condition. They must have been damaged en route.", "我们检查了货物内容，发现少了 92 件，其余的也无法使用。"], ["Your shipment of goods has been found short in weight by reinspection.", "经复验，发现贵方所运货物重量不足。"], ["We are now making a claim against you for the ten defective sewing machines.", "我们现在就 10 台有缺陷的缝纫机向贵方提出索赔。"], ["There is a shortage of 1,450 pounds in this shipment.", "这批货物短缺 1450 磅。"], ["On arrival of the shipment, we found at least 50 cases damaged, which made up 20% of the total quantity.", "货物到达时，我们发现至少有 50 箱受损，占总数量的 20%。"], ["We had the material inspected immediately when the goods arrived, and a shortage of 15kg was found.", "货物到达后，我们立即对材料进行了检查，发现短缺 15 公斤。"], ["It was found, much to our astonishment, that nearly 30% of the electronic components were water-stained.", "令我们非常惊讶的是，发现将近 30% 的电子元件有水渍。"], ["You should make amends for the losses by replacing all the defective products and compensating for the business losses we have suffered.", "贵方应该通过更换所有有缺陷的产品并赔偿我们遭受的业务损失来弥补损失。"], ["After the inspection of the goods arrived, we found a shortage of 50MT.", "在对到货的货物进行检查后，我们发现短缺 50 公吨。"], ["Case NO 6 was found to be 3 packages short.", "发现 6 号箱少了 3 包。"], ["We hope indemnification will be made for all expenses incurred.", "我们希望对所有已产生的费用进行赔偿。"], ["On the basis of the survey report, we register our claim with you for $3,000.", "依据检验报告，我们向你们提出 3000 美元的索赔。"], ["You are requested to compensate us for the total loss of sugar at the value of $105 per MT.", "我们要求你们赔偿我们每吨价值 105 美元的糖的全部损失。"], ["We claim compensation of $1,800 for inferiority of quality.", "我们因质量低劣要求赔偿 1800 美元。"], ["We have to file a claim against you to the amount of $7,000 plus inspection fee.", "我们不得不向你们提出索赔，索赔金额为 7000 美元外加检验费。"], ["You should compensate us by 3%, plus the inspection fee.", "你们应赔偿我们 3% 的损失，另外还要承担检验费。"], ["This is a statement of loss and you should indemnify us $2,450.", "这是一份损失清单，你们应赔偿我们 2450 美元。"], ["We are compelled to claim on you to compensate us for the loss, $27,500, which we have sustained by the damage to the goods.", "我们不得不向你们索赔 27500 美元，这是我们因货物受损而遭受的损失。"], ["We found that the quality of the TV sets we received last week is below standard. So we request a 5% allowance.", "我们发现上周收到的电视机质量低于标准，所以我们要求 5% 的赔偿。"], ["We claim an allowance of £230 on account of the quality of this shipment.", "由于这批货物的质量问题，我们索赔 230 英镑。"], ["We have to put in a claim against you for all the losses sustained.", "对于所遭受的一切损失，我们不得不向你们提出索赔。"], ["When taking delivery, we found that the cargo had been seriously wet by fresh water and putrefied. You must compensate us for the loss.", "提货时我们发现货物被淡水严重浸湿并已腐烂。你们必须赔偿我们的损失。"], ["We require you to replace the damaged goods and grant us a special discount of five percent to compensate for the loss.", "我们要求你们更换损坏的货物，并给予我们 5% 的特别折扣以补偿损失。"], ["According to the contract, you are responsible to compensate us for the loss we have suffered.", "根据合同规定，你们有责任赔偿我们所遭受的损失。"], ["We have suffered a loss of 20% on the selling price because of the inferior quality of the products you sent us. You must compensate us for all this.", "由于你们发给我们的产品质量低劣，我们在售价上损失了 20%。你们必须对此全部赔偿。"], ["All expenses including inspection fee and losses arising from the return of the goods and claims should be borne by you.", "所有费用，包括检验费以及因退货和索赔而产生的损失都应由你们承担。"], ["You must hold responsible for all the losses caused by the delay in delivery of the goods.", "你们必须对因货物延迟交付而造成的所有损失负责。"], ["You should take back all the disqualified goods and compensate us for the value of the goods plus all losses sustained due to return of the cargo, such as freight, storage charges, insurance premium, interest, and inspection charges.", "你们应该收回所有不合格货物，并赔偿我们货物的价值以及因退货而遭受的所有损失，如运费、仓储费、保险费、利息和检验费。"], ["We have the right to claim against you for compensation of all losses.", "我们有权向你们要求赔偿所有损失。"], ["The products we received last Monday didn’t agree with the samples and we feel that you should make it up.", "我们上周一收到的产品与样品不符，我们认为你们应该对此进行赔偿。"], ["We accept the claim, but can you tell me how much you want us to compensate you for the loss?", "我们同意理赔，不过你能告诉我你们希望我们赔偿多少损失吗？"], ["We will give your request for claims immediate attention.", "我们会立即关注你们的索赔请求。"], ["We will get this matter resolved as soon as possible and hope to compensate you for your loss to your satisfaction.", "我们会尽快解决这个问题，并希望能让你们满意地赔偿你们的损失。"], ["We’d like to express our sincere apologies for the poor quality of the products.", "我们对产品质量差的问题向你们表示诚挚的歉意。"], ["We regret to hear that the goods you received are not of the quality expected.", "得知你们收到的货物质量未达预期，我们深感遗憾。"], ["The technology we acquire should be truly advanced and appropriate to China’s needs.", "我们所获取的技术应该是真正先进且适合中国需求的。"], ["The technology you transfer to us should enable the venture’s products to be competitive on the international market.", "你们转让给我们的技术应该能使合资企业的产品在国际市场上具有竞争力。"], ["The know-how we import should be directed toward manufacturing products suitable for export.", "我们进口的专有技术应旨在生产适合出口的产品。"], ["The advanced technology we import should improve markedly the quality of existing products.", "我们进口的先进技术应能显著提高现有产品的质量。"], ["The technology provided to the joint venture must be integrated, precise and reliable.", "提供给合资企业的技术必须是完整、精确且可靠的。"], ["The technology we acquire shall enable our products to achieve significant economic results.", "我们所引进的技术应能使我们的产品取得显著的经济效益。"], ["Your technology should be advanced, reliable, and helpful to the development of our export-oriented economy.", "你们的技术应该先进、可靠，并有助于我们外向型经济的发展。"], ["The import know-how should help improve the quality of our products.", "引进的专有技术应有助于提高我们产品的质量。"], ["You should supply us with advanced techniques and modernized management methods.", "你们应该向我们提供先进的技术和现代化的管理方法。"], ["Please provide us with the necessary technical data and, if possible, some drawings connected with the design and building of the new equipment.", "请向我们提供必要的技术数据，如果可能的话，也请提供一些与新设备设计和制造有关的图纸。"], ["We will inform you of the weight, measurements, number of cases, cost of the drawings and other documents seven days before delivering the documents to the airport.", "我们将在把文件送往机场的七天前，告知你们箱子的重量、尺寸、数量、图纸费用及其他文件的情况。"], ["Drawings and technical documents will be sent to you by registered airmail.", "图纸和技术文件将用挂号航空邮件寄给你们。"], ["Expenses for the technology transfer shall be fair and reasonable.", "技术转让费应当公平合理。"], ["The royalty rate shall not be higher than the standard international rate.", "特许权使用费率不应高于国际标准费率。"], ["The technology transfer fee shall be paid in royalties.", "技术转让费应以特许权使用费的形式支付。"], ["The royalty rate shall be 5% of the net sales value of the products.", "特许权使用费率应为产品净销售额的 5%。"], ["The royalty rate shall be calculated on the net sales of the products turned out with transferred technology.", "特许权使用费率应根据运用转让技术生产的产品的净销售额来计算。"], ["You’ll pay for the imported technology in the form of royalties apart from a certain initial down payment.", "除了一定的初始预付款外，你们将以特许权使用费的形式支付进口技术的费用。"], ["We shall pay you 8% on the retail prices of all the goods manufactured with the transferred technology.", "对于用转让技术生产的所有商品，我们将按其零售价的 8% 支付给你们。"], ["We require that at the signature of the technology transfer agreement, you will provide us with the bank guarantee for the transfer of all payments.", "为了我们合资企业的成功，获取有关产品设计和生产过程的信息对我们来说极为重要。"], ["You should give us as soon as possible the blueprint plan for the introduction of the equipment and a report on a survey of the feasibility of the entire plan.", "你们应该尽快给我们提供设备引进的蓝图计划以及整个计划可行性调查的报告。"], ["Please turn over these technical data to our side at the earliest possible time.", "请尽早把这些技术资料转交给我们。"], ["Shall we discuss technology transfer briefly now?", "我们现在简要地讨论一下技术转让问题好吗？"], ["We want to import advanced technology from you in order to compete successfully on the international market.", "为了能在国际市场上成功竞争，我们想从你们那里进口先进技术。"], ["Since the existing know-how transferred by your company will soon become obsolete, we expect that you will continue offering us your improved technological expertise.", "由于贵公司转让给我们的现有专有技术很快就会过时，我们期望你们能继续向我们提供改进后的技术专长。"], ["By advanced technology, we mean both industrial property and know-how.", "说到先进技术，我们指的是工业产权和专有技术。"], ["If the documents you send us cannot be used, or if one item or more mentioned in the packing list should be lacking, you have to send all the documents or the lacking items at your cost, within 45 days from the date you receive the written notice from us.", "如果你们发给我们的文件无法使用，或者缺少装箱单中所列的一项或多项内容，你们必须在收到我们的书面通知之日起 45 天内，自费将所有文件或缺少的物品寄给我们。"], ["If any serious difficulties arise with regard to the working of the engines which we built, and if it is proved that such difficulties are due to any faulty data, drawings or documents you sent us, you would, at your expense, correct such faulty data, drawings or documents.", "如果我们制造的发动机在运转方面出现任何严重问题，并且如果证实这些问题是由你们发给我们的数据、图纸或文件中的错误造成的，你们必须自费更正这些错误的数据、图纸或文件。"], ["If the technical documents provided by you are not applicable to our actual production condition, you are obliged to assist us in modifying the technical documents.", "为此目的而产生的费用将由中方承担。"], ["We will pay all the expenses involved in documentation and transfer of knowledge.", "我们将支付所有涉及文件编制和知识转让的费用。"], ["We will pay all the specialists for their services rendered to us.", "我们将支付所有为我们提供服务的专家的费用。"], ["We hope you will continue offering us improved technology without extra charges.", "我们希望你们能持续向我们提供改进的技术且不收取额外费用。"], ["To help our joint venture, we hope that you would keep supplying us with advanced management techniques and technologies.", "为了帮助我们的合资企业，我们希望你们能持续向我们提供先进的管理技术和其他技术。"], ["We shall help you to update the present and future technology related to the production from time to time.", "我们将不时地帮助你们更新与生产相关的现有和未来技术。"], ["As you know that technology is advancing all the time, we hope that you continue offering us your improved technologies.", "如你所知，技术一直在进步，所以我们希望你们持续向我们提供改进后的技术。"], ["We think that it is better to transfer our knowledge in the form of know-how investment.", "我们认为以专有技术投资的形式转让我们的知识更好。"], ["First let’s start with the delivery of all the drawings, technical data and other documents relating to the engines.", "首先，让我们从交付所有与发动机相关的图纸、技术数据和其他文件开始。"], ["You will undertake the obligations to deliver to us the drawing, information and other data.", "你们将承担向我们交付图纸、信息和其他数据的义务。"], ["We hope that you will provide us with technical training for our staff.", "我们希望你们能为我方员工提供技术培训。"], ["The technical data should be provided in both English and Chinese.", "技术资料应同时提供英文和中文版本。"], ["We require that the technology transferred should be up-to-date and meet international standards.", "我们要求转让的技术必须是最新的，且符合国际标准。"], ["Please ensure that the technical documents are complete and accurate.", "请确保技术文件完整且准确。"], ["We need your technical support during the trial production phase.", "在试生产阶段，我们需要你们的技术支持。"], ["The technology should be easy to learn and operate for our workers.", "该技术应便于我方工人学习和操作。"], ["We expect you to send technical experts to our factory for on-site guidance.", "我们期望你们派遣技术专家到我方工厂进行现场指导。"], ["The warranty period for the technology should be at least two years.", "该技术的保修期至少应为两年。"], ["Please specify the scope of technical service you will provide after the transfer.", "请明确技术转让后你们将提供的技术服务范围。"], ["We need to know the frequency and cost of technical updates.", "我们需要了解技术更新的频率和费用。"], ["I'd like to know something about your foreign trade policy.", "我很想了解有关贵国对外贸易的政策。"], ["It is said that a new policy is being put into practice in your foreign trade.", "据说你们正在实施一种新的对外贸易政策。"], ["Our foreign trade policy has always been based on equality and mutual benefit and exchange of needed goods.", "我们的对外贸易政策一向是以平等互利、互通有无为基础的。"], ["We have adopted much more flexible methods in our dealings.", "我们在具体操作方法上灵活多了。"], ["We have mainly adopted some usual international practices.", "我们主要采取了一些国际上的惯例做法。"], ["You have also made some readjustment in your import and export business, haven't you?", "你们的进出口贸易也有一些调整，对吗？"], ["I'd like to know some information about the current investment environment in your country?", "我想了解一下贵国的投资环境。"], ["We are sure both of us have a brighter future.", "我们相信双方都有一个光明的前景。"], ["We have new methods like compensation trade and joint venture.", "我们有补偿贸易和合资经营这些新方式。"], ["I think a joint venture would be beneficial to us both.", "我认为合资经营对双方都是有利的。"], ["As a joint venture, our corporation has won a prominent position in the fields of home electronics, computers and telecommunications in China.", "作为一家合资企业，我们公司已在中国的家用电子产品、计算机和电信领域占据显著地位。"], ["We are prepared to accept orders for goods with customers’ own trade marks or brand names.", "我们准备接受客户有自己商标或品牌的商品订单。"], ["We have been handling leather shoes and gloves for more than 20 years.", "我们经营皮鞋和手套业务已经 20 多年了。"], ["We have been engaged for two decades in the manufacture of such equipment.", "我们从事这种设备的制造已有 20 年了。"], ["We are delighted to place an order for 5000 pieces of your latest model smartphones at the price specified in your quotation.", "我们很高兴按你方报价订购 5000 部你们的最新型智能手机。"], ["Please confirm your acceptance of our order for 1000 sets of home theater systems, which we hope to receive within three weeks.", "请确认接受我们 1000 套家庭影院系统的订单，我们希望在三周内收到货物。"], ["This is our official order for 2000 pairs of sports shoes, and we trust that the quality will live up to our expectations.", "这是我们 2000 双运动鞋的正式订单，我们相信质量会符合我们的预期。"], ["We would like to order 3000 kilograms of organic coffee beans according to the terms discussed.", "我们想按照讨论的条款订购 3000 公斤有机咖啡豆。"], ["Thank you for your prompt response to our inquiry; here is our order for 500 boxes of luxury chocolates.", "感谢你方对我们询价的及时回复，这是我们 500 盒豪华巧克力的订单。"], ["We hope that you will give us a special discount of 2% if we order more than 10,000 sets.", "如果我们订购超过 10,000 套，希望你给 2% 的特别折扣。"], ["I hope we can cooperate happily.", "希望我们合作愉快。"], ["I hope we can continue our cooperation.", "希望我们能够继续合作。"], ["We sincerely hope that this transaction will turn out to the satisfaction of both parties.", "我们真诚地希望本次交易双方都能满意。"], ["We hope that this market trend will continue.", "希望市场形势能够继续保持。"], ["It is hoped that you will seriously take this matter into consideration and let us have your reply soon.", "希望你认真考虑这个问题，并尽快给我们答复。"], ["We hope that you will deal with our request honestly.", "我们希望你能公正地处理我们的请求。"], ["We hope to receive your immediate answer.", "我们希望能立即收到你的答复。"], ["We are looking forward to having your early reply to this matter.", "我们期待你对此事能尽早回复。"], ["We hope that this dispute can be settled through friendly negotiation without being submitted for arbitration.", "我们希望这次争端能通过友好协商解决，而不提交仲裁。"], ["We look forward to your settlement at an early date.", "我们期待你早日解决（问题或结算）。"], ["This agreement is made both in Chinese and English. The two versions of the agreement shall have equal status in law.", "这份协议有中英文两个版本，两种版本在法律上具有同等地位。"], ["This agreement is drawn up separately in Chinese and in English. Each party holds one original and one duplicate of each language. The two languages are of the same effect.", "该协议分别用中文和英文拟定，每一方持有每种语言的一份正本和一份副本，两种语言具有相同的法律效力。"], ["Both versions of this contract are equally authentic.", "这份合同的两个版本都具有同等的法律效力。"], ["Any amendment of the contract shall come into force only after the written agreement is signed by both of us.", "合同的任何修改只有在我们双方签署书面协议后才生效。"], ["The contract shall become effective as soon as it is signed by both parties.", "合同一经双方签字即生效。"], ["This agreement will remain valid for one year and shall become effective on the date of signing.", "该协议有效期为一年，自签字之日起生效。"], ["We’d like to make the contract to be valid for two years at the beginning.", "我们希望合同从一开始有效期为两年。"], ["I think we'd better make some changes in the wording of this sentence.", "我认为我们最好对这句话的措辞做些修改。"], ["Isn’t it better to word it in this way?", "这样措辞不是更好吗？"], ["I’d like to replace this phrase with “after the date of delivery”.", "我想用 “交货日期之后” 来替换这个短语。"], ["Anything else you want to bring up for discussion?", "你还有什么问题要提出来供双方讨论的吗？"], ["You may rest assured that the shipment will be duly delivered.", "你们尽可放心，我们会按时交货的。"], ["We must have your LC at least one month before the time of shipment.", "我们必须在船运前一个月收到你们的信用证。"], ["You should ship the goods within the time as stipulated in clause 9 of this contract. Transshipment en route is not allowed without our consent.", "贵方应在本合同第 9 款规定的时间内发货。未经我方同意，途中不得转运。"], ["Please load the contracted goods on board the vessel nominated by us.", "请将合同货物装到我方指定的船上。"], ["10-15 days prior to the date of shipment, you should inform us by fax of name of vessel, ETA of vessel and the name of shipping agent.", "在装船日期前 10-15 天，贵方应通过传真告知我方船名、船舶预计到达时间和货运代理的名称。"], ["The packing list should be indicated with shipping weight, number and date of corresponding invoice.", "装箱单上应注明发货重量、相应发票的编号和日期。"], ["If neither party considers it is necessary to extend the contract, the proposing party may take the initiative to conduct negotiation with the other party one month prior to its expiration.", "如果双方都认为没有必要延长合同，提议方可以在合同期满前一个月主动与对方进行协商。"], ["In case of breach of any of the provisions of this agreement by one party, the other party shall have the right to terminate this agreement by giving notice in writing to its opposite party.", "若一方违反本协议的任何条款，另一方有权书面通知对方终止本协议。"], ["If you fail to make the delivery ten weeks later than the time of shipment stipulated in the contract, we shall have the right to cancel the contract.", "如果你们比合同规定的装运时间晚 10 周交货，我们有权取消合同。"], ["If both parties do not agree to renew the contract at its expiration, it will automatically become void.", "如果双方在合同期满时不同意续签，合同将自动失效。"], ["If you want to terminate the contract before its term is up, you should notify us of its cancellation six months before.", "如果你们想在合同期限届满前终止合同，应在终止前 6 个月通知我们。"], ["We are in a position to accept orders against customers' samples specifying design, specifications and packaging requirements.", "我们能够接受客户指定设计、规格和包装要求的样品订单。"], ["We are now exporting straw and willow products, embroideries, porcelain wares, jade carvings, antiques, Chinese paintings, silk flowers and various kinds of toys and gifts.", "我们现在出口草编和柳编产品、刺绣品、瓷器、玉雕、古董、中国画、绢花以及各类玩具和礼品。"], ["Our corporation is a major producer of technically advanced machinery and chemicals for industry and agriculture.", "我们公司是一家主要生产用于工农业的先进机械和化工产品的厂家。"], ["Electronic products fall within the scope of our business activities.", "电子产品属于我们业务活动的范围。"], ["We also do export business of handmade woven articles.", "我们也经营手工编织品的出口业务。"], ["We have been engaged in the glass business with many Asian countries for many years.", "我们多年来一直与许多亚洲国家做玻璃生意。"], ["Our company is mainly in the line of exporting Chinese art objects to European markets.", "我们公司主要经营向欧洲市场出口中国艺术品的业务。"], ["We also do import and export business in chemicals and agricultural products.", "我们也经营化工产品和农产品的进出口业务。"], ["We have been importing and exporting all kinds of metals and minerals for 30 years and have many customers and friends in over 80 countries and regions.", "30 年来，我们一直从事各类金属和矿产的进出口业务，在 80 多个国家和地区有很多客户和朋友。"], ["Our corporation is a group enterprise integrating scientific research, business, production and service.", "我们公司是一家集科研、贸易、生产和服务于一体的集团企业。"], ["We are satisfied with the terms of this contract for the most part, but we feel that your terms of payment are too severe.", "我们对该合同的大部分条款感到满意，但觉得你们的付款条款太苛刻。"], ["We would like to have another discussion of these conditions in the afternoon before they are finally included in the contract.", "在这些条款最终被纳入合同之前，我们想在下午再对它们进行一次讨论。"], ["Before signing the contract this afternoon, I think we'd better go over a few final details.", "在今天下午签订合同之前，我想我们最好再检查一下最后的细节。"], ["We’d better draw up a rough draft of the contract then talk it over in detail at our next meeting.", "我们最好先起草一份合同草案，然后在下次会议上详细讨论。"], ["This is a copy of our specimen contract in which the general sales terms and conditions are contained.", "这是我们的一份合同样本，其中包含了一般销售条款和条件。"], ["We hope that you won’t object to our inserting such a clause in the agreement.", "我们希望你们不介意我们在协议中加入这样一个条款。"], ["If any other clause in this contract is in conflict with the supplementary conditions the supplementary conditions should be taken as final and binding.", "如果本合同中的任何其他条款与补充条件冲突，应以补充条件为准且具有约束力。"], ["We think it is necessary to include a force majeure clause in this contract.", "我们认为有必要在这份合同中加入不可抗力条款。"], ["After studying your draft contract we found it necessary to make a few changes.", "研究过你们起草的合同后，我们发现有必要做一些修改。"], ["Since both of us are in agreement on all the terms shall we sign the contract now?", "既然我们双方对所有条款都达成一致，我们现在就签合同吧？"], ["We think your draft contract needs some modification.", "我们认为你们起草的合同需要一些修改。"], ["Any modification or alteration to the contract shall be made with the consent of both parties.", "对合同的任何修改或变更都应经双方同意。"], ["No changes can be made on this contract without mutual consent.", "未经双方同意，不得对本合同进行任何更改。"], ["We must make it clear in the contract that you are obliged to complete the delivery of the goods within the contractual time of shipment.", "我们必须在合同中明确，你方有义务在合同规定的装运期内完成货物交付。"], ["If the shipment can not be made within three months as stipulated, the contract will become void.", "如果不能按照规定在三个月内装运，合同将无效。"], ["We should be obliged if you could arrange for the immediate shipment of this order.", "如果贵方能够立即安排装运这笔订单的货物，我们将不胜感激。"], ["Your failure to deliver the goods within the stipulated time has greatly inconvenienced us.", "贵方未能在规定时间内交货，给我们带来了极大的不便。"], ["Any delay in shipment would be detrimental to our future business.", "装运的任何延误都将对我们未来的业务不利。"], ["We trust you will see to it that the order is shipped within the stipulated time, as any delay would cause us no little financial loss.", "我们相信你方会确保订单在规定时间内装运，因为任何延误都会给我们造成不小的经济损失。"], ["As you know, June is the right season for the goods, so if they arrive later than June, we will miss the selling season.", "如你所知，6 月是这种货物的适销季节，所以如果它们晚于 6 月到达，我们将错过销售季节。"], ["Should you delay the shipment any longer, the fireworks might become useless to us.", "如果你们再延迟装运，这些烟花对我们来说可能就没用了。"], ["We appreciate your early resolution of this case.", "我们感谢你早日解决这个问题。"], ["We hope you can settle the claim as quickly as possible.", "我们希望你能尽快解决索赔问题。"], ["We hope that there will be no repetition of this kind of trouble in the future.", "我们希望今后不再出现此类麻烦。"], ["We expect that you will offer us a lower price as soon as possible.", "我们期望你能尽快给我们一个更低的价格。"], ["We hope that the matter can be   var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
