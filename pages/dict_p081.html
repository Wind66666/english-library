ce issue, and we’re back on track with the expansion plan—we’ll share the final adjusted product for your review early next week.", "法务团队已解决合规问题，扩展计划重回正轨 —— 下周一早向您分享最终调整后的产品供评审。"], ["You’ve approved the final adjusted product—we’ll start the regional launch preparation next week, including localization of marketing materials and training for local support teams.", "您已批准最终调整后的产品 —— 我们下周启动区域上线准备，包括营销素材本地化和本地支持团队培训。"], ["We’ve received your feedback on the launch checklist—we’ve adjusted the timeline for marketing material localization as you suggested, and will share the updated checklist by EOD.", "已收到您对上线检查清单的反馈 —— 已按您的建议调整营销素材本地化的时间，今天下班前分享更新后的清单。"], ["The regional launch was a success—user sign-ups in the new market reached 500 in the first 3 days, and local customer feedback has been mostly positive. We’ll send you a full launch report next week.", "区域上线取得成功 —— 新市场前 3 天用户注册量达 500，本地客户反馈以正面为主。下周向您发送完整上线报告。"], ["Thanks for sharing the details of the loyalty program—our product team will draft a design plan and share it with you for feedback within 1 week.", "感谢您分享忠诚度计划的细节 —— 产品团队将起草设计方案，1 周内分享给您征求意见。"], ["We’ve incorporated your feedback into the loyalty program design and finalized the plan—we’ll start development next month, and the program is expected to launch in 8 weeks.", "已将您的反馈纳入忠诚度计划设计，方案已敲定 —— 下个月启动开发，计划 8 周后上线。"], ["During development of the loyalty program, we found that integrating with your existing customer database will require additional time—we’ll need to extend the timeline by 2 weeks. We apologize for the delay and will work to minimize any impact.", "开发忠诚度计划时发现，与您现有客户数据库集成需要额外时间 —— 时间线需延长 2 周。对此延迟我们深表歉意，会尽力减少影响。"], ["Your validation of the loyalty program is complete, and we’re ready to launch it next Friday—we’ll coordinate with your team to promote it to your existing customers.", "您已完成忠诚度计划的验证，计划下周五上线 —— 我们会与您的团队协调，向现有客户推广该计划。"], ["The loyalty program has launched, and we’ve seen a 20% increase in repeat customer purchases in the first 5 days—we’ll continue to monitor its performance and share weekly reports with you.", "忠诚度计划已上线，前 5 天回头客购买量增长 20%—— 我们会持续监控其表现，每周向您发送报告。"], ["Thanks for agreeing to the early renewal—we’ll finalize the contract and send it to you for signing by the end of the week. Once signed, we’ll continue to provide the same high-quality support as before.", "感谢您同意提前续签 —— 本周内敲定合同并发送给您签署。签署后，我们会继续提供与以往同等高质量的支持。"], ["The revised contract with the increased user licenses is ready for signing—once we receive the signed contract, we’ll activate the additional licenses within 1 business day.", "包含增加用户许可的修订合同已准备好签署 —— 收到签署后的合同，我们会在 1 个工作日内激活额外许可。"], ["Thanks for your interest in the premium support package—we’ll send you a detailed brochure with pricing and service details, and answer any questions you have.", "感谢您对高级支持套餐的兴趣 —— 向您发送包含定价和服务细节的详细手册，并解答您的任何疑问。"], ["As a gesture of apology for the system downtime, we’ll extend your service contract by 1 month free of charge—we’ll update the contract and send it to you for confirmation.", "为表达对系统故障的歉意，我们将为您免费延长 1 个月服务合同 —— 更新合同后发送给您确认。"], ["The first weekly custom report has been sent to your email—if you’d like to adjust the metrics or frequency of the report, please let us know, and we’ll update it accordingly.", "第一份每周定制报告已发送至您邮箱 —— 如需调整报告指标或频率，请告知我们，我们会相应更新。"], ["Thanks for acknowledging the updated terms of service—we’ll implement the changes on our end, and there will be no impact on your product usage.", "感谢您确认更新后的服务条款 —— 我们会在后台实施变更，不会影响您的产品使用。"], ["The performance audit found that optimizing image sizes will improve load time by 40%—our dev team will complete this optimization by next Friday, and notify you once it’s done.", "性能审计发现，优化图片大小可使加载时间缩短 40%—— 开发团队下周五前完成优化，完成后立即通知您。"], ["The mobile app load time optimization is complete—could you test it and confirm if the performance meets your expectations?", "移动端应用加载时间优化已完成 —— 您能否测试一下，确认性能是否符合预期？"], ["Thanks for confirming you no longer use the old feature—we’ll announce its deprecation to all users next week and remove it in the next product update (scheduled for 1 month from now).", "（感谢您确认已不再使用该旧功能 —— 我们下周向所有用户发布停用通知，并在下次产品更新"], ["We received your follow-up question about customizing the CSV export fields—our dev team will add the ability to select specific fields next week, and we’ll send you a quick tutorial once it’s ready.", "已收到您关于自定义 CSV 导出字段的后续疑问 —— 开发团队下周将添加字段选择功能，功能就绪后会向您发送简易教程。"], ["Thanks for registering for the webinar—we’ll send a calendar invite with the meeting link 1 day in advance, and a recording of the webinar afterward for anyone who can’t attend live.", "感谢您报名研讨会 —— 我们会提前 1 天发送包含会议链接的日历邀请，会后还会分享录屏，供无法实时参与的人员观看。"], ["The integration feasibility assessment is complete: we can build the integration, and it will take 3 weeks and cost [X]—would you like to move forward with this plan, or discuss adjustments to the scope?", "集成可行性评估已完成：我们可实现该集成，需 3 周时间，费用为 [X]—— 您是否想推进该计划，或讨论调整范围？"], ["Thanks for approving the integration plan—we’ll assign a dedicated integration specialist to the project and share weekly progress updates. The project will start next Monday.", "感谢您批准集成计划 —— 我们会为项目分配专属集成专员，每周同步进展。项目下周一启动。"], ["The CRM integration is fully complete and has passed testing—we’ll schedule a training session with your team next week to show how to use the integrated features, and provide ongoing support afterward.", "（CRM 集成已全部完成并通过测试 —— 下周为您的团队安排培训，讲解集成功能的使用方法，后续还会提供持续支持。）"], ["The error issue has been identified: it’s caused by a temporary API glitch, which we’ve fixed. User access has been restored, and we’ll monitor the system closely for the next 24 hours to ensure no recurrence.", "错误原因已查明：是临时 API 故障导致，我们已修复。用户访问已恢复，未来 24 小时会密切监控系统，确保不再出现问题。"], ["Thanks for selecting the branding mockup—our dev team will implement the changes and share the updated product with you for final review next Wednesday. Once approved, the changes will go live immediately.", "感谢您选定品牌方案 —— 开发团队将实现修改，下周三向您分享更新后的产品供最终评审。审批通过后，修改将立即上线。"], ["Your input on the major update roadmap was very valuable—we’ve adjusted the feature priorities based on your feedback and will share the finalized roadmap with you next month.", "您对重大更新路线图的意见非常有价值 —— 我们已根据您的反馈调整功能优先级，下个月向您分享最终路线图。"], ["The first 3 advanced feature guides are now live in the help center—we’ll send you a link to them, and the remaining 2 will be added next week. If you have suggestions for additional guide topics, please let us know.", "前 3 份高级功能指南已在帮助中心上线 —— 向您分享链接，剩余 2 份下周添加。若您对其他指南主题有建议，欢迎告知。"], ["The custom KPI dashboard test version is ready—could you review it and let us know if you need to add/remove metrics or adjust the visualization format? We’ll finalize it based on your feedback.", "定制 KPI 仪表盘测试版已就绪 —— 您能否评审，告知是否需要增减指标或调整可视化格式？我们将根据您的反馈定稿。"], ["The final custom KPI dashboard is now live—we’ll send you a quick guide on how to use it, and our team will provide support if you encounter any issues.", "最终定制 KPI 仪表盘已上线 —— 向您发送使用简易指南，若遇到问题，我们的团队会提供支持。"], ["Thanks for completing the satisfaction survey—your feedback on improving response time for support tickets is being reviewed by our team, and we’ll implement changes to address this within a month.", "感谢您完成满意度调查 —— 您关于缩短支持工单响应时间的反馈，我们团队正在评审，1 个月内将实施改进措施。"], ["The free trial extension for your new team members will end soon—would you like to convert their accounts to paid licenses, or extend the trial further? We can share pricing details if needed.", "您新团队成员的免费试用延长即将到期 —— 是否要将他们的账户转为付费许可，或进一步延长试用？如需，我们可分享定价详情。"], ["Thanks for referring [Company Name] to our product—we’ve confirmed their sign-up, and the 10% discount has been applied to your next renewal. We’ll notify you when the renewal invoice is sent.", "感谢您推荐 [公司名称] 使用我们的产品 —— 我们已确认他们的注册，10% 折扣已应用于您下次续费。续费发票发送时，我们会通知您。"], ["The security update has been successfully rolled out—we’ve verified that all your users’ data is secure, and there’s no impact on product functionality. We’ll share a detailed security report with you by EOD.", "安全更新已成功推送 —— 我们已验证您所有用户的数据安全，且不影响产品功能。今天下班前向您分享详细安全报告。"], ["The collaboration feature demo for your leadership team went well—we’ve shared the follow-up materials (e.g., feature specs, launch timeline) with you, and are available to answer any additional questions.", "（为您领导团队进行的协作功能演示顺利完成 —— 已向您分享后续材料"], ["Thanks for your understanding of the upcoming pricing adjustment—we’ll send a formal notice with the new pricing details next month, and remind you before your current pricing terms expire.", "感谢您对即将到来的定价调整的理解 —— 下个月向您发送包含新定价详情的正式通知，并在您当前定价条款到期前提醒您。"], ["The account transfer to your new team member is complete—if you need to adjust their access permissions (e.g., admin vs. standard user), please let us know, and we’ll update it immediately.", "（向新团队成员的账户转移已完成 —— 若需调整其访问权限"], ["Today I’ll present a quarterly progress report on Project X, covering key achievements, challenges, and next-quarter plans. Let’s start with the milestone status.", "今天我将汇报 X 项目的季度进展，内容包括核心成果、挑战和下季度计划。我们先从里程碑状态开始。"], ["As shown in the slide, we completed 8 out of 10 planned milestones this quarter— the two delayed ones are due to supply chain issues, which we’ve addressed now.", "如幻灯片所示，本季度我们完成了 10 个计划里程碑中的 8 个 —— 两个延期里程碑因供应链问题导致，目前已解决。"], ["The biggest achievement this quarter is that we launched the product 2 weeks ahead of schedule, and initial user adoption reached 30% (exceeding the 20% target).", "本季度最大成果是产品提前 2 周上线，初期用户使用率达 30%，超过 20% 的目标。"], ["We also achieved a 15% reduction in development costs by optimizing resource allocation—this was done by reallocating part-time staff from low-priority tasks to core work.", "通过优化资源分配，我们还将开发成本降低了 15%—— 具体做法是将兼职人员从低优先级任务调至核心工作。"], ["Now let’s move to challenges: the main issue we faced was a 3-week delay in receiving key materials from the original supplier, which affected the prototype testing phase.", "接下来我们看挑战：主要问题是从原供应商处接收关键材料延迟了 3 周，影响了原型测试阶段。"], ["To solve this, we identified three alternative suppliers within a week and negotiated a faster delivery time—this helped us catch up on the delayed testing and meet the final launch date.", "为解决此问题，我们 1 周内找到 3 家替代供应商，并协商了更快的交付时间 —— 这帮助我们赶上延期的测试，最终如期上线。"], ["Another challenge was low cross-team communication efficiency—we’ll address this next quarter by setting up weekly sync calls for all team leads.", "另一个挑战是跨团队沟通效率低 —— 下季度我们将通过为所有团队负责人安排每周同步会议来解决。"], ["Now let’s look at the key metrics: user satisfaction scored 4.7/5 (up from 4.2 last quarter), and customer support ticket resolution time was reduced to 8 hours (down from 12 hours).", "（现在看关键指标：用户满意度为 4.7/5"], ["Revenue from Project X this quarter reached $500k, which is 10% higher than the forecast—this is mainly due to higher-than-expected sales in the European market.", "（X 项目本季度收入达 50 万美元，比预测高 10%—— 主要因欧洲市场销售额超预期。）"], ["For next quarter, our top priority is to launch the mobile app version of the product, which we plan to complete by the end of Week 12.", "下季度我们的首要任务是推出产品的移动端版本，计划在第 12 周末完成。"], ["We’ll also focus on expanding into the Southeast Asian market—we’ve already identified 3 local partners and will sign collaboration agreements by the end of next month.", "我们还将重点拓展东南亚市场 —— 已确定 3 家本地合作伙伴，计划下月底前签署合作协议。"], ["To support the market expansion, we’ll allocate an additional $50k to the marketing budget—this will cover local advertising and promotional events.", "为支持市场拓展，我们将向营销预算额外拨款 5 万美元，用于本地广告投放和推广活动。"], ["Now I’ll open the floor for questions—does anyone have concerns about the quarterly progress or next-quarter plans?", "现在进入提问环节 —— 有人对季度进展或下季度计划有疑问吗？"], ["Thanks for that question about the mobile app timeline—we’ve built in a 2-week buffer to account for potential technical issues, so even if there are delays, we can still meet the Week 12 deadline.", "感谢您关于移动端时间线的提问 —— 我们预留了 2 周缓冲期应对潜在技术问题，即便出现延迟，仍能在第 12 周完成。"], ["Next, I’ll hand over to Sarah, who will present the sales team’s quarterly performance in more detail.", "接下来，我将交由 Sarah 详细汇报销售团队的季度表现。"], ["Today’s project kickoff report will cover three parts: project background, core objectives, and initial action plan—let’s start with why we’re launching this project.", "今天的项目启动汇报包含三部分：项目背景、核心目标和初步行动方案 —— 我们先从项目启动的原因说起。"], ["Market research shows that demand for eco-friendly packaging has increased by 40% in the past year—this project aims to develop a new line of recyclable packaging to capture this market opportunity.", "市场调研显示，过去一年环保包装需求增长 40%—— 本项目旨在开发新款可回收包装，抓住这一市场机遇。"], ["Our core objectives for this project are: first, launch the new packaging line within 6 months; second, achieve a 25% market share in the eco-friendly packaging segment within 1 year; third, keep production costs 10% below industry average.", "项目核心目标有三：一是 6 个月内推出新包装产品线；二是 1 年内在环保包装领域实现 25% 市场份额；三是生产成本控制在行业平均水平以下 10%。"], ["To achieve these objectives, the initial action plan includes: completing material testing by Week 4, finalizing the production process by Week 12, and starting pilot production by Week 16.", "为实现这些目标，初步行动方案包括：第 4 周完成材料测试、第 12 周确定生产流程、第 16 周启动试生产。"], ["We’ve allocated a total budget of $200k for this project—$80k for R&D, $70k for production setup, and $50k for marketing and pilot testing.", "项目总预算已分配 20 万美元：8 万用于研发、7 万用于生产筹备、5 万用于营销和试生产测试。"], ["The project team consists of 8 members: 2 R&D specialists, 3 production engineers, 2 marketing experts, and 1 project manager (myself) to coordinate cross-team work.", "（项目团队共 8 人：2 名研发专员、3 名生产工程师、2 名营销专家，以及 1 名项目经理"], ["We’ve identified two key risks: first, difficulty in sourcing low-cost recyclable materials; second, slower-than-expected market acceptance. We’ll prepare mitigation plans for both by the end of next week.", "已识别两大关键风险：一是难以采购低成本可回收材料；二是市场接受度低于预期。下周末前将为两者制定缓解方案。"], ["Does anyone have suggestions for optimizing the initial action plan, or additional risks we should consider?", "有人对优化初步行动方案有建议，或认为我们需考虑其他风险吗？"], ["Thanks for pointing out the potential supply chain risk—we’ll add it to our risk list and work with the procurement team to identify backup material suppliers this week.", "感谢您指出潜在供应链风险 —— 我们将其加入风险清单，本周与采购团队合作确定备用材料供应商。"], ["Now let’s move to the post-project review for Project Y, which launched 1 month ago. First, let’s recap what we set out to achieve vs. actual results.", "现在进入 Y 项目的复盘环节，该项目 1 个月前已上线。首先，我们对比目标与实际成果。"], ["The original objectives were: launch the product by June 30th, achieve 1,000 user sign-ups in the first month, and keep customer complaint rate below 5%.", "原目标为：6 月 30 日前上线产品、首月用户注册量达 1000 人、客户投诉率控制在 5% 以下。"], ["Actual results: we launched 2 days early (June 28th), sign-ups reached 1,250 (25% above target), and complaint rate was 3% (below the 5% threshold)—overall, the project was a success.", "（实际成果：提前 2 天上线"], ["Now let’s discuss what worked well: the weekly sync calls between the dev and marketing teams ensured alignment on launch timing, which helped the marketing campaign go live immediately after product launch.", "我们先分析做得好的方面：开发与营销团队的每周同步会议确保了上线时间对齐，使营销活动能在产品上线后立即启动。"], ["Another success factor was the early user testing—we invited 50 beta users in Week 8, and their feedback helped us fix 3 critical usability issues before launch.", "另一成功因素是早期用户测试：第 8 周邀请 50 名测试用户，他们的反馈帮助我们在上线前修复了 3 个关键易用性问题。"], ["Now let’s talk about areas for improvement: the customer support team wasn’t fully trained on the product’s advanced features before launch, leading to 40% of initial complaints being about unclear feature explanations.", "接下来分析待改进之处：客服团队在上线前未完全接受产品高级功能培训，导致 40% 的初期投诉与功能说明不清晰有关。"], ["To address this in future projects, we’ll schedule product training for the support team at least 2 weeks before launch, and create a detailed FAQ document for them to reference.", "为在未来项目中解决此问题，我们将在上线前至少 2 周为客服团队安排产品培训，并制作详细 FAQ 文档供其参考。"], ["Another area to improve: the budget for user testing was underestimated by $10k, so we had to reallocate funds from the marketing budget—next time, we’ll conduct a more detailed cost estimate for testing.", "另一待改进点：用户测试预算少估了 1 万美元，不得不从营销预算中调配 —— 下次将为测试做更详细的成本估算。"], ["Let’s hear from the team: does anyone have other observations on what worked or what could be improved?", "我们听听团队的看法：有人对做得好的地方或待改进之处有其他观察吗？"], ["Thanks for mentioning the delayed feedback from the legal team—this caused a 3-day delay in finalizing the user agreement. Next time, we’ll set a clear feedback deadline for legal reviews.", "感谢您提到法务团队反馈延迟的问题 —— 这导致用户协议定稿推迟 3 天。下次将为法务评审设定明确反馈截止日期。"], ["Now let’s summarize the key lessons learned: first, early cross-team training reduces post-launch issues; second, detailed budget estimates for all phases prevent fund reallocation; third, setting clear feedback deadlines speeds up decision-making.", "现在总结核心经验教训：一是早期跨团队培训减少上线后问题；二是各阶段详细预算估算避免资金调配；三是设定明确反馈截止日期加快决策。"], ["We’ll document these lessons in the company’s project knowledge base, and share them with all new project teams to avoid repeating the same mistakes.", "我们将这些经验记录到公司项目知识库，并分享给所有新项目团队，避免重复犯错。"], ["Now let’s present the annual department review for the product team. First, let’s look at the key projects we delivered this year.", "现在进行产品团队年度部门复盘。首先，回顾今年交付的核心项目。"], ["This year, we delivered 5 major projects: Project A (launched March), Project B (May), Project C (August), Project D (October), and Project E (December)—all were delivered on time or ahead of schedule.", "（今年共交付 5 个重大项目：A 项目"], ["The total revenue generated from these projects was $2.5 million, which accounts for 30% of the company’s total annual revenue—this exceeds our initial target of 25%.", "这些项目产生的总收入达 250 万美元，占公司年度总收入的 30%—— 超过 25% 的初始目标。"], ["User satisfaction across all projects averaged 4.6/5, up from 4.2 last year—this is due to the increased focus on user testing and feedback integration.", "所有项目的用户满意度平均为 4.6/5，高于去年的 4.2—— 这得益于对用户测试和反馈整合的重视度提升。"], ["Now let’s discuss team growth: we expanded from 12 to 18 members this year, adding 3 product designers, 2 data analysts, and 1 UX researcher—this has strengthened our capability in user-centric design.", "接下来讨论团队成长：团队规模从 12 人扩大至 18 人，新增 3 名产品设计师、2 名数据分析师和 1 名用户体验研究员 —— 增强了以用户为中心的设计能力。"], ["We also invested in team training: 80% of members attended at least 2 industry workshops or courses this year, covering topics like AI-driven product design and data analytics.", "我们还投入团队培训：80% 的成员今年至少参加 2 次行业研讨会或课程，涵盖 AI 驱动产品设计、数据分析等主题。"], ["Areas for improvement next year: first, we need to improve collaboration with the sales team to better align product features with customer needs; second, we need to reduce the time spent on feature revisions by conducting more thorough initial user research.", "明年待改进之处：一是加强与销售团队协作，使产品功能更贴合客户需求；二是通过更深入的初期用户研究，减少功能修改耗时。"], ["Next year’s key goals: first, deliver 6 major projects (including 2 international market expansions); second, increase user satisfaction to 4.8/5; third, reduce project development time by 10% through process optimization.", "（明年核心目标：一是交付 6 个重大项目"], ["To achieve these goals, we’ll hire 3 more team members (1 product manager, 1 dev liaison, 1 market researcher) and implement a new project management tool to streamline workflows.", "（为实现这些目标，我们将再招聘 3 名团队成员"], ["Does the leadership team have any feedback on the annual review, or suggestions for adjusting next year’s goals?", "领导团队对年度复盘有反馈，或对调整明年目标有建议吗？"], ["Thanks for suggesting we prioritize the North American market expansion—we’ll adjust the project timeline to start that project in Q2 instead of Q3 to capitalize on the upcoming peak season.", "感谢您建议优先推进北美市场拓展 —— 我们将调整项目时间线，将该项目从 Q3 提前至 Q2 启动，以抓住即将到来的旺季。"], ["Now let’s present the crisis response review for the recent server outage incident, which lasted from 2 PM to 5 PM on November 15th.", "现在对 11 月 15 日下午 2 点至 5 点的服务器故障事件进行危机应对复盘。"], ["First, let’s recap the incident: a hardware failure in the main server caused the outage, affecting 80% of our users. The IT team restored service within 3 hours, and we sent 2 user notifications (at 2:30 PM and 4:45 PM) to update them on the progress.", "（首先回顾事件：主服务器硬件故障导致 outage，影响 80% 用户。IT 团队 3 小时内恢复服务，期间发送 2 次用户通知"], ["The positive aspects of the response: the IT team acted quickly to identify the root cause (within 30 minutes) and restore service; the customer support team handled 150+ tickets during the outage with a 90% satisfaction rate.", "（应对中的积极方面：IT 团队快速定位根本原因"], ["Areas for improvement: first, the initial user notification was sent 30 minutes later than planned—we need to automate the notification process to avoid delays; second, we didn’t have a backup server ready, which extended the recovery time.", "待改进之处：一是首次用户通知比计划晚 30 分钟 —— 需自动化通知流程避免延迟；二是未准备备用服务器，延长了恢复时间。"], ["Action items to prevent future incidents: first, implement an automated outage notification system by the end of December; second, set up a backup server by January 15th; third, conduct monthly server maintenance checks to catch potential issues early.", "预防未来事件的行动项：一是 12 月底前部署自动化故障通知系统；二是 1 月 15 日前搭建备用服务器；三是每月进行服务器维护检查，提前发现潜在问题。"], ["We’ll also provide crisis response training for the customer support team next month, covering how to address user concerns and share accurate updates during outages.", "下月还将为客服团队提供危机应对培训，内容包括如何解答用户疑问、在故障期间分享准确进展。"], ["Does anyone have additional feedback on the crisis response, or suggestions for strengthening our outage prevention measures?", "有人对危机应对有额外反馈，或对加强故障预防措施有建议吗？"], ["Thanks for suggesting we conduct a quarterly disaster recovery drill—we’ll schedule the first drill for January and include all relevant teams (IT, support, marketing) to test our response process.", "（感谢您建议每季度开展灾难恢复演练 —— 首次演练安排在 1 月，邀请所有相关团队"], ["Now let’s present the budget review for Project Z, which was completed last month. We’ll compare the planned budget vs. actual spending, and analyze the variances.", "现在对上月完成的 Z 项目进行预算复盘。我们对比计划预算与实际支出，并分析差异原因。"], ["The planned budget for Project Z was $150k: $60k for development, $40k for design, $30k for testing, and $20k for marketing.", "（Z 项目计划预算 15 万美元：6 万用于开发、4 万用于设计、3 万用于测试、2 万用于营销。）"], ["Actual spending was $142k: $58k for development (2k under budget), $42k for design (2k over budget), $28k for testing (2k under budget), and $14k for marketing (6k under budget)—total variance was $8k under budget.", "（实际支出 14.2 万美元：开发 5.8 万"], ["The main reasons for variances: design overspent due to 2 additional user testing sessions (requested by the client); marketing underspent because we used in-house resources instead of external agencies for content creation.", "（差异主要原因：设计超支因额外增加 2 次用户测试"], ["Lessons learned: first, we should include a 10% contingency budget for client-requested changes; second, using in-house resources for non-core tasks can reduce costs without compromising quality.", "经验教训：一是应为客户要求的变更预留 10% 应急预算；二是核心外任务使用内部资源可在不影响质量的前提下降低成本。"], ["For future projects, we’ll adjust our budget planning: add a contingency line item (10% of total budget) and evaluate in-house vs. external resources for each task to optimize spending.", "（未来项目将调整预算规划：增加应急预算项"], ["Does the finance team have any questions about the budget variance analysis, or suggestions for improving future budget planning?", "财务团队对预算差异分析有疑问，或对改进未来预算规划有建议吗？"], ["Thanks for suggesting we track budget spending on a weekly basis (instead of monthly)—this will help us identify overspending earlier and take corrective action in time.", "（感谢您建议每周"], ["Now let’s present the team performance review for the Q3 dev team. We’ll evaluate performance based on three criteria: task completion rate, code quality, and collaboration efficiency.", "现在进行 Q3 开发团队的绩效复盘。我们将从三个维度评估表现：任务完成率、代码质量和协作效率。"], ["First, task completion rate: the team was assigned 85 tasks this quarter, and completed 82 (a 96% completion rate), which exceeds the 90% target. The 3 unfinished tasks were low-priority and pushed to Q4 with stakeholder approval.", "（首先是任务完成率：本季度团队分配 85 项任务，完成 82 项"], ["Next, code quality: the number of post-launch bugs per project was 2.1 on average, down from 3.5 in Q2. This improvement is due to the new code review process we implemented in July.", "其次是代码质量：每个项目上线后的漏洞数量平均为 2.1 个，低于 Q2 的 3.5 个。这一改进得益于我们 7 月推行的新代码审查流程。"], ["Collaboration efficiency: feedback from cross-team partners (design, QA) shows that the dev team’s response time to questions was reduced to 4 hours (from 6 hours in Q2), which improved overall project flow.", "（最后是协作效率：跨团队伙伴"], ["Standout team members: Alex led the successful optimization of the payment gateway, reducing transaction failure rates by 40%; Maya completed 120% of her assigned tasks and supported 3 new team members with onboarding.", "表现突出的团队成员：Alex 牵头成功优化支付网关，将交易失败率降低 40%；Maya 完成 120% 的分配任务，并协助 3 名新成员融入团队。"], ["Areas for growth: 3 team members mentioned struggling with the new cloud computing framework—we’ll arrange a 2-day training workshop in Q4 to address this skill gap.", "待提升领域：3 名团队成员反馈在新云计算框架的使用上存在困难 ——Q4 将安排 2 天培训 workshop，弥补这一技能缺口。"], ["Next quarter’s performance goals: maintain a 95%+ task completion rate, reduce post-launch bugs to 1.5 per project, and cut cross-team response time to 3 hours.", "下季度绩效目标：保持 95% 以上的任务完成率，将每个项目的上线后漏洞降至 1.5 个，跨团队响应时间缩短至 3 小时。"], ["Does anyone have questions about the performance data, or suggestions for supporting the team’s growth in Q4?", "有人对绩效数据有疑问，或对 Q4 支持团队成长有建议吗？"], ["Thanks for suggesting we pair junior developers with seniors for the cloud framework training—this peer learning approach will likely improve knowledge retention, so we’ll adjust the workshop plan accordingly.", "感谢您建议让初级开发人员与资深人员结对参与云计算框架培训 —— 这种同伴学习模式可能提升知识留存率，我们会相应调整 workshop 计划。"], ["Now let’s move to the marketing campaign review for the new product launch. We’ll analyze campaign reach, conversion rate, and ROI (return on investment).", "（现在进入新产品上线的营销活动复盘。我们将分析活动触达量、转化率和投资回报率"], ["Campaign reach: we targeted 500,000 potential users across social media, email, and paid ads, and achieved a total reach of 580,000 (16% above target). Social media accounted for 60% of the reach, followed by email (25%) and paid ads (15%).", "（活动触达：我们通过社交媒体、邮件和付费广告定向 50 万潜在用户，实际总触达 58 万"], ["Conversion rate: the campaign drove 12,500 product sign-ups, resulting in a conversion rate of 2.16% (vs. the target of 1.8%). Email marketing had the highest conversion rate (3.2%), while paid ads had the lowest (1.5%).", "（转化率：活动带来 1.25 万产品注册，转化率 2.16%"], ["ROI: the total campaign cost was $30,000, and the revenue generated from the converted users in the first month was $45,000—this gives an ROI of 50% (exceeding the 30% target).", "（投资回报率：活动总成本 3 万美元，转化用户首月产生收入 4.5 万美元 ——ROI 达 50%"], ["Successful tactics: the personalized email campaign (segmented by user industry) had 2x higher open rates than generic emails; the short-form social media videos showcasing product features received 100,000+ shares.", "成功策略：按用户行业细分的个性化邮件活动，打开率是通用邮件的 2 倍；展示产品功能的短视频在社交媒体获得 10 万 + 转发。"], ["Tactics to improve: paid ads targeting younger demographics (18-24) underperformed—we’ll refine the ad copy and visuals to better align with this group’s preferences in future campaigns.", "待改进策略：针对 18-24 岁年轻群体的付费广告表现不佳 —— 未来活动中，我们将优化广告文案和视觉设计，更贴合该群体偏好。"], ["Action plan for the next campaign: allocate 70% of the budget to high-performing channels (email, social media videos) and 30% to optimized paid ads; start A/B testing ad creatives 2 weeks before the campaign launch.", "（下一次活动的行动方案：70% 预算投入高表现渠道"], ["Does the marketing team have additional insights from the campaign, or ideas for testing new tactics next time?", "营销团队对本次活动有额外洞察，或对下次测试新策略有想法吗？"], ["Thanks for suggesting we partner with micro-influencers in the next campaign—this aligns with our goal to reach niche audiences, so we’ll research relevant influencers in the product’s industry and include this in the plan.", "感谢您建议下次活动与微型网红合作 —— 这与我们触达细分受众的目标一致，我们将调研产品所属行业的相关网红，并将其纳入计划。"], ["Now let’s conduct a user research review for the recent UX study we completed. We’ll recap the research goals, key findings, and how we plan to apply them.", "（现在对近期完成的用户体验"], ["Research goals: understand why users were abandoning the checkout process, identify pain points in the onboarding flow, and gather feedback on the new feature prototype.", "研究目标：找出用户放弃结账流程的原因、识别入职流程中的痛点、收集对新功能原型的反馈。"], ["Methodology: we conducted 30 one-on-one user interviews (15 existing users, 15 new users) and analyzed 500+ user session recordings from the past month.", "（研究方法：开展 30 场一对一用户访谈"], ["Key finding 1: 65% of checkout abandonments were due to unexpected shipping costs—users only saw the cost after entering their address, so they left the process.", "核心发现 1：65% 的结账放弃源于意外运费 —— 用户仅在输入地址后才看到运费，因此退出流程。"], ["Key finding 2: new users took an average of 8 minutes to complete onboarding (target was 5 minutes) because the “business information” step was too complex and required unnecessary details.", "（核心发现 2：新用户完成入职平均需 8 分钟"], ["Key finding 3: 80% of users liked the new “saved templates” feature, but 40% wanted the ability to customize templates further (e.g., change colors, add logos).", "（核心发现 3：80% 用户喜欢新的 “模板保存” 功能，但 40% 用户希望增加模板自定义能力"], ["Application plan: first, add shipping cost estimates on the product page (before checkout) by next month; second, simplify the onboarding “business information” step by removing 3 unnecessary fields; third, add template customization options to the next product update.", "（应用计划：一是下月前在产品页"], ["We’ll track the impact of these changes: measure checkout abandonment rate 1 month after adding shipping estimates, and track onboarding time after simplifying the process.", "我们将跟踪这些变更的效果：添加运费估算后 1 个月测量结账放弃率，简化流程后跟踪入职时间。"], ["Does the product team have questions about the research findings, or suggestions for adjusting the application plan?", "产品团队对研究发现有疑问，或对调整应用计划有建议吗？"], ["Thanks for suggesting we test the simplified onboarding step with a small group of new users first—this will help us catch any unforeseen issues before rolling it out to all users, so we’ll add a 2-week pilot test to the plan.", "感谢您建议先在小范围新用户中测试简化后的入职步骤 —— 这能帮助我们在全量推广前发现潜在问题，我们将在计划中加入 2 周试点测试。"], ["Now let’s wrap up the quarterly executive review with a summary of key takeaways and next steps for all departments.", "现在总结季度高管复盘的核心要点及各部门下一步行动，为本次复盘收尾。"], ["Company-wide key takeaways: Q3 revenue exceeded target by 12% (driven by Project X and the new marketing campaign); cross-team collaboration improved but still needs work (e.g., legal review delays); user satisfaction is up 5% year-over-year.", "（全公司核心要点：Q3 收入超目标 12%"], ["Department-specific next steps: Product team will focus on mobile app launch and template customization; Sales team will expand into Southeast Asia with local partners; IT team will set up backup servers and automate outage notifications.", "部门专属下一步：产品团队聚焦移动端上线和模板自定义；销售团队联合本地伙伴拓展东南亚市场；IT 团队搭建备用服务器并自动化故障通知。"], ["Company goal for Q4: maintain 10%+ revenue growth, reduce cross-team review time by 20%, and launch at least 1 major product update per department.", "（Q4 公司目标：保持 10% 以上收入增长，跨团队评审时间缩短 20%，每个部门至少推出 1 项重大产品更新。）"], ["We’ll hold monthly check-ins to track progress on these goals—each department will submit a 1-page update on the 15th of every month, and we’ll discuss challenges in the executive meeting.", "我们将每月召开进度跟踪会 —— 各部门每月 15 日提交 1 页进展报告，在高管会议中讨论遇到的挑战。"], ["Thanks to everyone for contributing to the quarterly review—your insights and feedback will help us align on priorities and drive better results in Q4.", "感谢所有人为季度复盘提供支持 —— 你们的洞察和反馈将帮助我们对齐优先级，在 Q4 取得更好成果。"], ["For any follow-up questions about the review, please reach out to my team by the end of next week—we’ll compile a FAQ document and share it with all departments.", "如对复盘有后续疑问，请在下周前联系我的团队 —— 我们将整理 FAQ 文档，分享给所有部门。"], ["Let’s schedule the next executive review for January 15th—we’ll focus on Q4 results and 2025 annual planning, so please start preparing initial plans for next year.", "下次高管复盘定于 1 月 15 日 —— 重点讨论 Q4 成果和 2025 年度规划，请各部门开始准备明年初步计划。"], ["Finally, I want to recognize the hard work of all teams this quarter—your dedication to meeting goals and solving challenges is what drives the company forward. Let’s keep this momentum going into Q4!", "最后，感谢所有团队本季度的辛勤付出 —— 你们为实现目标、解决挑战所做的努力，是公司前进的动力。让我们带着这股势头迎接 Q4！"], ["Good morning, team—just a quick reminder that the weekly sync call is at 10 AM today, and we’ll be discussing the latest project timeline adjustments. Please come prepared with your task updates.", "早上好，团队 —— 快速提醒：今日上午 10 点召开每周同步会议，将讨论最新项目时间线调整。请准备好任务进展，准时参会。"], ["Hi Lisa, could you help me review the client proposal draft by EOD today? I need to make sure the pricing section is clear and aligns with our company’s rates.", "嗨 Lisa，能否在今天下班前帮我评审客户提案草案？我需要确认定价部分表述清晰，且符合公司收费标准。"], ["Everyone, I just received an update from the supplier: the materials we ordered will arrive 2 days late (on Friday instead of Wednesday). Let’s adjust the production schedule accordingly—we’ll start assembly on Friday afternoon instead of Wednesday.", "（各位，刚收到供应商通知：我们订购的材料将延迟 2 天送达"], ["Hi Mike, do you have 15 minutes this afternoon? I need to ask you about the new project management tool— I’m struggling to set up task dependencies and could use your help.", "嗨 Mike，今天下午有 15 分钟时间吗？我想请教新项目管理工具的使用问题 —— 我在设置任务依赖时遇到困难，需要你的帮助。"], ["Team, the IT department just announced that the company’s internet will be down for maintenance this Saturday from 8 AM to 12 PM. Please avoid scheduling any online tasks or client calls during this time.", "团队通知：IT 部门宣布本周六上午 8 点至 12 点将进行网络维护，期间断网。请避免在此时间段安排线上任务或客户会议。"], ["Hi Sarah, I noticed the meeting room “Sunny” is booked for 2 PM tomorrow, but I need it for a client presentation. Could you check if there’s another available room, or see if the current booking can be rescheduled?", "嗨 Sarah，我看到 “Sunny” 会议室明天下午 2 点已被预订，但我需要用它进行客户演示。能否帮忙查看是否有其他可用会议室，或确认当前预订能否改期？"], ["Just a heads-up: the client pushed back our meeting from tomorrow to next Tuesday at the same time (2 PM). I’ve updated the calendar invite, and please let me know if you can’t attend the new time.", "（温馨提示：客户将会议从明天推迟至下周二同一时间"], ["Hi John, could you share the latest sales report with me? I need to reference it in the executive meeting tomorrow morning—preferably by the end of today.", "嗨 John，能否分享最新销售报告给我？我需要在明天上午的高管会议中引用 —— 最好在今天下班前提供。"], ["Team, we have a new intern starting next Monday: Emma. She’ll be working with the marketing team for 3 months. Let’s make her feel welcome—someone please show her around the office on her first day and introduce her to the team.", "团队通知：下周一将有新实习生 Emma 入职，在营销团队实习 3 个月。请大家热情欢迎她 —— 麻烦有人在她入职当天带她熟悉办公室，并介绍给团队成员。"], ["Hi Alex, I’m out of the office tomorrow for a doctor’s appointment. Could you cover my client call at 11 AM? I’ll share the meeting notes and client background with you this afternoon, so you’ll have all the info you need.", "嗨 Alex，我明天因看医生请假。能否帮忙代我参加上午 11 点的客户会议？今天下午我会分享会议纪要和客户背景给你，确保你掌握所有必要信息。"], ["Team, the coffee machine in the pantry is broken—facilities team said it’ll take 2 days to repair. There’s a temporary coffee station set up in the lobby, and they’ll bring in bottled water for the pantry today.", "团队通知：茶水间的咖啡机坏了 —— 设施团队表示需要 2 天时间维修。大堂已设置临时咖啡角，今天还会为茶水间补充瓶装水。"], ["Hi Jamie, I accidentally deleted the project folder from the shared drive—do you know if IT can recover it? I checked the recycle bin, but it’s not there. I’m really sorry for the mistake.", "嗨 Jamie，我不小心从共享盘删除了项目文件夹 —— 你知道 IT 能否恢复吗？我查了回收站，里面没有。对此失误我深感抱歉。"], ["Good news: IT said they can restore the deleted folder within 1 hour. They asked me to avoid making changes to the shared drive until it’s recovered, so let’s hold off on updating files for now.", "好消息：IT 表示 1 小时内可恢复删除的文件夹。他们让我在恢复前不要修改共享盘内容，所以目前先暂停更新文件。"], ["Everyone, please remember to submit your expense reports for last month by this Friday—finance team needs to process them before the end of the quarter. If you need help with the form, reach out to Linda in finance.", "各位，请记得本周五前提交上月的费用报销单 —— 财务团队需在季度末前处理完毕。若填写表格有疑问，可联系财务部门的 Linda。"], ["Hi Tom, the client just sent over revised feedback on the design—they want to change the logo placement and adjust the color palette. Could you update the mockups by Wednesday? I’ll forward their feedback email to you right away.", "嗨 Tom，客户刚发来设计的修改意见 —— 他们想调整 logo 位置和配色方案。你能否在周三前更新设计稿？我马上把他们的反馈邮件转发给你。"], ["Team, we’re having a team lunch this Friday at 12:30 PM to celebrate hitting the Q3 target—we’ve booked a table at the Italian restaurant downstairs. Please let me know by Wednesday if you can’t make it, so I can adjust the reservation.", "团队通知：为庆祝达成 Q3 目标，本周五中午 12:30 将组织团队聚餐 —— 已在楼下的意大利餐厅预订座位。若无法参加，请在周三前告知我，以便调整预订人数。"], ["Hi Sophie, I need to borrow your laptop charger for a few hours—mine stopped working this morning, and IT can’t replace it until tomorrow. I’ll return it as soon as I’m done with my presentation.", "嗨 Sophie，能否借你的笔记本充电器用几小时？我的今早坏了，IT 要到明天才能更换。我完成演示后马上还你。"], ["Just a reminder: the deadline for submitting Q4 project proposals is next Monday. Please make sure your proposal includes a clear objective, timeline, and budget—if you need feedback on your draft, my door is open this week.", "温馨提醒：Q4 项目提案的提交截止日期是下周一。请确保提案包含明确的目标、时间线和预算 —— 若需要对草案提意见，本周随时可来找我。"], ["Hi Ryan, the printer in the marketing office is jammed again—I tried to fix it, but it’s still not working. Could you send someone from IT to check it? We have a lot of presentation materials to print for tomorrow’s client meeting.", "嗨 Ryan，营销办公室的打印机又卡纸了 —— 我试着修了下，但还是不行。能否让 IT 派人来检查？我们要为明天的客户会议打印很多演示材料。"], ["Team, the company’s HR policy on remote work has been updated—starting next month, we can work from home up to 2 days a week, but we need to submit a remote work request via the HR system 1 day in advance. I’ve shared the full policy document in the team chat.", "团队通知：公司远程办公的 HR 政策已更新 —— 从下月起，每周最多可居家办公 2 天，但需提前 1 天通过 HR 系统提交远程申请。完整政策文档已分享至团队群。"], ["Hi Clara, I’m stuck on the data analysis for the sales report—some of the numbers from the regional teams don’t match the total. Could you help me cross-check the data? I’ll share the spreadsheet with you.", "嗨 Clara，我在做销售报告的数据分析时遇到了问题 —— 部分区域团队的数据与总数对不上。能否帮忙核对一下？我把表格分享给你。"], ["Emergency update: the office building will be closed tomorrow due to a planned fire safety inspection. We’ll switch to remote work for the day—please make sure you have access to all necessary files and join the morning sync call via Zoom as usual.", "紧急通知：因计划中的消防安全检查，办公楼明天关闭。当天将转为远程办公 —— 请确保能访问所有必要文件，并照常通过 Zoom 参加上午的同步会议。"], ["Hi Mark, the client just called to say they need to move up the project deadline by 1 week—they have an internal launch they want to align with. Do you think we can adjust the team’s workload to meet the new timeline? Let’s discuss it in the 3 PM meeting.", "嗨 Mark，客户刚来电说要将项目截止日期提前 1 周 —— 他们有一个内部上线计划，想与之对齐。你认为我们能否调整团队工作量以满足新时间线？我们在下午 3 点的会议中讨论此事。"], ["Team, I just received word that our main supplier has a production delay—they can’t deliver the parts until the end of next week instead of this Friday. Let’s meet at 2 PM today to discuss alternative suppliers or adjust the project schedule.", "团队通知：刚收到消息，我们的主要供应商出现生产延迟 —— 零件交付时间从本周五推迟至下周末。今天下午 2 点开会，讨论备选供应商或调整项目计划。"], ["Hi Olivia, I need to reschedule our 10 AM meeting today—I just got pulled into an urgent call with the CEO. Can we meet at 2 PM instead? If that’s not possible, let me know your availability this afternoon.", "嗨 Olivia，我需要重新安排今天上午 10 点的会议 —— 刚被 CEO 临时叫去开紧急会议。我们改到下午 2 点可以吗？若不行，请告知我你今天下午的可用时间。"], ["Reminder: the annual cybersecurity training is mandatory for all employees and must be completed by the end of this month. The training link was sent to your work email last week—if you haven’t started it yet, please make time for it this week.", "提醒：年度网络安全培训对所有员工为必修项，需在本月底前完成。培训链接已于上周发送至工作邮箱 —— 若尚未开始，请本周抽空完成。"], ["Hi Nathan, the conference room projector isn’t working for the client presentation in 30 minutes—do you have a spare portable projector we can use? I’ve already asked facilities, but they’re tied up with another issue.", "嗨 Nathan，距离客户演示还有 30 分钟，会议室的投影仪坏了 —— 你们有备用的便携式投影仪吗？我已经问过设施团队了，但他们正忙着处理另一个问题。"], ["Great news: Nathan lent us a portable projector, and it’s set up in the conference room. Let’s do a quick test 10 minutes before the client arrives to make sure everything works.", "好消息：Nathan 借了我们一台便携式投影仪，已经在会议室安装好了。客户到达前 10 分钟，我们快速测试一下，确保一切正常。"], ["Team, we’ve been asked to prepare a 5-minute update on our project for the company all-hands meeting next week. I’ll put together the key points, but please send me your team’s latest progress by EOD today so I can include it.", "团队通知：公司全员大会下周召开，要求我们准备 5 分钟的项目进展汇报。我会整理核心要点，但请在今天下班前将你们团队的最新进展发给我，以便纳入汇报。"], ["Hi Zoe, I noticed the task I assigned to you last week is still marked as “in progress”—is everything okay? Do you need additional support or more time to complete it? Let’s touch base this afternoon.", "嗨 Zoe，我发现上周分配给你的任务仍标记为 “进行中”—— 一切都顺利吗？是否需要额外支持或更多时间完成？我们今天下午沟通一下。"], ["Emergency: there’s a water leak in the server room—IT has shut down the main power to prevent damage. We’ll update everyone on when systems will be back online, but for now, avoid using company software or tools.", "紧急情况：服务器机房出现漏水 ——IT 已切断主电源以防损坏。系统恢复时间将另行通知，目前请避免使用公司软件或工具。"], ["Update on the server room leak: the issue has been fixed, and IT is restarting the systems. They expect everything to be back online in 1 hour. We’ll send a confirmation email once all tools are available again.", "服务器机房漏水更新：问题已解决，IT 正在重启系统。预计 1 小时内恢复所有服务。所有工具可用后，我们会发送确认邮件。"], ["Hi Jake, I need to cancel our 2 PM meeting tomorrow—I have to travel to the client’s office for an unexpected site visit. Can we reschedule for early next week? Let me know what days work for you.", "嗨 Jake，我需要取消明天下午 2 点的会议 —— 不得不临时去客户办公室进行现场拜访。我们能否改到下周一早？请告知我你哪些天有空。"], ["Team, the marketing team just shared the new brand guidelines—all future presentations, emails, and documents must follow the updated logo, color scheme, and font. I’ve uploaded the guidelines to the shared drive, so please review them before creating new materials.", "团队通知：营销团队刚分享了新的品牌规范 —— 未来所有演示文稿、邮件和文档需使用更新后的 logo、配色和字体。规范已上传至共享盘，请在制作新材料前查看。"], ["Hi Lydia, do you have the contact info for the graphic designer we worked with last quarter? We need to hire them again for the new product’s packaging design. I checked my emails, but I can’t find their details.", "嗨 Lydia，你有上季度合作过的平面设计师的联系方式吗？我们需要再次聘请他们设计新产品的包装。我查了邮件，但没找到他们的信息。"], ["Reminder: tomorrow is the last day to sign up for the team-building workshop next month. The workshop will cover conflict resolution and cross-team collaboration—if you’re interested, sign up via the HR portal before EOD tomorrow.", "提醒：明天是报名下月团队建设工作坊的最后一天。工作坊内容包括冲突解决和跨团队协作 —— 若感兴趣，请在明天下班前通过 HR 门户报名。"], ["Hi Kevin, the client is asking for a detailed breakdown of the project costs—they want to see how much we spent on each phase (design, development, testing). Can you pull this data from the finance system and send it to me by noon?", "（嗨 Kevin，客户要求提供项目成本的详细明细 —— 想了解每个阶段"], ["Team, we have a new team member joining the dev team next week: Liam. He has 5 years of experience in cloud development, which will help with our current project. Let’s welcome him in the team chat and make sure he has all the access he needs on his first day.", "团队通知：下周有新成员 Liam 加入开发团队。他拥有 5 年云开发经验，将对我们当前的项目有所帮助。请在团队群中欢迎他，并确保他入职当天能获取所有必要的访问权限。"], ["Emergency update: the client just informed us that their internal deadline has been moved up by 2 weeks, so we need to accelerate our project by the same amount. Let’s prioritize the core features first—we’ll discuss which non-essential tasks to delay in the 11 AM meeting.", "紧急更新：客户刚通知我们，他们的内部截止日期提前了 2 周，因此我们的项目也需同步提速。首先优先处理核心功能 —— 上午 11 点的会议中，我们讨论哪些非必要任务可以推迟。"], ["Hi Hannah, I’m having trouble accessing the client’s shared folder—every time I try to open it, I get a permission error. Could you check if my access was revoked, or ask the client to re-invite me? I need to get the latest feedback documents.", "嗨 Hannah，我无法访问客户的共享文件夹 —— 每次尝试打开都会出现权限错误。能否帮忙确认我的访问权限是否被取消，或请客户重新邀请我？我需要获取最新的反馈文档。"], ["Team, the office will be closed early this Friday (at 3 PM) for a company-wide cleaning. Please plan your work accordingly—make sure to save all files and lock your desk before leaving. We’ll resume normal hours on Monday.", "（团队通知：本周五办公室将提前关闭"], ["Hi Patrick, the presentation you shared for the client meeting has a few typos in the pricing section. Could you fix them and re-share the updated version by 9 AM tomorrow? The client will be reviewing the presentation first thing in the morning.", "嗨 Patrick，你为客户会议分享的演示文稿中，定价部分有几处拼写错误。能否修改后在明天上午 9 点前重新分享更新版本？客户明天一早就要评审这份演示文稿。"], ["Update: the client just confirmed they can’t make the 2 PM meeting tomorrow—they’ve asked to reschedule for Thursday at 10 AM. I’ve updated the calendar invite and notified all attendees, but please let me know if you can’t attend the new time.", "更新通知：客户刚确认明天下午 2 点的会议无法参加 —— 请求改到周四上午 10 点。我已更新日历邀请并通知所有参会者，若无法参加新时间，请告知我。"], ["Team, IT is rolling out a software update to all company laptops tonight—your laptop will restart automatically once the update is complete. Please save all work before leaving the office today to avoid data loss.", "团队通知：IT 今晚将为所有公司笔记本推送软件更新 —— 更新完成后电脑会自动重启。今天离开办公室前，请保存所有工作以防数据丢失。"], ["Hi Emma, I need to borrow the project timeline you created last week—I’m presenting to the leadership team tomorrow and want to reference it. Could you send it to me via email? I’ll make sure to credit you in the presentation.", "嗨 Emma，我需要借你上周制作的项目时间线 —— 明天要向领导团队汇报，想引用这份材料。能否通过邮件发给我？我会在汇报中注明出处。"], ["Emergency: one of our team members has tested positive for the flu, and they were in the office yesterday. Facilities is sanitizing all common areas, but if you feel unwell, please stay home and notify HR. We’ll arrange for remote work if needed.", "紧急通知：我们团队有一名成员流感检测呈阳性，昨天曾在办公室。设施团队正在对所有公共区域消毒，若你感到不适，请居家休息并通知 HR。如需，我们会安排远程办公。"], ["Hi Sam, the client is requesting a follow-up call to discuss the feedback we sent last week. Can you join the call with me? It’s scheduled for 11 AM tomorrow, and I’ll share the agenda and feedback document with you later today.", "嗨 Sam，客户要求召开跟进会议，讨论我们上周发送的反馈。你能和我一起参加吗？会议定于明天上午 11 点，今天晚些时候我会把议程和反馈文档分享给你。"], ["Reminder: the deadline for nominating team members for the quarterly “Excellence Award” is this Friday. If you know someone who has gone above and beyond (e.g., met tight deadlines, supported colleagues), submit your nomination via the HR website.", "（提醒：季度 “卓越奖” 的团队成员提名截止日期是本周五。若你认识表现突出的同事"], ["Team, we’ve received feedback from the client that the latest demo lacked details on the product’s security features. Let’s add a 5-minute section on security to the next demo—Tom, could you prepare the content, and Sophie, you can handle the slides?", "团队通知：客户反馈最新演示中，产品安全功能的细节不足。下次演示需增加 5 分钟的安全功能讲解 ——Tom，能否负责准备内容？Sophie，你可以处理幻灯片部分。"], ["Hi Rachel, I’m running late for the 9 AM meeting due to a traffic jam—could you start the meeting without me and update me on the key points once I arrive? I should be there in 15 minutes.", "嗨 Rachel，因交通堵塞，我赶不上上午 9 点的会议了 —— 能否先开始会议，等我到了再向我同步核心要点？我大约 15 分钟后到。"], ["Update on the traffic: I’m now 5 minutes away from the office. Thanks for starting the meeting—please hold off on discussing the project timeline until I arrive, as I have the latest updates.", "交通情况更新：我现在距离办公室还有 5 分钟路程。感谢先开启会议 —— 关于项目时间线的讨论，请等我到了再进行，我有最新的进展要同步。"], ["Team, the finance team has requested that all project expenses be categorized by “direct” (e.g., materials, external services) and “indirect” (e.g., office supplies, meeting costs) starting next month. I’ve shared a guide on how to classify expenses in the team folder—please review it before submitting next month’s reports.", "（团队通知：财务团队要求从下月起，所有项目支出需按 “直接支出”"], ["Hi Daniel, I need to confirm the status of the client contract—did we send the final version to them last week? The client just emailed asking when they can expect it, and I want to make sure I give them an accurate update.", "嗨 Daniel，我需要确认客户合同的进度 —— 上周我们是否已将最终版本发送给他们？客户刚发邮件询问何时能收到，我想确保给他们准确的回复。"], ["Emergency: the client’s main contact just called to say they need to review the contract by EOD today (instead of next week) because their legal team is only available today. Can we finalize the last few edits and send it within the next 2 hours? Let’s prioritize this over other tasks for now.", "（紧急情况：客户的主要对接人刚来电说，因法务团队仅今日有空，需在今天下班前"], ["Great news: we’ve finalized the contract edits and sent it to the client. I’ve also followed up with a short email summarizing the key changes, so they can focus on those during their review.", "好消息：合同修改已完成并发送给客户。我还补发了一封简短邮件，总结核心修改内容，方便他们评审时重点关注。"], ["Hi Grace, do you have time to help me practice the client presentation tomorrow? I want to make sure the flow is smooth and that I’m covering all the key points. We could run through it once after the 3 PM meeting.", "嗨 Grace，你有空帮我演练明天的客户演示吗？我想确保演示流程顺畅，且覆盖所有核心要点。我们可以在下午 3 点会议结束后过一遍。"], ["Team, the office printer has been replaced with a new model—IT will hold a 15-minute training session tomorrow at 10 AM to show how to use its new features (e.g., wireless printing, double-sided scanning). If you use the printer regularly, please attend.", "（团队通知：办公室打印机已更换为新型号 ——IT 将于明天上午 10 点开展 15 分钟培训，讲解新功能使用方法"], ["Hi Ethan, I noticed the shared project timeline hasn’t been updated in a week—are there any delays we should know about? The leadership team will ask about progress in Friday’s meeting, so we need to make sure the timeline reflects the latest status.", "嗨 Ethan，我发现共享项目时间线已有一周未更新 —— 是否存在需要同步的延迟情况？领导团队将在周五会议中询问进展，需确保时间线能反映最新状态。"], ["Reminder: tomorrow is the deadline to submit your vacation requests for the end of the year. HR needs to finalize the team’s vacation schedule by next week to ensure coverage during the holiday season. If you haven’t submitted yet, do so via the HR system today.", "提醒：明天是提交年底休假申请的截止日期。HR 需在下周前确定团队休假安排，确保节假日期间工作有人对接。若尚未提交，请今天通过 HR 系统完成申请。"], ["Hi Lily, the client just shared additional data they want included in the analysis report—they sent it as an Excel file, but some of the columns are unlabeled. Could you help me clean up the data and add labels? I need to incorporate it into the report by tomorrow morning.", "嗨 Lily，客户刚分享了需要纳入分析报告的额外数据 —— 文件是 Excel 格式，但部分列未标注。能否帮我整理数据并添加标签？我需在明天上午前将其融入报告。"], ["Emergency update: the venue for next week’s client workshop just canceled our booking due to a sudden maintenance issue. I’m currently searching for alternative venues, but if anyone has suggestions for a conference room that holds 20 people near the city center, please share them ASAP.", "紧急更新：因突发维护问题，下周客户研讨会的场地方取消了我们的预订。我正在寻找备选场地，但如果有人知道市中心附近可容纳 20 人的会议室，麻烦尽快推荐。"], ["Update on the workshop venue: I’ve booked a conference room at the hotel across from our office—it’s available on the original date and time, and has all the equipment we need (projector, whiteboard). I’ll send the new address to all attendees this afternoon.", "（研讨会场地更新：我已在办公室对面的酒店预订了会议室 —— 时间与原计划一致，且配备所需设备"], ["Hi Noah, I need to borrow the market research report you completed last month—we’re using it to prepare a proposal for a new client in the same industry. Could you send me a copy via email? I’ll make sure to reference your work in the proposal.", "嗨 Noah，我需要借你上月完成的市场调研报告 —— 我们要为同行业的新客户准备提案，会用到这份材料。能否通过邮件发我一份？我会在提案中注明引用你的成果。"], ["Team, we’re switching to a new video conferencing tool next week (from Zoom to Teams) because it integrates better with our project management software. IT will send out login details and a quick tutorial tomorrow—please set up your account by the end of the week to avoid delays in meetings.", "团队通知：下周我们将从 Zoom 切换到新的视频会议工具 Teams，因其与我们的项目管理软件集成更顺畅。IT 明天会发送登录信息和简易教程 —— 请在本周末前完成账户设置，避免影响会议。"], ["Hi Chloe, the 2 PM meeting with the design team has been canceled—they need more time to finalize the mockups. Can we reschedule for Thursday at the same time? I’ll check with the design team to confirm, but let me know if Thursday doesn’t work for you.", "嗨 Chloe，下午 2 点与设计团队的会议已取消 —— 他们需要更多时间敲定设计稿。我们改到周四同一时间可以吗？我会和设计团队确认，但如果周四你不方便，请告知我。"], ["Reminder: the company’s annual feedback survey is open until Friday. This survey helps leadership understand what’s working well and what needs improvement, so please take 10 minutes to complete it honestly. The link is in your work email inbox.", "提醒：公司年度反馈调查将开放至周五。该调查有助于领导层了解优势与待改进之处，请花 10 分钟如实填写。链接已发送至你的工作邮箱。"], ["Hi Lucas, I’m having trouble with the new project management tool— I can’t assign tasks to team members. Did you encounter this issue when setting up your account? If so, how did you fix it?", "嗨 Lucas，我在使用新的项目管理工具时遇到了问题 —— 无法向团队成员分配任务。你设置账户时是否遇到过类似情况？如果是，你是如何解决的？"], ["Team, the pantry will be restocked with snacks and drinks every Monday morning from now on—if you have any preferences (e.g., gluten-free options, herbal tea), please share them in the team chat by EOD today, and I’ll pass them along to facilities.", "（团队通知：从现在起，茶水间每周一上午会补充零食和饮品 —— 若你有偏好需求"], ["Emergency: the client just informed us that the product demo scheduled for Friday needs to include a live test of the payment function—we didn’t plan for this, and the payment gateway isn’t fully integrated yet. Can the dev team prioritize finishing the integration by Thursday? We’ll need a full day to test it before the demo.", "紧急情况：客户刚通知我们，周五的产品演示需包含支付功能的实时测试 —— 我们此前未做此计划，且支付网关尚未完全集成。开发团队能否优先在周四前完成集成？演示前我们需要一整天时间进行测试。"], ["Update on the payment gateway integration: the dev team will work overtime tomorrow to finish it, and we’ll conduct a test on Thursday morning. If the test is successful, we’ll be ready for the live demo on Friday. I’ll send a daily update on the progress.", "支付网关集成更新：开发团队明天将加班完成集成，周四上午进行测试。若测试成功，周五的实时演示即可正常开展。我会每日同步进展情况。"], ["Hi Mia, I need to cancel our 11 AM catch-up today—I just got assigned an urgent task that’s due by EOD. Can we reschedule for tomorrow at the same time? I really want to hear about your progress on the client project.", "嗨 Mia，我需要取消今天上午 11 点的沟通会 —— 刚接到一项紧急任务，需在今天下班前完成。我们改到明天同一时间可以吗？我非常想了解你在客户项目上的进展。"], ["Team, we’ve been asked to reduce our office supply orders by 10% next quarter to cut costs. Please only order essential items (e.g., printer paper, pens) and avoid overstocking. I’ve shared a list of approved items in the team folder.", "（团队通知：为节省成本，要求我们下季度将办公用品订单减少 10%。请仅订购必需品"], ["Hi Owen, the client’s legal team sent back the contract with a few revisions—they want to adjust the liability clause and extend the warranty period. Could you review the revisions and let me know if they’re acceptable? I need to respond to the client by the end of the day.", "嗨 Owen，客户法务团队已将合同修改后退回 —— 他们希望调整责任条款并延长质保期。能否帮忙评审这些修改，告知是否可接受？我需在今天下班前回复客户。"], ["Reminder: the team’s monthly progress meeting is tomorrow at 3 PM—please come prepared with a 2-minute update on your tasks (what you completed, what’s next, and any blockers). If you can’t attend, send your update to me in advance, and I’ll share it during the meeting.", "（提醒：团队月度进展会议将于明天下午 3 点召开 —— 请准备 2 分钟的任务进展汇报"], ["Hi Sophia, I noticed you haven’t submitted your timesheet for last week—finance needs all timesheets by EOD today to process payroll. If you’re having trouble accessing the timesheet system, let me know, and I’ll help you troubleshoot.", "嗨 Sophia，我发现你尚未提交上周的工时表 —— 财务需在今天下班前收集所有工时表以处理薪资。若你在访问工时表系统时遇到问题，请告知我，我会帮你排查。"], ["Team, the office will be hosting a “bring your own lunch” networking session next Wednesday at 12:30 PM in the conference room. It’s a chance to meet colleagues from other departments—if you’re interested in attending, just bring your lunch and join in. No need to sign up.", "团队通知：下周三中午 12:30，办公室将在会议室举办 “自带午餐” 社交活动。这是认识其他部门同事的好机会 —— 若感兴趣，只需带上午餐参加即可，无需报名。"], ["Hi Jackson, I need to borrow your notes from yesterday’s leadership meeting—I had to leave early and missed the discussion on next quarter’s budget. Could you share them with me via email? I’ll return the favor if you ever need notes from my meetings.", "嗨 Jackson，我需要借你昨天领导会议的笔记 —— 我提前离场，错过了关于下季度预算的讨论。能否通过邮件发我一份？若你今后需要我参加的会议笔记，我也会帮你。"], ["Emergency update: a severe storm is expected to hit the area tomorrow, and the government has advised working from home if possible. We’ll switch to remote work for the day—please ensure you have all necessary files downloaded and join the morning meeting via Teams as usual.", "紧急更新：预计明天本地区将遭遇强风暴，政府建议尽可能居家办公。当天将转为远程办公 —— 请确保下载所有必要文件，并照常通过 Teams 参加上午的会议。"], ["Update on tomorrow’s work arrangement: due to the storm warning, the office will be closed tomorrow, and all teams will work remotely. IT has confirmed that all systems will be accessible from home, but if you have connectivity issues, contact the IT helpdesk via phone.", "明天工作安排更新：受风暴预警影响，办公室明天关闭，所有团队远程办公。IT 已确认所有系统可居家访问，但若遇到网络问题，请通过电话联系 IT 服务台。"], ["Hi Zoe, I need to confirm the delivery date for the client’s order—did the supplier say it would arrive on the 15th or the 20th? The client is following up, and I want to make sure I don’t give them the wrong date.", "嗨 Zoe，我需要确认客户订单的交货日期 —— 供应商说的是 15 号还是 20 号？客户正在跟进，我想确保不会告知错误日期。"], ["Team, we’re launching a new internal feedback tool next month that lets you share suggestions or report issues anonymously. HR will send a demo video next week to show how it works—this tool is designed to make it easier for everyone to contribute to improving the workplace.", "团队通知：下月我们将推出新的内部反馈工具，可匿名分享建议或报告问题。HR 下周会发送演示视频讲解使用方法 —— 该工具旨在让大家更便捷地为改善工作环境出一份力。"], ["Hi Tyler, the client just asked for a custom report that shows sales data by region and product category. I know you’ve created similar reports before—could you help me set up the template? I’ll handle inputting the data once the template is ready.", "嗨 Tyler，客户刚要求提供一份按区域和产品类别展示销售数据的定制报告。我知道你之前做过类似报告 —— 能否帮我搭建模板？模板就绪后，我会负责录入数据。"], ["Reminder: the deadline for submitting your professional development plan for next year is next Friday. This plan should include courses, workshops, or certifications you want to pursue to grow your skills. If you need help drafting it, schedule a meeting with your manager this week.", "提醒：提交明年职业发展计划的截止日期是下周五。该计划应包含你为提升技能想要参加的课程、研讨会或认证项目。若起草时需要帮助，本周可与你的直属领导预约会议沟通。"], ["Hi Isabella, I’m running out of time to finish the client proposal—could you help me write the “project timeline” section? I’ve outlined the key milestones in a document, and I’ll send it to you right away. We need to submit the proposal by 5 PM, so I appreciate your help.", "嗨 Isabella，我没时间完成客户提案了 —— 能否帮我撰写 “项目时间线” 部分？我已在文档中列出核心里程碑，马上发给你。提案需在下午 5 点前提交，非常感谢你的帮助。"], ["Team, the IT team will be performing maintenance on the shared drive this evening from 8 PM to 10 PM—during this time, you won’t be able to access or save files to the drive. Please make sure to finish any work that requires the shared drive before 8 PM to avoid data loss.", "团队通知：IT 团队今晚 8 点至 10 点将对共享盘进行维护 —— 期间无法访问或保存文件至共享盘。请确保在 8 点前完成所有需使用共享盘的工作，以防数据丢失。"], ["Hi Gabriel, the client’s presentation slides need to be converted to PDF format before sending—some of the fonts aren’t compatible with their software. Could you do that for me? I’m in back-to-back meetings and don’t have time to handle it.", "嗨 Gabriel，客户的演示幻灯片在发送前需转换为 PDF 格式 —— 部分字体与他们的软件不兼容。能否帮我转换？我一直在连续开会，没时间处理。"], ["Emergency: the client just called to say they received the wrong version of the proposal—we sent the draft instead of the final approved one. I need to send the correct version immediately, but I can’t find it in my email. Does anyone have a copy of the final proposal saved? Please share it with me ASAP.", "紧急情况：客户刚来电说收到的提案版本有误 —— 我们发的是草稿，而非最终审批版。我需要立即发送正确版本，但在邮箱中找不到。有人保存了最终提案的副本吗？请尽快分享给我。"], ["Great news: I found the final proposal in the shared drive and sent it to the client. I also apologized for the mistake and offered to schedule a quick call to answer any questions they have about the final version.", "好消息：我在共享盘中找到了最终提案，并已发送给客户。我还为此次失误致歉，并提出可安排简短会议，解答他们关于最终版本的疑问。"], ["Hi Victoria, I need to reschedule our weekly 10 AM check-in to 11 AM tomorrow—I have an early meeting with the supplier that starts at 9 AM and might run over. Let me know if 11 AM doesn’t work for you, and we can find another time.", "嗨 Victoria，我需要将我们每周上午 10 点的沟通会改到明天上午 11 点 —— 我和供应商有一场 9 点开始的早会，可能会超时。若 11 点你不方便，请告知我，我们再协调其他时间。"], ["Team, we’ve received confirmation that the industry conference we’re attending next month will be held in Hall B of the convention center (not Hall A as originally planned). I’ve updated the meeting agenda and travel documents—please double-check the location before heading to the conference to avoid getting lost.", "（团队通知：已确认我们下月参加的行业会议将在会议中心 B 厅举办"], ["Hi Benjamin, I’m struggling to format the data table in the client report—it keeps overlapping with the text. You’re good at formatting documents—could you take a quick look at it? I’ll share the report file with you, and I can adjust other parts while you fix the table.", "嗨 Benjamin，我在调整客户报告中的数据表格式时遇到困难 —— 它总是和文本重叠。你很擅长文档排版，能否帮忙快速查看一下？我把报告文件分享给你，你调整表格时，我可以处理其他部分。"], ["Reminder: tomorrow is the last day to contribute to the team’s holiday gift exchange—if you want to participate, please bring a wrapped gift (under $20) to the pantry by 5 PM. We’ll draw names and distribute gifts during Friday’s team lunch.", "（提醒：明天是参与团队节日礼物交换的最后一天 —— 若想参加，请在下午 5 点前将包装好的礼物"], ["Hi Evelyn, the client just shared a new set of brand guidelines that we need to follow for their upcoming campaign—they changed the primary color and font. Could you update the draft marketing materials to match the new guidelines? I’ll send you the guidelines document right away, and we need to finish the updates by Wednesday.", "嗨 Evelyn，客户刚分享了一套新的品牌规范，要求用于即将开展的活动 —— 他们调整了主色调和字体。能否将营销材料草稿更新为符合新规范的版本？我马上发送规范文档给你，需在周三前完成更新。"], ["Emergency update: the external designer we hired for the client’s packaging just canceled last minute due to a personal emergency. We need to find a replacement within 2 days to meet the project deadline. If anyone has contacts with freelance designers specializing in packaging, please share their info with me ASAP.", "紧急更新：我们为客户包装设计聘请的外部设计师因突发个人原因临时取消合作。为赶上项目截止日期，需在 2 天内找到替代人选。若有人认识专注于包装设计的自由设计师，请尽快将其联系方式分享给我。"], ["Update on the packaging designer: I’ve connected with a freelance designer recommended by the marketing team—they have 3 years of packaging experience and can start working on the project tomorrow. I’ll share their portfolio with you later today to confirm they’re a good fit.", "包装设计师进展更新：我已联系上营销团队推荐的自由设计师 —— 他们有 3 年包装设计经验，明天即可启动项目。今天晚些时候我会分享他们的作品集给大家，确认是否合适。"], ["Hi Henry, I need to borrow the client feedback summary you compiled last week—I’m preparing a presentation for the leadership team and want to reference the key pain points mentioned by the client. Could you send it to me via email? I’ll make sure to highlight your work in the presentation.", "嗨 Henry，我需要借你上周整理的客户反馈摘要 —— 我正在为领导团队准备演示，想引用客户提到的核心痛点。能否通过邮件发我一份？我会在演示中突出你的工作成果。"], ["Team, the office’s air conditioning system will be offline for repairs this Thursday from 9 AM to 3 PM. The facilities team will provide portable fans, but it might still be warm—you’re welcome to dress casually (e.g., short sleeves) that day to stay comfortable.", "（团队通知：本周四上午 9 点至下午 3 点，办公室空调系统将停机维修。设施团队会提供便携风扇，但室内可能仍较闷热 —— 当天可随意着装"], ["Hi Sophia, I noticed the task “finalize client contract” is still marked as “pending” in the project management tool—did you encounter any issues with the legal review? We need to close this task by Friday, so let me know if you need support to push it forward.", "嗨 Sophia，我发现 “敲定客户合同” 任务在项目管理工具中仍标记为 “待处理”—— 法务评审时遇到问题了吗？我们需在周五前完成该任务，若需要协助推进，请告知我。"], ["Emergency: the client just informed us that their product launch has been moved up by 3 weeks, which means our project deadline is now October 15th (instead of November 5th). Let’s hold an emergency meeting at 4 PM today to reprioritize tasks and adjust the team’s workload—please come prepared with your current task status.", "（紧急情况：客户刚通知我们，他们的产品上线时间提前 3 周，这意味着我们的项目截止日期变为 10 月 15 日"], ["Hi everyone, I want to thank you for your flexibility and hard work during this busy period—adjusting to last-minute deadline changes isn’t easy, but your willingness to prioritize the client’s needs has been amazing. Let’s keep communicating closely over the next few weeks to ensure we meet the new deadline, and don’t hesitate to ask for help if you’re overwhelmed.", "各位，感谢大家在这段忙碌时期的灵活配合与辛勤付出 —— 应对临时变更的截止日期并不容易，但你们优先考虑客户需求的态度非常出色。未来几周，我们继续保持密切沟通，确保达成新目标；若压力过大，随时寻求帮助即可。"]];window.__KEY__="930职场英语7天冲刺700句";window.__TITLE__="9.30 职场英语7天冲刺 700句";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
