.dict-link{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px;font-weight:600}
.dict-link:hover{background:rgba(139,156,249,.25)}

.dict-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

.dict-wronglist{margin-top:26px;text-align:left}

.dict-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}

/* ---- 学习进度 & 归档 ---- */
.pctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;

ous quarter, which needs attention.", "我们的客户留存率较上季度下降了 3%，这一点需要关注。"], ["The data shows that our average transaction value has increased by 8% since we launched the new promotion.", "数据显示，自推出新促销活动以来，我们的平均客单价增长了 8%。"], ["This line chart depicts the monthly fluctuations in our production output over the past year.", "这张折线图展示了过去一年我们月产量的波动情况。"], ["Please take a look at the pie chart—it shows that offline sales account for 60% of our total revenue.", "请看这张饼图，它显示线下销售占我们总收入的 60%。"], ["Our inventory turnover rate has improved by 12% this quarter, thanks to the optimized stock management.", "得益于库存管理优化，本季度我们的库存周转率提升了 12%。"], ["The data dashboard updates in real time, so you can check the latest key metrics at any time.", "数据面板实时更新，您可以随时查看最新的关键指标。"], ["Compared to the industry average, our employee productivity is 15% higher.", "与行业平均水平相比，我们的员工生产率高出 15%。"], ["This bar chart compares our performance across different regions—North China has the highest sales volume.", "这张柱状图对比了我们在不同区域的表现，华北地区销量最高。"], ["Our cost per customer acquisition has decreased by 5% this month, which is a positive sign for our marketing efficiency.", "本月我们的客户获取成本下降了 5%，这对我们的营销效率来说是积极信号。"], ["Our sales data reveals a strong performance in the North American market.", "销售数据显示我们在北美市场表现强劲。"], ["We've experienced a 15% increase in product sales in the past month.", "过去一个月，我们的产品销售额增长了 15%。"], ["This slide highlights our top-selling products this quarter.", "这一页重点展示了我们本季度的畅销产品。"], ["Our online sales have outpaced our retail sales for the first time.", "我们的在线销售首次超过了零售销售。"], ["The sales growth in the Asia-Pacific region has been particularly impressive.", "亚太地区的销售增长尤其令人瞩目。"], ["Here is a comparison of our sales channels.", "这是我们销售渠道的对比。"], ["The conversion rate from leads to sales has improved by 5%.", "从潜在客户到销售的转换率提高了 5%。"], ["This table summarizes our sales performance by product category.", "这张表总结了各产品类别的销售表现。"], ["In the past quarter, our B2B sales accounted for 70% of total sales, while B2C accounted for 30%.", %。"], ["We've received a tax rebate of $200,000 this quarter, which has positively impacted our net profit.", "本季度我们获得了 20 万美元的退税，对净利润产生了积极影响。"], ["The ratio of current assets to current liabilities is 1.8, indicating good short-term solvency.", "流动资产与流动负债的比率为 1.8，表明短期偿债能力良好。"], ["Our dividend payout ratio this year is 30%, balancing the interests of shareholders and the company's future development.", "今年我们的股息支付率为 30%，平衡了股东利益与公司未来发展。"], ["The financial audit report confirms that our financial statements comply with international accounting standards.", "财务审计报告确认，我们的财务报表符合国际会计准则。"], ["Let's examine the recent customer feedback and satisfaction metrics.", "接下来我们来看一下最近的客户反馈和满意度指标。"], ["Customer satisfaction has improved by 8% since our last survey.", "自上次调查以来，客户满意度提高了 8%。"], ["We have received a lot of positive reviews about our new product line.", "我们的新产品线收到了很多好评。"], ["The net promoter score indicates a strong loyalty among our customers.", "净推荐值显示我们的客户忠诚度很高。"], ["This word cloud represents the most common feedback themes.", "这个词云代表了最常见的反馈主题。"], ["We have identified key areas for improvement based on customer feedback.", "我们根据客户反馈确定了需要改进的关键领域。"], ["Our customer support team has resolved 95% of the issues within 24 hours.", "我们的客户支持团队在 24 小时内解决了 95% 的问题。"], ["Here is a breakdown of customer feedback by product category.", "这是按产品类别划分的客户反馈分析。"], ["In the latest customer survey, 85% of respondents said they would recommend our products to others.", "在最新的客户调查中，85% 的受访者表示会向他人推荐我们的产品。"], ["The most frequent positive feedback from customers is about the user-friendly design of our software.", "客户最常见的正面反馈集中在我们软件的易用性设计上。"], ["We've received 12% fewer complaints about product delivery this quarter, thanks to the optimized logistics system.", "得益于物流系统优化，本季度关于产品交付的投诉减少了 12%。"], ["Customer feedback shows that 60% of users hope we can add a mobile app for easier access to our services.", "客户反馈显示，60% 的用户希望我们推出移动应用，以便更便捷地使用服务。"], ["The average response time of our customer service team has been reduced to 15 minutes, improving customer experience.", "我们客户服务团队的平均响应时间已缩短至 15 分钟，提升了客户体验。"], ["A follow-up survey with customers who previously complained shows that 90% are satisfied with the resolution results.", "对之前投诉客户的跟进调查显示，90% 的客户对问题解决结果感到满意。"], ["Customer feedback about our after-sales service has improved by 10% since we launched the dedicated service hotline.", "自开通专属服务热线以来，客户对我们售后服务的反馈改善了 10%。"], ["This bar chart compares customer satisfaction scores across different age groups—users aged 25-35 gave the highest rating.", "这张柱状图对比了不同年龄段的客户满意度得分，25-35 岁用户给出的评分最高。"], ["We've identified that the main reason for customer dissatisfaction is the long waiting time for technical support.", "我们发现客户不满意的主要原因是技术支持的等待时间过长。"], ["Positive customer reviews on e-commerce platforms have increased by 20% this month, boosting our brand reputation.", "本月电商平台上的正面客户评价增加了 20%，提升了我们的品牌声誉。"], ["Customer feedback indicates that our product pricing is reasonable, but some users hope for more frequent promotion activities.", "客户反馈显示我们的产品定价合理，但部分用户希望有更频繁的促销活动。"], ["The customer satisfaction score for our premium service package is 92%, which is 8 percentage points higher than the standard package.", "我们高端服务套餐的客户满意度得分为 92%，比标准套餐高出 8 个百分点。"], ["Let's divide the tasks according to each team member's strengths to improve efficiency.", "我们根据团队成员的优势分配任务，以提高效率吧。"], ["Can we schedule a short team meeting tomorrow morning to align on the project details?", "我们明天早上开个简短的团队会议，统一项目细节可以吗？"], ["I need your support to complete the data collection part—could you help with that?", "我需要您的支持来完成数据收集部分，能帮忙吗？"], ["Let's share our progress in the group chat every afternoon so everyone is updated.", "我们每天下午在群里分享进展，让大家都了解最新情况吧。"], ["If you encounter any problems during the task, don't hesitate to ask for help from the team.", "任务中遇到任何问题，随时向团队求助。"], ["We should hold a weekly retrospective meeting to summarize what went well and what needs improvement.", "我们应该每周开一次回顾会议，总结做得好的地方和需要改进的部分。"], ["I've shared the task list in the team drive—please check and confirm your responsibilities.", "我已在团队云盘分享了任务清单，请查看并确认自己的职责。"], ["Let's collaborate closely with the design team to ensure the product meets both functional and aesthetic requirements.", "我们和设计团队紧密协作，确保产品既满足功能需求，又符合美学要求。"], ["Each team member should update their task status in the project management tool by the end of each day.", "每位团队成员需在每天结束前，在项目管理工具中更新任务状态。"], ["Can we assign a backup person for each key task to avoid delays if someone is absent?", "我们为每个关键任务安排一名替补人员，以防有人缺席导致延误可以吗？"], ["Let's brainstorm together to find solutions to the current technical problem—everyone's ideas are welcome.", "我们一起头脑风暴，寻找当前技术问题的解决方案，欢迎大家提出想法。"], ["I'll take charge of coordinating with the external supplier, and you can focus on internal team communication.", "我负责与外部供应商协调，您可以专注于内部团队沟通。"], ["We need to synchronize our work schedules to ensure the tasks are completed in the correct order.", "我们需要同步工作进度，确保任务按正确顺序完成。"], ["If you have any suggestions to optimize the team workflow, please share them in the next meeting.", "如果您有优化团队工作流程的建议，下次会议请分享。"], ["Let's set clear deadlines for each subtask to avoid last-minute rushes.", "我们为每个子任务设定明确截止日期，避免临时赶工。"], ["I'll prepare the meeting materials for the client presentation, and could you practice the demo with me?", "我来准备客户演示的会议材料，您能和我一起演练演示内容吗？"], ["The team has made great progress this month—let's celebrate our small achievements in the team building activity.", "团队本月取得了不错的进展，我们在团建活动中庆祝一下这些小成就吧。"], ["We should establish a shared document to record common problems and their solutions for future reference.", "我们建立一个共享文档，记录常见问题及解决方案，供日后参考。"], ["Can we rotate the role of meeting facilitator to give everyone a chance to develop leadership skills?", "我们轮流担任会议主持人，让每个人都有机会培养领导能力可以吗？"], ["Let's support each other during the busy season—if you finish your tasks early, you can help teammates who are behind.", "旺季期间我们互相支持，提前完成任务的同事可以帮助进度落后的队友。"], ["I need to coordinate with the finance department to confirm the budget allocation for this project.", "我需要和财务部门协调，确认这个项目的预算分配。"], ["Could you connect me with the HR department to discuss the recruitment plan for the new team?", "您能帮我联系人力资源部门，讨论新团队的招聘计划吗？"], ["The marketing department has shared the campaign schedule—we need to align our product launch with it.", "营销部门已分享活动时间表，我们需要让产品发布与之同步。"], ["Let's schedule a joint meeting with the sales and customer service teams to discuss customer pain points.", "我们和销售、客户服务团队开个联合会议，讨论客户痛点吧。"], ["I've sent an email to the IT department requesting technical support—let's wait for their response.", "我已向 IT 部门发送邮件请求技术支持，等待他们回复。"], ["The operations department has raised concerns about the production timeline—we need to address them together.", "运营部门对生产时间表提出了疑问，我们需要一起解决。"], ["Could you provide the design specifications to the production department to ensure they understand the requirements?", "您能把设计规格发给生产部门，确保他们理解要求吗？"], ["We need to share the customer feedback with the product development department to guide future iterations.", "我们需要把客户反馈分享给产品开发部门，为后续迭代提供指导。"], ["The legal department has reviewed the contract and provided some revisions—let's discuss how to implement them.", "法务部门已审核合同并提出修改意见，我们讨论如何落实吧。"], ["I'll attend the weekly meeting of the logistics department to update them on the order status.", "我会参加物流部门的周会，向他们更新订单状态。"], ["The procurement department needs our product quantity forecast to arrange supplier orders.", "采购部门需要我们的产品数量预测，以便安排供应商订单。"], ["Could you coordinate with the quality control department to set up inspection standards for the new product?", "您能和质量控制部门协调，为新产品制定检验标准吗？"], ["The PR department wants to include our project progress in the company newsletter—let's provide them with key updates.", "公关部门想把我们的项目进展纳入公司简报，我们提供关键更新内容吧。"], ["We need to align with the administration department on the venue and equipment for the upcoming conference.", "我们需要和行政部门确认即将召开的会议的场地和设备。"], ["The R&D department has developed a new technology—let's discuss how to apply it to our current products with them.", "研发部门开发了一项新技术，我们和他们讨论如何应用到现有产品中吧。"], ["Could you follow up with the customer success department to collect recent customer usage data?", "您能跟进客户成功部门，收集最新的客户使用数据吗？"], ["The marketing department's new campaign will launch next month—we need to prepare product samples for them in advance.", "营销部门的新活动将于下月启动，我们需要提前为他们准备产品样品。"], ["We've received feedback from the sales department that customers want more product features—let's share this with the product team.", "我们收到销售部门反馈，客户希望增加更多产品功能，我们把这个情况分享给产品团队吧。"], ["The finance department needs our monthly expense report by the 5th of next month—let's make sure to submit it on time.", "财务部门要求下月 5 日前提交我们的月度费用报告，确保按时提交。"], ["Let's set up a regular communication mechanism with the logistics department to avoid delivery delays caused by information gaps.", "我们和物流部门建立定期沟通机制，避免因信息差导致交货延误。"], ["Thank you for your trust in our products—we'll do our best to meet your needs.", "感谢您对我们产品的信任，我们会尽力满足您的需求。"], ["Could you share more details about your specific requirements so we can provide a tailored solution?", "您能分享更多具体需求细节，以便我们提供定制化解决方案吗？"], ["I'm writing to update you on the progress of your order—it's currently in the final production stage.", "我写信向您更新订单进展，目前已进入最终生产阶段。"], ["We apologize for the delay in delivery and have taken measures to ensure it will be shipped within 3 working days.", "对于交货延迟我们深表歉意，已采取措施确保 3 个工作日内发货。"], ["Would it be convenient for you to have a short call tomorrow to discuss the project plan in detail?", "明天您方便简短通话，详细讨论项目计划吗？"], ["We've prepared a proposal based on your feedback—please review it and let us know if you need any adjustments.", "我们根据您的反馈准备了一份提案，请审阅，若需调整请告知。"], ["Thank you for your valuable suggestions—we'll incorporate them into the next product iteration.", "感谢您的宝贵建议，我们会将其纳入下一轮产品迭代中。"], ["To ensure the project proceeds smoothly, could you confirm the contact person for daily communication?", "为确保项目顺利推进，您能确认日常沟通的对接人吗？"], ["We're pleased to inform you that your order has been shipped, and the tracking number is [XXX].", "很高兴告知您，您的订单已发货，物流单号为 [XXX]。"], ["If you encounter any issues while using the product, please feel free to contact our customer support team at [phone/email].", "使用产品过程中若有任何问题，欢迎通过 [电话 / 邮箱] 联系我们的客户支持团队。"], ["We'd like to schedule a product demonstration for your team next week—what time works best for you?", "我们想下周为您的团队安排产品演示，您什么时间方便？"], ["We understand your concern about the project timeline and will provide weekly progress updates to keep you informed.", "我们理解您对项目工期的关注，会每周提供进度更新，让您及时了解情况。"], ["Thank you for choosing our service—we'll assign a dedicated account manager to support you throughout the cooperation.", "感谢您选择我们的服务，我们会指派专属客户经理，在整个合作过程中为您提供支持。"], ["Could you confirm if the revised contract meets your expectations, or if there are any other terms you'd like to discuss?", "您能确认修订后的合同是否符合预期，或是否有其他条款需要讨论吗？"], ["We've received your payment and will start processing your order immediately.", "我们已收到您的付款，将立即开始处理您的订单。"], ["In response to your question about product maintenance, we offer a 1-year free maintenance service for this model.", "针对您关于产品维护的疑问，该型号产品我们提供 1 年免费维护服务。"], ["We'd appreciate it if you could share your experience with our product by leaving a review on our official website.", "若您能在我们官网留下对产品的使用评价，我们将不胜感激。"], ["Due to a temporary shortage of raw materials, the delivery time may be extended by 2 days—we sincerely apologize for the inconvenience.", "由于原材料临时短缺，交货时间可能延长 2 天，对此带来的不便我们深表歉意。"], ["We're organizing a customer webinar next month to introduce new product features—would you like to register for it?", "我们下月将举办客户网络研讨会，介绍新产品功能，您想报名参加吗？"], ["After analyzing your business needs, we recommend our enterprise-level solution, which can better support your long-term development.", "分析您的业务需求后，我们推荐企业级解决方案，能更好地支持您的长期发展。"], ["Could you confirm if you can deliver 500 units of the raw material by the end of this month?", "您能确认本月底前能否交付 500 单位的原材料吗？"], ["We received the batch of goods you delivered yesterday, and some items have quality issues—could you send a representative to inspect them?", "我们收到了您昨日交付的货物，部分产品存在质量问题，您能派代表来检查吗？"], ["We'd like to adjust the order quantity from 100 to 150 units—please update the order confirmation accordingly.", "我们想将订单数量从 100 单位调整为 150 单位，请相应更新订单确认函。"], ["According to the contract, the payment will be made within 15 working days after we receive the goods—we'll process it as soon as the inspection is completed.", "根据合同，我们将在收货后 15 个工作日内付款，检验完成后会立即处理。"], ["Could you provide a detailed quotation for the new product model, including unit price, delivery cost, and payment terms?", "您能提供新产品型号的详细报价，包括单价、运费和付款条款吗？"], ["We noticed that the delivery was delayed by 3 days—please explain the reason and take measures to avoid similar issues in the future.", "我们注意到交货延迟了 3 天，请说明原因并采取措施避免未来出现类似问题。"], ["We plan to place a long-term order for this product—can you offer a preferential price based on the annual purchase volume?", "我们计划长期订购该产品，您能否根据年度采购量提供优惠价格？"], ["The packaging of the goods was damaged during transportation—please improve the packaging standard for the next delivery.", "货物在运输过程中包装受损，请在下次交付时改进包装标准。"], ["Could you share your production schedule for the next quarter so we can plan our orders in advance?", "您能分享下季度的生产计划，以便我们提前安排订单吗？"], ["We need to change the delivery address for the next order—please note that the new address is [XXX].", "我们需要更改下一批订单的交货地址，新地址为 [XXX]，请留意。"], ["According to our quality inspection standards, the product's tolerance exceeds the acceptable range—could you rework or replace the defective items?", "根据我们的质量检验标准，该产品公差超出可接受范围，您能返工或更换不合格产品吗？"], ["We'd like to visit your factory next month to inspect the production process—would that be convenient for you?", "我们想下月参观贵厂，考察生产流程，您方便吗？"], ["The payment for the last order has been transferred—please check your bank account and send the payment confirmation.", "上批订单的款项已转账，请查收银行账户并发送付款确认函。"], ["Could you confirm if you have the capacity to increase production to meet our urgent order requirement of 300 units next week?", "您能确认是否有产能提升空间，以满足我们下周 300 单位的紧急订单需求吗？"], ["We received your new product sample and are satisfied with its quality—we'll place an official order next week.", "我们收到了您的新产品样品，对质量满意，下周将下达正式订单。"], ["The delivery note you provided does not match the actual quantity of goods—please correct it and resend it as soon as possible.", "您提供的送货单与实际货物数量不符，请更正并尽快重新发送。"], ["We'd like to renew the cooperation contract for the next year—could you draft the new contract based on the previous terms and send it to us?", "我们想续签明年的合作合同，您能根据之前的条款起草新合同并发送给我们吗？"], ["Due to changes in our production plan, we need to postpone the delivery date of the order from the 15th to the 25th—please confirm if this is acceptable.", "由于我们生产计划调整，需将订单交货日期从 15 日推迟至 25 日，请确认是否可行。"], ["Could you provide a certificate of origin for the goods to facilitate our customs clearance?", "您能提供货物原产地证明，以方便我们清关吗？"], ["We noticed that the unit price of the raw material has increased by 5%—please explain the reason for the price adjustment.", "我们注意到原材料单价上涨了 5%，请说明调价原因。"], ["Do you have a few minutes to help me review this report? I'm not sure if the data analysis is correct.", "你有几分钟时间帮我审阅这份报告吗？我不确定数据分析是否正确。"], ["I heard you completed a similar project last month—could you share some experience with me?", "我听说你上个月完成了一个类似项目，能和我分享些经验吗？"], ["The meeting has been rescheduled to 2 PM tomorrow—please update your calendar accordingly.", "会议已改至明天下午 2 点，请相应更新日程。"], ["I need to borrow the project file you worked on last week—could you send it to me via email?", "我需要借用你上周处理的项目文件，能通过邮件发给我吗？"], ["Do you know where I can find the company's new expense reimbursement policy? I need to submit a reimbursement application.", "你知道在哪里能找到公司新的费用报销政策吗？我需要提交报销申请。"], ["I'm stuck on this technical problem—could you give me some advice on how to solve it?", "我在这个技术问题上卡住了，你能给些解决建议吗？"], ["Let's grab a cup of coffee after work—we can talk about the details of the collaboration project.", "下班后一起喝杯咖啡吧，我们可以聊聊合作项目的细节。"], ["I accidentally deleted the shared folder—could you help me recover it or share it with me again?", "我不小心删除了共享文件夹，你能帮我恢复或重新分享给我吗？"], ["Do you know if the IT department has fixed the printer in the meeting room? I need to print some documents for the meeting.", "你知道 IT 部门修好会议室的打印机了吗？我需要打印会议文件。"], ["I'll be on leave next Friday—could you cover my daily tasks, like replying to customer emails, while I'm away?", "我下周五请假，我不在的时候你能帮忙处理我的日常工作，比如回复客户邮件吗？"], ["The data you provided in the meeting yesterday was very helpful—thank you for preparing it so carefully.", "你昨天会议上提供的数据很有帮助，谢谢你准备得这么细致。"], ["Do you have any ideas on how to improve the team's work efficiency? We can share them in the next team meeting.", "你对如何提高团队工作效率有什么想法吗？我们可以在下次团队会议上分享。"], ["I need to confirm the meeting time with the client—could you check if tomorrow morning is available for them?", "我需要和客户确认会议时间，你能帮忙核实他们明天上午是否有空吗？"], ["The lunch order has arrived—could you help me take it to the office? There are a lot of packages.", "外卖到了，你能帮我搬到办公室吗？包裹有点多。"], ["I'm not familiar with the new software—could you show me how to use the data visualization function?", "我不熟悉这个新软件，你能演示下如何使用数据可视化功能吗？"], ["We need to finish the project draft by the end of today—let's divide the tasks and work together to meet the deadline.", "我们需要今天结束前完成项目草案，分工合作赶在截止日期前完成吧。"], ["Do you know who to contact for office supplies? We're running out of printer paper.", "你知道联系谁申领办公用品吗？我们的打印纸快用完了。"], ["I received feedback from the manager that we need to revise the proposal—let's discuss the revision points together.", "我收到经理反馈，需要修改提案，我们一起讨论修改要点吧。"], ["Thank you for covering my work while I was on sick leave—let me treat you to lunch tomorrow.", "谢谢你在我病假期间帮我处理工作，明天我请你吃午饭。"], ["Do you have the contact information of the design team's representative? I need to coordinate with them on the poster design.", "你有设计团队对接人的联系方式吗？我需要和他们协调海报设计事宜。"], ["The server has crashed, and we can't access the project data—let's contact the IT team immediately to fix it.", "服务器崩溃了，我们无法访问项目数据，立即联系 IT 团队修复。"], ["The client just called to cancel the order suddenly—we need to hold an emergency meeting to discuss how to handle the follow-up.", "客户刚才突然来电取消订单，我们需要开紧急会议讨论后续处理方式。"], ["A key team member has taken emergency leave—let's reassign their tasks to ensure the project doesn't delay.", "一名核心团队成员紧急请假，我们重新分配他们的任务，确保项目不延误。"], ["The raw material supplier informed us that they can't deliver on time—we need to find an alternative supplier as soon as possible.", "原材料供应商告知无法按时交货，我们需尽快寻找替代供应商。"], ["The conference room equipment suddenly malfunctioned—could you help find a backup meeting room while I contact the maintenance team?", "会议室设备突然故障，我联系维修团队时，你能帮忙找备用会议室吗？"], ["We found a major error in the financial report that's due in an hour—let's work together to correct it quickly.", "我们发现 1 小时后要提交的财务报告有重大错误，一起快速修正吧。"], ["The client is not satisfied with the project draft and requires revisions within 24 hours—let's prioritize this task and adjust the work schedule.", "客户对项目草案不满意，要求 24 小时内修改，我们优先处理这项任务，调整工作安排。"], ["The delivery truck was stuck in traffic due to an accident—we need to inform the client of the delay and provide a new delivery time.", "送货卡车因事故堵车，我们需告知客户延误情况，并提供新的交货时间。"], ["A computer virus infected several workstations—we need to disconnect them from the network immediately and ask IT to scan for viruses.", "电脑病毒感染了多台工作站，立即断开它们的网络连接，让 IT 进行病毒扫描。"], ["The external auditor arrived ahead of schedule—let's collect the required documents quickly and arrange a meeting room for them.", "外部审计师提前抵达，我们快速收集所需文件，并为他们安排会议室。"], ["The product sample sent to the client was damaged during transportation—we need to remake a sample and send it via express delivery.", "寄给客户的产品样品在运输中损坏，我们重新制作样品并通过快递寄出。"], ["The team's shared cloud drive is temporarily unavailable—let's use the backup local drive to continue working until it's restored.", "团队共享云盘暂时无法使用，在恢复前我们用备用本地硬盘继续工作。"], ["A customer complained about the product quality on social media—we need to respond promptly and offer a solution to avoid negative impacts.", "一名客户在社交媒体上投诉产品质量，我们需及时回应并提供解决方案，避免负面影响。"], ["The power went out in the office—let's check if it's a local outage and use backup power for important equipment if necessary.", "办公室停电了，检查是否是局部断电，必要时为重要设备启用备用电源。"], ["The key contract document was misplaced—let's search the office and check the email attachments to find a backup copy.", "关键合同文件不见了，我们在办公室寻找，并查看邮件附件找备份。"], ["The project deadline was moved up by a week—we need to increase the workload temporarily and ask for additional support if needed.", "项目截止日期提前了一周，我们暂时增加工作量，必要时申请额外支持。"], ["A new regulatory requirement was released that affects our product—we need to study the requirement and adjust the product design immediately.", "新发布的法规要求影响我们的产品，我们研究该要求并立即调整产品设计。"], ["The catering service for the upcoming conference canceled suddenly—we need to contact other catering companies to confirm a replacement.", "即将召开的会议的餐饮服务突然取消，我们联系其他餐饮公司确定替代方案。"], ["The project manager had an accident and will be on leave for a month—we need to appoint an interim manager to take charge of the project.", "项目经理发生意外，将请假一个月，我们需任命临时经理负责项目。"], ["The test results of the new product failed to meet the standard—we need to analyze the cause with the R&D team and restart the test as soon as possible.", "新产品测试结果未达标，我们和研发团队分析原因，尽快重新测试。"], ["I noticed there's a disagreement between you and the design team about the product style—let's sit down and find a solution that meets both sides' needs.", "我注意到你和设计团队在产品风格上有分歧，我们坐下来找到一个满足双方需求的解决方案吧。"], ["The sales team thinks the marketing strategy is not targeted enough, while the marketing team believes the sales feedback is unclear—let's organize a meeting to clarify each other's concerns.", "销售团队认为营销策略针对性不足，而营销团队觉得销售反馈不明确，我们组织会议澄清彼此的顾虑吧。"], ["When dealing with conflicts, we should focus on the problem itself rather than blaming each other.", "处理冲突时，我们应聚焦问题本身，而不是互相指责。"], ["You and your teammate have different opinions on the task schedule—could you listen to each other's reasons first and then reach a consensus?", "你和同事对任务时间表有不同意见，先听听彼此的理由，再达成共识可以吗？"], ["The conflict between the two departments arises from unclear responsibility division—we need to redefine the workflow to avoid similar issues.", "两个部门的冲突源于职责划分不明确，我们重新梳理工作流程，避免类似问题。"], ["When a conflict occurs, it's important to stay calm and communicate rationally instead of getting emotional.", "发生冲突时，保持冷静、理性沟通很重要，不要情绪化。"], ["The client's demand conflicts with our technical capabilities—let's explain our limitations to the client and propose an alternative plan.", "客户的需求与我们的技术能力冲突，我们向客户说明限制，提出替代方案。"], ["I understand both of you have valid points—let's find a middle ground that balances efficiency and quality.", "我理解你们双方的观点都有道理，我们找到一个平衡效率和质量的折中方案吧。"], ["The conflict between the project team and the quality control team is due to different standards—we need to unify the evaluation criteria together.", "项目团队和质检团队的冲突源于标准不同，我们一起统一评估标准。"], ["When communicating to resolve conflicts, use \"I\" statements to express your feelings instead of accusing others, such as \"I feel worried about the delay\" rather than \"You caused the delay\".", "沟通解决冲突时，用 “我” 句式表达感受，而非指责他人，比如 “我对延误感到担忧” 而非 “你导致了延误”。"], ["The two team members have a conflict over work allocation—let's reassign tasks based on their strengths to resolve the issue.", "两名团队成员在工作分配上有冲突，我们根据他们的优势重新分配任务，解决问题。"], ["The conflict between us and the supplier is about the delivery time—let's negotiate a new timeline that's acceptable to both parties.", "我们和供应商的冲突在于交货时间，协商一个双方都能接受的新时间表吧。"], ["To resolve the conflict, we should first listen to each other's needs and then find a solution that benefits both sides.", "解决冲突，我们应先倾听彼此的需求，再找到互利的解决方案。"], ["The conflict in the meeting arose from miscommunication—let's restate the key points to ensure everyone has the same understanding.", "会议中的冲突源于沟通误解，我们重新阐述关键点，确保大家理解一致。"], ["The design team and the production team have conflicting views on the product structure—let's invite a technical expert to provide professional advice.", "设计团队和生产团队对产品结构有分歧，邀请技术专家提供专业建议吧。"], ["When a conflict can't be resolved by the two parties alone, it's necessary to ask a third party to mediate impartially.", "当双方无法自行解决冲突时，需要请第三方公正调解。"], ["The conflict between the new employee and the old employee is due to different work habits—let's help them understand each other's work styles and adapt.", "新老员工的冲突源于工作习惯不同，我们帮助他们了解彼此的工作方式并适应。"], ["The client's revised demand conflicts with the project budget—let's calculate the additional cost and discuss with the client whether to adjust the budget or the demand.", "客户修改的需求与项目预算冲突，我们核算额外成本，和客户讨论是调整预算还是需求。"], ["To avoid conflicts, we should clarify expectations and responsibilities at the beginning of the cooperation.", "为避免冲突，合作初期我们就应明确预期和职责。"], ["The conflict between the marketing team and the sales team over the promotion effect—let's analyze the data together to evaluate the actual effect objectively.", "营销团队和销售团队对推广效果有冲突，我们一起分析数据，客观评估实际效果。"], ["We need to assess the risk of cost overrun in the project and formulate a contingency plan in advance.", "我们需要评估项目成本超支的风险，并提前制定应急计划。"], ["The market demand for our product may decline in the next quarter—we should develop a new marketing strategy to respond to this risk.", "下季度我们产品的市场需求可能下降，我们应制定新的营销策略应对该风险。"], ["The dependence on a single supplier increases the supply chain risk—we plan to develop 2-3 alternative suppliers.", "依赖单一供应商增加了供应链风险，我们计划开发 2-3 家备选供应商。"], ["The new technology we're using has technical uncertainty—we need to conduct more tests to reduce the risk of failure.", "我们使用的新技术存在技术不确定性，需要进行更多测试，降低失败风险。"], ["The change in government policies may affect the project approval—we should pay close attention to policy trends and adjust the project plan in time.", "政府政策变化可能影响项目审批，我们密切关注政策动态，及时调整项目计划。"], ["The risk of data leakage in the project is high—we need to strengthen data encryption and access control measures.", "项目数据泄露风险较高，我们加强数据加密和访问控制措施。"], ["The key team members may resign during the project—we should arrange cross-training to ensure the project can continue smoothly.", "项目期间核心团队成员可能离职，我们安排交叉培训，确保项目能顺利推进。"], ["The global economic downturn may reduce the client's budget—we should prepare a low-cost alternative proposal to deal with this risk.", "全球经济下行可能减少客户预算，我们准备低成本的替代方案应对该风险。"], ["We need to establish a risk monitoring mechanism to identify potential risks in the project in a timely manner.", "我们需要建立风险监控机制，及时发现项目中的潜在风险。"], ["The delay in the delivery of key materials may cause the project to be delayed—we should negotiate a penalty clause with the supplier to reduce the risk.", "关键材料交货延迟可能导致项目延误，我们和供应商协商违约条款，降低风险。"], ["The new product may face patent infringement risks—we need to ask the legal team to conduct a patent search and analysis.", "新产品可能面临专利侵权风险，我们请法务团队进行专利检索和分析。"], ["The fluctuation of raw material prices increases the cost risk—we can sign a long-term price agreement with the supplier to lock in the cost.", "原材料价格波动增加成本风险，我们可以和供应商签订长期价格协议锁定成本。"], ["The risk of poor product quality due to the new production line—we should increase the frequency of quality inspections during the trial production phase.", "新生产线可能导致产品质量不佳的风险，试生产阶段我们增加质量检测频率。"], ["The client's credit risk needs to be evaluated before signing the contract—we can check the client's credit record through a professional credit agency.", "签订合同前需评估客户的信用风险，我们可以通过专业征信机构查询客户信用记录。"], ["The natural disaster may disrupt the production schedule—we should formulate a business continuity plan to minimize the impact.", "自然灾害可能扰乱生产计划，我们制定业务连续性计划，将影响降至最低。"], ["The risk of low user acceptance of the new product—we should conduct a small-scale user test before the official launch to collect feedback and optimize.", "新产品用户接受度低的风险，正式上线前我们进行小规模用户测试，收集反馈并优化。"], ["The communication barrier with overseas partners increases the risk of misunderstanding—we should appoint a dedicated translator and clarify the communication process.", "与海外合作伙伴的沟通障碍增加误解风险，我们指定专属翻译，明确沟通流程。"], ["The tax policy change may increase the company's tax burden—we should ask the finance team to study the new policy and formulate tax planning strategies.", "税收政策变化可能增加公司税负，我们请财务团队研究新政策，制定税务筹划策略。"], ["The risk of project scope expansion—we need to strictly control the change process and require formal approval for any scope adjustment.", "项目范围扩大的风险，我们严格控制变更流程，任何范围调整都需正式审批。"], ["The public opinion risk caused by negative news about the product—we should establish a public relations response team to deal with emergencies in a timely manner.", "产品负面新闻引发的舆情风险，我们建立公关应对团队，及时处理突发事件。"], ["Thank you for your feedback—we take your complaint seriously and will investigate the issue immediately.", "感谢您的反馈，我们重视您的投诉，将立即调查此事。"], ["We apologize for the inconvenience caused by our product—we will provide you with a replacement and compensate you for the related losses.", "我们为产品给您带来的不便道歉，将为您更换产品并赔偿相关损失。"], ["Could you please provide your order number and detailed information about the problem so we can process your complaint quickly?", "您能提供订单号和问题的详细信息，以便我们快速处理您的投诉吗？"], ["We have investigated your complaint and found that the problem was caused by a mistake in our after-sales service—we will rectify it within 24 hours.", "我们已调查您的投诉，发现问题是由我们售后服务失误导致的，将在 24 小时内整改。"], ["I understand your frustration with the delayed delivery—we have contacted the logistics company and will update you on the latest delivery time within an hour.", "我理解您对交货延迟的不满，我们已联系物流公司，将在 1 小时内告知您最新交货时间。"], ["To resolve your complaint, we propose two solutions: either a full refund or a 20% discount on your next purchase—please let us know your choice.", "为解决您的投诉，我们提出两种方案：全额退款或下次购买享受 20% 折扣，请告知您的选择。"], ["We have recorded your complaint and assigned a dedicated staff member to follow up—you will receive a response within 3 working days.", "我们已记录您的投诉，并指派专人跟进，3 个工作日内您将收到回复。"], ["We apologize for the incorrect information in the product manual—we will send you the revised manual and offer a free maintenance service as compensation.", "我们为产品手册中的错误信息道歉，将为您寄送修订版手册，并提供免费维护服务作为补偿。"], ["After investigating, we confirm that the problem is due to a product defect—we will recall the defective products and provide you with a new one for free.", "经调查，我们确认问题是由产品缺陷导致的，将召回缺陷产品，并为您免费提供新品。"], ["Thank you for pointing out the problem in our customer service—we will conduct training for the service team to improve their service quality.", "感谢您指出我们客户服务中的问题，我们将对服务团队进行培训，提升服务质量。"], ["We understand that you are not satisfied with the repair results—we will arrange a senior technician to recheck and repair your product for free.", "我们理解您对维修结果不满意，将安排高级技师为您的产品重新检查和维修，且不收取费用。"], ["Your complaint about the unfair pricing has been forwarded to the pricing department—they will review the pricing policy and give you a reply within 2 days.", "您关于定价不公的投诉已转交给定价部门，他们将审核定价政策，2 天内给您回复。"], ["We apologize for the long waiting time in the customer service line—we have increased the number of customer service staff to reduce the waiting time.", "我们为客服热线等待时间过长道歉，已增加客服人员数量，缩短等待时间。"], ["To make up for the inconvenience caused, we will give you a VIP membership with additional benefits—we hope this can regain your trust.", "为弥补给您带来的不便，我们将为您提供带有额外福利的 VIP 会员资格，希望能重新获得您的信任。"], ["We have analyzed the root cause of your complaint and formulated improvement measures—we will share the progress with you regularly.", "我们已分析您投诉的根本原因，并制定了改进措施，将定期向您分享进展。"], ["We are sorry that our salesperson gave you inaccurate product information—we will apologize to you in person and provide you with a detailed product introduction.", "很抱歉我们的销售人员给您提供了不准确的产品信息，我们将当面向您道歉，并为您提供详细的产品介绍。"], ["Your complaint about the dirty packaging of the product has been taken seriously—we will strengthen the quality inspection of the packaging process.", "您关于产品包装脏污的投诉已被重视，我们将加强包装环节的质量检测。"], ["We will process your refund application immediately after verifying your information—you will receive the refund within 3-5 working days.", "核实您的信息后，我们将立即处理退款申请，3-5 个工作日内您将收到退款。"], ["We apologize for the noise caused by our product during use—we will send a technician to your home to adjust the product and reduce the noise.", "我们为产品使用过程中产生的噪音道歉，将派技师上门为您调试产品，降低噪音。"], ["Thank you for your patience while we handled your complaint—we value every customer's opinion and will continue to improve our products and services.", "感谢您在我们处理投诉期间的耐心等待，我们重视每位客户的意见，将持续改进产品和服务。"], ["A negative news about our product has spread on social media—we need to issue an official statement immediately to explain the situation.", "社交媒体上流传关于我们产品的负面新闻，我们需立即发布官方声明说明情况。"], ["The product safety incident has attracted media attention—we should hold a press conference to disclose the investigation progress and handling measures.", "产品安全事件引发媒体关注，我们应召开新闻发布会，披露调查进展和处理措施。"], ["When facing a public relations crisis, we should be transparent and honest, and avoid concealing the truth.", "面对公关危机，我们应透明坦诚，避免隐瞒真相。"], ["We need to establish a crisis communication team to respond to media inquiries and public concerns in a unified manner.", "我们需成立危机沟通小组，统一回应媒体问询和公众关切。"], ["The customer's negative review has gone viral—we should contact the customer privately to resolve the problem and publish the handling result publicly.", "客户的负面评价已扩散，我们私下联系客户解决问题，并公开处理结果。"], ["During the crisis, we should monitor public opinion in real time and adjust the response strategy according to the development of the situation.", "危机期间，我们实时监控舆情，根据事态发展调整应对策略。"], ["The company's data breach incident has caused public panic—we need to explain the scope of the breach and the measures taken to protect user data.", "公司数据泄露事件引发公众恐慌，我们需说明泄露范围及为保护用户数据所采取的措施。"], ["We should choose the official communication channels (such as the official website and official Weibo) to release information to avoid misinformation.", "我们应选择官方沟通渠道（如官网、官方微博）发布信息，避免不实信息传播。"], ["The crisis response should be timely—delayed response will increase public dissatisfaction and worsen the crisis.", "危机应对需及时，延迟回应会增加公众不满，加剧危机。"], ["We need to apologize sincerely to the affected users and provide reasonable compensation to regain their trust.", "我们需向受影响用户真诚道歉，并提供合理赔偿，重新获得信任。"], ["The product recall crisis requires us to clearly inform users of the recall scope, reasons and how to return or replace the product.", "产品召回危机，我们需明确告知用户召回范围、原因及退换货方式。"], ["During the crisis, the company's senior management should speak up to show the company's attention and responsibility for the incident.", "危机期间，公司高层应发声，体现公司对事件的重视和责任感。"], ["We should avoid making contradictory statements in the crisis response, which will damage the company's credibility.", "危机应对中，避免发表矛盾言论，否则会损害公司公信力。"], ["After the crisis, we need to summarize the experience and lessons, and improve the risk prevention mechanism to avoid similar crises.", "危机过后，我们总结经验教训，完善风险防范机制，避免类似危机再次发生。"], ["The negative rumors about the company's financial situation—we need to release the latest financial report and invite third-party institutions to verify to refute the rumors.", "关于公司财务状况的负面谣言，我们需发布最新财务报告，并邀请第三方机构验证以辟谣。"], ["When responding to media interviews during a crisis, we should designate a single spokesperson to ensure the consistency of information.", "危机期间回应媒体采访时，需指定唯一发言人，确保信息口径一致。"], ["The environmental pollution incident caused by the factory has aroused public concern—we need to shut down the problematic production line immediately and formulate a pollution control plan.", "工厂引发的环境污染事件引发公众关注，我们需立即关停问题生产线，并制定污染治理方案。"], ["We should collect and sort out public opinions on the crisis, analyze the focus of public concern, and adjust the response strategy accordingly.", "我们需收集整理公众对危机的看法，分析公众关注焦点，据此调整应对策略。"], ["The food safety incident of our brand—we need to recall all related products immediately and cooperate with the regulatory authorities to conduct a thorough investigation.", "我们品牌的食品安全事件，需立即召回所有相关产品，并配合监管部门开展全面调查。"], ["After the crisis is resolved, we should carry out brand restoration activities, such as public welfare projects or user communication meetings, to rebuild public trust.", "危机解决后，需开展品牌修复活动，如公益项目或用户沟通会，重建公众信任。"], ["I plan to take an online course on digital marketing to improve my professional skills in this field.", "我计划参加数字营销在线课程，提升在该领域的专业技能。"], ["I set a goal to read one industry-related book every month to keep up with the latest development trends.", "我设定了每月读一本行业相关书籍的目标，以紧跟最新发展趋势。"], ["I will record my work experience and lessons in a notebook to summarize and reflect on my growth regularly.", "我会在笔记本中记录工作经验与教训，定期总结反思个人成长。"], ["I plan to participate in industry seminars and forums to learn from experts and expand my knowledge.", "我计划参加行业研讨会和论坛，向专家学习并拓展知识面。"], ["I will practice my presentation skills by volunteering to give project reports in team meetings.", "我会主动在团队会议中进行项目汇报，锻炼演讲能力。"], ["I plan to learn a second language (such as Spanish) to better communicate with overseas clients and partners.", "我计划学习第二语言（如西班牙语），以便更好地与海外客户和合作伙伴沟通。"], ["I will ask my supervisor and colleagues for feedback on my work regularly to find areas for improvement.", "我会定期向主管和同事征求工作反馈，找到需要改进的地方。"], ["I plan to master a new work tool (such as data analysis software Python) to improve work efficiency.", "我计划掌握一款新的工作工具（如数据分析软件 Python），提升工作效率。"], ["I will take the initiative to undertake challenging tasks to accumulate experience and enhance my problem-solving ability.", "我会主动承担有挑战性的任务，积累经验并提升解决问题的能力。"], ["I plan to join a professional community in my field to communicate with peers and share work experience.", "我计划加入所在领域的专业社群，与同行交流并分享工作经验。"], ["I will set a daily time limit for checking emails and social media to avoid distractions and improve focus.", "我会为查看邮件和社交媒体设定每日时限，避免分心并提升专注力。"], ["I plan to learn time management methods (such as the Pomodoro Technique) to better arrange my work and life.", "我计划学习时间管理方法（如番茄工作法），更好地安排工作与生活。"], ["I will conduct mock interviews with colleagues to improve my performance in job interviews for future promotions.", "我会和同事进行模拟面试，提升未来晋升面试中的表现。"], ["I plan to study the business models of competitors to gain insights and optimize our team's work strategies.", "我计划研究竞争对手的商业模式，获取启发并优化团队工作策略。"], ["I will practice active listening in communication, such as repeating the other person's key points, to avoid misunderstandings.", "我会在沟通中练习积极倾听，如重复对方的关键点，避免误解。"], ["I plan to obtain a professional certification (such as PMP project management certification) to enhance my competitiveness.", "我计划考取专业证书（如 PMP 项目管理证书），提升个人竞争力。"], ["I will summarize the common problems in my work and formulate standard solutions to improve work accuracy.", "我会总结工作中的常见问题并制定标准解决方案，提升工作准确性。"], ["I plan to shadow senior colleagues in the company to learn their work methods and thinking patterns.", "我计划跟随公司资深同事学习，了解他们的工作方法和思维模式。"], ["I will set short-term and long-term career goals and break them down into actionable steps to promote my career development.", "我会设定短期和长期职业目标，并将其分解为可执行的步骤，推动职业发展。"], ["I plan to learn basic financial knowledge to better understand the company's financial statements and support business decision-making.", "我计划学习基础财务知识，以便更好地理解公司财务报表并支持业务决策。"], ["In the next two years, I hope to be promoted to a team leader position and lead a small team to complete projects independently.", "未来两年，我希望晋升为团队主管，带领小团队独立完成项目。"], ["My long-term career goal is to become a senior manager in the marketing department and formulate the company's overall marketing strategy.", "我的长期职业目标是成为市场部高级经理，制定公司整体营销策略。"], ["I plan to transfer to the overseas business department in the next year to gain international work experience and expand my global perspective.", "我计划明年转到海外业务部门，积累国际工作经验并拓展全球视野。"], ["I hope to develop expertise in the field of artificial intelligence application in the next three years and become a key technical personnel in the company.", "未来三年，我希望在人工智能应用领域形成专业特长，成为公司核心技术人员。"], ["My career plan in the short term is to master the core business processes of the department and become a business backbone within one year.", "我的短期职业规划是一年内掌握部门核心业务流程，成为业务骨干。"], ["I plan to start my own business in the related industry after working in the company for five years and accumulating sufficient experience and resources.", "我计划在公司工作五年，积累足够经验和资源后，在相关行业创业。"], ["I hope to switch from the technical position to the product management position in the next two years to expand my career scope.", "未来两年，我希望从技术岗位转向产品管理岗位，拓展职业领域。"], ["My medium-term career goal is to be responsible for the company's key client accounts and establish long-term and stable cooperative relationships with them.", "我的中期职业目标是负责公司重点客户账户，与客户建立长期稳定的合作关系。"], ["I plan to study for an MBA degree in the next three years to improve my management ability and lay a foundation for higher-level positions.", "未来三年，我计划攻读 MBA 学位，提升管理能力，为更高职位奠定基础。"], ["I hope to participate in the company's strategic planning work within five years and provide professional suggestions for the company's development.", "我希望五年内参与公司战略规划工作，为公司发展提供专业建议。"], ["My career plan is to first gain in-depth experience in the domestic market and then move to the international market to take on more important responsibilities.", "我的职业规划是先在国内市场积累深度经验，再转向国际市场承担更重要职责。"], ["I plan to become a professional trainer in the company's internal training system in the next two years to share my work experience with new employees.", "未来两年，我计划成为公司内部培训体系的专业讲师，向新员工分享工作经验。"], ["I hope to be transferred to the company's headquarters in three years to understand the company's overall operation and management model.", "我希望三年内调到公司总部，了解公司整体运营和管理模式。"], ["My long-term career goal is to promote the innovation and development of the industry and become an influential expert in the field.", "我的长期职业目标是推动行业创新发展，成为领域内有影响力的专家。"], ["I plan to accumulate experience in cross-departmental collaboration in the next year and then apply for a cross-functional project management position.", "我计划明年积累跨部门协作经验，之后申请跨职能项目管理岗位。"], ["I hope to improve my ability to deal with complex business problems within two years and become a key support personnel for the department's management team.", "未来两年，我希望提升处理复杂业务问题的能力，成为部门管理团队的核心支撑人员。"], ["My career plan is to work in different business units of the company for one to two years each to gain a comprehensive understanding of the company's business.", "我的职业规划是在公司不同业务单元各工作 1-2 年，全面了解公司业务。"], ["I plan to establish a personal professional brand in the industry within five years by publishing articles and participating in public lectures.", "未来五年，我计划通过发表文章和参与公开讲座，在行业内建立个人专业品牌。"], ["I hope to be responsible for the company's new business development project in three years and promote the expansion of the company's business scope.", "我希望三年内负责公司新业务开发项目，推动公司业务范围拓展。"], ["My medium-term career goal is to improve my cross-cultural communication ability and take charge of the company's overseas branch management work.", "我的中期职业目标是提升跨文化沟通能力，负责公司海外分公司管理工作。"], ["When attending a business meeting, you should arrive 5-10 minutes in advance to prepare and show respect for the meeting organizer.", "参加商务会议时，应提前 5-10 分钟到达准备，体现对会议组织者的尊重。"], ["When exchanging business cards, you should hold the card with both hands and introduce your name and position briefly, then take the other person's card carefully and read it.", "交换名片时，应用双手持握名片并简要介绍姓名和职位，接过对方名片后需仔细阅读。"], ["When communicating with colleagues or clients, you should maintain appropriate eye contact to show that you are listening attentively.", "与同事或客户沟通时，应保持适当眼神交流，表明正在认真倾听。"], ["When sending work emails, you should use a clear and concise subject line, and the content should be polite and to the point, avoiding ambiguous expressions.", "发送工作邮件时，应使用清晰简洁的主题，内容礼貌且直奔重点，避免模糊表述。"], ["When participating in a video conference, you should choose a quiet and tidy background, turn on the camera, and dress appropriately to maintain a professional image.", "参加视频会议时，应选择安静整洁的背景，开启摄像头，着装得体以保持专业形象。"], ["When entering a colleague's office, you should knock on the door first and wait for the other person's permission before entering.", "进入同事办公室时，应先敲门，等待对方允许后再进入。"], ["When using workplace chat tools, you should avoid sending irrelevant messages during working hours, and reply to work-related messages in a timely manner.", "使用职场聊天工具时，应避免在工作时间发送无关信息，工作相关信息需及时回复。"], ["When attending a business dinner, you should follow the host's arrangement for seating, and avoid talking with food in your mouth or making loud noises.", "参加商务宴请时，应遵循主人安排就座，避免嘴里含着食物说话或发出嘈杂声响。"], ["When praising colleagues, you should be specific and point out the specific things they did well, rather than just general compliments.", "称赞同事时，应具体明确，指出对方做得好的具体事情，而非笼统赞美。"], ["When refusing a colleague's request, you should be polite and explain the reason, and try to provide alternative solutions if possible.", "拒绝同事请求时，应态度礼貌并说明原因，如有可能尽量提供替代解决方案。"], ["When using shared office equipment (such as printers and copiers), you should clean up the documents and materials after use to keep the equipment clean and tidy.", "使用共享办公设备（如打印机、复印机）时，使用后应清理文件资料，保持设备整洁。"], ["When communicating with superiors, you should use respectful titles, and report work in a structured manner (such as conclusion first, then details).", "与上级沟通时，应使用尊称，汇报工作需有条理（如先结论后细节）。"], ["When receiving clients in the office, you should offer them drinks (such as water or tea) and prepare relevant materials in advance.", "在办公室接待客户时，应主动为客户提供饮品（如水或茶），并提前准备相关资料。"], ["When making business calls, you should state your name and company clearly at the beginning, and briefly explain the purpose of the call to save time.", "拨打商务电话时，开头应清晰说明姓名和公司，简要阐述通话目的以节省时间。"], ["When using colleagues' personal items (such as pens and notebooks), you should ask for permission first and return them in time after use.", "使用同事个人物品（如笔、笔记本）时，应先征得同意，使用后及时归还。"], ["When attending a meeting, you should turn your mobile phone to silent or vibration mode to avoid disturbing the meeting.", "参加会议时，应将手机调至静音或震动模式，避免干扰会议。"], ["When expressing different opinions in a team discussion, you should focus on the problem itself, use gentle language, and avoid attacking others' personalities.", "在团队讨论中表达不同意见时，应聚焦问题本身，语言温和，避免攻击他人人格。"], ["When leaving the office at the end of the day, you should turn off the computer, lights and air conditioning to save energy and ensure office safety.", "下班离开办公室时，应关闭电脑、灯光和空调，节约能源并确保办公安全。"], ["When introducing colleagues to clients, you should introduce the person with the lower position to the person with the higher position first.", "将同事介绍给客户时，应先将职位较低的人介绍给职位较高的人。"], ["When apologizing to colleagues or clients for a mistake, you should take responsibility actively, avoid making excuses, and explain the improvement measures.", "因失误向同事或客户道歉时，应主动承担责任，避免找借口，并说明改进措施。"], ["As a team leader, I will clarify the team's goals and decompose them into individual tasks to ensure everyone knows their responsibilities.", "作为团队主管，我会明确团队目标并分解为个人任务，确保每个人清楚职责。"], ["I will hold regular one-on-one communication with team members to understand their work difficulties and career development needs.", "我会定期与团队成员进行一对一沟通，了解他们的工作困难和职业发展需求。"], ["When assigning tasks, I will consider each team member's strengths and development needs to help them grow while completing tasks.", "分配任务时，我会结合每位成员的优势和发展需求，让他们在完成任务的同时获得成长。"], ["I will establish a fair performance evaluation system to reward team members who perform well and provide improvement suggestions for those who need it.", "我会建立公平的绩效评估体系，奖励表现优秀的成员，为需要改进的成员提供建议。"], ["I will organize regular team-building activities to enhance the cohesion and cooperation awareness of team members.", "我会定期组织团建活动，提升团队成员的凝聚力和合作意识。"], ["When the team encounters difficulties, I will take the lead to face the problem, encourage team members, and work together to find solutions.", "团队遇到困难时，我会带头面对问题，鼓励团队成员，共同寻找解决方案。"], ["I will create an open communication atmosphere in the team, allowing team members to freely express their opinions and suggestions.", "我会在团队中营造开放的沟通氛围，让成员可以自由表达意见和建议。"], ["I will provide necessary training and resources for team members to help them improve their professional skills and complete tasks smoothly.", "我会为团队成员提供必要的培训和资源，帮助他们提升专业技能，顺利完成任务。"], ["When making important team decisions, I will listen to the opinions of all team members and make decisions that are most beneficial to the team's development.", "做出团队重要决策时，我会听取所有成员的意见，制定对团队发展最有利的决策。"], ["I will pay attention to the work-life balance of team members and avoid arranging excessive workload to prevent burnout.", "我会关注团队成员的工作与生活平衡，避免安排过重工作量，防止成员过度劳累。"], ["I will set clear work standards and deadlines for the team to ensure the quality and efficiency of task completion.", "我会为团队设定明确的工作标准和截止日期，确保任务完成的质量和效率。"], ["When team members make mistakes, I will help them analyze the reasons, summarize lessons, and avoid blaming them excessively.", "团队成员犯错时，我会帮助他们分析原因、总结教训，避免过度指责。"], ["I will regularly summarize the team's work progress, affirm the achievements, and adjust the work plan in time according to the actual situation.", "我会定期总结团队工作进展，肯定成绩，根据实际情况及时调整工作计划。"], ["I will promote knowledge sharing among team members, such as organizing experience exchange meetings, to improve the overall ability of the team.", "我会推动团队成员间的知识共享，如组织经验交流会，提升团队整体能力。"]];window.__KEY__="927职场英文沟通实用650句句型";window.__TITLE__="9.27 职场英文沟通实用650句句型";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
