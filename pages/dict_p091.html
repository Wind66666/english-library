's discuss the contract's after-sales service personnel qualification requirements. The seller's on-site maintenance personnel shall hold relevant professional certificates （such as electrical engineering certificates） and have more than 3 years of practical experience to ensure service quality.​", "（我们来讨论合同售后服务人员资质要求，卖方现场维修人员需持有相关专业证书​（如电工证）且具备 3 年以上实操经验，以保障服务质量。）​"], ["Regarding the contract's termination notice form, the termination notice shall be sent by registered mail with return receipt requested, and the date when the recipient signs for the mail shall be deemed the notice effective date.​", "（关于合同解除通知形式，解除通知需通过挂号信寄送并要求回执，收件人签收邮件之日视为通知生效日。）​"], ["Could we negotiate the contract's spare parts supply guarantee? The seller shall ensure that the spare parts required for maintenance during the warranty period are available in stock, and the delivery time of spare parts shall not exceed 3 working days after the application is submitted.​", "（我们能协商合同备件供应保障吗？卖方需确保保修期内维修所需备件有库存，备件交付时间自申请提交之日起不超过 3 个工作日。）​"], ["We propose adjusting the contract's pricing quotation validity period: the quotation provided by the seller shall remain valid for 30 days from the date of issuance; if the contract is not signed within the validity period, the quotation shall be reconfirmed by both parties.​", "（我们建议调整合同定价报价有效期：卖方提供的报价自出具之日起 30 天内有效，若有效期内未签订合同，报价需经双方重新确认。）​"], ["Let's confirm the contract's performance site safety requirements. The seller's personnel entering our site for construction or maintenance shall abide by our safety management regulations, wear protective equipment, and the seller shall be liable for any safety accidents caused by non-compliance.​", "我们确认合同履约现场安全要求，卖方人员进入我方现场施工或维修需遵守我方安全管理制度、佩戴防护装备，因违规导致的安全事故由卖方承担责任。"], ["Regarding the contract's intellectual property renewal notification, if the seller's patent or trademark related to the product needs to be renewed during the contract period, the seller shall notify us in writing 3 months in advance to avoid affecting the normal use of the product.​", "（关于合同知识产权续期通知，若合同期内卖方与产品相关的专利或商标需续期，卖方需提前 3 个月书面通知我方，避免影响产品正常使用。）​"], ["Could you clarify the contract's dispute resolution arbitration institution selection? If we agree to resolve disputes through arbitration, shall we select China International Economic and Trade Arbitration Commission （CIETAC） or the local arbitration commission of the buyer's location?​", "（您能明确合同争议解决仲裁机构选择吗？若我们同意通过仲裁解决争议，是选择中国国际经济贸易仲裁委员会​（CIETAC）还是买方所在地的地方仲裁委员会？）​"], ["We suggest adding a contract's performance progress delay early warning clause: if the seller predicts that the performance progress may be delayed by more than 7 days, it shall notify us in writing 3 days in advance and propose a remedy plan to minimize losses.​", "（我们建议增加合同履约进度延迟预警条款：若卖方预计履约进度可能延迟超过 7 天，需提前 3 天书面通知我方并提出补救方案，将损失降至最低。）​"], ["Let's talk about the contract's after-sales service report requirements. The seller shall submit a monthly after-sales service report, including the number of maintenance cases, problem types, solution efficiency, and customer satisfaction survey results.​", "（我们来讨论合同售后服务报告要求，卖方需每月提交售后服务报告，内容包括维修案例数量、问题类型、解决效率及客户满意度调查结果。）​"], ["Regarding the contract's tax invoice issuance time, the seller shall issue a valid VAT invoice within 5 working days after receiving the payment, and send the original invoice to us by express mail; the invoice information shall be consistent with the contract content.​", "（关于合同税务发票开具时间，卖方需在收到款项后 5 个工作日内开具有效增值税发票，并通过快递将发票原件寄送给我方，发票信息需与合同内容一致。）​"], ["Could we negotiate the contract's force majeure loss sharing? If the force majeure event causes direct losses to both parties, the losses shall be borne by each party respectively; if the loss is caused to one party due to the other party's failure to take mitigation measures, the negligent party shall bear the additional loss.​", "（我们能协商合同不可抗力损失分担吗？若不可抗力事件给双方造成直接损失，损失由各自承担；若因一方未采取减轻措施导致另一方受损，过错方需承担额外损失。）​"], ["We propose adjusting the contract's confidentiality information storage requirements: both parties shall store the confidential information in an encrypted manner （such as setting a password for electronic files and locking physical documents）, and destroy the confidential information in a timely manner after the confidentiality period expires.", "（我们建议调整合同保密信息存储要求：双方需对保密信息进行加密存储​（如电子文件设密码、纸质文件上锁），保密期满后及时销毁保密信息。）​"], ["Let's confirm the contract's signing authority verification. The signatory of both parties shall provide a power of attorney issued by the company to prove their signing authority, and the power of attorney shall be attached to the contract as an annex.​", "（我们确认合同签署权限验证，双方签字人需提供公司出具的授权委托书以证明签署权限，授权委托书作为附件随合同一并留存。）​"], ["Regarding the contract's product packaging requirements, the seller shall use moisture-proof, shock-proof, and anti-collision packaging materials to ensure that the product is not damaged during transportation; the packaging shall be marked with the product name, quantity, and fragile warning signs.​", "（关于合同产品包装要求，卖方需使用防潮、防震、防碰撞的包装材料，确保产品在运输过程中不受损；包装上需标注产品名称、数量及易碎警示标志。）​"], ["Could you clarify the contract's after-sales service fee settlement? For the maintenance services provided beyond the warranty period, the service fee shall be settled monthly based on the agreed unit price and the actual service quantity, and the seller shall provide a detailed expense list.​", "（您能明确合同售后服务费用结算吗？对于保修期外提供的维修服务，服务费按约定单价及实际服务数量按月结算，卖方需提供详细费用清单。）​"], ["We suggest adding a contract's technical training service clause: the seller shall provide 2 rounds of free technical training for our operation and maintenance personnel within 1 month after the product delivery, covering product operation, daily maintenance, and fault handling.​", "（我们建议增加合同技术培训服务条款：卖方需在产品交付后 1 个月内为我方运维人员提供 2 轮免费技术培训，内容包括产品操作、日常维护及故障处理。）​"], ["Let's discuss the contract's performance deviation correction measures. If the seller's performance deviates from the contract requirements （such as the product specification not meeting the standard）, the seller shall correct the deviation within 7 days and submit a correction report to us for confirmation.​", "我们来讨论合同履约偏差纠正措施，若卖方履约与合同要求存在偏差​（如产品规格不达标），卖方需在 7 天内纠正偏差，并提交纠正报告给我方确认。"], ["Regarding the contract's termination aftermath compensation, if the contract is terminated due to unforeseen changes in market conditions, both parties shall not claim compensation from each other, but shall cooperate to complete the settlement of the completed work and the return of materials.​", "（关于合同解除善后赔偿，若因市场环境不可预见变化导致合同解除，双方互不向对方主张赔偿，但需配合完成已完工工作结算及材料返还。）​"], ["Could we negotiate the contract's inspection and acceptance standards update? If the national or industry inspection standards are updated during the contract performance period, the acceptance of the remaining products shall be carried out in accordance with the new standards.​", "（我们能协商合同检验验收标准更新吗？若合同履行期间国家或行业检验标准更新，剩余产品的验收需按照新标准执行。）​"], ["We propose adjusting the contract's communication frequency between parties: in addition to the monthly regular meeting, if there is an emergency affecting contract performance, the relevant personnel of both parties shall communicate immediately by phone or video call.​", "（我们建议调整合同双方沟通频率：除每月例会外，若出现影响合同履行的紧急情况，双方相关人员需立即通过电话或视频通话沟通。）​"], ["Let's confirm the contract's bank account information verification. Both parties shall provide the latest bank account information （including account name, bank name, and account number） before the first payment, and notify the other party in writing if the account information changes.​", "（我们确认合同银行账户信息核实，双方需在首次付款前提供最新银行账户信息​（包括账户名、开户行、账号），账户信息变更需书面通知另一方。）​"], ["Regarding the contract's product label requirements, each product shall be labeled with the product model, production date, serial number, and quality inspection mark, and the label shall be clear and wear-resistant to facilitate traceability.​", "（关于合同产品标识要求，每件产品需标注产品型号、生产日期、序列号及质量检验标志，标识需清晰且耐磨，便于追溯。）​"], ["Could you clarify the contract's after-sales service satisfaction evaluation? We will conduct a satisfaction evaluation for each after-sales service, with the evaluation results divided into excellent, good, and unqualified; if there are 3 consecutive unqualified evaluations, the seller shall improve the service within 10 days.​", "（您能明确合同售后服务满意度评价吗？我方将对每次售后服务进行满意度评价，评价结果分为优秀、合格、不合格；若连续 3 次评价不合格，卖方需在 10 天内整改服务。）​"], ["We suggest adding a contract's force majeure insurance coverage clause: the seller shall purchase force majeure insurance for the goods during transportation, and the insurance coverage shall include losses caused by natural disasters and major social events.​", "（我们建议增加合同不可抗力保险覆盖条款：卖方需为运输途中的货物购买不可抗力保险，保险范围包括自然灾害及重大社会事件造成的损失。）​"], ["Let's talk about the contract's intellectual property infringement settlement. If the product is confirmed to infringe the third party's intellectual property rights, the seller shall either replace the infringing parts within 10 days or provide a non-infringing alternative product, and bear all related costs.​", "（我们来讨论合同知识产权侵权解决方式，若产品被确认侵犯第三方知识产权，卖方需在 10 天内更换侵权部件或提供非侵权替代产品，并承担所有相关费用。）​"], ["Regarding the contract's payment installment ratio adjustment, if the project scale increases by more than 20% compared with the original contract, we propose adjusting the installment payment ratio to increase the proportion of the final payment to 30% to better control project quality.​", "（关于合同付款分期比例调整，若项目规模较原合同增加 20% 以上，我们建议调整分期付款比例，将尾款占比提高至 30%，以更好地控制项目质量。）​"], ["Could we negotiate the contract's on-site service time restrictions? The seller's on-site service shall be carried out during our working hours （9:00-18:00, Monday to Friday）, and off-hour service shall be agreed upon in advance and subject to an additional 50% service fee.​", "（我们能协商合同现场服务时间限制吗？卖方现场服务需在我方工作时间​（周一至周五 9:00-18:00）内进行，非工作时间服务需提前约定且需额外收取 50% 服务费。）​"], ["We propose adjusting the contract's confidentiality information disclosure approval process: any disclosure of confidential information to a third party shall be approved by the legal department of the disclosing party in writing, and the third party shall sign a confidentiality agreement before obtaining the information.​", "（我们建议调整合同保密信息披露审批流程：向第三方披露任何保密信息均需经披露方法务部门书面审批，第三方在获取信息前需签署保密协议。）​"], ["Let's confirm the contract's performance default notice procedure. If one party discovers the other party's performance default, it shall issue a written default notice specifying the default content and rectification time limit; if the defaulter fails to rectify, the notifying party may exercise the right to claim compensation.​", "（我们确认合同履约违约通知流程，若一方发现另一方履约违约，需出具书面违约通知，明确违约内容及整改期限；违约方未整改的，通知方可行使索赔权利。）​"], ["Regarding the contract's product maintenance record requirements, the seller shall keep a detailed maintenance record for each product, including maintenance time, fault description, solution, and replacement parts information, and provide a copy of the record to us every quarter.​", "（关于合同产品维修记录要求，卖方需为每件产品留存详细维修记录，包括维修时间、故障描述、解决方法及更换部件信息，每季度向我方提供记录副本。）​"], ["Could you clarify the contract's tax rate change handling? If the national tax rate is adjusted during the contract performance period, the contract price shall be adjusted according to the new tax rate, and the adjusted price shall be confirmed by both parties in writing.​", "（您能明确合同税率变动处理吗？若合同履行期间国家税率调整，合同价格需按新税率计算调整，调整后的价格需经双方书面确认。）​"], ["We suggest adding a contract's emergency response plan clause: both parties shall jointly formulate an emergency response plan for major events （such as product mass defects）, specifying the responsible personnel, response steps, and loss control measures.​", "（我们建议增加合同应急响应预案条款：双方需共同制定重大事件​（如产品批量缺陷）应急响应预案，明确责任人、响应步骤及损失控制措施。）​"], ["Let's discuss the contract's after-sales service contract renewal. If we need to continue purchasing after-sales services after the warranty period expires, both parties shall negotiate and sign a separate after-sales service contract 1 month before the expiration.​", "（我们来讨论合同售后服务续约，若保修期届满后我方需继续购买售后服务，双方需在届满前 1 个月协商签订单独的售后服务合同。）​"], ["Regarding the contract's delivery delay force majeure exemption verification, if the seller claims exemption from liability for delivery delay due to force majeure, it shall provide the certificate issued by the local government or industry association within 7 days to prove the occurrence and impact of the event.​", "（关于合同交货延迟不可抗力免责核实，若卖方以不可抗力为由主张免除交货延迟责任，需在 7 天内提供当地政府或行业协会出具的证明，证实事件发生及影响。）​"], ["Could we negotiate the contract's product sample confirmation procedure? Before mass production, the seller shall provide 3 product samples for our confirmation; mass production can only start after we issue a sample confirmation notice in writing.", "（我们能协商合同产品样品确认流程吗？批量生产前，卖方需提供 3 件产品样品供我方确认，我方出具书面样品确认通知后，方可启动批量生产。）​"], ["We propose adjusting the contract's liability for non-conforming products: if the non-conforming rate of a batch of products exceeds 5%, we have the right to return the entire batch of products, and the seller shall bear the round-trip transportation costs and compensate for the delay loss.​", "（我们建议调整合同不合格产品责任：若某一批次产品不合格率超过 5%，我方有权整批退货，卖方需承担往返运输费用并赔偿延误损失。）​"], ["Let's confirm the contract's electronic document storage requirements. All electronic versions of the contract, supplementary agreements, and communication records shall be stored in a dedicated cloud disk with backup, and the storage period shall be 7 years after the contract termination.​", "（我们确认合同电子文件存储要求，合同、补充协议及沟通记录的电子版均需存储在专用云盘并备份，存储期限为合同终止后 7 年。）​"], ["Regarding the contract's on-site service tool provision, the seller shall bring professional maintenance tools to the on-site service, and ensure that the tools are calibrated and meet the national measurement standards to avoid secondary damage to the product.​", "（关于合同现场服务工具提供，卖方现场服务需携带专业维修工具，并确保工具已校准且符合国家计量标准，避免对产品造成二次损坏。）​"], ["Could you clarify the contract's intellectual property license renewal? If we need to renew the license for the seller's intellectual property after the contract expires, we shall submit a renewal application 2 months in advance, and the renewal fee shall be negotiated based on the market price at that time.​", "（您能明确合同知识产权许可续约吗？若合同期满后我方需续约使用卖方知识产权，需提前 2 个月提交续约申请，续约费用根据届时市场价格协商确定。）​"], ["We suggest adding a contract's performance quality reward clause: if the product passes all inspections at one time during the contract performance period and no quality complaints are received, we will give the seller a reward of 2% of the contract amount.​", "（我们建议增加合同履约质量奖励条款：若合同履行期间产品全部一次性通过检验且无质量投诉，我方将给予卖方合同金额 2% 的奖励。）​"], ["Let 's confirm the contract's on-site service safety liability. If the seller's on-site service personnel cause personal injury to our employees due to improper operation, the seller shall bear the medical expenses, work-related injury compensation, and other related costs of the injured person.​", "（我们确认合同现场服务安全责任，若卖方现场服务人员因操作不当导致我方员工人身伤害，卖方需承担伤者的医疗费、工伤赔偿等相关费用。）​"], ["Regarding the contract's product quality sampling inspection frequency, we will conduct a random sampling inspection of each batch of delivered products; for large-batch continuous delivery, we will conduct an additional sampling inspection every 10 days to ensure consistent product quality.​", "（关于合同产品质量抽样检验频率，我方将对每一批次交付产品进行随机抽样检验；对于大批量连续交付的情况，每 10 天额外增加一次抽样检验，确保产品质量稳定。）​"], ["Could we negotiate the contract's payment delay grace period? If we encounter temporary fund turnover difficulties, we request a 5-day grace period for payment; during the grace period, no liquidated damages will be calculated, and we will pay the full amount before the grace period expires.​", "（我们能协商合同付款延迟宽限期吗？若我方遇到临时资金周转困难，请求给予 5 天付款宽限期；宽限期内不计算违约金，我方将在宽限期届满前付清全款。）​"], ["We suggest adding a contract's supplier qualification review clause: the seller shall provide updated qualification documents （such as business license, production license） every year during the contract period, and we have the right to suspend the contract if the qualification is expired or unqualified.​", "（我们建议增加合同供应商资质审查条款：合同期内，卖方需每年提供更新的资质文件​（如营业执照、生产许可证），若资质过期或不合格，我方有权暂停合同履行。）​"], ["Let's discuss the contract's product maintenance parts warranty. The replacement parts provided during the warranty period shall have a separate 6-month warranty period from the date of replacement, to ensure the quality of the maintenance parts.​", "（我们来讨论合同产品维修部件保修，保修期内提供的更换部件，自更换之日起享有单独 6 个月保修期，确保维修部件质量。）​"], ["Regarding the contract's communication record retention, all oral communications, phone calls, and WeChat messages related to the contract performance shall be recorded or screenshot by both parties, and stored as auxiliary materials for contract performance, with a retention period of 5 years.​", "关于合同沟通记录留存，双方所有与合同履行相关的口头沟通、电话通话、微信消息等，均需进行记录或截图，作为合同履行的辅助材料留存，留存期限为 5 年。"], ["Could you clarify the contract's force majeure event termination threshold? If the force majeure event lasts for more than 45 days and makes it impossible to resume contract performance, either party may propose to terminate the contract in writing, and neither party shall bear liability for breach.​", "（您能明确合同不可抗力事件终止阈值吗？若不可抗力事件持续超过 45 天且无法恢复合同履行，任何一方可书面提出解除合同，双方互不承担违约责任。）​"], ["We propose adjusting the contract's product acceptance time limit: after the goods arrive at the destination, we shall complete the visual inspection within 3 working days and the performance test within 7 working days; if no objection is raised within the time limit, it shall be deemed as acceptance.​", "（我们建议调整合同产品验收期限：货物到达目的地后，我方 3 个工作日内完成外观检验，7 个工作日内完成性能测试；期限内未提出异议的，视为验收合格。）​"], ["Regarding the contract's tax declaration assistance, if the product involves import and export procedures, the seller shall provide the required customs declaration materials in a timely manner and assist us in completing the tax declaration formalities to avoid customs clearance delays.​", "（关于合同税务申报协助，若产品涉及进出口手续，卖方需及时提供所需报关材料，并协助我方完成税务申报手续，避免清关延误。）​"], ["Could we negotiate the contract's product label language? For products sold in both domestic and foreign markets, the label shall be printed in both Chinese and English, with clear and standardized fonts, to meet the requirements of different markets.​", "（我们能协商合同产品标识语言吗？对于同时在国内外市场销售的产品，标识需采用中英文双语印刷，字体清晰规范，满足不同市场要求。）​"], ["We suggest adding a contract's emergency spare parts reserve clause: the seller shall reserve 3 sets of key emergency spare parts in our designated warehouse, and replenish them in a timely manner after use, to ensure the timeliness of emergency maintenance.​", "（我们建议增加合同应急备件储备条款：卖方需在我方指定仓库储备 3 套关键应急备件，使用后及时补充，确保应急维修的及时性。）​"], ["Let's talk about the contract's performance evaluation cycle. Both parties shall conduct a comprehensive performance evaluation every quarter, covering delivery timeliness, product quality, and after-sales service; the evaluation results shall be used as the basis for subsequent contract renewal and cooperation.​", "（我们来讨论合同履约评价周期，双方每季度进行一次全面履约评价，涵盖交货及时性、产品质量、售后服务等；评价结果作为后续合同续约及合作的依据。）​"], ["Regarding the contract's payment method update, if we need to change the payment method from bank transfer to letter of credit during the contract period, we shall notify the seller in writing 15 days in advance, and both parties shall sign a supplementary agreement to confirm the change.​", "（关于合同付款方式更新，若合同期内我方需将付款方式从银行转账变更为信用证，需提前 15 天书面通知卖方，双方签署补充协议确认变更。）​"], ["Could you clarify the contract's product quality complaint evidence requirements? When we submit a quality complaint, we shall provide photos, test reports, and fault descriptions of the defective products; the seller shall respond within 3 working days after receiving the evidence.​", "（您能明确合同产品质量投诉证据要求吗？我方提交质量投诉时，需提供缺陷产品的照片、检测报告、故障描述等证据；卖方收到证据后 3 个工作日内需作出回应。）​"], ["We propose adjusting the contract's confidentiality liability penalty: if either party breaches the confidentiality obligation and causes economic losses to the other party, the defaulting party shall pay a penalty of 500,000 yuan in addition to compensating for the actual losses.​", "（我们建议调整合同保密责任违约金：任何一方违反保密义务给另一方造成经济损失的，违约方除赔偿实际损失外，还需支付 50 万元违约金。）​"], ["Let's confirm the contract's electronic signature validity. The electronic signature used by both parties shall comply with the requirements of the Electronic Signature Law of the People's Republic of China, and the signed electronic contract shall have the same legal effect as the paper contract.​", "（我们确认合同电子签名效力，双方使用的电子签名需符合《中华人民共和国电子签名法》要求，签署后的电子合同与纸质合同具有同等法律效力。）​"], ["Regarding the contract's product transportation route confirmation, the seller shall confirm the transportation route with us before shipping the goods; if the route needs to be changed due to special circumstances, the seller shall notify us in advance and obtain our consent.​", "（关于合同产品运输路线确认，卖方发货前需与我方确认运输路线；若因特殊情况需变更路线，卖方需提前通知我方并取得同意。）​"], ["Could we negotiate the contract's after-sales service personnel replacement? If the assigned after-sales service personnel cannot meet the service requirements, we have the right to request the seller to replace them within 5 working days, and the new personnel shall meet the agreed qualification standards.​", "（我们能协商合同售后服务人员更换吗？若指派的售后服务人员无法满足服务要求，我方有权要求卖方 5 个工作日内更换，新人员需符合约定的资质标准。）​"], ["We suggest adding a contract's product recall cost bearing clause: if the product needs to be recalled due to design or manufacturing defects, all recall costs （including transportation, publicity, and replacement） shall be borne by the seller.​", "（我们建议增加合同产品召回费用承担条款：若产品因设计或制造缺陷需召回，所有召回费用​（包括运输、宣传、更换等）均由卖方承担。）​"], ["Let's discuss the contract's performance progress report submission. The seller shall submit a weekly performance progress report, including the completion percentage of production, the status of raw material procurement, and the estimated delivery time, to ensure we grasp the progress in real time.​", "（我们来讨论合同履约进度报告提交，卖方需每周提交履约进度报告，包括生产完成百分比、原材料采购状态、预计交货时间等，确保我方实时掌握进度。）​"], ["Regarding the contract's tax refund assistance, if the product is eligible for export tax refund, the seller shall provide the necessary documents （such as export declaration form, invoice） to assist us in applying for tax refund, and shall not refuse assistance without reason.​", "（关于合同退税协助，若产品符合出口退税条件，卖方需提供必要文件​（如出口报关单、发票）协助我方申请退税，不得无故拒绝协助。）​"], ["Could you clarify the contract's force majeure notice confirmation? After the affected party sends the force majeure notice, the other party shall confirm receipt within 2 working days; if no confirmation is received, the notice shall be deemed to have been received on the 3rd working day.​", "（您能明确合同不可抗力通知确认吗？受影响方发送不可抗力通知后，另一方需在 2 个工作日内确认收到；未确认的，视为第 3 个工作日已收到通知。）​"], ["The payment shall be made within Net 30 days after the goods are delivered, without specifying the start date of the 30-day period", "（付款应在货物交付后 30 天内支付，未明确 30 天期限的起算日期）.​"], ["Net 30 payment terms shall apply, and no penalty shall be imposed for delayed payment within 10 days after the due date", "（适用 30 天付款期条款，到期后 10 天内延迟付款不收取违约金）.​"], ["In case of any dispute over the goods, the buyer may suspend the Net 30 payment without notifying the seller", "（若对货物存在任何争议，买方可暂停 30 天付款，无需通知卖方）.​"], ["The seller shall not provide any payment reminder during the Net 30 period, otherwise the payment period shall be extended by 15 days", "（卖方在 30 天付款期内不得发出任何付款提醒，否则付款期延长 15 天）.​"], ["Net 30 days shall be calculated from the date when the buyer confirms receipt of the invoice, rather than the date of goods delivery", "（30 天期限从买方确认收到发票之日起算，而非货物交付之日）.​"], ["If the buyer fails to make payment within Net 30 days, the seller can only claim the principal amount and no interest", "（若买方未在 30 天内付款，卖方仅可主张本金，不可主张利息）.​"], ["Net 30 payment terms are applicable only when the goods are inspected and accepted by the buyer's designated third-party organization", "（30 天付款期条款仅在货物经买方指定的第三方机构检验合格后适用）.​"], ["The buyer has the right to deduct 5% of the payment amount when making payment within Net 30 days as a quality deposit", "（买方在 30 天付款期内付款时，有权扣除 5% 的付款金额作为质量保证金）.​"], ["Net 30 days shall be extended automatically if there is any change in the market price of the goods during the period", "（若付款期内货物市场价格发生变动，30 天期限自动延长）.​"], ["The seller shall bear all bank fees incurred during the Net 30 payment process", "（30 天付款过程中产生的所有银行费用由卖方承担）.​"], ["The LC at sight shall be issued by a bank designated by the buyer, and the seller has no right to object to the bank's credit status", "（即期信用证由买方指定银行开立，卖方无权对该银行信用状况提出异议）.​"], ["The documents required for LC at sight negotiation include the buyer's written confirmation of goods acceptance, which is not a standard shipping document", "（即期信用证议付所需单据包括买方出具的货物验收书面确认书，该单据非标准货运单据）.​"], ["The LC at sight shall become effective only after the buyer pays a 10% deposit to the issuing bank, and the seller shall not be notified of the deposit payment status", "（即期信用证仅在买方向开证行支付 10% 保证金后生效，且卖方无权知晓保证金支付情况）.​"], ["The issuing bank of LC at sight has the right to delay payment for 7 working days after receiving the conforming documents", "（即期信用证开证行在收到相符单据后，有权延迟 7 个工作日付款）.​"], ["Any discrepancy in the documents under LC at sight shall result in the cancellation of the LC, and the buyer shall not be liable for reissuing the LC", "（即期信用证项下单据存在任何不符点，即导致信用证作废，买方无义务重新开立信用证）.​"], ["The LC at sight does not cover the risk of exchange rate fluctuation during the document negotiation period", "（即期信用证不涵盖单据议付期间的汇率波动风险）.​"], ["The seller shall submit all documents for LC at sight negotiation within 3 working days after the goods are shipped, otherwise the LC shall be invalid", "（卖方需在货物出运后 3 个工作日内提交即期信用证议付所需全部单据，否则信用证失效）.​"], ["The LC at sight specifies that the inspection certificate shall be issued by the buyer's on-site inspector, who may delay the certificate issuance arbitrarily", "（即期信用证规定检验证书由买方现场检验员出具，该检验员可随意延迟出具证书）.​"], ["The issuing bank of LC at sight may refuse payment if the goods are damaged during transportation, even if the documents are in conformity", "（即使单据相符，若货物在运输途中受损，即期信用证开证行仍可拒绝付款）.​"], ["The LC at sight does not clearly stipulate the place of document presentation, which may lead to disputes over the negotiation location", "（即期信用证未明确单据提交地点，可能引发议付地点争议）.​"], ["For goods with stable quality and long-term cooperation between the two parties, Net 30 payment terms can be adopted, but the start date of the payment period shall be clearly defined as the date of goods delivery", "（对于质量稳定且双方长期合作的货物，可采用 30 天付款期条款，但需明确付款期起算日期为货物交付日）.​"], ["For high-value or first-cooperation transactions, LC at sight is recommended, and the issuing bank shall be a bank with international credit rating of A or above", "（对于高价值或首次合作的交易，建议采用即期信用证，且开证行应为国际信用评级 A 级及以上银行）.​"], ["When choosing between Net 30 and LC at sight, the parties shall specify in the contract the handling method of force majeure events affecting payment", "（在选择 30 天付款期和即期信用证时，双方应在合同中明确影响付款的不可抗力事件处理方式）.​"], ["If Net 30 payment terms are adopted, a penalty clause for delayed payment shall be added, stipulating that the buyer shall pay 0.05% of the unpaid amount as liquidated damages per day for delayed payment", "（若采用 30 天付款期条款，应增加延迟付款违约金条款，约定买方延迟付款每日按未付款金额的 0.05% 支付违约金）.​"], ["When using LC at sight, the contract shall clearly list all required documents, and specify that the documents shall be in line with the International Chamber of Commerce's Uniform Customs and Practice for Documentary Credits （UCP 600）", "（采用即期信用证时，合同应明确列出所有所需单据，并注明单据需符合国际商会《跟单信用证统一惯例》​（UCP600））.​"], ["In case of the seller's delay in delivery, the liquidated damages shall be 5% of the total contract amount per day, without a maximum limit", "（若卖方延迟交货，违约金按合同总金额的 5%/ 日计算，无最高限额）.​"], ["The buyer shall pay liquidated damages of 10% of the contract amount if they fail to provide the shipping address within 3 days after the contract is signed, which is significantly higher than the actual loss", "（若买方在合同签订后 3 天内未提供货运地址，需支付合同金额 10% 的违约金，远高于实际损失）.​"], ["The liquidated damages clause is only applicable to the seller's breach of contract, and the buyer's breach of contract shall not be subject to any liquidated damages", "（违约金条款仅适用于卖方违约，买方违约无需承担任何违约金）.​"], ["Once the contract is signed, the buyer shall pay 20% of the contract amount as advance liquidated damages, which will not be returned even if both parties perform the contract normally", "（合同签订后，买方需立即支付合同金额 20% 作为预付违约金，即使双方正常履行合同也不予退还）.​"], ["In case of the buyer's delayed payment, the liquidated damages shall be calculated from the date of contract signing, rather than the due date of payment", "（买方延迟付款的违约金从合同签订之日起算，而非付款到期日）.​"], ["The liquidated damages for the seller's failure to provide after-sales service shall be 3% of the contract amount per month, and the calculation period shall not be limited", "（卖方未提供售后服务的违约金按合同金额 3%/ 月计算，计算期限无限制）.​"], ["The contract stipulates that liquidated damages shall be paid within 24 hours after the breach of contract is confirmed, otherwise the amount shall be doubled", "（合同约定违约金需在违约确认后 24 小时内支付，否则金额加倍）.​"], ["Liquidated damages for the buyer's cancellation of the contract shall be 100% of the contract amount, regardless of the stage of contract performance", "（买方解除合同的违约金为合同金额的 100%，不考虑合同履行阶段）.​"], ["The calculation method of liquidated damages is not specified in the contract, and the default is determined by the non-breaching party unilaterally", "（合同中未明确违约金计算方式，默认由守约方单方确定）.​"], ["In case of the seller's delay in delivery, the liquidated damages shall be 0.05% of the total contract amount per day, and the maximum amount shall not exceed 5% of the total contract amount", "（若卖方延迟交货，违约金按合同总金额的 0.05%/ 日计算，最高不超过合同总金额的 5%）.​"], ["If the buyer fails to make payment within the agreed period, the liquidated damages shall be calculated at the rate of 0.03% of the unpaid amount per day, starting from the next day after the due date", "（若买方未在约定期限内付款，违约金从付款到期日次日起，按未付款金额的 0.03%/ 日计算）.​"], ["For the seller's quality non-conformity, the liquidated damages shall be calculated based on the value of the non-conforming goods, and the rate shall be 10% of the value of the non-conforming goods if the quality problem can be repaired, and 30% if it cannot be repaired", "（卖方质量不符的违约金按不符货物价值计算，可修复的质量问题按不符货物价值的 10% 计算，不可修复的按 30% 计算）.​"], ["If the buyer fails to take delivery of the goods within 7 days after the goods arrive at the destination port, the liquidated damages shall be 0.1% of the contract amount per day, and the maximum shall not exceed 3% of the contract amount", "（若买方在货物到达目的港后 7 天内未提货，违约金按合同金额的 0.1%/ 日计算，最高不超过合同金额的 3%）.​"], ["In case of the seller's failure to deliver the goods as agreed due to their own reasons, the liquidated damages shall be calculated from the agreed delivery date, and if the delay exceeds 30 days, the buyer has the right to cancel the contract and claim liquidated damages of 8% of the contract amount", "（若卖方因自身原因未按约定交货，违约金从约定交货日起算，延迟超过 30 天的，买方有权解除合同并主张合同金额 8% 的违约金）.​"], ["Calculation formula for liquidated damages for seller's delayed delivery: Liquidated damages amount = Total contract amount × 0.05% × Number of delayed days（maximum 5% of total contract amount）", "（卖方延迟交货违约金计算公式：违约金金额 = 合同总金额 ×0.05%× 延迟天数（最高不超过合同总金额的 5%））.​"], ["Calculation formula for liquidated damages for buyer's delayed payment: Liquidated damages amount = Unpaid amount × 0.03% × Number of delayed days （starting from the next day after the due date）", "（买方延迟付款违约金计算公式：违约金金额 = 未付款金额 ×0.03%× 延迟天数（从付款到期日次日起算））.​"], ["Calculation formula for liquidated damages for seller's quality non-conformity （non-repairable）: Liquidated damages amount = Value of non-conforming goods × 30%", "（卖方质量不符​（不可修复）违约金计算公式：违约金金额 = 不符货物价值 ×30%）.​"], ["Calculation formula for liquidated damages for buyer's failure to take delivery on time: Liquidated damages amount = Contract amount × 0.1% × Number of delayed days （maximum 3% of contract amount）", "（买方未按时提货违约金计算公式：违约金金额 = 合同金额 ×0.1%× 延迟天数​（最高不超过合同金额的 3%））.​"], ["All intellectual property rights generated during the performance of the contract shall belong to the party who invests more funds", "（合同履行过程中产生的所有知识产权归出资较多的一方所有，表述模糊，未明确出资计算方式）.​"], ["The intellectual property rights of the customized products shall belong to both parties, without specifying the scope of use and profit distribution of the intellectual property rights", "（定制产品的知识产权归双方共有，未明确知识产权的使用范围和收益分配方式）.​"], ["The seller retains the intellectual property rights of the goods, and the buyer shall not use the goods for any commercial purpose, without defining the scope of \"commercial purpose\"", "（卖方保留货物的知识产权，买方不得将货物用于任何商业目的，未界定 “商业目的” 范围）.​"], ["The intellectual property rights generated by the buyer based on the seller's technical information shall belong to the seller, without specifying the definition of \"based on\"", "（买方基于卖方技术信息产生的知识产权归卖方所有，未明确 “基于” 的定义）.​"], ["After the contract is terminated, the intellectual property rights obtained by both parties during the contract period shall remain valid, but it is not clear whether they can continue to be used", "（合同终止后，双方在合同期间获得的知识产权继续有效，但未明确是否可继续使用）.​"], ["The intellectual property rights of the software provided by the seller shall belong to the seller, and the buyer has the right to use the software permanently, without specifying whether the right to use includes the right to upgrade and maintain", "（卖方提供的软件知识产权归卖方所有，买方有权永久使用该软件，未明确使用权是否包含升级维护权）.​"], ["All intellectual property rights related to the project shall belong to the party who completes the project first, without specifying the standard for determining \"completing the project first\"", "（与项目相关的所有知识产权归先完成项目的一方所有，未明确 “先完成项目” 的判定标准）.​"], ["The buyer shall not infringe the seller's intellectual property rights, but the contract does not list the specific intellectual property rights owned by the seller", "（买方不得侵犯卖方的知识产权，但合同未列出卖方拥有的具体知识产权）.​"], ["The intellectual property rights generated by the joint development of both parties shall be used by the party who proposes the development plan first, without specifying the time limit for use", "（双方共同开发产生的知识产权由先提出开发方案的一方使用，未明确使用期限）.​"], ["The seller warrants that the goods do not infringe any third-party intellectual property rights, but does not assume any liability if the infringement is caused by the buyer's modification of the goods", "（卖方保证货物不侵犯任何第三方知识产权，但因买方修改货物导致侵权的，卖方不承担任何责任，未明确 “修改” 的范围）.​"], ["All intellectual property rights （including but not limited to patents, trademarks, copyrights） generated during the performance of the contract due to the seller's independent research and development shall belong to the seller; those generated due to the buyer's independent research and development shall belong to the buyer; those generated by joint research and development shall be co-owned by both parties, and the scope of use of the co-owned intellectual property rights shall be limited to the performance of this contract, and the profit distribution shall be carried out in a ratio of 5:5", "（合同履行过程中，因卖方独立研发产生的所有知识产权​（包括但不限于专利权、商标权、著作权）归卖方所有；因买方独立研发产生的归买方所有；共同研发产生的由双方共有，共有知识产权的使用范围限于本合同履行，收益分配按 5:5 比例进行）.​"], ["The intellectual property rights of the customized products shall belong to the buyer, and the seller shall not use, reproduce or license any third party to use the intellectual property rights of the customized products without the buyer's written consent", "（定制产品的知识产权归买方所有，未经买方书面同意，卖方不得使用、复制或许可任何第三方使用该定制产品的知识产权）.​"], ["The seller retains the intellectual property rights of the goods, and the buyer has the right to use the goods for non-commercial purposes （including personal use, internal testing of the enterprise） and commercial purposes （including sales, lease） within the scope of the contract, but shall not resell the intellectual property rights of the goods independently", "（卖方保留货物的知识产权，买方有权在合同范围内将货物用于非商业目的​（包括个人使用、企业内部测试）和商业目的​（包括销售、租赁），但不得单独转售货物的知识产权）.​"], ["The intellectual property rights generated by the buyer using the seller's technical information to carry out innovative research and development （with more than 50% of the innovative content independently completed by the buyer） shall belong to the buyer , and the buyer shall notify the seller in writing of the relevant intellectual property rights within 15 days after the completion of the research and development; if the innovative content independently completed by the buyer is less than 50%, the intellectual property rights shall belong to the seller, and the buyer shall have the right to use it free of charge within the scope of this contract", "（买方使用卖方技术信息进行创新性研发，且由买方独立完成的创新内容占比超过 50% 的，所产生的知识产权归买方所有，买方应在研发完成后 15 日内将相关知识产权情况书面通知卖方；若买方独立完成的创新内容占比不足 50%，则知识产权归卖方所有，买方在本合同范围内有权免费使用）.​"], ["After the contract is terminated, the buyer shall stop using the seller's intellectual property rights that are exclusive to the seller within 30 days, except for the intellectual property rights that the buyer has obtained the right to use permanently through separate agreement; the seller shall not revoke the buyer's existing right to use the intellectual property rights that have been paid for", "（合同终止后，买方应在 30 日内停止使用卖方专有的知识产权，但买方通过单独协议已获得永久使用权的知识产权除外；卖方不得撤销买方已付费获得的现有知识产权使用权）.​"], ["The intellectual property rights of the software provided by the seller belong to the seller, and the buyer's permanent right to use the software includes the right to obtain free upgrade services within 2 years from the date of purchase and the right to enjoy paid maintenance services （the maintenance fee standard shall be agreed separately in the annex）; the seller shall provide the buyer with a written list of the scope of upgrade and maintenance services", "（卖方提供的软件知识产权归卖方所有，买方对该软件的永久使用权包括自购买之日起 2 年内获得免费升级服务的权利及享受付费维护服务的权利​（维护费标准在附件中另行约定）；卖方应向买方提供升级及维护服务范围的书面清单）.​"], ["All intellectual property rights related to the project shall belong to the party who completes the project and submits the project completion report to the other party in writing first; the project completion report shall include the specific content of the project, the list of achievements and the certification materials of completion, and the other party shall confirm the receipt of the report within 5 working days", "（与项目相关的所有知识产权归先完成项目且向对方书面提交项目竣工报告的一方所有；项目竣工报告应包含项目具体内容、成果清单及竣工证明材料，对方应在 5 个工作日内确认收到该报告）.​"], ["The buyer shall not infringe the seller's intellectual property rights, and the seller shall provide the buyer with a written list of specific intellectual property rights （including patent numbers, trademark registration numbers, copyright registration certificates, etc.） owned by the seller related to the goods within 3 working days after the contract is signed; if the seller updates the intellectual property rights during the contract period, it shall notify the buyer in writing within 3 days", "（买方不得侵犯卖方的知识产权，卖方应在合同签订后 3 个工作日内，向买方提供与货物相关的卖方拥有的具体知识产权​（包括专利号、商标注册号、著作权登记证书等）书面清单；若卖方在合同期间更新知识产权，应在 3 日内书面通知买方）.​"], ["The intellectual property rights generated by the joint development of both parties shall be used by the party who proposes the development plan first for a period of 1 year from the date of completion of the development; after the expiration of the period, both parties shall negotiate on the use and profit distribution of the intellectual property rights, and if no agreement is reached, they shall be used equally and the profits shall be distributed in a ratio of 5:5", "（双方共同开发产生的知识产权由先提出开发方案的一方在开发完成之日起 1 年内使用；期限届满后，双方就该知识产权的使用及收益分配进行协商，协商不成的，按均等使用、收益 5:5 分配的方式处理）."], ["The seller warrants that the goods do not infringe any third-party intellectual property rights; if the infringement is caused by the buyer's modification of the goods, the seller shall not be liable only if the buyer's modification exceeds the scope of the \"reasonable use modification\" agreed in the contract （the scope of reasonable use modification includes replacing non-core components and adjusting appearance colors）; the buyer shall notify the seller in writing before modifying the goods", "（卖方保证货物不侵犯任何第三方知识产权；因买方修改货物导致侵权的，仅当买方的修改超出合同约定的 “合理使用修改” 范围（合理使用修改范围包括更换非核心零部件、调整外观颜色）时，卖方才不承担责任；买方修改货物前应书面通知卖方）.​"], ["Any dispute arising from this contract shall be submitted to an arbitration institution designated by the buyer for arbitration, and the arbitration rules shall be determined by the arbitration institution unilaterally", "（因本合同产生的任何争议，均提交买方指定的仲裁机构进行仲裁，仲裁规则由该仲裁机构单方确定）.​"], ["The arbitration award shall be final, and neither party shall apply for revocation or enforcement objection to the arbitration award in any court", "（仲裁裁决为终局裁决，任何一方不得向任何法院申请撤销或对裁决执行提出异议）.​"], ["The arbitration fee shall be borne by the losing party, but the arbitration institution has the right to adjust the fee-bearing party without giving reasons", "（仲裁费用由败诉方承担，但仲裁机构有权无理由调整费用承担方）.​"], ["The place of arbitration shall be the place where the buyer's main place of business is located, and it shall not be changed even if the buyer's main place of business is moved", "（仲裁地为买方主要营业地所在地，即使买方主要营业地迁移，也不得变更）.​"], ["The arbitration procedure shall be conducted in a language designated by the arbitration institution, and the parties shall bear the cost of translation if they do not understand the language", "（仲裁程序采用仲裁机构指定的语言进行，当事人不理解该语言的，需自行承担翻译费用）.​"], ["The arbitration institution shall not accept the evidence submitted by the parties after the deadline for submitting evidence, even if the evidence is crucial to the case", "（仲裁机构对当事人超过举证期限提交的证据不予采纳，即使该证据对案件至关重要）.​"], ["The arbitration award shall not include the reasons for the award, and the parties shall not request the arbitration institution to explain the award", "（仲裁裁决书中不包含裁决理由，当事人不得要求仲裁机构对裁决进行解释）.​"], ["Any dispute related to the validity of the contract shall not be submitted to arbitration, but shall be resolved by the buyer's designated court", "（与合同效力相关的任何争议不得提交仲裁，而由买方指定的法院解决）.​"], ["The arbitration agreement shall become invalid if the contract is terminated, and the disputes arising from the performance of the contract before termination shall be resolved by litigation", "（若合同终止，仲裁协议即失效，终止前因合同履行产生的争议通过诉讼解决）.​"], ["The parties shall not select the arbitrators independently, and the arbitrators shall be appointed by the arbitration institution in full", "（当事人不得自行选定仲裁员，仲裁员全部由仲裁机构指定）.​"], ["Any dispute arising from this contract shall be under the exclusive jurisdiction of the court where the buyer's main place of business is located, and the seller shall not raise an objection to the jurisdiction", "（因本合同产生的任何争议，均由买方主要营业地所在地法院专属管辖，卖方不得提出管辖权异议）.​"], ["The court proceedings shall be conducted in the local language of the court, and the parties shall not request to use a common language", "（法院诉讼程序采用法院所在地语言进行，当事人不得要求使用通用语言）.​"], ["The judgment of the first instance shall be final, and neither party shall have the right to appeal", "（一审判决即为终审判决，任何一方无权提起上诉）.​"], ["The court shall not accept the property preservation application submitted by the parties before the litigation, and shall only consider the property preservation during the litigation process", "（法院对当事人在诉讼前提交的财产保全申请不予受理，仅在诉讼过程中考虑财产保全）.​"], ["The parties shall bear their own litigation costs regardless of the outcome of the case, and the court shall not rule that the losing party bears the litigation costs of the winning party", "（无论案件结果如何，当事人各自承担诉讼费用，法院不裁决败诉方承担胜诉方的诉讼费用）.​"], ["The evidence submitted by the parties must be notarized and authenticated by the court's designated institution, otherwise it shall not be used as the basis for determining the case", "（当事人提交的证据必须经法院指定机构公证认证，否则不得作为认定案件事实的依据）.​"], ["The court shall not conduct cross-examination of the witnesses provided by the parties, and shall only adopt the written testimony of the witnesses", "（法院不对当事人提供的证人进行质证，仅采纳证人的书面证言）.​"], ["The execution of the court judgment shall be limited to the territory of the court's country, and the court shall not assist in applying for enforcement in other countrie", "（法院判决的执行仅限于该法院所在国境内，法院不协助在其他国家申请执行）.​"], ["The statute of limitations for initiating litigation shall be 6 months from the date when the right to claim is known or should be known, which is shorter than the statutory statute of limitations", "（提起诉讼的诉讼时效为自权利主张人知道或应当知道权利受损之日起 6 个月，短于法定诉讼时效）.​"], ["The court has the right to dismiss the case without notifying the parties if it deems that the dispute is not within its jurisdiction after accepting the case", "（法院受理案件后，若认为争议不属于其管辖范围，有权不通知当事人而直接驳回案件）.​"], ["For disputes involving trade secrets or requiring quick resolution, it is recommended to choose arbitration; the arbitration institution shall be a well-known international arbitration institution （such as ICC Arbitration Court, Singapore International Arbitration Centre） agreed by both parties, and the arbitration rules shall be the official rules of the selected arbitration institution", "（对于涉及商业秘密或需快速解决的争议，建议选择仲裁；仲裁机构应为双方协商一致的知名国际仲裁机构​（如国际商会仲裁院、新加坡国际仲裁中心），仲裁规则采用所选仲裁机构的正式规则）.​"], ["For disputes involving the enforcement of judgments in multiple countries or requiring the application of national mandatory laws, it is recommended to choose litigation; the place of litigation shall be the place where the defendant's main place of business is located or the place where the contract is performed, and the applicable law shall be clearly stipulated as the law of the place of litigation", "（对于涉及多国判决执行或需适用国家强制性法律的争议，建议选择诉讼；诉讼地应为被告主要营业地或合同履行地，适用法律明确约定为诉讼地法律）.​"], ["When choosing arbitration, the contract shall clearly stipulate the composition of the arbitral tribunal （one arbitrator or three arbitrators）, the method of selecting arbitrators （each party selects one, and the chairman is jointly selected by the two parties） and the time limit for rendering the arbitration award （generally within 6 months from the date of formation of the arbitral tribunal）", "（选择仲裁时，合同应明确约定仲裁庭的组成​（独任仲裁员或三名仲裁员）、仲裁员的选定方式​（双方各选一名，首席仲裁员由双方共同选定）及作出仲裁裁决的期限​（一般自仲裁庭组成之日起 6 个月内））.​"], ["When choosing litigation, the contract shall clearly stipulate the level of the court （basic people's court, intermediate people's court, etc.） and the scope of jurisdiction （contract dispute, tort dispute, etc.） to avoid disputes over jurisdiction; if both parties are in different countries, it is recommended to choose a court in a country that has concluded a judicial assistance treaty with both parties' countries", "（选择诉讼时，合同应明确约定法院的级别​（基层人民法院、中级人民法院等）及管辖范围​（合同纠纷、侵权纠纷等），避免管辖争议；若双方位于不同国家，建议选择与双方国家均缔结司法协助条约的国家的法院）.​"], ["Whether choosing arbitration or litigation, the contract shall stipulate the method of serving legal documents （express mail, email, etc.） and the time limit for receiving documents; if the parties change their contact information, they shall notify the other party in writing within 3 days, otherwise they shall bear the consequences of failure to receive documents", "（无论选择仲裁还是诉讼，合同均应约定法律文书的送达方式​（快递、电子邮件等）及文书接收期限；当事人变更联系方式的，应在 3 日内书面通知对方，否则承担无法接收文书的后果）.​"], ["The parties shall not be liable for breach of contract due to force majeure events, but the contract does not define the specific scope of force majeure events", "（因不可抗力事件导致违约的，当事人不承担违约责任，但合同未界定不可抗力事件的具体范围）.​"], ["After a force majeure event occurs, the party affected by the event shall notify the other party within a reasonable time, but the contract does not specify the specific number of days of the \"reasonable time\"", "（不可抗力事件发生后，受事件影响的一方应在合理时间内通知对方，但合同未明确 “合理时间” 的具体天数）.​"], ["The party claiming force majeure shall provide proof materials, but the contract does not specify the type of proof materials （certificate issued by the government, report issued by a third-party institution, etc.） and the time limit for submission", "（主张不可抗力的一方应提供证明材料，但合同未明确证明材料的类型​（政府出具的证明、第三方机构出具的报告等）及提交期限）.​"], ["Force majeure events can exempt the party from all obligations under the contract, without distinguishing between the obligations directly affected by the event and other obligations", "（不可抗力事件可免除当事人在合同项下的全部义务，未区分受事件直接影响的义务与其他义务）.​"], ["After the force majeure event ends, the parties shall resume the performance of the contract within a certain period, but the contract does not specify whether the extended performance period shall be calculated according to the duration of the force majeure event", "（不可抗力事件结束后，当事人应在一定期限内恢复履行合同，但合同未明确延长的履行期限是否根据不可抗力事件持续时间计算）.​"], ["If the force majeure event lasts for more than 3 months, either party has the right to cancel the contract, but the contract does not specify whether the party canceling the contract needs to compensate the other party for the losses caused by the cancellation", "（若不可抗力事件持续超过 3 个月，任何一方有权解除合同，但合同未明确解除合同的一方是否需赔偿对方因解除合同造成的损失）.​"], ["The party affected by force majeure shall take measures to reduce losses, but the contract does not specify the specific scope of \"loss reduction measures\" and whether the costs incurred by taking measures shall be borne by both parties", "（受不可抗力影响的一方应采取措施减少损失，但合同未明确 “减损措施” 的具体范围及采取措施产生的费用是否由双方共同承担）.​"], ["Force majeure events include \"changes in market conditions\", which expands the scope of force majeure improperly and may lead to abuse of the force majeure clause", "（不可抗力事件包括 “市场行情变化”，不当扩大了不可抗力的范围，可能导致不可抗力条款被滥用）.​"], ["The force majeure clause is only applicable to the seller's breach of contract, and the buyer's breach of contract caused by force majeure shall not be exempted from liability", "（不可抗力条款仅适用于卖方违约，买方因不可抗力导致的违约不免除责任）.​"], ["After the occurrence of a force majeure event, the party affected by the event shall notify the other party verbally, and there is no requirement for written notification, which may lead to disputes over whether the notification has been made", "（不可抗力事件发生后，受影响方仅需口头通知对方，无书面通知要求，可能导致是否已通知的争议）.​"], ["In the foreign trade contract dispute case, the seller claimed that the delay in delivery was caused by a \"port strike\" （a force majeure event）, but the contract did not include \"port strike\" in the specific scope of force majeure, so the court did not support the seller's force majeure defense", "（在外贸合同纠纷案中，卖方主张因 “港口罢工”​（不可抗力事件）导致延迟交货，但合同未将 “港口罢工” 纳入不可抗力具体范围，法院未支持卖方的不可抗力抗辩）.​"], ["To avoid similar disputes, the force majeure clause shall clearly list the specific scope of force majeure events, including natural disasters （earthquakes, floods, typhoons）, social events （wars, riots, port strikes） and government actions （administrative orders, import and export bans）", "（为避免类似纠纷，不可抗力条款应明确列举不可抗力事件的具体范围，包括自然灾害（地震、洪水、台风）、社会事件（战争、骚乱、港口罢工）及政府行为​（行政命令、进出口禁令））.​"], ["In the case, the seller notified the buyer of the force majeure event 15 days after the occurrence of the port strike, and the buyer argued that the notification was overdue; the revised force majeure clause shall stipulate that the affected party shall notify the other party in writing within 3 working days after the occurrence of the force majeure event, and attach the initial proof materials", "（在该案中，卖方在港口罢工发生后 15 天才通知买方不可抗力事件，买方主张通知逾期；修正后的不可抗力条款应约定受影响方需在不可抗力事件发生后 3 个工作日内书面通知对方，并附上初步证明材料）.​"], ["The seller in the case failed to provide valid proof materials of the port strike （only provided a news report）, and the court held that the proof was insufficient; the revised clause shall specify that the proof materials of force majeure include the certificate issued by the local government or the port authority, and the submission deadline shall be within 7 working days after the notification", "（该案中卖方未能提供港口罢工的有效证明材料​（仅提供了新闻报道），法院认定证明材料不足；修正后的条款应明确不可抗力证明材料包括当地政府或港口管理部门出具的证明文件，且提交期限为通知发出后 7 个工作日内）.​"], ["In the dispute, the seller claimed that all delivery obligations should be exempted due to the port strike, but the buyer argued that only the delayed part of the delivery should be exempted; the revised force majeure clause shall stipulate that force majeure only exempts the party from the obligations directly affected by the event（e.g., delayed delivery caused by port strike）, and other obligations not affected by the event（e.g., providing product quality certificates） shall still be performed", "（在纠纷中，卖方主张因港口罢工应免除全部交货义务，买方则认为仅应免除延迟交货部分义务；修正后的不可抗力条款应约定，不可抗力仅免除当事人受事件直接影响的义务​（如港口罢工导致的延迟交货），不受事件影响的其他义务​如提供产品质量证书）仍需履行）.​"], ["After the port strike ended, the seller requested to resume delivery within 7 days, while the buyer believed that the delivery period should be extended according to the 10-day duration of the strike; the revised clause shall specify that the extended performance period after the end of force majeure shall be equal to the duration of the force majeure event, and the specific resumption time shall be confirmed by both parties in writing", "（港口罢工结束后，卖方要求 7 日内恢复交货，买方则认为应按罢工持续的 10 天延长交货期；修正后的条款应明确，不可抗力结束后的履行延长期限与不可抗力事件持续时间相等，具体恢复履行时间由双方书面确认）.​"], ["The port strike lasted for 4 months, and the seller proposed to cancel the contract without compensating the buyer's advance payment loss; the revised force majeure clause shall stipulate that if the force majeure event lasts for more than 3 months and either party cancels the contract, the canceling party shall return the prepayment received within 15 days, and shall not be liable for other compensation unless otherwise agreed", "（港口罢工持续 4 个月，卖方提出解除合同且不赔偿买方预付款损失；修正后的不可抗力条款应约定，若不可抗力事件持续超过 3 个月且一方解除合同，解除方应在 15 日内返还已收取的预付款，除非另有约定，无需承担其他赔偿责任）.​"], ["The buyer claimed that the seller did not take measures to transfer the goods to other ports for shipment during the port strike, resulting in expanded losses; the revised clause shall specify that the affected party shall take reasonable loss reduction measures （such as transferring to alternative ports, adjusting transportation methods） and provide written proof of the measures taken; the costs incurred by the measures shall be borne by both parties equally", "（买方主张卖方在港口罢工期间未采取将货物转运至其他港口发货的措施，导致损失扩大；修正后的条款应明确，受影响方应采取合理减损措施​（如转运至备选港口、调整运输方式），并提供已采取措施的书面证明；措施产生的费用由双方平均承担）.​"], ["The seller argued that the decline in product prices due to \"market condition changes\" constituted force majeure and requested to adjust the contract price, which was rejected by the buyer; the revised force majeure clause shall explicitly exclude \"market condition changes\", \"changes in raw material prices\" and other commercial risks from the scope of force majeure", "（卖方主张因 “市场行情变化” 导致产品价格下跌构成不可抗力，要求调整合同价格，遭买方拒绝；修正后的不可抗力条款应明确将 “市场行情变化”“原材料价格变动” 等商业风险排除在不可抗力范围之外）.​"], ["The seller verbally notified the buyer of the port strike, but failed to provide written evidence, leading to disputes over whether the notification was made; the revised clause shall stipulate that the notification of force majeure must be in writing （including email with official seal, registered mail） and shall be accompanied by a delivery certificate （such as a courier receipt, email read receipt）", "（卖方仅口头通知买方港口罢工，未提供书面证据，导致是否通知的争议；修正后的条款应约定，不可抗力通知必须采用书面形式​（包括加盖公章的邮件、挂号信），且需附带送达凭证​（如快递回执、邮件已读证明））.​"], ["This Contract Negotiation Memorandum （hereinafter referred to as \"Memorandum\"） is made by and between Party A [Full Name of Party A] （registered address: [Address of Party A]） and Party B [Full Name of Party B] （registered address: [Address of Party B]） on [Negotiation Date]", "（本合同谈判备忘录​（以下简称 “备忘录”）由甲方 [甲方全称]​（注册地址：[甲方地址]）与乙方 [乙方全称]​（注册地址：[乙方地址]）于 [谈判日期] 签订）.​"], ["The purpose of this Memorandum is to record the key consensus reached during the negotiation of [Name of the Contract to be Signed] （hereinafter referred to as \"the Proposed Contract\"） and the issues to be further confirmed, and it does not constitute a legally binding contract unless otherwise specified", "（本备忘录旨在记录双方就《[待签订合同名称]》​（以下简称 “待签合同”）谈判过程中达成的核心共识及需进一步确认的事项，除非另有约定，本备忘录不构成具有法律约束力的合同）.​"], ["The representatives of both parties participating in the negotiation are: Party A: [Name of Representative], Position: [Position], Contact Information: [Phone/Email]; Party B: [Name of Representative], Position: [Position], Contact Information: [Phone/Email]; the representatives have obtained the legal authorization of their respective parties to participate in the negotiation and sign this Memorandum", "（参与本次谈判的双方代表为：甲方：[代表姓名]，职务：[职务]，联系方式：[电话 / 邮箱]；乙方：[代表姓名]，职务：[职务]，联系方式：[电话 / 邮箱]；上述代表已获得各自所在方的合法授权，有权参与谈判并签署本备忘录）.​"], ["The negotiation was held at [Negotiation Venue] （including online negotiation platform: [Platform Name] if it is an online negotiation） from [Start Time] to [End Time] on [Negotiation Date], and the minutes of the negotiation were recorded by [Recorder's Name] （from [Party A/Party B]） and confirmed by both parties' representatives", "（本次谈判于 [谈判日期] 的 [开始时间] 至 [结束时间] 在 [谈判地点]​（若为线上谈判，需注明线上平台：[平台名称]）举行，谈判纪要由 [记录人姓名]​（来自 [甲方 / 乙方]）记录，并经双方代表确认）.​"], ["Any modification or supplement to this Memorandum shall be made in writing and signed by the representatives of both parties; the modified or supplemented content shall have the same effect as this Memorandum", "（对本备忘录的任何修改或补充，均需以书面形式作出并经双方代表签字确认；修改或补充的内容与本备忘录具有同等效力）.​"], ["Both parties agree that the total contract amount of the Proposed Contract shall be [Amount in Figures] （in words: [Amount in Words]）, and the currency shall be [Currency Type, e.g., US Dollar/Chinese Yuan]; the payment method shall be [Payment Method, e.g., 30% advance payment by T/T, 70% balance by LC at sight]", "（双方同意，待签合同的合同总金额为 [数字金额]​（大写：[中文大写金额]），币种为 [货币种类，如美元 / 人民币]；付款方式为 [付款方式，如电汇预付 30%，余款 70% 即期信用证支付]）.​"], ["Both parties confirm that the delivery term of the Proposed Contract shall be [Delivery Time, e.g., within 45 days after receiving the advance payment], and the delivery place shall be [Delivery Place, e.g., Port of Shanghai, China]; the risk of loss or damage to the goods shall pass to Party B when the goods are loaded on board the vessel at the port of shipment", "（双方确认，待签合同的交货期限为 [交货时间，如收到预付款后 45 日内]，交货地点为 [交货地点，如中国上海港]；货物灭失或损坏的风险在货物于装运港装上船舶时转移至乙方）.​"], ["Both parties reach a consensus that the quality standard of the goods under the Proposed Contract shall comply with [Quality Standard, e.g., ISO 9001:2015 International Quality Management System Standard] and the technical parameters specified in Appendix 1 of the Proposed Contract; Party A shall provide a quality inspection report issued by a third-party testing institution before delivery", "（双方达成共识，待签合同项下货物的质量标准应符合 [质量标准，如 ISO 9001:2015 国际质量管理体系标准] 及待签合同附件 1 约定的技术参数；甲方应在交货前提供第三方检测机构出具的质量检验报告）.​"], ["Both parties agree that the dispute resolution method for the Proposed Contract shall be arbitration; the arbitration institution shall be the Singapore International Arbitration Centre （SIAC）, the number of arbitrators shall be three （each party selects one, and the chairman is jointly selected by the two parties）, and the arbitration award shall be final and binding on both parties", "（双方同意，待签合同的争议解决方式为仲裁；仲裁机构为新加坡国际仲裁中心​（SIAC），仲裁员人数为三名​（双方各选一名，首席仲裁员由双方共同选定），仲裁裁决为终局裁决，对双方具有约束力）.​"], ["Both parties confirm that the validity period of the Proposed Contract shall be [Validity Period, e.g., 2 years from the date of signing], and if either party needs to renew the contract, it shall notify the other party in writing 30 days before the expiration of the validity period", "（双方确认，待签合同的有效期为 [有效期，如自签署之日起 2 年]，若任何一方需续签合同，应在有效期届满前 30 日书面通知对方）.​"], ["Both parties shall further confirm the specific content of the after-sales service clause of the Proposed Contract, including the scope of after-sales service （on-site maintenance, remote technical support）, the service response time （within 24 hours for emergency issues） and the service fee standard （free within the warranty period, paid after the warranty period） by [Confirmation Deadline]", "（双方应在 [确认截止日期] 前进一步确认待签合同售后服务条款的具体内容，包括售后服务范围​（现场维修、远程技术支持）、服务响应时间​（紧急问题 24 小时内响应）及服务费用标准​（质保期内免费，质保期后付费））.​"], ["Party A shall provide the detailed list of intellectual property rights related to the goods （including patent numbers, trademark registration certificates） to Party B by [Submission Deadline], and Party B shall confirm whether there is any objection to the intellectual property ownership within 5 working days after receiving the list", "（甲方应在 [提交截止日期] 前向乙方提供与货物相关的知识产权详细清单​（包括专利号、商标注册证），乙方应在收到清单后 5 个工作日内确认对知识产权归属是否存在异议）.​"], ["Both parties shall negotiate and confirm the specific provisions of the force majeure clause of the Proposed Contract, including the specific scope of force majeure events, the notification time limit and the proof materials requirements, and complete the confirmation before [Negotiation Resumption Date]", "（双方应协商确认待签合同不可抗力条款的具体约定，包括不可抗力事件的具体范围、通知时限及证明材料要求，并在 [谈判重启日期] 前完成确认）.​"], ["Party B shall provide the credit certificate of the issuing bank designated for the LC payment to Party A by [Submission Deadline], and Party A shall confirm whether the credit status of the issuing bank meets the requirements within 3 working days after receiving the certificate", "（乙方应在 [提交截止日期] 前向甲方提供即期信用证付款指定的开证行信用证明，甲方应在收到证明后 3 个工作日内确认开证行信用状况是否符合要求）.​"], ["Both parties shall confirm the specific format and submission time of the documents required for the performance of the Proposed Contract （including commercial invoice, packing list, bill of lading） by [Confirmation Deadline], and ensure that the documents comply with the requirements of the customs of the importing country", "（双方应在 [确认截止日期] 前确认待签合同履行所需单据​（包括商业发票、装箱单、提单）的具体格式及提交时间，并确保单据符合进口国海关要求）.​"], ["Both parties shall keep confidential all the information obtained during the negotiation process （including the content of this Memorandum, the terms of the Proposed Contract and the business data of the other party） and shall not disclose it to any third party without the written consent of the other party; the confidentiality obligation shall continue to be valid for 3 years after the termination of this Memorandum", "（双方应对谈判过程中获取的全部信息​（包括本备忘录内容、待签合同条款及对方商业数据）承担保密义务，未经对方书面同意，不得向任何第三方披露；本备忘录终止后，保密义务仍持续有效 3 年）.​"], ["This Memorandum shall take effect from the date of signature by the representatives of both parties; if the Proposed Contract is formally signed, the content of this Memorandum that is consistent with the Proposed Contract shall be superseded by the Proposed Contract", "（本备忘录自双方代表签字之日起生效；若待签合同正式签署，本备忘录中与待签合同内容一致的部分，以待签合同为准）.​"], ["If the Proposed Contract is not formally signed due to reasons not attributable to either party （e.g., failure to obtain government approval）, both parties shall not be liable to each other, but shall return the materials and documents obtained from the other party within 10 working days", "（若因不可归责于双方的原因​（如未获得政府审批）导致待签合同未正式签署，双方互不承担责任，但应在 10 个工作日内返还从对方获取的资料文件）.​"], ["This Memorandum shall be made in two copies, one for each party, and both copies shall have the same legal effect", "（本备忘录一式两份，甲乙双方各执一份，两份具有同等法律效力）.​"], ["Any dispute arising from the interpretation or performance of this Memorandum shall be resolved through friendly negotiation between the two parties; if the negotiation fails, it shall be submitted to the people's court where Party A's main place of business is located for litigation", "（因本备忘录的解释或履行产生的任何争议，由双方友好协商解决；协商不成的，提交甲方主要营业地所在地人民法院诉讼解决）.​"], ["The Contract Clause Online Review Platform （hereinafter referred to as \"the Platform\"） supports multi-language review of contract clauses, including English, Chinese, Japanese, German, French and other 12 common languages, and can automatically identify the language type of the uploaded contract and switch to the corresponding review mode", "（合同条款在线审核平台​（以下简称 “平台”）支持合同条款多语言审核，涵盖英语、中文、日语、德语、法语等 12 种常用语言，可自动识别上传合同的语言类型并切换至对应审核模式）.​"], ["The Platform has a built-in database of 100,000+ contract clause risk point（including the 600 English clause traps covered in this document）, and can automatically scan the uploaded contract within 3 minutes to mark high-risk clauses （marked in red）, medium-risk clauses （marked in yellow） and low-risk clauses （marked in blue）", "（平台内置 10 万 + 合同条款风险点数据库​（含本文涵盖的 600 个英文条款陷阱），可在 3 分钟内自动扫描上传的合同，标记高风险条款​（红色标注）、中风险条款（黄色标注）及低风险条款（蓝色标注））.​"], ["For the risky clauses identified by the Platform, it will provide targeted modification suggestions and legal basis （including international conventions, national laws and industry standards）; for English clauses, it will also provide corresponding Chinese translation of the modified clauses to ensure that both parties of the contract understand the meaning consistently", "（针对平台识别出的风险条款，平台将提供针对性修改建议及法律依据​（包括国际公约、各国法律及行业标准）；对于英文条款，还将提供修改后条款的对应中文翻译，确保合同双方对条款含义理解一致）.​"], ["The Platform supports online collaboration between multiple users, allowing contract negotiators of both parties to log in to the same project account at the same time, view the review results in real time, comment on risky clauses and track the modification progress of the clauses", "（平台支持多用户在线协作，合同双方谈判人员可同时登录同一项目账号，实时查看审核结果、对风险条款进行评论并跟踪条款修改进度）.​"], ["The Platform provides a contract clause comparison function, which can upload the original contract and the modified contract at the same time, and automatically highlight the modified content （including added, deleted and revised clauses） to help users quickly identify the differences between the two versions", "（平台提供合同条款对比功能，可同时上传原合同与修改后的合同，自动高亮显示修改内容（包括新增、删除及修订的条款），帮助用户快速识别两个版本的差异）.​"], ["The user shall register an account on the Platform by providing valid information （including enterprise name, contact person, contact information） and complete real-name authentication; the Platform shall keep the user's registration information confidential in accordance with the \"Personal Information Protection Law\" and shall not disclose it to any third party without authorization", "（用户需提供有效信息​（包括企业名称、联系人、联系方式）在平台注册账号并完成实名认证；平台应依据《个人信息保护法》对用户注册信息承担保密义务，未经授权不得向任何第三方披露）."], ["After completing the account registration and real-name authentication, the user can log in to the Platform, select the \"Contract Upload\" function module, and upload the contract file to be reviewed （supporting file formats such as Word, PDF, and TXT）; the Platform will automatically detect the file size, and the maximum size of a single uploaded file shall not exceed 20MB", "（用户完成账号注册及实名认证后，可登录平台，选择 “合同上传” 功能模块，上传待审核的合同文件​（支持 Word、PDF、TXT 等文件格式）；平台将自动检测文件大小，单个上传文件最大不超过 20MB）.​"], ["After the contract is uploaded successfully, the user shall select the type of the contract （e.g., foreign trade contract, service contract, intellectual property license contract） and the target language for review （e.g., English to Chinese, Chinese to English） on the operation interface, and then click the \"Start Review\" button to initiate the automatic review process", "（合同上传成功后，用户需在操作界面选择合同类型​（如外贸合同、服务合同、知识产权许可合同）及审核目标语言​（如英文转中文、中文转英文），随后点击 “开始审核” 按钮启动自动审核流程）.​"], ["During the automatic review process, the user can view the real-time progress of the review on the Platform's progress bar （displayed as a percentage）; if the network is interrupted during the review, the Platform will automatically save the review progress, and the user can continue the unfinished review process after reconnecting to the network", "（自动审核过程中，用户可在平台进度条​（以百分比显示）查看审核实时进度；若审核过程中出现网络中断，平台将自动保存审核进度，用户重新连接网络后可继续未完成的审核流程）.​"], ["After the review is completed, the Platform will generate a \"Contract Review Report\" and send a notification to the user's registered email; the user can log in to the Platform to download the report, which includes the risk level statistics of the contract clauses, the detailed analysis of risky clauses, modification suggestions and corresponding legal basis", "（审核完成后，平台将生成《合同审核报告》并向用户注册邮箱发送通知；用户可登录平台下载该报告，报告内容包括合同条款风险等级统计、风险条款详细分析、修改建议及对应法律依据）.​"], ["If the user has questions about the review results or needs to adjust the modification suggestions, they can use the \"Consultation Service\" function on the Platform to submit a consultation application to the Platform's professional legal team; the legal team shall reply to the user's consultation within 2 working days and provide further professional explanations", "（若用户对审核结果有疑问或需调整修改建议，可通过平台 “咨询服务” 功能向平台专业法律团队提交咨询申请；法律团队应在 2 个工作日内回复用户咨询并提供进一步专业解读）.​"], ["The Platform adopts advanced data encryption technology （including SSL encryption, AES-256 encryption） to encrypt the user's uploaded contract files and review data during transmission and storage, ensuring that the user's contract information is not leaked, tampered with or damaged", "（平台采用先进的数据加密技术​（包括 SSL 加密、AES-256 加密），对用户上传的合同文件及审核数据在传输和存储过程中进行加密处理，确保用户合同信息不被泄露、篡改或损坏）.​"], ["The Platform shall not use the user's contract content for any commercial purpose （including data mining, model training） without the user's written consent; after the user deletes the contract file on the Platform, the Platform shall completely delete the corresponding data from the server within 7 days and provide a deletion confirmation certificate to the user", "（未经用户书面同意，平台不得将用户合同内容用于任何商业目的​（包括数据挖掘、模型训练）；用户在平台删除合同文件后，平台应在 7 日内从服务器中彻底删除对应数据，并向用户提供删除确认凭证）.​"], ["The Platform provides two charging modes: \"Single Review\" and \"Annual Membership\"; the \"Single Review\" mode charges according to the number of pages of the contract （the charge standard is [X] yuan per page）, and the \"Annual Membership\" mode charges a fixed annual fee （the fee is [Y] yuan per year）, and members can enjoy unlimited free reviews of contracts within the membership period", "（平台提供 “单次审核” 和 “年度会员” 两种收费模式；“单次审核” 模式按合同页数收（收费标准为每页 [X] 元），“年度会员” 模式收取固定年费​（费用为每年 [Y] 元），会员在会员期内可享受无限次免费合同审核服务）.​"], ["The user shall pay the corresponding service fee through the Platform's official payment channels （including online banking, Alipay, WeChat Pay）; after the payment is successful, the Platform shall issue an electronic invoice to the user's registered email within 3 working days, and the invoice content shall comply with the national tax regulations", "（用户需通过平台官方支付渠道（包括网银、支付宝、微信支付）支付相应服务费用；支付成功后，平台应在 3 个工作日内将电子发票发送至用户注册邮箱，发票内容符合国家税务规定）.​"], ["If the user is not satisfied with the Platform's review service （e.g., the review results have obvious errors）, they can submit a refund application to the Platform within 7 days after receiving the \"Contract Review Report\"; the Platform shall verify the application within 3 working days, and if the refund conditions are met, the full service fee shall be returned to the user's original payment account within 5 working days", "（若用户对平台审核服务不满意​（如审核结果存在明显错误），可在收到《合同审核报告》后 7 日内向平台提交退款申请；平台应在 3 个工作日内对申请进行核实，符合退款条件的，应在 5 个工作日内将服务费用全额退还至用户原支付账户）.​"], ["Check whether the payment term （e.g., Net 30, Net 60） clearly defines the starting date （e.g., the date of goods delivery, the date of invoice issuance） to avoid disputes over the calculation of the payment period", "（核查付款期限​（如 Net 30、Net 60）是否明确界定起算日期​（如货物交付日、发票开具日），避免付款期计算争议）.​"], ["Confirm whether the payment method （e.g., LC at sight, T/T） specifies the responsibilities of both parties （e.g., the buyer's obligation to issue the LC, the seller's obligation to submit documents） and the handling method of payment risks （e.g., exchange rate fluctuation, bank fee bearing）", "（确认付款方式（如即期信用证、电汇）是否明确双方责任（如买方开立信用证义务、卖方提交单据义务）及付款风险处理方式（如汇率波动、银行费用承担））.​"], ["Verify whether the penalty clause for delayed payment clearly stipulates the calculation standard （e.g., 0.05% of the unpaid amount per day） and the maximum limit （e.g., not exceeding 5% of the total contract amount） to prevent the penalty from being excessively high or invalid", "（核实延迟付款违约金条款是否明确计算标准（如未付款金额 0.05%/ 日）及最高限额（如不超过合同总金额 5%），避免违约金过高或无效）.​"], ["Check whether the advance payment clause specifies the payment ratio （e.g., 30% of the total contract amount）, the payment time （e.g., within 5 days after the contract is signed） and the conditions for refunding the advance payment （e.g., refund if the contract is terminated due to force majeure）", "（核查预付款条款是否明确支付比例（如合同总金额 30%）、支付时间（如合同签订后 5 日内）及预付款退还条件（如因不可抗力终止合同需退还））.​"], ["Confirm whether the payment currency and exchange rate adjustment clause is specified; if the payment currency is a foreign currency, check whether there is a 约定 on the exchange rate benchmark （e.g., the central parity rate of the People's Bank of China on the payment date） to avoid exchange rate loss disputes", "（确认是否约定付款币种及汇率调整条款；若付款币种为外币，核查是否约定汇率基准（如付款当日中国人民银行中间价），避免汇率损失争议）.​"], ["Check whether the scope of application of the liquidated damages clause covers both parties （not only the seller's breach of contract, but also the buyer's breach of contract） to ensure the fairness of the clause", "（核查违约金条款适用范围是否涵盖双方（不仅包括卖方违约，也包括买方违约），确保条款公平性）.​"], ["Confirm whether the calculation method of liquidated damages for different types of breaches （e.g., delayed delivery, quality non-conformity, contract cancellation） is clearly specified, and whether it is in line with the principle of proportionality with the actual loss", "（确认针对不同违约类型（如延迟交货、质量不符、解除合同）的违约金计算方式是否明确，且与实际损失具有比例原则相符性）.​"], ["Verify whether the clause on exemption from liability for breach of contract clearly defines the applicable circumstances （e.g., force majeure, third-party fault） and the proof requirements for exemption （e.g., government-issued certificates）, and whether it excludes improper exemption circumstances （e.g., commercial risks）", "（核实违约免责条款是否明确适用情形（如不可抗力、第三方过错）及免责证明要求​（如政府出具证明），且排除不当免责情形（如商业风险））.​"], ["Check whether the clause on the method of bearing losses caused by breach of contract （e.g., compensation for direct losses, compensation for indirect losses） is clearly stipulated, and whether the scope of compensable losses is in line with the provisions of the applicable law", "（核查违约造成损失的承担方式（如赔偿直接损失、赔偿间接损失）条款是否明确，可赔偿损失范围是否符合适用法律规定）.​"], ["Confirm whether the clause on the time limit for claiming rights for breach of contract （e.g., the right to claim liquidated damages shall be exercised within 1 year after the breach is discovered） is clearly specified to avoid the loss of the right to claim due to the expiration of the time limit", "（确认违约权利主张期限（如违约金请求权应在发现违约后 1 年内行使）条款是否明确，避免因期限届满丧失主张权利）.​"], ["Check whether the ownership of intellectual property rights generated during the performance of the contract （e.g., patents for customized products, copyrights for design drawings） is clearly defined, and whether it distinguishes between independent development and joint development", "（核查合同履行过程中产生的知识产权（如定制产品专利、设计图纸著作权）归属是否明确，且区分独立开发与共同开发情形）.​"], ["Confirm whether the scope of use of intellectual property rights （e.g., the buyer's right to use the seller's trademark within the contract scope, the seller's right to use the buyer's technical information for non-commercial purposes） is clearly stipulated to avoid overstepping the scope of use", "（确认知识产权使用范围（如买方在合同范围内使用卖方商标的权利、卖方将买方技术信息用于非商业目的的权利）是否明确，避免超范围使用）.​"], ["Verify whether the warranty clause for intellectual property rights （e.g., the seller warrants that the goods do not infringe third-party intellectual property rights） clearly defines the liability for breach of warranty （e.g., compensation for losses, replacement of goods） and the exception circumstances （e.g., infringement caused by the buyer's modification）", "（核实知识产权保证条款（如卖方保证货物不侵犯第三方知识产权）是否明确保证违约责任（如赔偿损失、更换货物）及例外情形（如因买方修改导致侵权））.​"], ["Check whether the confidentiality clause for intellectual property-related information（e.g., trade secrets, technical data） clearly defines the confidentiality period （e.g., 3 years after the contract termination） and the liability for breach of confidentiality（e.g., payment of liquidated damages of 10% of the contract amount）", "（核查知识产权相关信息（如商业秘密、技术资料）保密条款是否明确保密期限（如合同终止后 3 年）及保密违约责任（如支付合同金额 10% 的违约金））.​"], ["Confirm whether the disposal method of intellectual property rights after the contract termination （e.g., the buyer stops using the seller's intellectual property rights, the joint intellectual property rights are continued to be used by both parties） is clearly stipulated to avoid disputes over subsequent use", "（确认合同终止后知识产权处置方式（如买方停止使用卖方知识产权、共有知识产权由双方继续使用）是否明确，避免后续使用争议）.​"], ["Check whether the dispute resolution method （Arbitration or Litigation） is clearly selected, and whether there is no ambiguous agreement （e.g., \"disputes shall be resolved by arbitration or litigation\"） which may lead to the invalidity of the clause", "（核查争议解决方式（仲裁或诉讼）是否明确选定，且无 “争议由仲裁或诉讼解决” 等可能导致条款无效的模糊约定）.​"], ["Verify whether the litigation clause clearly specifies the jurisdiction court （e.g., the people's court where the defendant's main place of business is located, the people's court where the contract is performed） and whether it complies with the provisions of the jurisdiction of the applicable law （e.g., not violating the exclusive jurisdiction of the court）", "（核实诉讼条款是否明确管辖法院（如被告主要营业地人民法院、合同履行地人民法院），且符合适用法律关于管辖的规定（如不违反法院专属管辖））.​"], ["Check whether the clause on the applicable law for disputes （e.g., the law of the People's Republic of China, the law of the State of New York） is clearly stipulated, and whether the applicable law is consistent with the dispute resolution method and the place of dispute resolution", "（核查争议适用法律（如中华人民共和国法律、纽约州法律）条款是否明确，且适用法律与争议解决方式、争议解决地相匹配）.​"], ["Confirm whether the clause on the time limit for initiating dispute resolution （e.g., initiating arbitration within 2 years after the dispute arises, initiating litigation within the statutory limitation period） is clearly stipulated to avoid the loss of the right to resolve disputes due to the expiration of the time limit", "（确认启动争议解决的期限（如争议发生后 2 年内申请仲裁、法定诉讼时效内提起诉讼）条款是否明确，避免因期限届满丧失争议解决权利）.​"], ["Check whether the force majeure clause clearly defines the specific scope of force majeure events （e.g., earthquakes, floods, wars, port strikes） and excludes non-force majeure events （e.g., changes in market conditions, insufficient funds）", "（核查不可抗力条款是否明确不可抗力事件具体范围（如地震、洪水、战争、港口罢工），且排除非不可抗力事件（如市场行情变化、资金不足））.​"], ["Confirm whether the clause on the validity period of the contract （e.g., valid for 3 years from the date of signing, valid until the completion of all obligations） is clearly stipulated, and whether the handling method after the expiration of the validity period （e.g., automatic renewal, termination of rights and obligations） is specified", "（确认合同有效期条款（如自签署之日起 3 年有效、至全部义务履行完毕有效）是否明确，且约定有效期届满后的处理方式（如自动续期、权利义务终止））.​"], ["Verify whether the notice clause clearly defines the notification methods （e.g., written notice, registered mail, official email）, the contact information of both parties （e.g., address, phone number, email） and the legal effect of the notice （e.g., the notice takes effect on the date of receipt）", "（核实通知条款是否明确通知方式（如书面通知、挂号信、官方邮箱）、双方联系方式（如地址、电话、邮箱）及通知的法律效力（如收到之日起生效））.​"], ["Check whether the contract modification and supplement clause clearly stipulates that the modification and supplement must be in writing and signed by both parties, and whether it excludes the validity of oral modification （e.g., \"oral modification is invalid unless confirmed in writing\"）", "（核查合同修改与补充条款是否明确修改补充需采用书面形式且经双方签字确认，且排除口头修改的效力（如 “除非书面确认，口头修改无效”））.​"], ["Confirm whether the clause on the assignment of contract rights and obligations clearly stipulates whether the rights and obligations can be assigned （e.g., \"no assignment without the other party's written consent\"） and the conditions and procedures for assignment （e.g., submitting an assignment application and obtaining written consent）", "（确认合同权利义务转让条款是否明确权利义务能否转让（如 “未经对方书面同意不得转让”），且约定转让条件与程序（如提交转让申请并获得书面同意））.​"], ["Verify whether the clause on the settlement of outstanding matters （e.g., \"matters not covered in this contract shall be resolved through friendly negotiation between the two parties; if no agreement is reached, it shall be handled in accordance with the relevant national laws and regulations\"） is clearly stipulated to avoid disputes over unmentioned matters", "（核实未尽事宜处理条款（如 “本合同未尽事宜，由双方友好协商解决；协商不成的，按国家相关法律法规处理”）是否明确约定，避免因未提及事项产生争议）.​"], ["Check whether the clause on the termination of the contract clearly defines the circumstances for termination （e.g., mutual agreement of both parties, serious breach of contract by one party, expiration of the validity period） and the procedures for termination （e.g., submitting a written termination notice 30 days in advance）", "（核查合同终止条款是否明确终止情形（如双方协商一致、一方严重违约、有效期届满）及终止程序（如提前 30 日提交书面终止通知））.​"], ["Confirm whether the clause on the settlement of debts and claims after contract termination （e.g., \"the defaulting party shall pay the outstanding payment to the non-defaulting party within 15 days after termination\"） is clearly stipulated to avoid disputes over post-termination financial matters", "（确认合同终止后债权债务结算条款（如 “终止后 15 日内，违约方应向
