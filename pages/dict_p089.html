ld you please hold for a moment?", "您能稍等一下吗？"], ["Let me transfer you to the right department. Please hold.", "我帮您转接到相关部门，请稍等。"], ["I’ll put you on hold while I check that for you.", "我帮您查一下，请稍等。"], ["One moment, please. I’ll connect you now.", "请稍等，我现在为您接通。"], ["I’m sorry, [Person's Name] is not available at the moment. Would you like to leave a message?", "很抱歉，[某人名字] 目前无法接听。您要留言吗？"], ["I’ll get back to you as soon as possible.", "我会尽快回复您。"], ["Could you please ask [Person's Name] to call me back at [Your Phone Number]?", "您能请 [某人名字] 回拨 [您的电话号码] 吗？"], ["Please tell [Person's Name] that I called regarding [Topic].", "请告诉 [某人名字] 我打电话是关于 [话题] 的。"], ["I’d like to leave a message for [Person's Name].", "我想给 [某人名字] 留个口信。"], ["Could you let [Person's Name] know I’ll call back later?", "您能告诉 [某人名字] 我稍后会再打电话吗？"], ["Please have [Person's Name] return my call when convenient.", "请让 [某人名字] 方便时回电。"], ["I'm calling to follow up on the status of our recent order.", "我打电话是为了跟进我们最近订单的状态。"], ["Could you provide an update on the progress of our order placed on [Date]?", "您能提供一下我们在 [日期] 下的订单的进展情况吗？"], ["I wanted to check in and see if there are any updates on the delivery schedule.", "我想查下是否有有关交货时间的更新。"], ["We are interested in receiving confirmation on the estimated delivery date for our order.", "我们希望确认一下我们订单的预计交货日期。"], ["May I inquire about the current status of our order in your system?", "我可以了解一下订单在你们系统中的当前状态吗？"], ["I'm reaching out to ensure that all necessary documentation for the order has been processed.", "我联系你们是为了确保订单的所有必要文件已经处理好。"], ["Is there any additional information required from our end to facilitate the order fulfillment?", "我们这边是否还需要提供其他信息以促进订单的执行？"], ["Can you confirm that the payment for the order has been received and processed?", "你能确认一下订单的付款已经收到并处理了吗？"], ["I'd appreciate an update on any potential delays or issues with our order.", "我想了解一下我们订单是否有任何潜在的延迟或问题。"], ["Can we expedite this process?", "我们可以加快这个流程吗？"], ["I need your help with a time-sensitive issue.", "我需要您帮助处理一个时间紧迫的问题。"], ["Could you please prioritize this request?", "您能否优先处理这个请求？"], ["Let's get started.", "我们开始吧。"], ["I'll be brief.", "我会简短地说。"], ["I'd like to add something here.", "我在这里补充一下。"], ["Let me clarify that.", "让我澄清一下。"], ["Can we move on to the next point?", "我们可以进入下一个议题了吗？"], ["That's a great question.", "这是个很好的问题。"], ["I agree with you on that.", "我同意你的看法。"], ["Can I just jump in here?", "我能插句话吗？"], ["Let me finish my point.", "让我把我的观点说完。"], ["We're running out of time.", "我们时间不多了。"], ["Who's speaking?", "谁在说话？"], ["I think we should wrap up.", "我觉得我们应该结束了。"], ["Thank you for your input.", "谢谢你的意见。"], ["I will send out the meeting notes later.", "我稍后会发出会议记录。"], ["Let's stay on topic.", "让我们保持在这个话题上。"], ["I'll follow up with you after the meeting.", "会议后我会跟进你。"], ["I believe that's all for today.", "我认为今天就这些了。"], ["Let's schedule a follow-up meeting.", "我们安排一个后续会议吧。"], ["Can I ask a quick question?", "我能问个简单的问题吗？"], ["We need to address that issue.", "我们需要解决这个问题。"], ["That sounds good to me.", "听起来不错。"], ["I'll check with the team and get back to you.", "我会跟团队确认一下，然后回复你。"], ["Let's reconvene next week.", "我们下周再开会。"], ["I think we need to dive deeper into this.", "我觉得我们需要深入探讨这个问题。"], ["Can we agree on that?", "我们能就此达成一致吗？"], ["What's your take on this?", "你对此有什么看法？"], ["I think we're on the same page.", "我觉得我们意见一致。"], ["Can we have a quick recap?", "我们能快速回顾一下吗？"], ["Please feel free to jump in.", "如果有任何意见，请随时插话。"], ["Let me know if you need any clarification.", "如果需要澄清，告诉我。"], ["We'll follow up after the meeting.", "我们将在会议后跟进。"], ["Is everyone clear on this?", "大家都明白了吗？"], ["Can we go over the agenda?", "我们能过一下议程吗？"], ["Let's take a quick break.", "我们休息一下。"], ["I'll get back to you on that.", "我会就此回复你。"], ["Does anyone have any objections?", "有人有异议吗？"], ["Can you share the document with the team?", "你能把文件分享给团队吗？"], ["I will make sure to follow up.", "我会确保跟进。"], ["Can you elaborate on that?", "你能详细说明一下吗？"], ["Let's go ahead with the plan.", "我们按照计划进行吧。"], ["I think we need to revisit that later.", "我们稍后再重新讨论这个问题。"], ["Are we all in agreement?", "大家都同意吗？"], ["I will update the team on this.", "我会把这个更新给团队。"], ["Can you provide more details on that?", "你能提供更多细节吗？"], ["What's the status on this?", "这个进展如何？"], ["Please send me the link.", "请发给我链接。"], ["I will send out the calendar invite.", "我会发出日历邀请。"], ["I think we're on track.", "我觉得我们在正轨上。"], ["Can we move forward with this?", "我们可以继续进行吗？"], ["Let's wrap this up.", "我们结束吧。"], ["What's the deadline for this?", "这个的截止日期是什么时候？"], ["Could you please confirm the receipt of this information?", "您能否确认已收到这些信息？"], ["Please confirm that you received my message.", "请确认您已收到我的消息。"], ["I’d appreciate it if you could confirm the meeting time.", "如果您能确认会议时间，我将不胜感激。"], ["Can you confirm that the documents have been sent?", "您能确认文件已经发送了吗？"], ["Please confirm your availability for the call.", "请确认您是否有空参加电话会议。"], ["Could you please confirm the details we discussed earlier?", "你能确认一下我们之前讨论的细节吗？"], ["I’d like to verify some information to ensure accuracy.", "我想核实一些信息以确保准确性。"], ["Just to double-check, are we still on track with the plan we outlined?", "再次确认一下，我们还在按照我们制定的计划进行吗？"], ["Can you confirm the date and time for the upcoming meeting?", "你能确认一下即将举行的会议的日期和时间吗？"], ["I want to make sure I have the correct details before moving forward.", "在继续之前，我想确认一下我是否有正确的细节。"], ["Let's go over the specifics one more time to avoid any misunderstandings.", "我们再次详细讨论下，以避免任何误解。"], ["Could you verify the accuracy of the figures provided in the report?", "你能核实一下报告中提供的数据是否准确吗？"], ["I just want to confirm the delivery address for the upcoming shipment.", "我只是想确认一下即将发货的地址。"], ["To ensure clarity, could you repeat the key points we agreed upon?", "为了确保清晰，你能重复一下我们同意的关键点吗？"], ["Let's confirm the details of the contract before finalizing the agreement.", "在最终敲定协议之前，我们确认下合同细节。"], ["Can we go over the action items?", "让我们回顾一下行动事项。"], ["Could we go over the report?", "我们能看看报告吗？"], ["Can we review the agenda?", "我们能审阅一下议程吗？"], ["What's the action item for this?", "这个的行动事项是什么？"], ["Can you give us an update?", "你能给我们更新一下吗？"], ["Can you summarize that?", "你能总结一下吗？"], ["Let's stick to the agenda.", "我们按照议程进行。"], ["I think that's a good idea.", "我觉得这是个好主意。"], ["That's a good point.", "这个观点很好。"], ["I think we should prioritize this.", "我觉得我们应该优先处理这个。"], ["What's the best way to move forward?", "向前推进的最佳方式是什么？"], ["Could you please send me the details?", "你能发给我详细信息吗？"], ["Could you send me an email with the details?", "你能发邮件给我详细信息吗？"], ["I will share the document with you later.", "我稍后会把文件分享给你。"], ["I will send a follow-up email.", "我会发一封跟进邮件。"], ["I’ll check with the team and get back to you.", "我会跟团队确认一下，然后回复你。"], ["Let me confirm with the team.", "让我和团队确认一下。"], ["Let me check on that.", "我查一下。"], ["I'll follow up with an email.", "我会通过邮件跟进。"], ["I’ll get back to you on that.", "我会就此回复你。"], ["I’ll get back to you on that after the meeting.", "会议后我会回复你。"], ["Who can take this task?", "谁能承担这个任务？"], ["I'll take care of it.", "我来处理。"], ["I'll take care of that.", "我会处理这个问题。"], ["Can everyone hear me?", "大家都能听到我吗？"], ["Could you repeat that, please?", "请你重复一下好吗？"], ["I'm afraid I didn't catch that.", "恐怕我没听清楚。"], ["Can you speak up a bit?", "你能说大声一点吗？"], ["I'm having trouble hearing you.", "我听不清楚你说的。"], ["I'm sorry, I missed that.", "对不起，我错过了那个。"], ["I'm having trouble with the connection.", "我的连接有问题。"], ["Could you please repeat that?", "请再说一遍好吗？"], ["I’m sorry, could you repeat that, please?", "抱歉，您能再说一遍吗？"], ["I’m sorry, I didn’t catch that. Can you say it again?", "抱歉，我没听清。您能再说一遍吗？"], ["Could you please clarify that?", "你能澄清一下吗？"], ["Could you please clarify your point?", "你能澄清一下你的观点吗？"], ["Could you please clarify what you mean by [Specific Term]?", "您能解释一下 [具体术语] 的意思吗？"], ["I'm not sure I understand your point.", "我不太明白你的意思。"], ["Let's take it offline.", "我们私下讨论。"], ["Let's take that offline.", "这个问题我们私下讨论。"], ["Could you please mute your microphone?", "请把你的麦克风静音好吗？"], ["Please mute yourself when not speaking.", "不发言时请将麦克风静音。"], ["Could you please mute your mic when not speaking?", "不发言时请静音麦克风。"], ["Let's circle back to that point later.", "我们稍后再回到这个话题。"], ["Let's circle back to this later.", "我们稍后再回到这个话题。"], ["Let's table this for now.", "我们先搁置这个问题。"], ["Let's check the time.", "我们看一下时间。"], ["Can we clarify the next steps?", "我们能明确一下接下来的步骤吗？"], ["I'm not clear on the next steps.", "我不太明白接下来的步骤。"], ["Let's go over the action items.", "让我们回顾一下行动事项。"], ["Can we discuss this in more detail?", "我们可以更详细地讨论一下吗？"], ["I’ll follow up with you after the meeting.", "会议后我会跟进你。"], ["I’ll follow up with an email.", "我会通过邮件跟进。"], ["Confirm the time zone of the called party and select a suitable call time to avoid disturbing the other party during rest hours. For example, if the called party is in New York (Eastern Time, 12 hours behind Beijing Time), avoid calling between 22:00 and 08:00 Beijing Time.", "确认对方所在时区，选择合适的通话时间，避免在对方休息时段打扰。例如，若对方在纽约（东部时间，比北京时间晚 12 小时），则避免在北京时间 22:00-08:00 之间致电。"], ["Prepare a detailed call outline in advance, listing the core topics to be discussed (such as project progress, order details, and problem solutions) and key data (such as order numbers, dates, and quantities) to ensure the call is efficient and avoids missing important information.", "提前准备详细的通话大纲，列出需讨论的核心议题（如项目进度、订单细节、问题解决方案）及关键数据（如订单号、日期、数量），确保通话高效且不遗漏重要信息。"], ["Check the stability of the communication equipment (such as the phone signal, network connection for video calls, and microphone volume) and prepare alternative communication methods (such as a backup phone or email contact) in case the call is interrupted due to poor signal.", "检查通讯设备的稳定性（如手机信号、视频通话网络连接、麦克风音量），并准备备用通讯方（如备用手机、邮件联系方式），防止因信号不佳导致通话中断。"], ["Familiarize yourself with the basic etiquette and common expressions of the called party's region to avoid misunderstandings caused by cultural differences. For example, when calling a business partner in Japan, use more formal and polite language and avoid rushing to cut off the other party's speech.", "熟悉对方所在地区的基本礼仪及常用表达，避免因文化差异产生误解。例如，致电日本的商业伙伴时，使用更正式、礼貌的语言，避免贸然打断对方讲话。"], ["Confirm the correct contact information of the called party, including the phone number (pay attention to adding the correct country code, such as +1 for the United States and +44 for the United Kingdom) and the name of the contact person, to prevent dialing the wrong number.", "确认对方的正确联系方式，包括电话号码（注意添加正确的国家代码，如美国 + 1、英国 + 44）及联系人姓名，避免拨错号码。"], ["Prepare relevant documents (such as contracts, reports, and order confirmations) in advance and keep them handy. If the other party needs to confirm details during the call, you can quickly refer to the documents and provide accurate information.", "提前准备相关文件（如合同、报告、订单确认函）并放在手边，若通话中对方需确认细节，可快速查阅文件并提供准确信息。"], ["Inform the relevant colleagues in advance if the call involves teamwork (such as project coordination or task assignment), so that they can be on standby to provide support if necessary (such as answering professional questions).", "若通话涉及团队协作（如项目协调、任务分配），提前告知相关同事，让其随时待命，必要时提供支持（如解答专业问题）。"], ["Calculate the cost of the international call in advance and ensure that the phone or communication account has sufficient balance to avoid the call being terminated unexpectedly due to insufficient balance.", "提前核算国际长途的通话费用，确保手机或通讯账户余额充足，避免因余额不足导致通话意外中断。"], ["Make a note of the key points to be confirmed during the call (such as delivery dates, payment terms, and service deadlines) and prepare a pen and paper or a digital note-taking tool to record the other party's responses in a timely manner.", "将通话中需确认的重点事项（如交货日期、付款条款、服务期限）列出，准备好笔和纸或电子记笔记工具，及时记录对方的答复。"], ["Anticipate potential problems that may occur during the call (such as poor signal, unclear communication, or differences of opinion) and prepare corresponding solutions. For example, if the signal is poor, propose to switch to a more stable communication channel or reschedule the call.", "预判通话中可能出现的问题（如信号差、沟通不清、意见分歧），并准备相应的解决办法。例如，若信号不佳，提议切换到更稳定的通讯渠道或重新安排通话时间。"], ["Confirm the purpose of the call again before dialing to ensure that you do not deviate from the core goal during the call. For example, if the purpose is to confirm the order delivery date, focus on this topic and avoid excessive discussion of irrelevant content.", "拨打电话前再次确认通话目的，确保通话中不偏离核心目标。例如，若目的是确认订单交货日期，则围绕该主题展开，避免过多讨论无关内容。"], ["Check the time difference again on the day of the call to avoid errors due to daylight saving time changes in the called party's region. For example, some regions in Europe implement daylight saving time, which may cause the time difference to change by 1 hour.", "通话当天再次核对时差，避免因对方所在地区实行夏令时导致时差变动而出现误差。例如，欧洲部分地区实行夏令时，可能会使时差变化 1 小时。"], ["Ensure that the calling environment is quiet and free from interference (such as avoiding busy offices or noisy public places) to prevent the other party from not hearing clearly due to background noise.", "确保通话环境安静无干扰（如避免在繁忙的办公室或嘈杂的公共场所），防止因背景噪音导致对方听不清内容。"], ["Prepare the contact information of the other party's backup person in case the main contact person is unavailable, and you can contact the backup person to continue the discussion.", "准备对方备用联系人的联系方式，若主要联系人无法接听，可联系备用联系人继续沟通。"], ["Review the previous communication records (such as emails, chat logs) with the other party before the call to recall the context of the cooperation and avoid repeating questions that have already been confirmed.", "通话前回顾与对方之前的沟通记录（如邮件、聊天记录），回忆合作背景，避免重复已确认过的问题。"], ["Confirm whether you need to record the call (and obtain the other party's consent in advance if necessary) to facilitate later review of the call content and avoid disputes over the confirmed details.", "确认是否需要对通话进行录音（必要时提前获得对方同意），以便后续回顾通话内容，避免对已确认的细节产生争议。"], ["Prepare a summary of the call to be sent to the other party after the call, listing the key points discussed and the confirmed matters, to ensure both parties have a consistent understanding.", "准备通话后的总结邮件，列出讨论的重点及确认的事项，待通话结束后发送给对方，确保双方理解一致。"], ["Check whether the phone has international calling functions enabled. If not, contact the operator in advance to activate the function to avoid being unable to make the call.", "检查手机是否已开通国际通话功能，若未开通，提前联系运营商激活，避免无法拨打电话。"], ["Adjust your state before the call, 保持 a calm and polite attitude, and avoid being in a hurry or emotional, which may affect the communication effect.", "通话前调整自身状态，保持冷静、礼貌的态度，避免处于匆忙或情绪激动的状态，影响沟通效果。"], ["Confirm the technical requirements of the call if it involves video conferencing (such as the required software version, network speed, and camera settings) and test the equipment in advance to ensure the video call proceeds smoothly.", "若通话涉及视频会议，确认视频通话的技术要求（如所需软件版本、网络速度、摄像头设置），并提前测试设备，确保视频通话顺利进行。"], ["Prepare answers to possible questions from the other party (such as inquiries about product specifications, after-sales services, and price adjustments) to respond quickly and professionally during the call.", "准备对方可能提出的问题的答案（如关于产品规格、售后服务、价格调整的询问），以便通话中快速、专业地回应。"], ["Inform the family or colleagues around you that you will be making an important international call, and ask them not to disturb you during the call to ensure concentration.", "告知身边的家人或同事即将进行重要的国际通话，请他们在通话期间不要打扰，确保注意力集中。"], ["Check the weather conditions of the called party's region in advance. If there is a natural disaster (such as a typhoon or snowstorm), consider rescheduling the call to avoid the other party being unable to focus on the communication due to handling emergency matters.", "提前查看对方所在地区的天气情况，若有自然灾害（如台风、暴风雪），考虑重新安排通话时间，避免对方因处理紧急事务而无法专注沟通。"], ["Prepare the unit conversion standards if the call involves data such as weight, length, or currency (such as converting kilograms to pounds, meters to feet, or RMB to US dollars) to avoid misunderstandings caused by different units.", "若通话涉及重量、长度、货币等数据（如将公斤换算为磅、米换算为英尺、人民币换算为美元），准备好单位换算标准，避免因单位不同产生误解。"], ["Confirm the holiday arrangements of the called party's region in advance to avoid calling during the other party's national holidays or company holidays.", "提前确认对方所在地区的节假日安排，避免在对方的国家法定假日或公司假期期间致电。"], ["Prepare a backup power supply for the phone (such as a power bank) if the call is expected to be long, to prevent the phone from shutting down due to low battery during the call.", "若预计通话时间较长，为手机准备备用电源（如充电宝），防止通话中手机因电量不足关机。"], ["Familiarize yourself with the abbreviations and professional terms commonly used by the other party's industry in advance to avoid not understanding the other party's expressions during the call.", "提前熟悉对方行业常用的缩写词和专业术语，避免通话中听不懂对方的表述。"], ["Confirm the delivery address and logistics information with the other party in advance if the call involves international shipping, and prepare the relevant logistics company contact information to provide support if necessary.", "若通话涉及国际物流运输，提前与对方确认交货地址及物流信息，并准备相关物流公司的联系方式，必要时提供支持。"], ["Prepare a plan B for the call content. For example, if the main issue cannot be reached an agreement during the call, propose to discuss other related matters first or set a time for the next communication.", "为通话内容准备备选方案，例如，若通话中无法就主要问题达成一致，提议先讨论其他相关事项或约定下次沟通时间。"], ["Check whether the documents to be referred to during the call are in the correct format (such as PDF, Word) and can be opened normally, to avoid being unable to view the documents when needed.", "检查通话中需查阅的文件是否为正确格式（如 PDF、Word）且能正常打开，避免需要时无法查看文件。"], ["Prepare a list of follow-up tasks to be completed after the call (such as sending documents, updating project plans, and contacting other departments) to ensure timely execution after the call.", "准备通话后需完成的后续任务清单（如发送文件、更新项目计划、联系其他部门），确保通话后及时执行。"], ["Confirm the language used in the call with the other party in advance (such as English, Chinese, or a third language) and prepare an interpreter if necessary to avoid language barriers affecting communication.", "提前与对方确认通话使用的语言（如英语、中文或第三语言），必要时准备翻译人员，避免语言障碍影响沟通。"], ["Check the phone's call recording function (if used) to ensure it can work normally, and test the recording quality in advance to avoid unclear recording content.", "若使用手机的通话录音功能，检查该功能是否能正常工作，并提前测试录音质量，避免录音内容不清晰。"], ["Prepare a thank-you message to be sent to the other party after the call, expressing gratitude for their time and cooperation, to maintain a good cooperative relationship.", "准备通话后的感谢信息，发送给对方，感谢其抽出时间沟通及合作，维护良好的合作关系。"], ["Confirm the time for the next communication (if needed) during the call preparation stage, and mark it in the calendar to avoid forgetting.", "若需要，在通话准备阶段就确认下次沟通的时间，并在日历中标记，避免遗忘。"], ["Prepare the contact information of the operator's customer service in case of call problems (such as no dial tone, unclear sound), and contact the customer service for assistance in a timely manner.", "准备运营商客服的联系方式，若出现通话问题（如无拨号音、声音不清），可及时联系客服寻求帮助。"], ["Check whether the called party's phone number has any special dialing rules (such as needing to add an extension number or area code) and confirm the correct dialing sequence to avoid dialing errors.", "检查对方电话号码是否有特殊拨号规则（如需加分机号、区号），确认正确的拨号顺序，避免拨号错误。"], ["Prepare a brief self-introduction (including name, company, and position) to introduce yourself clearly at the beginning of the call, especially if it is the first time communicating with the other party.", "准备简短的自我介绍（包括姓名、公司、职位），在通话开头清晰介绍自己，尤其是首次与对方沟通时。"], ["Adjust the phone's volume to an appropriate level before the call to ensure you can hear the other party clearly without the sound being too loud to disturb others.", "通话前将手机音量调至合适大小，确保能清晰听到对方讲话，同时避免声音过大打扰他人。"], ["Confirm whether the other party needs to involve other departments or personnel in the call, and coordinate in advance to ensure the relevant personnel are available.", "确认对方是否需要其他部门或人员参与通话，提前协调，确保相关人员可参与。"], ["Prepare a list of the other party's concerns (based on previous communication) and address them proactively during the call to improve communication efficiency.", "根据之前的沟通，准备对方可能关心的问题清单，通话中主动提及并解答，提高沟通效率。"], ["Check the network security if the call involves sensitive information (such as trade secrets, financial data) and avoid using public Wi-Fi to prevent information leakage.", "若通话涉及敏感信息（如商业机密、财务数据），检查网络安全性，避免使用公共 Wi-Fi，防止信息泄露。"], ["Prepare a summary of the previous cooperation achievements to mention during the call, which helps to enhance the cooperative atmosphere and promote the smooth progress of the current discussion.", "准备之前的合作成果总结，通话中适当提及，有助于增进合作氛围，推动当前讨论顺利进行。"], ["Confirm the format and delivery method of the materials to be sent to the other party after the call (such as email attachment, cloud disk link) and ensure the materials can be accessed normally by the other party.", "确认通话后需发送给对方的材料格式及交付方式（如邮件附件、云盘链接），确保对方能正常获取材料。"], ["Prepare a plan to deal with call interruptions (such as recording the progress of the call in a timely manner, so that you can continue from where you left off when the call is reconnected).", "准备应对通话中断的方案（如及时记录通话进度，通话重新连接时可从断点继续）。"], ["Check whether the called party has any special preferences (such as preferring to discuss specific topics first) and adjust the call order accordingly to make the other party more comfortable.", "了解对方是否有特殊偏好（如倾向先讨论特定话题），据此调整通话顺序，让对方更舒适。"], ["Prepare a list of questions to ask the other party, sorted by priority, to ensure that important questions are not omitted even if the call time is limited.", "准备向对方提出的问题清单，并按优先级排序，即使通话时间有限，也能确保不遗漏重要问题。"], ["Confirm the after-sales service commitment to the other party (if involved) before the call, and ensure that the commitment is consistent with the company's policies to avoid making inappropriate promises.", "若涉及对方向对方的售后服务承诺，通话前确认该承诺与公司政策一致，避免做出不当承诺。"], ["Prepare a positive opening remark to start the call in a friendly atmosphere, such as \"Good morning! I hope this call finds you well. Thank you for taking the time to talk with me today.\"", "早上好！希望您一切顺利。感谢您今天抽出时间与我通话。"], ["Check the phone's roaming function if making the call abroad, and ensure that the roaming service is activated to avoid being unable to make or receive calls.", "若在国外拨打电话，检查手机的漫游功能，确保漫游服务已开通，避免无法接打电话。"], ["Prepare a summary of the problems that need to be solved during the call and clarify the expected results, so that both parties can focus on solving the problems.", "准备通话中需解决的问题总结，并明确期望结果，让双方能集中精力解决问题。"], ["Confirm the payment method and currency type with the other party if the call involves international payment, and prepare the relevant bank information to avoid errors in the payment process.", "若通话涉及国际付款，与对方确认付款方式及货币类型，并准备相关银行信息，避免付款过程中出现差错。"], ["Prepare a list of the other party's previous feedback and respond to it during the call, showing that you attach importance to the other party's opinions.", "准备对方之前的反馈清单，通话中对反馈进行回应，表明重视对方的意见。"], ["Check whether the call needs to be attended by multiple people on your side, and arrange a meeting room or online meeting link in advance to ensure everyone can participate smoothly.", "确认己方是否需多人参与通话，提前安排会议室或线上会议链接，确保所有人能顺利参与。"], ["Prepare a plan to extend the call time if necessary (such as asking the other party if they have more time to discuss additional matters) to ensure that all important content is covered.", "若有必要，准备延长通话时间的方案（如询问对方是否有更多时间讨论额外事项），确保覆盖所有重要内容。"], ["Confirm the product's international certification and compliance information (if the call involves product sales) and prepare the relevant certificates to provide proof when the other party asks.", "若通话涉及产品销售，确认产品的国际认证及合规信息，并准备相关证书，在对方询问时提供证明。"], ["Prepare a list of the other party's competitors (if appropriate) to avoid mentioning inappropriate content during the call and affecting the cooperative relationship.", "若合适，了解对方的竞争对手清单，避免通话中提及不当内容，影响合作关系。"], ["Check the phone's battery level before the call and charge it in advance if the battery is low to ensure the call is not interrupted due to power failure.", "通话前检查手机电量，若电量低，提前充电，确保通话不因断电中断。"], ["Prepare a closing remark for the call, summarizing the key points and expressing expectations for future cooperation, such as \"Thank you for your valuable input today. We will follow up on the confirmed matters as soon as possible and look forward to further cooperation.\"", "感谢您今天宝贵的意见。我们将尽快跟进已确认的事项，期待未来进一步合作。"], ["Confirm the time for sending the call minutes to the other party (if needed) and inform the other party in advance to let them know when to expect the document.", "若需要，确认向对方发送通话纪要的时间，并提前告知对方，让其知晓何时可收到文件。"], ["Prepare a list of the other party's contact preferences (such as preferring email follow-ups over phone calls) and adjust the follow-up method accordingly.", "了解对方的联系方式偏好（如相比电话，更倾向邮件跟进），据此调整后续跟进方式。"], ["Check whether the call involves any legal issues (such as contract terms, liability clauses) and consult the legal department in advance if necessary to ensure the communication content is legal and compliant.", "确认通话是否涉及法律问题（如合同条款、责任条款），必要时提前咨询法务部门，确保沟通内容合法合规。"], ["Prepare a list of the company's latest products or services (if the call involves business promotion) and introduce them appropriately during the call to expand cooperation opportunities.", "若通话涉及业务推广，准备公司最新的产品或服务清单，通话中适当介绍，拓展合作机会。"], ["Confirm the other party's working hours (excluding lunch breaks and breaks) and avoid calling during the other party's break time to show respect.", "确认对方的工作时间（排除午休、休息时段），避免在对方休息时致电，以示尊重。"], ["Prepare a plan to handle the other party's objections (such as price objections, delivery time objections) and prepare persuasive reasons to convince the other party.", "准备应对对方异议的方案（如价格异议、交货时间异议），并准备有说服力的理由，争取说服对方。"], ["Check the phone's sound quality in advance by making a test call to a colleague to ensure the other party can hear clearly.", "提前拨打同事电话进行测试，检查手机音质，确保对方能清晰听到。"], ["Prepare a list of the cooperation achievements to be achieved in the short term (if the call involves cooperation planning) and discuss them with the other party to reach a consensus.", "若通话涉及合作规划，准备短期需达成的合作成果清单，与对方讨论并达成共识。"], ["Confirm the other party's technical requirements for the product (if the call involves technical communication) and prepare the relevant technical parameters to provide accurate answers.", "若通话涉及技术沟通，确认对方对产品的技术要求，并准备相关技术参数，提供准确解答。"], ["Prepare a thank-you gift or preferential policy (if appropriate) to mention during the call, which helps to enhance the cooperative relationship and promote the success of the communication.", "若合适，准备感谢礼品或优惠政策，通话中提及，有助于增进合作关系，推动沟通成功。"], ["Check whether the call needs to be translated into a written document after the call and prepare a translator or translation tool in advance if necessary.", "确认通话后是否需要将通话内容翻译成书面文件，必要时提前准备翻译人员或翻译工具。"], ["Prepare a list of the other party's previous cooperation problems and propose solutions during the call to show the company's sense of responsibility.", "准备对方之前合作中出现的问题清单，通话中提出解决方案，体现公司的责任心。"], ["Confirm the other party's logistics preferences (such as designated logistics companies) if the call involves product delivery and try to meet the requirements to improve customer satisfaction.", "若通话涉及产品交付，确认对方的物流偏好（如指定物流公司），尽量满足要求，提高客户满意度。"], ["Prepare a list of the company's after-sales service channels (such as hotlines, online customer service) and inform the other party during the call to facilitate future contact.", "准备公司的售后服务渠道清单（如热线电话、在线客服），通话中告知对方，方便后续联系。"], ["Check whether the call involves any cultural taboos of the other party's region and avoid mentioning sensitive topics to prevent offending the other party.", "确认通话是否涉及对方所在地区的文化禁忌，避免提及敏感话题，防止冒犯对方。"], ["Prepare a plan to follow up the call within a certain time (such as following up within 24 hours) and mark it in the work plan to ensure timely follow-up.", "准备在一定时间内（如 24 小时内）跟进通话的方案，并在工作计划中标记，确保及时跟进。"], ["Confirm the other party's inventory status (if the call involves order placement) and prepare alternative suppliers in case the other party has insufficient inventory.", "若通话涉及下订单，确认对方的库存状况，并准备备选供应商，以防对方库存不足。"], ["Prepare a list of the product's after-sales guarantees (such as warranty period, repair policies) and explain them clearly during the call to eliminate the other party's concerns.", "准备产品的售后保障清单（如保修期、维修政策），通话中清晰讲解，消除对方顾虑。"], ["Check whether the phone has any software updates that may affect the call (such as system updates) and avoid updating during the call to prevent interruptions.", "检查手机是否有可能影响通话的软件更新（如系统更新），避免在通话期间进行更新，防止中断。"], ["Prepare a list of the other party's key decision-makers (if the call involves important cooperation) and ensure that the decision-makers can participate in the call if necessary.", "若通话涉及重要合作，准备对方的关键决策者清单，必要时确保决策者能参与通话。"], ["Confirm the currency exchange rate (if the call involves price discussion) and prepare a calculator to calculate the price in the other party's currency accurately.", "若通话涉及价格讨论，确认汇率，并准备计算器，准确计算对方货币的价格。"], ["Prepare a list of the company's awards and certifications (if the call involves establishing trust) and mention them during the call to enhance the company's credibility.", "若通话涉及建立信任，准备公司的荣誉证书清单，通话中提及，提升公司可信度。"], ["Check whether the call involves any environmental or social responsibility requirements of the other party (such as green production, labor standards) and prepare the company's relevant policies to show compliance.", "确认通话是否涉及对方的环保或社会责任要求（如绿色生产、劳工标准），准备公司相关政策，体现合规性。"], ["Prepare a plan to simplify the communication content if the other party has a language barrier, such as using more examples and pictures (to be sent after the call) to assist understanding.", "若对方存在语言障碍，准备简化沟通内容的方案，如多举例子、搭配图片（通话后发送）辅助理解。"], ["Confirm the other party's feedback channel for the call content and inform them that they can provide suggestions at any time to show attention to their opinions.", "确认对方对通话内容的反馈渠道，告知其可随时提出建议，体现对其意见的重视。"], ["Prepare a list of the product's usage precautions (if the call involves product guidance) and explain them clearly during the call to avoid improper use by the other party.", "若通话涉及产品指导，准备产品使用注意事项清单，通话中清晰讲解，避免对方不当使用。"], ["Check whether the phone's international roaming charges are reasonable and compare with other communication methods (such as VoIP) to choose the most cost-effective way.", "检查手机国际漫游费用是否合理，与其他通讯方式（如网络电话）对比，选择性价比最高的方式。"], ["Prepare a list of the cooperation risks and preventive measures (if the call involves risk discussion) and discuss them with the other party to reach a risk-sharing agreement.", "若通话涉及风险讨论，准备合作风险及防范措施清单，与对方讨论并达成风险共担协议。"], ["Confirm the other party's training needs (if the call involves product after-sales) and prepare the training plan to provide support after the cooperation.", "若通话涉及产品售后，确认对方的培训需求，准备培训计划，为合作后的支持做准备。"], ["Prepare a list of the company's customer cases (similar to the other party's industry) and share them during the call to show the company's experience and capabilities.", "准备公司的客户案例（与对方行业类似），通话中分享，体现公司的经验和能力。"], ["Check whether the call involves any import and export procedures (if the call involves international trade) and prepare the relevant process introduction to assist the other party in handling.", "若通话涉及国际贸易，确认是否涉及进出口流程，准备相关流程介绍，协助对方办理。"], ["Prepare a plan to adjust the communication strategy if the initial communication effect is not good, such as changing the topic order or using a more vivid expression.", "若初期沟通效果不佳，准备调整沟通策略的方案，如改变话题顺序、使用更生动的表达方式。"], ["Confirm the other party's preferred communication frequency (such as weekly follow-ups, monthly reports) and agree on it during the call to maintain long-term communication.", "确认对方偏好的沟通频率（如每周跟进、每月汇报），通话中达成一致，维持长期沟通。"], ["Prepare a list of the product's upgrade plans (if the call involves long-term cooperation) and share them during the call to show the company's development potential.", "若通话涉及长期合作，准备产品升级计划清单，通话中分享，体现公司的发展潜力。"], ["Check whether the phone has a call waiting function enabled to avoid missing other important calls during the international call.", "检查手机是否开通呼叫等待功能，避免国际通话期间错过其他重要来电。"], ["Prepare a list of the other party's unmet needs (based on previous communication) and propose solutions during the call to improve the other party's satisfaction.", "根据之前的沟通，准备对方未满足的需求清单，通话中提出解决方案，提高对方满意度。"], ["Confirm the other party's insurance requirements for the product (if the call involves product transportation) and prepare the relevant insurance options to provide protection.", "若通话涉及产品运输，确认对方对产品的保险要求，准备相关保险方案，提供保障。"], ["Prepare a list of the company's emergency contact information and inform the other party during the call, so that they can contact the company in time in case of emergencies.", "准备公司的紧急联系方式清单，通话中告知对方，以便紧急情况下对方能及时联系公司。"], ["Check whether the call involves any tax issues (such as import taxes, value-added taxes) and prepare the relevant tax information to avoid disputes over tax costs.", "确认通话是否涉及税务问题（如进口税、增值税），准备相关税务信息，避免因税费产生争议。"], ["Prepare a positive and confident attitude before the call, believe in the company's products and services, and convey this confidence to the other party through the call to enhance their trust.", "通话前准备积极自信的心态，相信公司的产品和服务，并通过通话将这份自信传递给对方，增强其信任。"], ["When the other party says \"We need to adjust the delivery date to next month\", you can paraphrase: \"So what you mean is that the delivery date will be changed to next month, right?\"", "当对方说 “We need to adjust the delivery date to next month”（我们需要将交货日期调整到下个月）时，你可以 paraphrase 为：“So what you mean is that the delivery date will be changed to next month, right?”（所以您的意思是交货日期将变更到下个月，对吗？"], ["If the other party mentions \"The payment term should be 30 days after receipt of goods\", you can rephrase it as: \"Let me make sure I understand correctly – the payment is due 30 days after we receive the goods, is that correct?\"", "若对方提到 “The payment term should be 30 days after receipt of goods”（付款期限应为收货后 30 天），你可以 paraphrase 为：“Let me make sure I understand correctly – the payment is due 30 days after we receive the goods, is that correct?”（让我确认一下我理解得是否正确 —— 我们收到货物后 30 天内需付款，对吗？"], ["If the other party says \"The meeting will be held via Zoom at 2 PM GMT\", you can rephrase it as: \"If I get it right, the meeting will take place on Zoom at 2 o'clock in the afternoon GMT, correct?\"", "若对方说 “The meeting will be held via Zoom at 2 PM GMT”（会议将于格林尼治标准时间下午 2 点通过 Zoom 举行），你可以 paraphrase 为：“If I get it right, the meeting will take place on Zoom at 2 o'clock in the afternoon GMT, correct?”（如果我理解正确的话，会议将于格林尼治标准时间下午 2 点在 Zoom 上举行，对吗？"], ["When the other party mentions \"The quality of the sample meets our basic requirements\", you can paraphrase: \"So you're saying that the sample's quality satisfies your basic standards, is that the case?\"", "当对方提到 “The quality of the sample meets our basic requirements”（样品质量符合我们的基本要求）时，你可以 paraphrase 为：“So you're saying that the sample's quality satisfies your basic standards, is that the case?”（所以您是说样品质量满足贵方的基本标准，对吗？"], ["If the other party states \"We need you to send the report by the end of this week\", you can rephrase it as: \"Let me confirm – you require us to submit the report before this week ends, right?\"", "若对方表示 “We need you to send the report by the end of this week”（我们需要你在本周末前发送报告），你可以 paraphrase 为：“Let me confirm – you require us to submit the report before this week ends, right?”（让我确认一下 —— 贵方要求我们在本周末前提交报告，对吗？"], ["When the other party says \"The price of this raw material has increased by 10%\", you can paraphrase: \"So the cost of this raw material has gone up by 10%, am I understanding this correctly?\"", "当对方说 “The price of this raw material has increased by 10%”（这种原材料的价格上涨了 10%）时，你可以 paraphrase 为：“So the cost of this raw material has gone up by 10%, am I understanding this correctly?”（所以这种原材料的成本上涨了 10%，我理解得对吗？"], ["If the other party mentions \"We will assign a new technician to handle this issue\", you can rephrase it as: \"So your side will arrange a new technical staff member to deal with this problem, correct?\"", "若对方提到 “We will assign a new technician to handle this issue”（我们将指派一名新的技术人员处理这个问题），你可以 paraphrase 为：“So your side will arrange a new technical staff member to deal with this problem, correct?”（所以贵方将安排一名新的技术人员处理这个问题，对吗？"], ["When the other party states \"The contract needs to be revised in terms of liability clauses\", you can paraphrase: \"Let me make sure – the part about liability clauses in the contract has to be modified, is that what you mean?\"", "当对方表示 “The contract needs to be revised in terms of liability clauses”（合同的责任条款部分需要修改）时，你可以 paraphrase 为：“Let me make sure – the part about liability clauses in the contract has to be modified, is that what you mean?”（让我确认一下 —— 合同中关于责任条款的部分必须修改，这是您的意思吗？"], ["If the other party says \"We expect the project to be completed within three months\", you can rephrase it as: \"So your expectation is that the project will be finished in three months' time, am I right?\"", "若对方说 “We expect the project to be completed within three months”（我们期望项目在三个月内完成），你可以 paraphrase 为：“So your expectation is that the project will be finished in three months' time, am I right?”（所以贵方的期望是项目在三个月内完成，对吗？"], ["When the other party mentions \"The warranty period for this equipment is two years\", you can paraphrase: \"So this equipment is covered by a warranty for two years, is that correct?\"", "当对方提到 “The warranty period for this equipment is two years”（该设备的保修期为两年）时，你可以 paraphrase 为：“So this equipment is covered by a warranty for two years, is that correct?”（所以该设备享有两年的保修服务，对吗？"], ["If the other party states \"We need additional documents to process the refund\", you can rephrase it as: \"Let me get this straight – in order to handle the refund, we have to provide more documents, right?\"", "若对方表示 “We need additional documents to process the refund”（我们需要额外的文件来处理退款），你可以 paraphrase 为：“Let me get this straight – in order to handle the refund, we have to provide more documents, right?”（让我搞清楚 —— 为了处理退款，我们必须提供更多文件，对吗？"], ["When the other party says \"The shipment will be delayed due to bad weather\", you can paraphrase: \"So the delivery of the goods will be put off because of the poor weather conditions, am I understanding this right?\"", "当对方说 “The shipment will be delayed due to bad weather”（由于恶劣天气，货运将延迟）时，你可以 paraphrase 为：“So the delivery of the goods will be put off because of the poor weather conditions, am I understanding this right?”（所以由于恶劣天气状况，货物交付将推迟，我理解得对吗？"], ["If the other party mentions \"We can offer a 5% discount for large orders\", you can rephrase it as: \"So for orders with a large quantity, your company is willing to give a 5% discount, correct?\"", "若对方提到 “We can offer a 5% discount for large orders”（对于大宗订单，我们可以提供 5% 的折扣），你可以 paraphrase 为：“So for orders with a large quantity, your company is willing to give a 5% discount, correct?”（所以对于数量大的订单，贵公司愿意提供 5% 的折扣，对吗？）When the other party states \"The training session will be rescheduled to next Tuesday\", you can paraphrase: \"Let me confirm – the training class will be rearranged to next Tuesday, is that what you're saying?\"（当对方表示 “The training session will be rescheduled to next Tuesday”（培训课程将重新安排到下周二）时，你可以 paraphrase 为：“Let me confirm – the training class will be rearranged to next Tuesday, is that what you're saying?”（让我确认一下 —— 培训课程将重新安排到下周二，这是您所说的吗？"], ["If the other party says \"We have received your payment for the last order\", you can rephrase it as: \"So you have gotten the payment we made for the previous order, am I right?\"", "若对方说 “We have received your payment for the last order”（我们已收到你上次订单的付款），你可以 paraphrase 为：“So you have gotten the payment we made for the previous order, am I right?”（所以贵方已收到我们为上次订单支付的款项，对吗？"], ["When the other party mentions \"The software needs to be updated to the latest version\", you can paraphrase: \"So the software has to be upgraded to the most recent version, correct?\"", "当对方提到 “The software needs to be updated to the latest version”（该软件需要更新到最新版本）时，你可以 paraphrase 为：“So the software has to be upgraded to the most recent version, correct?”（所以该软件必须升级到最新版本，对吗？"], ["If the other party states \"We will send a representative to attend the meeting\", you can rephrase it as: \"Let me make sure I get this – your company will send a representative to be present at the meeting, is that correct?\"", "若对方表示 “We will send a representative to attend the meeting”（我们将派一名代表参加会议），你可以 paraphrase 为：“Let me make sure I get this – your company will send a representative to be present at the meeting, is that correct?”（让我确认一下我理解得是否正确 —— 贵公司将派一名代表出席会议，对吗？"], ["When the other party says \"The problem is caused by a faulty component\", you can paraphrase: \"So the issue is a result of a defective part, am I understanding this correctly?\"", "当对方说 “The problem is caused by a faulty component”（这个问题是由一个有故障的部件引起的）时，你可以 paraphrase 为：“So the issue is a result of a defective part, am I understanding this correctly?”（所以这个问题是由一个有缺陷的部件导致的，我理解得对吗？"], ["If the other party mentions \"We need to discuss the details of the new cooperation plan\", you can rephrase it as: \"Let me confirm – you want to talk through the specifics of the new cooperation plan, right?\"", "若对方提到 “We need to discuss the details of the new cooperation plan”（我们需要讨论新合作计划的细节），你可以 paraphrase 为：“Let me confirm – you want to talk through the specifics of the new cooperation plan, right?”（让我确认一下 —— 您想详细讨论新合作计划的具体内容，对吗？"], ["When the other party states \"The delivery address has been changed to No. 123 Main Street\", you can paraphrase: \"So the address for delivering the goods has been updated to No. 123 Main Street, is that what you mean?\"", "当对方表示 “The delivery address has been changed to No. 123 Main Street”（交货地址已变更为缅因街 123 号）时，你可以 paraphrase 为：“So the address for delivering the goods has been updated to No. 123 Main Street, is that what you mean?”（所以货物的交货地址已更新为缅因街 123 号，这是您的意思吗？"], ["If the other party says \"We will provide technical support 24 hours a day\", you can rephrase it as: \"So your side will offer technical assistance around the clock, am I right?\"", "若对方说 “We will provide technical support 24 hours a day”（我们将提供 24 小时技术支持），你可以 paraphrase 为：“So your side will offer technical assistance around the clock, am I right?”（所以贵方将提供全天候的技术协助，对吗？"], ["When the other party mentions \"The order quantity needs to be increased by 200 units\", you can paraphrase: \"So we need to add 200 more units to the original order quantity, correct?\"", "当对方提到 “The order quantity needs to be increased by 200 units”（订单数量需要增加 200 件）时，你可以 paraphrase 为：“So we need to add 200 more units to the original order quantity, correct?”（所以我们需要在原订单数量基础上再增加 200 件，对吗？"], ["If the other party states \"The meeting minutes will be sent to you within 24 hours\", you can rephrase it as: \"Let me get this straight – you will send the meeting notes to us in less than 24 hours, right?\"", "若对方表示 “The meeting minutes will be sent to you within 24 hours”（会议纪要将在 24 小时内发送给您），你可以 paraphrase 为：“Let me get this straight – you will send the meeting notes to us in less than 24 hours, right?”（让我搞清楚 —— 您会在 24 小时内把会议记录发送给我们，对吗？"], ["When the other party says \"The product specification has been adjusted according to your request\", you can paraphrase: \"So the product details have been modified as you asked, am I understanding this right?\"", "当对方说 “The product specification has been adjusted according to your request”（产品规格已按您的要求调整）时，你可以 paraphrase 为：“So the product details have been modified as you asked, am I understanding this right?”（所以产品细节已按您的要求修改，我理解得对吗？"], ["If the other party mentions \"We can’t meet the deadline due to staff shortage\", you can rephrase it as: \"So you’re unable to finish on time because there aren’t enough staff members, correct?\"", "若对方提到 “We can’t meet the deadline due to staff shortage”（由于人员短缺，我们无法按时完成），你可以 paraphrase 为：“So you’re unable to finish on time because there aren’t enough staff members, correct?”（所以由于工作人员不足，您无法按时完成，对吗？"], ["When the other party states \"The refund will be processed within 5 working days\", you can paraphrase: \"Let me confirm – the refund procedure will be carried out in 5 business days, is that what you’re saying?\"", "当对方表示 “The refund will be processed within 5 working days”（退款将在 5 个工作日内处理）时，你可以 paraphrase 为：“Let me confirm – the refund procedure will be carried out in 5 business days, is that what you’re saying?（让我确认一下 —— 退款流程将在 5 个工作日内进行，这是您所说的吗？"], ["If the other party says \"We need to verify your company’s business license\", you can rephrase it as: \"So you have to check the validity of our company’s business license, am I right?\"", "若对方说 “We need to verify your company’s business license”（我们需要核实贵公司的营业执照），你可以 paraphrase 为：“So you have to check the validity of our company’s business license, am I right?”（所以您需要核实我们公司营业执照的有效性，对吗？"], ["When the other party mentions \"The price includes shipping and handling fees\", you can paraphrase: \"So the shipping costs and handling charges are already part of the price, correct?\"", "当对方提到 “The price includes shipping and handling fees”（该价格包含运费和手续费）时，你可以 paraphrase 为：“So the shipping costs and handling charges are already part of the price, correct?”（所以运费和手续费已包含在价格里，对吗？"], ["If the other party states \"We will arrange a site visit next Friday\", you can rephrase it as: \"Let me make sure I get this – you will organize a visit to our site on next Friday, is that correct?\"", "若对方表示 “We will arrange a site visit next Friday”（我们将在下周五安排一次现场考察），你可以 paraphrase 为：“Let me make sure I get this – you will organize a visit to our site on next Friday, is that correct?”（让我确认一下我理解得是否正确 —— 您将在下周五组织一次到我们现场的考察，对吗？"], ["When the other party says \"The error in the report is due to incorrect data input\", you can paraphrase: \"So the mistake in the report comes from wrong data entry, am I understanding this correctly?\"", "当对方说 “The error in the report is due to incorrect data input”（报告中的错误是由错误的数据录入导致的）时，你可以 paraphrase 为：“So the mistake in the report comes from wrong data entry, am I understanding this correctly?”（所以报告中的错误源于错误的数据录入，我理解得对吗？"], ["If the other party mentions \"We can extend the service period by 3 months\", you can rephrase it as: \"So you’re willing to add 3 more months to the service duration, right?\"", "若对方提到 “We can extend the service period by 3 months”（我们可以将服务期限延长 3 个月），你可以 paraphrase 为：“So you’re willing to add 3 more months to the service duration, right?  \"So you will send a replacement component to us in the next week, correct?\"", "若对方提到 “We will provide a replacement part next week”（我们将于下周提供替换零件），你可以 paraphrase 为：“So you will send a replacement component to us in the next week, correct?”（所以您将于下周给我们发送替换零件，对吗？"], ["When the other party states \"The meeting minutes have been approved\", you can paraphrase: \"Let me confirm – the meeting notes have been agreed to, is that what you mean?\"", "当对方表示 “The meeting minutes have been approved”（会议纪要已获批）时，你可以 paraphrase 为：“Let me confirm – the meeting notes have been agreed to, is that what you mean?”（让我确认一下 —— 会议记录已被批准，这是您的意思吗？"], ["If the other party says \"We need to adjust the number of participants\", you can rephrase it as: \"So we have to change how many people will participate, am I right?\"", "若对方说 “We need to adjust the number of participants”（我们需要调整参与人数），你可以 paraphrase 为：“So we have to change how many people will participate, am I right?”（所以我们必须更改参与的人数，对吗？"], ["When the other party mentions \"The payment has been delayed due to a bank error\", you can paraphrase: \"So the payment is late because of a mistake made by the bank, correct?\"", "当对方提到 “The payment has been delayed due to a bank error”（由于银行失误，付款已延迟）时，你可以 paraphrase 为：“So the payment is late because of a mistake made by the bank, correct?”（所以由于银行的失误，付款延迟了，对吗？"], ["If the other party states \"We will send you the updated report by the end of the day\", you can rephrase it as: \"Let me get this straight – you will send the revised report to us before the day ends, right?\"", "若对方表示 “We will send you the updated report by the end of the day”（我们将在今天结束前发送更新后的报告给您），你可以 paraphrase 为：“Let me get this straight – you will send the revised report to us before the day ends, right?”（让我搞清楚 —— 您会在今天结束前把更新后的报告发送给我们，对吗？"], ["When the other party says \"The project scope has been expanded\", you can paraphrase: \"So the range of work for the project has been increased, am I understanding this right?\"（当对方说 “The project scope has been expanded”（项目范围已扩大）时，你可以 paraphrase 为：“So the range of work for the project has been increased, am I understanding this right?”", "所以项目的工作范围已扩大，我理解得对吗？"], ["If the other party mentions \"We can’t meet with you on Friday\", you can rephrase it as: \"So you’re unable to have a meeting with us on Friday, correct?\"", "若对方提到 “We can’t meet with you on Friday”（我们周五无法与您会面），你可以 paraphrase 为：“So you’re unable to have a meeting with us on Friday, correct?”（所以您周五无法与我们会面，对吗？"], ["When the other party states \"The contract will be signed next week\", you can paraphrase: \"Let me confirm – the contract will be signed in the next week, is that what you’re saying?\"", "当对方表示 “The contract will be signed next week”（合同将于下周签署）时，你可以 paraphrase 为：“Let me confirm – the contract will be signed in the next week, is that what you’re saying?”（让我确认一下 —— 合同将于下周签署，这是您所说的吗？"], ["If the other party says \"We will update the project plan based on the latest feedback\", you can rephrase it as: \"So you will revise the project plan according to the most recent feedback, am I right?\"", "若对方说 “We will update the project plan based on the latest feedback”（我们将根据最新反馈更新项目计划），你可以 paraphrase 为：“So you will revise the project plan according to the most recent feedback, am I right?”（所以您会根据最新的反馈修改项目计划，对吗？"]];window.__KEY__="1017外企电话沟通";window.__TITLE__="10.17 外企电话沟通";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
