h time management? Do you think a new app could solve that?", "你们中有多少人在时间管理上犯难过？你觉得一个新应用能解决这问题不？"], ["Suppose you have to give a speech to 500 people tomorrow and you haven't prepared yet. How would you get ready?", "假设你明天要给 500 人演讲，还没准备，你会咋准备？"], ["Have you ever thought about why some ads are more memorable than others? If I told you it's all about storytelling, would that surprise you?", "你有没有想过为啥有些广告更让人记住？如果我说这全靠讲故事，你会惊讶不？"], ["How many of you have tried working from home? Do you think it's more productive than working in the office?", "你们中有多少人试过居家办公？你觉得这比在办公室工作效率更高不？"], ["Suppose your company decides to switch to a new software system, and most employees hate it. How would you encourage them to adapt?", "假设公司决定换个新软件系统，大多数员工都不喜欢，你会咋鼓励他们适应？"], ["Have you ever wondered why people buy brand-name products even when cheaper ones are similar? Well, if I explained it's about trust, would that make sense?", "你有没有想过为啥人们买名牌产品，哪怕便宜的替代品差不多？如果我说这和信任有关，说得通不？"], ["Did you know that the average person spends over 4 hours a day on their phone?", "你们知道不，普通人每天花在手机上的时间超过 4 小时？"], ["According to a new study, people who read books for 30 minutes a day are 20% less likely to feel stressed.", "根据一项新研究，每天读 30 分钟书的人，压力大的可能性会降低 20%。"], ["Statistics show that 70% of small businesses fail within the first 5 years.", "数据显示，70% 的小企业在头 5 年就倒闭了。"], ["I read somewhere the other day that a single tree can produce enough oxygen for 4 people a day.", "我前几天在哪儿看到说，一棵树一天能产生够 4 个人用的氧气。"], ["Did you know that honey never goes bad? Archaeologists have found 3000-year-old honey that's still edible.", "你们知道不，蜂蜜永远不会坏？考古学家发现过 3000 年前的蜂蜜，还能吃呢。"], ["According to recent research, laughing for 10 minutes can burn as many calories as walking for 15 minutes.", "根据最近的研究，笑 10 分钟消耗的卡路里和走 15 分钟差不多。"], ["Statistics show that people who eat breakfast every day are more likely to maintain a healthy weight.", "数据显示，每天吃早餐的人更可能保持健康体重。"], ["I read the other day that the number of people working remotely has doubled in the pas edback is positive, sales are up, but delivery times need improvement.", "我再快速过一遍重点：客户反馈不错，销售额上升，但交货时间需要改进。"], ["To conclude, I'd like to say that teamwork is the key to our success.", "最后，我想说团队合作是我们成功的关键。"], ["In a nutshell, it is generally believed that education is the foundation of progress.", "简而言之，人们普遍认为教育是进步的基础。"], ["That concludes my presentation. However, I'd like to quickly summarize the main points: we've achieved our targets, but we need to work on communication.", "演讲结束了，但我快速总结下重点：我们完成了目标，但沟通方面还需努力。"], ["To refresh your memory, the main takeaways are the following. Number one: safety first. Number two: follow the guidelines.", "帮大家回忆下，主要要点如下。第一：安全第一。第二：遵守指南。"], ["In brief, we've covered the project timeline, the team responsible, and the expected outcomes.", "简言之，我们讲了项目时间线、负责团队和预期成果。"], ["To sum up, the key is to start early, stay consistent, and learn from mistakes.", "总结一下，关键是早开始、保持一致、从错误中学习。"], ["This brings me to the end of my presentation. To refresh your memory, the main takeaways are the following. First, we are a company that consults startups for a fraction of the cost of other consultation services. And second, we have a perfect record of successfully growing startups in a wide variety of industries. If anything was unclear, I'd be happy to open the floor to questions.", "我的演讲到这里结束。帮大家回忆下，主要要点如下。第一，我们是为初创公司提供咨询的公司，费用只有其他咨询服务的一小部分。第二，我们在各种行业成功培育初创公司的记录非常好。如果有不清楚的地方，我很乐意接受提问。"], ["To sum up, today we talked about how to save energy at home: turn off lights, use energy-efficient appliances, and insulate your house. These small steps can make a big difference. Feel free to ask questions now.", "总结一下，今天我们讲了如何在家节约能源：关灯、使用节能电器、给房子做隔热。这些小步骤能带来大改变。现在可以提问了。"], ["To wrap this up, I'd love to ask you to try our new app and share your feedback.", "最后，我想请大家试试我们的新应用，分享你们的反馈。"], ["If you would like more information, please visit our website or contact our office.", "如果想了解更多信息，请访问我们的网站或联系我们的办公室。"], ["So, next time you go shopping, remember to bring your own bags to reduce waste.", "所以下次购物时，记得自带袋子减少浪费。"], ["So that's the plan. Now let's go and put it into practice!", "计划就是这样，现在咱去落实吧！"], ["So now it's your turn to share your ideas—what do you think we should do next?", "现在轮到你们分享想法了，你们觉得我们接下来该做啥？"], ["Now let's make a real effort to achieve this goal—we can do it together!", "现在让我们努力实现这个目标，我们能一起做到！"], ["To close, I'd like to ask you to donate to this charity—every little bit helps.", "最后，我想请大家给这个慈善机构捐款，积少成多。"], ["And finally, before you leave the conference today, please take two minutes to fill out the feedback form.", "最后，今天散会前，请大家花两分钟填下反馈表。"], ["If you are looking for experience, enthusiasm and a unique creative approach to your project, we are the agency for you.", "如果您想为项目找有经验、有热情、有独特创意的团队，选我们准没错。"], ["In brief, significant progress has been made! Even though we are still in the idea phase, Ann will be selecting a subject this week. Once we give the green light, the content and design teams will be on their way to getting things started. Now, let's keep the ball rolling.", "简言之，已经取得重大进展！虽然还在构思阶段，但安这周会选个主题。一旦我们通过，内容和设计团队就会开始行动。现在，咱继续加油！"], ["If you want to learn more about this field, join our club—we meet every Thursday.", "如果想更了解这个领域，加入我们的俱乐部吧，每周四聚会。"], ["Start today—plant a tree, save water, and spread the word. Our planet needs us.", "从今天开始，种棵树、节约水、宣传出去。地球需要我们。"], ["I'd like to finish with this inspiring quote from Nelson Mandela: \"It always seems impossible until it's done.\"", "我想用纳尔逊・曼德拉的一句励志名言结束：“事情在做成之前，总看起来不可能。”"], ["This reminds me of a wonderful quote from Maya Angelou: \"Do the best you can until you know better. Then when you know better, do better.\"", "这让我想起玛雅・安吉洛的一句精彩名言：“在你知道更好的方法前，尽你所能。当你知道了，就做得更好。”"], ["Let me leave you with this surprising statistic: 80% of success is showing up.", "给大家留个惊人的数据：成功的 80% 在于到场。"], ["Let's finish this session with an interesting quote from Einstein: \"Imagination is more important than knowledge.\"", "我们用爱因斯坦的一句有趣名言结束这次会议：“想象力比知识更重要。”"], ["Did you know that Aristotle once said, \"We are what we repeatedly do. Excellence, then, is not an act, but a habit.\"?", "你们知道亚里士多德说过 “我们重复做的事，决定了我们是怎样的人。所以卓越不是一次行动，而是一种习惯” 吗？"], ["It reminds me of the words of Steve Jobs: \"Stay hungry, stay foolish.\"", "这让我想起史蒂夫・乔布斯的话：“求知若渴，虚心若愚。”"], ["In the end, this is what matters— as Mother Teresa said, \"Not all of us can do great things. But we can do small things with great love.\"", "最后，重要的是 —— 正如特蕾莎修女所说：“不是每个人都能做伟大的事，但我们能用大爱做小事。”"], ["We will be looking at the effects of urbanization on wildlife.", "我们将探讨城市化对野生动物的影响。"], ["Today I will be discussing how to manage stress at work.", "今天我要讲的是如何在职场管理压力。"], ["We will be identifying the main causes of air pollution in cities.", "我们将找出城市空气污染的主要原因。"], ["Today I'll be investigating the benefits of reading for children.", "今天我要研究阅读对儿童的好处。"], ["There are three key points I'll be discussing: the problem, the solution, and the results.", "我要讲三个要点：问题、解决方案和结果。"], ["I want to begin by talking about our history, and then I'll move on to our future plans.", "我先讲我们的历史，然后再讲未来的计划。"], ["We'll be covering this topic from two points of view: the customer's and the company's.", "我们将从两个角度讲这个话题：客户的和公司的。"], ["This presentation is divided into four parts: introduction, analysis, recommendations, and conclusion.", "这次报告分四部分：引言、分析、建议和结论。"], ["Now that you're aware of the overview, let's begin with the first challenge we face.", "大家了解了概况，咱从我们面临的第一个挑战开始讲。"], ["First, let's begin with the basics of this technology.", "首先，咱从这项技术的基础开始讲。"], ["I will first cover the rules of the program, then we'll practice.", "我先讲这个项目的规则，然后咱再练习。"], ["The first point covers how we started the project.", "第一点讲我们是如何启动这个项目的。"], ["To get started, let's look at the data from last year.", "一开始，咱看看去年的数据。"], ["In the same way, regular exercise helps with physical health, mental exercise helps with brain health.", "同样，规律锻炼有助于身体健康，脑力锻炼有助于大脑健康。"], ["Likewise, good communication is important in both personal and professional relationships.", "同样，良好的沟通在个人和职业关系中都很重要。" var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
