g the content in the email body; provide a brief description.", "在中国，不要在未在邮件正文中说明内容的情况下用工作邮件发送附件，提供简要说明。"], ["Avoid using direct phrases like \"I disagree\" in workplace discussions; it’s considered impolite.", "在日本，职场讨论中避免使用 “我不同意” 这类直接表达，这被认为是不礼貌的。"], ["Don’t interrupt others while they are speaking in workplace meetings; it’s a sign of rudeness.", "在日本，职场会议上不要打断别人说话，这是不礼貌的表现。"], ["Don’t use overly casual greetings like \"Hey\" when addressing managers in the workplace; use formal titles.", "在日本，职场中称呼经理时不要使用 “嘿” 这类过于随意的问候语，要使用正式头衔。"], ["Don’t use abbreviations for company departments or project names in formal work documents; write full names for clarity.", "在日本，正式工作文件中不要使用公司部门或项目名称的缩写，为清晰起见请写全称。"], ["Don’t leave a meeting early without informing the organizer first; it’s impolite.", "在日本，不先告知组织者就提前离开会议是不礼貌的。"], ["Don’t forget to bow slightly when greeting senior colleagues in the workplace; it’s a basic respect gesture.", "在日本，职场中问候资深同事时不要忘记微微鞠躬，这是基本的尊重手势。"], ["Don’t leave your work desk messy at the end of the workday; keep it tidy.", "在日本，工作日结束时不要让办公桌乱糟糟的，保持整洁。"], ["Don’t use mobile phones during work meetings unless it’s for work-related purposes; keep them silent.", "在日本，工作会议期间除非用于工作相关目的，否则不要使用手机，保持手机静音。"], ["Don’t use work phones to make personal calls during work hours; use your own phone if necessary.", "在日本，工作时间不要用工作电话打私人电话，必要时用自己的手机。"], ["Don’t use work desks to display personal items like plush toys excessively; keep the workspace professional.", "在日本，不要在办公桌上过度摆放毛绒玩具等个人物品，保持工作区域的专业性。"], ["Don’t use work meetings to let senior colleagues dominate the conversation; encourage junior colleagues to speak up.", "在日本，不要在工作会议中让资深同事主导对话，鼓励初级同事发言。"], ["Don’t use work documents with typos or grammatical errors; proofread carefully before sharing.", "在日本，不要使用有错别字或语法错误的工作文件，分享前仔细校对。"], ["Don’t use colorful highlighters excessively in work documents; use them sparingly to emphasize key points.", "在日本，工作文件中不要过度使用彩色荧光笔，少量使用以突出重点即可。"], ["Don’t leave work unfinished with ionalism.", "与阿根廷同事交谈时，讨论复杂工作话题时不要使用过于简单的语言，体现专业性。"], ["Don’t use jargon related to specific industries that they are not familiar with in cross-departmental meetings; explain terms clearly.", "与阿根廷同事交谈时，跨部门会议中不要使用他们不熟悉的特定行业术语，要清晰解释术语。"], ["Don’t use overly negative language when describing work challenges; focus on solutions.", "与阿根廷同事交谈时，描述工作挑战时不要使用过于消极的语言，聚焦解决方案。"], ["Don’t use work meetings to promote personal projects unrelated to the team’s goals; stay focused.", "与阿根廷同事交谈时，不要利用工作会议推广与团队目标无关的个人项目，保持专注。"], ["Don’t use overly technical software tools without training them first; ensure they can operate them.", "与阿根廷同事交谈时，不要在未培训的情况下让他们使用过于专业的软件工具，确保他们会操作。"], ["Don’t use work emails to send large files without compressing them first; avoid clogging inboxes.", "与阿根廷同事交谈时，不要在未压缩的情况下用工作邮件发送大文件，避免堵塞收件箱。"], ["Don’t use work presentation materials with low-quality images; use high-resolution visuals.", "与阿根廷同事交谈时，不要使用图片质量差的工作演示材料，使用高分辨率视觉素材。"], ["Don’t use work meetings to discuss sports rivalries in a heated manner; keep it friendly.", "与阿根廷同事交谈时，不要在工作会议中激烈讨论体育竞争，保持友好氛围。"], ["For Colombian workplace communication, don’t use negative body language like crossed arms during negotiations; it shows resistance.", "在哥伦比亚职场沟通中，谈判时不要有交叉手臂等负面肢体语言，这表示抵触。"], ["Don’t use sarcasm when giving work feedback; it may be misunderstood.", "在哥伦比亚职场沟通中，给出工作反馈时不要使用讽刺语气，可能会被误解。"], ["Don’t arrive late for business lunches; it’s a sign of unreliability.", "在哥伦比亚职场沟通中，商务午餐不要迟到，这是不可靠的表现。"], ["Don’t forget to thank colleagues for their help in work tasks; it strengthens relationships.", "在哥伦比亚职场沟通中，不要忘记感谢同事在工作任务中的帮助，这能加强关系。"], ["Don’t forget to follow up on work tasks that have been assigned; ensure progress is on track.", "在哥伦比亚职场沟通中，不要忘记跟进已分配的工作任务，确保进展顺利。"], ["Don’t forget to send a follow-up email after work meetings; summarize key points and action items.", "在哥伦比亚职场沟通中，工作会议后不要忘记发送跟进邮件，总结重点内容和行动事项。"], ["Don’t forget to thank clients for their cooperation in work emails; it maintains good relationships.", "在哥伦比亚职场沟通中，工作邮件中不要忘记感谢客户的合作，这有助于维持良好关系。"], ["Don’t use negative comments about the company’s products or services in front of external clients; maintain a positive image.", "在哥伦比亚职场沟通中，不要在外部客户面前对公司的产品或服务发表负面评论，维护良好形象。"], ["Don’t forget to update colleagues on changes to work schedules in a timely manner; avoid causing confusion.", "在哥伦比亚职场沟通中，不要忘记及时向同事更新工作安排的变动，避免造成混乱。"], ["Don’t forget to inform colleagues about changes to work locations in advance; avoid last-minute surprises.", "在哥伦比亚职场沟通中，不要忘记提前告知同事工作地点的变动，避免临时突发情况。"], ["Don’t forget to back up important work files regularly; prevent data loss.", "在哥伦比亚职场沟通中，不要忘记定期备份重要工作文件，防止数据丢失。"], ["In South Africa, avoid ignoring the cultural diversity of different ethnic groups in workplace interactions; be respectful of all.", "在南非，职场交流中不要忽视不同族群的文化多样性，要尊重所有人。"], ["Avoid using language that may be considered racist in the workplace; promote equality.", "在南非，职场中避免使用可能被视为种族主义的语言，倡导平等。"], ["Don’t make assumptions about a colleague’s job role based on their ethnicity; clarify responsibilities directly.", "在南非，不要根据同事的种族推测其工作职责，直接明确职责即可。"], ["Don’t use language that may be seen as promoting one ethnic group over others in the workplace; advocate equality.", "在南非，职场中不要使用可能被视为偏袒某个族群的语言，倡导平等。"], ["Don’t use work materials that contain images or content that may be considered culturally insensitive; review carefully.", "在南非，不要使用含有可能被视为文化不敏感的图片或内容的工作材料，仔细审查。"], ["Don’t use work resources for personal purposes; it’s against workplace rules.", "在南非，不要将工作资源用于个人用途，这违反职场规定。"], ["Don’t use work spaces to hold personal meetings with friends or family; keep the area for work purposes.", "在南非，不要在工作区域与朋友或家人举行私人会面，保持该区域用于工作。"], ["Don’t use work resources to print personal documents; it’s a waste of company assets.", "在南非，不要使用工作资源打印个人文件，这是浪费公司资产。"], ["Don’t use work resources to host personal online events; keep resources for work use.", "在南非，不要使用工作资源举办个人线上活动，保持资源用于工作。"], ["Avoid using formal language that creates a sense of distance k ideas; listen carefully.", "与新西兰同事交谈时，他们分享与毛利文化相关的工作想法时不要打断，认真倾听。"], ["Don’t ignore the importance of Maori greetings like \"Kia ora\" in workplace interactions; use them appropriately.", "与新西兰同事交谈时，职场交流中不要忽视 “Kia ora”（你好）等毛利语问候的重要性，恰当使用。"], ["Don’t ignore the importance of consulting Maori representatives when planning work projects related to local communities; respect their opinions.", "与新西兰同事交谈时，规划与当地社区相关的工作项目时不要忽视咨询毛利代表，尊重他们的意见。"], ["Don’t make comments that downplay the importance of environmental protection in work projects; they care deeply about it.", "与新西兰同事交谈时，不要在工作项目中发表轻视环境保护重要性的言论，他们非常关注此事。"], ["Don’t use materials that may harm the environment in work projects; choose eco-friendly options.", "与新西兰同事交谈时，工作项目中不要使用可能危害环境的材料，选择环保选项。"], ["Don’t use materials that are not recyclable in work events; choose eco-friendly alternatives.", "与新西兰同事交谈时，工作活动中不要使用不可回收的材料，选择环保替代品。"], ["Don’t make fun of their accent during work conversations; it’s impolite.", "与新西兰同事交谈时，工作交谈中不要嘲笑他们的口音，这是不礼貌的。"], ["Don’t use work presentations to downplay the role of local communities in projects; emphasize collaboration.", "与新西兰同事交谈时，不要在工作演示中轻视当地社区在项目中的作用，强调合作。"], ["Don’t use work projects to exploit local natural resources without proper permits; follow regulations.", "与新西兰同事交谈时，不要在未获得适当许可的情况下利用工作项目开发当地自然资源，遵守规定。"]];window.__KEY__="114职场英语的文化陷阱沟通禁忌";window.__TITLE__="11.4 职场英语的文化陷阱沟通禁忌";

  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
