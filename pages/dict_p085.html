ent for Invoice No. [XXX]. Our team is relying on this payment to fulfill other commitments, so your update is critical.", "（早上好，[客户姓名]！我想了解一下 [XXX] 号发票的付款状态。我们的团队正依赖这笔付款来履行其他承诺，因此您的反馈至关重要。）​"], ["Dear [Client’s Name], I hope you’re having a productive week. We’re reaching out to follow up on the payment for Invoice No. [XXX] （amount: [XXX]）. If the payment has been sent, please provide the tracking details; if not, could you explain the delay?", "（尊敬的 [客户姓名]，希望您本周工作富有成效。我们联系您是为了跟进 [XXX] 号发票（金额：[XXX]）的付款事宜。若款项已寄出，请提供跟踪详情；若尚未寄出，能否解释延迟原因呢？）​"], ["Hi [Client’s Name]! Just a friendly check-in on the payment for Invoice No. [XXX], which is related to the [Contract Name] we signed earlier. Please let us know if there’s anything we can do to facilitate the payment process.", "（嗨 [客户姓名]！友善了解一下与我们之前签署的 [合同名称] 相关的 [XXX] 号发票的付款情况。若有任何我们可以协助推进付款流程的事情，请告知我们。）​"], ["Good afternoon! I’m contacting you regarding the payment for Invoice No. [XXX], which is now past its due date. To avoid any formal collection procedures, could you please process this payment immediately?", "（下午好！我联系您是关于 [XXX] 号发票的付款事宜，该发票现已逾期。为避免采取任何正式的催收程序，能否请您立即处理这笔付款呢？）​"], ["Dear [Client’s Name], hope this email finds you well. We’re following up on the payment for the [Product/Service] delivered on [Delivery Date], which is invoiced as No. [XXX]. Could you please confirm if the payment will be made this week?", "（尊敬的 [客户姓名]，希望您一切安好。我们正在跟进 [交付日期] 交付的 [产品 / 服务] 的付款事宜，对应发票号为 [XXX]。能否确认付款是否会在本周进行呢？）​"], ["Hi there! I hope this doesn’t disrupt your workflow. I’m following up on the payment for Invoice No. [XXX] （due on [Due Date]）. Your prompt action will help us avoid any negative impact on our business partnership.", "（嗨！希望这不会干扰您的工作流程。我正在跟进 [到期日：[到期日期]] 的 [XXX] 号发票的付款事宜。您的及时行动将帮助我们避免对业务合作产生任何负面影响。）​"], ["Good day, [Client’s Name]! I wanted to remind you about the outstanding payment for Invoice No. [XXX]. As we value our cooperation, we’re willing to be flexible, but we need a clear commitment from you regarding the payment date.", "（您好，[客户姓名]！我想提醒您 [XXX] 号发票仍有未付款项。由于我们珍视合作，愿意灵活处理，但需要您就付款日期给出明确承诺。）​"], ["Dear [Client’s Name], I hope you’re doing well. We noticed that Invoice No. [XXX]", "（尊敬的 [客户姓名]，希望您一切安好。经过之前的跟进，我们注意到 [到期日：[到期日期]] 的 [XXX] 号发票仍未支付。能否请您指派专人紧急处理此事呢？）​"], ["Hi [Client’s Name]! Just a quick note to follow up on the payment for Invoice No. [XXX] （for [Project Name]）. Our finance team will be closing the accounts soon, so your payment before [Date] would be greatly appreciated.", "（嗨 [客户姓名]！简短跟进一下 [项目名称] 对应的 [XXX] 号发票的付款事宜。我们的财务团队即将结账，因此非常感谢您能在 [日期] 前完成付款。）​"], ["Good afternoon, [Client’s Name]! I’m contacting you regarding the outstanding payment for Invoice No. [XXX]. If you’ve already initiated the payment but encountered issues, please share the details so we can assist in resolving them.", "（下午好，[客户姓名]！我联系您是关于 [XXX] 号发票的未付款项。若您已发起付款但遇到问题，请分享具体情况，以便我们协助解决。）​"], ["Dear [Client’s Name], hope this message finds you well. We’re following up on Invoice No. [XXX] （due on [Due Date]） and noticed the payment is still pending. Could you please confirm whether the invoice has been received by your finance department?", "（尊敬的 [客户姓名]，希望您一切安好。我们正在跟进 [到期日：[到期日期]] 的 [XXX] 号发票，发现款项仍未到账。能否确认您的财务部门是否已收到该发票呢？）​"], ["Hi there! Just a friendly reminder that the payment for Invoice No. [XXX] （amount: [XXX]） is now overdue. To keep our collaboration smooth, please provide a clear update on the payment progress by the end of today.", "（嗨！友善提醒，[XXX] 号发票（金额：[XXX]）现已逾期。为确保我们的合作顺利，烦请在今日结束前提供付款进展的明确反馈。）​"], ["Good day! I’m reaching out about the payment for Invoice No. [XXX], which covers the [Service/Product] provided in [Date Range]. If you need to split the payment into installments, please propose a plan, and we’ll work with you to finalize it.", "（您好！我联系您是关于 [XXX] 号发票的付款事宜，该发票对应 [日期范围] 提供的 [服务 / 产品]。若您需要将付款分多次进行，请提出方案，我们会与您一同确定。）​"], ["Dear [Client’s Name], I hope you’re doing well. After multiple follow-ups on Invoice No. [XXX] （due on [Due Date]）, the payment is still unpaid. We kindly request that you process this payment within [X] business days to avoid affecting our future cooperation.", "（尊敬的 [客户姓名]，希望您一切安好。经过对 [到期日：[到期日期]] 的 [XXX] 号发票的多次跟进，款项仍未支付。我们恳请您在 [X] 个工作日内处理这笔付款，以免影响我们未来的合作。）​"], ["We need to schedule a negotiation with the supplier to discuss the new contract terms next week.", "（我们需要与供应商安排一场谈判，下周讨论新的合同条款。）​"], ["Effective communication is the key to a successful negotiation, so we should prepare our talking points in advance.", "（有效的沟通是谈判成功的关键，因此我们应提前准备好谈话要点。）​"], ["The negotiation between our team and the client lasted for three hours, and we finally reached a preliminary agreement.", "（我们团队与客户的谈判持续了三个小时，最终达成了初步共识。）​"], ["Before starting the negotiation, it’s important to understand the other party’s core demands to find a mutually beneficial solution.", "（开始谈判前，了解对方的核心需求很重要，这样才能找到互利的解决方案。）​"], ["The manager assigned me to lead the negotiation with the new partner, focusing on the profit-sharing ratio.", "（经理指派我带领与新合作伙伴的谈判，重点讨论利润分配比例。）​"], ["In order to move the project forward, both sides need to make a reasonable compromise on the delivery time.", "（为了推进项目，双方需要在交付时间上做出合理的妥协。）​"], ["The compromise we proposed balances the interests of both parties and is expected to be accepted by the client.", "（我们提出的折中方案平衡了双方利益，预计会得到客户的认可。）​"], ["After several rounds of discussion, we finally reached a compromise on the budget allocation for the marketing campaign.", "（经过多轮讨论，我们最终在营销活动的预算分配上达成了折中。）​"], ["A wise compromise doesn’t mean giving up core interests but finding a middle ground that satisfies both sides.", "（明智的妥协不是放弃核心利益，而是找到能让双方都满意的中间立场。）​"], ["The client refused to make any compromise on the product quality, so we had to adjust our production standards accordingly.", "（客户在产品质量上拒绝做出任何妥协，因此我们不得不相应调整生产标准。）​"], ["Our team has prepared a detailed proposal for the cooperation plan, which will be presented to the client tomorrow.", "（我们团队已为合作方案准备了一份详细提案，明天将提交给客户。）​"], ["The client raised three questions about our proposal, and we need to provide clear answers before the next meeting.", "（客户对我们的提案提出了三个问题，我们需要在下次会议前给出明确答复。）​"], ["After reviewing the competitor’s proposal, we decided to optimize our own to highlight our unique advantages.", "（在研究了竞争对手的提案后，我们决定优化自己的提案，突出我们的独特优势。）​"], ["The manager asked us to revise the proposal based on the feedback from the last negotiation and resubmit it by Friday.", "（经理要求我们根据上次谈判的反馈修改提案，并在周五前重新提交。）​"], ["The proposal focuses on reducing costs while improving efficiency, which we believe aligns with the client’s current needs.", "（该提案聚焦于降低成本的同时提升效率，我们认为这符合客户当前的需求。）​"], ["During the negotiation, the client clearly stated their demand for a 10% discount on the total order amount.", "（谈判中，客户明确提出了对总订单金额给予 10% 折扣的要求。）​"], ["We need to analyze the market demand carefully before finalizing the product pricing strategy in the negotiation.", "（在谈判中确定产品定价策略前，我们需要仔细分析市场需求。）​"], ["The supplier’s demand for advance payment of 50% is beyond our company’s policy, so we need to negotiate further.", "（供应商要求预付 50% 款项的需求超出了我们公司的政策，因此需要进一步协商。）​"], ["Understanding the other party’s hidden demands is more important than addressing their surface requirements in a negotiation.", "（谈判中，了解对方的潜在需求比满足其表面要求更重要。）​"], ["We can meet the client’s demand for faster delivery, but we need them to accept a slight adjustment in the product specifications.", "（我们可以满足客户对更快交付的需求，但需要他们接受产品规格的小幅调整。）​"], ["We should emphasize the long-term benefits of our cooperation to the client during the negotiation to gain their trust.", "（谈判中，我们应向客户强调合作的长期利益，以获得他们的信任。）​"], ["The new contract terms will bring mutual benefits to both our company and the supplier, promoting long-term collaboration.", "（新的合同条款将为我们公司和供应商带来互利，促进长期合作。）​"], ["The client is more concerned about the short-term benefits, so we need to adjust our introduction to highlight immediate returns.", "（客户更关注短期利益，因此我们需要调整介绍内容，突出即时回报。）​"], ["We need to explain how our solution will benefit the client’s business growth in detail during the negotiation.", "（谈判中，我们需要详细说明我们的解决方案将如何助力客户的业务增长。）​"], ["The compromise we reached ensures that neither party’s core benefits are damaged, laying a solid foundation for future cooperation.", "（我们达成的折中方案确保了双方的核心利益都不受损害，为未来合作奠定坚实基础。）​"], ["The two parties have not yet reached an agreement on the contract term, so we need to arrange another negotiation session.", "（双方尚未就合同期限达成一致，因此需要安排另一场谈判。）​"], ["We need to review each term of the draft contract carefully to avoid potential risks before the formal negotiation.", "（正式谈判前，我们需要仔细审查合同草案的每一项条款，避免潜在风险。）​"], ["The client proposed to modify the payment term from 30 days to 60 days, which we need to evaluate based on our cash flow.", "（客户提议将付款条款从 30 天修改为 60 天，我们需要根据现金流情况进行评估。）​"], ["During the negotiation, we should focus on the key terms such as delivery time, quality standards, and after-sales service.", "（谈判中，我们应重点关注交付时间、质量标准和售后服务等关键条款。）​"], ["The supplier agreed to adjust the warranty term from 1 year to 2 years, which is a major breakthrough in the negotiation.", "（供应商同意将保修条款从 1 年调整为 2 年，这是谈判中的重大突破。）​"], ["We are willing to make a concession on the price, but the client needs to increase the order quantity by 20%.", "（我们愿意在价格上做出让步，但客户需要将订单数量增加 20%。）​"], ["The supplier’s final concession of reducing the unit price by 5% helped us reach a final agreement in the negotiation.", "（供应商最终做出的将单价降低 5% 的让步，帮助我们在谈判中达成了最终协议。）​"], ["We need to set a bottom line for concessions before the negotiation to avoid excessive losses for the company.", "（谈判前，我们需要设定让步底线，避免公司遭受过多损失。）​"], ["The client refused to make any further concessions, so we had to re-evaluate our negotiation strategy.", "（客户拒绝再做出任何让步，因此我们需要重新评估谈判策略。）​"], ["A small concession in the early stage of the negotiation can help build a positive atmosphere and promote smooth communication.", "（谈判初期的小幅让步有助于营造积极氛围，推动沟通顺利进行。）​"], ["After two days of intense negotiation, the two parties finally signed a formal agreement on the project cooperation.", "（经过两天的紧张谈判，双方最终就项目合作签署了正式协议。）​"], ["We need to confirm all details with the client to ensure there is no misunderstanding before finalizing the agreement.", "（在敲定协议前，我们需要与客户确认所有细节，确保没有误解。）​"], ["The verbal agreement reached in the negotiation needs to be converted into a written contract as soon as possible to avoid disputes.", "（谈判中达成的口头共识需要尽快转化为书面合同，避免纠纷。）​"], ["The agreement includes clauses on liability division, which is crucial for handling potential problems during cooperation.", "（该协议包含责任划分条款，这对处理合作中的潜在问题至关重要。）​"], ["Both parties agreed to review the agreement every six months to make adjustments based on the actual cooperation situation.", "（双方同意每六个月审查一次协议，根据实际合作情况进行调整。）​"], ["We need to develop a flexible negotiation strategy to respond to the client’s possible objections effectively.", "（我们需要制定灵活的谈判策略，以有效应对客户可能提出的反对意见。）​"], ["The manager decided to adopt a cooperative strategy in the negotiation, focusing on building a long-term partnership with the supplier.", "（经理决定在谈判中采取合作型策略，重点与供应商建立长期伙伴关系。）​"], ["Before the negotiation, we should analyze the other party’s strengths and weaknesses to adjust our strategy accordingly.", "（谈判前，我们应分析对方的优势和劣势，据此调整我们的策略。）​"], ["The competitive strategy we used in the last negotiation was not effective, so we need to switch to a more collaborative approach.", "（上次谈判中我们采用的竞争型策略效果不佳，因此需要转向更具协作性的方式。）​"], ["Our negotiation strategy emphasizes listening to the client’s needs first and then proposing targeted solutions.", "（我们的谈判策略强调先倾听客户需求，再提出针对性的解决方案。）​"], ["The client raised an objection to our proposed delivery time, saying it would delay their project progress.", "（客户对我们提出的交付时间表示异议，称这会延误他们的项目进度。）​"], ["We need to prepare responses to possible objections in advance to avoid being caught off guard during the negotiation.", "（我们需要提前准备对可能反对意见的回应，避免在谈判中措手不及。）​"], ["When facing an objection, we should first acknowledge the other party’s concerns before explaining our position.", "（面对反对意见时，我们应先认可对方的顾虑，再阐述自己的立场。）​"], ["The supplier’s objection to the quality inspection standards needs to be resolved through technical discussions before the negotiation continues.", "（供应商对质量检测标准的反对意见需要通过技术讨论解决，之后谈判才能继续。）​"], ["We successfully addressed the client’s objection by providing data to prove the reliability of our product in the negotiation.", "（谈判中，我们通过提供数据证明产品的可靠性，成功化解了客户的反对意见。）​"], ["Clarifying the negotiation priorities before the meeting helps us focus on key issues and avoid wasting time on trivial matters.", "（会议前明确谈判重点，有助于我们聚焦关键问题，避免在琐事上浪费时间。）​"], ["The client’s top priority is to reduce costs, so our proposal should highlight cost-saving measures in the negotiation.", "（客户的首要任务是降低成本，因此我们的提案在谈判中应突出成本节约措施。）​"], ["We need to align our negotiation priorities with the company’s overall goals to ensure the final agreement is beneficial to long-term development.", "（我们需要将谈判重点与公司整体目标对齐，确保最终协议有利于长期发展。）​"], ["During the negotiation, we should be flexible to adjust priorities based on the other party’s feedback to promote agreement.", "（谈判中，我们应灵活根据对方的反馈调整重点，以推动达成共识。）​"], ["The manager emphasized that protecting the company’s intellectual property rights is the top priority in this negotiation.", "（经理强调，在此次谈判中，保护公司的知识产权是首要重点。）​"], ["Showing appropriate flexibility in the negotiation can help build a harmonious atmosphere and promote mutual understanding.", "（谈判中展现适当的灵活性有助于营造和谐氛围，促进相互理解。）​"], ["Our company’s policy allows some flexibility in payment terms, which we can use as a bargaining chip in the negotiation.", "（我们公司的政策在付款条款上允许一定弹性，这可以作为我们谈判中的筹码。）​"], ["The client appreciated our flexibility in adjusting the delivery schedule to meet their urgent needs during the negotiation.", "（谈判中，客户对我们为满足其紧急需求而灵活调整交付计划表示赞赏。）​"], ["We need to balance flexibility and principle in the negotiation to avoid making unreasonable concessions.", "（谈判中，我们需要平衡灵活性与原则性，避免做出不合理的让步。）​"], ["The supplier’s lack of flexibility on product specifications made it difficult to reach an agreement in the first round of negotiation.", "（供应商在产品规格上缺乏灵活性，导致第一轮谈判难以达成协议。）​"], ["The two parties spent a lot of time bargaining over the price, and finally agreed on a reasonable range.", "（双方在价格上花了大量时间讨价还价，最终确定了合理范围。）​"], ["We should not focus only on bargaining for short-term benefits but consider the long-term value of the cooperation.", "（我们不应只专注于短期利益的讨价还价，而应考虑合作的长期价值。）​"], ["The client is good at bargaining, so we need to prepare sufficient data to support our pricing in the negotiation.", "（客户擅长讨价还价，因此我们需要准备充足的数据在谈判中支撑我们的定价。）​"], ["A fair bargain should ensure that both parties get what they need without sacrificing core interests.", "（公平的讨价还价应确保双方在不牺牲核心利益的前提下获得所需。）​"], ["The supplier offered a better bargain after we mentioned our intention to cooperate for a long time in the negotiation.", "（谈判中，我们提及长期合作的意向后，供应商给出了更优惠的交易条件。）​"], ["The client set a deadline of next Friday for reaching a final agreement, so we need to speed up the negotiation process.", "（客户设定了下周五为达成最终协议的截止日期，因此我们需要加快谈判进度。）​"], ["We should clearly communicate our internal deadline for the negotiation to the other party to avoid unnecessary delays.", "（我们应向对方明确传达谈判的内部截止日期，避免不必要的延误。）​"], ["The supplier requested an extension of the negotiation deadline to consult with their headquarters, which we agreed to after discussion.", "（供应商请求延长谈判截止日期以咨询总部，我们经讨论后同意了这一请求。）​"], ["Setting a clear deadline for each negotiation phase helps us manage the process efficiently and avoid endless discussions.", "（为谈判的每个阶段设定明确截止日期，有助于我们高效管理流程，避免无休止的讨论。）​"], ["We need to remind the client of the upcoming negotiation deadline in the next meeting to ensure they prepare the necessary materials in time.", "（下次会议中，我们需要提醒客户即将到来的谈判截止日期，确保他们及时准备所需材料。）​"], ["Before the negotiation, we should confirm the other party’s authority to make final decisions to avoid wasting time on ineffective discussions.", "（谈判前，我们应确认对方是否有做出最终决策的权限，避免在无效讨论上浪费时间。）​"], ["The client’s representative explained that they don’t have the authority to approve the price adjustment, so we need to wait for their manager’s feedback.", "（客户代表表示他们没有批准价格调整的权限，因此我们需要等待其经理的反馈。）​"], ["Our manager has granted me the authority to make concessions within a 5% price range during the negotiation with the supplier.", "（经理已授权我在与供应商的谈判中，可在 5% 的价格范围内做出让步。）​"], ["It’s important to clarify the authority scope of both parties at the beginning of the negotiation to ensure that the reached agreements can be implemented smoothly.", "（谈判初期明确双方的权限范围很重要，这能确保达成的共识顺利落地。）​"], ["The supplier’s team needs to apply for additional authority from their headquarters to accept our proposed payment terms, which may delay the negotiation progress.", "（供应商团队需向总部申请额外权限才能接受我们提出的付款条款，这可能会延误谈判进度。）​"], ["The client informed us that their project budget is limited, so we need to adjust our proposal to fit within their budget range during the negotiation.", "（客户告知我们其项目预算有限，因此谈判中我们需要调整提案，以适配他们的预算范围。）​"], ["We should provide a detailed cost breakdown in the negotiation to prove that our quotation is reasonable and in line with the market budget level.", "（谈判中我们应提供详细的成本明细，证明报价合理且符合市场预算水平。）​"], ["The supplier’s quotation exceeds our initial budget by 15%, so we need to negotiate with them to reduce the cost or adjust the service content.", "（供应商的报价超出我们初始预算 15%，因此我们需要与他们协商降低成本或调整服务内容。）​"], ["During the negotiation, we can propose phased payment to help the client ease their budget pressure while ensuring our own cash flow stability.", "（谈判中，我们可提出分期付款方案，帮助客户缓解预算压力，同时保障我方现金流稳定。）​"], ["The client is willing to increase their budget by 8% if we can shorten the delivery time by two weeks, which is a key point we can leverage in the negotiation.", "（若我们能将交付时间缩短两周，客户愿意将预算提高 8%，这是我们在谈判中可利用的关键筹码。​"], ["We need to identify potential risks such as supply delays in the negotiation and propose corresponding risk mitigation measures to protect the company’s interests.", "（谈判中我们需识别供应延迟等潜在风险，并提出相应的风险缓解措施，以保护公司利益。）​"], ["The client is concerned about the quality risk of the product, so we need to provide third-party inspection reports in the negotiation to eliminate their worries.", "（客户担心产品质量风险，因此谈判中我们需提供第三方检测报告，打消他们的顾虑。）​"], ["The supplier refused to take responsibility for the transportation risk, so we need to negotiate a clear risk-sharing mechanism in the contract terms.", "（供应商拒绝承担运输风险，因此我们需要在合同条款中协商明确的风险分担机制。）​"], ["It’s necessary to evaluate the financial risk of the cooperation project in the negotiation to avoid losses caused by the client’s delayed payment.", "（谈判中评估合作项目的财务风险很有必要，以避免因客户延迟付款造成损失。）​"], ["We can accept the client’s proposed terms, but we need to add a risk compensation clause in the agreement to deal with unforeseen circumstances during cooperation.", "（我们可以接受客户提出的条款，但需在协议中增加风险补偿条款，以应对合作中的突发情况。）​"], ["The client requires us to make a commitment to complete the project within three months, and we need to assess our capacity before responding in the negotiation.", "（客户要求我们承诺三个月内完成项目，谈判中我们需先评估自身能力再做回应。）​"], ["The supplier’s commitment to provide after-sales service for five years is an important factor that helps us make the cooperation decision in the negotiation.", "（供应商承诺提供五年售后服务，这是谈判中帮助我们做出合作决策的重要因素。）​"], ["We should ask the client to put their verbal commitment into the written agreement in the negotiation to avoid disputes caused by unfulfilled promises.", "（谈判中我们应要求客户将口头承诺落实到书面协议中，避免因承诺未兑现引发纠纷。）​"], ["The manager emphasized that our company’s commitment to product quality must not be compromised in the negotiation, even if it means making concessions on the price.", "（经理强调，谈判中即便在价格上做出让步，公司对产品质量的承诺也绝不能打折扣。）​"], ["The client is willing to increase their order quantity if we can make a commitment to reserve production capacity for them during the peak season.", "（若我们能承诺在旺季为其预留产能，客户愿意增加订单量，这是谈判中的重要交换条件。）​"], ["We need to ask the client for timely feedback on our proposal after the negotiation to adjust our strategy according to their opinions.", "（谈判后我们需请客户对提案给出及时反馈，以便根据他们的意见调整策略。）​"], ["The supplier promised to provide feedback on our proposed terms within three working days, which we should follow up on proactively.", "（供应商承诺三个工作日内就我们提出的条款给出反馈，我们需主动跟进此事。）​"], ["During the negotiation, we should listen carefully to the client’s feedback on the product function and take it into account when revising the plan.", "（谈判中我们应认真倾听客户对产品功能的反馈，并在修订方案时将其纳入考虑。）​"], ["The client’s negative feedback on the delivery time reminds us to optimize our production schedule before the next round of negotiation.", "（客户对交付时间的负面反馈提醒我们，需在新一轮谈判前优化生产计划。）​"], ["We can provide a draft agreement to the supplier in advance and request their feedback to speed up the negotiation process.", "（我们可提前向供应商提供协议草案，并收集他们的反馈，以加快谈判进度。）​"], ["We should emphasize the long-term collaboration potential between the two parties in the negotiation to shift the focus from short-term interests to mutual development.", "（谈判中我们应强调双方的长期合作潜力，将关注点从短期利益转向共同发展。）​"], ["The supplier proposed a joint R&D collaboration model, which we need to evaluate from the perspectives of technology, cost and risk in the negotiation.", "（供应商提出联合研发的合作模式，谈判中我们需从技术、成本、风险等角度进行评估。）​"], ["The client’s willingness to strengthen collaboration in the after-sales service field is a positive signal that promotes the progress of the negotiation.", "（客户愿意在售后服务领域加强合作，这是推动谈判进展的积极信号。）​"], ["During the negotiation, we can propose a pilot collaboration project to test the cooperation model before signing a long-term contract.", "（谈判中我们可提出试点合作项目，在签订长期合同前验证合作模式的可行性。）​"], ["The successful resolution of the payment dispute has laid a solid foundation for future collaboration between us and the client, which we should maintain through regular communication.", "付款纠纷的顺利解决为我们与客户未来的合作奠定了坚实基础，我们需通过定期沟通维系这一关系。"]];window.__KEY__="1013外企商务英语谈判必备750句";window.__TITLE__="10.13 外企商务英语谈判必备750句";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
