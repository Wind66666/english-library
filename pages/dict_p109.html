 "嗨 [姓名]，[营销活动] 的落地页无法将访客转化为客户。我们是重新设计页面，让行动召唤按钮更醒目，还是用不同页面布局进行 A/B 测试以找到有效方案？"], ["Dear [Team Member], the [team] is confused about who’s responsible for the [task] because the assignment wasn’t clearly documented. Should we update the project management tool to assign the task to a specific person, or hold a quick meeting to clarify roles?", "尊敬的 [团队成员]，因任务分配未明确记录，[团队] 不清楚谁负责 [任务]。我们是更新项目管理工具，将任务分配给具体人员，还是开短会明确职责？"], ["Hey [First Name], the [product] we received from the supplier has a batch defect—10 out of 50 units don’t work. Should we return the entire batch for a replacement, or ask the supplier to send 10 new units to replace the defective ones?", "嗨 [名]，我们从供应商处收到的 [产品] 存在批次缺陷 ——50 件中有 10 件无法使用。我们是将整批产品退回更换，还是要求供应商寄送 10 件新商品替换有问题的部分？"], ["Hi [Customer], the [service] you subscribed to will be discontinued next month. We can transfer you to our newer, upgraded service for free, or provide a full refund for the remaining subscription period. Which option do you prefer?", "嗨 [客户]，你订阅的 [服务] 将于下个月停止提供。我们可以免费将你转移到更新的升级服务，或为剩余订阅期提供全额退款。你更倾向哪种选择？"], ["Dear [Name], the [client presentation] is tomorrow, but we just realized the data in the charts is outdated. Should we update the data with the latest figures now (even if it takes an hour), or use the old data and mention the update in the presentation?", "尊敬的 [姓名]，明天就要进行客户演示，但我们刚发现图表中的数据已过时。我们是现在更新最新数据（即使需要 1 小时），还是使用旧数据并在演示中说明将更新？"], ["Hey [Team Member], the [invoice] we sent to the client has the wrong company name, which might delay payment. Should we send a corrected invoice with a note apologizing for the error, or call the client’s accounts team to inform them of the mistake?", "嗨 [团队成员]，我们发给客户的 [发票] 中公司名称有误，可能导致付款延迟。我们是发送修正后的发票并附致歉说明，还是打电话告知客户财务团队该错误？"], ["Hi [First Name], the [project] is at risk of missing the deadline because the client keeps requesting small changes. Should we set a cutoff date for further changes, or ask for additional time to accommodate the requests?", "嗨 [名]，因客户不断提出小修改，[项目] 可能无法按时完成。我们是设定修改截止日期，不再接受新需求，还是请求额外时间满足这些修改？"], ["Dear [Customer], the [product] you ordered is no longer in production, so we can’t fulfill the order. We have a newer model with better features available at the same price, or we can process a full refund immediately. What would you like to do?", "尊敬的 [客户]，你订购的 [产品] 已停产，无法履约。我们有一款功能更优的新型号，价格相同，或可立即为你办理全额退款。你想如何处理？"], ["Hey [Name], the [server] that hosts our website is down, and IT says it will take 4 hours to fix. Should we post a temporary notice on our social media to inform visitors, or redirect the website to a backup page with basic information?", "嗨 [姓名]，托管网站的 [服务器] 故障，IT 部门表示需要 4 小时修复。我们是在社交媒体发布临时通知告知访客，还是将网站重定向到包含基础信息的备份页面？"], ["Hi [Team Member], the [client] wants the [deliverable] in a different file format than we agreed on. Should we convert the file to the requested format and send it, or explain that converting might affect quality and ask if they can accept the original format?", "嗨 [团队成员]，[客户] 要求 [交付成果] 使用与约定不同的文件格式。我们是将文件转换为要求的格式后发送，还是说明转换可能影响质量，并询问他们是否能接受原格式？"], ["Dear [First Name], the [team] is struggling with the new [software] we adopted for project management. Should we schedule a training session with the software provider, or create a simple guide with step-by-step instructions for common tasks?", "尊敬的 [名]，[团队] 在使用新的项目管理 [软件] 时遇到困难。我们是安排软件供应商进行培训，还是制作包含常见任务分步说明的简易指南？"], ["Hey [Customer], the [delivery] of your [product] was delayed because of a shipping strike. We’ve upgraded your shipping to expedited for free once the strike ends, and we’ll send you a $15 store credit as an apology. Would you like us to notify you when shipping resumes?", "嗨 [客户]，因运输罢工，你的 [产品] 配送延迟。罢工结束后，我们将免费为你升级为加急配送，并赠送 15 美元店铺信用额作为致歉。你希望在配送恢复时收到通知吗？"], ["Hi [Name], the [marketing ad] has a legal disclaimer that’s too small and might violate regulations. Should we resize the disclaimer to meet legal requirements and repost the ad, or leave it as is and risk a penalty?", "嗨 [姓名]，[营销广告] 中的法律免责声明字体过小，可能违反规定。我们是调整免责声明字体大小以符合法律要求后重新投放广告，还是保持原样并承担违规风险？"], ["Dear [Team Member], the [supplier] sent the [materials] to the wrong warehouse, and it will take 3 days to redirect them. Should we pick up the materials from the wrong warehouse ourselves to save time, or wait for the supplier to redirect them?", "尊敬的 [团队成员]，[供应商] 将 [材料] 寄错了仓库，重新转运需要 3 天。我们是自行从错误仓库提取材料以节省时间，还是等待供应商重新转运？"], ["Hey [First Name], the [client] is asking for a meeting to discuss the project, but their available times conflict with our team’s schedule. Should we suggest alternative times that work for both, or assign one team member to attend at the client’s preferred time?", "嗨 [名]，[客户] 要求开会讨论项目，但他们的可用时间与我们团队的日程冲突。我们是提出双方都方便的其他时间，还是安排一名团队成员在客户偏好的时间参会？"], ["Hi [Customer], the [app] isn’t saving your preferences because of a cache issue. Clearing your app cache should fix it—here’s how: go to your device settings > Apps > [App Name] > Storage > Clear Cache. If it still doesn’t work, let me know, and we’ll troubleshoot further.", "嗨 [客户]，因缓存问题，[应用] 无法保存你的偏好设置。清除应用缓存即可解决 —— 操作步骤如下：进入设备设置 > 应用 > [应用名称] > 存储 > 清除缓存。若仍无效，请告知我，我们会进一步排查。"], ["Dear [Name], the [project] budget is over by 10% because of unexpected material costs. Should we cut back on non-essential expenses (like team lunches) to stay on budget, or present the overage to the client and ask for approval?", "尊敬的 [姓名]，因意外材料成本，[项目] 预算超支 10%。我们是削减非必要支出（如团队午餐）以控制预算，还是向客户说明超支情况并请求批准？"], ["Hey [Team Member], the [report] we sent to the board has a wrong date in the executive summary, which might cause confusion. Should we send a corrected version with a note, or mention the error during the presentation and correct it verbally?", "嗨 [团队成员]，我们提交给董事会的 [报告] 中，执行摘要的日期有误，可能引发误解。我们是发送修正版并附说明，还是在演示时口头指出错误并更正？"], ["Hi [First Name], the [client] is unhappy with the response time for their questions. Should we assign a dedicated point of contact to reply within 2 hours, or set up an auto-response to acknowledge their questions and provide a timeline for a detailed reply?", "嗨 [名]，[客户] 对问题回复速度不满。我们是安排专人负责，确保 2 小时内回复，还是设置自动回复确认收到问题，并告知详细回复的时间？"], ["Dear [Customer], the [product] you returned has signs of wear and tear, so it doesn’t qualify for a full refund. We can offer a 50% refund, or a store credit equal to the full price (valid for 6 months). Which option works better for you?", "尊敬的 [客户]，你退回的 [产品] 有磨损痕迹，不符合全额退款条件。我们可提供 50% 退款，或等值于原价的店铺信用额（有效期 6 个月）。哪种方案更适合你？"], ["Hey [Name], the [team] is unsure how to proceed with the [task] because the requirements are vague. Should we schedule a call with the client to clarify the requirements, or make assumptions based on similar past projects and note them in the deliverable?", "嗨 [姓名]，因需求模糊，[团队] 不确定如何推进 [任务]。我们是安排通话与客户明确需求，还是根据过往类似项目做出假设，并在交付成果中注明？"], ["Hi [Team Member], the [supplier] is increasing prices by 20% next month. Should we place a large order this month to lock in the current price, or negotiate a long-term contract to keep prices stable?", "嗨 [团队成员]，[供应商] 下月将涨价 20%。我们是本月大量订购以锁定当前价格，还是协商长期合同保持价格稳定？"], ["Dear [First Name], the [website]’s mobile version isn’t displaying images correctly. Should we ask the web team to fix the responsive design immediately, or hide images on mobile temporarily until the fix is ready?", "尊敬的 [名]，[网站] 移动端图片显示异常。我们是让网页团队立即修复响应式设计，还是在修复完成前暂时隐藏移动端图片？"], ["Hey [Customer], the [service] you’re using has a temporary glitch that’s preventing you from accessing your files. Our tech team is working on it, and it should be fixed within an hour. Would you like us to email you the files you need in the meantime?", "嗨 [客户]，你使用的 [服务] 出现临时故障，导致无法访问文件。技术团队正在处理，预计 1 小时内修复。在此期间，你需要我们将所需文件通过邮件发送给你吗？"], ["Hi [Name], the [client] wants to cancel the project halfway through, which is against our contract. Should we refer to the contract’s cancellation clause and request the agreed fee, or negotiate a reduced fee to maintain a good relationship?", "嗨 [姓名]，[客户] 想在项目中途取消，这违反了我们的合同。我们是依据合同中的取消条款要求支付约定费用，还是协商降低费用以维护良好关系？"], ["Dear [Team Member], the [invoice] we received from the vendor has a higher amount than quoted. Should we dispute the charge and ask for a corrected invoice, or pay the quoted amount and follow up on the difference later?", "尊敬的 [团队成员]，供应商发来的 [发票] 金额高于报价。我们是提出异议并要求修正发票，还是先支付报价金额，之后再跟进差额问题？"], ["Hey [First Name], the [team] is behind on the [project] because of a key team member’s unexpected leave. Should we redistribute their tasks to other members, or hire a temporary contractor to fill in?", "嗨 [名]，因核心团队成员突发请假，[团队] 的 [项目] 进度滞后。我们是将他们的任务重新分配给其他成员，还是雇佣临时承包商填补空缺？"], ["Hi [Customer], the [product] you ordered will be delayed by 5 days, but we can include a free accessory as a token of apology. Would you like to wait for the delayed order with the accessory, or cancel and receive a full refund immediately?", "嗨 [客户]，你订购的 [产品] 将延迟 5 天送达，但我们可赠送免费配件作为致歉。你希望等待延迟订单并获得配件，还是取消订单并立即获得全额退款？"], ["Dear [Name], the [marketing campaign] isn’t reaching the target audience because of incorrect targeting settings. Should we adjust the settings (e.g., age, location) and restart the campaign, or pause it to conduct more research on the target audience?", "尊敬的 [姓名]，因定向设置错误，[营销活动] 未触达目标受众。我们是调整设置（如年龄、地区）后重新启动活动，还是暂停活动以深入研究目标受众？"], ["Hey [Team Member], the [report] lacks a conclusion section, which the client specifically requested. Should we add the conclusion and resend the report within 2 hours, or explain that we’ll include it in the next follow-up report?", "嗨 [团队成员]，[报告] 缺少客户明确要求的结论部分。我们是在 2 小时内添加结论后重新发送报告，还是说明将在后续报告中补充？"], ["Hi [First Name], the [supplier] can’t provide the [materials] we need, but they recommended another supplier who can. Should we contact the recommended supplier to check prices and delivery times, or search for other suppliers ourselves to compare options?", "嗨 [名]，[供应商] 无法提供我们需要的 [材料]，但推荐了另一家可提供的供应商。我们是联系推荐的供应商查询价格和交付时间，还是自行寻找其他供应商对比选择？"], ["Hi [Name], hope our recent project collaboration went smoothly for you! We wanted to check in and see if there’s anything we can improve on for future partnerships.", "嗨 [姓名]，希望我们近期的项目合作让你感觉顺利！想跟进了解，未来合作中我们有哪些可以改进的地方吗？"], ["Dear [Customer], as we wrap up this quarter’s cooperation, we’ve prepared a short feedback form to learn about your experience. Your input will help us refine our services—could you spare 5 minutes to fill it out?", "尊敬的 [客户]，本季度合作即将结束，我们准备了简短的反馈问卷，了解你的合作体验。你的意见将帮助我们优化服务 —— 能否抽 5 分钟填写？"], ["Hey [First Name], it’s been great working with you on the [project]! We’ve compiled a summary of key achievements and next steps—sharing it with you to keep our collaboration aligned moving forward.", "嗨 [名]，与你合作 [项目] 非常愉快！我们整理了关键成果和下一步计划 —— 分享给你，确保未来合作步调一致。"], ["Hi [Partner], we noticed you’ve been a valued collaborator for over 2 years. To thank you, we’re offering an exclusive 15% discount on our services for your next project with us.", "嗨 [合作伙伴]，我们注意到你已是我们 2 年多的重要合作伙伴。为表感谢，你下次与我们合作项目时，可享受服务专属 15% 折扣。"], ["Dear [Name], we wanted to share our latest service updates—we’ve added 24/7 technical support and streamlined the project approval process to save time. Let us know if you’d like a demo to see how these updates benefit our collaboration.", "尊敬的 [姓名]，想与你分享我们最新的服务更新 —— 新增 24 小时技术支持，并简化项目审批流程以节省时间。若想了解这些更新如何助力我们的合作，可告知我们，为你安排演示。"], ["Hey [First Name], as we plan next quarter’s collaboration, we’d love to hear your team’s priorities. Are there specific goals you want to achieve, or support you need from us to make it happen?", "嗨 [名]，在规划下季度合作时，我们很想了解你团队的优先事项。是否有特定目标希望达成，或需要我们提供哪些支持来实现这些目标？"], ["Hi [Partner], we’re hosting an exclusive partner workshop next month focused on “optimizing cross-team collaboration.” We’d like to invite you and your team—there will be case studies, networking, and actionable tips. Would you be interested in joining?", "嗨 [合作伙伴]，我们下月将举办专属合作伙伴研讨会，主题为 “优化跨团队协作”。诚邀你和团队参加 —— 活动包含案例分析、交流环节和实用技巧。你有兴趣参与吗？"], ["Dear [Name], to ensure our collaboration stays on track, we’ve set up a shared project dashboard where you can view real-time progress, task updates, and deliverables. I’ve sent you the access link—let me know if you need help navigating it.", "尊敬的 [姓名]，为确保合作顺利推进，我们搭建了共享项目仪表盘，你可在其中查看实时进度、任务更新和交付成果。已向你发送访问链接 —— 若使用时需要帮助，请告知。"], ["Hey [First Name], we recently received feedback from our team about our collaboration, and they mentioned your team’s timely responses have been a huge help. We really appreciate your professionalism—thank you!", "嗨 [名]，我们近期从团队处收到关于合作的反馈，他们提到你团队的及时回复带来了很大帮助。非常感谢你的专业态度 —— 谢谢！"], ["Hi [Partner], we’re updating our service level agreement (SLA) to better align with partner needs. We’d like to share a draft with you and get your input—are there any terms you think should be adjusted for our future collaboration?", "嗨 [合作伙伴]，我们正在更新服务水平协议（SLA），以更好匹配合作伙伴需求。想向你分享协议草案并听取意见 —— 对于未来合作，你认为有哪些条款需要调整？"], ["Dear [Name], it’s been 3 months since we started our collaboration, and we wanted to schedule a quick check-in call. We can review progress, address any challenges, and plan next steps together. Would next Tuesday at 3 PM work for you?", "尊敬的 [姓名]，我们的合作已开展 3 个月，希望安排一次简短跟进通话。可共同回顾进度、解决潜在问题，并规划后续步骤。下周二下午 3 点对你来说方便吗？"], ["Hey [First Name], we’ve prepared a customized collaboration plan for your team based on our past projects. It includes recommended communication frequency, key contact roles, and risk mitigation strategies. I’ll send it to you today—feel free to share feedback.", "嗨 [名]，基于过往项目经验，我们为你团队定制了合作计划。计划包含建议沟通频率、核心联系人职责和风险应对策略。今日将发送给你 —— 欢迎分享意见。"], ["Hi [Partner], we’re launching a new referral program for our partners: if you refer a new client to us, you’ll receive a 10% commission on their first project fee. It’s our way of saying thank you for trusting and supporting us.", "嗨 [合作伙伴]，我们为合作伙伴推出新推荐计划：若你向我们推荐新客户，可获得该客户首个项目费用 10% 的佣金。这是我们对你的信任与支持表示感谢的方式。"], ["Dear [Name], to improve communication efficiency, we suggest setting up a weekly 15-minute sync call instead of relying solely on emails. This way, we can address questions in real time and avoid misunderstandings. What do you think?", "尊敬的 [姓名]，为提升沟通效率，我们建议每周安排 15 分钟同步通话，而非仅依赖邮件沟通。这样可实时解决问题，避免误解。你认为如何？"], ["Hey [First Name], our team recently attended a workshop on “cross-industry collaboration best practices” and picked up some useful tips. We’d love to share a summary with you—maybe some of them can apply to our partnership.", "嗨 [名]，我们团队近期参加了 “跨行业协作最佳实践” 研讨会，学到一些实用技巧。很想向你分享总结内容 —— 或许其中部分可应用于我们的合作。"], ["Hi [Partner], we’re celebrating our 5th year of collaboration with key partners like you! We’d like to send you a small gift as a token of our appreciation—could you confirm your current shipping address?", "嗨 [合作伙伴]，我们正庆祝与你这样的核心合作伙伴合作 5 周年！想寄一份小礼物表达感谢 —— 能否确认你当前的收货地址？"], ["Dear [Name], we noticed there was a minor delay in the last deliverable, and we want to ensure it doesn’t happen again. We’ve adjusted our internal timeline to build in more buffer time—let us know if you have other suggestions to improve timeliness.", "尊敬的 [姓名]，我们注意到上一份交付成果存在小幅延迟，希望避免类似情况再次发生。已调整内部时间表，预留更多缓冲时间 —— 若你有其他提升时效性的建议，欢迎告知。"], ["Hey [First Name], we’d like to nominate your team for our “Partner of the Quarter” award—your dedication and collaboration have been key to our project success. Would you be okay with us featuring your team in our internal newsletter?", "嗨 [名]，我们想提名你团队参评 “季度合作伙伴” 奖项 —— 你的投入与协作是项目成功的关键。我们能否在内部通讯中介绍你团队的事迹？"], ["Hi [Partner], we’re updating our partner portal to include a resource library with templates, case studies, and training materials. It will be live next week, and we’ll send you the login details—let us know if there are specific resources you’d like us to add.", "嗨 [合作伙伴]，我们正在更新合作伙伴门户，新增包含模板、案例分析和培训材料的资源库。门户将于下周上线，届时会向你发送登录信息 —— 若有特定资源希望我们补充，可告知。"], ["Dear [Name], to align our goals for the next project, we’ve prepared a list of key objectives and success metrics. We’d like to review it with you in our next meeting to make sure we’re on the same page.", "尊敬的 [姓名]，为统一下个项目的目标，我们整理了核心目标与成功指标清单。希望在下次会议中与你共同审核，确保双方达成共识。"], ["Hey [First Name], we recently hired a new account manager who will be dedicated to our collaboration. They have 5 years of experience in cross-team projects and will reach out to you next week to introduce themselves.", "嗨 [名]，我们近期新聘了一位客户经理，专门负责我们的合作事宜。他们拥有 5 年跨团队项目经验，将于下周联系你进行自我介绍。"], ["Hi [Partner], we’re hosting a virtual networking event for our partners next month—you’ll get to connect with other partners in your industry and share collaboration insights. Would you like to reserve a spot?", "嗨 [合作伙伴]，我们下月将为合作伙伴举办线上交流活动 —— 你可与同行业其他合作伙伴建立联系，分享协作经验。想预留参与名额吗？"], ["Dear [Name], we’ve received your feedback on the last project and have already implemented some changes, like extending the review period for deliverables. We’ll share a progress update on these changes in our next check-in.", "尊敬的 [姓名]，我们已收到你对上个项目的反馈，并已落实部分调整，例如延长交付成果的审核周期。将在下次跟进时向你分享这些调整的进展。"], ["Hey [First Name], to make our collaboration more transparent, we’ll start sharing a monthly progress report that includes task completion rates, upcoming milestones, and potential risks. The first report will be sent to you by the end of this week.", "嗨 [名]，为提升合作透明度，我们将开始每月分享进度报告，内容包含任务完成率、即将到来的里程碑和潜在风险。首份报告将于本周末前发送给你。"], ["Hi [Partner], we’re offering our long-term partners like you early access to our new service beta. It includes advanced features that can streamline your workflow—would you be interested in testing it and sharing feedback?", "嗨 [合作伙伴]，我们为你这样的长期合作伙伴提供新服务测试版的优先体验资格。测试版包含可简化工作流程的高级功能 —— 你有兴趣试用并分享反馈吗？"], ["Dear [Name], we noticed your team had to adjust to a last-minute change in the previous project, and we appreciate your flexibility. Moving forward, we’ll provide more advance notice for any changes to help you plan better.", "尊敬的 [姓名]，我们注意到你团队在上个项目中需适应临时变更，非常感谢你的灵活配合。未来我们将提前通知所有变更，帮助你更好地规划工作。"], ["Hey [First Name], we’d like to schedule a quarterly strategy meeting to discuss industry trends and how we can adjust our collaboration to capitalize on new opportunities. Would you be available for a 1-hour call next month?", "嗨 [名]，我们希望安排季度战略会议，讨论行业趋势及如何调整合作模式以把握新机遇。你下月有时间参加 1 小时的会议吗？"], ["Hi [Partner], we’ve prepared a “collaboration playbook” that outlines our processes, communication channels, and problem-solving protocols. It’s designed to make our partnership smoother—we’ll send you a copy today for your reference.", "嗨 [合作伙伴]，我们整理了 “协作手册”，其中列明了合作流程、沟通渠道和问题解决机制。手册旨在提升合作顺畅度 —— 今日将发送给你供参考。"], ["Dear [Name], to show our appreciation for your continued support, we’re waiving the setup fee for your next project with us. This is a small gesture, but we hope it reflects how much we value our collaboration.", "尊敬的 [姓名]，为感谢你一直以来的支持，我们将免除你下个合作项目的设置费。这只是一份小小心意，希望能体现我们对合作的重视。"], ["Hey [First Name], we recently received positive feedback from our end client about our joint project—they specifically mentioned the seamless collaboration between our teams. Great work, and thank you for your effort!", "嗨 [名]，我们近期从终端客户处收到关于联合项目的积极反馈 —— 他们特别提到我们团队间的协作非常顺畅。做得好，感谢你的付出！"], ["Hi [Partner], we’re updating our pricing structure for partners, and we’re offering you a 12% discount on all future services (up from 8%). This discount is exclusive to long-term partners like you and will take effect next month.", "嗨 [合作伙伴]，我们正在更新合作伙伴定价体系，未来你所有合作服务的折扣将从 8% 提升至 12%。该折扣仅面向你这样的长期合作伙伴，将于下月生效。"], ["Dear [Name], we’ve identified a few areas where we can streamline our workflow together, like integrating our project management tools to avoid duplicate data entry. We’d like to discuss these ideas with you in our next call.", "尊敬的 [姓名]，我们发现有几个方面可共同简化工作流程，例如整合双方项目管理工具以避免重复录入数据。希望在下次通话中与你讨论这些想法。"], ["Hey [First Name], we’re hosting a training session for our partners on “maximizing the value of our collaboration tools.” The session will cover tips for efficient use and troubleshooting—would you like to send a team member to attend?", "嗨 [名]，我们为合作伙伴举办 “充分利用协作工具价值” 的培训课程。课程包含工具高效使用技巧和问题排查方法 —— 你想安排团队成员参加吗？"], ["Hi [Partner], we wanted to share some good news: our joint project was selected as a “Case Study of the Month” by our industry association. We’d like to feature quotes from you in the case study—would you be willing to contribute?", "嗨 [合作伙伴]，分享一个好消息：我们的联合项目被行业协会选为 “月度案例研究”。希望在案例研究中引用你的观点 —— 你愿意提供吗？"], ["Dear [Name], to ensure we address issues quickly, we’ve assigned a dedicated support team to our collaboration. You can reach them via a special hotline or email, and they’ll respond within 4 hours. I’ll share the contact details with you today.", "尊敬的 [姓名]，为确保快速解决问题，我们为双方合作安排了专属支持团队。你可通过专用热线或邮箱联系他们，团队将在 4 小时内回复。今日将向你分享联系方式。"], ["Hey [First Name], we’ve reviewed our past collaboration and noticed that aligning our project timelines early on leads to better results. For the next project, we suggest finalizing the timeline together in the kickoff meeting—what do you think?", "嗨 [名]，我们回顾了过往合作，发现提前统一项目时间表能带来更好的成果。对于下个项目，建议在启动会议中共同确定时间表 —— 你认为如何？"], ["Hi [Partner], we’re offering our partners a free annual business review where we analyze our collaboration performance, identify opportunities for growth, and set goals for the next year. Would you be interested in scheduling one?", "嗨 [合作伙伴]，我们为合作伙伴提供免费年度业务回顾服务，分析合作表现、挖掘增长机遇并制定下年度目标。想安排一次这样的回顾会议吗？"], ["Dear [Name], we recently added a new feature to our service that we think will benefit your team—real-time data sharing that eliminates the need for manual file transfers. We’d love to give you a quick demo to show how it works.", "尊敬的 [姓名]，我们近期为服务新增了一项功能，相信能为你团队带来帮助 —— 实时数据共享，无需手动传输文件。很想为你做简短演示，展示功能用法。"], ["Hey [First Name], we appreciate your team’s willingness to go the extra mile on the last project—staying late to meet the deadline made a big difference. We’ve recognized your effort internally and wanted to say thank you again.", "嗨 [名]，感谢你团队在上个项目中主动加班加点 —— 为赶截止日期所做的额外付出带来了很大帮助。我们已在内部认可你的努力，想再次向你表示感谢。"], ["Hi [Partner], we’re launching a partner community forum where you can connect with other partners, ask questions, and share best practices. We’ll send you an invitation to join next week—we hope it becomes a valuable resource for your team.", "嗨 [合作伙伴]，我们将推出合作伙伴社区论坛，你可在其中与其他合作伙伴交流、提问并分享最佳实践。下周将向你发送加入邀请 —— 希望论坛能成为你团队的实用资源。"], ["Dear [Name], to avoid miscommunication, we’ve created a “glossary of terms” that defines key phrases and acronyms used in our collaboration. This will help ensure we’re all on the same page—we’ll share it with you shortly.", "尊敬的 [姓名]，为避免沟通误解，我们整理了 “术语表”，定义合作中使用的关键术语和缩写。这将确保双方理解一致 —— 很快会向你分享。"], ["Hey [First Name], we’d like to involve your team in our product development process by sharing early drafts of new features. Your input as a partner will help us create solutions that better fit your needs—would you be interested?", "嗨 [名]，我们希望邀请你团队参与产品开发过程，分享新功能的早期草案。作为合作伙伴，你的意见将帮助我们打造更贴合你需求的解决方案 —— 你有兴趣吗？"], ["Hi [Partner], we’re hosting a partner appreciation dinner next quarter to celebrate our successful collaborations. It will be a great opportunity to network and discuss future opportunities—we’d be honored to have you attend.", "嗨 [合作伙伴]，我们下季度将举办合作伙伴感恩晚宴，庆祝双方成功合作。这是交流和探讨未来机遇的好机会 —— 很荣幸能邀请你参加。"], ["Dear [Name], we’ve noticed that our weekly sync calls have been productive, but we want to make them even better. Would you be open to adding a “quick wins” section at the start to celebrate small successes and keep morale high?", "尊敬的 [姓名]，我们发现每周同步通话很有成效，希望能进一步优化。你是否愿意在会议开头新增 “小成就” 环节，庆祝阶段性成果并提升积极性？"], ["Hey [First Name], we’re offering our partners a free subscription to our industry insights newsletter, which includes market trends, competitor analysis, and collaboration tips. Would you like to sign up for it?", "嗨 [名]，我们为合作伙伴提供行业洞察通讯的免费订阅服务，内容包含市场趋势、竞争对手分析和协作技巧。想订阅吗？"], ["Hi [Partner], we’ve reviewed our SLA and want to add a “flexibility clause” that allows us to adjust timelines if unexpected challenges arise. This will make our collaboration more adaptable—we’d like to get your feedback on the draft.", "嗨 [合作伙伴]，我们审核了服务水平协议，希望新增 “灵活条款”，允许在突发挑战出现时调整时间表。这将提升合作的适应性 —— 想听取你对草案的意见。"], ["Dear [Name], to support your team’s growth, we’re offering free access to our online training courses for your employees. The courses cover project management, communication, and collaboration skills—let us know how many seats you need.", "尊敬的 [姓名]，为支持你团队发展，我们为你员工提供免费在线培训课程。课程涵盖项目管理、沟通和协作技能 —— 告知我们需要预留多少名额即可。"], ["Hey [First Name], we recently received a request from a new client looking for services similar to what we offer together. We thought of your team as a potential collaborator on this project—would you be interested in discussing the details?", "嗨 [名]，我们近期收到一位新客户的需求，其所需服务与我们合作提供的类型相似。我们认为你团队是该项目的潜在合作方 —— 有兴趣讨论具体细节吗？"], ["Hi [Partner], we’re updating our partner directory to highlight successful collaborations, and we’d like to feature your company with a short profile and a quote about our partnership. Would you be willing to provide a few sentences for this?", "嗨 [合作伙伴]，我们正在更新合作伙伴名录，突出展示成功合作案例，希望为你公司添加简介及关于双方合作的评价。你愿意提供几句评价内容吗？"], ["Dear [Name], to improve the quality of our deliverables, we suggest scheduling a pre-review meeting 3 days before each deadline. This will give us time to address any issues early and ensure the final output meets your expectations. What do you think?", "尊敬的 [姓名]，为提升交付成果质量，建议在每个截止日期前 3 天安排预审会议。这样我们有时间提前解决问题，确保最终成果符合你的预期。你认为如何？"], ["Hey [First Name], we’re celebrating “Partner Appreciation Week” next month, and we’ll be sharing stories of our top collaborations on social media. We’d love to share the story of our [project name] together—would you be okay with us featuring it?", "嗨 [名]，我们下月将庆祝 “合作伙伴感恩周”，并在社交媒体上分享优质合作故事。希望分享我们合作的 [项目名称] 的故事 —— 你同意我们展示这个项目吗？"], ["Hi [Partner], we’ve developed a new collaboration tool that lets us track task dependencies in real time, reducing delays caused by misaligned timelines. We’d like to demo it for your team next week—would you have time to attend?", "嗨 [合作伙伴]，我们开发了一款新协作工具，可实时跟踪任务依赖关系，减少因时间线错位导致的延误。希望下周为你团队演示 —— 你有时间参加吗？"], ["Dear [Name], we noticed that our communication during the last project was mostly via email, which sometimes led to delayed responses. Would you be open to using a shared chat tool for quick updates, while keeping emails for formal documents?", "尊敬的 [姓名]，我们发现上个项目中沟通主要依赖邮件，有时会导致回复延迟。你是否愿意使用共享聊天工具处理快速更新，同时保留邮件用于正式文件沟通？"], ["Hey [First Name], we’ve received feedback from our team that working with your design team has been incredibly smooth—their creativity and responsiveness have made the project much easier. We wanted to pass along this positive feedback and say thank you!", "嗨 [名]，我们从团队处收到反馈，与你设计团队的合作非常顺畅 —— 他们的创造力和响应速度让项目推进轻松许多。特此转达这份积极评价，并向你们表示感谢！"], ["Hi [Partner], we’re offering our long-term partners a “priority support” package, which includes 2-hour response times for urgent issues and a dedicated account manager. This package is free for you as a valued partner—would you like to activate it?", "嗨 [合作伙伴]，我们为长期合作伙伴提供 “优先支持” 套餐，包含紧急问题 2 小时响应及专属客户经理服务。作为重要合作伙伴，你可免费享受该套餐 —— 想激活这项服务吗？"], ["Dear [Name], to align our risk management strategies, we’ve prepared a list of common project risks and our suggested mitigation plans. We’d like to review this with you to add your team’s insights and ensure we’re prepared for any challenges.", "尊敬的 [姓名]，为统一风险管理策略，我们整理了常见项目风险及建议应对方案。希望与你共同审核，融入你团队的见解，确保我们为潜在挑战做好准备。"], ["Hey [First Name], we’re hosting a webinar on “Future Trends in [Industry]” next month, and we’d like to invite you to be a guest speaker to share your expertise on collaboration in the industry. Would you be interested in this opportunity?", "嗨 [名]，我们下月将举办关于 “[行业] 未来趋势” 的网络研讨会，希望邀请你作为嘉宾演讲，分享你在行业协作方面的专业见解。你对这个机会感兴趣吗？"], ["Hi [Partner], we’ve updated our project kickoff template to include a “collaboration goals” section, where we can document what we want to achieve together beyond the project scope. We’ll use this for our next project—let us know if you have additions to the template.", "嗨 [合作伙伴]，我们更新了项目启动模板，新增 “协作目标” 板块，可记录除项目范围外双方希望共同达成的目标。下个项目将使用该模板 —— 若你对模板有补充建议，欢迎告知。"], ["Dear [Name], we appreciate your team’s honesty in flagging the quality issue with the last deliverable—it helped us fix the problem quickly and avoid bigger issues later. This kind of open communication is key to our successful collaboration.", "尊敬的 [姓名]，感谢你团队坦诚指出上份交付成果的质量问题 —— 这帮助我们快速解决问题，避免后续出现更大麻烦。这种开放沟通是我们合作成功的关键。"], ["Hey [First Name], we’re launching a partner referral bonus program where you can earn additional benefits (like free service hours) for referring new clients. We’ll send you the program details this week—let us know if you have questions.", "嗨 [名]，我们推出合作伙伴推荐奖励计划，你推荐新客户可获得额外福利（如免费服务时长）。本周将向你发送计划详情 —— 若有疑问，欢迎咨询。"], ["Hi [Partner], we’ve prepared a “collaboration retrospective” document for our past project, highlighting what worked well and areas for improvement. We’d like to review this with you in our next meeting to apply the insights to future work.", "嗨 [合作伙伴]，我们为过往项目整理了 “协作回顾” 文档，总结成效显著的方面及待改进之处。希望在下次会议中与你共同审核，将经验应用于未来工作。"], ["Dear [Name], to make our collaboration more efficient, we’re assigning a single point of contact for your team—they’ll handle all communications, coordinate tasks, and address issues. We’ll introduce them to you via email today.", "尊敬的 [姓名]，为提升合作效率，我们为你团队安排了专属对接人 —— 负责所有沟通、协调任务及解决问题。今日将通过邮件为你介绍对接人。"], ["Hey [First Name], we recently attended an industry conference and met several potential clients who mentioned needing services that our teams offer together. We’d like to share their contact details with you to explore collaboration opportunities—would that be helpful?", "嗨 [名]，我们近期参加行业会议，遇到几位潜在客户，他们提到需要我们双方团队共同提供的服务。希望向你分享他们的联系方式，探索合作机会 —— 这对你有帮助吗？"], ["Hi [Partner], we’re offering our partners free access to our market research reports, which include data on customer preferences, industry growth, and competitive analysis. These reports can help inform our collaboration strategies—would you like to receive them monthly?", "嗨 [合作伙伴]，我们为合作伙伴提供免费市场研究报告，包含客户偏好、行业增长及竞争分析数据。这些报告可助力制定合作策略 —— 你希望每月接收报告吗？"], ["Dear [Name], we noticed that our team had some questions about your team’s workflow during the last project. To avoid this in the future, we’d like to schedule a short “workflow sharing” session where both teams explain their processes. Would you be interested?", "尊敬的 [姓名]，我们发现上个项目中，团队对你团队的工作流程存在一些疑问。为避免未来出现类似情况，希望安排简短的 “流程分享” 会议，双方团队介绍各自工作流程。你有兴趣吗？"], ["Hey [First Name], we’re celebrating our team’s success on the [project name] and wanted to include your team in the celebration—we’ll be sending over a small gift basket to your office next week as a token of our appreciation.", "嗨 [名]，我们正在庆祝团队在 [项目名称] 上取得的成功，希望将你团队纳入庆祝之中 —— 下周将向你办公室寄送小礼品篮，表达感谢。"], ["Hi [Partner], we’re updating our service offerings to include a new “collaboration package” tailored for long-term partners like you. It includes discounted rates, priority scheduling, and custom deliverables. We’d like to share the package details with you—would you like a demo?", "嗨 [合作伙伴]，我们正在更新服务内容，为你这样的长期合作伙伴推出定制化 “协作套餐”，包含折扣价格、优先排期及定制化交付成果。希望向你分享套餐详情 —— 需要演示介绍吗？"], ["Dear [Name], to ensure we’re both meeting our obligations under the SLA, we suggest conducting a quarterly SLA review. We’ll assess performance metrics like response times and deliverable quality, and adjust the SLA if needed. What do you think?", "尊敬的 [姓名]，为确保双方均履行服务水平协议（SLA）义务，建议每季度进行 SLA 审核。我们将评估响应时间、交付成果质量等绩效指标，必要时调整协议内容。你认为如何？"], ["Hey [First Name], we’ve received positive feedback from our end client about the way our teams collaborated on the [project name]—they specifically mentioned the clear communication and shared accountability. Great job, and thank you for being a reliable partner!", "嗨 [名]，我们从终端客户处收到关于双方团队在 [项目名称] 上协作的积极反馈 —— 他们特别提到沟通清晰且双方共同承担责任。做得好，感谢你成为可靠的合作伙伴！"], ["Hi [Partner], we’re hosting a partner workshop on “Building Resilient Collaborations” next month, where we’ll discuss how to handle challenges like resource shortages and timeline changes. We’d like to invite you and your team—would you be able to attend?", "嗨 [合作伙伴]，我们下月将举办 “构建有韧性的协作关系” 合作伙伴研讨会，探讨如何应对资源短缺、时间线变更等挑战。诚邀你和团队参加 —— 你能出席吗？"], ["Dear [Name], we’ve developed a shared calendar for our collaboration, where we can mark key deadlines, meeting times, and team availability. This will help us avoid scheduling conflicts and stay aligned. We’ve shared the calendar with you—let us know if you need help adding events.", "尊敬的 [姓名]，我们为合作创建了共享日历，可标注关键截止日期、会议时间及团队可用时间。这将帮助我们避免日程冲突，保持步调一致。已向你分享日历 —— 若添加事件需要帮助，请告知。"], ["Hey [First Name], we’re offering our partners a “collaboration audit” service, where we review our current workflow, identify inefficiencies, and suggest improvements. This service is free for long-term partners like you—would you like to schedule one?", "嗨 [名]，我们为合作伙伴提供 “协作审计” 服务，审核当前工作流程、找出低效环节并提出改进建议。作为长期合作伙伴，你可免费享受该服务 —— 想安排审计吗？"], ["Hi [Partner], we’ve prepared a case study about our joint project with [client name], highlighting how our collaboration helped them achieve their goals. We’d like to share this case study with you to use in your marketing materials—would that be useful?", "嗨 [合作伙伴]，我们整理了与 [客户名称] 合作项目的案例研究，突出展示双方协作如何帮助客户达成目标。希望向你分享该案例研究，供你用于营销材料 —— 这对你有帮助吗？"], ["Dear [Name], we noticed that our team needed additional clarification on your requirements during the last project. To improve this, we suggest creating a “requirements checklist” at the start of each project to document expectations clearly. What do you think?", "尊敬的 [姓名]，我们发现上个项目中，团队需要多次确认你的需求。为改善这一点，建议在每个项目开始时创建 “需求清单”，清晰记录预期内容。你认为如何？"], ["Hey [First Name], we’re celebrating our 3rd year of collaboration with you, and we wanted to send a personalized thank-you note to your team. We’ll mention specific contributions that made our projects successful—would you be okay with us sending this to your team email?", "嗨 [名]，我们正庆祝与你合作 3 周年，希望向你团队发送个性化感谢信。信中会提及你团队对项目成功的具体贡献 —— 我们向你团队邮箱发送这封信可以吗？"], ["Hi [Partner], we’re updating our partner portal to include a “feedback hub” where you can submit suggestions, report issues, and track the status of your feedback. The hub will launch next week, and we’ll send you the login details—we hope it makes sharing feedback easier.", "嗨 [合作伙伴]，我们正在更新合作伙伴门户，新增 “反馈中心”，你可提交建议、报告问题并跟踪反馈处理进度。中心将于下周上线，届时会向你发送登录信息 —— 希望这能让反馈更便捷。"], ["Dear [Name], to support our collaboration during peak periods, we’re increasing our team capacity by adding 2 dedicated resources for your projects. They’ll be available starting next month and will be introduced to you in our next meeting.", "尊敬的 [姓名]，为在业务高峰期支持合作，我们为你项目增加 2 名专属资源，扩充团队容量。他们将于下月到岗，将在下次会议中为你介绍。"], ["Hey [First Name], we’re hosting a virtual networking event for partners in your region next month—you’ll get to connect with other local partners and share insights on regional market trends. Would you like to reserve a spot?", "嗨 [名]，我们下月将为你所在地区的合作伙伴举办线上交流活动 —— 你可与其他本地合作伙伴建立联系，分享区域市场趋势见解。想预留参与名额吗？"], ["Hi [Partner], we’ve prepared a “collaboration toolkit” with templates for meeting agendas, project plans, and feedback forms. This toolkit is designed to standardize our workflow and save time—we’ll send you a copy today for your team to use.", "嗨 [合作伙伴]，我们整理了 “协作工具包”，包含会议议程、项目计划、反馈表等模板。工具包旨在标准化工作流程、节省时间 —— 今日将发送给你，供你团队使用。"], ["Dear [Name], we appreciate your flexibility in adjusting the project timeline when we faced unexpected delays last month. This kind of teamwork is what makes our collaboration strong, and we wanted to express our gratitude.", "尊敬的 [姓名]，感谢你在上月我们遇到意外延误时，灵活调整项目时间表。这种团队协作精神让我们的合作更加稳固，特此表达感谢。"], ["Hey [First Name], we’re launching a partner loyalty program where you can earn points for each project we collaborate on. These points can be redeemed for free service hours, discounts, or exclusive events. We’ll send you the program details this week—let us know if you have questions.", "嗨 [名]，我们推出合作伙伴忠诚度计划，每合作一个项目你可累积积分。积分可兑换免费服务时长、折扣或专属活动参与资格。本周将向你发送计划详情 —— 若有疑问，欢迎咨询。"], ["Hi [Partner], we’ve reviewed our past projects and noticed that our joint proposals have a higher success rate when we include both teams’ expertise. For future proposals, we suggest collaborating on the content from the start—would you agree?", "嗨 [合作伙伴]，我们回顾过往项目，发现当提案融入双方团队专业知识时，联合提案的成功率更高。对于未来提案，建议从一开始就共同协作撰写内容 —— 你同意吗？"], ["Dear [Name], to improve transparency, we’ll start sharing a weekly “risk report” that outlines potential challenges, their impact, and our mitigation plans. This will help you stay informed and prepare your team accordingly. The first report will be sent on Monday.", "尊敬的 [姓名]，为提升透明度，我们将开始每周分享 “风险报告”，列明潜在挑战、影响及应对方案。这将帮助你及时了解情况，相应调整团队准备工作。首份报告将于周一发送。"], ["Hey [First Name], we’re hosting a training session for our team on “Working Effectively with [Your Industry] Partners,” and we’d like to invite a member of your team to share insights on your industry’s workflow and priorities. Would you be willing to send someone?", "嗨 [名]，我们为团队举办 “与 [你所在行业] 合作伙伴高效协作” 培训课程，希望邀请你团队成员分享行业工作流程及优先事项见解。你愿意安排人员参加吗？"], ["Hi [Partner], we’ve prepared a “success metrics” document for our collaboration, defining key performance indicators (KPIs) like project on-time delivery rate and client satisfaction score. We’d like to review this with you to ensure the KPIs align with both our goals.", "嗨 [合作伙伴]，我们为合作整理了 “成功指标” 文档，定义项目按时交付率、客户满意度等关键绩效指标（KPI）。希望与你共同审核，确保指标与双方目标一致。"], ["Dear [Name], we noticed that your team provided valuable input during the client feedback session last week—it helped us refine the deliverable and meet the client’s expectations. We wanted to thank you for your contribution.", "尊敬的 [姓名]，我们注意到你团队在上周客户反馈会议中提供了宝贵意见 —— 这帮助我们优化交付成果，满足客户预期。特此感谢你的贡献。"], ["Hey [First Name], we’re celebrating “Collaboration Day” next week, and we’ll be recognizing our top partners with a small award. We’re pleased to let you know that your team has been selected—we’ll send the award to your office next week.", "嗨 [名]，我们下周将庆祝 “协作日”，并为优秀合作伙伴颁发小奖项。很高兴告知你，你团队已入选 —— 下周将把奖项寄送至你办公室。"], ["Hi [Partner], we’re updating our service contract to include a “collaboration improvement clause,” where we commit to reviewing our workflow annually and making adjustments based on feedback. We’d like to share the draft clause with you to get your input before finalizing it.", "嗨 [合作伙伴]，我们正在更新服务合同，新增 “协作改进条款”，承诺每年审核工作流程并根据反馈调整。希望在定稿前向你分享条款草案，听取你的意见。"], ["Dear [Name], to make our collaboration more inclusive, we suggest invit  invite you and your team—save the date for [date], and we’ll send more details soon.", "嗨 [合作伙伴]，我们下季度将在办公室举办合作伙伴感恩活动，活动包含行业演讲、交流机会及联合项目展示。想邀请你和团队参加 —— 请预留 [日期]，我们将尽快发送更多详情。"], ["Dear [Name], to improve the speed of our collaboration, we’ve implemented a “quick response” policy for urgent requests—our team will respond within 2 hours during business hours. We ask that your team also adopts a similar policy if possible, to ensure timely communication.", "尊敬的 [姓名]，为提升合作效率，我们针对紧急请求实施 “快速响应” 政策 —— 工作时间内团队将在 2 小时内回复。若可能，也希望你团队采用类似政策，确保沟通及时。"], ["Hey [First Name], we’ve prepared a “collaboration best practices” guide based on our past projects. The guide includes tips on communication, task management, and problem-solving—we’ll send you a copy today, and we hope it helps streamline our future work.", "嗨 [名]，我们基于过往项目整理了 “协作最佳实践” 指南，包含沟通、任务管理和问题解决等方面的技巧。今日将发送给你，希望能帮助简化未来的工作。"], ["Hi [Partner], we’re offering our partners a free consultation with our industry experts to discuss strategies for growing your business through collaboration. The consultation is 1 hour long, and you can focus on topics like client acquisition or workflow optimization—would you like to schedule one?", "嗨 [合作伙伴]，我们为你提供与行业专家的免费咨询服务，探讨如何通过协作拓展业务。咨询时长 1 小时，你可聚焦客户获取、工作流程优化等话题 —— 想安排咨询吗？"], ["Dear [Name], we appreciate your continued trust and support in our collaboration. To show our gratitude, we’re offering you a 20% discount on your next project—this discount is exclusive to you and will be applied automatically when you book.", "尊敬的 [姓名]，感谢你在合作中始终给予的信任与支持。为表感谢，你的下个项目可享受 20% 折扣 —— 该折扣为你专属，预订时将自动生效。"], ["Hey [First Name], we’re hosting a virtual workshop on “Building Strong Partner Relationships” next month, where we’ll share actionable strategies for long-term collaboration success. We’d like to invite you to attend—would you be available?", "嗨 [名]，我们下月将举办 “构建稳固合作伙伴关系” 线上研讨会，分享实现长期协作成功的实用策略。想邀请你参加 —— 你有时间吗？"], ["Hi [Partner], we’ve updated our partner agreement to include more flexible terms for project extensions and scope changes. We believe this will make our collaboration more adaptable to unexpected challenges—we’ll send you the updated agreement for review today.", "嗨 [合作伙伴]，我们更新了合作伙伴协议，为项目延期和范围变更增加了更灵活的条款。相信这将让我们的合作更能应对突发挑战 —— 今日将向你发送更新后的协议供审核。"], ["Dear [Name], to ensure our collaboration remains aligned with your business goals, we’d like to schedule a quarterly business review. We’ll discuss your team’s priorities, our performance, and how we can adjust our support to meet your needs. Would next month work for the first review?", "尊敬的 [姓名]，为确保合作与你公司的业务目标保持一致，希望安排季度业务回顾会议。我们将讨论你团队的优先事项、我们的表现及如何调整支持以满足你的需求。下个月进行第一次回顾会议可以吗？"], ["Hey [First Name], we’re launching a “Partner Spotlight” series on our website, featuring stories of our top 合作伙伴. We’d like to feature your company in the series, including an interview with your team and a showcase of our joint projects. Would you be interested?", "嗨 [名]，我们在官网推出 “合作伙伴聚焦” 系列，展示优秀合作伙伴的故事。希望在系列中介绍你公司，内容包括对你团队的采访及联合项目展示。你有兴趣吗？"], ["Hi [Partner], as we wrap up this year’s collaboration, we wanted to share a “year-in-review” document highlighting our key achievements, challenges overcome, and growth together. We’re proud of what we’ve accomplished and look forward to even more successful collaboration next year.", "嗨 [合作伙伴]，在今年合作即将结束之际，我们想分享 “年度回顾” 文档，聚焦我们的核心成果、克服的挑战及共同的成长。我们为取得的成就感到自豪，也期待明年能有更成功的合作。"]];window.__KEY__="114商务邮件700";window.__TITLE__="11.4商务邮件700";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);

  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;

function favToggle(){

function check(){

  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
