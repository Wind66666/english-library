意到你的团队在报告手动录入数据上浪费时间 —— 我们的数据集成工具自动从多个来源提取数据，无需手动输入。"], ["Hey [Name], we haven’t seen you in a while! We missed you and wanted to share a 20% discount on your next purchase as a thank-you for being a loyal customer.", "嗨 [姓名]，好久没见到你了！我们很想念你，为感谢你的忠实支持，想给你下次购买提供 20% 的折扣。"], ["Dear [Customer], we noticed it’s been 3 months since your last order - we’ve added new products in your favorite category (electronics) and want to offer you a free gift with your next order.", "尊敬的 [客户]，我们注意到你已有 3 个月未下单 —— 我们在你喜爱的电子品类中新增了产品，想为你的下次订单赠送一份免费礼品。"], ["Hi [First Name], as a long-time customer, you’re eligible for our exclusive VIP sale this weekend - access it with the code VIP2024 and save up to 40% on selected items.", "嗨 [名]，作为老客户，你有资格参加本周末的专属 VIP 促销 —— 使用优惠码 VIP2024 即可参与，部分商品最高可省 40%。"], ["Dear [Customer], we’ve updated our [service] based on customer feedback, and we’d love for you to try the new features for free for 1 month - no commitment required.", "尊敬的 [客户]，我们根据客户反馈升级了 [服务]，希望邀请你免费试用 1 个月新功能 —— 无需承担任何义务。"], ["Hey [Name], we remember you loved our organic skincare line last year - we just launched a new serum, and we’re offering you a 15% discount to try it first.", "嗨 [姓名]，我们记得你去年很喜欢我们的有机护肤系列 —— 我们刚推出了一款新精华，想给你 15% 的折扣让你优先试用。"], ["Dear [First Name], it’s been a while since you used our [app/software] - we’ve fixed the bugs you mentioned last time and added a new feature you might love (task automation).", "尊敬的 [名]，你已有段时间未使用我们的 [应用 / 软件]—— 我们修复了你上次提到的漏洞，并新增了一个你可能喜欢的任务自动化功能。"], ["Hi [Customer], to celebrate our 5th anniversary, we’re giving back to loyal customers like you - get a free upgrade to our premium plan when you renew your subscription this month.", "嗨 [客户]，为庆祝我们成立 5 周年，我们想回馈像你这样的老客户 —— 本月续订会员即可免费升级至高级套餐。"], ["Dear [Name], we noticed you haven’t used your store credit ($50) yet - it expires in 2 weeks, so we wanted to remind you to use it on anything in our store.", "尊敬的 [姓名]，我们注意到你还有 50 美元的店铺信用额未使用 —— 它将在 2 周后过期，特此提醒你可在店内任意消费时使用。"], ["Hey [First Name], we’ve been working on a new service tailored to customers who purchased [Product X] (which you bought last year) - would you like a 30-minute free demo to see how it helps?", "嗨 [名]，我们针对购买过 [产品 X]（你去年购买过）的客户定制了一项新服务 —— 你愿意参加 30 分钟的免费演示，了解它如何为你提供帮助吗？"], ["Dear [Customer], as a thank-you for being with us for over 2 years, we’re sending you a personalized gift voucher worth $30 - use it online or in-store anytime in the next 3 months.", "尊敬的 [客户]，感谢你陪伴我们超过 2 年，我们为你送上一张 30 美元的个性化礼品券 —— 未来 3 个月内可在网上或实体店任意使用。"], ["Hi [Name], we missed your feedback! We’ve made changes to our [product] and want to send you a free sample to try - just let us know your current address.", "嗨 [姓名]，我们很想听到你的反馈！我们对 [产品] 做了改进，想给你寄一份免费样品试用 —— 只需告知我们你当前的地址即可。"], ["Dear [First Name], it’s been 4 months since your last visit to our restaurant - we’ve updated our menu with new dishes inspired by your past orders (spicy seafood) and want to offer you a free appetizer on your next visit.", "尊敬的 [名]，你已有 4 个月未光临我们的餐厅 —— 我们根据你过往的点餐偏好（辛辣海鲜）更新了菜单，新增了几道菜品，想在你下次到店时赠送一份免费开胃菜。"], ["Hey [Customer], our team just released a new version of [software] that solves the storage issue you complained about last time - we’d love for you to upgrade for free and share your thoughts.", "嗨 [客户]，我们团队刚发布了 [软件] 的新版本，解决了你上次反馈的存储问题 —— 希望你免费升级，并分享你的使用感受。"], ["Dear [Name], we’re hosting an exclusive event for old customers next week - enjoy free drinks, networking with other customers, and a chance to win our latest product. Would you like to join?", "尊敬的 [姓名]，我们下周将为老客户举办一场专属活动 —— 可享用免费饮品、与其他客户交流，还有机会赢取我们的最新产品。你愿意参加吗？"], ["Hi [First Name], you’re one of our earliest customers, so we want to give you early access to our Black Friday sale - shop 2 days before everyone else and get an extra 10% off.", "嗨 [名]，你是我们最早的一批客户之一，所以我们想让你提前参与黑色星期五促销 —— 比其他人早 2 天购物，还可额外享受 10% 折扣。"], ["Dear [Customer], we noticed your subscription expired last month - if you reactivate it now, we’ll extend your membership by 1 month for free.", "尊敬的 [客户]，我们注意到你的会员上个月已到期 —— 如果现在重新激活，我们将为你免费延长 1 个月会员期限。"], ["Hey [Name], we remember you had questions about [service] last year - we’ve created a detailed guide to answer all those questions, and we’re offering you a 25% discount if you try the service again.", "嗨 [姓名]，我们记得你去年对 [服务] 有疑问 —— 我们已制作了一份详细指南解答所有疑问，如果你再次试用该服务，还可享受 25% 的折扣。"], ["Dear [First Name], our [product] now comes with a 2-year warranty (up from 1 year) - if you purchase a new one to replace your old [product], we’ll give you a 30% discount.", "尊敬的 [名]，我们的 [产品] 现在提供 2 年保修（原为 1 年）—— 如果你购买新的 [产品] 替换旧款，可享受 30% 的折扣。"], ["Hi [Customer], we’re giving away a free [accessory] (that pairs with your [product] from 2023) to customers who place an order this week - don’t miss out!", "嗨 [客户]，本周下单的客户可免费获赠一款 [配件]（可与你 2023 年购买的 [产品] 搭配使用）—— 别错过哦！"], ["Dear [Name], it’s been a while since you used our loyalty points - you have 200 points that can be redeemed for a free [product] or a $20 discount. Redeem them before they expire next month!", "尊敬的 [姓名]，你已有段时间未使用会员积分了 —— 你有 200 积分可兑换一份免费 [产品] 或 20 美元折扣。请在下个月积分过期前兑换！"], ["Hey [First Name], we’ve partnered with [brand] to offer exclusive deals to our old customers - get 25% off on [brand’s product] when you use our referral code OLD25.", "嗨 [名]，我们与 [品牌] 合作，为老客户提供专属优惠 —— 使用推荐码 OLD25 购买 [品牌产品] 可享受 25% 折扣。"], ["Dear [Customer], we updated our return policy to offer free returns for 60 days (up from 30) - if you’ve been hesitant to buy again, now’s the time to try with no risk.", "尊敬的 [客户]，我们更新了退货政策，将免费退货期限从 30 天延长至 60 天 —— 如果你之前犹豫是否再次购买，现在可以无风险尝试。"], ["Hi [Name], we missed seeing your orders! As a thank-you for your past support, we’re offering you a “buy one, get one 50% off” deal on your next two purchases.", "嗨 [姓名]，好久没看到你的订单了！为感谢你过往的支持，你的下两次购买可享受 “买一送一，第二件 5 折” 的优惠。"], ["Dear [First Name], our team created a personalized checklist of products you might like, based on your past orders - check it out and get 15% off on any item from the list.", "尊敬的 [名]，我们团队根据你过往的订单，为你定制了一份 “可能喜欢的产品” 清单 —— 查看清单并购买任意一款产品，即可享受 15% 折扣。"], ["Hey [Customer], we just launched a customer referral program - if you refer a friend, you’ll get a $20 store credit, and your friend gets $10 off their first order. It’s a win-win!", "嗨 [客户]，我们刚推出客户推荐计划 —— 如果你推荐一位朋友，你将获得 20 美元店铺信用额，你的朋友首次下单可减 10 美元。这是双赢的好事！"], ["Dear [Name], it’s been 5 months since your last service appointment - we’re offering a free maintenance check for your [equipment] when you book a new appointment this month.", "尊敬的 [姓名]，你已有 5 个月未预约服务了 —— 本月预约新服务，即可为你的 [设备] 享受免费维护检查。"], ["Hi [First Name], we noticed you loved our [product line] but haven’t tried our new [variant] (e.g., lavender-scented) - we’d like to send you a small sample for free, no strings attached.", "（嗨 [名]，我们注意到你喜欢我们的 [产品系列]，但尚未尝试新推出的 [款式]"], ["Dear [Customer], to thank you for being a loyal customer, we’re giving you a free spot in our upcoming online workshop about [topic you’re interested in, e.g., “home organization”].", "尊敬的 [客户]，为感谢你的忠实支持，我们为你预留了即将举办的 [你感兴趣的主题，如 “家庭收纳”] 在线研讨会的免费名额。"], ["Hey [Name], our [app] now has a new feature that lets you [solve a problem you had, e.g., “track your order in real time”] - download the latest version and let us know what you think.", "嗨 [姓名]，我们的 [应用] 新增了一项功能，可帮你 [解决你曾遇到的问题，如 “实时跟踪订单”]—— 下载最新版本，告诉我们你的感受。"], ["Dear [First Name], we’re having a “customer appreciation week” - old customers like you get an extra 20% off on top of our regular sales. Shop now before the week ends!", "尊敬的 [名]，我们正在举办 “客户感恩周”—— 像你这样的老客户在常规促销基础上可额外享受 20% 折扣。趁活动结束前赶紧购物吧！"], ["Hi [Customer], you have an unused gift card worth $40 in your account - it’s valid for another 3 months, so use it to buy something you’ve had your eye on!", "嗨 [客户]，你的账户中有一张 40 美元的未使用礼品卡 —— 有效期还有 3 个月，赶紧用它购买你心仪已久的商品吧！"], ["Dear [Name], we’ve improved our [service] to be faster and more affordable - if you try it again this month, we’ll waive the setup fee (a $50 value).", "尊敬的 [姓名]，我们已改进 [服务]，使其更快、更实惠 —— 如果本月再次试用，我们将免除设置费（价值 50 美元）。"], ["Hey [First Name], we remember you 小时内，所有 [你曾购买过的品类，如 “厨房电器”] 可享 30% 折扣。"], ["Hey [Name], we just received feedback from customers like you and updated our [product] to be more durable - we’d love for you to try the new version with a 20% discount.", "嗨 [姓名]，我们刚收集了像你这样的客户的反馈，并改进了 [产品] 的耐用性 —— 希望你以 20% 的折扣试用新款。"], ["Dear [First Name], your birthday is coming up (we remembered!), and as a gift, we’re giving you a free [product] and a 25% discount on your birthday month order.", "尊敬的 [名]，你的生日快到了（我们记得哦！），作为礼物，我们将为你送上一份免费 [产品]，生日当月下单还可享受 25% 折扣。"], ["Hi [Customer], we’ve partnered with a shipping company to offer free 2-day shipping for all old customers - no minimum order required. Shop now to enjoy fast delivery!", "嗨 [客户]，我们与一家物流公司合作，为所有老客户提供免费次日达配送服务 —— 无最低订单金额要求。现在购物即可享受快速配送！"], ["Dear [Name], it’s been 6 months since your last purchase - we’ve restocked your favorite [product, e.g., “organic tea”] and added new flavors. Use code WELCOMEBACK for 18% off your next order.", "尊敬的 [姓名]，你已有 6 个月未下单 —— 我们已补货你喜爱的 [产品，如 “有机茶”]，还新增了多种口味。下次下单使用优惠码 WELCOMEBACK 可享 18% 折扣。"], ["Hey [First Name], we noticed you haven’t logged into our [platform] lately - we’ve added a “personalized dashboard” that shows your past orders and recommended products. Log in today to check it out!", "嗨 [名]，我们注意到你近期未登录我们的 [平台]—— 我们新增了 “个性化仪表盘”，可显示你的过往订单和推荐产品。今天登录即可查看！"], ["Dear [Customer], as a long-term customer, you can now join our “Customer Advisory Board” - share your feedback to shape our future products, and get exclusive rewards like free samples and early access.", "尊敬的 [客户]，作为长期客户，你现在可加入我们的 “客户顾问委员会”—— 分享你的反馈以影响我们未来的产品方向，还能获得免费样品、优先体验等专属奖励。"], ["Hi [Name], we’re giving old customers a chance to customize their [product, e.g., “phone case”] for free - choose colors, patterns, and text, then use code CUSTOMIZE at checkout to waive the customization fee.", "嗨 [姓名]，我们为老客户提供免费定制 [产品，如 “手机壳”] 的机会 —— 选择颜色、图案和文字，结账时使用优惠码 CUSTOMIZE 即可免除定制费。"], ["Dear [First Name], your [membership tier] benefits just got better - you now get 10% cashback on all orders (up from 5%) and a free annual gift. Log in to see your updated benefits!", "尊敬的 [名]，你的 [会员等级] 权益已升级 —— 现在所有订单可享 10% 返现（原 5%），还能获得免费年度礼品。登录即可查看升级后的权益！"], ["Hey [Customer], we just launched a “nostalgia collection” with products similar to the [product you bought in 2022] - get 22% off if you purchase any item from the collection this month.", "嗨 [客户]，我们刚推出 “怀旧系列”，包含与你 2022 年购买的 [产品] 相似的商品 —— 本月购买该系列任意产品可享 22% 折扣。"], ["Dear [Name], we noticed you had a minor issue with your last order - we want to make it right by sending you a free replacement and a $25 store credit for your next purchase.", "尊敬的 [姓名]，我们注意到你上次订单存在小问题 —— 我们将为你免费补发商品，并赠送 25 美元店铺信用额用于下次购买，以此弥补你的不便。"], ["Hi [First Name], we’re hosting a “virtual coffee chat” for old customers next week - chat with our team about new updates, ask questions, and win a $50 gift card. Would you like to join?", "嗨 [名]，我们下周将为老客户举办 “线上咖啡交流会”—— 与我们的团队聊聊新动态、提问，还有机会赢取 50 美元礼品卡。你愿意参加吗？"], ["Dear [Customer], our [service] now includes a free add-on (e.g., “monthly progress reports”) that we think you’ll find useful - reactivate your subscription this week to get the add-on for life.", "尊敬的 [客户]，我们的 [服务] 现在包含一项免费附加服务（如 “月度进度报告”），我们认为你会用得上 —— 本周重新激活会员，即可终身享受该附加服务。"], ["Hey [Name], we remember you loved our eco-friendly products - we just released a new line of 100% recycled [product, e.g., “tote bags”], and we’re offering you a free one with any $30 purchase.", "嗨 [姓名]，我们记得你喜欢我们的环保产品 —— 我们刚推出 100% 再生材料制成的新款 [产品，如 “托特包”]，消费满 30 美元即可免费获赠一个。"], ["Dear [First Name], it’s been a while since you used our loyalty program - we’ve added new redemption options, like free experiences (e.g., “cooking classes”) and exclusive discounts. Check your points balance today!", "尊敬的 [名]，你已有段时间未使用我们的会员计划 —— 我们新增了兑换选项，如免费体验（如 “烹饪课”）和专属折扣。今天查看你的积分余额吧！"], ["Hi [Customer], we’re offering old customers a “price match guarantee” for the next 30 days - if you find a lower price for our [product] elsewhere, we’ll match it and give you an extra 5% off.", "嗨 [客户]，未来 30 天我们为老客户提供 “价格匹配保障”—— 如果你在其他地方发现我们的 [产品] 有更低价格，我们不仅会匹配该价格，还会额外再减 5%。"], ["Dear [Name], we’ve created a “customer success story” series, and we’d love to feature you - share your experience with our [product/service], and we’ll send you a $100 gift card as a thank-you.", "尊敬的 [姓名]，我们推出了 “客户成功故事” 系列，希望能采访报道你 —— 分享你使用我们 [产品 / 服务] 的经历，我们将赠送 100 美元礼品卡作为感谢。"], ["Hey [First Name], our [app] now works offline - perfect for when you’re traveling! Download the latest version, and use code OFFLINE for a $10 credit to your account.", "嗨 [名]，我们的 [应用] 现在支持离线使用 —— 非常适合旅行时！下载最新版本，使用优惠码 OFFLINE 即可获得 10 美元账户信用额。"], ["Dear [Customer], we’re having a “friends and family” sale, but old customers like you get early access today - share the sale with your loved ones, and both of you get an extra 15% off.", "尊敬的 [客户]，我们正在举办 “亲友促销”，但像你这样的老客户今天即可提前参与 —— 与亲友分享此次促销，你们双方都能额外享受 15% 折扣。"], ["Hi [Name], we noticed you haven’t tried our [complementary product, e.g., “laptop stand”] that pairs with your [laptop you bought last year] - get 28% off if you buy them together this week.", "嗨 [姓名]，我们注意到你尚未尝试与你去年购买的 [笔记本电脑] 搭配的 [配套产品，如 “笔记本支架”]—— 本周一起购买可享 28% 折扣。"], ["Dear [First Name], your feedback from 6 months ago helped us improve our [product] - we’d love for you to try the updated version and let us know if it meets your expectations. We’ll send it to you for 50% off!", "尊敬的 [名]，你 6 个月前的反馈帮助我们改进了 [产品]—— 希望你试用升级版，告诉我们是否符合你的预期。我们将为你提供 50% 的折扣购买！"], ["Hey [Customer], we’re giving away a “year of free [product, e.g., “coffee”]” to 10 old customers - simply reply to this email with why you love our brand, and you’ll be entered into the giveaway.", "嗨 [客户]，我们将向 10 位老客户赠送 “全年免费 [产品，如 “咖啡”]”—— 只需回复此邮件说明你喜欢我们品牌的原因，即可参与抽奖。"], ["Dear [Name], we’ve extended our return window for old customers to 90 days - if you’re not satisfied with your next purchase, you can return it for a full refund with no hassle.", "尊敬的 [姓名]，我们已将老客户的退货期限延长至 90 天 —— 如果你对下次购买的商品不满意，可轻松退货并获得全额退款。"], ["Hi [First Name], we’re launching a new [service, e.g., “personal shopping”] for busy customers like you - get a dedicated shopper to pick products based on your preferences, and your first session is free.", "嗨 [名]，我们为像你这样忙碌的客户推出了新的 [服务，如 “私人购物”]—— 专属购物顾问会根据你的偏好挑选商品，你的首次服务免费。"], ["Dear [Customer], we noticed you have a saved item in your cart (the [product]) - it’s going out of stock soon, and we’re offering you a 12% discount to complete your purchase today.", "尊敬的 [客户]，我们注意到你的购物车中有一件已收藏的 [产品]—— 该商品即将售罄，今天完成购买可享 12% 折扣。"], ["Hey [Name], we’re celebrating “Customer Loyalty Day” this Friday - old customers get double points on all orders and a free gift with every purchase. Mark your calendar!", "嗨 [姓名]，本周五我们将庆祝 “客户忠诚度日”—— 老客户所有订单可获双倍积分，每笔订单还能获赠免费礼品。记得标记日历哦！"], ["Dear [First Name], our [product] now has a warranty extension option - for old customers, we’re offering a 3-year warranty for the price of 1. Protect your purchase today!", "尊敬的 [名]，我们的 [产品] 现在提供保修延长服务 —— 针对老客户，我们以 1 年的价格提供 3 年保修。今天就为你的商品提供保障吧！"], ["Hi [Customer], we’ve added a “quick reorder” button to your account - reorder your favorite [product, e.g., “shampoo”] in 1 click, and get free shipping on your first quick reorder.", "嗨 [客户]，我们在你的账户中添加了 “快速复购” 按钮 —— 一键复购你喜爱的 [产品，如 “洗发水”]，首次快速复购可享免费配送。"], ["Dear [Name], we’re partnering with [fitness brand] to offer old customers a free 1-month membership - perfect if you loved our [health product, e.g., “protein powder”]. Reply to claim yours!", "尊敬的 [姓名]，我们与 [健身品牌] 合作，为老客户提供免费 1 个月会员资格 —— 如果你喜欢我们的 [健康产品，如 “蛋白粉”]，这绝对适合你。回复即可领取！"], ["Hey [First Name], we noticed you haven’t used our [discount coupon] from last month - we’ve extended its validity for another 2 weeks, so you can use it on your next order.", "嗨 [名]，我们注意到你尚未使用上个月的 [折扣券]—— 我们已将其有效期延长 2 周，你可在下次下单时使用。"], ["Dear [Customer], we’ve created a “VIP support line” just for old customers - call [phone number] anytime, and you’ll get priority service with no wait time.", "尊敬的 [客户]，我们为老客户设立了 “VIP 支持热线”—— 拨打 [电话号码]，随时可享受优先服务，无需等待。"], ["Hi [Name], we’re releasing a limited-edition [product] next week, and old customers get first dibs - pre-order today to secure yours, and get a free matching accessory.", "嗨 [姓名]，我们下周将推出限量版 [产品]，老客户可优先购买 —— 今天预购即可锁定商品，还能获赠免费配套配件。"], ["Dear [First Name], your [product] might need a replacement part (based on your purchase date) - we’re offering old customers a free replacement part and free installation. Just let us know!", "尊敬的 [名]，你的 [产品] 可能需要更换零件（根据购买日期判断）—— 我们为老客户提供免费零件更换和安装服务。只需告知我们即可！"], ["Hey [Customer], we’re giving old customers a “refer-a-friend bonus boost” - refer 2 friends, and you’ll get a $50 gift card instead of the usual $20. Start referring today!", "嗨 [客户]，我们为老客户提升了 “推荐好友奖励”—— 推荐 2 位好友，你将获得 50 美元礼品卡（常规为 20 美元）。现在就开始推荐吧！"], ["Dear [Name], we’ve updated our [app] to include a “wishlist sharing” feature - share your wishlist with friends and family, and if they buy you an item, you get 10% cashback.", "尊敬的 [姓名]，我们已更新 [应用]，新增 “愿望清单分享” 功能 —— 与亲友分享你的愿望清单，若他们为你购买清单中的商品，你可获得 10% 返现。"], ["Hi [First Name], we’re having a “clearance sale” for old customers only - get up to 60% off on overstocked items, including some of your past favorite products. Shop now before it’s gone!", "嗨 [名]，我们正在举办仅限老客户参与的 “清仓促销”—— 库存过剩商品最高可享 6 折优惠，其中包括一些你过往喜爱的产品。趁库存还在，赶紧购物吧！"], ["Dear [Customer], we’re offering old customers a free “product maintenance kit” for your [appliance you bought] - it includes cleaning supplies and a user guide to keep your product in top shape.", "尊敬的 [客户]，我们为老客户提供免费的 [你购买的家电]“产品维护套件”—— 包含清洁用品和使用指南，助你保持产品最佳状态。"], ["Hey [Name], we just sent you a personalized catalog with products we think you’ll love - use the QR code inside to get 17% off your next order.", "嗨 [姓名]，我们刚给你寄了一本个性化商品目录，其中包含我们认为你会喜欢的产品 —— 使用目录内的二维码，下次下单可享 17% 折扣。"], ["Dear [First Name], we’re hosting an in-store “old customer appreciation day” this weekend - enjoy free snacks, exclusive discounts, and a chance to meet our team. We hope to see you there!", "尊敬的 [名]，本周末我们将在实体店举办 “老客户感恩日”—— 享用免费零食、专属折扣，还有机会与我们的团队见面。期待你的到来！"], ["Hi [Customer], we’ve added a “subscription service” for your favorite [product, e.g., “dog food”] - sign up today, and get 15% off every delivery plus free samples.", "嗨 [客户]，我们为你喜爱的 [产品，如 “狗粮”] 推出了 “订阅服务”—— 今天注册，每次配送可享 15% 折扣，还能获得免费样品。"], ["Dear [Name], we noticed you haven’t left a review for your [product you bought] - leave a review this week, and we’ll give you a $15 credit to your account.", "尊敬的 [姓名]，我们注意到你尚未为购买的 [产品] 留下评价 —— 本周留下评价，即可获得 15 美元账户信用额。"], ["Hey [First Name], we’re giving old customers a chance to test our new [product] before it launches - be one of the first to try it, and share your feedback to help us finalize it.", "嗨 [名]，我们为老客户提供在新品上市前试用新 [产品] 的机会 —— 成为首批试用者，分享你的反馈以帮助我们完善产品。"], ["Dear [Customer], our [service] now has a mobile app - download it today, and old customers get a free 1-month premium subscription to try all features.", "尊敬的 [客户]，我们的 [服务] 现已推出移动应用 —— 今天下载，老客户可获得免费 1 个月高级会员资格，试用所有功能。"], ["Hi [Name], we’re having a “buy more, save more” deal for old customers - buy 2 items, get 20% off; buy 3 items, get 30% off. Stock up today!", "嗨 [姓名]，我们为老客户推出 “多买多省” 优惠 —— 购买 2 件商品享 20% 折扣，购买 3 件商品享 30% 折扣。今天就囤货吧！"], ["Dear [First Name], we’ve created a “customer community” for old customers - join to connect with other users, share tips, and get exclusive updates from our team.", "尊敬的 [名]，我们为老客户创建了 “客户社区”—— 加入即可与其他用户交流、分享技巧，还能获取我们团队的专属动态。"], ["Hey [Customer], we’re offering old customers a free “upgrade” for their [product, e.g., “software”] - from the basic version to the premium version, free for 6 months.", "嗨 [客户]，我们为老客户提供免费的 [产品，如 “软件”]“升级服务”—— 从基础版升级到高级版，免费使用 6 个月。"], ["Dear [Name], we noticed you have a loyalty points expiration coming up (1 month left) - redeem them now for a free [product] or use them to get a discount on your next order.", "尊敬的 [姓名]，我们注意到你的会员积分即将过期（还剩 1 个月）—— 现在即可兑换免费 [产品]，或用于下次下单抵扣。"], ["Hi [First Name], we’re partnering with [restaurant chain] to offer old customers a free meal voucher - spend $50 with us, and get a $20 voucher to use at [restaurant].", "嗨 [名]，我们与 [连锁餐厅] 合作，为老客户提供免费餐券 —— 在我们这里消费满 50 美元，即可获得一张 20 美元的 [餐厅] 餐券。"], ["Dear [Customer], we’ve updated our [product] packaging to be more eco-friendly - as a thank-you for your past support, we’ll send you a free reusable tote bag with your next order.", "尊敬的 [客户]，我们已将 [产品] 包装升级为更环保的材质 —— 为感谢你过往的支持，下次下单时我们将免费赠送你一个可重复使用的托特包。"], ["Hey [Name], we noticed you loved our seasonal [product, e.g., “winter blanket”] last year - we just restocked the new seasonal version, and you get 23% off if you order this week.", "嗨 [姓名]，我们注意到你去年很喜欢我们的季节性 [产品，如 “冬季毛毯”]—— 我们刚补货了新款季节性产品，本周下单可享 23% 折扣。"], ["Dear [First Name], our customer support team has created a “quick fix guide” for common issues with [product you own] - we’re sharing it with you for free, and if you need further help, just call our VIP line.", "尊敬的 [名]，我们的客户支持团队为 [你拥有的产品] 的常见问题制作了 “快速解决指南”—— 免费分享给你，若还需帮助，可拨打我们的 VIP 热线。"], ["Hi [Customer], we’re giving old customers early access to our holiday gift sets - pre-order now to avoid sold-out stock, and get a free gift wrap service.", "嗨 [客户]，我们为老客户提供节日礼品套装的提前购买权限 —— 现在预购可避免缺货，还能享受免费礼品包装服务。"], ["Dear [Name], we’ve added a “personalized recommendation” section to your account - based on your past purchases, we’ve picked products we think you’ll love. Check it out and get 10% off your first pick!", "尊敬的 [姓名]，我们在你的账户中新增了 “个性化推荐” 板块 —— 根据你的过往购买记录，挑选了我们认为你会喜欢的产品。查看板块并购买首个推荐商品，可享 10% 折扣。"], ["Hey [First Name], we’re hosting a “webinar for old customers” about [topic, e.g., “maximizing product use”] - join live to ask questions, and get a free e-book as a attendance gift.", "嗨 [名]，我们为老客户举办关于 [主题，如 “产品使用最大化”] 的线上研讨会 —— 实时参与可提问，还能获得免费电子书作为参会礼品。"], ["Dear [Customer], we noticed you haven’t used our [service add-on, e.g., “extended warranty”] that came with your [product] - we’re reminding you it’s still valid, and if you need to use it, our team will prioritize your request.", "尊敬的 [客户]，我们注意到你尚未使用 [产品] 附带的 [服务附加项，如 “延长保修”]—— 提醒你它仍在有效期内，若需使用，我们的团队会优先处理你的申请。"], ["Hi [Name], we’re offering old customers a “trade-in bonus” - trade in your old [product] for a new one, and get an extra $30 off on top of the regular trade-in value.", "嗨 [姓名]，我们为老客户提供 “以旧换新补贴”—— 用你的旧 [产品] 换购新品，在常规以旧换新价值基础上可额外再减 30 美元。"], ["Dear [First Name], our [app] now supports integration with [popular tool, e.g., “calendar apps”] - a feature many old customers requested! Download the update and let us know how it works for you.", "尊敬的 [名]，我们的 [应用] 现在支持与 [热门工具，如 “日历应用”] 集成 —— 这是许多老客户要求的功能！下载更新，告诉我们使用体验如何。"], ["Hey [Customer], we’re having a “flash sale” for old customers this evening (6-9 PM) - get 35% off on select items, including your past purchased [product category].", "嗨 [客户]，今晚（6-9 点）我们为老客户举办限时促销 —— 部分商品可享 35% 折扣，包括你过往购买过的 [产品品类]。"], ["Dear [Name], we’ve created a “loyalty rewards tracker” in your account - you can now see how close you are to your next reward (e.g., free product, discount). Log in to check your progress!", "尊敬的 [姓名]，我们在你的账户中添加了 “会员奖励进度跟踪器”—— 现在你可以查看距离下一个奖励（如免费产品、折扣）还有多远。登录查看你的进度吧！"], ["Hi [First Name], we’re sending old customers a free “sample box” with mini versions of our new products - just reply to this email with your shipping address, and we’ll send it within 3 days.", "嗨 [名]，我们为老客户寄送包含新款产品小样的免费 “样品盒”—— 只需回复此邮件告知收货地址，我们将在 3 天内寄出。"], ["Dear [Customer], we’ve extended our “price protection” for old customers - if the price of a [product you bought in the last 30 days] drops, we’ll refund you the difference.", "尊敬的 [客户]，我们为老客户延长了 “价格保护” 期限 —— 若你过去 30 天内购买的 [产品] 降价，我们将为你退还差价。"], ["Hey [Name], we’re partnering with [travel brand] to offer old customers a discount on travel bookings - use our exclusive code TRAVEL15 to get 15% off your next trip.", "嗨 [姓名]，我们与 [旅游品牌] 合作，为老客户提供旅游预订折扣 —— 使用我们的专属代码 TRAVEL15，下次旅行可享 15% 优惠。"], ["Dear [First Name], our [product] now has a new color option (your favorite color, [color name]!) - order it this month, and we’ll include a free matching accessory.", "尊敬的 [名]，我们的 [产品] 现在推出了新的颜色选项（正是你喜欢的 [颜色名称]！）—— 本月下单，我们将附赠免费的配套配件。"], ["Hi [Customer], we’re giving old customers a “free trial of premium features” for 2 months - no credit card required, and you can cancel anytime. Activate it now in your account!", "嗨 [客户]，我们为老客户提供 2 个月的高级功能免费试用 —— 无需信用卡，可随时取消。现在在你的账户中激活吧！"], ["Dear [Name], we noticed you’ve been saving [product] in your wishlist - it’s now on sale for 20% off, and we’re giving you an extra 5% off as an old customer.", "尊敬的 [姓名]，我们注意到你一直在愿望清单中收藏 [产品]—— 该商品现在已降价 20%，作为老客户，你还能额外享受 5% 折扣。"], ["Hey [First Name], we’re hosting an “old customer meetup” at our [store location] next Saturday - enjoy snacks, exclusive shopping time, and a chance to win a $100 gift card.", "嗨 [名]，下周六我们将在 [店铺地址] 举办 “老客户见面会”—— 享用零食、专属购物时间，还有机会赢取 100 美元礼品卡。"], ["Dear [Customer], we’ve updated our [service] to include 24/7 support - a request we heard from many old customers. If you need help anytime, our team is here for you.", "尊敬的 [客户]，我们已将 [服务] 升级为 24 小时支持 —— 这是我们从许多老客户那里收到的需求。若你随时需要帮助，我们的团队随时待命。"], ["Hi [Name], we’re offering old customers a “custom engraving service” for free on [product, e.g., “jewelry”] - add your name or a special message, no extra cost.", "嗨 [姓名]，我们为老客户提供 [产品，如 “珠宝”] 的免费定制雕刻服务 —— 添加你的名字或特殊信息，无需额外付费。"], ["Dear [First Name], your [product] is due for a maintenance check (based on usage time) - we’re offering old customers a free check-up and cleaning service. Book an appointment today!", "尊敬的 [名]，你的 [产品] 已到维护检查时间（根据使用时长判断）—— 我们为老客户提供免费检查和清洁服务。今天预约吧！"], ["Hey [Customer], we’re giving old customers a “referral bonus for businesses” - if you refer a business client to us, you’ll get a $100 cash reward instead of store credit.", "嗨 [客户]，我们为老客户提供 “企业推荐奖励”—— 若你向我们推荐企业客户，可获得 100 美元现金奖励（而非店铺信用额）。"], ["Dear [Name], we’ve created a “past purchase discount” - for every [product] you bought from us before, you get 5% off your next order (up to 30% total).", "尊敬的 [姓名]，我们推出了 “过往购买折扣”—— 你之前在我们这里购买的每一件 [产品]，都能为你的下次订单带来 5% 折扣（最高可享 30%）。"], ["Hi [First Name], we’re sharing our “upcoming product roadmap” with old customers first - see what we’re launching next year, and let us know which products you’re most excited about.", "嗨 [名]，我们首先向老客户分享 “未来产品规划”—— 了解我们明年将推出的产品，告诉我们你最期待哪一款。"], ["Dear [Customer], we’re offering old customers a free “product demo session” with our expert - learn how to use [product you own] to its full potential. Book a time that works for you!", "尊敬的 [客户]，我们为老客户提供与专家一起的免费 “产品演示课程”—— 学习如何充分发挥 [你拥有的产品] 的潜力。预约一个适合你的时间吧！"], ["Hey [Name], we’re having a “charity campaign” for old customers - for every order you place this month, we’ll donate $5 to [charity name], and you’ll get a tax-deductible receipt.", "嗨 [姓名]，我们为老客户举办 “慈善活动”—— 本月你每下一笔订单，我们将向 [慈善机构名称] 捐赠 5 美元，你还能获得可抵税的收据。"], ["Dear [First Name], we’ve added a “subscription pause” feature to our [service] - perfect if you need a break, and you can resume anytime without losing your benefits.", "尊敬的 [名]，我们在 [服务] 中新增了 “订阅暂停” 功能 —— 若你需要暂停使用，非常方便，且恢复后不会丢失你的权益。"], ["Hi [Customer], we’re saying thank you to old customers with a “free annual membership renewal” - if your membership expires this month, we’ll renew it for free. Check your account to confirm!", "嗨 [客户]，我们为老客户送上 “免费年度会员续期” 作为感谢 —— 若你的会员本月到期，我们将为你免费续期。登录账户确认吧！"], ["Good morning [Name], hope you had a great weekend! Just wanted to share a quick update on the [project] we’re working on.", "早上好 [姓名]，希望你周末过得愉快！想快速跟你分享一下我们正在推进的 [项目] 的最新情况。"], ["Hi [First Name], just a heads-up that the [document] you asked for is ready - I’ve attached it to this email. Let me know if you need any changes.", "嗨 [名]，提醒你一下，你要的 [文件] 已经准备好了 —— 我已附在这封邮件中。若需修改，请告诉我。"], ["Dear [Customer], hope your week is off to a good start! We wanted to let you know that your [order] has been shipped, and the tracking number is [number].", "尊敬的 [客户]，希望你本周开局顺利！想告知你，你的 [订单] 已发货，物流跟踪号为 [号码]。"], ["Hey [Name], I just wanted to confirm our meeting time tomorrow - we’re still on for 2 PM, right? Let me know if you are update] we’ve been waiting for is now available. I recommend installing it today to avoid any compatibility issues.", "嗨 [名]，我们一直在等的 [软件更新] 现已可用。建议你今天安装，以避免兼容性问题。"], ["Dear [Customer], your [membership] will expire in 2 weeks. We’d love to have you continue with us - if you renew now, you’ll get a 10% discount.", "尊敬的 [客户]，你的 [会员] 将在 2 周后到期。我们很希望你能继续使用 —— 若现在续期，可享 10% 折扣。"], ["Hey [Name], I just wanted to say thank you for your help with the [task] yesterday. It really made a difference in getting it done on time.", "嗨 [姓名]，想感谢你昨天帮忙处理 [任务]。这对按时完成任务起到了很大作用。"], ["Hi [First Name], just a quick note to let you know that the [meeting room] we booked for Thursday is unavailable. I’ve booked [alternative room] instead - does that work for you?", "嗨 [名]，简单告知你，我们预订的周四的 [会议室] 无法使用。我已改订 [备选会议室]—— 这个对你来说可以吗？"], ["Dear [Team Member], we’re having a team lunch this Friday to celebrate [colleague’s name]’s work anniversary. Let me know if you can make it by Wednesday.", "尊敬的 [团队成员]，本周五我们将举办团队午餐，庆祝 [同事姓名] 的工作周年纪念日。若能参加，请在周三前告知我。"], ["Hey [Name], hope you’re having a good day! I wanted to share that the [product sample] you requested has been sent - it should arrive in 3-5 business days.", "嗨 [姓名]，希望你今天过得愉快！想告诉你，你申请的 [产品样品] 已寄出 —— 预计 3-5 个工作日内送达。"], ["Hi [First Name], I’ve reviewed the [draft] you sent and made a few small edits. I’ve attached the revised version - let me know if you agree with the changes or need further adjustments.", "嗨 [名]，我已审核你发来的 [草案]，并做了几处小修改。已附上修订版 —— 若你认可这些修改或需要进一步调整，请告诉我。"], ["Dear [Customer], we received your feedback about the [product] and wanted to thank you for sharing it. Our team is looking into your suggestions and will update you on any changes soon.", "尊敬的 [客户]，我们已收到你关于 [产品] 的反馈，感谢你的分享。我们团队正在研究你的建议，后续如有调整会及时告知你。"], ["Hey [Name], just a reminder that we have a team check-in call at 10 AM tomorrow. Please come prepared with a quick update on your current tasks.", "嗨 [姓名]，提醒你明天上午 10 点有团队进度沟通会。请准备好简要分享你当前任务的进展情况。"], ["Hi [First Name], I noticed you left a message for me yesterday - sorry I missed it! I’m free this afternoon from 2-4 PM if you want to chat about the [topic] you mentioned.", "嗨 [名]，我看到你昨天给我留了消息 —— 很抱歉错过了！如果你想聊你提到的 [话题]，我今天下午 2-4 点有空。"], ["Dear [Team Member], the supplier just informed me that the [materials] we ordered will be delayed by 2 days. I’ll adjust the project timeline and share the updated version with everyone shortly.", "尊敬的 [团队成员]，供应商刚告知我，我们订购的 [材料] 将延迟 2 天送达。我会调整项目时间表，并尽快将更新版分享给大家。"], ["Hey [Name], hope your day is going smoothly! I wanted to ask if you have the contact information for [person’s name] - I need to follow up with them about the [project].", "嗨 [姓名]，希望你今天一切顺利！想问问你有没有 [某人姓名] 的联系方式 —— 我需要就 [项目] 跟他们跟进。"], ["Hi [First Name], we’re updating our company directory and need to confirm your current job title and contact details. Could you reply with that info by the end of today?", "嗨 [名]，我们正在更新公司通讯录，需要确认你当前的职位和联系方式。你能在今天结束前回复相关信息吗？"], ["Dear [Customer], your [order] was delivered yesterday, and we wanted to check if everything arrived in good condition. If you have any issues, please don’t hesitate to reach out.", "尊敬的 [客户]，你的 [订单] 已于昨天送达，想确认一下所有商品是否完好。若有任何问题，请随时联系我们。"], ["Hey [Name], thanks for the update on the [project]! I have a few questions about the timeline - would it be okay to schedule a 15-minute call later today?", "嗨 [姓名]，感谢你分享 [项目] 的进展！我对时间表有几个疑问 —— 今天晚些时候安排 15 分钟通话可以吗？"], ["Hi [First Name], the [training session] on [topic] that we mentioned earlier is now open for registration. I’ve shared the sign-up link in the team chat - feel free to join if it’s relevant to your work.", "嗨 [名]，我们之前提到的关于 [主题] 的 [培训课程] 现已开放报名。我已在团队群里分享了报名链接 —— 如果与你的工作相关，欢迎参加。"], ["Dear [Team Member], I’ll be working from home tomorrow due to a family matter. I’ll be online during regular hours and can be reached via email or chat for any urgent tasks.", "尊敬的 [团队成员]，因家庭事务，我明天将居家办公。工作时间内我会在线，如有紧急任务，可通过邮件或聊天软件联系我。"], ["Hey [Name], I just found a copy of the [document] you were looking for last week. I’ve sent it to your email - let me know if it’s the one you need.", "嗨 [姓名]，我刚找到你上周在找的 [文件]。已发送至你的邮箱 —— 看看是不是你需要的那份。"], ["Hi [First Name], we’re planning a small team building activity next month - probably a hike or a dinner. Do you have any preferences or dates that don’t work for you?", "嗨 [名]，我们下个月计划举办一次小型团队建设活动 —— 可能是徒步或聚餐。你有什么偏好，或者有不方便的日期吗？"], ["Dear [Customer], we’re launching a new [product line] next week, and we wanted to give you a sneak peek. I’ve attached a brochure with details - let us know if you’re interested in pre-ordering.", "尊敬的 [客户]，我们下周将推出新的 [产品系列]，想提前跟你分享。已附上详情手册 —— 若你有兴趣预购，欢迎告知我们。"], ["Hey [Name], I need to borrow the [equipment, e.g., “projector”] for a meeting tomorrow morning. Do you have it, or know where it’s stored?", "嗨 [姓名]，我明天上午开会需要借 [设备，如 “投影仪”]。你那里有，或者知道放在哪里吗？"], ["Hi [First Name], I reviewed the [budget proposal] and think it’s looking good. The only minor issue is the [section on travel costs] - could you clarify a few numbers there?", "嗨 [名]，我已审核 [预算方案]，整体没问题。只有 [差旅费部分] 有个小疑问 —— 你能说明一下那里的几个数字吗？"], ["Dear [Team Member], the client just requested a small change to the [deliverable, e.g., “design”]. I’ve shared their feedback with you via email - let me know how long it will take to make the adjustment.", "尊敬的 [团队成员]，客户刚要求对 [交付成果，如 “设计稿”] 做一处小修改。我已通过邮件分享他们的反馈 —— 告诉我修改需要多久。"], ["Hey [Name], hope you had a good evening! I wanted to confirm that we’re still meeting at the [café name] tomorrow at 3 PM to go over the [report].", "嗨 [姓名]，希望你晚上过得愉快！想确认一下，我们明天下午 3 点在 [咖啡馆名称] 见面讨论 [报告] 的计划是否不变。"], ["Hi [First Name], the IT team will be doing system maintenance this weekend (Saturday 10 PM - Sunday 2 AM). During this time, the [internal system] will be unavailable - please plan your work accordingly.", "嗨 [名]，IT 团队本周六晚 10 点至周日凌晨 2 点将进行系统维护。维护期间，[内部系统] 无法使用 —— 请据此安排工作。"], ["Dear [Customer], you have a $20 store credit in your account that you haven’t used yet. It’s valid for another month, so feel free to use it on your next purchase.", "尊敬的 [客户]，你的账户中有 20 美元未使用的店铺信用额，有效期还有一个月，下次购物时可直接使用。"], ["Hey [Name], I just finished putting together the [presentation slides] for the client meeting. I’ve shared them with you - could you take a quick look and let me know if anything is missing?", "嗨 [姓名]，我刚完成客户会议的 [演示幻灯片]，已分享给你 —— 能快速看看有没有遗漏内容吗？"], ["Hi [First Name], we’re looking for someone to lead the [small project, e.g., “team survey”] next month. I thought you might be interested - let me know if you want to take it on.", "嗨 [名]，我们正在找人负责下个月的 [小型项目，如 “团队调研”]。我觉得你可能会感兴趣 —— 如果想接手，告诉我一声。"], ["Dear [Team Member], I received the [invoice] from the vendor and have processed the payment. I’ve attached the payment confirmation for your records - let me know if you need anything else.", "尊敬的 [团队成员]，我已收到供应商的 [发票] 并完成付款。已附上付款确认单供你存档 —— 若还需要其他材料，请告知。"], ["Hey [Name], I heard you’ve been working on the [task, e.g., “client onboarding”] - how’s it going? Do you need any help with the paperwork or follow-ups?", "嗨 [姓名]，听说你在负责 [任务，如 “客户入职”]—— 进展怎么样？文书工作或后续跟进需要帮忙吗？"], ["Hi [First Name], the [event venue] we booked for the product launch has confirmed our date (June 15th). I’ll send you the contract to review by the end of the day.", "嗨 [名]，我们为产品发布会预订的 [活动场地] 已确认日期（6 月 15 日）。我会在今天结束前把合同发给你审核。"], ["Dear [Customer], we wanted to let you know that we’ve extended our return policy to 60 days. If you’re not satisfied with your recent purchase, you can return it within this period for a full refund.", "尊敬的 [客户]，想告知你我们已将退货政策延长至 60 天。若你对近期购买的商品不满意，可在此期限内退货并获得全额退款。"], ["Hey [Name], I need to reschedule our 2 PM meeting today - something urgent came up. Would 4 PM today or 10 AM tomorrow work better for you?", "嗨 [姓名]，我需要重新安排今天下午 2 点的会议 —— 有紧急事务处理。今天下午 4 点或明天上午 10 点，哪个时间更适合你？"], ["Hi [First Name], I’ve compiled all the [data] we need for the quarterly report. I’ve organized it into a spreadsheet and shared it with you - let me know if you need help analyzing any part of it.", "嗨 [名]，我已整理好季度报告所需的所有 [数据]，并做成表格分享给你 —— 如果需要帮忙分析某部分数据，告诉我。"], ["Dear [Team Member], the HR department is collecting feedback on the new benefits package. I’ve shared the survey link in the team folder - please complete it by Friday to help them make improvements.", "尊敬的 [团队成员]，人力资源部正在收集大家对新福利套餐的反馈。我已在团队文件夹中分享了问卷链接 —— 请在周五前完成，帮助他们优化福利。"], ["Hey [Name], hope you’re doing well! I wanted to share that the [client] we met with last week has agreed to move forward with the project. We’ll have a kickoff call next Monday.", "嗨 [姓名]，希望你一切顺利！想告诉你，上周我们对接的 [客户] 已同意推进项目，下周一将召开启动会。"], ["Hi [First Name], I noticed the [printer in the break room] isn’t working - I’ve reported it to IT, and they said they’ll fix it by this afternoon. For now, you can use the one in the [marketing office].", "嗨 [名]，我发现休息室的 [打印机] 坏了 —— 已反馈给 IT 部门，他们说今天下午会修好。目前你可以用 [市场部办公室] 的那台。"], ["Dear [Customer], your [subscription] will auto-renew next week. If you want to change your plan or cancel, you can do so by logging into your account and navigating to the “Subscription” section.", "尊敬的 [客户]，你的 [订阅服务] 下周将自动续费。若想更改套餐或取消，可登录账户，进入 “订阅” 板块操作。"], ["Hey [Name], I just had a call with the [supplier] and they offered us a 5% discount if we increase our order quantity. Do you think we need more of the [materials], or should we stick to the original order?", "嗨 [姓名]，我刚和 [供应商] 通话，他们说如果我们增加订单量，可享受 5% 折扣。你觉得我们需要多订些 [材料]，还是按原计划下单？"], ["Hi [First Name], we’re having a department-wide meeting next Wednesday to discuss next quarter’s goals. Please come prepared with 1-2 ideas for your team’s priorities.", "嗨 [名]，下周三我们将召开部门会议，讨论下季度目标。请准备 1-2 个关于你团队优先事项的想法，参会时分享。"], ["Dear [Team Member], I’ll be out of the office for the next two days (Thursday and Friday) attending a conference. For urgent matters related to the [project], please contact [colleague’s name] - they’re up to speed on all details.", "尊敬的 [团队成员]，我下周四、周五将外出参加会议。若有与 [项目] 相关的紧急事务，请联系 [同事姓名]—— 他们了解所有细节。"], ["Hey [Name], I wanted to thank you for covering my shifts last week while I was out sick. I really appreciate it - let me know if I can return the favor anytime.", "嗨 [姓名]，想感谢你上周在我生病时帮我代班。非常感激 —— 如果有需要我帮忙的地方，随时告诉我。"], ["Hi [First Name], the [design draft] for the new brochure is ready, and I’ve sent it to the client for feedback. I’ll share their response with you as soon as I get it.", "嗨 [名]，新宣传册的 [设计稿] 已完成，我已发给客户征求反馈。一旦收到回复，我会立即分享给你。"], ["Dear [Customer], we’ve received your return request for the [product] and will process it within 3-5 business days. You’ll get a confirmation email once the refund is issued.", "尊敬的 [客户]，我们已收到你对 [产品] 的退货申请，将在 3-5 个工作日内处理。退款发放后，你会收到确认邮件。"], ["Hey [Name], I have a quick question about the [report] you sent - what does the “Q3 projection” number in the last section refer to? I want to make sure I understand it correctly.", "嗨 [姓名]，关于你发的 [报告]，我有个小疑问 —— 最后一部分的 “第三季度预测” 数字指的是什么？我想确认自己理解无误。"], ["Hi [First Name], the team lunch we planned for Friday has been moved to next Friday due to a few people being unavailable. I’ll send a reminder next week with the time and location.", "嗨 [名]，因部分人无法参加，原计划本周五的团队午餐改至下周五。下周我会发送提醒，告知具体时间和地点。"], ["Dear [Team Member], I’ve updated the project timeline to reflect the recent delay in materials. The new deadline for the [deliverable] is now October 15th - please adjust your work plan accordingly.", "尊敬的 [团队成员]，我已根据材料延迟情况更新了项目时间表。[交付成果] 的新截止日期为 10 月 15 日 —— 请据此调整你的工作计划。"], ["Hey [Name], hope you had a great weekend! I wanted to share that I found a useful resource about [topic] that might help with the [project]. I’ve linked it in the team chat.", "嗨 [姓名]，希望你周末愉快！想分享一个关于 [话题] 的实用资源，可能对 [项目] 有帮助。已在团队群里附上链接。"], ["Hi [First Name], I need to get approval for the [expense, e.g., “client dinner”] from last week. Could you sign off on the form I sent you via email? It’s due by the end of today.", "嗨 [名]，我需要为上周的 [支出，如 “客户晚餐”] 申请审批。你能在我发的邮件表单上签字确认吗？今天结束前需要提交。"], ["Dear [Customer], we’re running a limited-time promotion this week - get free shipping on all orders over $50. This is a great chance to stock up on your favorite [products]!", "尊敬的 [客户]，本周我们有限时促销活动 —— 订单满 50 美元免运费。这是囤货你喜爱的 [产品] 的好机会！"], ["Hey [Name], I just finished the [first draft] of the proposal and wanted to get your input before sending it to the client. Do you have time to review it today?", "嗨 [姓名]，我刚完成方案的 [初稿]，想在发给客户前听听你的意见。你今天有时间审核吗？"], ["Hi [First Name], the IT team just informed me that we’ll be getting new laptops next month. They’ll send a survey soon to ask about your preferences (e.g., screen size, storage) - please fill it out when you get it.", "嗨 [名]，IT 团队刚告知我，我们下个月将更换新笔记本电脑。他们很快会发送问卷，询问你的偏好（如屏幕尺寸、存储容量）—— 收到后请填写。"], ["Dear [Team Member], the client has requested a progress update on the project by Wednesday. Could you send me a short summary of your tasks by Tuesday so I can compile everything?", "尊敬的 [团队成员]，客户要求周三前提供项目进展更新。你能在周二前把你负责任务的简要总结发给我，方便我汇总吗？"], ["Hey [Name], I heard you’re interested in learning more about [skill, e.g., “data analysis”] - our company is offering a training course on it next month. I can send you the details if you want.", "嗨 [姓名]，听说你有兴趣学习 [技能，如 “数据分析”]—— 我们公司下个月有相关培训课程。如果需要，我可以把详情发给你。"], ["Hi [First Name], I noticed the [meeting room booking system] is down - I’ve contacted IT, and they’re working on fixing it. For now, you can email [admin name] to reserve a room, and they’ll update the system once it’s back up.", "嗨 [名]，我发现会议室预订系统出故障了 —— 已联系 IT 部门，他们正在修复。目前你可以发邮件给 [行政人员姓名] 预订会议室，系统恢复后他们会同步信息。"], ["Dear [Customer], your [product] warranty will expire in 3 months. We offer an extended warranty plan that covers repairs and replacements for an extra year - let us know if you’d like to learn more about it.", "尊敬的 [客户]，你的 [产品] 保修将在 3 个月后到期。我们提供延长保修服务，可额外覆盖 1 年的维修和更换 —— 若想了解详情，欢迎告知。"], ["Hey [Name], I just had a quick chat with [colleague’s name] about the [task], and they mentioned you might need help with the data entry part. Let me know if you want to split the work to save time.", "嗨 [姓名]，我刚和 [同事姓名] 简单聊了 [任务] 的事，他们说你可能在数据录入部分需要帮忙。如果想分工节省时间，告诉我一声。"], ["Hi [First Name], we’re updating our client database and need to confirm the contact details for [client’s name]. Do you have their latest phone number or email address?", "嗨 [名]，我们正在更新客户数据库，需要确认 [客户名称] 的联系方式。你有他们最新的电话或邮箱吗？"], ["Dear [Team Member], the quarterly team building budget has been approved, and we have $500 to spend. Let me know if you have any ideas for activities (e.g., escape room, cooking class) by the end of the week.", "尊敬的 [团队成员]，季度团队建设预算已获批，共有 500 美元可用。若你有活动想法（如密室逃脱、烹饪课），请在本周末前告知我。"], ["Hey [Name], hope you’re having a productive day! I wanted to remind you that we need to submit the [grant application] by Friday. Have you had a chance to finish the final section yet?", "嗨 [姓名]，希望你今天工作顺利！提醒你我们需要在周五前提交 [补助金申请]。你完成最后一部分了吗？"], ["Hi [First Name], the [caterer] for the upcoming event has sent over the menu options. I’ve attached them to this email - let me know which dishes you think would work best for our team and clients.", "嗨 [名]，为即将到来的活动提供餐饮的 [餐饮服务商] 已发来菜单选项。已附在邮件中 —— 告诉我你觉得哪些菜品最适合我们团队和客户。"], ["Dear [Customer], we received your request for a [product replacement], and we’ve shipped the new item today. The tracking number is [number], and it should arrive in 2-3 business days.", "尊敬的 [客户]，我们已收到你的 [产品更换] 申请，新商品已于今日寄出。物流跟踪号为 [号码]，预计 2-3 个工作日内送达。"], ["Hey [Name], I need to borrow your [notes from the training session] since I had to leave early. Could you share a copy with me via email or chat?", "嗨 [姓名]，因为我提前离场了，想借你的 [培训课程笔记] 看看。你能通过邮件或聊天软件发我一份吗？"], ["Hi [First Name], we’re having a feedback session with the interns next week to discuss their experience. Would you be available to join for 30 minutes to share your thoughts as their mentor?", "嗨 [名]，我们下周将和实习生开反馈会，讨论他们的实习体验。作为他们的导师，你能抽 30 分钟参加并分享看法吗？"], ["Dear [Team Member], the supplier has informed us that the [materials] will be delivered tomorrow morning around 10 AM. Could you be at the warehouse to receive them, or should I arrange for someone else?", "尊敬的 [团队成员]，供应商告知 [材料] 将于明天上午 10 点左右送达。你能去仓库接收，还是需要我安排其他人？"], ["Hey [Name], I just saw the [new policy update] from HR about remote work, and I had a question about the weekly check-in requirements. Do you know if we need to submit a written report or just attend the call?", "嗨 [姓名]，我刚看到人力资源部关于远程办公的 [新政策更新]，对每周签到要求有个疑问。你知道我们需要提交书面报告，还是只需参加会议？"], ["Hi [First Name], I’ve prepared the agenda for tomorrow’s client meeting and shared it with you. Let me know if you want to add any topics or adjust the order of discussion.", "嗨 [名]，我已准备好明天客户会议的议程并分享给你。若想添加议题或调整讨论顺序，请告诉我。"], ["Dear [Customer], we wanted to let you know that we’ve restocked the [product] you were looking for last month. It’s available online and in stores now - hurry, as stock is limited!", "尊敬的 [客户]，想告知你，你上个月在找的 [产品] 已补货。目前线上线下均有销售 —— 库存有限，欲购从速！"], ["Hey [Name], I’m working on the [presentation] for the board meeting and need a few stats about our Q2 sales. Do you have access to that data, or know who I should ask?", "嗨 [姓名]，我正在准备董事会会议的 [演示文稿]，需要一些第二季度的销售数据。你有这些数据，还是知道该找谁要？"], ["Hi [First Name], the team’s new laptops will arrive next week, and IT will set them up on Tuesday. You’ll need to back up your current files before then to avoid losing any data.", "嗨 [名]，团队的新笔记本电脑下周到货，IT 部门将在周二进行设置。在此之前，你需要备份当前文件，避免数据丢失。"], ["Dear [Team Member], I’ve received the feedback from the client on the [design], and they want to make a small change to the color scheme. I’ve shared the details with you - let me know when you can have the revised version ready.", "尊敬的 [团队成员]，我已收到客户对 [设计稿] 的反馈，他们想对配色做一处小修改。详情已分享给你 —— 告诉我修订版什么时候能完成。"], ["Hey [Name], hope you’re doing well! I wanted to share that the [workshop] we attended last week has shared the slides online. I’ve linked them in the team folder if you want to review any parts.", "嗨 [姓名]，希望你一切顺利！想告诉你，我们上周参加的 [研讨会] 已在网上分享了幻灯片。若想回顾某些内容，团队文件夹里有链接。"], ["Hi [First Name], I need to schedule a call with [client’s name] to discuss the project timeline. Do you know their availability this week, or should I send them a calendar invite with options?", "嗨 [名]，我需要和 [客户姓名] 安排通话讨论项目时间表。你知道他们本周什么时候有空，还是我应该发日历邀请提供几个时间选项？"], ["Dear [Customer], your recent order of [product] included a free sample of our new [item]. We’d love to hear your feedback on the sample - just reply to this email with your thoughts!", "尊敬的 [客户]，你近期订购的 [产品] 中包含了我们新 [商品] 的免费样品。很想听听你对样品的反馈 —— 只需回复此邮件分享看法即可！"], ["Hey [Name], I noticed the [break room supplies] (e.g., coffee, paper towels) are running low. Should I place an order, or is that someone else’s responsibility?", "（嗨 [姓名]，我发现休息室的 [物资]"], ["Hi [First Name], we’re having a quick team sync at 3 PM today to go over the day’s tasks and any urgent updates. It will only take 15 minutes, so please join if you’re available.", "嗨 [名]，今天下午 3 点我们将开一个简短的团队同步会，梳理当天任务和紧急更新。会议仅 15 分钟，若有空请参加。"], ["Dear [Team Member], the [invoice] for the client’s project has been sent, and we expect payment within 30 days. I’ve added the invoice details to our finance tracker - let me know if you need to reference it later.", "尊敬的 [团队成员]，客户项目的 [发票] 已寄出，预计 30 天内到款。我已将发票详情添加到财务跟踪表中 —— 若后续需要查阅，告诉我一声。"], ["Hey [Name], I just finished reviewing the [contract] with the legal team, and they said it’s ready to be sent to the client. Do you want to take one final look before I send it over?", "嗨 [姓名]，我刚和法务团队一起审核完 [合同]，他们说可以发给客户了。在我发送前，你想最后再看一遍吗？"], ["Hi [First Name], the [marketing campaign] we launched last week is performing well - we’ve already hit 60% of our target. I’ve shared the performance report in the team chat if you want to see the details.", "嗨 [名]，我们上周推出的 [营销活动] 效果不错 —— 已完成目标的 60%。若想了解详情，团队群里有效果报告。"], ["Dear [Customer], we’re offering a “refer a friend” bonus this month - if you refer someone to our [service], you’ll both get a 1-month free subscription. Share your unique referral link from your account!", "尊敬的 [客户]，本月我们推出 “推荐好友” 奖励 —— 若你推荐他人使用我们的 [服务]，你们双方都能获得 1 个月免费订阅。从你的账户中分享专属推荐链接吧！"], ["Hey [Name], I need to leave the office a little early today for a doctor’s appointment. I’ve finished my main tasks, but if anything urgent comes up, you can reach me via phone.", "嗨 [姓名]，我今天需要早点下班去看医生。主要任务已完成，若有紧急情况，可打电话联系我。"], ["Hi [First Name], we’re updating the company’s social media profiles, and we need a short bio for your team. Could you send me a 2-3 sentence description by the end of the week?", "嗨 [名]，我们正在更新公司的社交媒体资料，需要你团队的简短介绍。你能在本周末前发我一段 2-3 句话的描述吗？"], ["Dear [Team Member], the client has requested an extra meeting next week to discuss the project’s progress. I’ve scheduled it for Thursday at 11 AM - let me know if you can’t attend and need to send a delegate.", "尊敬的 [团队成员]，客户要求下周额外开一次会讨论项目进展。我已安排在周四上午 11 点 —— 若无法参加需要派代表，请告知我。"], ["Hey [Name], I found a mistake in the [report] we sent to the client yesterday - the Q3 revenue number was off by $5,000. I’ve sent a corrected version and apologized, but wanted to let you know so we can double-check next time.", "嗨 [姓名]，我发现昨天发给客户的 [报告] 中有个错误 —— 第三季度营收数字少了 5000 美元。我已发送修订版并致歉，但想告诉你，下次我们可以再仔细核对一遍。"], ["Hi [First Name], the [training materials] for the new employees are ready, and I’ve placed them in the HR office. Could you let the new hires know to pick them up when they arrive tomorrow?", "嗨 [名]，新员工的 [培训材料] 已准备好，我放在了人力资源办公室。你能告诉新员工明天到岗后去领取吗？"], ["Dear [Customer], we’re having a flash sale on [product category] this evening from 7-9 PM - get 40% off select items. Set a reminder so you don’t miss out!", "尊敬的 [客户]，今晚 7-9 点我们将对 [产品品类] 进行限时促销 —— 部分商品可享 4 折优惠。设置提醒，别错过哦！"], ["Hey [Name], I’m working on the budget for next year’s projects and need to know how much we spent on [expense category, e.g., “marketing tools”] this year. Do you have that information, or can you point me to the right report?", "嗨 [姓名]，我正在准备明年项目的预算，需要知道今年我们在 [支出类别，如 “营销工具”] 上花了多少钱。你有这些信息，还是能告诉我该看哪份报告？"], ["Hi [First Name], the team’s lunch order for Friday is due tomorrow. I’ve shared the menu in the group chat - please reply with your choice by the end of today so I can place the order.", "嗨 [名]，周五团队午餐的订单明天需要提交。我已在群里分享了菜单 —— 请在今天结束前回复你的选择，方便我下单。"], ["Dear [Team Member], I’ve received the approval for the [travel request] to attend the conference next month. I’ll book the flights and hotel this week and share the details with you once confirmed.", "尊敬的 [团队成员]，我参加下个月会议的 [差旅申请] 已获批。本周我会预订机票和酒店，确认后将详情分享给你。"], ["Hey [Name], hope you had a good weekend! I wanted to let you know that I’ll be leading the [new project] we discussed, and I’d love to have you on the team since you have experience with [related skill]. Are you interested?", "嗨 [姓名]，希望你周末愉快！想告诉你，我们之前讨论的 [新项目] 将由我负责，因为你有 [相关技能] 的经验，很希望你能加入团队。你有兴趣吗？"], ["Hi [First Name], the [client] has requested a copy of our company’s insurance certificate. I’ve asked the admin team to send it to me, and I’ll forward it to you as soon as I receive it.", "嗨 [名]，[客户] 需要一份我们公司的保险证明。我已让行政团队发给我，收到后会立即转发给你。"], ["Dear [Customer], your [product] has been used for over a year, and it might be time for a maintenance check. We offer a free check-up service - just bring it to any of our stores, and our team will inspect it for you.", "尊敬的 [客户]，你的 [产品] 已使用一年多，可能需要进行维护检查。我们提供免费检查服务 —— 只需将产品带到任意门店，我们的团队会为你检测。"], ["Hey [Name], I need to use the [conference room] for a client call at 2 PM tomorrow, but I don’t see it available on the booking system. Did someone else reserve it, or is there a glitch?", "嗨 [姓名]，我明天下午 2 点需要用 [会议室] 和客户通话，但在预订系统上看不到可用状态。是有人已经预订了，还是系统出故障了？"], ["Hi [First Name], we’re collecting photos for the company’s annual report, and we need a group photo of our team. Could we take it this Thursday after the team meeting?", "嗨 [名]，我们正在为公司年度报告收集照片，需要一张团队合影。我们能在本周四团队会议后拍摄吗？"], ["Dear [Team Member], the [supplier] has offered us a free demo of their new [equipment] next week. It could help improve our workflow - would you be interested in attending the demo with me?", "尊敬的 [团队成员]，[供应商] 下周将为我们提供新 [设备] 的免费演示。这可能有助于改善我们的工作流程 —— 你有兴趣和我一起参加吗？"], ["Hey [Name], I just sent you the [draft email] to the client about the project delay. Could you read it over and let me know if the tone is appropriate, or if I need to adjust anything?", "嗨 [姓名]，我刚把关于项目延迟的 [邮件草稿] 发给你了。能帮忙读一下，看看语气是否合适，或者是否需要调整内容吗？"], ["Hi [First Name], the HR department is hosting a “wellness workshop” next Friday focused on stress management. It’s optional, but I thought you might be interested - let me know if you want to sign up together.", "嗨 [名]，人力资源部下周五将举办一场关于压力管理的 “健康研讨会”。这是自愿参加的，但我觉得你可能会感兴趣 —— 如果想一起报名，告诉我。"], ["Dear [Customer], we’ve added a new “track order” feature to our app - you can now see real-time updates on your delivery status. Just log in and go to the “Orders” section to use it.", "尊敬的 [客户]，我们的应用新增了 “订单跟踪” 功能 —— 你现在可以实时查看配送状态。只需登录并进入 “订单” 板块即可使用。"], ["Hey [Name], I’m out of the office today, but I left the [document you needed] on my desk in the top drawer. Could you grab it for me and send a copy to the client?", "嗨 [姓名]，我今天不在办公室，但你需要的 [文件] 放在我办公桌最上面的抽屉里。能帮我拿一下并给客户发一份吗？"], ["Hi [First Name], we’re having a team celebration for hitting our Q3 target next Wednesday after work. We’ll be at [restaurant name] - let me know if you can make it, so I can confirm the reservation.", "嗨 [名]，下周三下班后我们将举办团队庆祝活动，庆祝达成第三季度目标。地点在 [餐厅名称]—— 若能参加，请告知我，方便我确认预订人数。"], ["Dear [Customer], we wanted to share that our customer support hours have been extended to 9 PM on weekdays (from 6 PM). If you need help outside regular hours, you can now reach us until 9 PM.", "尊敬的 [客户]，想告知你我们的客户支持时间已从工作日下午 6 点延长至晚上 9 点。若在常规时间外需要帮助，现在可联系我们至晚上 9 点。"], ["Hey [Name], I just received the final approval for the [project budget] from the finance team. I’ve shared the approved budget with everyone in the team folder - let’s align our next steps based on it in tomorrow’s meeting.", "嗨 [姓名]，我刚从财务团队那里收到 [项目预算] 的最终审批。已将获批预算分享至团队文件夹 —— 明天会议上，我们基于此确定下一步计划吧。"], ["Hi [Name], I noticed the [software] keeps crashing when we try to export the report. Have you encountered this issue too, or should I reach out to IT for help?", "嗨 [姓名]，我发现尝试导出报告时，[软件] 总是崩溃。你也遇到这个问题了吗，还是我应该联系 IT 部门帮忙？"], ["Dear [Team Member], the client mentioned they’re not satisfied with the [design draft] because the color scheme doesn’t match their brand. Should we adjust the colors or schedule a call to clarify their exact preferences?", "尊敬的 [团队成员]，客户反馈对 [设计稿] 不满意，因为配色不符合他们的品牌风格。我们是直接调整配色，还是安排通话明确他们的具体偏好？"], ["Hey [First Name], the [shipment] of materials we ordered was supposed to arrive yesterday, but it’s still missing. Should I contact the logistics company to track it, or check if there was a delivery address mix-up?", "嗨 [名]，我们订购的 [材料] 本应昨天送达，但至今未到。我是联系物流公司跟踪物流，还是检查是否存在送货地址错误？"], ["Hi [Customer], you mentioned you received the wrong [product] in your order. To fix this, we can either send the correct item right away or process a full refund - which option works better for you?", "嗨 [客户]，你反馈收到的订单中 [产品] 发错了。为解决这个问题，我们可以立即寄送正确商品，或为你办理全额退款 —— 哪个方案更适合你？"], ["Dear [Name], the [meeting room] we booked for the client presentation has a broken projector. Should we switch to another available room, or ask IT to bring a portable projector to fix it?", "尊敬的 [姓名]，我们为客户演示预订的 [会议室] 投影仪坏了。我们是更换到其他可用会议室，还是让 IT 部门带便携式投影仪来解决问题？"], ["Hey [Team Member], the data in the [spreadsheet] has some inconsistencies - a few numbers don’t match the source documents. Do you have time to help me cross-check, or should I assign this to someone with more familiarity with the data?", "嗨 [团队成员]，[电子表格] 中的数据存在不一致 —— 部分数字与源文件不匹配。你有时间帮我交叉核对，还是我应该交给更熟悉这些数据的人处理？"], ["Hi [First Name], the supplier informed us they can’t deliver the [parts] by the deadline because of a production delay. Should we look for an alternative supplier, or ask the client to extend the project timeline?", "嗨 [名]，供应商告知因生产延误，无法在截止日期前交付 [零件]。我们是寻找备选供应商，还是请求客户延长项目时间？"], ["Dear [Customer], you’re having trouble accessing your account because you forgot the password. I can send a password reset link to your registered email, or guide you through the “forgot password” process on our website - which would you prefer?", "尊敬的 [客户]，你因忘记密码无法登录账户。我可以向你的注册邮箱发送密码重置链接，或指导你在我们网站上操作 “忘记密码” 流程 —— 你更倾向哪种方式？"], ["Hey [Name], the [marketing campaign] isn’t performing as expected - click-through rates are 30% lower than target. Should we adjust the ad copy, change the targeting audience, or pause the campaign to analyze the issue further?", "嗨 [姓名]，[营销活动] 效果未达预期 —— 点击率比目标低 30%。我们是调整广告文案、更换目标受众，还是暂停活动进一步分析问题？"], ["Hi [Team Member], the intern made a mistake in the [client invoice] by miscalculating the discount. Should we send a corrected invoice with an apology, or call the client first to explain the error?", "嗨 [团队成员]，实习生在 [客户发票] 中算错了折扣金额。我们是发送修订后的发票并致歉，还是先打电话向客户解释错误？"], ["Dear [First Name], the [server] that hosts our internal files went down this morning, and we can’t access important documents. Should we wait for IT to fix it, or use the backup files we stored in the cloud?", "尊敬的 [名]，今早存储内部文件的 [服务器] 出故障了，我们无法访问重要文档。我们是等待 IT 部门修复，还是使用存储在云端的备份文件？"], ["Hey [Customer], the [service] you subscribed to has a temporary outage in your area. Our technical team is working on it, and it should be restored within 2 hours. Would you like us to send a notification once it’s back up, or offer a 1-day free extension as compensation?", "嗨 [客户]，你所在区域的 [订阅服务] 暂时中断。我们的技术团队正在处理，预计 2 小时内恢复。你希望恢复后收到通知，还是我们为你提供 1 天免费延期作为补偿？"], ["Hi [Name], the client wants to add a new feature to the [project] that wasn’t in the original scope. Should we assess the additional time and cost first, then discuss it with them, or agree to it and adjust the plan later?", "嗨 [姓名]，客户想在 [项目] 中新增一项原范围外的功能。我们是先评估额外的时间和成本，再与他们沟通，还是先同意新增，之后调整计划？"], ["Dear [Team Member], the [printer] in the office keeps jamming when using thick paper. Should we check the printer settings for paper type, or contact the maintenance team to fix the hardware?", "尊敬的 [团队成员]，办公室的 [打印机] 使用厚纸时总是卡纸。我们是检查打印机的纸张类型设置，还是联系维修团队修复硬件？"], ["Hey [First Name], the [event venue] canceled our booking last minute due to a emergency. Should we quickly find another venue nearby, or reschedule the event to a later date?", "嗨 [名]，[活动场地] 因突发情况临时取消了我们的预订。我们是尽快寻找附近的其他场地，还是将活动改期至稍后？"], ["Hi [Customer], you received a damaged [product] because of rough shipping. We can send a replacement with expedited delivery, or process a refund plus a 10% store credit for the inconvenience - which do you choose?", "嗨 [客户]，因运输过程颠簸，你收到的 [产品] 有损坏。我们可以加急寄送替换品，或为你办理退款并额外提供 10% 店铺信用额作为补偿 —— 你选择哪种？"], ["Dear [Name], the data analysis for the [report] is taking longer than expected because of incomplete source data. Should we follow up with the department that provided the data, or use the available data and note the gaps in the report?", "尊敬的 [姓名]，因源数据不完整，[报告] 的数据分析耗时超出预期。我们是跟进提供数据的部门补充数据，还是使用现有数据并在报告中注明缺口？"], ["Hey [Team Member], the [video call] with the overseas client keeps dropping because of poor internet. Should we ask everyone to switch to a wired connection, or reschedule the call to a time with better network stability?", "嗨 [团队成员]，因网络不佳，与海外客户的 [视频会议] 频繁中断。我们是要求所有人切换至有线网络，还是将会议改期至网络更稳定的时间？"], ["Hi [First Name], the [product sample] we sent to the client arrived late, and they’re upset about the delay. Should I call them to apologize and explain the reason, or send a detailed email with a discount for their next order?", "嗨 [名]，寄给客户的 [产品样品] 延迟送达，他们对此不满。我是打电话致歉并解释原因，还是发送详细邮件并为他们的下次订单提供折扣？"], ["Dear [Customer], the [app] isn’t loading on your device. Let’s troubleshoot: first, try closing and reopening the app. If that doesn’t work, check if you have the latest version installed. If the issue persists, let me know, and we’ll escalate it to our tech team.", "尊敬的 [客户]，[应用] 在你的设备上无法加载。我们可以这样排查：首先尝试关闭并重新打开应用；若无效，检查是否安装了最新版本。若问题仍存在，请告知我，我们会提交技术团队处理。"], ["Hey [Name], the team is split on the [design direction] for the new brochure. Some prefer a minimalist style, others want more visuals. Should we create two small drafts and let the client choose, or have a team vote to decide?", "嗨 [姓名]，团队对新宣传册的 [设计方向] 有分歧：部分人倾向简约风格，部分人希望加入更多视觉元素。我们是制作两个小型草稿让客户选择，还是团队投票决定？"], ["Hi [Team Member], the [invoice] we sent to the client was rejected because the payment terms weren’t clear. Should we revise the invoice to specify net-30 terms, or call the client to confirm their preferred payment schedule?", "嗨 [团队成员]，我们发给客户的 [发票] 因付款条款不明确被退回。我们是修改发票注明 “30 天付款期”，还是打电话确认他们偏好的付款周期？"], ["Dear [First Name], the [project timeline] is at risk because two team members are out sick. Should we reassign their tasks to others, or ask the client for a short extension to avoid rushing the work?", "尊敬的 [名]，因两名团队成员生病请假，[项目时间表] 面临风险。我们是将他们的任务重新分配给其他人，还是请求客户短暂延期以避免仓促完成工作？"], ["Hey [Customer], the [service] you’re using has a limit on monthly usage, and you’ve almost reached it. We can upgrade your plan to remove the limit, or offer a one-time usage extension - which helps more?", "嗨 [客户]，你使用的 [服务] 有月度使用限额，目前已接近上限。我们可以为你升级套餐取消限额，或提供一次性使用延期 —— 哪种对你更有帮助？"], ["Hi [Name], the [supplier] sent the wrong quantity of [materials] - we ordered 100 units, but received 50. Should I ask them to send the remaining 50 with expedited shipping, or return the 50 and get a full refund to order from someone else?", "嗨 [姓名]，[供应商] 发错了 [材料] 数量 —— 我们订了 100 件，只收到 50 件。我是要求他们加急寄送剩余 50 件，还是退回这 50 件并全额退款，再向其他供应商订购？"], ["Dear [Team Member], the [client presentation] slides have a few typos and formatting errors. Should we do a quick review together now to fix them, or assign someone to proofread them thoroughly by the end of the day?", "尊敬的 [团队成员]，[客户演示] 幻灯片中有几处拼写错误和格式问题。我们是现在一起快速检查修改，还是安排专人在今天结束前仔细校对？"], ["Hey [First Name], the [website] isn’t displaying correctly on mobile devices - the text is too small and images are misaligned. Should we ask the web development team to fix the responsive design, or temporarily hide non-essential elements on mobile?", "嗨 [名]，[网站] 在移动设备上显示异常 —— 文字过小且图片错位。我们是让网页开发团队修复响应式设计，还是暂时隐藏移动端的非必要元素？"], ["Hi [Customer], you were charged twice for the same [order] due to a system glitch. We’ve already processed a refund for the duplicate charge, and it should appear in your account within 3-5 business days. Would you like us to send a confirmation email of the refund, or provide a reference number for your bank?", "嗨 [客户]，因系统故障，你同一笔 [订单] 被重复收费。我们已处理重复收费的退款，预计 3-5 个工作日内到账。你希望我们发送退款确认邮件，还是提供银行所需的参考编号？"], ["Dear [Name], the [team member] assigned to the [task] is struggling with the technical aspects. Should we pair them with a more experienced colleague for support, or provide a short training session to help them catch up?", "尊敬的 [姓名]，负责 [任务] 的 [团队成员] 在技术层面遇到困难。我们是安排经验更丰富的同事协助他们，还是提供短期培训帮助他们跟上进度？"], ["Hey [Team Member], the [event] we’re organizing has fewer registrations than expected. Should we promote it more on social media, or offer a small discount on tickets to encourage sign-ups?", "嗨 [团队成员]，我们筹备的 [活动] 报名人数低于预期。我们是在社交媒体上加大宣传力度，还是提供小额门票折扣刺激报名？"], ["Hi [First Name], the [contract] with the vendor has a clause that’s unclear about liability for delays. Should we have our legal team review it and clarify, or schedule a call with the vendor to discuss and revise the clause?", "嗨 [名]，与供应商的 [合同] 中有一条关于延误责任的条款表述模糊。我们是让法务团队审核并明确，还是安排通话与供应商协商修改该条款？"], ["Dear [Customer], the [product] you want is out of stock, and we don’t expect to restock it for 2 weeks. We have a similar [alternative product] with better features, or we can notify you as soon as the original one is back in stock - which would you prefer?", "尊敬的 [客户]，你想要的 [产品] 目前缺货，预计 2 周后才能补货。我们有一款功能更优的类似 [替代产品]，或在原产品补货后立即通知你 —— 你更倾向哪种？"], ["Hey [Name], the [report] we need to submit to the board has a missing section on risk assessment. Should I draft it quickly using available data, or ask the risk management team to provide a detailed analysis?", "嗨 [姓名]，需要提交给董事会的 [报告] 缺少风险评估部分。我是使用现有数据快速起草，还是让风险管理团队提供详细分析？"], ["Hi [Team Member], the [video] we produced for the client has poor audio quality in some parts. Should we re-record the audio for those sections, or use audio editing software to improve the quality?", "嗨 [团队成员]，我们为客户制作的 [视频] 部分段落音质不佳。我们是重新录制这些段落的音频，还是使用音频编辑软件优化音质？"], ["Dear [First Name], the [client] is asking for a faster delivery time than we initially agreed. Should we adjust our production schedule to meet it, or explain the current constraints and offer a compromise timeline?", "尊敬的 [名]，[客户] 要求的交付时间比我们最初约定的更快。我们是调整生产计划满足要求，还是解释当前限制并提出折中时间？"], ["Hey [Customer], you’re having trouble using the [feature] in the [app] because the instructions are unclear. I can send you a step-by-step guide with screenshots, or schedule a short video call to walk you through it - which is easier for you?", "嗨 [客户]，因操作说明不清晰，你在使用 [应用] 的 [功能] 时遇到困难。我可以发送带截图的分步指南，或安排简短视频通话指导你操作 —— 哪种对你更方便？"], ["Hi [Name], the [team] is behind on the [project] because of unexpected issues with the software. Should we add extra work hours this week to catch up, or reduce the scope of non-critical tasks?", "嗨 [姓名]，因软件出现意外问题，[团队] 的 [项目] 进度滞后。我们是本周增加工作时长追赶进度，还是缩减非关键任务的范围？"], ["Dear [Team Member], the [supplier] increased the price of [materials] by 15% without prior notice. Should we negotiate with them to lower the price, or compare quotes from other suppliers to find a better deal?", "尊敬的 [团队成员]，[供应商] 未提前通知就将 [材料] 价格提高了 15%。我们是与他们协商降价，还是对比其他供应商的报价寻找更优惠的合作？"], ["Hey [First Name], the [event] venue’s parking lot is too small for the expected number of attendees. Should we arrange for a nearby parking garage with a shuttle service, or suggest attendees use public transportation with a small reimbursement?", "嗨 [名]，[活动] 场地的停车场容量不足以容纳预计参会人数。我们是在附近停车场安排班车接送，还是建议参会者使用公共交通并提供小额补贴？"], ["Hi [Customer], the [refund] you requested hasn’t been processed yet because we need your bank account details. Could you share your account number and routing number, or would you prefer to receive the refund via store credit instead?", "嗨 [客户]，你申请的 [退款] 尚未处理，因为我们需要你的银行账户信息。你可以提供账号和 routing 号码，或者更倾向于以店铺信用额形式接收退款？"], ["Dear [Name], the [client presentation] is scheduled for tomorrow, but the key team member leading it is sick. Should I take over the presentation, or reschedule it with the client and apologize for the short notice?", "尊敬的 [姓名]，明天原定有客户演示，但负责主讲的核心团队成员生病了。我是接手演示，还是联系客户改期并为临时变动致歉？"], ["Hey [Team Member], the [spreadsheet] tracking project tasks has duplicate entries for some tasks, which is causing confusion. Should we delete the duplicates and review the rest together, or assign someone to audit the entire spreadsheet for errors?", "嗨 [团队成员]，跟踪项目任务的 [电子表格] 中部分任务有重复条目，导致混乱。我们是删除重复项并共同检查剩余内容，还是安排专人审核整个表格排查错误？"], ["Hi [First Name], the [product] we shipped to the client has a missing accessory. Should we send the accessory via expedited shipping at no cost, or offer a partial refund if they don’t need the accessory urgently?", "嗨 [名]，寄给客户的 [产品] 漏发了一个配件。我们是免费加急寄送配件，还是在客户不急需配件的情况下提供部分退款？"], ["Dear [Customer], the [service] upgrade you requested isn’t reflecting in your account. Let’s try this: log out of your account, clear your browser cache, then log back in. If it still doesn’t show up, I’ll escalate it to our technical team immediately.", "尊敬的 [客户]，你申请的 [服务] 升级未在账户中显示。可以这样尝试：退出账户、清除浏览器缓存后重新登录。若仍未显示，我会立即提交技术团队处理。"], ["Hey [Name], the [marketing ad] we launched has a typo in the key message, which might affect brand perception. Should we pause the ad to fix the typo, or leave it running and correct it in the next batch of ads?", "嗨 [姓名]，我们投放的 [营销广告] 核心信息中有一处拼写错误，可能影响品牌形象。我们是暂停广告修正错误，还是继续投放并在下次广告中更正？"], ["Hi [Team Member], the [vendor] can’t meet the quality standards we agreed on for the [materials]. Should we give them a chance to rework the materials, or terminate the contract and find a new vendor?", "嗨 [团队成员]，[供应商] 提供的 [材料] 未达到我们约定的质量标准。我们是给他们机会重新制作材料，还是终止合同寻找新供应商？"], ["Dear [First Name], the [team] is confused about the priorities for this week’s tasks. Should we hold a 15-minute sync to clarify which tasks are urgent, or send a written update listing task priorities and deadlines?", "尊敬的 [名]，团队对本周任务的优先级存在困惑。我们是开 15 分钟同步会明确紧急任务，还是发送书面通知列出任务优先级和截止日期？"], ["Hey [Customer], you received a [product] with a minor scratch on the surface. We can send a replacement with free shipping, or offer a 15% discount if you’re willing to keep the current one. Which option do you prefer?", "嗨 [客户]，你收到的 [产品] 表面有一处小划痕。我们可以免费寄送替换品，或者若你愿意保留当前产品，可提供 15% 折扣。你更倾向哪种选择？"], ["Hi [Name], the [server] backup failed last night, and we might lose some recent files. Should we use the previous week’s backup and re-enter the missing data, or ask the IT team to attempt data recovery from the failed backup?", "嗨 [姓名]，昨晚 [服务器] 备份失败，可能丢失部分近期文件。我们是使用上周的备份并重新录入缺失数据，还是让 IT 团队尝试从失败的备份中恢复数据？"], ["Dear [Team Member], the [client] is asking for additional revisions to the [design] that are outside the original scope. Should we agree to the revisions and charge extra, or explain the scope limits and offer to adjust the plan for a fee?", "尊敬的 [团队成员]，[客户] 要求对 [设计稿] 进行原范围外的额外修改。我们是同意修改并额外收费，还是说明范围限制并提出付费调整方案？"], ["Hey [First Name], the [event] registration link isn’t working for some attendees, leading to complaints. Should we share a new alternative link via email, or troubleshoot the original link with the tech team to fix it?", "嗨 [名]，部分参会者反映 [活动] 报名链接无法使用，已收到投诉。我们是通过邮件分享新的备用链接，还是让技术团队排查原链接并修复？"], ["Hi [Customer], the [app] crashes when you try to save your progress. Let’s check if you’re using the latest version—if not, update it first. If the problem continues, send me a screenshot of the error message, and I’ll forward it to our dev team.", "嗨 [客户]，尝试保存进度时 [应用] 会崩溃。先检查是否使用最新版本，若未更新请先更新。若问题仍存在，发送错误提示截图给我，我会转发给开发团队。"], ["Dear [Name], the [supplier] is asking for a 50% deposit upfront instead of the agreed 30%. Should we negotiate to stick to the original terms, or agree to the higher deposit if they can shorten the delivery time?", "尊敬的 [姓名]，[供应商] 要求预付 50% 定金，而非约定的 30%。我们是协商坚持原条款，还是在他们缩短交付时间的前提下同意提高定金比例？"], ["Hey [Team Member], the [report] has conflicting data from two different departments, making it hard to draw conclusions. Should we meet with both departments to resolve the conflict, or use the more recent data and note the discrepancy in the report?", "嗨 [团队成员]，[报告] 中两个部门提供的数据存在冲突，难以得出结论。我们是与两个部门开会解决冲突，还是使用较新的数据并在报告中注明差异？"], ["Hi [First Name], the [product] warranty claim you submitted was rejected because the issue is due to improper use. Should we explain the rejection reason in detail and offer a paid repair option, or make an exception and cover the repair as a goodwill gesture?", "嗨 [名]，你提交的 [产品] 保修申请被拒绝，因为问题由不当使用导致。我们是详细说明拒绝原因并提供付费维修选项，还是作为善意举措特例批准免费维修？"], ["Dear [Customer], the [delivery] was delayed because of bad weather, and your [product] will arrive 2 days later than expected. To make up for it, we can offer a free 1-month extension of your [service] or a $10 store credit—let us know your choice.", "尊敬的 [客户]，因天气原因配送延误，你的 [产品] 将比预期晚 2 天送达。为表示歉意，我们可提供 [服务] 免费延期 1 个月或 10 美元店铺信用额 —— 告知我们你的选择即可。"], ["Hey [Name], the [team member] assigned to handle client follow-ups is swamped, leading to delayed responses. Should we reassign some follow-ups to another team member, or extend the client response window temporarily?", "嗨 [姓名]，负责客户跟进的 [团队成员] 工作过载，导致回复延迟。我们是将部分跟进任务重新分配给其他成员，还是暂时延长客户回复时限？"], ["Hi [Team Member], the [website]’s checkout process is taking too long, and many customers are abandoning their carts. Should we simplify the checkout steps (e.g., remove unnecessary fields), or add a “guest checkout” option to speed it up?", "嗨 [团队成员]，[网站] 结账流程耗时过长，许多客户放弃购物车。我们是简化结账步骤（如删除非必要字段），还是添加 “游客结账” 选项提高速度？"], ["Dear [First Name], the [client] is unhappy with the project progress because of our delayed deliverables. Should we present a revised timeline with clear milestones, or offer a discount on the final fee to apologize for the delay?", "尊敬的 [名]，因我们的交付物延迟，[客户] 对项目进度不满。我们是提交包含明确里程碑的修订时间表，还是在最终费用上提供折扣以表歉意？"], ["Hey [Customer], you can’t find the [product] you ordered in your delivery package. First, check if the package has any hidden compartments—sometimes small items are placed there. If it’s still missing, we’ll start a delivery investigation and send a replacement immediately.", "嗨 [客户]，你在配送包裹中找不到订购的 [产品]。首先检查包裹是否有隐藏隔层 —— 小件商品有时会放在那里。若仍未找到，我们会启动配送调查并立即寄送替换品。"], ["Hi [Name], the [marketing campaign] targeting young adults isn’t reaching the right audience. Should we adjust the platform (e.g., switch from Facebook to TikTok), or refine the ad content to better match their interests?", "嗨 [姓名]，针对年轻人的 [营销活动] 未触达目标受众。我们是调整投放平台（如从 Facebook 切换到 TikTok），还是优化广告内容以更贴合他们的兴趣？"], ["Dear [Team Member], the [invoice] number on the payment receipt doesn’t match any of our invoices, so we can’t track which order it’s for. Should we contact the client to confirm the correct invoice number, or search our system using their name and order date?", "尊敬的 [团队成员]，付款凭证上的 [发票] 编号与我们的任何发票都不匹配，无法追踪对应订单。我们是联系客户确认正确发票编号，还是通过他们的姓名和下单日期在系统中搜索？"], ["Hey [First Name], the [product] sample we sent to the client has a functional defect. Should we send a new, tested sample right away, or first investigate the defect cause to ensure it doesn’t happen again?", "嗨 [名]，寄给客户的 [产品] 样品存在功能缺陷。我们是立即寄送经过测试的新样品，还是先调查缺陷原因以确保不再发生？"], ["Hi [Customer], the [service] you’re using is experiencing slow load times during peak hours. Our team is working to upgrade the servers, and it should be fixed in 3 days. In the meantime, would you prefer to use our mobile app (which is faster) or wait for the server upgrade?", "嗨 [客户]，你使用的 [服务] 在高峰时段加载缓慢。我们团队正在升级服务器，预计 3 天内修复。在此期间，你更倾向使用加载更快的移动应用，还是等待服务器升级？"], ["Dear [Name], the [team] disagrees on whether to use [Tool A] or [Tool B] for project management. Should we test both tools for a week and compare their performance, or let the team lead decide based on their experience?", "尊敬的 [姓名]，团队在项目管理工具选择上存在分歧，有人倾向 [工具 A]，有人倾向 [工具 B]。我们是测试两款工具一周后对比性能，还是让团队负责人根据经验决定？"], ["Hey [Team Member], the [supplier] informed us they can only deliver half the [materials] by the deadline, and the rest will arrive a week later. Should we proceed with the half delivery and adjust the project schedule, or wait for the full delivery and ask the client for an extension?", "嗨 [团队成员]，[供应商] 告知只能在截止日期前交付一半 [材料]，剩余部分一周后送达。我们是先用一半材料推进项目并调整时间表，还是等待全额交付并请求客户延期？"], ["Hi [First Name], the [client presentation] slides have inconsistent branding (e.g., different logo sizes). Should we spend an hour standardizing the branding now, or note the issue and fix it after the presentation if the client doesn’t mention it?", "嗨 [名]，[客户演示] 幻灯片的品牌元素不一致（如 logo 尺寸不同）。我们是现在花一小时统一品牌风格，还是先记录问题，若客户未提及则在演示后修正？"], ["Dear [Customer], the [refund] you received is less than expected because of a processing fee we forgot to mention. We apologize for the oversight and will send the remaining amount via your preferred method—just let us know if you want it via bank transfer or store credit.", "尊敬的 [客户]，你收到的 [退款] 金额低于预期，因为我们忘了说明会扣除手续费。对此疏忽我们深表歉意，剩余金额将通过你偏好的方式寄送 —— 告知我们选择银行转账还是店铺信用额即可。"], ["Hey [Name], the [website]’s search function isn’t finding relevant results for common queries. Should we update the search algorithm to improve accuracy, or add a “frequently searched items” section to guide users?", "嗨 [姓名]，[网站] 搜索功能无法为常见查询找到相关结果。我们是更新搜索算法提高准确性，还是添加 “热门搜索” 板块引导用户？"], ["Hi [Team Member], the [project] is over budget because we spent more on [materials] than planned. Should we cut costs in other areas (e.g., reduce travel expenses), or ask the client for additional budget approval?", "嗨 [团队成员]，[项目] 超出预算，因为 [材料] 支出高于计划。我们是在其他领域削减成本（如减少差旅费用），还是请求客户批准额外预算？"], ["Dear [First Name], the [team member] who handled the client’s [order] left the company, and their notes are incomplete. Should we contact the client to reconfirm their requirements, or piece together the details from existing emails and system records?", "尊敬的 [名]，负责客户 [订单] 的 [团队成员] 已离职，且交接记录不完整。我们是联系客户重新确认需求，还是通过现有邮件和系统记录拼凑细节？"], ["Hey [Customer], the [product] you returned is damaged beyond repair, so we can’t process a full refund. We can offer a 70% refund, or a free replacement of the same product—whichever works better for you.", "嗨 [客户]，你退回的 [产品] 损坏严重无法修复，无法办理全额退款。我们可提供 70% 退款，或免费更换同款产品 —— 哪种方案更适合你？"], ["Hi [Name], the [marketing email] we sent was marked as spam by many recipients, hurting our deliverability. Should we revise the subject line and content to avoid spam filters, or segment the email list to target more engaged users first?", "嗨 [姓名]，我们发送的 [营销邮件] 被许多收件人标记为垃圾邮件，影响送达率。我们是修改主题和内容以避开垃圾邮件过滤器，还是先细分邮件列表，优先向活跃度高的用户发送？"], ["Dear [Team Member], the [vendor] is threatening to cancel the order if we don’t pay the deposit within 24 hours. Should we process the deposit immediately to secure the order, or negotiate for a longer payment window?", "尊敬的 [团队成员]，[供应商] 威胁若 24 小时内不支付定金将取消订单。我们是立即支付定金保住订单，还是协商延长付款期限？"], ["Hey [First Name], the [client] wants to change the project scope halfway through, which will add 2 weeks of work. Should we document the scope change and ask for a formal approval, or verbally agree and adjust the timeline without paperwork?", "嗨 [名]，[客户] 想在项目中途变更范围，这将增加 2 周工作量。我们是书面记录范围变更并请求正式批准，还是口头同意并调整时间表而不做书面记录？"], ["Hi [Customer], the [app] isn’t compatible with your old device model. We can suggest a similar, compatible app from our partner, or offer a full refund if you no longer want to use our service. What do you prefer?", "嗨 [客户]，[应用] 与你的旧设备型号不兼容。我们可以推荐合作伙伴的一款兼容替代应用，或者若你不再想使用我们的服务，可提供全额退款。你更倾向哪种？"], ["Dear [Name], the [team] is falling behind on the [project] because some tasks are more complex than expected. Should we break down the complex tasks into smaller steps, or add more team members to help with the workload?", "尊敬的 [姓名]，因部分任务比预期更复杂，[团队] 的 [项目] 进度滞后。我们是将复杂任务拆分为更小步骤，还是增加团队成员分担工作量？"], ["Hey [Team Member], the [product] label has the wrong ingredients list, which could be a safety issue. Should we recall all shipped products to replace the labels, or send correction stickers to customers with a warning note?", "嗨 [团队成员]，[产品] 标签上的成分表有误，可能存在安全隐患。我们是召回所有已发货产品更换标签，还是向客户寄送修正贴纸并附上警示说明？"], ["Hi [First Name], the [client] is asking for a detailed breakdown of the project costs, which we didn’t prepare in advance. Should we compile the breakdown now and send it within 24 hours, or explain that we can provide it by the end of the week to ensure accuracy?", "嗨 [名]，[客户] 要求提供项目费用的详细明细，而我们此前未准备。我们是现在整理明细并 24 小时内发送，还是说明为确保准确需在本周末前提供？"], ["Dear [Customer], the [delivery] driver left your [product] at the wrong address. We’ve contacted the driver to retrieve it, and they’ll redeliver it tomorrow. Would you like to track the redelivery in real time, or receive a confirmation call when it arrives?", "尊敬的 [客户]，配送员将你的 [产品] 送错了地址。我们已联系配送员取回商品，明天会重新配送。你希望实时跟踪重新配送进度，还是在送达时收到确认电话？"], ["Hey [Name], the [spreadsheet] for tracking expenses has formulas that aren’t calculating correctly, leading to wrong totals. Should we debug the formulas one by one, or replace the faulty formulas with simpler ones to avoid errors?", "嗨 [姓名]，跟踪费用的 [电子表格] 中公式计算错误，导致总额不准确。我们是逐一调试公式，还是用更简单的公式替换有问题的部分以避免错误？"], ["Hi [Team Member], the [client] is unsatisfied with the [report] because it lacks data on their competitors. Should we add a competitor analysis section and resend the report, or schedule a call to explain why we focused on internal data instead?", "嗨 [团队成员]，[客户] 对 [报告] 不满意，因为缺少竞争对手数据。我们是添加竞争对手分析部分后重新发送报告，还是安排通话解释为何我们侧重内部数据？"], ["Dear [First Name], the [supplier] can’t deliver the [materials] on time, but they offered a 10% discount as compensation. Should we accept the discount and adjust the project timeline, or decline and find another supplier who can meet the deadline?", "尊敬的 [名]，[供应商] 无法按时交付 [材料]，但提出以 10% 折扣作为补偿。我们是接受折扣并调整项目时间表，还是拒绝并寻找能按时交付的其他供应商？"], ["Hey [Customer], you’re having trouble logging into your account even after resetting the password. Let’s verify your registered email address first—sometimes users accidentally use a different email. If that’s correct, we’ll escalate your issue to our account support team for a manual reset.", "嗨 [客户]，即使重置密码后你仍无法登录账户。我们先核实你的注册邮箱 —— 有时用户会不小心使用其他邮箱注册。若邮箱无误，我们会将你的问题提交账户支持团队进行手动重置。"], ["Hi [Name], the [marketing campaign]’s landing page isn’t converting visitors into customers. Should we redesign the page to make the call-to-action more prominent, or run A/B tests with different page layouts to find what works?",
