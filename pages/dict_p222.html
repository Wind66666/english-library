.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.doc{background:rgba(52,211,153,.12);color:#4ecfa0}
.badge.pdf{background:rgba(248,113,113,.12);color:#f08c8c}

.vtoggle{font-size:12px;color:var(--brand);cursor:pointer;user-select:none;font-weight:600}
.vtoggle:hover{text-decoration:underline}
.variants{display:none;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:9px}
.variants.open{display:flex}
.variants a{font-size:12.5px;color:var(--sub)}
.variants a::before{content:"↳ ";color:#4b5580}
.variants a:hover{color:var(--brand)}
.empty{text-align:center;color:var(--sub);padding:60px 0}

.art-header{background:var(--panel);border-bottom:1px solid var(--line);
padding:28px 16px 24px}

.art-header .back:hover{color:var(--brand)}
.art-header .back::before{content:"← "}
.art-header h1{margin:14px 0 10px;font-size:21px;line-height:1.5;font-weight:800;color:#dfe4f5}
.art-header .src{font-size:12px;color:#5d6479;word-break:break-all}
.art-header .meta{color:var(--sub);margin-top:10px}
.art-header .meta a{color:var(--brand);font-weight:600}
.art-header .meta .note{color:#e8b667}
.content{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:30px 36px;margin-top:20px;font-size:15.5px;
line-height:2.1;white-space:pre-wrap;word-break:break-word;color:#d5dae8}

.list{grid-template-columns:1fr}header{padding:38px 16px 32px}header h1{font-size:23px}}
/* ---- 默写练习 ---- */
.dict-link{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px;font-weight:600}
.dict-link:hover{background:rgba(139,156,249,.25)}
.dict-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:34px 36px;margin-top:20px}
.dict-center{text-align:center}
.dict-progress{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.dict-progress .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dict-progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b9cf9,#4ecfa0);

.dict-input{width:100%;padding:14px 16px;font-size:16px;color:var(--ink);

transition:border-color .15s ease,box-shadow .15s ease;font-family:inherit}
.dict-input:focus{border-color:#4b5580;box-shadow:0 0 0 3px rgba(139,156,249,.15)}
.dict-input.ok{border-color:#34d399}
.dict-input.bad{border-color:#f08c8c}
.dict-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
cursor:pointer;font-family:inherit;transition:opacity .15s ease}
.btn:hover{opacity:.85}
.btn-main{background:linear-gradient(120deg,#8b9cf9,#6d7ff0);color:#fff}
.btn-ghost{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.dict-fb{margin-top:18px;font-size:15px;line-height:1.9;display:none;
padding:14px 18px;border-radius:12px}
.dict-fb.show{display:block}
.dict-fb.good{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25)}
.dict-fb.near{background:rgba(232,182,103,.10);border:1px solid rgba(232,182,103,.3)}
.dict-fb.wrong{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.25)}
.dict-fb .ans{display:block;color:#dfe4f5;font-weight:600;margin-top:4px}
.dict-big{font-size:17px;font-weight:700;color:#dfe4f5;margin:14px 0 22px;line-height:1.8}
.dict-stats{display:flex;gap:14px;justify-content:center;margin:22px 0 28px;flex-wrap:wrap}
.dict-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 26px;min-width:110px}
.dict-stat b{display:block;font-size:24px;font-weight:800}
.dict-stat span{font-size:12px;color:var(--sub)}
.dict-stat.g b{color:#4ecfa0}.dict-stat.n b{color:#e8b667}.dict-stat.w b{color:#f08c8c}
.dict-wronglist{margin-top:26px;text-align:left}
.dict-wronglist h3{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.dict-wronglist .wp{padding:10px 14px;border:1px solid var(--line);border-radius:10px;
margin-bottom:8px;font-size:13.5px;line-height:1.8}
.dict-wronglist .wp b{color:#f08c8c}
.dict-wronglist .wp span{display:block;color:var(--sub)}
.dict-wronglist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600}
.dict-opt{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap}
.dict-opt label{display:flex;align-items:center;gap:7px;background:var(--panel);
border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13.5px;
cursor:pointer;color:var(--sub)}
.dict-opt input{accent-color:#8b9cf9}
.dict-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dict-chips .chip{cursor:pointer}
.dict-chips .chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
@media (max-width:600px){.dict-wrap{padding:22px 16px}.dict-zh{font-size:18px}}
/* ---- 学习进度 & 归档 ---- */
.pctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:var(--panel);color:#5d6479;
transition:all .12s ease}
.st:hover{opacity:.8}
.st-learning{background:rgba(139,156,249,.16);border-color:rgba(139,156,249,.4);color:#a5b1fb}
.st-done{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.35);color:#4ecfa0}
.arch-btn{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:transparent;color:#5d6479}
.arch-btn:hover{color:var(--sub)}
.arch-btn.on{background:rgba(232,182,103,.13);border-color:rgba(232,182,103,.4);color:#e8b667}
.item.archived{opacity:.5}
.item.archived:hover{opacity:.8}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 0}
.filter-chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;
font-size:12px;padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.filter-chip:hover{border-color:#39415e}
.filter-chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.pbar-outer{max-width:580px;margin:20px auto 0;height:8px;border-radius:4px;
background:var(--panel);border:1px solid var(--line);overflow:hidden}
.pbar-outer i{display:block;height:100%;width:0;border-radius:4px;
background:linear-gradient(90deg,#8b9cf9,#4ecfa0);transition:width .3s ease}
.psum{margin:10px 0 0;font-size:12.5px;color:var(--sub)}
.psum b{color:#c9d4ff;font-weight:600}
footer .io{margin-top:8px}
footer .io a,footer .io label{cursor:pointer;color:#5d6479}
footer .io a:hover,footer .io label:hover{color:var(--brand)}
footer .io input{display:none}
.art-pctrl{margin-top:12px}
.dict-hist{color:#8f96ab;font-size:13px;margin-top:14px}
.dict-hist b{color:#a5b1fb}
/* ---- 复习中心 & 收藏 ---- */
.btn-fav.on{color:#e8b667;border-color:rgba(232,182,103,.45)}
.rtabs{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.rtab{background:var(--panel);border:1px solid var(--line);color:#aab2cc;font-size:13px;

.wp-meta{font-size:11.5px;color:#5d6479;margin-top:7px;display:flex;gap:14px;

.wp-meta b:hover{color:#f08c8c}

.chip.rlink{cursor:pointer;transition:all .12s ease}

 to ensure that we are not involved in any legal disputes.", "你们的产品有知识产权问题吗？我们需要确保不卷入任何法律纠纷。"], ["Can you provide relevant intellectual property certificates, such as patents or trademarks?", "你能提供相关的知识产权证书，如专利或商标吗？"], ["What measures do you take to protect your intellectual property and prevent counterfeiting?", "你们采取什么措施保护知识产权和防止假冒？"], ["Are your products compliant with international safety and quality certifications, such as CE or UL?", "你们的产品符合国际安全和质量认证吗，比如 CE 或 UL 认证？"], ["How long does it take to obtain these certifications for new products?", "新产品获得这些认证需要多长时间？"], ["Can you provide documentation to prove that your products meet the required certifications?", "你能提供文件证明你们的产品符合所需认证吗？"], ["If there are any changes in product design or production process, how will you ensure continued compliance with certifications?", "如果产品设计或生产过程有任何变化，你们将如何确保持续符合认证要求？"], ["Do you have experience in dealing with intellectual property disputes in international trade?", "你们有处理国际贸易中知识产权纠纷的经验吗？"], ["We plan to register the product in our local market. Can you assist us with the necessary procedures regarding intellectual property?", "我们计划在当地市场注册产品。你能在知识产权方面协助我们办理必要手续吗？"], ["Are there any specific intellectual property requirements or considerations in your country that we should be aware of?", "在你们国家有我们应该注意的特定知识产权要求或注意事项吗？"], ["What kind of after - sales service do you offer? For example, repair, replacement, or technical support.", "你们提供什么样的售后服务？比如维修、更换或技术支持。"], ["How long does it usually take to respond to a customer's after - sales service request?", "通常需要多长时间回应客户的售后服务请求？"], ["Do you have a local service center or authorized repair agents in our area?", "你们在我们地区有当地服务中心或授权维修代理吗？"], ["What's the process for customers to request after - sales service? Can you provide a detailed guide?", "客户请求售后服务的流程是什么？你能提供详细指南吗？"], ["If a product needs to be repaired, how will you arrange for the transportation of the product to the repair center?", "如果产品需要维修，你们将如何安排产品运输到维修中心？"], ["Are spare parts easily available for product repair? What's the lead time for obtaining spare parts?", "产品维修的备件容易获得吗？获得备件的交货期是多长？"], ["Do you offer training on product maintenance and repair to our technical staff?", "你们为我们的技术人员提供产品维护和维修培训吗？"], ["How do you ensure the quality of after - sales service and customer satisfaction?", "你们如何确保售后服务质量和客户满意度？"], ["In case of product recall due to quality issues, what actions will you take to minimize the impact on customers?", "如果因质量问题召回产品，你们将采取什么行动将对客户的影响降至最低？"], ["Can you provide a warranty extension service for an additional fee?", "你们能提供付费的保修延长服务吗？"], ["Are you interested in appointing us as your agent in our region?", "你们有兴趣指定我们为你们在我们地区的代理吗？"], ["What are the requirements and qualifications for becoming your agent?", "成为你们的代理有哪些要求和资质？"], ["Can you explain the rights and obligations of the agent in the agency agreement?", "你能解释一下代理协议中代理的权利和义务吗？"], ["How do you plan to support your agents in terms of marketing and sales?", "你们计划在营销和销售方面如何支持你们的代理？"], ["What's the commission structure for agents? How is it calculated?", "代理的佣金结构是怎样的？如何计算？"], ["Are there any exclusive agency rights available? If so, what are the conditions?", "有独家代理权利吗？如果有，条件是什么？"], ["We are considering a joint venture with your company. What are your thoughts on this cooperation model?", "我们正在考虑与你们公司建立合资企业。你对这种合作模式有什么看法？"], ["Can you introduce the advantages and challenges of the joint venture cooperation model?", "你能介绍一下合资企业合作模式的优势和挑战吗？"], ["In a joint venture, how will the management and decision - making be arranged?", "在合资企业中，管理和决策将如何安排？"], ["What kind of resources and contributions do you expect each party to make in a joint venture?", "在合资企业中，你们期望各方做出什么样的资源和贡献？"], ["Do you plan to participate in any international trade fairs or exhibitions in the near future?", "你们近期有计划参加任何国际贸易展会或展览吗？"], ["Which trade fairs are most effective for promoting your products in the international market?", "哪些贸易展会对在国际市场推广你们的产品最有效？"], ["Can you share your experience and tips for participating in trade fairs?", "你能分享一下参加贸易展会的经验和技巧吗？"], ["How do you usually showcase your products at trade fairs to attract more attention?", "你们通常如何在贸易展会上展示产品以吸引更多关注？"], ["Do you offer any special promotions or discounts during trade fairs?", "你们在贸易展会期间提供任何特别促销或折扣吗？"], ["We are organizing a product launch event. Would you like to participate as a partner?", "我们正在组织一个产品发布会。你们想作为合作伙伴参加吗？"], ["What kind of marketing and promotional activities do you usually conduct before and after a trade fair?", "你们在贸易展会前后通常进行什么样的营销和促销活动？"], ["Can you help us promote our products in your local market through your marketing channels?", "你们能通过你们的营销渠道在你们当地市场帮助我们推广产品吗？"], ["How do you measure the effectiveness of your promotional activities at trade fairs?", "你们如何衡量在贸易展会上促销活动的效果？"], ["We want to cooperate with you on a co - branded promotional campaign. What do you think?", "我们想和你们合作开展联合品牌推广活动。你怎么看？"], ["What kinds of risks do you think we may encounter in this international trade cooperation?", "你认为在这次国际贸易合作中我们可能遇到哪些风险？"], ["How do you assess and manage risks such as currency fluctuations, political instability, and trade policy changes?", "你们如何评估和管理货币波动、政治不稳定和贸易政策变化等风险？"], ["Do you have any strategies in place to mitigate the impact of risks on our business cooperation?", "你们有什么策略来减轻风险对我们业务合作的影响吗？"], ["In case of unexpected events, such as natural disasters or pandemics, how will we ensure the continuity of our cooperation?", "如果发生意外事件，如自然灾害或流行病，我们将如何确保合作的连续性？"], ["Have you considered purchasing trade credit insurance to protect against payment defaults?", "你们考虑过购买贸易信用保险以防范付款违约吗？"], ["How do you monitor and evaluate the creditworthiness of your business partners?", "你们如何监测和评估商业伙伴的信用状况？"], ["Are there any contingency plans in case of supply chain disruptions?", "如果发生供应链中断，有应急计划吗？"], ["We are concerned about the potential risks of intellectual property infringement. How do you plan to address this issue?", "我们担心知识产权侵权的潜在风险。你们计划如何解决这个问题？"], ["Can you provide a risk assessment report for this coopera cts in the near future?", "市场趋势显示，对智能互联产品的偏好日益增长。你们近期有开发这类产品的计划吗？"], ["We've noticed that products with customizable user interfaces are more popular. Can you offer this option for your products?", "我们注意到，具有可定制用户界面的产品更受欢迎。你们能为产品提供这个选项吗？"], ["Based on our market analysis, there is a potential for a new product category that combines [Feature A] and [Feature B]. Are you interested in exploring this with us?", "根据我们的市场分析，结合 [特性 A] 和 [特性 B] 的新产品类别有潜力。你们有兴趣和我们一起探索这个吗？"], ["Our research shows that products with longer battery life are highly sought - after. Can you improve the battery performance of your products?", "我们的研究表明，电池续航时间更长的产品很受欢迎。你们能改善产品的电池性能吗？"], ["The market is shifting towards products with modular designs. Can you adapt your manufacturing process to offer modular products?", "市场正朝着模块化设计的产品转变。你们能调整生产流程以提供模块化产品吗？"], ["We've identified a niche market for [Specific Product]. Do you have the capacity to produce a specialized version of your product for this market?", "我们发现了 [特定产品] 的细分市场。你们有能力为这个市场生产产品的专业版本吗？"], ["In our region, products with local language support are more likely to succeed. Can you provide multilingual interfaces for your products?", "在我们地区，有本地语言支持的产品更有可能成功。你们能为产品提供多语言界面吗？"], ["Our market study reveals that products with enhanced security features are in great demand. How can you strengthen the security of your products?", "我们的市场研究显示，具有增强安全特性的产品需求很大。你们如何加强产品的安全性？"], ["Considering the current market competition, we suggest collaborating on a marketing campaign to differentiate our products. What's your opinion?", "考虑到当前的市场竞争，我们建议合作开展营销活动以区分我们的产品。你怎么看？"], ["Instead of the traditional distribution model, how about we explore an online - only distribution strategy?", "除了传统的分销模式，我们探讨一下仅在线分销策略怎么样？"], ["We propose a revenue - sharing model for the sales of our jointly promoted products. What do you think?", "我们提议对联合推广产品的销售采用收益共享模式。你怎么看？"], ["Can we consider a cross - promotion with other complementary products in the market to expand our customer base 注意到产品的性能会随着时间下降。你们能调查并提供解决方案吗？"], ["We're interested in exploring the possibility of private - label production for your products. What are your terms?", "我们有兴趣探索为你们产品进行贴牌生产的可能性。你们的条件是什么？"], ["Can you offer a loyalty program for our long - term orders? For example, cumulative discounts or bonus products.", "你们能为我们的长期订单提供忠诚度计划吗？比如累积折扣或赠品。"], ["We'd like to negotiate a preferential price for future repeat orders. How can we structure this?", "我们想为未来的重复订单协商一个优惠价格。我们该如何构建这个方案？"], ["Instead of a fixed - price contract, can we consider a price - adjustment clause based on market fluctuations?", "除了固定价格合同，我们能考虑一个基于市场波动的价格调整条款吗？"], ["We want to include a performance - based incentive in the contract. For example, if the product exceeds certain quality standards, we'll pay a premium.", "我们想在合同中加入基于绩效的激励措施。例如，如果产品超过某些质量标准，我们将支付溢价。"], ["Can we negotiate a contract term that allows for early termination under certain conditions?", "我们能协商一个在某些条件下允许提前终止的合同条款吗？"], ["We'd like to have a say in the selection of raw materials used in the production of our ordered products. Is this possible?", "我们想在订购产品生产所用原材料的选择上有发言权。这可能吗？"], ["Can you provide a detailed production schedule for our order, including key milestones?", "你们能为我们的订单提供详细的生产时间表，包括关键节点吗？"], ["We want to ensure that the intellectual property rights related to any customized features of the product are clearly defined in the contract.", "我们希望确保产品任何定制功能相关的知识产权在合同中得到明确界定。"], ["Can we negotiate a contract that includes a clause for technology transfer in case of long - term cooperation?", "如果是长期合作，我们能协商一个包含技术转让条款的合同吗？"], ["We've noticed that your product's marketing materials are not in line with our local culture. Can you make adaptations?", "我们注意到你们产品的营销材料不符合我们当地文化。你们能做出调整吗？"], ["The product demonstration you provided was not comprehensive enough. Can you arrange a more detailed one?", "你们提供的产品演示不够全面。你们能安排一个更详细的吗？"], ["We need more accurate product data, such as energy consumption and environmental impact figures. Can you supply this?", "我们需要更准确的产品数据，比如能耗和环境影响数据。你们能提供这些吗？"], ["The product's compatibility with our existing systems is a concern. Can you conduct compatibility tests and provide reports?", "产品与我们现有系统的兼容性是个问题。你们能进行兼容性测试并提供报告吗？"], ["We want to explore the possibility of co - creating a product with you that is tailored to our local market.", "我们想探索与你们共同创造一款针对我们当地市场的产品的可能性。"], ["Can you offer a special package deal for our first - time large - scale order?", "对于我们首次大规模订单，你们能提供特别的套餐优惠吗？"], ["We'd like to negotiate a commission - based payment for our sales team for promoting your products.", "我们想为我们的销售团队推广你们产品协商基于佣金的付款方式。"], ["Instead of a lump - sum payment, can we split the payment for the product into several installments over a specific period?", "除了一次性付款，我们能在特定时期内将产品付款分成几期支付吗？"], ["We need a more detailed product maintenance plan from you, including maintenance intervals and costs.", "我们需要你们提供更详细的产品维护计划，包括维护间隔和成本。"], ["The product's after - sales service response time in our area is too long. How can you improve this?", "产品在我们地区的售后服务响应时间太长了。你们如何改善这个问题？"], ["We've received complaints from our customers about the product's user - friendliness. Can you improve the product design in this aspect?", "我们从客户那里收到了关于产品易用性的投诉。你们能在这方面改进产品设计吗？"], ["The product's price in our market is not competitive compared to similar imported products. How can we work together to adjust the price?", "与类似进口产品相比，你们产品在我们市场的价格没有竞争力。我们如何共同努力调整价格？"], ["We want to collaborate with you on a market - entry strategy for your new product in our region.", "我们想与你们合作制定你们新产品在我们地区的市场进入策略。"], ["Can you provide market - specific product training for our local employees?", "你们能为我们当地员工提供针对特定市场的产品培训吗？"], ["We've noticed that your product's packaging is not visually appealing in our market. Can you redesign it?", "我们注意到你们产品的包装在我们市场上视觉吸引力不足。你们能重新设计吗？"], ["The product's warranty terms are not clear enough. Can you clarify and potentially extend them?", "产品的保修条款不够清晰。你们能澄清并有可能延长它们吗？"], ["We want to negotiate a contract that includes a clause for continuous product improvement based on our feedback.", "我们想协商一个包含根据我们反馈进行持续产品改进条款的合同。"], ["Can you offer a risk - sharing arrangement in case of product recalls or market failures?", "如果发生产品召回或市场失败，你们能提供风险分担安排吗？"], ["We need more frequent communication from your side regarding the production progress of our order.", "我们需要你们更频繁地沟通我们订单的生产进度。"], ["The product's weight is an issue for our transportation. Can you reduce the weight without sacrificing quality?", "产品的重量对我们的运输是个问题。你们能在不牺牲质量的前提下减轻重量吗？"], ["We've identified a potential partnership opportunity with a local distributor in our area. Can you support this cooperation?", "我们在我们地区发现了与当地经销商的潜在合作机会。你们能支持这种合作吗？"], ["Can you provide a case - study of how your product has successfully solved similar problems for other customers?", "你们能提供一个案例研究，说明你们的产品如何为其他客户成功解决类似问题吗？"], ["We want to explore the possibility of using your product as a component in our own final product. What are your thoughts?", "我们想探索将你们的产品用作我们最终产品组件的可能性。你们怎么看？"], ["The product's size is not suitable for our storage facilities. Can you offer different size options?", "产品的尺寸不适合我们的存储设施。你们能提供不同尺寸选项吗？"], ["We'd like to negotiate a contract that includes a non - compete clause for a certain period.", "我们想协商一个包含一定时期内非竞争条款的合同。"], ["Can you provide a trial period for your product in our market before a full - scale launch?", "在全面推出之前，你们能在我们市场为产品提供一个试用期吗？"], ["We need more information about the product's manufacturing process, especially in terms of quality control.", "我们需要更多关于产品制造过程的信息，特别是在质量控制方面。"], ["The product's functionality in extreme weather conditions is a concern. Can you conduct relevant tests and provide data?", "产品在极端天气条件下的功能是个问题。你们能进行相关测试并提供数据吗？"], ["We want to collaborate with you on a social - responsibility project related to the production and use of your product.", "我们想与你们合作开展一个与你们产品生产和使用相关的社会责任项目。"], ["Can you offer a price - lock option for a certain quantity of products over a specific period?", "你们能在特定时期内为一定数量的产品提供价格锁定选项吗？"], ["We've received feedback from our customers that the product's noise level is too high. Can you reduce it?", "我们从客户那里收到反馈，产品的噪音水平太高了。你们能降低吗？"], ["The product's durability in our harsh - use environment is a question. Can you improve the product's materials or design?", "产品在我们恶劣使用环境下的耐用性是个问题。你们能改进产品的材料或设计吗？"], ["We want to explore the possibility of a revenue - guarantee model for our sales of your products.", "我们想探索为我们销售你们产品的收入保证模式的可能性。"], ["Can you provide a dedicated customer - support team for our company to handle any product - related issues?", "你们能为我们公司提供一个专门的客户支持团队来处理任何与产品相关的问题吗？"], ["We've noticed that your product's software update process is cumbersome. Can you simplify it?", "我们注意到你们产品的软件更新过程很麻烦。你们能简化一下吗？"], ["The product's appearance design is not in line with our local aesthetic preferences. Can you make changes?", "产品的外观设计不符合我们当地的审美偏好。你们能做出改变吗？"], ["We want to negotiate a contract that includes a clause for knowledge - sharing in the field of product technology.", "我们想协商一个包含产品技术领域知识共享条款的合同。"], ["Can you offer a trade - in program for our customers who want to upgrade to your new products?", "你们能为想升级到你们新产品的客户提供以旧换新计划吗？"]];window.__KEY__="外贸全英交流399句蓝";window.__TITLE__="外贸全英交流399句蓝";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
