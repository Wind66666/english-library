<style>

.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.doc{background:rgba(52,211,153,.12);color:#4ecfa0}
.badge.pdf{background:rgba(248,113,113,.12);color:#f08c8c}
.charspill{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;

.vtoggle{font-size:12px;color:var(--brand);cursor:pointer;user-select:none;font-weight:600}
.vtoggle:hover{text-decoration:underline}
.variants{display:none;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:9px}
.variants.open{display:flex}
.variants a{font-size:12.5px;color:var(--sub)}

.art-header{background:var(--panel);border-bottom:1px solid var(--line);
padding:28px 16px 24px}

.art-header .back:hover{color:var(--brand)}

.art-header h1{margin:14px 0 10px;font-size:21px;line-height:1.5;font-weight:800;color:#dfe4f5}
.art-header .src{font-size:12px;color:#5d6479;word-break:break-all}
.art-header .meta{color:var(--sub);margin-top:10px}
.art-header .meta a{color:var(--brand);font-weight:600}
.art-header .meta .note{color:#e8b667}
.content{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:30px 36px;margin-top:20px;font-size:15.5px;

@media (max-width:600px){.content{padding:20px 16px;border-radius:14px}
.list{grid-template-columns:1fr}header{padding:38px 16px 32px}header h1{font-size:23px}}
/* ---- 默写练习 ---- */
.dict-link{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px;font-weight:600}
.dict-link:hover{background:rgba(139,156,249,.25)}
.dict-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:34px 36px;margin-top:20px}
.dict-center{text-align:center}
.dict-progress{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.dict-progress .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}

.dict-zh{font-size:21px;font-weight:700;color:#dfe4f5;line-height:1.7;margin:8px 0 26px}
.dict-input{width:100%;padding:14px 16px;font-size:16px;color:var(--ink);
background:var(--panel);border:1.5px solid var(--line);border-radius:12px;outline:none;
transition:border-color .15s ease,box-shadow .15s ease;font-family:inherit}
.dict-input:focus{border-color:#4b5580;box-shadow:0 0 0 3px rgba(139,156,249,.15)}
.dict-input.ok{border-color:#34d399}
.dict-input.bad{border-color:#f08c8c}
.dict-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
cursor:pointer;font-family:inherit;transition:opacity .15s ease}
.btn:hover{opacity:.85}
.btn-main{background:linear-gradient(120deg,#8b9cf9,#6d7ff0);color:#fff}
.btn-ghost{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.dict-fb{margin-top:18px;font-size:15px;line-height:1.9;display:none;
padding:14px 18px;border-radius:12px}
.dict-fb.show{display:block}
.dict-fb.good{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25)}
.dict-fb.near{background:rgba(232,182,103,.10);border:1px solid rgba(232,182,103,.3)}
.dict-fb.wrong{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.25)}
.dict-fb .ans{display:block;color:#dfe4f5;font-weight:600;margin-top:4px}
.dict-big{font-size:17px;font-weight:700;color:#dfe4f5;margin:14px 0 22px;line-height:1.8}
.dict-stats{display:flex;gap:14px;justify-content:center;margin:22px 0 28px;flex-wrap:wrap}
.dict-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 26px;min-width:110px}
.dict-stat b{display:block;font-size:24px;font-weight:800}
.dict-stat span{font-size:12px;color:var(--sub)}
.dict-stat.g b{color:#4ecfa0}.dict-stat.n b{color:#e8b667}.dict-stat.w b{color:#f08c8c}
.dict-wronglist{margin-top:26px;text-align:left}
.dict-wronglist h3{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.dict-wronglist .wp{padding:10px 14px;border:1px solid var(--line);border-radius:10px;
margin-bottom:8px;font-size:13.5px;line-height:1.8}
.dict-wronglist .wp b{color:#f08c8c}
.dict-wronglist .wp span{display:block;color:var(--sub)}
.dict-wronglist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600}
.dict-opt{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap}
.dict-opt label{display:flex;align-items:center;gap:7px;background:var(--panel);
border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13.5px;
cursor:pointer;color:var(--sub)}
.dict-opt input{accent-color:#8b9cf9}
.dict-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dict-chips .chip{cursor:pointer}
.dict-chips .chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
@media (max-width:600px){.dict-wrap{padding:22px 16px}.dict-zh{font-size:18px}}
/* ---- 学习进度 & 归档 ---- */
.pctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:var(--panel);color:#5d6479;
transition:all .12s ease}
.st:hover{opacity:.8}
.st-learning{background:rgba(139,156,249,.16);border-color:rgba(139,156,249,.4);color:#a5b1fb}
.st-done{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.35);color:#4ecfa0}
.arch-btn{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:transparent;color:#5d6479}
.arch-btn:hover{color:var(--sub)}
.arch-btn.on{background:rgba(232,182,103,.13);border-color:rgba(232,182,103,.4);color:#e8b667}
.item.archived{opacity:.5}
.item.archived:hover{opacity:.8}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 0}
.filter-chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;
font-size:12px;padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.filter-chip:hover{border-color:#39415e}
.filter-chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.pbar-outer{max-width:580px;margin:20px auto 0;height:8px;border-radius:4px;
background:var(--panel);border:1px solid var(--line);overflow:hidden}
.pbar-outer i{display:block;height:100%;width:0;border-radius:4px;
background:linear-gradient(90deg,#8b9cf9,#4ecfa0);transition:width .3s ease}
.psum{margin:10px 0 0;font-size:12.5px;color:var(--sub)}
.psum b{color:#c9d4ff;font-weight:600}
footer .io{margin-top:8px}
footer .io a,footer .io label{cursor:pointer;color:#5d6479}
footer .io a:hover,footer .io label:hover{color:var(--brand)}
footer .io input{display:none}
.art-pctrl{margin-top:12px}
.dict-hist{color:#8f96ab;font-size:13px;margin-top:14px}
.dict-hist b{color:#a5b1fb}
/* ---- 复习中心 & 收藏 ---- */
.btn-fav.on{color:#e8b667;border-color:rgba(232,182,103,.45)}
.rtabs{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.rtab{background:var(--panel);border:1px solid var(--line);color:#aab2cc;font-size:13px;
padding:8px 18px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}

.rsec{display:none}

.rlist{border-top:1px dashed var(--line);padding-top:14px;margin-top:16px}
.rlist .wp{padding:12px 16px;border:1px solid var(--line);border-radius:12px;

.rlist .wp span{display:block;color:var(--sub)}
.rlist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600;margin-top:2px}
.wp-meta{font-size:11.5px;color:#5d6479;margin-top:7px;display:flex;gap:14px;
align-items:center;flex-wrap:wrap}
.wp-meta b{cursor:pointer;color:#8f96ab;font-weight:600}
.wp-meta b:hover{color:#f08c8c}
.wp-meta .due{color:#e8b667}
.wp-meta .src{opacity:.8;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-hint{text-align:center;color:#5d6479;padding:28px 0;font-size:13.5px}
.chip.rlink{cursor:pointer;transition:all .12s ease}
.chip.rlink:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
/* ---- 阅读页朗读（TTS） ---- */
.content.lines{white-space:normal}
.ln{position:relative;padding:2px 8px 2px 36px;border-radius:6px;line-height:2.1}
.ln .spk{position:absolute;left:6px;top:50%;transform:translateY(-50%);
cursor:pointer;opacity:0;transition:opacity .12s ease;background:none;border:none;
color:#8b9cf9;font-size:14px;padding:2px 4px;line-height:1}
.ln:hover .spk{opacity:.85}
.ln .spk:hover{opacity:1}
.ln.cur{background:rgba(139,156,249,.10)}
.ln.cur .spk{opacity:1}
.ttsbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;

    <div id="start" class="dict-center">

      <div class="dict-actions">
        <button id="btnCheck" class="btn btn-main" onclick="check()">检查（Enter）</button>
        <button id="btnHint" class="btn btn-ghost" onclick="hint()">💡 提示</button>
        <button id="btnFav" class="btn btn-ghost btn-fav" onclick="favToggle()" title="收藏这句，之后可在复习中心查看">☆ 收藏</button>

        <button class="btn btn-ghost" onclick="skip()">跳过 ⏭</button>
        <button id="btnNext" class="btn btn-main" style="display:none" onclick="next()">下一句（Enter）→</button>
      </div>
      <div id="fb" class="dict-fb"></div>
    </div>

    <div id="result" style="display:none" class="dict-center">
      <div class="dict-big">🏁 本轮默写完成！</div>
      <div class="dict-stats">
        <div class="dict-stat g"><b id="sg">0</b><span>完全正确</span></div>

        <div class="dict-stat"><b id="sa">0%</b><span>正确率</span></div>

      <div class="dict-actions" style="justify-content:center">

        <a class="btn btn-ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="p053.html">📖 回去阅读</a>
      </div>
      <div id="wronglist" class="dict-wronglist"></div>

  </div>

rify the product usage guidelines for clients.（客户服务团队需要我们帮忙向客户解释产品使用指南。）​", "（二）协作问题解决​"], ["There's a misunderstanding between our team and the marketing team about the promotion plan; let's have a meeting to clarify it.", "我们团队和市场团队对推广计划有误解，开个会澄清一下吧。"], ["The operations team can't meet the delivery date; we need to coordinate with them to find a solution that satisfies the client.（运营团队无法按时交货，我们需要和他们协调，找到让客户满意的解决方案。）​", "七、绩效评估与职业发展​"], ["Let's discuss how to help you improve your performance in the next quarter.（我们讨论一下，如何帮助你在下季度提升绩效。）​", "（二）职业发展​"], ["Your performance in the past year meets the requirements for promotion; we will start the relevant review process.", "你过去一年的表现符合晋升要求，我们会启动相关审核流程。"], ["Let's make a personal development plan (PDP) together to clarify your growth path in the company.（我们一起制定个人发展计划（PDP），明确你在公司的成长路径。）​", "八、商务谈判​"], ["We need to confirm the negotiation time and location with the other party and send the meeting agenda in advance.", "我们需要和对方确认谈判时间和地点，并提前发送会议议程。"], ["The finance team has calculated the cost ceiling for this cooperation; we can't exceed it during the negotiation.", "财务团队已经算出这次合作的成本上限，谈判中不能超过这个额度。"], ["Before the negotiation, let's have a meeting to align our views on key issues.（谈判前，我们开个会，统一对关键问题的看法。）​", "（二）谈判过程​"], ["We hope the cooperation period can be set to 3 years, and the annual order quantity should not be less than 10,000 units.", "我们希望合作期限定为 3 年，年订单量不低于 1 万件。"], ["The other party is concerned about the delivery time; we can promise to deliver the first batch of goods within 45 days.", "对方担心交货时间，我们可以承诺 45 天内交付第一批货。"], ["We can't accept the other party's request to reduce the quality inspection standards; this will affect our product reputation.", "我们不能接受对方降低质检标准的要求，这会影响我们的产品口碑。"], ["The other party wants to add a penalty clause for delayed delivery; we need to negotiate the penalty rate.", "对方想增加延迟交货的违约金条款，我们需要协商违约金比例。"], ["We suggest that if the market price fluctuates by more than 10%, both parties can renegotiate the contract price.", "我们建议，如果市场价格波动超过 10%，双方可重新协商合同价格。"], ["Let's take a 10-minute break to sort out our thoughts before continuing the negotiation.（我们休息 10 分钟，理清思路后再继续谈判。）​", "（三）谈判结果​"], ["We decided to suspend the negotiation and resume it after the other party provides more detailed cooperation plans.", "我们决定暂停谈判，等对方提供更详细的合作方案后再重启。"], ["The other party requested to modify some clauses in the contract; we need to review them with the legal team.", "对方要求修改合同中的一些条款，我们需要和法务团队一起审核。"], ["We need to inform the relevant departments of the negotiation result to start the follow-up work.（我们需要把谈判结果告知相关部门，启动后续工作。）​", "九、日常办公工具与流程​"], ["You can use Slack to send instant messages to colleagues; it's more efficient than email for quick questions.", "你可以用 Slack 给同事发即时消息，对于快速问题，它比邮件更高效。"], ["We use Trello to manage task lists; each task is marked with a due date and responsible person.", "我们用 Trello 管理任务清单，每个任务都标注了截止日期和负责人。"], ["To use the conference room, you need to book it through the company's meeting room reservation system to avoid conflicts.", "使用会议室需要通过公司会议室预订系统预约，避免冲突。"], ["When leaving the company, you need to return all company property (such as ID cards and keys) to the administrative department.（离职时，你需要将所有公司财物（如工牌、钥匙）归还给行政部门。）​", "十、差旅相关​"], ["Could you help me reserve a hotel near the meeting venue? It should be within a 10-minute walk.", "你能帮我在会议场地附近预订一家酒店吗？步行距离最好在 10 分钟以内。"], ["The company's travel policy states that we can choose economy class for flights shorter than 4 hours.", "公司差旅政策规定，飞行时间少于 4 小时的航班，我们可以选择经济舱。"], ["I need to inform the team of my work handover plan before going on the business trip.（出差前，我需要把工作交接计划告知团队。）​", "（二）差旅沟通​"], ["I have collected all the materials needed for tomorrow's meeting; we can review them briefly before the meeting.", "我已经收集好明天会议所需的所有材料，会前我们可以简要过一遍。"], ["I will send a short video of the local market to the team to show the latest industry situation.（我会给团队发一段当地市场的短视频，展示最新的行业情况。）​", "（三）差旅收尾​"], ["I have written a brief business trip report, which summarizes the key points of the meeting and the client's feedback.", "我已经写了一份差旅简报，总结了会议要点和客户反馈。"], ["The hotel bill has been settled; the finance department can check the payment record through the company account.", "酒店账单已经结清，财务部门可以通过公司账户查询支付记录。"], ["I need to share my business trip experience with the team to help everyone understand the local market better.（我需要和团队分享差旅经验，帮助大家更好地了解当地市场。）​", "十一、文件管理与汇报​"], ["Please name the file according to the format \"Project Name - Document Type - Date\" to avoid confusion.", "请按照 “项目名称 - 文件类型 - 日期” 的格式给文件命名，避免混乱。"], ["Please update the version number of the document after modifying it, such as changing \"V1.0\" to \"V1.1\".", "修改文件后，请更新文件的版本号，比如把 “V1.0” 改成 “V1.1”。"], ["The files shared with external parties should be watermarked with the company's logo to protect intellectual property.", "给外部方共享的文件应添加公司 logo 水印，保护知识产权。"], ["Please delete the redundant files in the shared folder to free up storage space.（请删除共享文件夹中的冗余文件，释放存储空间。）​", "（二）汇报准备与呈现​"], ["I will practice the report presentation twice before the meeting to ensure that the time is controlled within 15 minutes.", "会议前我会演练两次报告演示，确保时间控制在 15 分钟以内。"], ["The report presentation should be accompanied by a verbal explanation to explain the data and charts in detail.（报告演示时应配合口头讲解，详细解读数据和图表。）​", "（三）汇报反馈与修改​"], ["The management suggested adding more competitor analysis to the sales report; I will revise it this afternoon.", "管理层建议在销售报告中增加更多竞争对手分析，我今天下午会修改。"], ["Colleagues pointed out that some data in the report is inconsistent; I need to verify it with the finance department.", "同事指出报告中的部分数据不一致，我需要和财务部门核实。"], ["The client hopes to shorten the report to 5 pages; I will delete the redundant content and keep the key points.", "客户希望把报告缩短到 5 页，我会删除冗余内容，保留核心要点。"], ["The feedback on the report's chart design is good, but the color matching needs to be adjusted to be more professional.", "报告的图表设计反馈不错，但配色需要调整，使其更专业。"], ["The experience of revising the report helps me improve my data analysis and presentation skills.（修改报告的经历帮助我提升了数据分析和呈现能力。）​", "十二、团队培训与发展​"], ["The training fee has been included in the department's annual training budget; no additional payment is required.（培训费用已包含在部门年度培训预算中，无需额外付费。）​", "（二）培训过程​"], ["Please take notes during the training; we will have a small test at the end of each day to check the learning effect.", "培训期间请做好笔记，每天结束后会有小测试，检验学习效果。"], ["We can provide feedback on the training content and the trainer's teaching method through the online questionnaire.（我们可以通过在线问卷，对培训内容和培训师的授课方式提供反馈。）​", "（三）培训后续​"], ["We need to apply the skills learned in the training to our daily work and submit a work report after one month.", "我们需要把培训学到的技能应用到日常工作中，一个月后提交工作应用报告。"], ["The excellent participants in the training will be awarded a certificate; this will be recorded in the employee's personal file.", "培训中的优秀学员将获得证书，这会记入员工个人档案。"], ["If participants have questions about applying the skills after the training, they can consult the trainer via email.", "参训人员若在培训后应用技能时遇到问题，可通过邮件咨询培训师。"], ["We will select outstanding skill application cases from the team and share them in the company's internal newsletter.", "我们会从团队中筛选优秀的技能应用案例，在公司内部通讯中分享。"], ["The training completion certificate will be issued within one week after the end of the training.（培训结束后一周内将颁发培训结业证书。）​", "十三、职场应急处理​"], ["The air conditioner in the office is broken, and it's too hot to work; when will the maintenance team come?（办公室空调坏了，热得没法工作，维修团队什么时候来？）​", "（二）工作突发情况​"], ["The project proposal we submitted was rejected by the client; we need to revise it and resubmit it within three days.", "我们提交的项目提案被客户拒绝了，需要在三天内修改并重新提交。"], ["The venue for the product launch event was double-booked; we need to find a new venue as soon as possible.", "产品发布会的场地被重复预订了，我们需要尽快找一个新场地。"], ["The legal department found a risk in the contract we are about to sign; we need to negotiate with the client to modify it.", "法务部门在我们即将签署的合同中发现了一处风险，需要和客户协商修改。"], ["The product sample sent to the client was damaged during transportation; we need to send a new one via express delivery.（寄给客户的产品样品在运输中损坏了，需要通过快递寄一个新的过去。）​", "十四、商务礼仪​"], ["Maintaining a smile and a friendly expression during the meeting can help create a good communication atmosphere.", "会议中保持微笑和友好的表情，有助于营造良好的沟通氛围。"], ["When entering a meeting room, you should let the client or the senior management enter first.（进入会议室时，应让客户或高层管理人员先走。）​", "（二）沟通礼仪​"], ["When answering the phone for business, you should first state the company name and your own name, such as \"Hello, this is [Company Name], [Your Name] speaking.\"", "商务接电话时，要先报公司名称和自己的名字，比如 “您好，这里是 [公司名称]，我是 [你的名字]。”"], ["Avoid checking your phone frequently during a face-to-face meeting; it shows a lack of attention to the other party.", "面对面会议时，避免频繁看手机，这会显得你对对方不够重视。"], ["When writing business emails, you should use a clear and concise subject line so that the recipient can quickly understand the purpose of the email.（写商务邮件时，主题栏要清晰简洁，让收件人能快速了解邮件目的。）​", "（三）商务宴请​"], ["You should confirm the dietary restrictions of the clients in advance, such as whether they are vegetarian or have food allergies.", "要提前确认客户的饮食禁忌，比如是否素食或有食物过敏。"], ["The host should order dishes that are easy to eat and not too messy, avoiding dishes that require using hands to eat.", "主人点的菜要方便食用，不要太狼狈，避免需要用手吃的菜。"], ["When toasting, the host should raise the glass first, and the glass should be lower than the client's glass to show respect.", "敬酒时，主人要先举杯，杯子要低于客户的杯子，以示尊重。"], ["After the dinner, the host should send the clients back to the hotel or arrange transportation for them, if necessary.（晚餐结束后，如有需要，主人应送客户回酒店或为他们安排交通工具。）​", "十五、跨文化沟通​"], ["When translating documents for cross-cultural communication, you should not only translate the words literally but also ensure that the meaning is in line with the target culture.（跨文化沟通中翻译文件时，不要只直译文字，还要确保含义符合目标文化。）​", "（二）习俗与礼仪差异​"], ["In some European countries, it's polite to kiss the cheeks of the other person when greeting, but the number of kisses varies by country (such as 2 in France and 3 in Belgium).", "在一些欧洲国家，问候时亲吻对方脸颊是礼貌的，但亲吻次数因国家而异（如法国 2 次，比利时 3 次）。"], ["In some Middle Eastern countries, it's not allowed to show the soles of your feet to others, so you should be careful when sitting.", "在一些中东国家，向别人露出鞋底是不允许的，所以坐姿要注意。"], ["When visiting a colleague's office in some European countries, you should knock on the door first and wait for permission before entering.（在一些欧洲国家，拜访同事的办公室时，要先敲门，得到允许后再进入。）​", "十六、工作汇报进阶​"], ["The number of products returned due to quality issues was 20 this month, accounting for only 0.5% of the total sales volume.", "本月因质量问题退回的产品数量为 20 件，仅占总销量的 0.5%。"], ["The employee turnover rate in the technical department was 5% this year, lower than the company's average turnover rate of 8%.（技术部门今年的员工离职率为 5%，低于公司 8% 的平均离职率。）​", "（二）方案汇报​"], ["The proposed training program will cover both professional skills and soft skills, with a total of 20 training sessions per year.", "拟议的培训计划将涵盖专业技能和软技能，每年共 20 个培训课时。"], ["After evaluating the risks of both schemes, we recommend choosing Scheme B, as it has lower market risks and more stable returns.（评估两套方案的风险后，我们建议选择方案 B，因为其市场风险更低，回报更稳定。）​", "（三）问题汇报​"], ["We found that 15% of customers are dissatisfied with after-sales service, mainly because the response time is too long.", "我们发现 15% 的客户对售后服务不满意，主要原因是响应时间过长。"], ["The high turnover rate in the sales department is mainly due to heavy workload and unclear performance evaluation standards.", "销售部门离职率高，主要原因是工作量大且绩效评估标准不明确。"], ["The error rate in the financial report is 3%, which is caused by the lack of a double-check process before submission.", "财务报告的错误率为 3%，这是由于提交前缺少双重检查流程导致的。"], ["The customer complaint rate of the new product has increased to 8%, mainly because the user manual is not clear enough.", "新产品的客户投诉率已上升至 8%，主要原因是用户手册不够清晰。"], ["The low participation rate in the company's training courses (only 40%) is because the training time conflicts with the employees' work schedules.（公司培训课程参与率低（仅 40%），是因为培训时间与员工工作安排冲突。）​", "十七、任务协作​"], ["The task of testing the new system will be responsible by the QA team, and they need to submit a test report next Monday.（新系统测试任务由质量保证（QA）团队负责，他们需在下周一提交测试报告。）​", "（二）任务跟进​"], ["I will review the draft contract prepared by the legal team this Thursday and provide feedback within 24 hours.", "我会在本周四审核法务团队准备的合同草案，并在 24 小时内提供反馈。"], ["The QA team needs to update the test progress every afternoon, so that we can know whether the new system can be launched on time.（质量保证团队需每天下午更新测试进度，以便我们了解新系统能否按时上线。）​", "（三）任务验收​"], ["The market research report submitted by Lisa needs to include data from at least five sources to pass the acceptance.", "莉萨提交的市场调研报告需包含至少五个来源的数据才能通过验收。"], ["The customer service team's work will be accepted based on the customer satisfaction rate, which needs to reach at least 90%.", "客服团队的工作将以客户满意度为验收标准，需达到至少 90%。"], ["After the task is accepted, the responsible person will archive all relevant materials in the company's document management system.（任务验收通过后，负责人需将所有相关资料归档至公司文件管理系统。）​", "十八、工作交接​"], ["I will collect the feedback from the previous work and share it with the successor to help them avoid making the same mistakes.（我会收集以往工作中的反馈意见，并与接手人分享，帮助他们避免犯同样的错误。）​", "（二）交接过程​"], ["The successor and I will make a joint inspection of the project materials to ensure that no important documents are missing.", "我和接手人会共同检查项目资料，确保没有遗漏重要文件。"], ["During the handover period (three working days), I will be available at any time to provide support to the successor.", "在交接期（三个工作日）内，我会随时提供支持，协助接手人开展工作。"], ["During the handover, I will focus on explaining the difficult points of the work and the solutions to common problems.", "交接过程中，我会重点讲解工作中的难点和常见问题的解决方法。"], ["After explaining the overall work, I will let the successor sort out the key points and repeat them to ensure that they have mastered the core content.（讲解完整体工作后，我会让接手人整理要点并复述，确保其掌握核心内容。）​", "（三）交接收尾​"], ["I will update my work status in the company's internal system to \"handover completed\" to inform other departments.", "我会在公司内部系统中更新工作状态为 “交接完成”，告知其他部门。"], ["After the handover, I will no longer access the company's internal systems to ensure data security and avoid interfering with the successor's work.（交接后，我将不再登录公司内部系统，确保数据安全并避免干扰接手人工作。）​", "十九、离职沟通​"], ["I hope to maintain a good relationship with the company after my departure, and I am willing to provide assistance if the company needs it in the future.（我希望离职后仍与公司保持良好关系，若未来公司有需要，我愿意提供帮助。）​", "（二）离职面谈​"], ["I thanked the company for the exit interview opportunity, as it allowed me to express my opinions and contributed to the company's development.（我感谢公司提供离职面谈的机会，这让我能够表达想法，为公司发展贡献一份力量。）​", "（三）离职告别​"], ["I returned the company's documents and tools to the relevant departments, and signed the receipt to confirm the return.", "我将公司的文件和工具归还给相关部门，并签署收据确认归还。"], ["My former colleagues sent me farewell messages on WeChat, and we promised to keep in touch and meet up occasionally.", "前同事在微信上给我发了告别消息，我们约定保持联系，偶尔相聚。"], ["When I left the office on my last day, I looked back at the familiar workspace and felt grateful for the wonderful experience the company had given me.（最后一天离开办公室时，我回望熟悉的工作区域，感谢公司给予我的美好经历。）​", "二十、新员工融入​"], ["My direct supervisor had a one-on-one meeting with me to clarify my job responsibilities and short-term work goals.", "直属上级与我进行了一对一会议，明确了我的工作职责和短期工作目标。"], ["The HR specialist told me about the company's employee development programs, such as internal training courses and promotion channels.（人力资源专员向我介绍了公司的员工发展项目，如内部培训课程和晋升渠道。）​", "（二）融入团队​"], ["I prepared a small gift for my mentor to thank him for his patient guidance in the past month, which made our relationship closer.（我为导师准备了一份小礼物，感谢他过去一个月的耐心指导，这让我们的关系更加亲近。）​", "（三）适应工作​"], ["After two months of adaptation, I can independently handle the daily work of the position and actively cooperate with other team members to complete project tasks.（经过两个月的适应，我已能独立处理岗位的日常工作，并主动配合其他团队成员完成项目任务。）​", "二十一、职场冲突处理​"], ["During the conflict discussion, I use \"I-statements\" such as \"I feel confused about the task arrangement\" instead of blaming language like \"You messed up the plan\".", "在冲突沟通中，我会使用 “我句式”，比如 “我对任务安排感到困惑”，而不是 “你搞砸了计划” 这类指责性语言。"], ["After the conflict was resolved, we had a follow-up chat a week later to confirm that the solution was working and there were no new issues.（冲突解决一周后，我们进行了跟进沟通，确认解决方案有效，且没有新问题出现。）​", "（二）寻求第三方协助​"], ["After the mediator listened to both sides' statements, he summarized the core issues and guided us to reach a mutually acceptable solution.（调解人听完双方陈述后，总结了核心问题，并引导我们达成了双方都能接受的解决方案。）​", "（三）预防冲突再次发生​"], ["The team leader conducts regular one-on-one check-ins with each member to understand their work status and emotional state, and resolve potential conflicts in a timely manner.", "团队领导定期与每位成员进行一对一沟通，了解其工作状态和情绪状态，及时解决潜在冲突。"], ["After resolving the conflict, we held a team retrospective meeting to discuss how to improve our work processes and prevent similar conflicts from happening again.（解决冲突后，我们召开了团队复盘会议，讨论如何改进工作流程，预防类似冲突再次发生。）​", "二十二、职场压力应对​"], ["I share my work stress with my family or friends after work, which helps me release negative emotions and gain emotional support.（下班后我会和家人或朋友分享工作压力，这能帮助我释放负面情绪，获得情感支持。）​", "（二）寻求工作支持​"], ["The IT department helped us upgrade the work software, which improved work efficiency and reduced the stress caused by slow tools.（IT 部门帮我们升级了工作软件，提升了工作效率，减轻了因工具卡顿带来的压力。）​", "二十三、职场礼仪进阶​"], ["If you need to follow up on an email that hasn't been replied to, send a gentle reminder after 2-3 working days, such as \"Just following up on my email sent on June 10 regarding Project X\".（如果邮件未收到回复，需跟进时，在 2-3 个工作日后发送温和提醒，比如 “仅跟进我 6 月 10 日发送的关于 X 项目的邮件”。）​", "（二）会议礼仪进阶​"], ["After the meeting, follow up on the action items you are responsible for and update the progress to the team in a timely manner.（会议后，跟进自己负责的行动项，并及时向团队更新进展。）​", "二十四、商务活动​"], ["The sales team will start following up with the potential clients collected at the trade fair within three working days to discuss cooperation opportunities.（销售团队会在三个工作日内开始跟进展会上收集的潜在客户，探讨合作机会。）​", "（二）商务宴请​"], ["During the business dinner, we will start with casual topics like local culture and travel, and then gradually transition to work-related discussions if the atmosphere is appropriate.", "商务晚宴期间，我们会从当地文化、旅行等轻松话题开始，若氛围合适，再逐步过渡到工作相关的讨论。"], ["After the dinner, we will send a thank-you message to the client's leader, thanking them for attending the dinner and looking forward to the next communication.（晚宴结束后，我们会向客户方领导发送感谢信息，感谢他们出席晚宴，并期待下次沟通。）​", "（三）商务拜访​"], ["We will visit the client's company in Guangzhou next Tuesday to discuss the details of the upcoming cooperation project.", "下周二我们会拜访广州的客户公司，讨论即将开展的合作项目细节。"], ["Within 24 hours after the visit, we will send a follow-up email to the client, summarizing the discussion content and the next steps of the cooperation.（拜访后的 24 小时内，我们会向客户发送跟进邮件，总结讨论内容和合作的下一步计划。）​", "二十五、合同签署与管理​"], ["The revised contract draft has been sent to the client's legal department; we are waiting for their feedback and expect to finalize the contract within a week.（修改后的合同草案已发送给客户的法务部门，我们正在等待他们的反馈，期望一周内确定最终合同。）​", "（二）合同签署​"], ["After the signing ceremony, we will send a thank-you gift to each attendee from the client's team, as a token of our appreciation for their support in the cooperation.（签署仪式后，我们会向客户团队的每位参会者赠送感谢礼品，以感谢他们对合作的支持。）​", "（三）合同管理​"], ["The finance department will refer to the payment terms in the contract when collecting payments from the client, and promptly notify the project manager if there is any delay in payment.", "财务部门向客户收款时，会参考合同中的付款条款，若出现付款延迟，及时通知项目经理。"], ["If the client fails to fulfill the contract terms (such as delayed payment), we will first send a reminder letter, and if the issue is not resolved, involve the legal department to handle it according to the contract.（若客户未履行合同条款（如延迟付款），我们会先发送催款函，若问题未解决，再让法务部门根据合同处理。）​", "二十六、合作项目跟进​"], ["The project manager will send a project kick-off document to all team members (including the client's team) one day before the meeting, which outlines the project goals and scope.", "项目经理会在会议前一天向所有团队成员（包括客户团队）发送项目启动文件，其中概述了项目目标和范围。"], ["We will collect the contact information of all key personnel in the client's team (such as phone numbers and email addresses) and compile it into a contact list for emergency communication.", "我们会收集客户团队所有关键人员的联系方式（如电话、邮箱），整理成联系表，用于紧急沟通。"]];window.__KEY__="911外企职场800句英语交流及中文翻译";window.__TITLE__="9.11外企职场800句英语交流及中文翻译";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
