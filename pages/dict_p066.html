function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}

function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}

  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);

  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
