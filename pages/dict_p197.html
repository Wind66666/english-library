<script>window.__PAIRS__=[["I am writing to follow up on our earlier decision on the marketing campaign in Q2. 我写信来追踪我们之前对于第二季度营销活动的决定。", "（二）请求协作"], ["I'm just writing to remind you of.. 我只是写信来提醒您……", "（三）表达感谢"], ["Please convey my thanks to all the staff involved, they certainly did an excellent job. 请向所有相关工作人员转达我的谢意，他们确实干得很出色。", "（四）拒绝请求"], ["Unfortunately, we are unable to accommodate this request due to (specific constraint). Let’s discuss next steps. 很遗憾，由于（具体限制）我们无法满足这个请求。让我们讨论下一步措施。", "（五）跟进进展"], ["As a reminder, the deadline for (task) is approaching. Let me know if you need additional resources. 提醒一下，（任务）的截止日期即将到来。如果您需要额外资源，请告知我。", "三、附件处理"], ["I'm sending you (file) as a pdf file. 我将（文件）作为 pdf 文件发送给您。", "（二）请求附件"], ["Can you please fill out this form? 您能填写这张表格吗？", "四、结尾礼貌用语"], ["Looking forward to your reply. 期待您的回复。", "（二）特殊场景"], ["We look forward to hearing from you soon. 我们期待很快收到您的回复。", "五、道歉用语"], ["Sorry if my voice message is not clear enough. 如果我的电话留言不够清楚，我深感抱歉。", "六、货代相关高频句"], ["Urgent attention required. 请紧急处理此事。", "七、开发信模板相关常用语"], ["Subject: Establish Business Relationship - (Product Name) 主题：建立业务关系 -", "产品名称"], ["This is (your name) from (company name), a leading manufacturer of (product category) with (number of years) years of experience. We specialize in (core products) and have helped clients like (well - known clients) achieve (specific results, such as \"20% cost reduction\"). 我是来自（公司名称）的（您的姓名），（公司名称）是（产品类别）的领先制造商，拥有（年数）年经验。我们专注于（核心", "（二）介绍产品优势"], ["Clients in (region/industry) have reported (specific result, e.g., \"reduced operational costs by 15%\") after adopting our solution. （地区 / 行业）的客户在采用我们的解决方案后，报告称（具体成果，如 “运营成本降低 15%”）。", "（三）促进合作"], ["Please let me know if you’d like to proceed with a trial order—we can offer a 5% discount for first-time clients. 若您想进行试订单，请告知我 —— 我们可为首次合作的客户提供 5% 的折扣。", "七、报价与谈判用语"], ["The quoted lead time is [X weeks/days] from receipt of your official purchase order. 报价中的交货周期为收到您的正式采购订单后 [X 周 / 天]。", "八、合同与条款用语"], ["For any amendments to the contract after signing, a written addendum signed by both parties will be required. 签署后若需修改合同，需双方签署书面补充协议。", "九、付款相关用语"], ["The refund for the returned goods has been processed today, and the funds should reach your account within [X business days]. 退货的退款已于今日处理，款项将在 [X 个工作日] 内到账。", "十、项目与订单跟进"], ["For the upcoming project phase, we’ll need your approval on [document, e.g., \"the revised design mockup\"] by [date] to proceed. 对于下一项目阶段，我们需要您在 [日期] 前批准 [文件，如 “修订后的设计样稿”] 以便推进。", "十一、问题沟通与解决"], ["We’ve scheduled a meeting with our technical team on [date] to address your questions—could you please share specific concerns in advance? 我们已安排技术团队于 [日期] 开会解答您的问题 —— 能否请您提前告知具体疑虑？", "十二、总结与后续规划"], ["As we enter the next phase, our team will be led by [name/title], who will be your primary contact for all related matters. 进入下一阶段后，我们的团队将由 [姓名 / 职位] 领导，他将作为您所有相关事宜的主要联系人。", "十三、日常事务协调用语"], ["Could you kindly approve the [request, e.g., \"expense report/leave application\"] via the system at your earliest convenience? 能否请您尽早在系统中批准 [请求，如 “费用报告 / 请假申请”]？", "十四、市场与营销相关用语"], ["To support your local marketing efforts, we can provide [materials, e.g., \"high-resolution images and product videos\"]—please let us know your specific needs. 为支持您的本地营销工作，我们可提供 [材料，如 “高清图片及产品视频”]—— 请告知您的具体需求。", "十五、人事与对接调整用语"], ["For urgent matters before the transition, please continue to contact [current contact]; after [date], [new contact] will be your primary point of contact. 过渡前的紧急事宜，请继续联系 [当前联系人]；[日期] 后，[新联系人] 将成为您的主要对接人。", "十六、数据与报告用语"], ["The quarterly review report highlights [challenges, e.g., \"supply chain delays\"] and our proposed solutions, as outlined on pages 5-7. 季度回顾报告强调了 [挑战，如 “供应链延迟”] 及我们的拟议解决方案，详见第 5-7 页。", "十七、客户服务用语"], ["We value your feedback as it helps us improve our services—thank you for taking the time to share your experience. 我们重视您的反馈，因为它有助于我们改进服务 —— 感谢您抽出时间分享您的体验。", "十八、内部沟通用语"], ["A training session on [skill, e.g., \"new CRM software\"] will be held on [date]—mandatory for all team members, please confirm attendance. [日期] 将举行关于 [技能，如 “新 CRM 软件”] 的培训 —— 所有团队成员必须参加，请确认出席。", "十九、供应商管理用语"], ["To renew our annual contract, we need your updated pricing and service level agreement by [date]. 为续签年度合同，我们需要您在 [日期] 前提供更新的价格及服务水平协议。", "二十、其他实用场景用语"], ["We’ve received your job application for the [position]—our HR team will review it and contact you within a week if your profile matches our requirements. 我们已收到您对 [职位] 的求职申请 —— 若您的履历符合我们的要求，人力资源团队将在一周内与您联系。", "二十一、技术支持与问题排查用语"], ["For on-site technical support, please confirm the address and preferred time window (e.g., 9 AM-12 PM) so we can dispatch a technician. 如需现场技术支持，请确认地址及首选时间段（如上午 9 点 - 12 点），以便我们派遣技术人员。", "二十二、会议安排与协调用语"], ["Could you please circulate the meeting minutes to all attendees by the end of the day? Highlighting action items with responsible persons and deadlines would be helpful. 能否在今日结束前将会议纪要分发给所有参会者？突出标注行动项及负责人和截止日期将十分有益。", "二十三、采购与库存用语"], ["The stocktaking report shows a discrepancy of [quantity] units for [item]. Could you please conduct a recount and investigate the cause? 盘点报告显示 [物品] 有 [数量] 件的差异。能否请您重新盘点并调查原因？", "二十四、财务与报销用语"], ["To reconcile the accounts, could you please provide supporting documents for the transaction dated [date]? 为核对账目，能否请您提供 [日期] 交易的证明文件？", "二十五、知识产权与保密用语"], ["Any unauthorized use of the company’s intellectual property will result in legal action, as specified in Clause 7 of our terms of service. 如服务条款第 7 条所述，任何未经授权使用公司知识产权的行为将导致法律诉讼。", "二十六、跨部门协作用语"], ["There’s a dependency on the [department] to finalize [task, e.g., \"regulatory compliance checks\"] before we can proceed—could you please expedite this? 在我们推进之前，依赖于 [部门] 完成 [任务，如 “合规检查”]—— 能否请您加快进度？", "二十七、国际业务与跨境用语"], ["The product labeling must be translated into [language, e.g., \"Spanish\"] and comply with [country]’s consumer protection laws. A sample label is attached for approval. 产品标签必须翻译成 [语言，如西班牙语]，并符合 [国家] 的消费者保护法。附件为标签样本供批准。", "二十八、紧急事务处理用语"], ["We need immediate approval for [action, e.g., \"reallocating budget to address the supply chain crisis\"]—please review the proposal attached and confirm via email. 我们需要立即批准 [行动，如 “重新分配预算以应对供应链危机”]—— 请审阅附件中的提案并通过邮件确认。", "二十九、长期合作与关系维护用语"], ["We’d like to schedule a strategic planning session to discuss our collaboration roadmap for the next 3 years. Would [date] work for your calendar? 我们想安排一次战略规划会议，讨论未来 3 年的合作路线图。[日期] 对您是否合适？", "三十、总结与补充场景用语"], ["We’re pleased to announce the launch of our new product line, [product name], which will be available in stores from [date]. A press release with key features is attached. 我们很高兴地宣布，[产品名称] 新系列将于 [日期] 上市。附件为包含主要特性的新闻稿。", "行动项 | 责任方 | 截止日期"]];window.__KEY__="商务英语工作邮件299句";window.__TITLE__="商务英语工作邮件299句";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
