<!DOCTYPE html>

<head>

<title>默写 · 450个商务词汇</title>
<style>
:root{--bg:#0e1016;--panel:#161923;--card:#1a1e2b;--ink:#e8eaf2;--sub:#8f96ab;
--brand:#8b9cf9;--line:#262b3b;--hover:#202636;
--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
background:var(--bg);color:var(--ink)}
a{color:var(--brand);text-decoration:none}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
/* ---- 头部 ---- */
header{padding:48px 16px 40px;text-align:center;position:relative;

.chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;

.search::placeholder{color:#5d6479}
.stats{color:var(--sub);font-size:12.5px;margin:16px 0 0}
.stats #count{color:var(--brand);font-weight:600}
/* ---- 分区 ---- */
.sec-title{margin:36px 0 14px;font-size:15px;font-weight:700;color:var(--ink);
display:flex;align-items:center;gap:10px}
.sec-title .dot{width:8px;height:8px;border-radius:50%;flex:none;
box-shadow:0 0 8px currentColor}
.sec-title .c1{background:#8b9cf9;color:#8b9cf9}
.sec-title .c2{background:#e8b667;color:#e8b667}
.sec-title .c3{background:#e08ba6;color:#e08ba6}
.sec-title .count{font-weight:400;font-size:12px;color:var(--sub)}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:15px 17px;display:flex;flex-direction:column;gap:9px;
transition:background .15s ease,border-color .15s ease,transform .15s ease}
.item:hover{background:var(--hover);border-color:#39415e;transform:translateY(-2px)}
.item .t{font-weight:600;font-size:14.5px;line-height:1.55;color:var(--ink);
cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.item .t .emo{font-size:17px;line-height:1.4;flex:none;filter:saturate(.85)}
.item .t:hover{color:#c9d4ff}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.doc{background:rgba(52,211,153,.12);color:#4ecfa0}
.badge.pdf{background:rgba(248,113,113,.12);color:#f08c8c}
.charspill{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px}
.vtoggle{font-size:12px;color:var(--brand);cursor:pointer;user-select:none;font-weight:600}
.vtoggle:hover{text-decoration:underline}
.variants{display:none;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:9px}
.variants.open{display:flex}
.variants a{font-size:12.5px;color:var(--sub)}
.variants a::before{content:"↳ ";color:#4b5580}
.variants a:hover{color:var(--brand)}
.empty{text-align:center;color:var(--sub);padding:60px 0}
footer{text-align:center;color:#5d6479;font-size:12px;padding:34px 0 44px}
/* ---- 阅读页 ---- */
.art-header{background:var(--panel);border-bottom:1px solid var(--line);
padding:28px 16px 24px}
.art-header .back{font-size:13px;color:var(--sub);font-weight:600}
.art-header .back:hover{color:var(--brand)}
.art-header .back::before{content:"← "}
.art-header h1{margin:14px 0 10px;font-size:21px;line-height:1.5;font-weight:800;color:#dfe4f5}
.art-header .src{font-size:12px;color:#5d6479;word-break:break-all}
.art-header .meta{color:var(--sub);margin-top:10px}
.art-header .meta a{color:var(--brand);font-weight:600}
.art-header .meta .note{color:#e8b667}
.content{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:30px 36px;margin-top:20px;font-size:15.5px;
line-height:2.1;white-space:pre-wrap;word-break:break-word;color:#d5dae8}
@media (max-width:600px){.content{padding:20px 16px;border-radius:14px}
.list{grid-template-columns:1fr}header{padding:38px 16px 32px}header h1{font-size:23px}}
/* ---- 默写练习 ---- */
.dict-link{background:rgba(139,156,249,.12);color:#a5b1fb;font-size:11px;
padding:3px 10px;border-radius:999px;font-weight:600}
.dict-link:hover{background:rgba(139,156,249,.25)}
.dict-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);padding:34px 36px;margin-top:20px}
.dict-center{text-align:center}
.dict-progress{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.dict-progress .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dict-progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b9cf9,#4ecfa0);
border-radius:3px;transition:width .25s ease}
.dict-progress .num{font-size:12.5px;color:var(--sub);white-space:nowrap}
.dict-zh{font-size:21px;font-weight:700;color:#dfe4f5;line-height:1.7;margin:8px 0 26px}
.dict-input{width:100%;padding:14px 16px;font-size:16px;color:var(--ink);
background:var(--panel);border:1.5px solid var(--line);border-radius:12px;outline:none;
transition:border-color .15s ease,box-shadow .15s ease;font-family:inherit}
.dict-input:focus{border-color:#4b5580;box-shadow:0 0 0 3px rgba(139,156,249,.15)}
.dict-input.ok{border-color:#34d399}
.dict-input.bad{border-color:#f08c8c}
.dict-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
cursor:pointer;font-family:inherit;transition:opacity .15s ease}
.btn:hover{opacity:.85}
.btn-main{background:linear-gradient(120deg,#8b9cf9,#6d7ff0);color:#fff}
.btn-ghost{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.dict-fb{margin-top:18px;font-size:15px;line-height:1.9;display:none;
padding:14px 18px;border-radius:12px}
.dict-fb.show{display:block}
.dict-fb.good{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25)}
.dict-fb.near{background:rgba(232,182,103,.10);border:1px solid rgba(232,182,103,.3)}
.dict-fb.wrong{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.25)}
.dict-fb .ans{display:block;color:#dfe4f5;font-weight:600;margin-top:4px}
.dict-big{font-size:17px;font-weight:700;color:#dfe4f5;margin:14px 0 22px;line-height:1.8}
.dict-stats{display:flex;gap:14px;justify-content:center;margin:22px 0 28px;flex-wrap:wrap}
.dict-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:14px 26px;min-width:110px}
.dict-stat b{display:block;font-size:24px;font-weight:800}
.dict-stat span{font-size:12px;color:var(--sub)}
.dict-stat.g b{color:#4ecfa0}.dict-stat.n b{color:#e8b667}.dict-stat.w b{color:#f08c8c}
.dict-wronglist{margin-top:26px;text-align:left}
.dict-wronglist h3{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.dict-wronglist .wp{padding:10px 14px;border:1px solid var(--line);border-radius:10px;
margin-bottom:8px;font-size:13.5px;line-height:1.8}
.dict-wronglist .wp b{color:#f08c8c}
.dict-wronglist .wp span{display:block;color:var(--sub)}
.dict-wronglist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600}
.dict-opt{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap}
.dict-opt label{display:flex;align-items:center;gap:7px;background:var(--panel);
border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13.5px;
cursor:pointer;color:var(--sub)}
.dict-opt input{accent-color:#8b9cf9}
.dict-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dict-chips .chip{cursor:pointer}
.dict-chips .chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
@media (max-width:600px){.dict-wrap{padding:22px 16px}.dict-zh{font-size:18px}}
/* ---- 学习进度 & 归档 ---- */
.pctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:var(--panel);color:#5d6479;
transition:all .12s ease}
.st:hover{opacity:.8}
.st-learning{background:rgba(139,156,249,.16);border-color:rgba(139,156,249,.4);color:#a5b1fb}
.st-done{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.35);color:#4ecfa0}
.arch-btn{font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;cursor:pointer;
user-select:none;border:1px solid var(--line);background:transparent;color:#5d6479}
.arch-btn:hover{color:var(--sub)}
.arch-btn.on{background:rgba(232,182,103,.13);border-color:rgba(232,182,103,.4);color:#e8b667}
.item.archived{opacity:.5}
.item.archived:hover{opacity:.8}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 0}
.filter-chip{background:var(--panel);border:1px solid var(--line);color:#aab2cc;
font-size:12px;padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.filter-chip:hover{border-color:#39415e}
.filter-chip.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.pbar-outer{max-width:580px;margin:20px auto 0;height:8px;border-radius:4px;
background:var(--panel);border:1px solid var(--line);overflow:hidden}
.pbar-outer i{display:block;height:100%;width:0;border-radius:4px;
background:linear-gradient(90deg,#8b9cf9,#4ecfa0);transition:width .3s ease}
.psum{margin:10px 0 0;font-size:12.5px;color:var(--sub)}
.psum b{color:#c9d4ff;font-weight:600}
footer .io{margin-top:8px}
footer .io a,footer .io label{cursor:pointer;color:#5d6479}
footer .io a:hover,footer .io label:hover{color:var(--brand)}
footer .io input{display:none}
.art-pctrl{margin-top:12px}
.dict-hist{color:#8f96ab;font-size:13px;margin-top:14px}
.dict-hist b{color:#a5b1fb}
/* ---- 复习中心 & 收藏 ---- */
.btn-fav.on{color:#e8b667;border-color:rgba(232,182,103,.45)}
.rtabs{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.rtab{background:var(--panel);border:1px solid var(--line);color:#aab2cc;font-size:13px;
padding:8px 18px;border-radius:999px;cursor:pointer;user-select:none;
transition:all .12s ease}
.rtab:hover{border-color:#39415e}
.rtab.on{background:rgba(139,156,249,.18);border-color:#4b5580;color:#c9d4ff}
.rsec{display:none}
.rsec.on{display:block}
.rlist{border-top:1px dashed var(--line);padding-top:14px;margin-top:16px}
.rlist .wp{padding:12px 16px;border:1px solid var(--line);border-radius:12px;
margin-bottom:9px;font-size:13.5px;line-height:1.8;background:var(--panel)}
.rlist .wp span{display:block;color:var(--sub)}
.rlist .wp i{display:block;font-style:normal;color:#dfe4f5;font-weight:600;margin-top:2px}
.wp-meta{font-size:11.5px;color:#5d6479;margin-top:7px;display:flex;gap:14px;
align-items:center;flex-wrap:wrap}
.wp-meta b{cursor:pointer;color:#8f96ab;font-weight:600}
.wp-meta b:hover{color:#f08c8c}
.wp-meta .due{color:#e8b667}
.wp-meta .src{opacity:.8;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-hint{text-align:center;color:#5d6479;padding:28px 0;font-size:13.5px}
.chip.rlink{cursor:pointer;transition:all .12s ease}
.chip.rlink:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
@media (max-width:600px){.dict-wrap{padding:22px 16px}.dict-zh{font-size:18px}}
</style>
</head>

  <div class="dict-wrap">

      <div class="dict-opt">

        <select id="range" class="btn btn-ghost" style="padding:9px 14px">

          <option value="20" selected>前 20 句</option>
          <option value="50">前 50 句</option>
          <option value="100">前 100 句</option>

      <div id="hist" class="dict-hist"></div>
      <p style="color:#5d6479;font-size:12.5px;margin-top:18px">判定规则：忽略大小写和标点；相似度 ≥ 90% 记为“接近正确”</p>
    </div>

    <div id="quiz" style="display:none">
      <div class="dict-progress"><span class="num" id="num">0 / 0</span><div class="bar"><i id="bar"></i></div></div>
      <div class="dict-zh" id="zh"></div>
      <input id="input" class="dict-input" type="text" placeholder="在这里默写英文…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="dict-actions">
        <button id="btnCheck" class="btn btn-main" onclick="check()">检查（Enter）</button>
        <button id="btnHint" class="btn btn-ghost" onclick="hint()">💡 提示</button>
        <button id="btnFav" class="btn btn-ghost btn-fav" onclick="favToggle()" title="收藏这句，之后可在复习中心查看">☆ 收藏</button>
        <button class="btn btn-ghost" onclick="reveal()">显示答案</button>
        <button class="btn btn-ghost" onclick="skip()">跳过 ⏭</button>
        <button id="btnNext" class="btn btn-main" style="display:none" onclick="next()">下一句（Enter）→</button>
      </div>
      <div id="fb" class="dict-fb"></div>
    </div>

    <div id="result" style="display:none" class="dict-center">
      <div class="dict-big">🏁 本轮默写完成！</div>
      <div class="dict-stats">
        <div class="dict-stat g"><b id="sg">0</b><span>完全正确</span></div>
        <div class="dict-stat n"><b id="sn">0</b><span>接近正确</span></div>
        <div class="dict-stat w"><b id="sw">0</b><span>错误</span></div>
        <div class="dict-stat"><b id="sa">0%</b><span>正确率</span></div>
      </div>
      <div class="dict-actions" style="justify-content:center">
        <button class="btn btn-main" onclick="start()">🔄 再来一轮</button>
        <a class="btn btn-ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="p149.html">📖 回去阅读</a>
      </div>
      <div id="wronglist" class="dict-wronglist"></div>
    </div>

  </div>
</div>

var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
