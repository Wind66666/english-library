<script>window.__PAIRS__=[["My alarm clock and I have a very toxic relationship based entirely on the five-minute snooze button.", "我和闹钟维持着一段有毒的关系，全靠\"再睡五分钟\"按钮硬撑着。"], ["I walked into the office building this morning and immediately started planning my evening exit strategy.", "今早一走进办公楼，我就开始规划晚上的\"撤退方案\"。"], ["My commute was so incredibly slow that I had time to contemplate the entire history of the universe.", "通勤慢到我一路把宇宙的整部历史都思考完了。"], ["I tried to be a positive morning person today, but the sun was just shining way too aggressively.", "今天我努力当个元气满满的早起人，可太阳晒得实在太咄咄逼人。"], ["The first cup of morning coffee doesn't actually wake me up; it just activates my ability to tolerate human interaction.", "早晨第一杯咖啡并不能让我清醒，它只是激活了我\"容忍人类交谈\"的功能。"], ["I am not sure if I am a professional adult or just a very tired coffee vessel.", "我分不清自己是职场精英，还是一个会走路的咖啡容器。"], ["My desk chair has a squeak that perfectly emulates the sound of a highly stressed hamster.", "我的办公椅吱吱作响，音色神似一只压力过大的仓鼠。"], ["The corporate elevator is the ultimate equalizer because everyone just stares blankly at the floor numbers.", "公司电梯是终极的平等装置——所有人都呆呆地盯着楼层数字。"], ["I am currently operating on a level of exhaustion where my shadow is moving faster than I am.", "我现在累到什么程度？我的影子移动速度都比我快。"], ["My coffee consumption has reached a level where the barista knows my entire social security number.", "我喝咖啡的量，已经喝到咖啡师能背出我整串身份证号。"], ["I spend the first ten minutes of every morning organizing my inbox into folders I will absolutely never open again.", "每天早上头十分钟，我都在把邮件分类，放进一堆我绝对不会再打开的文件夹。"], ["I opened my inbox and discovered four hundred unread messages containing the phrase urgent action required.", "打开收件箱，四百封未读邮件，清一色写着\"亟待处理\"。"], ["The network router went down for ten minutes, forcing the entire staff to actually interact like real human beings.", "路由器瘫痪了十分钟，全体员工被迫像真正的人类一样当面交流。"], ["I spent four hours debugging a complex line of code only to realize I missed a single tiny semicolon.", "我花了四个小时调试代码，最后发现是漏了一个小小的分号。"], ["Our office printer has a very sensitive personality and only decides to jam when you are truly in a rush.", "我们办公室的打印机性格极其敏感，专挑你真正赶时间的时候卡纸。"], ["My career counselor advised me to always follow my dreams, so I went right back to sleep at my desk.", "职业导师建议我\"永远追随自己的梦想\"，于是我在工位上继续睡了回去。"], ["The best career advice I ever received was to always look busy by holding a very important manila folder.", "我收到过最好的职场忠告：手里拿一个看起来很重要的文件夹，显得很忙。"], ["I asked my mentor how to achieve a perfect work-life balance, and he just laughed for five uninterrupted minutes.", "我问导师如何实现完美的工作生活平衡，他一口气笑了整整五分钟，没有停。"], ["I wanted to branch out into a completely new industry, but my current skill set is strictly limited to clicking refresh.", "我本想转行换个全新赛道，可我目前的技能树仅限于\"点击刷新\"。"], ["I applied for a senior management position that required ten years of experience using a tool invented two years ago.", "我应聘一个高级管理岗，要求十年某工具使用经验——而那工具两年前才被发明出来。"], ["I looked at my retirement savings account today and realized I need to work until the year 3042.", "今天看了眼退休金账户，我意识到自己恐怕得干到公元 3042 年。"], ["I have reached the age where a comfortable desk setup is more attractive than a six-figure salary.", "我到了这样的年纪：一套舒服的工位，比六位数的薪水更有吸引力。"], ["My manager asked me to show more initiative, so I started initiating a lot more nap breaks.", "经理让我\"多展现点主动性\"，于是我开始主动安排更多的小睡。"], ["You should always strive to be the brightest star in your specific cubicle row area.", "人嘛，要力争做自己那一排工位里最亮的星。"], ["The exit doors of the office building are the most beautiful sight in the entire modern world.", "办公楼的出口大门，是整个现代社会最美丽的风景。"], ["Friday is the only day of the week where the office coffee actually tastes like pure sweet victory.", "只有在周五，公司咖啡喝起来才像纯粹的、甜蜜的胜利。"], ["My weekend plans involve doing absolutely nothing and doing it at a highly leisurely pace.", "我的周末计划是：什么都不干，并且以极其从容的节奏去干它。"], ["My productivity level on a typical Friday afternoon is lower than a sleeping garden snail.", "周五下午我的工作效率，比一只睡着的花园蜗牛还低。"], ["The countdown to five o'clock is the only math problem I enjoy solving all week long.", "距离五点还有多久\"，是我一周里唯一乐意演算的数学题。"], ["The office holiday party is the one night of the year where managers pretend to be regular human beings.", "公司年会，是经理们一年一度假装成普通人类的那一晚。"], ["My vacation was so incredibly relaxing that I completely forgot my computer login password.", "我的假期惬意到这种程度：我彻底忘了电脑的登录密码。"], ["I am already planning my next vacation before I have even finished my first morning coffee.", "早晨第一杯咖啡还没喝完，我已经在计划下一次假期了。"], ["I am making a huge commitment to being my most productive self for at least forty-five minutes today.", "今天我郑重承诺：至少保持四十五分钟的高效状态。"], ["The company benefits package includes a gym membership that I only use to get free shampoo.", "公司福利套餐里有健身会员，我的用法是：进去拿免费洗发水。"], ["I spent my entire bonus check on a high-end ergonomic chair that still can't fix my terrible posture.", "我把整笔年终奖花在一把高端人体工学椅上，它依然治不好我的糟糕坐姿。"], ["The best part of my morning routine is pretending that I am going to accomplish every single task on my list.", "我早晨例行流程的高光时刻，就是假装今天会完成清单上的每一项任务。"]];window.__KEY__="职场幽默笑话打工人篇（网络精选中英对照）";window.__TITLE__="职场幽默笑话·打工人篇（网络精选 中英对照）";
var KEY=window.__KEY__;
var TITLE=window.__TITLE__||'';
var PROG_KEY='cp_progress_v1',FAV_KEY='cp_fav_v1',WRONG_KEY='cp_wrong_v1';
var BOX_DAYS=[1,2,4,7,15,30];  /* 间隔复习天数阶梯 */
function loadState(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(PROG_KEY,JSON.stringify(s))}catch(e){}}
function loadArr(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function saveArr(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function getRec(){return loadState()[KEY]||{}}
function putRec(r){var s=loadState();s[KEY]=r;saveState(s)}
function arrIdx(a,en){for(var i=0;i<a.length;i++){if(a[i].en===en)return i}return -1}
function isFav(en){return arrIdx(loadArr(FAV_KEY),en)>=0}
function toggleFav(en,zh){
  var a=loadArr(FAV_KEY);var i=arrIdx(a,en);
  if(i>=0){a.splice(i,1);saveArr(FAV_KEY,a);return false}
  a.push({en:en,zh:zh,key:KEY,title:TITLE,t:Date.now()});saveArr(FAV_KEY,a);return true}
function recordWrong(en,zh){
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i>=0){a[i].n=(a[i].n||1)+1;a[i].box=0;a[i].due=Date.now()+864e5;a[i].zh=zh}
  else{a.push({en:en,zh:zh,key:KEY,title:TITLE,n:1,box:0,due:Date.now()+864e5})}
  saveArr(WRONG_KEY,a)}
function advanceGood(en){
  /* 复习答对：间隔升档；升到顶则从错题集毕业 */
  var a=loadArr(WRONG_KEY);var i=arrIdx(a,en);
  if(i<0)return false;
  a[i].box=(a[i].box||0)+1;
  if(a[i].box>=BOX_DAYS.length){a.splice(i,1);saveArr(WRONG_KEY,a);return true}
  a[i].due=Date.now()+BOX_DAYS[a[i].box]*864e5;saveArr(WRONG_KEY,a);return false}
var STS={none:['未学','st'],learning:['学习中','st st-learning'],done:['已掌握','st st-done']};
var ORDER=['none','learning','done'];
function cyclePageStatus(){
  var r=getRec();r.status=ORDER[(ORDER.indexOf(r.status||'none')+1)%3];putRec(r);applyPageSt()}
function togglePageArchive(){
  var r=getRec();r.archived=!r.archived;putRec(r);applyPageSt()}
function applyPageSt(){
  var r=getRec(),st=r.status||'none';
  var el=document.getElementById('stBtn');
  if(el){el.textContent=STS[st][0];el.className=STS[st][1];}
  var ab=document.getElementById('archBtn');
  if(ab){ab.textContent=r.archived?'已归档 · 点击恢复':'归档';
    ab.classList.toggle('on',!!r.archived);}}
applyPageSt();

(function(){try{
  var d=getRec().dict;
  if(d&&d.rounds){document.getElementById('hist').innerHTML=
    '📊 练习记录：已练 <b>'+d.rounds+'</b> 轮 · 累计默写 <b>'+(d.good+d.near+d.wrong)+
    '</b> 句 · 历史最好成绩 <b>'+d.best+'%</b>'}
}catch(e){}})();

var PAIRS=window.__PAIRS__;
var seq=[],pos=0,stats={good:0,near:0,wrong:0},wrongList=[],lastGood=false;
function $(id){return document.getElementById(id)}
function show(id){['start','quiz','result'].forEach(function(s){$(s).style.display=(s===id)?'':'none'})}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  if(!m)return n;if(!n)return m;
  for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n]}
function start(){
  var n=PAIRS.length;
  var range=$('range').value, shuffle=$('shuffle').checked;
  var take=(range==='all')?n:Math.min(parseInt(range),n);
  seq=PAIRS.slice(0,take).map(function(p,i){return i});
  if(shuffle){seq.sort(function(){return Math.random()-0.5})}
  pos=0;stats={good:0,near:0,wrong:0};wrongList=[];show('quiz');render()}
function render(){
  var done=stats.good+stats.near+stats.wrong;
  $('bar').style.width=(done/seq.length*100)+'%';
  $('num').textContent=(done)+' / '+seq.length;
  $('zh').textContent=PAIRS[seq[pos]][1];
  $('input').value='';$('input').className='dict-input';$('input').focus();
  $('fb').className='dict-fb';$('fb').innerHTML='';
  $('btnNext').style.display='none';$('btnCheck').style.display='';
  lastGood=false;
  var f=isFav(PAIRS[seq[pos]][0]);
  $('btnFav').textContent=f?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',f)}
function favToggle(){
  var p=PAIRS[seq[pos]];
  var added=toggleFav(p[0],p[1]);
  $('btnFav').textContent=added?'★ 已收藏':'☆ 收藏';
  $('btnFav').classList.toggle('on',added)}
function check(){
  var inp=$('input');
  var mine=norm(inp.value),ans=norm(PAIRS[seq[pos]][0]);
  var fb=$('fb');
  if(!mine){fb.className='dict-fb show wrong';
    fb.innerHTML='先写点什么吧～ 提示：共 '+PAIRS[seq[pos]][0].split(/\s+/).length+' 个单词';return}
  if(mine===ans){
    stats.good++;lastGood=true;
    fb.className='dict-fb show good';fb.innerHTML='✔ 完全正确！';
    inp.className='dict-input ok';after()}
  else{
    var sim=1-lev(mine,ans)/Math.max(mine.length,ans.length);
    if(sim>=0.9){
      stats.near++;lastGood=false;
      fb.className='dict-fb show near';
      fb.innerHTML='△ 非常接近，注意细节！<b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()
    }else{
      stats.wrong++;lastGood=false;
      wrongList.push(seq[pos]);
      recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1]);
      fb.className='dict-fb show wrong';
      fb.innerHTML='✘ 再想想～ <b class="ans">正确答案：'+esc(PAIRS[seq[pos]][0])+'</b>';
      inp.className='dict-input bad';after()}
  }}
function after(){
  $('btnCheck').style.display='none';
  $('btnNext').style.display='';
  $('btnNext').focus()}
function next(){
  pos++;
  if(pos>=seq.length){result()}else{render()}}
function hint(){
  var words=PAIRS[seq[pos]][0].split(/\s+/);
  var h=words.map(function(w){return w.charAt(0)+w.slice(1).replace(/[A-Za-z]/g,'·')}).join(' ');
  var fb=$('fb');fb.className='dict-fb show near';
  fb.innerHTML='💡 提示（共 '+words.length+' 词）：'+esc(h)}
function reveal(){
  var fb=$('fb');fb.className='dict-fb show wrong';
  fb.innerHTML='正确答案：<b class="ans">'+esc(PAIRS[seq[pos]][0])+'</b>';
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  $('btnCheck').style.display='none';$('btnNext').style.display='';$('btnNext').focus()}
function skip(){
  if(!lastGood){stats.wrong++;wrongList.push(seq[pos]);lastGood=true;
    recordWrong(PAIRS[seq[pos]][0],PAIRS[seq[pos]][1])}
  next()}
function result(){
  show('result');
  var total=stats.good+stats.near+stats.wrong;
  $('sg').textContent=stats.good;$('sn').textContent=stats.near;$('sw').textContent=stats.wrong;
  var acc=total?Math.round((stats.good+stats.near*0.5)/total*100):0;
  $('sa').textContent=acc+'%';
  try{
    var r=getRec();var d=r.dict||{rounds:0,good:0,near:0,wrong:0,best:0};
    d.rounds++;d.good+=stats.good;d.near+=stats.near;d.wrong+=stats.wrong;
    d.best=Math.max(d.best,acc);r.dict=d;putRec(r)
  }catch(e){}
  var wl=$('wronglist');
  if(wrongList.length){
    wl.style.display='';
    wl.innerHTML='<h3>✘ 错题回顾（'+wrongList.length+' 句）</h3>'+wrongList.map(function(i){
      return '<div class="wp"><span>'+esc(PAIRS[i][1])+'</span><i>'+esc(PAIRS[i][0])+'</i></div>'
    }).join('')
  }else{wl.style.display='none'}
  window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',function(e){
  if($('quiz').style.display==='none')return;
  if(e.key==='Enter'){
    e.preventDefault();
    if($('btnCheck').style.display!=='none'){check()}
    else{next()}}});
</script>
</body>
</html>
